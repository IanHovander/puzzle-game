    body[data-chapter="ch1"] .seat { font-size: 11px; }
    body[data-chapter="ch1"] .table-area { margin-top: 26px; width: min(380px, 50vh); height: min(380px, 50vh); }
    @media (max-height: 820px) { body[data-chapter="ch1"] .table-area { margin-top: 8px; width: min(276px, 39vh); height: min(276px, 39vh); } }
    /* A second step, for a laptop in a window. Measured at 1152x648 before it: the seats panel ran
       64px past the fold and 'Call the vote' was the half of it the room could not see (scan-fit, and
       scratchpad/ch012/probe.js element by element: note 120 + table 253 + status 20 + row 46 = 552
       against a 512px box). The nine seats are laid out in percentages, so the table shrinks whole. */
    @media (max-height: 700px) {
      body[data-chapter="ch1"] .table-area { margin-top: 4px; width: min(214px, 33vh); height: min(214px, 33vh); }
      body[data-chapter="ch1"] .seats-pz .pz-note { font-size: 14px; line-height: 1.34; }
      body[data-chapter="ch1"] .seat { width: 54px; height: 54px; font-size: 10px; }
      body[data-chapter="ch1"] .seat-banner svg { width: 18px; height: 18px; }
    }
  ` }));

  /* ---------- the nine seats ----------
     The Hearth prints banners and numbers only. Who is pledged (Reader), who is still talking (Listener),
     who cannot be moved by anybody (Seer) and who is sworn to whom (Binder) live on four separate phones —
     one fact each, and no phone holds another's. Verified: only {sorrel, oriel} reaches five, and every
     subset of three roles either stalls or calls a wrong pair. */
  const SEATS = [
    { id: 'sorrel', n: 1 }, { id: 'quill', n: 2 }, { id: 'brack', n: 3 }, { id: 'hallan', n: 4 }, { id: 'vey', n: 5 },
    { id: 'orrin', n: 6 }, { id: 'oriel', n: 7 }, { id: 'tarn', n: 8 }, { id: 'marrow', n: 9 },
  ];
  const PLEDGED = ['marrow', 'brack'];                    // Reader: filed in writing before the doors shut
  const DEAF = ['hallan'];                                // Listener: hears nobody but his cousin
  const BLOCKED = ['orrin'];                              // Seer: a soldier of the Envoy stands behind that chair
  const BOUGHT = ['vey', 'tarn'];                         // Seer: Crown coin, cushion and sleeve
  const FOLLOWS = { quill: 'sorrel', hallan: 'orrin' };   // Binder: the two sworn threads
  /* The budget, in one place. Everything that says "two" says it from here — the widget's cap, the
     Chair's rule card and hint 2 — because the number is the puzzle. Brute-forced over the live
     tally() (scratchpad/ch012/ch1-asks.js): of the 28 askable pairs exactly ONE reaches five keeps,
     {sorrel, oriel}; at a cap of 3 there are 6 winning triples out of 56, and a table with no Binder
     can simply ask all three Masters it can reach ({sorrel, quill, oriel}) and win with certainty,
     which is the Binder's whole seat in this chapter. tools/scripts/ch1.json asserts the cap on the
     board, because nothing else in the suite can see it. */
  const ASKS = 2, ASKS_WORD = ['no', 'one', 'two', 'three', 'four'][ASKS];
  function tally(selected) {
    const asked = (id) => selected.includes(id) && id !== 'marrow' && !DEAF.includes(id) && !BLOCKED.includes(id) && !BOUGHT.includes(id);
    const v = {};
    SEATS.forEach(s => { if (!FOLLOWS[s.id]) v[s.id] = (asked(s.id) || PLEDGED.includes(s.id)) ? 'KEEP' : 'SEND'; });
    SEATS.forEach(s => { if (FOLLOWS[s.id]) v[s.id] = asked(s.id) ? 'KEEP' : v[FOLLOWS[s.id]]; });
    const keep = SEATS.filter(s => v[s.id] === 'KEEP').map(s => s.n), send = SEATS.filter(s => v[s.id] === 'SEND').map(s => s.n);
    return { votes: v, keep, send, ok: keep.length >= 5 };
  }
  /* What the hall gives back. Each one teaches the rule that stopped it. */
  const REASONS = {
    sorrel: 'Seat 1 hears you out and nods once: "Since you asked me to my face." Seat 2, unasked, sees that hand go up and puts one up too.',
    quill: 'Seat 2 says yes, then says the rest. "I vote as Seat 1 votes. You spent that on nothing."',
    brack: 'Seat 3 stands with the Chair, in writing, since before the doors shut. You had him already.',
    hallan: 'Seat 4 does not turn his head. "I vote as my cousin votes. I hear nobody else."',
    vey: 'Something at Seat 5\'s cuff catches the light. Seat 5 votes SEND.',
    orrin: 'A soldier in the Envoy\'s grey steps between you and Seat 6. You never get near.',
    oriel: 'Seat 7 listens a long time, asks two questions, does not smile. "Very well. Tonight — keep."',
    tarn: 'Seat 8 smiles with every tooth. Crown coin in it. Seat 8 votes SEND.',
    marrow: 'The Chair does not hear cases. The Chair counts them.',
  };
  function seatCfg() {
    return ART.HOUSES.map((h, i) => ({
      id: SEATS[i].id, n: h.n, label: h.house === 'the Chair' ? 'the Chair' : h.house, banner: ART.banner(h, 26),
      locked: SEATS[i].id === 'marrow', lockedText: 'The Chair does not hear cases. The Chair counts them.',
    }));
  }
  const listSeats = (arr) => arr.length ? 'Seat' + (arr.length > 1 ? 's ' : ' ') + UI.list(arr.map(String)) : 'nobody';

  Game.addChapter({
    id: 'ch1', label: 'Chapter I', title: 'The Vigil', start: 'ch1_start', code: L.chapter('ch1').word,
    mood: 'court', fx: 'embers', art: 'ch1_hall', flame: 0.95,
    flow: {
      nodes: [
        { id: 'ch1_start', label: 'The Great Hall', col: 0, row: 2 },
        { id: 'ch1_vane', label: 'The Envoy and the writ', col: 1, row: 2 },
        { id: 'ch1_vote', label: 'The hour before the bell', col: 2, row: 2, kind: 'choice' },
        { id: 'ch1_prices', label: 'Five keep. Two prices', col: 3, row: 1, kind: 'choice' },
        { id: 'ch1_lost', label: 'Four keep. Wren under guard', col: 3, row: 3, secret: true },
        { id: 'ch1_p_sorrel', label: 'Sorrel: the Ember to the nine', col: 4, row: 0, secret: true, when: (s) => !!s.flags.SORREL },
        { id: 'ch1_p_oriel', label: 'Oriel: tell her everything', col: 4, row: 1, secret: true, when: (s) => !!s.flags.ORIEL },
        { id: 'ch1_p_neither', label: 'Neither. You owe only the Provost', col: 4, row: 2, secret: true, when: (s) => !!s.flags.NEITHER && !s.flags.VOTE_LOST },
        { id: 'ch1_offer', label: 'The Envoy\'s offer', col: 5, row: 2, kind: 'choice' },
        { id: 'ch1_v_refuse', label: 'Refused him', col: 6, row: 1, secret: true, when: (s) => Store.chose('VANE_OFFER', 'refuse') },
        { id: 'ch1_v_pretend', label: 'Pretended to accept', col: 6, row: 2, secret: true, when: (s) => !!s.flags.VANE_PRETEND },
        { id: 'ch1_v_accept', label: 'Accepted', col: 6, row: 3, secret: true, when: (s) => !!s.flags.VANE_ACCEPT },
        { id: 'ch2_start', label: 'The Ember Vault', col: 7, row: 2, secret: true },
      ],
      edges: [
        ['ch1_start', 'ch1_vane'], ['ch1_vane', 'ch1_vote'], ['ch1_vote', 'ch1_prices'], ['ch1_vote', 'ch1_lost'],
        ['ch1_prices', 'ch1_p_sorrel'], ['ch1_prices', 'ch1_p_oriel'], ['ch1_prices', 'ch1_p_neither'],
        ['ch1_p_sorrel', 'ch1_offer'], ['ch1_p_oriel', 'ch1_offer'], ['ch1_p_neither', 'ch1_offer'], ['ch1_lost', 'ch1_offer'],
        ['ch1_offer', 'ch1_v_refuse'], ['ch1_offer', 'ch1_v_pretend'], ['ch1_offer', 'ch1_v_accept'],
        ['ch1_v_refuse', 'ch2_start'], ['ch1_v_pretend', 'ch2_start'], ['ch1_v_accept', 'ch2_start'],
      ],
    },
    scenes: {
      /* ---------- the Great Hall ---------- */
      ch1_start: {
        art: 'ch1_hall', mood: 'court', fx: 'embers', sfx: 'open', title: 'The Great Hall, an hour before the bell',
        enter: (s) => { if (s.flags.WREN_TRUST == null) Store.set('WREN_TRUST', 0); },
        text: [
          'Nine banners in the rafters, one for each House. Under each banner a chair, and in each chair a Master.',
          'Tonight is the Vigil: the night the Houses come to look at the child the fire left.',
          'At the far end the Hearth is breathing — up, down, up. Every grown-up here is pretending not to watch it.',
          'You are at the back. Wren waves at you. Wren is not supposed to wave.',
          { text: 'The Binder has the keys tonight. The Listener reads the Hearth aloud.', cls: 'whisper' },
        ],
        next: 'ch1_dais', button: 'The presenting',
      },
      ch1_dais: {
        art: 'ch1_dais', mood: 'court', fx: 'embers',
        text: [
          { speaker: 'Provost Marrow', text: 'Masters. Fourteen years ago this fire went out for one night. When it came back there was a child on the stones. I named the child.' },
          { speaker: 'Provost Marrow', text: 'The stone over your heads says one born of four. Tonight I stop arguing and show you.' },
          'That is the Provost. She runs this school, and she is the nearest thing Wren has to a mother.',
          'Wren goes up alone and stands still, which for Wren is enormous.',
          { speaker: 'Wren', text: 'Hello. It\'s me. I\'ll try not to fidget.' },
        ],
        next: 'ch1_vane', button: 'The doors',
      },
      ch1_vane: {
        art: 'ch1_vane', mood: 'dread', fx: 'dust', sfx: 'boom',
        text: [
          'The doors open before anyone asks them to. Cold first, then soldiers, then a grey coat.',

        ],
        next: 'ch1_flicker', button: 'The Provost answers',
      },
      ch1_flicker: {
        art: 'ch1_hall', mood: 'tense', fx: 'embers', flame: 0.7,
        text: [
          { speaker: 'Provost Marrow', text: 'This school does not hand its children to a writ. It hands them to a vote. Does the child stay tonight? Nine seats. Five keeps.' },
          'Then the Hearth flickers: a long, low bow of the flame. Every face turns to the fire.',
          'Every face but one. The Provost is looking at Wren. Then she turns to the back of the hall and speaks only to you.',
          { speaker: 'Provost Marrow', text: 'The bell is in an hour. Until then, a Master may be spoken to. Go.' },
          { text: 'Above the Masters\' door, a word is cut into the lintel.', cls: 'whisper' },

        next: 'ch1_attune', button: 'Look at the lintel',
      },
      ch1_attune: {
        type: 'code', art: 'ch1_hall', mood: 'tense', fx: 'embers',
        text: [
          { text: 'Open the Companion. Take your seat. Type the word on the lintel.', cls: 'whisper' },
          { text: 'Read your page. Say nothing yet.', cls: 'whisper' },
        ],
        roles: 'Warden (keyboard): **the Binder**. Voice (reads aloud): **the Listener**.', sightSeconds: 90,
        next: 'ch1_vote',
      },
      /* ---------- the hour before the bell ---------- */
      ch1_vote: {
        type: 'puzzle', puzzle: 'seats', puzzleId: 'ch1_vote', art: 'ch1_hall', mood: 'tense', fx: 'embers', flame: 0.8, par: [3, 4.5, 6],
        text: [
          { text: 'Numbers, not names — say your one thing first.', cls: 'whisper' },

          { text: 'Then ask ' + ASKS_WORD + '. The vote is called once.', cls: 'whisper' },
        ],
        config: () => {
          /* The bell is narrative (design §5 Ch1): at 6:00 the Provost stalls the count and the last hint tier fires.

          let stall = false;
          const STALL = 'The bell. The Provost rises and does not call the vote: "The Chair has not finished hearing the Masters." She is stalling for you.';
          return {
            title: 'THE HOUR BEFORE THE BELL', center: 'the Hearth', startAngle: 20, max: ASKS, timer: 360, submitText: 'Call the vote',
            note: 'The Chair reads out the rule: *Five of nine keeps the child. You may ask **' + ASKS_WORD + '** Masters. A Master you ask votes **KEEP** — unless they will not hear you, you cannot reach them, or the Crown has paid them. A Master sworn to another votes as that Master does, unless you ask them yourself. Everyone else votes **SEND**.*',

            : 'Bring the boy to me before dawn.' },

        text: (s) => {

            out.push('Wren sits on the step between two soldiers, in a way that makes the soldiers look like furniture.');

<script>/* js/content/ch2.js */
/* Chapter II — The Ember Vault (Seer drives, Reader is the Voice) */
(function () {
  'use strict';
  const G = window.VigilGlyphs, UI = window.VigilUI, Store = window.VigilStore;
  const glyphPalette = () => G.names.map(n => ({ id: n, svg: G.inner(n), label: n }));

  try { (document.head || document.body).appendChild(Object.assign(document.createElement('style'), { textContent: `

  ` })); } catch (e) { /* headless shim */ }

  /* ---------- the door in the antechamber ----------
     One number set, 1..4, for plinths, dials and the old holes alike. The Hearth shows four worn plinths,
     four dials and a lintel; it shows no shape and no map. Four facts, one to a phone:

       WORDS    the word cut into each plinth                                    Reader
       CUTFOR   the hole under the older floor each plinth was cut to stand in   Seer
       CONTOUR  the steps the door hums from one word to the next                Listener
       Law 3    a drill is not a Law, and where two Laws disagree the older binds   Binder

     THREE ways to count this door, and the Hearth prints all three, because a fork of two on a
     commit-once puzzle is a coin: the dial a plinth stands over (Law 9, Order's, 212), the dial it was
     cut for (Law 13, Founders', Year 0) and the drill the school has taught since that floor was laid —
     one, two, three, four, in the order the door hums. Dating them is the Binder's whole seat.

     Brute-forced over every believable committed count — an ordered four turns, four different dials,
     four different words from the palette of eight, 4! x 8P4 = 40,320 — by
     scratchpad/ch012/ch2-field.js, which first reproduced this comment's previous table exactly
     (1 / 72 / 24 / 23 / 2, pairs 48 / 24 / 552 / 72 / 72 / 576 / 72). A subset's candidates are the
     counts consistent with the pages it holds:
       all four ......... 1      drop the Reader .. 72     drop the Listener . 24
       drop the Seer .... 22     drop the Binder ... 3
       Reader+Seer 70 · Reader+Listener 24 · Seer+Listener 72 · Listener+Binder 72 · Reader+Binder 552 ·
       Reader alone 576 · Listener alone 72 · Seer or Binder alone 40,320.
     (The old note said 98,304 for those last two: 4! x 8^4, which counts counts that repeat a word.
     Four plinths carry four different words and the room can see that, so the honest space is 8P4.)

     Two things those numbers used to hide.
     (a) The Binder's fork was two counts against one commit — a coin, on the chapter's only puzzle.
         The drill is the third, and it is the one the room's own schooling proposes, so a Binder-less
         table now guesses at 1 in 3 and knows it is guessing.
     (b) CUTFOR was [2, 3, 4, 1] — FLOOR turned by exactly one sunwise. A uniform sunwise offset is the
         only kind of offset this game ever shows a table (companion/ch0.js:134 teaches the word out
         loud and ring.js draws the arrow on every ring), so a Seer-less table looking for structure
         had four candidates, three once the Binder ruled out the floor, and the shipped answer was the
         one the Prologue drilled: a recorded 1-in-23 that was really 1-in-3. CUTFOR is now [3, 4, 2, 1]
         — not a rotation of [1, 2, 3, 4], not its own inverse, and still a derangement, so no member of
         the guessable family is the answer and the Seer has to be heard.
         THE COUNT THE DOOR ACCEPTS DID NOT MOVE. The word -> hole map is frozen (EMBER 2, THORN 3,
         VEIL 4, KNOT 1); WORDS was permuted with CUTFOR, so which word is cut on which plinth changed
         and the committed answer did not. Every script that opened this door still opens it.
         Hand-off: js/content/companion/book.js:78 hard-copies the old plinth order into the Reader's
         permanent Book and is not a file this pass may edit. It must become
         'plinth 1 — THORN · plinth 2 — VEIL · plinth 3 — EMBER · plinth 4 — KNOT (from the vault door)'.
     G.orderingsMatching(WORDS, CONTOUR) returns exactly one ordering, so the answer is unique.
     The door counts ONCE, so none of those subsets can search. */
  const WORDS = ['THORN', 'VEIL', 'EMBER', 'KNOT'];        // Reader   — plinth 1..4
  const CUTFOR = [3, 4, 2, 1];                             // Seer     — plinth 1..4 -> the hole it was cut for
  const CONTOUR = [1, 3, -2];                              // Listener — up one, up three, down two
  const FLOOR = [1, 2, 3, 4];                              // public   — the dial each plinth stands over
  const ORDER = G.orderingsMatching(WORDS, CONTOUR)[0];    // THORN, KNOT, VEIL, EMBER
  /* dial 3 -> THORN, dial 1 -> KNOT, dial 4 -> VEIL, dial 2 -> EMBER */
  const ANSWER = ORDER.map(g => ({ dial: String(CUTFOR[WORDS.indexOf(g)]), glyph: g }));
  /* public — the drill: the four words on dials 1..4, in the order the door hums */
  const DRILL = ORDER.map((g, i) => ({ dial: String(i + 1), glyph: g }));

  /* A count, judged. Pure: hand it the turns and nothing else. */
  function judge(turns) {
    const gs = turns.map(t => t.glyph), ds = turns.map(t => t.dial);
    if (turns.length !== 4) return { form: 'short', n: turns.length };
    if (new Set(ds).size !== 4) return { form: 'twice' };
    const strange = gs.filter(g => WORDS.indexOf(g) < 0).length;
    const at = (map) => (g) => String(map[WORDS.indexOf(g)]);
    const onHoles = !strange && gs.every((g, i) => ds[i] === at(CUTFOR)(g));
    const onFloor = !strange && gs.every((g, i) => ds[i] === at(FLOOR)(g));
    const onDrill = !strange && turns.every((t, i) => t.dial === DRILL[i].dial);
    const ordered = gs.join() === ORDER.join();
    const ok = turns.every((t, i) => t.dial === ANSWER[i].dial && t.glyph === ANSWER[i].glyph);
    return { form: 'count', strange, onHoles, onFloor, onDrill, ordered, ok };
  }

  /* What the door gives back. Each line names the clause that stopped it. Free lines cost nothing. */
  const DOOR = {
    none: 'No turns yet. A count is four, one word to each dial, and it is called once.',
    short: 'The door hears what you have given it, and lets it go. A count is four, one word to each dial.',
    twice: 'Two of those turns are the same dial. One word to a dial, and there are four dials.',
    floor: 'Every word went to the dial its own plinth stands over. That is the newer rule. The lintel was cut before this floor was laid.',
    drill: 'One, two, three, four, the way the school drills it. The school has drilled it since the floor was laid, and a drill is not a Law.',
    order: 'The right words on the right dials, and the door heard them in an order it has never hummed.',
    dialmap: 'The four right words, and at least one of them on a dial no plinth was ever cut to face.',
    one: 'One of those words is cut into no plinth in this room.',
    some: 'Some of those words are cut into no plinth in this room.',
    other: 'Four turns, and not one of them was what the door was waiting for.',
  };
  function receipt(spent, why) {
    try { const el = document.getElementById('ch2-count'); if (el) el.innerHTML = UI.rich((spent ? '**The count has been called.** ' : '**Nothing spent.** ') + why); } catch (e) { /* headless */ }
    return why;
  }

  /* The niche strip, left to right: Spike-inverted, Crown-inverted, Hook-inverted. No mark on the Hearth.
     From the left it reads WELL, EMBER, VEIL; from its mark at the right, KNOT, CROWN, THORN.
     (This used to say ch7 quotes the second reading verbatim and must not be changed. It does not:
     grep for KNOT, CROWN, THORN outside this file returns docs/DESIGN.md:139 and nothing else. The
     array is ch2's own, and the sentence it reads is the one ch2_strip prints eight lines below.) */
  const STRIP = [{ shape: 'Spike', inv: true }, { shape: 'Crown', inv: true }, { shape: 'Hook', inv: true }];

  /* A sheet in an alphabet nobody at the table has learned: unreadable on purpose. Deterministic scribble. */
  function oldSheet() {
    const chars = 'ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ';
    let seed = 41; const r = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    const words = []; for (let i = 0; i < 24; i++) { let w = ''; const n = 2 + Math.floor(r() * 6); for (let k = 0; k < n; k++) w += chars[Math.floor(r() * chars.length)]; words.push(w); }
    return `<div class="ch2-sheet"><span>${words.join(' ')}</span><span class="sig">— ᛗᛖᚱᛖ</span></div>`;
  }

  Game.addChapter({
    id: 'ch2', label: 'Chapter II', title: 'The Ember Vault', start: 'ch2_start', code: 'KNOT',
    mood: 'wonder', fx: 'dust', art: 'ch2_antechamber', flame: 0.8,
    flow: {
      nodes: [
        { id: 'ch2_start', label: "The Provost's errand", col: 0, row: 1 },
        { id: 'ch2_door', label: 'The door that counts once', col: 1, row: 1, kind: 'choice' },
        { id: 'ch2_counted', label: 'It counted you', col: 2, row: 0, secret: true, when: () => Store.chose('CH2_DOOR', 'counted') },
        { id: 'ch2_crawled', label: 'It stopped counting. You crawled in', col: 2, row: 2, secret: true, when: () => Store.chose('CH2_DOOR', 'crawled') },
        { id: 'ch2_niche_found', label: "Mere's niche, behind the first plinth", col: 3, row: 0, kind: 'choice', secret: true, when: () => Store.chose('CH2_NICHE', 'mere') },
        { id: 'ch2_strip', label: 'Read from its mark: four went through', col: 4, row: 0, secret: true, when: () => Store.chose('CH2_STRIP', 'right') },
        { id: 'ch2_rubbing', label: 'The Reader took a rubbing', col: 4, row: 2, secret: true, when: (s) => !!s.flags.LETTER },
        { id: 'ch2_ember', label: 'The Cold Ember, the bricked arch', col: 3, row: 1 },
        { id: 'ch2_stairfall', label: 'The stair falls', col: 5, row: 1, kind: 'choice' },
        { id: 'ch2_grab_wren', label: 'Caught Wren — the Ember fell', col: 6, row: 0, secret: true, when: () => Store.chose('CH2_STAIR', 'wren') },
        { id: 'ch2_grab_ember', label: 'Caught the Ember — Wren fell', col: 6, row: 2, secret: true, when: () => Store.chose('CH2_STAIR', 'ember') },
        { id: 'ch2_sorrel', label: 'The Convocation took the Ember', col: 7, row: 2, kind: 'end', secret: true, when: (s) => !!s.flags.SORREL && Store.chose('CH2_STAIR', 'ember') },
        { id: 'ch3_start', label: 'The Whispering Gallery', col: 7, row: 1, secret: true },
      ],
      edges: [
        ['ch2_start', 'ch2_door'], ['ch2_door', 'ch2_counted'], ['ch2_door', 'ch2_crawled'],
        ['ch2_counted', 'ch2_niche_found'], ['ch2_crawled', 'ch2_niche_found'],
        ['ch2_niche_found', 'ch2_strip'], ['ch2_niche_found', 'ch2_rubbing'],
        ['ch2_counted', 'ch2_ember'], ['ch2_crawled', 'ch2_ember'], ['ch2_niche_found', 'ch2_ember'],
        ['ch2_ember', 'ch2_stairfall'], ['ch2_stairfall', 'ch2_grab_wren'], ['ch2_stairfall', 'ch2_grab_ember'],
        ['ch2_grab_wren', 'ch3_start'], ['ch2_grab_ember', 'ch3_start'], ['ch2_grab_ember', 'ch2_sorrel'],
      ],
    },
    scenes: {
      /* ---------- the Provost's errand ---------- */
      ch2_start: {
        art: 'ch2_stair', mood: 'court', fx: 'dust', sfx: 'step',
        title: 'The Great Hall, after the bell',
        text: (s) => (s.flags.VOTE_LOST ? [
          'The vote is lost. Vane\'s guard closes around Wren, and the Houses file out without looking at the child they gave away.',
          'Wren, over a soldier\'s shoulder, mouths something at you. It is probably *rude*.',
          { speaker: 'Provost Marrow', text: 'Then bring me the Ember. I will get the child back myself.' },
        ] : [
          'Five to four. Vane bows as if he had won something.',
          'The Hearth flickered twice during the count. The Provost was the only one in the Hall not watching it.',
          { speaker: 'Provost Marrow', text: 'Wren stays with me tonight. You four have an errand.' },
        ]).concat([
          { speaker: 'Provost Marrow', text: 'Under this school the Founders left the Cold Ember. If the Hearth goes out, the Ember lights it again. Bring it up.' },
          { speaker: 'Provost Marrow', text: 'And take the Seer\'s eyes with you. That vault was rebuilt once, and the rebuilding was not honest.' },
        ]).concat(s.flags.VOTE_LOST ? [] : [{ speaker: 'Wren', text: 'I\'ll stay put. Look at me staying put.' }]),
        next: 'ch2_descent', button: 'Down',
      },
      ch2_descent: {

      },
      ch2_antechamber: {
        art: 'ch2_antechamber', mood: 'wonder', fx: 'dust', sfx: 'open',
        title: 'The bottom of the stair',
        text: [
          'The four Founders stand in a row, hooded, one on each plinth. On each plinth, one shape cut into the stone and worn nearly smooth.',

      },
      ch2_attune: {
        type: 'code', art: 'ch2_antechamber', mood: 'wonder', fx: 'dust',
        text: [

          { text: 'Open the Companion. Take your seat. Type both.', cls: 'whisper' },

      ch2_door: {

          /* Generated, never written out twice: ch4's oath is what a hand-copied last rung costs on a
             puzzle that commits once. tools/check-hints.js puts this string back through check(). */
          'Dial ' + ANSWER.map(a => a.dial + ' to ' + a.glyph).join('. Then dial ') + '. Then press *Try the door*.',

        options: [
          { id: 'ember', text: 'Take it and go.', next: 'ch2_ember' },

            : 'Across the gap, holding the case in both arms and extremely pleased with itself, is a child who promised to stay put.',
          { speaker: 'Wren', text: 'You *left* without me. Also you dropped this. Also the stairs are going. Also —' },

        type: 'flow', art: 'ch2_stair', mood: 'hearth', fx: 'dust',
        text: (s) => [
          Store.chose('CH2_DOOR', 'crawled') ? 'The door counted once, and you were not what it counted.' : 'The door counted once, and it counted you.',
          s.flags.EMBER_LOST ? 'The Cold Ember is not coming up tonight.' : 'The Cold Ember is on the Provost\'s desk, and the Provost is not looking at it.',
          { text: 'The paths you walked, and the ones you did not.', cls: 'small' },
        ],
        flowTitle: 'Chapter II — the paths you walked',
        stats: (s) => {
          const door = Store.chose('CH2_DOOR', 'crawled') ? 'You went in the way the rebuilders did.' : 'You counted the door open.';
          const niche = Store.chose('CH2_NICHE', 'mere')
            ? (s.flags.LETTER ? 'You found Mere\'s niche and took the rubbing.' : 'You found Mere\'s niche and left the sheet.')
            : 'Something in the antechamber went unlooked-at.';
          const end = (s.flags.WREN_HURT ? 'Wren\'s arm is broken' : 'Wren is unhurt')
            + ', and ' + (s.flags.EMBER_LOST
              ? ((s.flags.SORREL && Store.chose('CH2_STAIR', 'ember')) ? 'the Ember went to the Convocation.' : 'the Ember is at the bottom of the stair.')
              : 'the Ember came up.');

<script>/* js/content/ch3.js */
/* Chapter III — The Whispering Gallery (Listener drives, Binder is the Voice) */
(function () {
  'use strict';
  const G = window.VigilGlyphs, L = window.VigilLore, UI = window.VigilUI, Store = window.VigilStore, S = window.VigilShared;
  const nick = L.nick;
  const glyphPalette = () => G.names.map(n => ({ id: n, svg: G.inner(n), label: n }));

  /* ---------- chapter-local styling, namespaced (ch1.js lines 8-14 are the pattern) ---------- */
  if (document.head) document.head.appendChild(Object.assign(document.createElement('style'), { textContent: `
    /* Where the patrols are is the Listener's and the Seer's. revealPatrols:false stops the widget drawing
       their markers; this hides the HUD line, which grid.js writes with their room ids after every turn. */
    body[data-chapter="ch3"] .grid-pz .react-hud .g-msg { display: none; }
    /* Which rooms the porter is paid for is the Binder's: the widget's small red alarm dots stay off the Hearth. */
    body[data-chapter="ch3"] .grid-pz .grid-board svg circle[r="4"] { display: none; }
    /* grid.js tints every cfg.safe cell green with this exact literal (js/puzzles/grid.js, the cell rect
       fill). The gallery is no secret, but a tinted square teaches the widget's vocabulary for nothing. */
    body[data-chapter="ch3"] .grid-pz .grid-board svg rect[fill="rgba(127,174,94,0.15)"] { fill: rgba(255,255,255,0.05); }
    /* No free restart. grid.js's own ghost button resets the board at no cost, which turns a sighting and
       a wrong word into nothing and lets eight door words be guessed for free. The third bell already
       resets the board (grid.js, on maxTurns), and that reset is written down and costs the table. */
    body[data-chapter="ch3"] .grid-pz > .btn.ghost { display: none; }
    /* Fit: the rule card is 68 words (71 with the hurt clause), so the board gives the height back. */
    body[data-chapter="ch3"] .grid-pz .grid-board svg { max-height: min(34vh, 320px); }
    body[data-chapter="ch3"] .grid-controls .btn { padding: 7px 4px; font-size: 13px; }
    body[data-chapter="ch3"] .ring-pz .wheel { width: min(34vh, 320px); height: min(34vh, 320px); }
    /* The rule card and the status line are prose, not a machine label. */
    body[data-chapter="ch3"] .pz-note { white-space: normal; font-family: var(--serif); font-size: 15px; line-height: 1.45; }
    body[data-chapter="ch3"] .pz-status { font-family: var(--serif); font-size: 15px; letter-spacing: 0; text-transform: none; line-height: 1.4; }
    @media (max-height: 760px) {
      body[data-chapter="ch3"] .grid-pz .grid-board svg { max-height: min(29vh, 260px); }
      body[data-chapter="ch3"] .ring-pz .wheel { width: min(28vh, 280px); height: min(28vh, 280px); }
    }
  ` }));
  /* A hurt-arm door turn that was spotted or rang the bell is cut short on purpose (see doorOpened); keep the console clean. */
  window.addEventListener('unhandledrejection', (e) => { if (e.reason && e.reason.ch3DoorAbort) e.preventDefault(); });

  /* ============================================================================================
     THE CORRIDORS.  The board, the doors, the rounds and the budget are published; who walks where
     and when, what is cut over a door and what a cry costs are on four separate phones.

     The two patrol timetables are BUILT from two arrays that live on two different pages:
        ROUND_x  — the Listener: how far along its own round a patrol is, beat by beat. No rooms.
        WALK_x   — the Seer: which room each of those stops is. No timings.
     Neither array means anything alone, and the Hearth prints neither.

     Search (an independent re-implementation of grid.js's move/detect/bounce loop, run over every legal
     turn sequence; tools/scripts/ch3-grid-check.js re-runs the same assertions against the live config):
       412 safe schedules unhurt, 34 under WREN_HURT. Every one passes through the laundry (B3) and
       leaves it for C3 on beat 7 or 8. Arrivals: unhurt 50 on turn 11, 362 on turn 12; hurt 4 and 30.
     The gallery is the ONLY safe room. B3 is undetectable by construction — no patrol path contains it
     and it has no open edge — so leaving it out of `safe` changes nothing about being caught there, and
     the two counts above are unchanged by it. What it changes is where a sighting throws Wren back to,
     and that is the whole budget. Winning runs counted by sightings, with the bounce modelled:
       safe:['A1']         unhurt 412 / 1 / 0 ...      hurt 34 / 0
       safe:['A1','B3']    unhurt 412 / 132 / 37 / 6   hurt 34 / 1
     With the laundry safe, a table that knew only the two door words and the word 'east' walked in on
     turn 3 and pushed east every turn: seen three times, through on turn 11, first run, no phones.
     THE COSTS, and every one of them in Store.state.flags, so that a Resume, a pasted save code and the
     Menu's "Replay scene" all keep them (ADVERSARIAL 7) and none of them stops charging (ADVERSARIAL 14):
       the bell     CH3_BELLS counts every third bell, not only the first. The budget is twelve turns for
                    the first run and one turn fewer for every bell, floored at eleven — enumerated: of the
                    412 safe unhurt schedules 50 arrive on turn 11, and 4 of the 34 hurt ones, so eleven is
                    where the corridors stop being winnable and the budget stops shrinking. A blind table
                    pays for it: 412 of 3,995 schedules = 10.3% at twelve turns, 50 of 869 = 5.8% at eleven
                    (hurt 34 of 1,257 = 2.7% -> 4 of 282 = 1.4%).
       a sighting   costs 1 + CH3_BELLS turns, so the bell goes on charging after the budget has hit its
                    floor, and the one strategy the turn count cannot see — walk into a patrol on purpose,
                    read the room and the turn off grid.js's own sighting line, ring the bell, walk again —
                    gets dearer every time it is used.
       a seam       SEAM_A3B3 and SEAM_B3C3: the nth wrong word at one seam costs n turns, and the seam
                    remembers across a bell, a re-entry and a reload. The Reader-less costing below is
                    priced on that memory, and it used to live on a door object gridConfig rebuilt on entry.
     THE LADDER IS PART OF THE FIELD, because a hint costs nothing. Rung 1 re-partitions. Rung 2 names no
     room, no beat and no turn (guarded in tools/scripts/ch3-grid-check.js), so the 3,995 blind schedules
     and the 412 safe ones below are exactly what they were before it was taken. Rung 3 is the route, and
     it is the only rung that names a cell. The rung 2 that stood here until this pass gave the round
     length (the Listener's) and the room nobody searches (the Binder's), which between them are the whole
     plan — the only free parameter left is how many beats to sit in the laundry, and measured, that is
     2 winners among 5 in-time exits: 10.3% -> 40% unhurt, and 2 among 3, 2.7% -> 67%, under WREN_HURT.
     Drop-a-role (honest numbers, not claims):
       no Listener — the Seer's map gives rooms but no timing. 3,995 schedules reach E5 inside twelve
                     turns and 412 of them are safe, so a blind pick wins 10.3% of the time, and the
                     only feedback is being seen, which now costs the approach.
       no Seer     — strictly worse than that: the Listener's twelve numbers index nothing, so the same
                     blind 10.3%, and on top of it a coin flip at each seam over which end is scratched.
                     (Where the seams ARE is free — grid.js prompts for the word before it checks the
                     wall, and cancelling costs nothing. What the Seer holds is the mapping and the ends.)
       no Binder   — the porter is the Binder's alone now. The Seer's under-layer draws the rooms, the
                     passages and the two seams, and no longer draws the lodge or its sight-lines, so
                     nothing else on the table says the north corridor is watched. With the cry unknown
                     a table believes 824 schedules are safe and 412 are (hurt: 68 believed, 34 real).
                     Exactly half, and the wrong half is a sighting. A COSTED COIN FLIP.
       no Reader   — eight words per seam, and the nth wrong word at a seam costs n turns. Surviving
                     schedules by wasted turns (west+back): 0+0 412, 1+0 114, 0+1 125, 1+1 34, 1+2 9,
                     2+2 1; hurt 0+0 34, 0+1 9, 1+1 1. The right word sits uniformly among the eight, so
                     a seam costs 0 turns 1 time in 8, 1 turn 1 time in 8, and 3 turns after that:
                     guessing both seams inside two wasted turns succeeds 4 times in 64. (The 115 and the
                     "6 times in 64" recorded here before were a flat one-turn-per-guess model, which is
                     not what mkDoor has ever charged.)
     ============================================================================================ */
  const CELLS = ['A1', 'A2', 'A3', 'A4', 'A5', 'B1', 'C1', 'B3', 'C2', 'C3', 'C4', 'D3', 'B5', 'C5', 'D5', 'E1', 'E2', 'E3', 'E4', 'E5'];
  const EDGES = [['A1', 'B1'], ['B1', 'C1'], ['A1', 'A2'], ['A2', 'A3'], ['A3', 'A4'], ['A4', 'A5'], ['A5', 'B5'], ['B5', 'C5'], ['C5', 'D5'], ['D5', 'E5'], ['E1', 'E2'], ['E2', 'E3'], ['E3', 'E4'], ['E4', 'E5'], ['C5', 'C4'], ['C4', 'C3'], ['C3', 'C2'], ['C3', 'D3'], ['D3', 'E3']];

  const ROUND_A = [3, 4, 5, 6, 7, 6, 5, 4, 3, 2, 1, 2];        // Listener: the lantern, stop by stop
  const ROUND_B = [4, 4, 4, 4, 4, 4, 3, 2, 1, 1, 2, 3];        // Listener: the sentry, stop by stop
  const WALK_A = ['A3', 'A4', 'A5', 'B5', 'C5', 'C4', 'C3'];   // Seer: where the lantern's seven stops are
  const WALK_B = ['E1', 'E2', 'E3', 'E4'];                     // Seer: where the sentry's four stops are
  const PATROL_A = ROUND_A.map(i => WALK_A[i - 1]);            // = A5 B5 C5 C4 C3 C4 C5 B5 A5 A4 A3 A4
  const PATROL_B = ROUND_B.map(i => WALK_B[i - 1]);            // = E4 x6, E3 E2 E1 E1 E2 E3

  const LINTELS = { 'A3|B3': 'Crown', 'B3|C3': 'Spike' };      // Reader: one shape cut over each hidden door
  const SCRATCH = { 'A3|B3': 'left', 'B3|C3': 'right' };       // Seer: which end of each lintel is scratched
  /* Crown scratched left reads CROWN, scratched right reads EMBER. Spike left THORN, right WELL.
     Neither password is printed on the Hearth tonight: VEIL is the attunement word, THORN was ch1's. */
  const WORDS = { 'A3|B3': 'CROWN', 'B3|C3': 'WELL' };
  const BOUGHT_ROOMS = ['B5', 'C5', 'D5', 'C4'];               // Binder: what the porter is paid to watch

  /* Only the start and the goal are named on the board. grid.js writes cfg.labels onto closed cells too,
     so a label on D1 would spell out the row-1 dead end the board already draws; and the laundry is the
     Binder's to name, not the Hearth's. */
  const LABELS = { A1: 'the gallery', E5: 'the tower door' };

  /* Every cost in the corridors, read live out of the save. Nothing here is a module-local `let`: the
     Menu hands "Replay scene" back at any moment, and js/core/engine.js re-evaluates `scene.config` on
     every entry, so a counter held anywhere else is refunded by two clicks. */
  const bells = () => Store.state.flags.CH3_BELLS | 0;
  const turnBudget = () => Math.max(11, 12 - bells());          // floor: no safe schedule arrives sooner
  const sightCost = () => 1 + bells();
  /* The two seams' memories, written out rather than built from the key, so that a grep and
     tools/flag-map.js both see the names. Both are ch3-local: no other chapter reads or writes either. */
  const seamCount = (key) => (key === 'A3|B3' ? Store.state.flags.SEAM_A3B3 : Store.state.flags.SEAM_B3C3) | 0;
  const seamWrong = (key) => { const n = seamCount(key) + 1; if (key === 'A3|B3') Store.set('SEAM_A3B3', n); else Store.set('SEAM_B3C3', n); return n; };
  const NUM = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];
  const num = (n) => NUM[n] || String(n);
  const cap = (w) => w.charAt(0).toUpperCase() + w.slice(1);

  /* A hidden door.  grid.js reads `password` to compare, reads `wrongText` ONLY when the spoken word was
     wrong (one place, in move()), and writes `revealed` the moment a word is accepted, before Wren steps
     through. Both of those buy the chapter a turn on the near side: a wrong word costs a breath, and so
     does shouldering a heavy door with one arm. */
  function mkDoor(key, password, prompt, wrong) {
    const o = { password, prompt, _rev: false };
    Object.defineProperty(o, 'revealed', { enumerable: true, get: () => o._rev, set: (v) => { o._rev = !!v; if (v) doorOpened(); } });
    Object.defineProperty(o, 'wrongText', { enumerable: true, get: () => {
      // grid.js sets the status to bad and then reads this; the deferred turn wipes the status, so write it again.
      // The nth wrong word at this seam costs n turns, and the count is in the save: gridConfig rebuilds
      // these door objects on every scene entry, so an object field was a budget the Menu could refund.
      const turns = seamWrong(key);
      const tail = turns === 1 ? ' A turn goes with it, and the rounds walk on.'
        : ' ' + cap(num(turns)) + ' turns go with it — this seam has heard you guess before.';
      setTimeout(() => { for (let i = 0; i < turns; i++) { const r = spendTurn(wrong + tail); if (!r || r.ended) break; } }, 0);
      return wrong;
    } });
    return o;
  }
  /* Spend one turn on the near side by pressing the widget's own Wait: patrols are checked and the board
     redrawn exactly as for any other turn. Returns the widget's status element if it is still ours to write. */
  function spendTurn(msg) {
    const widget = document.getElementById('widget'); if (!widget) return null;
    const wait = Array.from(widget.querySelectorAll('.grid-controls .btn')).find(b => b.textContent.trim() === 'Wait');
    if (!wait || wait.disabled) return null;
    wait.click();
    const status = widget.querySelector('.grid-pz .pz-status'), turnEl = widget.querySelector('.grid-pz .g-turn');
    const seen = !!(status && /sees Wren/.test(status.textContent));
    const turn = turnEl ? parseInt((turnEl.textContent.match(/\d+/) || ['0'])[0], 10) : 0;
    if (seen || turn >= turnBudget()) return { spent: true, ended: true, status };
    if (msg && status) { status.className = 'pz-status bad'; status.textContent = msg; }
    return { spent: true, ended: false, status };
  }
  function doorOpened() {
    if (!Store.state.flags.WREN_HURT) return;
    // No status line here: this runs inside grid.js's move(), which clears the status a moment later.
    const r = spendTurn(null);
    if (!r) return;
    if (!r.ended) UI.toast('Wren\'s arm. Shouldering a hidden door open one-handed costs a breath, and a turn passes on the near side.', 3200, 'bad');
    if (r.ended) {
      // The breath was spent and Wren never got through: a patrol saw the door being shouldered, or the bell rang.
      // Abort the widget's step itself (it is mid-move, just after accepting the word) so Wren is not carried through.
      const err = new Error('ch3: the door turn ended the move'); err.ch3DoorAbort = true; throw err;
    }
  }

  const gridConfig = (s) => ({
    title: 'THE CORRIDORS — THE GALLERY TO THE TOWER',
    /* Every number on this card is the number in force, not the number it started at: after a bell the
       budget is eleven and a sighting is dearer, and a card that still said twelve would be a promise the
       widget does not keep (R10.4 — a reader holding only the card must be able to compute any position). */
    note: 'The Provost, at the bell-rope: *' + cap(num(turnBudget())) + ' turns. A turn is one room, or a wait. A patrol that ends a turn in Wren\'s room, or one doorway from it, has seen Wren. Wren runs all the way back to the gallery, and '
      + (sightCost() === 1 ? 'a turn goes with it. ' : num(sightCost()) + ' turns go with it. ')
      + (s.flags.WREN_HURT ? 'A hidden door costs a turn: a wrong word, or a one-handed shove. ' : 'A wrong word at a hidden door costs a turn. ')

<script>/* js/content/ch4.js */
/* Chapter IV — The Oath (the Provost's study). Pass-around Warden; the Seer is the Voice. */
(function () {

  /* ---------- chapter-local CSS (all selectors .ch4-) ---------- */

  ` })); } catch (e) { /* headless shim without a document head */ }

  /* ---------- the older alphabet (24 letters; no Q, no X).
     KEEP BYTE-IDENTICAL with the copy in js/content/companion/ch4.js — the Hearth draws the journal
     from this table and only the Companion's primer decodes it. Edit one, edit both. ---------- */
  const OLD_RUNES = {
    A: 'M10,2 L10,26 M10,8 L18,14', B: 'M10,2 L10,26 M10,2 L18,10 L10,18', C: 'M16,4 L4,14 L16,24', D: 'M10,2 L10,26 M2,14 L18,14',
    E: 'M10,2 L10,26 M2,20 L10,14 L18,20', F: 'M10,2 L10,26 M10,6 L18,12 M10,14 L18,20', G: 'M6,2 L14,2 L14,26 L6,26', H: 'M6,2 L6,26 M14,2 L14,26 M6,10 L14,18',
    I: 'M10,2 L10,26', J: 'M10,2 L10,20 L4,26', K: 'M10,2 L10,26 M18,6 L10,14 L18,22', L: 'M10,2 L10,26 M10,26 L18,20',
    M: 'M4,2 L4,26 M16,2 L16,26 M4,2 L16,26', N: 'M4,2 L4,26 M16,2 L16,26 M4,26 L16,2', O: 'M10,4 L18,14 L10,24 L2,14 Z', P: 'M10,2 L10,26 M2,10 L10,2 L18,10',
    R: 'M10,2 L10,26 M2,20 L10,26 L18,20', S: 'M16,4 L6,10 L14,18 L4,24', T: 'M2,6 L18,6 M10,6 L10,26', U: 'M4,2 L10,26 L16,2',
    V: 'M4,4 L16,24 M16,4 L4,24', W: 'M2,4 L10,14 L18,4 M10,14 L10,26', Y: 'M10,2 L10,26 M2,20 L18,8', Z: 'M4,6 L16,6 M4,22 L16,22 M10,6 L10,22',
  };
  /* Render a line of text in the older alphabet. Letters not in the alphabet (Q, X) are drawn as a blank. */
  function runeLine(text, opts) {
    opts = opts || {};
    const cell = 24, h = 34, gap = 12; let x = 8; let s = '';
    for (const ch of String(text).toUpperCase()) {
      if (ch === ' ') { x += gap; continue; }
      if (ch === '.') { s += `<circle cx="${x + 5}" cy="26" r="2" fill="currentColor"/>`; x += 12; continue; }
      const d = OLD_RUNES[ch];
      if (d) s += `<path d="${d}" transform="translate(${x},3)" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
      x += cell;
    }
    const w = x + 8;
    return `<svg viewBox="0 0 ${w} ${h + 6}" class="rune-line" style="height:${opts.height || 44}px;width:auto;max-width:100%;color:${opts.color || 'currentColor'}">${s}</svg>`;
  }
  const runeBlock = (lines, opts) => `<div class="ch4-runes">${lines.map(l => `<div style="text-align:center;margin:4px 0">${runeLine(l, opts)}</div>`).join('')}</div>`;

  /* ---------- helpers ---------- */
  const wren = (normal, scared) => (F().WREN_SCARED ? scared : normal);
  const secretsFound = (f) => ['JOURNAL', 'MEMORY', 'TAPESTRY', 'GREY'].filter(k => f[k]).length;
  const hasMarrowLetter = (f) => !f.ORIEL && !f.SORREL && !f.VANE_ACCEPT;
  /* Left exactly as it was, ORIEL and all: ch5.js:8 computes the identical expression and ch5 is not
     editable here. ORIEL is the ch1 promise rather than ORIEL_NOTE, which looks wrong — but the two
     files must agree, so it is a report item, not an edit. */
  const computeLaw0 = () => { const f = F(); Store.set('LAW0', !!(f.LETTER_READ || f.TAPESTRY || f.ORIEL)); };

  /* ---------- the false shelf ----------
     Six great books. The Hearth prints a place number and a stamp rubbed past reading, and never a shape:
     the shapes are the Reader's, and the shared Book renders every glyph beside its name on the
     Listener's Ladder page, so a shape on a Hearth surface hands the Reader's monopoly away (R10.10).

       as they stand   1 EMBER  2 WELL   3 ASH   4 KNOT  5 CROWN  6 VEIL
       hung the other way up (every book says the opposite, and keeps its place)
                       1 CROWN  2 THORN  3 COLD  4 VEIL  5 EMBER  6 KNOT

     Enumerated over all 6*5*4*3 = 360 ordered four-picks, filtered by the shelf's phrase (up two, up
     two, up one) under each reading a table can hold — exactly one match each:
       upside down, places kept   2,5,4,1  THORN EMBER VEIL CROWN  <- the answer
       as they stand              3,4,2,6  ASH KNOT WELL VEIL      <- decoy, disarmed by the Seer
       upside down, places mirrored 5,2,3,6                        <- decoy, disarmed by the Binder
     The catch gives ONE pull (a pull of fewer than four books is coached and refunded, so
     under-commitment never spends it). So the drop-a-role result is odds on a single commit, exactly
     as ch1's two asks are — re-run pullsFor() below and count:
       all four                   1 candidate  — certain
       drop the Seer              2            — a coin: as they stand, or turned
       drop the Binder            2            — a coin: places kept, or places mirrored
       the Reader and Listener alone
                                  3            — one in three
       drop the Reader            360          — no word for any place, no path
       drop the Listener          360          — no phrase, no path
     The three keyed replies below are receipts, not clues: a pull ends the puzzle, so they are only
     ever read once the board is already lost. That is where ch1 keeps REASONS.
     The phrase is deliberately not the Book's worked example (up one, up three, down two) and the four
     words are deliberately not the set that example names, nor the Founders' plinth set: both are
     printed permanently in the shared Book, and either would hand a Listener-less table the four books. */
  const SPINES = ['EMBER', 'WELL', 'ASH', 'KNOT', 'CROWN', 'VEIL'];  // Reader — place 1..6, as the stamps stand
  const PHRASE = [2, 2, 1];                                          // Listener — up two, up two, up one
  const MARKED_END = 'right';                                        // Seer — which end of the board is marked
  const KEEPS_ITS_PLACE = true;                                      // Binder — a turned board moves no book

  /* What place p says, under a reading. Marked on the left, the board reads as it stands. Marked on the
     right it is turned, so every book says the opposite word — and if the places are kept, place p is
     still place p, while a table without the Binder may mirror them instead. */
  const readPlace = (p, marked, keeps) => marked === 'right'
    ? G.PAIR[SPINES[(keeps ? p : 7 - p) - 1]]
    : SPINES[p - 1];
  /* Every ordered four-pick of six whose ladder steps are PHRASE, under one reading. The answer is not
     written down anywhere: it is this function of the four constants above, so dropping one and
     re-running is a real experiment rather than a claim. */
  function pullsFor(marked, keeps) {
    const step = (w) => (G.GLYPHS[w] && G.GLYPHS[w].step !== null && G.GLYPHS[w].step !== undefined) ? G.GLYPHS[w].step : null;
    const out = [];
    (function walk(seq) {
      if (seq.length === 4) {
        const w = seq.map(p => readPlace(p, marked, keeps));
        if (w.every(x => step(x) !== null) && PHRASE.every((s, i) => step(w[i + 1]) - step(w[i]) === s)) out.push(seq.map(String));
        return;
      }
      for (let p = 1; p <= 6; p++) if (seq.indexOf(p) < 0) walk(seq.concat(p));
    })([]);
    return out;
  }
  const SHELF_ANSWER = pullsFor(MARKED_END, KEEPS_ITS_PLACE)[0];   // 2,5,4,1 — THORN EMBER VEIL CROWN
  const SHELF_STAND = pullsFor('left', true)[0].join(',');         // 3,4,2,6 — read as the stamps stand
  const SHELF_MIRROR = pullsFor('right', false)[0].join(',');      // 5,2,3,6 — turned, but the places mirrored
  /* One worn spine, drawn six times: a book, two gilt bands, and a stamp rubbed past reading. */
  const spineSvg = '<g fill="none" stroke="currentColor" stroke-width="2" opacity=".65">'
    + '<rect x="-11" y="-17" width="22" height="34" rx="2"/><path d="M-8,-12 h16 M-8,12 h16"/>'
    + '<ellipse cx="0" cy="0" rx="6.5" ry="6.5" stroke-dasharray="2 3"/><path d="M-3.5,3 L-1,-3 M1,-2.5 L3.5,2.5" opacity=".7"/></g>';

  /* ---------- the oath ----------
     Four facts, one per role, as four droppable constants. The placement below is computed from them,
     so the check is a function of the partition rather than a written-down answer.

     The Listener hears ONE step, not the contour. A two-step contour on a seven-rung ladder is
     satisfied by three ordered triples whatever the steps are, and two of those three can always be
     closed, so a published contour made the Reader's word set decoration. One step plus the Reader's
     three words is still exactly one order, and one step alone is thirty-two boards.
     The Seer reports TWO cuts, as in the Prologue: which kind of cut starts a sigil is the Binder's
     rule and nothing else on any surface says it, so a Binder-less table faces a real fork instead of
     the one reading everybody guesses. */
  const OATH_WORDS = ['ASH', 'THORN', 'WELL'];   // Reader — the three cut round the ring, as a set
  const OATH_FIRST_STEP = -1;                    // Listener — the first word to the second, down one
  /* Deliberately NOT ch3's pair. js/content/ch3.js declares CUTS = { scratch: 4, notch: 2 }; with the
     same cuts here, a table that solved the Tower threshold already knew where this sigil begins and
     the Seer's seat was free. Scratch at 2 puts the words in 2, 3, 4 and the lock in 1 — a different
     board from ch3's words-in-4,1,2. */
  const OATH_SCRATCH = 2;                        // Seer — a long scratch beside slot 2
  const OATH_NOTCH = 4;                          // Seer — a small notch beside slot 4
  const OATH_LOCKS = ['KNOT', 'EMBER'];          // Binder — the only two the wax will take

  /* The order the Listener's one step puts the Reader's three words in — with these three words there
     is exactly one. Then the Binder's rule starts it at the scratch (never the notch) and runs it
     clockwise, which leaves exactly one slot for the lock. */
  const permute = (a) => a.length <= 1 ? [a] : a.reduce((acc, x, i) => acc.concat(permute(a.slice(0, i).concat(a.slice(i + 1))).map(p => [x].concat(p))), []);

(function () {

  /* ---------- Mere's two gates: one rule, used twice ------------------------------------------

                writes it                                                 Binder

     The word "mark" means what the shared Book (companion/book.js) means by it — the end of the

     a notch, a chip in the glaze.

     js/content/ch3.js), the one ch4's oath was rewritten to escape (ADVERSARIAL 9) — and both gates
     began the count at slot 5. Two

     begin was the same: gate 1's free rung 3, or gate 1 solved, handed a Seer-less table gate 2's

     against a ward that hears three answers, and the digits 3,5,3,4 were worse than that: for three

  /* ================= THE BELLS =================
