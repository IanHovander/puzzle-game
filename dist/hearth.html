<script>/* js/content/glyphs.js */
/* The Founders' Tongue: four shapes, each read two ways by orientation.
   Flame: ASH (upright) / COLD (inverted) · Spike: THORN / WELL · Hook: KNOT / VEIL · Crown: CROWN / EMBER.
   Shapes are drawn in a -20..20 box, deliberately asymmetric top-to-bottom so inversion (rotate 180°) is visible.
   Shared by Hearth and Companion. */
(function () {
  'use strict';
  const G = {};
  const st = 'fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"';
  const SHAPES = {
    Flame: `<path d="M0,-16 C6,-8 10,-2 10,4 C10,11 5,15 0,15 C-5,15 -10,11 -10,4 C-10,-2 -6,-8 0,-16 Z" ${st}/><path d="M0,15 L0,4" ${st}/>`,
    Spike: `<path d="M0,-16 L7,-4 L2,-4 L2,10 L-2,10 L-2,-4 L-7,-4 Z" ${st}/><path d="M-11,15 L11,15" ${st}/>`,
    Hook:  `<path d="M2,15 L2,-8 C2,-14 -5,-15 -8,-10" ${st}/><path d="M-5,15 L9,15" ${st}/>`,
    Crown: `<path d="M-13,12 L-13,-4 L-6,3 L0,-14 L6,3 L13,-4 L13,12 Z" ${st}/>`,
  };
  // glyph name -> {shape, inverted}
  const GLYPHS = {
    ASH:   { shape: 'Flame', inv: false, step: 0, gloss: 'fire; the Hearth; warmth' },
    COLD:  { shape: 'Flame', inv: true,  step: null, gloss: 'the cold; the wound; the space left when warmth goes; a hollow' },
    THORN: { shape: 'Spike', inv: false, step: 1, gloss: 'a gate; to go through' },
    WELL:  { shape: 'Spike', inv: true,  step: 4, gloss: 'down; a going-down; from' },
    KNOT:  { shape: 'Hook',  inv: false, step: 2, gloss: 'bound; together; four-as-one' },
    VEIL:  { shape: 'Hook',  inv: true,  step: 5, gloss: 'hidden; apart; behind' },
    CROWN: { shape: 'Crown', inv: false, step: 6, gloss: 'one; the first; the chosen; the Chair' },
    EMBER: { shape: 'Crown', inv: true,  step: 3, gloss: 'what remains; to keep; to close' },
  };
  const PAIR = { ASH: 'COLD', COLD: 'ASH', THORN: 'WELL', WELL: 'THORN', KNOT: 'VEIL', VEIL: 'KNOT', CROWN: 'EMBER', EMBER: 'CROWN' };
  const ORDER = ['ASH', 'THORN', 'KNOT', 'EMBER', 'WELL', 'VEIL', 'CROWN', 'COLD']; // ladder order (COLD = rest)
  const LADDER = ['ASH', 'THORN', 'KNOT', 'EMBER', 'WELL', 'VEIL', 'CROWN'];
  const MIDI = { ASH: 72, THORN: 74, KNOT: 76, EMBER: 77, WELL: 79, VEIL: 81, CROWN: 83, COLD: null };

  G.SHAPES = SHAPES; G.GLYPHS = GLYPHS; G.PAIR = PAIR; G.ORDER = ORDER; G.LADDER = LADDER; G.MIDI = MIDI;
  G.names = Object.keys(GLYPHS);
  G.invert = (name) => PAIR[name];
  G.shapeOf = (name) => GLYPHS[name].shape;
  /* Read a shape in a given orientation: upright gives the base glyph, inverted gives its pair. */
  G.read = (shape, inverted) => { for (const n in GLYPHS) if (GLYPHS[n].shape === shape && GLYPHS[n].inv === !!inverted) return n; return null; };

  /* Inner SVG fragment for a glyph name (already oriented). Use inside <svg viewBox="-20 -20 40 40">. */
  G.inner = function (name, opts) {
    opts = opts || {};
    const g = GLYPHS[name]; if (!g) return `<text y="6" text-anchor="middle" font-size="12" fill="currentColor">${name}</text>`;
    const rot = (g.inv ? 180 : 0) + (opts.rot || 0);
    return `<g transform="rotate(${rot})">${SHAPES[g.shape]}</g>`;
  };
  /* Inner SVG for a raw shape drawn as carved (physically): upright or physically inverted. */
  G.shapeInner = function (shape, physInverted, opts) { return `<g transform="rotate(${physInverted ? 180 : 0})">${SHAPES[shape]}</g>`; };

  /* Standalone <svg> for a glyph. */
  G.svg = function (name, opts) {
    opts = opts || {};
    const size = opts.size || 40, color = opts.color || 'currentColor';
    return `<svg viewBox="-20 -20 40 40" width="${size}" height="${size}" style="color:${color};display:inline-block;vertical-align:middle;overflow:visible" class="fg-glyph">${G.inner(name, opts)}${opts.worn ? '<rect x="-20" y="-20" width="40" height="40" fill="rgba(11,10,16,0.45)"/>' : ''}</svg>`;
  };
  G.shapeSvg = function (shape, physInverted, opts) {
    opts = opts || {};
    const size = opts.size || 40, color = opts.color || 'currentColor';
    return `<svg viewBox="-20 -20 40 40" width="${size}" height="${size}" style="color:${color};display:inline-block;vertical-align:middle;overflow:visible" class="fg-glyph">${G.shapeInner(shape, physInverted)}</svg>`;
  };

  /* An inscription: a row of carved shapes. Each item {shape, inv:boolean(physically inverted), worn?, hidden?}.
     mark: 'left' | 'right' | null (drawn only if showMark). Returns <svg>. */
  G.inscription = function (items, opts) {
    opts = opts || {};
    const cell = 56, h = 72, w = items.length * cell + 40;
    let s = `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;display:block;margin:0 auto" class="inscription-svg">`;
    s += `<rect x="2" y="2" width="${w - 4}" height="${h - 4}" rx="6" fill="rgba(0,0,0,0.35)" stroke="rgba(212,169,78,0.25)"/>`;
    items.forEach((it, i) => {
      const x = 20 + i * cell + cell / 2, y = h / 2;
      if (it.hidden) { s += `<rect x="${x - 22}" y="${y - 22}" width="44" height="44" fill="#3a3540" rx="3"/><text x="${x}" y="${y + 5}" text-anchor="middle" font-size="10" fill="#8a8090" font-family="Cinzel,serif">SHIELD</text>`; return; }
      s += `<g transform="translate(${x},${y}) scale(1.1)" style="color:${it.color || (opts.color || '#e9e2d2')}" opacity="${it.worn ? 0.5 : 1}">${G.shapeInner(it.shape, it.inv)}</g>`;
      if (it.label) s += `<text x="${x}" y="${h - 6}" text-anchor="middle" font-size="9" fill="rgba(233,226,210,0.5)" font-family="Cinzel,serif">${it.label}</text>`;
    });
    if (opts.showMark && opts.mark) { const mx = opts.mark === 'left' ? 10 : w - 10; s += `<path d="M${mx},${h / 2 - 8} L${mx + (opts.mark === 'left' ? 6 : -6)},${h / 2} L${mx},${h / 2 + 8} Z" fill="${opts.markColor || '#9b7bd8'}"/>`; }
    return s + `</svg>`;
  };

  /* Reading helpers (deterministic): naive reads each shape as physically shown; turned reads right-to-left and inverts every reading. */
  G.readNaive = (items) => items.map(it => G.read(it.shape, it.inv));
  G.readTurned = (items) => items.slice().reverse().map(it => G.invert(G.read(it.shape, it.inv)));
  G.readLine = (items, mark) => mark === 'right' ? G.readTurned(items) : G.readNaive(items);

  /* Steps between consecutive glyphs on the ladder. Returns an array with one entry per glyph after the first:
     a number (the step from the last glyph that sounded), 'rest' (this glyph is COLD, a pause), or 'start'
     (this glyph sounds first — only when the row opens with a rest). A rest is a pause, not a reset: the glyph
     after it is measured from the last one that sounded. */
  G.steps = function (names) {
    const out = []; let last = null;
    for (let i = 0; i < names.length; i++) {
      const g = GLYPHS[names[i]]; const s = g ? g.step : null;
      if (i === 0) { if (s != null) last = s; continue; }
      if (s == null) out.push('rest');
      else if (last == null) { out.push('start'); last = s; }
      else { out.push(s - last); last = s; }
    }
    return out;
  };
  G.stepsText = (names) => G.steps(names).map(s => s === 'rest' ? 'then a rest' : s === 'start' ? 'then it begins' : s === 0 ? 'the same' : (s > 0 ? 'up ' + s : 'down ' + (-s))).join(', ');
  /* Which orderings of a set match a contour? (used to verify uniqueness) */
  G.orderingsMatching = function (set, contour) {
    const res = []; const perm = (arr, m) => { if (!arr.length) { if (JSON.stringify(G.steps(m)) === JSON.stringify(contour)) res.push(m.slice()); return; } arr.forEach((x, i) => perm(arr.slice(0, i).concat(arr.slice(i + 1)), m.concat([x]))); };
    perm(set, []);
    const seen = new Set(); return res.filter(m => { const k = m.join(','); if (seen.has(k)) return false; seen.add(k); return true; });
  };

  window.VigilGlyphs = G;
})();

</script>
<script>/* js/puzzles/wheel.js */
/* Wheel / sequence lock: N slots around a circle, each with a glyph (SVG) and optional label.
   Players click slots to build an ordered sequence, then submit. Deterministic check against cfg.answer.
   cfg: { slots:[{id, svg, label, flip, rot, dim}], answer:[ids] | check(seq)=>bool, maxLen, hub:'text', allowRepeat, orient (deg rotation of whole wheel), marks:[deg], onWrong(seq, tries), maxTries, submitText }
   Resolves { seq, tries } when correct. */
(function () {
  'use strict';
  const UI = window.VigilUI, Audio = window.VigilAudio;

  function build(container, cfg, api) {
    return new Promise((resolve) => {
      const root = UI.el('div', { class: 'pz' });
      if (cfg.title) root.appendChild(UI.el('div', { class: 'pz-title', text: cfg.title }));
      if (cfg.note) root.appendChild(UI.el('div', { class: 'pz-note', html: UI.rich(cfg.note) }));
      if (cfg.html) root.appendChild(UI.el('div', { class: 'pz-html', html: cfg.html }));
      const wrap = UI.el('div', { class: 'wheel-wrap' });
      const wheel = UI.el('div', { class: 'wheel' });
      const n = cfg.slots.length, R = 200, cx = 240, cy = 240, sr = cfg.slotRadius || (n > 10 ? 26 : 34);
      const isRow = cfg.layout === 'row';
      if (isRow) wheel.classList.add('rowlayout');
      let svg = isRow ? `<svg viewBox="0 0 ${n * 90 + 40} 150"><g class="wheel-g">` : `<svg viewBox="0 0 480 480"><g class="wheel-g" transform="rotate(${cfg.orient || 0} ${cx} ${cy})">`;
      if (!isRow) svg += `<circle class="ring" cx="${cx}" cy="${cy}" r="${R + sr + 10}"/><circle class="ring" cx="${cx}" cy="${cy}" r="${R - sr - 10}"/>`;
      else svg += `<rect x="6" y="20" width="${n * 90 + 28}" height="110" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(212,169,78,0.3)"/>`;
      (cfg.marks || []).forEach(deg => { const a = (deg - 90) * Math.PI / 180; svg += `<circle class="mark" cx="${cx + Math.cos(a) * (R + sr + 22)}" cy="${cy + Math.sin(a) * (R + sr + 22)}" r="6"/>`; });
      if (cfg.chip != null) { const a = (cfg.chip - 90) * Math.PI / 180; svg += `<path d="M${cx + Math.cos(a) * (R + sr + 26)},${cy + Math.sin(a) * (R + sr + 26)} l-9,-14 l18,0 z" fill="var(--ember)" transform="rotate(${cfg.chip} ${cx + Math.cos(a) * (R + sr + 26)} ${cy + Math.sin(a) * (R + sr + 26)})"/>`; }
      cfg.slots.forEach((s, i) => {
        const a = (i / n * 360 - 90) * Math.PI / 180, x = isRow ? 20 + 45 + i * 90 : cx + Math.cos(a) * R, y = isRow ? 70 : cy + Math.sin(a) * R;
        svg += `<g class="slot${s.dim ? ' dim' : ''}${s.lit ? ' lit' : ''}" data-i="${i}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><circle class="bg" r="${sr}"/>`;
        svg += `<g transform="rotate(${(s.rot || 0) - (cfg.orient || 0)}) scale(${s.flip ? -1 : 1},1)">${s.svg}</g>`;
        if (s.label) svg += `<text class="lbl" y="${sr + 14}" text-anchor="middle" transform="rotate(${-(cfg.orient || 0)})">${UI.esc(s.label)}</text>`;
        svg += `<text class="ord" y="-${sr + 6}" text-anchor="middle" transform="rotate(${-(cfg.orient || 0)})"></text></g>`;
      });
      svg += `</g>`;
      if (cfg.hub) svg += `<circle class="hub" cx="${cx}" cy="${cy}" r="${cfg.hubR || 62}"/><text class="hub-text" x="${cx}" y="${cy + 5}" text-anchor="middle">${UI.esc(cfg.hub)}</text>`;
      if (cfg.hubSvg) svg += `<g transform="translate(${cx},${cy})">${cfg.hubSvg}</g>`;
      svg += `</svg>`;
      wheel.innerHTML = svg; wrap.appendChild(wheel); root.appendChild(wrap);
      const seqEl = UI.el('div', { class: 'seq-list' }); root.appendChild(seqEl);
      const status = UI.el('div', { class: 'pz-status' }); root.appendChild(status);
      const row = UI.el('div', { class: 'pz-row right' });
      const undo = UI.el('button', { class: 'btn small ghost', text: 'Undo', onclick: () => { seq.pop(); render(); Audio.sfx('tick'); } });
      const clear = UI.el('button', { class: 'btn small ghost', text: 'Clear', onclick: () => { seq.length = 0; render(); Audio.sfx('tick'); } });
      const submit = UI.el('button', { class: 'btn primary', text: cfg.submitText || 'Speak the ward', onclick: check });
      row.appendChild(undo); row.appendChild(clear); row.appendChild(submit); root.appendChild(row);
      container.appendChild(root);

      const seq = []; let tries = 0;
      const slotEls = Array.from(wheel.querySelectorAll('.slot'));
      slotEls.forEach(el => el.addEventListener('click', () => {
        const i = +el.dataset.i; const s = cfg.slots[i];
        if (s.dim && !cfg.allowDim) { Audio.sfx('wrong'); return; }
        if (!cfg.allowRepeat && seq.includes(i)) { seq.splice(seq.indexOf(i), 1); render(); Audio.sfx('tick'); return; }
        if (cfg.maxLen && seq.length >= cfg.maxLen) { Audio.sfx('wrong'); status.textContent = 'The ward holds only ' + cfg.maxLen + ' words.'; return; }
        seq.push(i); Audio.sfx('click'); if (cfg.onPick) cfg.onPick(s, seq.length); render();
      }));
      function render() {
        slotEls.forEach((el, i) => { const k = seq.indexOf(i); el.classList.toggle('sel', k >= 0); el.querySelector('.ord').textContent = k >= 0 ? (k + 1) : ''; });
        UI.clear(seqEl);
        if (!seq.length) seqEl.appendChild(UI.el('span', { class: 'seq-empty', text: cfg.emptyText || 'Click the slots in the order the ward is spoken.' }));
        seq.forEach((i, k) => { const s = cfg.slots[i]; seqEl.appendChild(UI.el('span', { class: 'seq-chip', html: `${k + 1}. <span style="display:inline-block;transform:scaleX(${s.flip ? -1 : 1}) rotate(${s.rot || 0}deg)"><svg viewBox="-20 -20 40 40">${s.svg}</svg></span>${UI.esc(s.label || s.id)}` })); });
        status.textContent = ''; status.className = 'pz-status';
      }
      function check() {
        const ids = seq.map(i => cfg.slots[i].id);
        const ok = cfg.check ? cfg.check(ids, seq) : (JSON.stringify(ids) === JSON.stringify(cfg.answer));
        tries++;
        if (ok) { Audio.sfx('solved'); status.textContent = cfg.successText || 'The ward answers.'; status.className = 'pz-status good'; slotEls.forEach(e => e.classList.add('sel')); submit.disabled = true; setTimeout(() => resolve({ seq: ids, tries }), 900); return; }
        Audio.sfx('fail'); window.VigilFX.shake(wheel, 400);
        const msg = cfg.onWrong ? cfg.onWrong(ids, tries) : null;
        status.textContent = msg || cfg.wrongText || 'The ward does not answer. The slots dim and wait.';
        status.className = 'pz-status bad';
        if (tries >= 2 && api && api.scene && api.scene.hints) document.getElementById('hint').classList.add('attention');
        if (cfg.clearOnWrong !== false) { seq.length = 0; setTimeout(render, 700); }
        if (cfg.maxTries && tries >= cfg.maxTries) { submit.disabled = true; resolve({ seq: ids, tries, failed: true }); }
      }
      render();
    });
  }
  window.VigilWheel = { build };
})();

</script>
<script>/* js/puzzles/reaction.js */
/* Four-lane reaction sequence ("the Stair"): orbs fall down each player's lane; press your key when the orb crosses the line.
   Prompt types: single (one lane), brace (two lanes together), all (all four), mimic (do NOT press).
   cfg: { events:[{t:ms, lanes:[i..], kind:'single'|'brace'|'all'|'mimic'}], fallMs, windowMs, practice:bool, laneNames:[..], target: number (0..1 pass ratio), onEnd(score) }
   Returns { hits, misses, total, ratio, passed } */
(function () {
  'use strict';
  const UI = window.VigilUI, Input = window.VigilInput, Audio = window.VigilAudio;

  function build(cfg) {
    return new Promise((resolve) => {
      const root = UI.el('div', { class: 'react' });
      const hud = UI.el('div', { class: 'react-hud' }, [UI.el('span', { text: cfg.practice ? 'PRACTICE — nothing is at stake' : (cfg.title || 'HOLD THE LINE') }), UI.el('span', { class: 'react-score', text: '' })]);
      const meter = UI.el('div', { class: 'react-meter' }, [UI.el('div', { style: { width: '100%' } })]);
      const lanesEl = UI.el('div', { class: 'lanes' });
      const big = UI.el('div', { class: 'react-big' });
      const lanes = [];
      for (let i = 0; i < 4; i++) {
        const l = UI.el('div', { class: 'lane lane-' + i }, [
          UI.el('div', { class: 'lane-name', text: (cfg.laneNames && cfg.laneNames[i]) || (window.VigilStore.state.names[i] || 'Player ' + (i + 1)) }),
          UI.el('div', { class: 'hitline' }), UI.el('div', { class: 'keycap', text: Input.keyLabel(i) }),
        ]);
        lanesEl.appendChild(l); lanes.push(l);
      }
      const wrap = UI.el('div', { style: { position: 'relative' } }, [lanesEl, big]);
      root.appendChild(hud); root.appendChild(meter); root.appendChild(wrap);
      const pads = UI.el('div', {}); root.appendChild(pads);
      cfg.container.appendChild(root);

      const fall = cfg.fallMs || 1800, win = cfg.windowMs || 380, braceWin = cfg.braceWindowMs || 350;
      const dead = cfg.deadLanes || [];
      const remap = (l) => { if (!dead.includes(l)) return l; const order = [l - 1, l + 1, l - 2, l + 2].filter(x => x >= 0 && x < 4 && !dead.includes(x)); return order[0]; };
      dead.forEach(d => { lanes[d].classList.add('dead'); lanes[d].querySelector('.lane-name').textContent += ' — silent'; });
      const events = cfg.events.map(e => { const ls = Array.from(new Set(e.lanes.map(remap).filter(x => x != null))).sort(); const kind = (e.kind === 'brace' || e.kind === 'all') && ls.length === 1 ? 'single' : (e.kind === 'all' && ls.length < 4 ? 'brace' : e.kind); return Object.assign({ done: false, pressed: {}, orbs: [] }, e, { lanes: ls, kind }); });
      if (cfg.dark) lanesEl.classList.add('dark');
      let beatEl = null; if (cfg.bpm) { beatEl = UI.el('div', { class: 'beat-counter', text: '—' }); wrap.appendChild(beatEl); }
      const total = events.filter(e => e.kind !== 'mimic').length + events.filter(e => e.kind === 'mimic').length;
      let hits = 0, misses = 0, health = 1, started = false, t0 = 0, raf = null, finished = false;
      const scoreEl = hud.lastChild, meterFill = meter.firstChild;

      function laneH() { return lanes[0].clientHeight; }
      function hitY() { return laneH() - 58; }

      function spawn(e) {
        e.lanes.forEach(li => {
          const o = UI.el('div', { class: 'orb ' + (e.kind === 'mimic' ? 'mimic' : e.kind === 'brace' ? 'brace' : e.kind === 'all' ? 'all' : '') });
          o.style.top = '-50px'; lanes[li].appendChild(o); e.orbs.push({ el: o, lane: li });
        });
        if (e.kind === 'brace' || e.kind === 'all') {
          // draw a chain across lanes visually via a full-width bar element in wrap
          const bar = UI.el('div', { class: 'orb-chain', style: { position: 'absolute', height: '4px', background: e.kind === 'all' ? 'rgba(155,123,216,0.6)' : 'rgba(255,200,150,0.6)', left: (Math.min(...e.lanes) / 4 * 100 + 12.5) + '%', width: ((Math.max(...e.lanes) - Math.min(...e.lanes)) / 4 * 100) + '%', top: '-50px', zIndex: 2 } });
          wrap.appendChild(bar); e.chain = bar;
        }
        e.spawned = true;
      }
      function judge(e, ok) {
        e.done = true;
        e.lanes.forEach(li => { lanes[li].classList.add(ok ? 'good' : 'bad'); setTimeout(() => lanes[li].classList.remove('good', 'bad'), 260); });
        e.orbs.forEach(o => o.el.remove()); if (e.chain) e.chain.remove();
        if (ok) { hits++; Audio.sfx('key', e.lanes[0]); if (e.kind === 'all') Audio.sfx('success'); }
        else { misses++; Audio.sfx('miss'); if (!cfg.practice) { health = Math.max(0, health - (cfg.damage || 0.12)); window.VigilFX.shake(lanesEl, 300); } }
        if (cfg.practice) { flashBig(ok ? '✓' : '✗', ok ? 'var(--moss)' : '#ff8b8b'); }
        meterFill.style.width = (health * 100) + '%';
        if (!cfg.hideScore) scoreEl.textContent = `${hits} / ${total}`;
      }
      function flashBig(txt, color) { big.textContent = txt; big.style.color = color || ''; big.style.opacity = '1'; setTimeout(() => { big.style.transition = 'opacity .4s'; big.style.opacity = '0'; setTimeout(() => { big.style.transition = ''; }, 400); }, 250); }

      function onPress(idx) {
        if (!started || finished) return;
        const now = performance.now() - t0;
        // find the nearest live event involving this lane whose orb is near the line
        let best = null, bestD = Infinity;
        for (const e of events) {
          if (e.done || !e.spawned) continue;
          if (!e.lanes.includes(idx)) continue;
          const d = Math.abs(now - e.t);
          if (d < bestD) { best = e; bestD = d; }
        }
        if (!best || bestD > win) {
          // stray press: penalize lightly only outside practice
          lanes[idx].classList.add('bad'); setTimeout(() => lanes[idx].classList.remove('bad'), 200);
          if (!cfg.practice && !cfg.lenient) { health = Math.max(0, health - 0.04); meterFill.style.width = (health * 100) + '%'; Audio.sfx('miss'); }
          return;
        }
        if (best.kind === 'mimic') { judge(best, false); return; }
        best.pressed[idx] = now;
        if (best.kind === 'single') { judge(best, true); return; }
        // brace/all: need all lanes within braceWin of each other
        const times = best.lanes.map(l => best.pressed[l]).filter(x => x != null);
        lanes[idx].classList.add('flash'); setTimeout(() => lanes[idx].classList.remove('flash'), 150);
        if (times.length === best.lanes.length) {
          const spread = Math.max(...times) - Math.min(...times);
          judge(best, spread <= braceWin);
        }
      }

      let lastBeat = 0;
      function frame() {
        if (finished) return;
        raf = requestAnimationFrame(frame);
        const now = performance.now() - t0; const hy = hitY();
        if (beatEl) { const b = Math.floor(now / (60000 / cfg.bpm)) + 1; if (b !== lastBeat && b >= 1) { lastBeat = b; beatEl.textContent = b; beatEl.classList.add('tick'); setTimeout(() => beatEl.classList.remove('tick'), 120); if (cfg.pulse !== false) Audio.sfx('tick'); } }
        for (const e of events) {
          if (e.done) continue;
          if (!e.spawned && now >= e.t - fall) spawn(e);
          if (e.spawned) {
            const y = hy - (e.t - now) / fall * (hy + 50);
            e.orbs.forEach(o => { o.el.style.top = (y - 23) + 'px'; });
            if (e.chain) e.chain.style.top = (y - 2) + 'px';
            if (now > e.t + win) {
              if (e.kind === 'mimic') judge(e, true);        // correctly ignored
              else if (e.kind === 'brace' || e.kind === 'all') {
                const n = Object.keys(e.pressed).length;
                judge(e, false); void n;
              } else judge(e, false);
            }
          }
        }
        if (events.every(e => e.done)) finish();
        if (!cfg.practice && health <= 0 && !cfg.noFail) finish(true);
      }
      function finish(collapsed) {
        if (finished) return; finished = true; cancelAnimationFrame(raf); Input.deactivate();
        const ratio = total ? hits / total : 1;
        const passed = collapsed ? false : ratio >= (cfg.target == null ? 0.6 : cfg.target);
        setTimeout(() => resolve({ hits, misses, total, ratio, passed, collapsed: !!collapsed, health }), 500);
      }

      // countdown then start
      Input.activate(pads, onPress);
      let n = 3;
      flashBig(String(n));
      const iv = setInterval(() => {
        n--; if (n > 0) { flashBig(String(n)); Audio.sfx('tick'); }
        else { clearInterval(iv); flashBig(cfg.practice ? 'PRACTICE' : 'GO'); Audio.sfx('open'); started = true; t0 = performance.now(); raf = requestAnimationFrame(frame); }
      }, 900);
    });
  }

  /* Deterministic event generator: kinds pattern over duration. seed-based for reproducibility. */
  function generateEvents(opts) {
    const r = (function (s) { return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; })(opts.seed || 42);
    const ev = []; let t = opts.startMs || 2500;
    const mix = opts.mix || { single: 0.6, mimic: 0.15, brace: 0.17, all: 0.08 };
    const kinds = Object.keys(mix);
    const rr = () => r();
    let lastLane = -1;
    for (let i = 0; i < opts.count; i++) {
      let k; const x = rr(); let acc = 0; for (const kk of kinds) { acc += mix[kk]; if (x <= acc) { k = kk; break; } } if (!k) k = 'single';
      if (i < (opts.warmup || 2)) k = 'single';
      let lanes;
      if (k === 'all') lanes = [0, 1, 2, 3];
      else if (k === 'brace') { const a = Math.floor(rr() * 4); let b = Math.floor(rr() * 3); if (b >= a) b++; lanes = [a, b].sort(); }
      else { let l = Math.floor(rr() * 4); if (l === lastLane && rr() < 0.7) l = (l + 1 + Math.floor(rr() * 3)) % 4; lanes = [l]; lastLane = l; }
      ev.push({ t: Math.round(t), lanes, kind: k });
      const gap = (opts.gapMs || 1400) * (0.75 + rr() * 0.5) * (k === 'all' ? 1.5 : 1);
      t += Math.max(opts.minGapMs || 700, gap * (opts.accel ? Math.max(0.55, 1 - i / opts.count * 0.45) : 1));
    }
    return ev;
  }

  window.VigilReaction = { build, generateEvents };
})();

</script>
<script>/* js/puzzles/answer.js */
/* Typed answer widget. cfg: { title, note, fields:[{label, placeholder, len}], accept: (values)=>bool | [[accepted strings per field]], normalize, wrongText, onWrong(values,tries), maxTries, submitText, successText }
   Resolves { values, tries } */
(function () {
  'use strict';
  const UI = window.VigilUI, Audio = window.VigilAudio;
  const norm = (s) => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

  function build(container, cfg, api) {
    return new Promise((resolve) => {
      const root = UI.el('div', { class: 'pz' });
      if (cfg.title) root.appendChild(UI.el('div', { class: 'pz-title', text: cfg.title }));
      if (cfg.note) root.appendChild(UI.el('div', { class: 'pz-note', html: UI.rich(cfg.note) }));
      if (cfg.html) root.appendChild(UI.el('div', { html: cfg.html }));
      const form = UI.el('div', { class: 'name-entry' });
      const fields = cfg.fields || [{ label: '', placeholder: '' }];
      const inputs = fields.map((f, i) => {
        const row = UI.el('div', { class: 'token-row' + (f.player != null ? ' p' + f.player : '') });
        if (f.label) row.appendChild(UI.el('label', { text: f.label }));
        const inp = UI.el('input', { class: 'field' + (f.plain ? ' plain' : ''), placeholder: f.placeholder || '', maxlength: f.len || 24, autocomplete: 'off', spellcheck: 'false' });
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') { if (inputs[i + 1]) inputs[i + 1].focus(); else check(); } });
        inp.addEventListener('input', () => inp.classList.remove('wrong'));
        row.appendChild(inp); form.appendChild(row); return inp;
      });
      root.appendChild(form);
      const status = UI.el('div', { class: 'pz-status' }); root.appendChild(status);
      const row = UI.el('div', { class: 'pz-row right' });
      const submit = UI.el('button', { class: 'btn primary', text: cfg.submitText || 'Speak', onclick: check });
      row.appendChild(submit); root.appendChild(row);
      container.appendChild(root);
      setTimeout(() => inputs[0].focus(), 80);
      let tries = 0;
      function check() {
        const raw = inputs.map(i => i.value.trim());
        const values = raw.map(v => cfg.normalize ? cfg.normalize(v) : norm(v));
        let ok, perField = null;
        if (typeof cfg.accept === 'function') ok = cfg.accept(values, raw);
        else { perField = cfg.accept.map((acc, i) => acc.map(norm).includes(values[i])); ok = perField.every(Boolean); }
        tries++;
        if (ok) { Audio.sfx('solved'); status.textContent = cfg.successText || 'It is heard.'; status.className = 'pz-status good'; submit.disabled = true; inputs.forEach(i => i.disabled = true); setTimeout(() => resolve({ values, raw, tries }), 800); return; }
        Audio.sfx('fail');
        inputs.forEach((inp, i) => { if (!perField || !perField[i]) { inp.classList.add('wrong'); } });
        const msg = cfg.onWrong ? cfg.onWrong(values, tries, raw) : null;
        status.textContent = msg || cfg.wrongText || 'Nothing answers.'; status.className = 'pz-status bad';
        if (tries >= 2) document.getElementById('hint').classList.add('attention');
        if (cfg.maxTries && tries >= cfg.maxTries) { submit.disabled = true; resolve({ values, raw, tries, failed: true }); }
      }
    });
  }
  window.VigilAnswer = { build, norm };
})();

</script>
<script>/* js/puzzles/dials.js */
/* Dials widget: N dials, each cycling through a list of options (text or svg). Submit when all match.
   cfg: { title, note, dials:[{label, options:[{id, text|svg}], start}], answer:[ids] | check(ids), submitText, wrongText, onWrong } -> { ids, tries } */
(function () {
  'use strict';
  const UI = window.VigilUI, Audio = window.VigilAudio;
  function build(container, cfg, api) {
    return new Promise((resolve) => {
      const root = UI.el('div', { class: 'pz' });
      if (cfg.title) root.appendChild(UI.el('div', { class: 'pz-title', text: cfg.title }));
      if (cfg.note) root.appendChild(UI.el('div', { class: 'pz-note', html: UI.rich(cfg.note) }));
      const dialsEl = UI.el('div', { class: 'dials' });
      const state = cfg.dials.map(d => d.start || 0);
      const faces = [];
      cfg.dials.forEach((d, i) => {
        const wrap = UI.el('div', { class: 'dial' });
        wrap.appendChild(UI.el('div', { class: 'dial-label', text: d.label || '' }));
        const face = UI.el('div', { class: 'dial-face' }); faces.push(face);
        const btns = UI.el('div', { class: 'dial-btns' }, [
          UI.el('button', { class: 'btn small ghost', text: '‹', title: 'Turn back', 'aria-label': 'Turn back' + (d.label ? ' — ' + d.label : ''), onclick: () => { state[i] = (state[i] - 1 + d.options.length) % d.options.length; Audio.sfx('tick'); render(); } }),
          UI.el('button', { class: 'btn small ghost', text: '›', title: 'Turn forward', 'aria-label': 'Turn forward' + (d.label ? ' — ' + d.label : ''), onclick: () => { state[i] = (state[i] + 1) % d.options.length; Audio.sfx('tick'); render(); } }),
        ]);
        face.addEventListener('click', () => { state[i] = (state[i] + 1) % d.options.length; Audio.sfx('tick'); render(); });
        wrap.appendChild(face); wrap.appendChild(btns); dialsEl.appendChild(wrap);
      });
      root.appendChild(dialsEl);
      const status = UI.el('div', { class: 'pz-status' }); root.appendChild(status);
      const row = UI.el('div', { class: 'pz-row right' });
      const submit = UI.el('button', { class: 'btn primary', text: cfg.submitText || 'Set', onclick: check }); row.appendChild(submit); root.appendChild(row);
      container.appendChild(root);
      function render() { cfg.dials.forEach((d, i) => { const o = d.options[state[i]]; faces[i].innerHTML = o.svg ? o.svg : UI.esc(o.text != null ? o.text : o.id); }); }
      let tries = 0;
      function check() {
        const ids = cfg.dials.map((d, i) => d.options[state[i]].id);
        const ok = cfg.check ? cfg.check(ids) : JSON.stringify(ids) === JSON.stringify(cfg.answer);
        tries++;
        if (ok) { Audio.sfx('solved'); status.textContent = cfg.successText || 'The mechanism turns over.'; status.className = 'pz-status good'; submit.disabled = true; setTimeout(() => resolve({ ids, tries }), 800); return; }
        Audio.sfx('fail'); window.VigilFX.shake(dialsEl, 400);
        status.textContent = (cfg.onWrong && cfg.onWrong(ids, tries)) || cfg.wrongText || 'It does not turn.'; status.className = 'pz-status bad';
        if (tries >= 2) document.getElementById('hint').classList.add('attention');
      }

    });
  }

})();

</script>
<script>/* js/puzzles/tiles.js */
/* Tile sentence builder: click tiles from a tray into a sentence; submit. cfg: { title, note, tiles:[{id,text,cls}], answer:[ids] | check(ids), maxLen, allowRepeat } -> { ids, tries } */
(function () {

      if (cfg.html) root.appendChild(UI.el('div', { html: cfg.html }));
      const sentence = UI.el('div', { class: 'sentence' });
      const tray = UI.el('div', { class: 'tiles' });

      const row = UI.el('div', { class: 'pz-row right' });

      const submit = UI.el('button', { class: 'btn primary', text: cfg.submitText || 'Read it aloud', onclick: check }); row.appendChild(submit); root.appendChild(row);
      container.appendChild(root);
      const seq = []; let tries = 0;
      function render() {
        UI.clear(sentence); UI.clear(tray);
        if (!seq.length) sentence.appendChild(UI.el('span', { class: 'seq-empty', text: cfg.emptyText || 'Build the reading from the tiles below.' }));
        seq.forEach((id, k) => { const t = cfg.tiles.find(x => x.id === id); sentence.appendChild(UI.el('button', { class: 'tile ' + (t.cls || ''), html: UI.rich(t.text), onclick: () => { seq.splice(k, 1); Audio.sfx('tick'); render(); } })); });
        cfg.tiles.forEach(t => { const used = !cfg.allowRepeat && seq.includes(t.id); tray.appendChild(UI.el('button', { class: 'tile ' + (t.cls || '') + (used ? ' used' : ''), html: UI.rich(t.text), onclick: () => { if (cfg.maxLen && seq.length >= cfg.maxLen) { Audio.sfx('wrong'); return; } seq.push(t.id); Audio.sfx('click'); render(); } })); });
      }
      function check() {
        const ids = seq.slice();
        const ok = cfg.check ? cfg.check(ids) : JSON.stringify(ids) === JSON.stringify(cfg.answer);
        tries++;
        if (ok) { Audio.sfx('solved'); status.textContent = cfg.successText || 'The reading is true.'; status.className = 'pz-status good'; submit.disabled = true; setTimeout(() => resolve({ ids, tries }), 800); return; }
        Audio.sfx('fail'); window.VigilFX.shake(sentence, 400);
        status.textContent = (cfg.onWrong && cfg.onWrong(ids, tries)) || cfg.wrongText || 'The words fall flat.'; status.className = 'pz-status bad';
        if (tries >= 2) document.getElementById('hint').classList.add('attention');
      }
      render();

})();

<script>/* js/puzzles/ring.js */
/* Sigil ring: N numbered slots around a circle; a palette of glyphs; place one glyph per slot (or leave empty).
   cfg: { title, note, slots:n, glyphs:[{id,svg,label}], answer:{slotIndex(1-based): glyphId|null} | check(map)=>bool|string,
          marks:[{slot, label, color}], orient, allowEmpty, fourHands:bool, submitText, wrongText, onWrong(map,tries), maxTries,
          callers:[nickname per placement] (optional: shows "X, place a glyph") }
   Resolves { map, tries } */
(function () {
  'use strict';
  const UI = window.VigilUI, Audio = window.VigilAudio, Input = window.VigilInput;

  function build(container, cfg, api) {
    return new Promise((resolve) => {
      const root = UI.el('div', { class: 'pz ring-pz' });
      if (cfg.title) root.appendChild(UI.el('div', { class: 'pz-title', text: cfg.title }));
      if (cfg.note) root.appendChild(UI.el('div', { class: 'pz-note', html: UI.rich(cfg.note) }));
      if (cfg.html) root.appendChild(UI.el('div', { class: 'pz-html', html: cfg.html }));
      const wrap = UI.el('div', { class: 'wheel-wrap' });
      const wheel = UI.el('div', { class: 'wheel ring' });
      const n = cfg.slots, R = 190, cx = 240, cy = 240, sr = n > 8 ? 26 : 32;
      const strip = cfg.layout === 'strip';
      if (strip) wheel.classList.add('striplayout');
      let svg = strip ? `<svg viewBox="0 0 ${n * 84 + 40} 160"><g>` : `<svg viewBox="0 0 480 480"><g transform="rotate(${cfg.orient || 0} ${cx} ${cy})">`;
      if (!strip) {
        svg += `<circle class="ring" cx="${cx}" cy="${cy}" r="${R + sr + 12}"/><circle class="ring" cx="${cx}" cy="${cy}" r="${R - sr - 12}"/>`;
        // sunwise arrow, drawn at the hub so it never suggests where the sigil begins
        if (cfg.showArrow !== false) svg += `<g opacity=".55"><path d="M${cx - 26},${cy - 6} a28,28 0 1 1 52,0" fill="none" stroke="rgba(212,169,78,.7)" stroke-width="2"/><path d="M${cx + 26},${cy - 6} l-9,-7 l1,11 z" fill="rgba(212,169,78,.9)"/><text x="${cx}" y="${cy + 22}" text-anchor="middle" fill="rgba(212,169,78,.7)" font-size="10" font-family="Cinzel,serif" letter-spacing="1">SUNWISE</text></g>`;
        (cfg.marks || []).forEach(m => { const a = ((m.slot - 1) / n * 360 - 90) * Math.PI / 180; const mx = cx + Math.cos(a) * (R + sr + 30), my = cy + Math.sin(a) * (R + sr + 30); svg += `<g transform="translate(${mx.toFixed(1)},${my.toFixed(1)})"><path d="M0,10 L-8,-6 L8,-6 Z" fill="${m.color || 'var(--ember)'}" transform="rotate(${((m.slot - 1) / n * 360 + 180).toFixed(0)})"/>${m.label ? `<text y="-14" text-anchor="middle" fill="${m.color || 'var(--ember)'}" font-size="11" font-family="Cinzel,serif" transform="rotate(${-(cfg.orient || 0)})">${UI.esc(m.label)}</text>` : ''}</g>`; });
      } else {
        svg += `<rect x="6" y="30" width="${n * 84 + 28}" height="100" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(212,169,78,0.3)"/>`;
        (cfg.marks || []).forEach(m => { const mx = 20 + 42 + (m.slot - 1) * 84; svg += `<g transform="translate(${mx},18)"><path d="M0,8 L-8,-6 L8,-6 Z" fill="${m.color || 'var(--ember)'}"/>${m.label ? `<text y="-10" text-anchor="middle" fill="${m.color || 'var(--ember)'}" font-size="11" font-family="Cinzel,serif">${UI.esc(m.label)}</text>` : ''}</g>`; });
      }
      for (let i = 0; i < n; i++) {
        const a = (i / n * 360 - 90) * Math.PI / 180, x = strip ? 20 + 42 + i * 84 : cx + Math.cos(a) * R, y = strip ? 80 : cy + Math.sin(a) * R;
        svg += `<g class="slot" data-i="${i}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><circle class="bg" r="${sr}"/><g class="glyph-holder" transform="rotate(${-(cfg.orient || 0)})"></g><text class="lbl" y="${sr + 15}" text-anchor="middle" transform="rotate(${-(cfg.orient || 0)})">${i + 1}</text></g>`;
      }
      svg += `</g>`;
      if (cfg.hub) svg += `<circle class="hub" cx="${cx}" cy="${cy}" r="70"/><text class="hub-text" x="${cx}" y="${cy + 5}" text-anchor="middle">${UI.esc(cfg.hub)}</text>`;
      svg += `</svg>`;
      wheel.innerHTML = svg; wrap.appendChild(wheel);
      const palette = UI.el('div', { class: 'palette' });
      wrap.appendChild(palette); root.appendChild(wrap);
      const status = UI.el('div', { class: 'pz-status' }); root.appendChild(status);
      const row = UI.el('div', { class: 'pz-row right' });
      row.appendChild(UI.el('button', { class: 'btn small ghost', text: 'Clear ring', onclick: () => { for (let i = 0; i < n; i++) map[i] = null; sel = null; render(); Audio.sfx('tick'); } }));
      const submit = UI.el('button', { class: 'btn primary', text: cfg.submitText || 'Close the sigil', onclick: check });
      row.appendChild(submit); root.appendChild(row);
      container.appendChild(root);

      const map = Array(n).fill(null); let sel = null, tries = 0;
      const slotEls = Array.from(wheel.querySelectorAll('.slot'));
      slotEls.forEach(el => el.addEventListener('click', () => { const i = +el.dataset.i; if (sel === i) { if (map[i]) { map[i] = null; Audio.sfx('tick'); } sel = null; } else { sel = i; Audio.sfx('click'); } render(); }));
      function render() {
        slotEls.forEach((el, i) => {
          el.classList.toggle('sel', sel === i);
          const holder = el.querySelector('.glyph-holder');
          const g = map[i] ? cfg.glyphs.find(x => x.id === map[i]) : null;
          holder.innerHTML = g ? `<g transform="scale(1.15)">${g.svg}</g>` : '';
          el.classList.toggle('filled', !!g);
        });
        UI.clear(palette);
        palette.appendChild(UI.el('div', { class: 'pz-note', text: sel != null ? `Slot ${sel + 1} — choose a glyph` : 'Select a slot, then a glyph.' }));
        const grid = UI.el('div', { class: 'palette-grid' });
        cfg.glyphs.forEach(g => {
          const used = !cfg.allowRepeat && map.includes(g.id);
          grid.appendChild(UI.el('button', { class: 'glyph name-only' + (used ? ' used' : ''), html: `<span class="gname">${UI.esc(g.label || g.id)}</span>`, title: 'The Reader reads the shapes; the palette names only the words.', onclick: () => {
            if (sel == null) { status.textContent = 'Choose a slot first.'; Audio.sfx('wrong'); return; }
            if (used) { const j = map.indexOf(g.id); map[j] = null; }
            map[sel] = g.id; Audio.sfx('click'); if (cfg.onPlace) cfg.onPlace(g.id, sel + 1);
            sel = null; render();
          } }));
        });
        if (cfg.allowEmpty) grid.appendChild(UI.el('button', { class: 'glyph empty', html: `<span class="gi">leave empty</span>`, onclick: () => { if (sel == null) return; map[sel] = null; sel = null; render(); } }));
        palette.appendChild(grid);
      }
      async function check() {
        const m = {}; map.forEach((g, i) => { m[i + 1] = g; });
        let ok;
        if (cfg.check) ok = cfg.check(m);
        else { ok = true; for (let i = 1; i <= n; i++) { const want = cfg.answer[i] === undefined ? null : cfg.answer[i]; if ((m[i] || null) !== want) ok = false; } }
        tries++;
        if (ok === true) {
          Audio.sfx('success'); status.className = 'pz-status good'; status.textContent = cfg.successText || 'The ring warms.';
          submit.disabled = true;
          if (cfg.fourHands !== false) { const r = await fourHands(root, cfg.fourHandsText); if (!r) { /* skipped */ } }
          Audio.sfx('solved'); setTimeout(() => resolve({ map: m, tries }), 700); return;
        }
        Audio.sfx('fail'); window.VigilFX.shake(wheel, 400);
        status.className = 'pz-status bad';
        status.textContent = (typeof ok === 'string' ? ok : null) || (cfg.onWrong && cfg.onWrong(m, tries)) || cfg.wrongText || 'Frost creeps over the ring. It resets.';
        if (tries >= 2) document.getElementById('hint').classList.add('attention');
        if (cfg.resetOnWrong !== false) setTimeout(() => { for (let i = 0; i < n; i++) map[i] = null; sel = null; render(); }, 900);
        if (cfg.maxTries && tries >= cfg.maxTries) { submit.disabled = true; resolve({ map: m, tries, failed: true }); }
      }
      render();
    });
  }

  /* Four Hands: all four keys within windowMs. Resolves true when done (or after skip). */
  function fourHands(root, text, windowMs) {
    return new Promise((resolve) => {
      const box = UI.el('div', { class: 'fourhands' });
      setTimeout(() => { try { box.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {} }, 50);
      box.appendChild(UI.el('div', { class: 'pz-title', text: text || 'FOUR HANDS — all four keys together to close it' }));
      const pads = UI.el('div', {}); box.appendChild(pads);
      const st = UI.el('div', { class: 'pz-status' }); box.appendChild(st);
      const skip = UI.el('button', { class: 'btn small ghost', text: 'Close it without the ritual', onclick: () => { Input.deactivate(); box.remove(); resolve(false); } });
      box.appendChild(skip);
      root.appendChild(box);
      const times = [null, null, null, null];
      Input.activate(pads, (idx) => {
        times[idx] = performance.now(); Input.setPadState(idx, 'good', true); Audio.sfx('key', idx);
        const set = times.filter(x => x != null);
        if (set.length === 4) {
          const spread = Math.max(...set) - Math.min(...set);
          if (spread <= (windowMs || 1000)) { st.className = 'pz-status good'; st.textContent = 'Four hands.'; Audio.sfx('success'); Input.deactivate(); setTimeout(() => { box.remove(); resolve(true); }, 600); }
          else { st.className = 'pz-status bad'; st.textContent = `Too far apart (${(spread / 1000).toFixed(1)} s). Again — count yourselves in.`; for (let i = 0; i < 4; i++) { times[i] = null; Input.setPadState(i, 'good', false); } }
        }
      });
      // stale presses expire
      setInterval(() => { const now = performance.now(); for (let i = 0; i < 4; i++) if (times[i] != null && now - times[i] > (windowMs || 1000)) { times[i] = null; Input.setPadState(i, 'good', false); } }, 200);
    });
  }
  window.VigilRing = { build, fourHands };
})();

</script>
<script>/* js/puzzles/grid.js */
/* Stealth grid: turn-based movement on a small graph with patrols on fixed timetables.
   cfg: { cols, rows, cells:[ids of open cells like 'A1'], edges:[['A1','A2'],...] (open passages), doors:{ 'A3|B3': {password:'VEIL', prompt} },
          start, goal, safe:['A1','B3'], patrols:[{name, path:[cell per turn, cycles]}], alarm:{cells:['B5','C5'], effect(fn)}, maxTurns, restEvery (Wren must wait every Nth move),
          labels:{cell:'Laundry'}, seen: (patrolCell, wrenCell)=>bool (default: same cell or open edge) }
   Resolves { turns, spotted, route } */
(function () {
  'use strict';
  const UI = window.VigilUI, Audio = window.VigilAudio;
  const col = (c) => c.charCodeAt(0) - 65, row = (c) => parseInt(c.slice(1), 10) - 1;

  function build(container, cfg, api) {
    return new Promise((resolve) => {
      const edgeSet = new Set(); cfg.edges.forEach(([a, b]) => { edgeSet.add(a + '|' + b); edgeSet.add(b + '|' + a); });
      const doorKey = (a, b) => cfg.doors && (cfg.doors[a + '|' + b] || cfg.doors[b + '|' + a]);
      const open = (a, b) => edgeSet.has(a + '|' + b);
      const root = UI.el('div', { class: 'pz grid-pz' });
      if (cfg.title) root.appendChild(UI.el('div', { class: 'pz-title', text: cfg.title }));
      if (cfg.note) root.appendChild(UI.el('div', { class: 'pz-note', html: UI.rich(cfg.note) }));
      const board = UI.el('div', { class: 'grid-board' });
      const S = 84, pad = 30, W = cfg.cols * S + pad * 2, H = cfg.rows * S + pad * 2;
      const hud = UI.el('div', { class: 'react-hud' }, [UI.el('span', { class: 'g-turn' }), UI.el('span', { class: 'g-msg' })]);
      root.appendChild(hud); root.appendChild(board);
      const controls = UI.el('div', { class: 'grid-controls' });
      const mk = (t, dx, dy, wait) => UI.el('button', { class: 'btn', text: t, onclick: () => move(dx, dy, wait) });
      controls.appendChild(mk('▲ North', 0, -1)); controls.appendChild(mk('◀ West', -1, 0)); controls.appendChild(mk('Wait', 0, 0, true)); controls.appendChild(mk('▶ East', 1, 0)); controls.appendChild(mk('▼ South', 0, 1));
      root.appendChild(controls);
      const status = UI.el('div', { class: 'pz-status' }); root.appendChild(status);
      root.appendChild(UI.el('button', { class: 'btn small ghost', text: 'Start over from the Gallery', onclick: () => { reset(true); } }));
      container.appendChild(root);

      let wren, turn, lastSafe, spotted, route, movesSinceRest, alarmUntil, history;
      const revealed = {}; // patrolIndex -> set of turns whose position has been revealed
      function reset(full) { wren = cfg.start; turn = 0; lastSafe = cfg.start; spotted = full ? 0 : spotted; route = [cfg.start]; movesSinceRest = 0; alarmUntil = -1; history = []; render(); }
      function cellXY(c) { return { x: pad + col(c) * S + S / 2, y: pad + row(c) * S + S / 2 }; }
      function patrolAt(p, t) { if (alarmUntil >= t && p.alarmCell) return p.alarmCell; return p.path[((t - 1) % p.path.length + p.path.length) % p.path.length]; }
      function seenBy(pc, wc) { if (cfg.seen) return cfg.seen(pc, wc); return pc === wc || open(pc, wc); }

      function render() {
        let s = `<svg viewBox="0 0 ${W} ${H}">`;
        s += `<rect width="${W}" height="${H}" fill="rgba(0,0,0,0.35)" rx="10"/>`;
        // cells
        for (let r = 0; r < cfg.rows; r++) for (let c = 0; c < cfg.cols; c++) {
          const id = String.fromCharCode(65 + c) + (r + 1); const isOpen = cfg.cells.includes(id);
          const x = pad + c * S, y = pad + r * S;
          s += `<rect x="${x + 3}" y="${y + 3}" width="${S - 6}" height="${S - 6}" rx="6" fill="${isOpen ? (cfg.safe && cfg.safe.includes(id) ? 'rgba(127,174,94,0.15)' : 'rgba(255,255,255,0.05)') : 'rgba(0,0,0,0.6)'}" stroke="${isOpen ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0)'}"/>`;
          if (isOpen) s += `<text x="${x + 10}" y="${y + 18}" fill="rgba(233,226,210,0.35)" font-size="12" font-family="Cinzel,serif">${id}</text>`;
          if (cfg.labels && cfg.labels[id]) s += `<text x="${x + S / 2}" y="${y + S - 10}" text-anchor="middle" fill="rgba(212,169,78,0.8)" font-size="11" font-family="Cinzel,serif">${UI.esc(cfg.labels[id])}</text>`;
          if (cfg.alarm && cfg.alarm.cells.includes(id)) s += `<circle cx="${x + S - 14}" cy="${y + 14}" r="4" fill="rgba(178,58,58,0.7)"/>`;
        }
        // walls between open cells with no edge: draw thick line; doors: dashed gold
        for (const a of cfg.cells) for (const b of cfg.cells) {
          if (a >= b) continue; const dc = col(b) - col(a), dr = row(b) - row(a);
          if (Math.abs(dc) + Math.abs(dr) !== 1) continue;
          const A = cellXY(a), B = cellXY(b); const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
          const d = doorKey(a, b);
          if (!open(a, b) && !d) { s += dc ? `<line x1="${mx}" y1="${my - S / 2 + 4}" x2="${mx}" y2="${my + S / 2 - 4}" stroke="#2a2230" stroke-width="6"/>` : `<line x1="${mx - S / 2 + 4}" y1="${my}" x2="${mx + S / 2 - 4}" y2="${my}" stroke="#2a2230" stroke-width="6"/>`; }
          if (d && d.revealed !== false) { s += dc ? `<line x1="${mx}" y1="${my - 16}" x2="${mx}" y2="${my + 16}" stroke="var(--gold)" stroke-width="3" stroke-dasharray="4 3"/>` : `<line x1="${mx - 16}" y1="${my}" x2="${mx + 16}" y2="${my}" stroke="var(--gold)" stroke-width="3" stroke-dasharray="4 3"/>`; }
        }
        // goal
        const G = cellXY(cfg.goal); s += `<circle cx="${G.x}" cy="${G.y}" r="20" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="3 3"/>`;
        // last turn's patrol positions (feedback)
        if (turn > 0 && cfg.revealPatrols !== false) cfg.patrols.forEach((p, i) => { const pc = patrolAt(p, turn); if (!pc) return; const P = cellXY(pc); s += `<g opacity=".85"><circle cx="${P.x}" cy="${P.y}" r="14" fill="rgba(178,58,58,0.35)" stroke="var(--blood)" stroke-width="2"/><text x="${P.x}" y="${P.y + 4}" text-anchor="middle" fill="#ffb0b0" font-size="11" font-family="Cinzel,serif">${UI.esc(p.short || p.name[0])}</text></g>`; });
        // wren
        const Wp = cellXY(wren); s += `<g><circle cx="${Wp.x}" cy="${Wp.y}" r="16" fill="rgba(212,169,78,0.3)" stroke="var(--gold-2)" stroke-width="2"/><text x="${Wp.x}" y="${Wp.y + 4}" text-anchor="middle" fill="var(--gold-2)" font-size="12" font-family="Cinzel,serif">W</text></g>`;
        // route trail
        if (route.length > 1) { let d = ''; route.forEach((c, i) => { const p = cellXY(c); d += (i ? 'L' : 'M') + p.x + ',' + p.y + ' '; }); s += `<path d="${d}" fill="none" stroke="rgba(212,169,78,0.35)" stroke-width="2"/>`; }
        s += `</svg>`;
        board.innerHTML = s;
        hud.firstChild.textContent = `Turn ${turn}${cfg.maxTurns ? ' of ' + cfg.maxTurns : ''}`;
        hud.lastChild.textContent = turn > 0 ? cfg.patrols.map(p => `${p.name}: ${patrolAt(p, turn) || '—'}`).join('   ') : '';
        if (cfg.restEvery) status.textContent = movesSinceRest >= cfg.restEvery - 1 && !status.classList.contains('bad') ? 'Wren is tiring — the next turn must be a rest.' : status.textContent;
      }

      async function move(dx, dy, wait) {
        let target = wren;
        if (!wait) {
          const c = col(wren) + dx, r = row(wren) + dy;
          if (c < 0 || r < 0 || c >= cfg.cols || r >= cfg.rows) return;
          target = String.fromCharCode(65 + c) + (r + 1);
          if (!cfg.cells.includes(target)) { status.className = 'pz-status bad'; status.textContent = 'A wall.'; Audio.sfx('wrong'); return; }
          if (cfg.restEvery && movesSinceRest >= cfg.restEvery) { status.className = 'pz-status bad'; status.textContent = 'Wren needs to rest this turn.'; Audio.sfx('wrong'); return; }
          const d = doorKey(wren, target);
          if (d) {
            const pw = await UI.ask(d.prompt || 'A hidden door. The lintel carries a word. Speak it:', '', { ok: 'Speak it', cancel: 'Step back', maxlength: 12 });
            if (pw == null) return;
            if (String(pw).toUpperCase().replace(/[^A-Z]/g, '') !== d.password) { status.className = 'pz-status bad'; status.textContent = d.wrongText || 'The wall stays a wall.'; Audio.sfx('wrong'); return; }
            Audio.sfx('unlock'); d.revealed = true;
          } else if (!open(wren, target)) { status.className = 'pz-status bad'; status.textContent = 'A wall.'; Audio.sfx('wrong'); return; }
        }
        turn++; wren = target; route.push(wren); history.push(wren);
        movesSinceRest = wait ? 0 : movesSinceRest + 1;
        Audio.sfx('step');
        if (cfg.onCell && !wait) { try { cfg.onCell(wren, turn); } catch (e) { console.error(e); } }
        status.className = 'pz-status'; status.textContent = '';
        if (cfg.alarm && cfg.alarm.cells.includes(wren)) { alarmUntil = turn + (cfg.alarm.turns || 3); status.className = 'pz-status bad'; status.textContent = cfg.alarm.text || 'Someone raises a cry. The heavy boots come back.'; Audio.sfx('alarm'); }
        if (cfg.safe && cfg.safe.includes(wren)) lastSafe = wren;
        // check patrols
        let caught = null;
        cfg.patrols.forEach(p => { const pc = patrolAt(p, turn); if (pc && seenBy(pc, wren) && !(cfg.safe && cfg.safe.includes(wren))) caught = p; });
        if (caught) {
          spotted++; Audio.sfx('fail'); window.VigilFX.shake(board, 400);
          status.className = 'pz-status bad'; status.textContent = `${caught.name} sees Wren at ${wren}! Wren scrambles back to ${cfg.labels && cfg.labels[lastSafe] ? cfg.labels[lastSafe] : lastSafe}. (Turn ${turn} — the count keeps running.)`;
          wren = lastSafe; route = [wren]; movesSinceRest = 0;
          if (cfg.onSpotted) cfg.onSpotted(spotted);
          if (spotted >= 2) document.getElementById('hint').classList.add('attention');
        }
        render();
        if (wren === cfg.goal) { Audio.sfx('solved'); status.className = 'pz-status good'; status.textContent = cfg.successText || 'The Tower door. Wren slips through.'; Array.from(controls.children).forEach(b => b.disabled = true); setTimeout(() => resolve({ turns: turn, spotted, route: history }), 900); return; }
        if (cfg.maxTurns && turn >= cfg.maxTurns) { Audio.sfx('boom'); status.className = 'pz-status bad'; status.textContent = cfg.timeoutText || 'The third bell. Wren is still in the corridors. Start again — the patrols reset.'; if (cfg.onTimeout) cfg.onTimeout(); setTimeout(() => reset(false), 1600); }
      }
      reset(true);
    });
  }
  window.VigilGrid = { build };
})();

</script>
<script>/* js/puzzles/binding.js */
/* The Binding: four notes, toggle-press (press to sound, press again to release). All four must sound within joinMs,
   hold together for holdMs (any early release dips the flame and restarts the hold), then release together within releaseMs.
   cfg: { joinMs:1000, holdMs:6000, releaseMs:500, attempts:3, deadLanes:[idx], mutedCues:[idx], onAttempt(n, result), onSlip(n, msg) }
   onAttempt fires on the two resets that spend the attempt budget; onSlip fires on ALL FOUR resets,
   which is what the Epilogue counts. Resolves { success, attempts, slips, releaseSpread } */
(function () {
  'use strict';
  const UI = window.VigilUI, Input = window.VigilInput, Audio = window.VigilAudio;
  const NOTES = [60, 64, 67, 71];

  function build(container, cfg, api) {
    return new Promise((resolve) => {
      const root = UI.el('div', { class: 'pz binding' });
      root.appendChild(UI.el('div', { class: 'pz-title', text: cfg.title || 'THE BINDING' }));
      root.appendChild(UI.el('div', { class: 'pz-note', html: UI.rich(cfg.note || 'Press your key once to sound your note. It holds until you press again. All four must sound together, hold while the fire climbs, then **release together** — count yourselves in aloud. The Hearth gives no count.') }));
      const flame = UI.el('div', { class: 'flame-meter' }, [UI.el('div', { class: 'flame-fill' })]);
      root.appendChild(flame);
      const lanesEl = UI.el('div', { class: 'bind-lanes' });
      const lanes = [];
      for (let i = 0; i < 4; i++) { const l = UI.el('div', { class: 'bind-lane lane-' + i + ((cfg.deadLanes || []).includes(i) ? ' dead' : '') }, [UI.el('div', { class: 'lane-name', text: window.VigilStore.state.names[i] || 'Player ' + (i + 1) }), UI.el('div', { class: 'bind-orb' }), UI.el('div', { class: 'keycap', text: Input.keyLabel(i) })]); lanesEl.appendChild(l); lanes.push(l); }
      root.appendChild(lanesEl);
      const pads = UI.el('div', {}); root.appendChild(pads);
      const status = UI.el('div', { class: 'pz-status' }); root.appendChild(status);
      const log = UI.el('div', { class: 'pz-note bind-log' }); root.appendChild(log);
      container.appendChild(root);

      const joinMs = cfg.joinMs || 1000, holdMs = cfg.holdMs || 6000, releaseMs = cfg.releaseMs || 500, maxAttempts = cfg.attempts || 3;
      const active = (cfg.deadLanes || []).length ? [0, 1, 2, 3].filter(i => !(cfg.deadLanes || []).includes(i)) : [0, 1, 2, 3];
      let sounding = [false, false, false, false], onTimes = [null, null, null, null], offTimes = [null, null, null, null];
      let phase = 'join', holdStart = null, attempts = 0, slips = 0, fill = 0, raf = null, done = false, voices = [], ignoreUntil = 0;

      function startVoice(i) { if (Audio.ready && Audio.ready() && !Audio.isMuted()) { /* sustained tone via repeated bell */ voices[i] = setInterval(() => Audio.note(NOTES[i], 1.2, 0.12), 900); Audio.note(NOTES[i], 1.2, 0.14); } }
      function stopVoice(i) { if (voices[i]) { clearInterval(voices[i]); voices[i] = null; } }
      function setLane(i, on) { lanes[i].classList.toggle('on', on); Input.setPadState(i, 'good', on); }
      /* A SLIP AND AN ATTEMPT ARE DIFFERENT THINGS, and until this pass only one of them was counted.
         Four things reset the ring: a hand coming back after letting go, joining too far apart,
         letting go early, and releasing ragged. The first and last called fail(); the middle two
         just reset and returned, so a table could slip twice and the Epilogue would still say
         "after 0 slips" (reproduced by tools/scripts/ch7-alt2.json, which slips exactly twice).
         The fix is NOT to route all four into fail(): fail() spends the three-attempt budget, and
         ch7 prices the Binding at zero on purpose -- a four-hands reflex round at the last beat of a
         two-hour game must not be a wall (js/content/ch7.js, the note at the foot of the file, and
         docs/ADVERSARIAL.md's settled OPEN 2, where the currency of the last two chapters is the
         RECORD rather than a loss). So the budget stays exactly as it was and the record becomes
         true: every reset is one slip, counted once, here, where all four of them pass. */
      function resetAll(msg, cls) { ignoreUntil = performance.now() + 700; active.forEach(i => { sounding[i] = false; onTimes[i] = null; offTimes[i] = null; setLane(i, false); stopVoice(i); }); phase = 'join'; holdStart = null; fill = 0; flame.firstChild.style.width = '0%'; if (msg) { status.className = 'pz-status ' + (cls || ''); status.textContent = msg; slips++; if (cfg.onSlip) cfg.onSlip(slips, msg); } }

      Input.activate(pads, (idx) => {
        if (done || !active.includes(idx)) return;
        const now = performance.now();
        if (now < ignoreUntil) return; // settle window after a reset: the other hands' in-flight presses are not new joins
        if (!sounding[idx]) {
          if (phase === 'release') { resetAll('A hand came back after letting go. Again.', 'bad'); Audio.sfx('miss'); fail(); return; }
          sounding[idx] = true; onTimes[idx] = now; setLane(idx, true); startVoice(idx);
          if (active.every(i => sounding[i])) {
            const ts = active.map(i => onTimes[i]); const spread = Math.max(...ts) - Math.min(...ts);
            if (spread > joinMs) { resetAll(`Joined too far apart (${(spread / 1000).toFixed(1)} s). Sound them together.`, 'bad'); Audio.sfx('miss'); return; }
            phase = 'hold'; holdStart = now; status.className = 'pz-status good'; status.textContent = 'Four hands. Hold — the fire climbs.';
          }
        } else {
          // release
          sounding[idx] = false; offTimes[idx] = now; setLane(idx, false); stopVoice(idx);
          if (phase === 'hold') {
            if (now - holdStart < holdMs) { resetAll(`${window.VigilStore.state.names[idx] || 'Player ' + (idx + 1)} let go early — the flame dips. Sound them again.`, 'bad'); Audio.sfx('miss'); return; }
            phase = 'release';
          }
          if (phase === 'release' && active.every(i => !sounding[i])) {
            const ts = active.map(i => offTimes[i]); const spread = Math.max(...ts) - Math.min(...ts);
            const detail = active.map(i => `${window.VigilStore.state.names[i] || 'P' + (i + 1)} ${((offTimes[i] - Math.min(...ts)) / 1000).toFixed(2)}s`).join(' · ');
            if (spread <= releaseMs) { done = true; Input.deactivate(); Audio.sfx('seal'); status.className = 'pz-status good'; status.textContent = `Released together (${(spread / 1000).toFixed(2)} s). The Binding holds.`; log.textContent = detail; flame.firstChild.style.width = '100%'; setTimeout(() => resolve({ success: true, attempts: attempts + 1, slips, releaseSpread: spread }), 1400); }
            else { log.textContent = detail; resetAll(`Released ${(spread / 1000).toFixed(2)} s apart — it needs ${(releaseMs / 1000).toFixed(1)}. Count yourselves in: one, two, three, off.`, 'bad'); Audio.sfx('fail'); fail(); }
          }
        }
      });
      function fail() { attempts++; if (cfg.onAttempt) cfg.onAttempt(attempts, false); if (attempts >= maxAttempts) { done = true; Input.deactivate(); status.className = 'pz-status bad'; status.textContent = cfg.failText || 'The fire will not take a fourth attempt. It flares, thin.'; setTimeout(() => resolve({ success: false, attempts, slips }), 1400); } }
      function frame() { if (done) return; raf = requestAnimationFrame(frame); if (phase === 'hold') { fill = Math.min(1, (performance.now() - holdStart) / holdMs); flame.firstChild.style.width = (fill * 100) + '%'; if (fill >= 1 && !flame.classList.contains('ready')) { flame.classList.add('ready'); status.textContent = 'It has climbed. Now — together — let go.'; Audio.sfx('chime'); } } else { flame.classList.remove('ready'); } }
      raf = requestAnimationFrame(frame);
    });
  }
  window.VigilBinding = { build };
})();

</script>
<script>/* js/puzzles/seats.js */
/* Seats: N seats around a round table; the group may "approach" up to K of them, then convene.
   cfg: { title, note, seats:[{id, label, sub, banner(svg string)?, locked?}], max:K, check(selectedIds)=>{ok:boolean, text, tally?}, submitText, maxTries, timer:seconds?, onTimeout() }
   Resolves { selected, ok, tries, timedOut } */
(function () {
  'use strict';
  const UI = window.VigilUI, Audio = window.VigilAudio;
  function build(container, cfg, api) {
    return new Promise((resolve) => {
      const root = UI.el('div', { class: 'pz seats-pz' });
      if (cfg.title) root.appendChild(UI.el('div', { class: 'pz-title', text: cfg.title }));
      if (cfg.note) root.appendChild(UI.el('div', { class: 'pz-note', html: UI.rich(cfg.note) }));
      const area = UI.el('div', { class: 'table-area' });
      const n = cfg.seats.length; const R = 42; // percent
      area.innerHTML = `<svg viewBox="0 0 100 100" class="table-svg"><circle cx="50" cy="50" r="30" fill="rgba(0,0,0,0.35)" stroke="rgba(212,169,78,0.35)"/><circle cx="50" cy="50" r="6" fill="rgba(255,122,61,0.35)"><animate attributeName="r" values="6;7;6" dur="3s" repeatCount="indefinite"/></circle><text x="50" y="52" text-anchor="middle" font-size="4" fill="rgba(233,226,210,0.6)" font-family="Cinzel,serif">${UI.esc(cfg.center || '')}</text></svg>`;
      const seatEls = [];
      cfg.seats.forEach((s, i) => {
        const a = ((i + 0.5) / n * 360 - 90 + (cfg.startAngle || 0)) * Math.PI / 180;
        const x = 50 + Math.cos(a) * R, y = 50 + Math.sin(a) * R;
        const el = UI.el('div', { class: 'seat' + (s.locked ? ' locked' : ''), style: { left: `calc(${x}% - 37px)`, top: `calc(${y}% - 37px)` } });
        el.appendChild(UI.el('span', { class: 'seatn', text: s.n != null ? s.n : (i + 1) }));
        el.appendChild(UI.el('span', { html: (s.banner ? `<div class="seat-banner">${s.banner}</div>` : '') + UI.esc(s.label) + (s.sub ? `<br><small>${UI.esc(s.sub)}</small>` : '') }));
        el.addEventListener('click', () => toggle(i));
        area.appendChild(el); seatEls.push(el);
      });
      root.appendChild(area);
      const status = UI.el('div', { class: 'pz-status' }); root.appendChild(status);
      const row = UI.el('div', { class: 'pz-row right' });
      const submit = UI.el('button', { class: 'btn primary', text: cfg.submitText || 'Convene', onclick: check }); row.appendChild(submit); root.appendChild(row);
      container.appendChild(root);
      let ctl = null;
      if (cfg.timer) { ctl = UI.countdown(root, cfg.timer); ctl.promise.then(r => { if (r === 'timeout' && !finished) { if (cfg.onTimeout) cfg.onTimeout(); status.className = 'pz-status bad'; status.textContent = cfg.timeoutText || 'The bell. The vote is called as it stands.'; setTimeout(check, 900); } }); }
      const selected = []; let tries = 0, finished = false;
      function toggle(i) {
        const s = cfg.seats[i];
        if (s.locked) { Audio.sfx('wrong'); status.className = 'pz-status bad'; status.textContent = s.lockedText || 'That Master cannot be approached.'; return; }
        const k = selected.indexOf(s.id);
        if (k >= 0) selected.splice(k, 1); else { if (selected.length >= (cfg.max || 2)) { Audio.sfx('wrong'); status.className = 'pz-status bad'; status.textContent = `You may approach only ${cfg.max || 2}.`; return; } selected.push(s.id); }
        Audio.sfx('click'); render();
      }
      function render() { seatEls.forEach((el, i) => el.classList.toggle('filled', selected.includes(cfg.seats[i].id))); }
      function check() {
        if (finished) return;
        const r = cfg.check(selected.slice());
        tries++;
        if (r.ok) { finished = true; if (ctl) ctl.cancel(); Audio.sfx('solved'); status.className = 'pz-status good'; status.textContent = r.text || 'It carries.'; submit.disabled = true; setTimeout(() => resolve({ selected: selected.slice(), ok: true, tries }), 1200); return; }
        Audio.sfx('fail'); status.className = 'pz-status bad'; status.textContent = r.text || 'It fails.';
        if (tries >= 2) document.getElementById('hint').classList.add('attention');
        if ((cfg.maxTries && tries >= cfg.maxTries) || r.final) { finished = true; if (ctl) ctl.cancel(); submit.disabled = true; setTimeout(() => resolve({ selected: selected.slice(), ok: false, tries, tally: r.tally }), 1200); }
        else if (!cfg.keepSelection) { selected.length = 0; render(); }
      }
      render();
    });
  }
  window.VigilSeats = { build };
})();

</script>
<script>/* js/puzzles/dialseq.js */
/* Dial sequence (the Founders' Door): N dials; each "turn" sets one dial to one glyph. The door counts turns in order.
   cfg: { title, note, dials:[{id,label}], glyphs:[{id,svg,label}], answer:[{dial, glyph}] (ordered) | check(turns)=>bool|string, maxTurns, submitText }
   Resolves { turns, tries } */
(function () {
  'use strict';
  const UI = window.VigilUI, Audio = window.VigilAudio;
  function build(container, cfg, api) {
    return new Promise((resolve) => {
      const root = UI.el('div', { class: 'pz dialseq' });
      if (cfg.title) root.appendChild(UI.el('div', { class: 'pz-title', text: cfg.title }));
      if (cfg.note) root.appendChild(UI.el('div', { class: 'pz-note', html: UI.rich(cfg.note) }));
      if (cfg.html) root.appendChild(UI.el('div', { html: cfg.html }));
      const dialsEl = UI.el('div', { class: 'dials' });
      const faces = [];
      cfg.dials.forEach((d, i) => {
        const wrap = UI.el('div', { class: 'dial' });
        wrap.appendChild(UI.el('div', { class: 'dial-label', text: d.label }));
        const face = UI.el('div', { class: 'dial-face' }); faces.push(face);
        face.addEventListener('click', () => { sel = sel === i ? null : i; Audio.sfx('click'); render(); });
        wrap.appendChild(face); dialsEl.appendChild(wrap);
      });
      root.appendChild(dialsEl);
      const palette = UI.el('div', { class: 'palette-grid' }); root.appendChild(palette);
      const turnsEl = UI.el('div', { class: 'seq-list' }); root.appendChild(turnsEl);
      const status = UI.el('div', { class: 'pz-status' }); root.appendChild(status);
      const row = UI.el('div', { class: 'pz-row right' });
      row.appendChild(UI.el('button', { class: 'btn small ghost', text: 'Undo turn', onclick: () => { turns.pop(); Audio.sfx('tick'); render(); } }));
      row.appendChild(UI.el('button', { class: 'btn small ghost', text: 'Reset', onclick: () => { turns.length = 0; Audio.sfx('tick'); render(); } }));
      const submit = UI.el('button', { class: 'btn primary', text: cfg.submitText || 'Try the door', onclick: check }); row.appendChild(submit); root.appendChild(row);
      container.appendChild(root);
      const turns = []; let sel = null, tries = 0;
      function current(i) { for (let k = turns.length - 1; k >= 0; k--) if (turns[k].dial === cfg.dials[i].id) return turns[k].glyph; return null; }
      function render() {
        cfg.dials.forEach((d, i) => { const g = current(i); faces[i].innerHTML = g ? `<svg viewBox="-20 -20 40 40">${cfg.glyphs.find(x => x.id === g).svg}</svg>` : '<span style="opacity:.4">—</span>'; faces[i].classList.toggle('sel', sel === i); });
        UI.clear(palette);
        palette.appendChild(UI.el('div', { class: 'pz-note', style: { flexBasis: '100%' }, text: sel != null ? `Turn dial ${cfg.dials[sel].label} to…` : 'Select a dial, then a glyph. Each choice is one turn; the door counts them in order.' }));
        cfg.glyphs.forEach(g => palette.appendChild(UI.el('button', { class: 'glyph name-only', html: `<span class="gname">${UI.esc(g.label || g.id)}</span>`, onclick: () => { if (sel == null) { Audio.sfx('wrong'); return; } if (cfg.maxTurns && turns.length >= cfg.maxTurns) { Audio.sfx('wrong'); status.textContent = 'The door counts no more than ' + cfg.maxTurns + ' turns.'; return; } turns.push({ dial: cfg.dials[sel].id, glyph: g.id }); Audio.sfx('click'); sel = null; render(); } })));
        UI.clear(turnsEl);
        if (!turns.length) turnsEl.appendChild(UI.el('span', { class: 'seq-empty', text: 'No turns yet.' }));
        turns.forEach((t, k) => turnsEl.appendChild(UI.el('span', { class: 'seq-chip', text: `${k + 1}. ${t.dial} → ${t.glyph}` })));
        status.textContent = ''; status.className = 'pz-status';
      }
      function check() {
        tries++;
        let ok;
        if (cfg.check) ok = cfg.check(turns.slice());
        else ok = turns.length === cfg.answer.length && turns.every((t, k) => t.dial === cfg.answer[k].dial && t.glyph === cfg.answer[k].glyph);
        if (ok === true) { Audio.sfx('open'); status.className = 'pz-status good'; status.textContent = cfg.successText || 'The door remembers the count. It opens.'; submit.disabled = true; setTimeout(() => resolve({ turns: turns.slice(), tries }), 900); return; }
        Audio.sfx('fail'); window.VigilFX.shake(dialsEl, 400);
        status.className = 'pz-status bad'; status.textContent = (typeof ok === 'string' ? ok : null) || cfg.wrongText || 'The door forgets the count.';
        if (tries >= 2) document.getElementById('hint').classList.add('attention');
        setTimeout(() => { turns.length = 0; render(); }, 900);
      }
      render();
    });
  }
  window.VigilDialSeq = { build };
})();

</script>

<script>/* js/content/shared.js */
/* Shared between Hearth and Companion: opaque tokens, attunement casts, helpers. */
(function () {
  'use strict';
  const S = {};
  const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 32 symbols, no O/0/I/1

  function fnv(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h >>> 0;
  }
  function code4(str) {
    let h = fnv('vigil:' + str); let out = '';
    for (let i = 0; i < 4; i++) { out += ALPHA[h % 32]; h = Math.floor(h / 32); if (h < 32) h = fnv(str + i); }
    return out;
  }
  S.norm = (s) => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  S.fnv = fnv; S.ALPHA = ALPHA;

  /* ---------- Tokens (phone -> Hearth). Deterministic opaque 4-char code for (channel, value), unique within `values`. ---------- */
  S.token = function (channel, value, values) {
    let salt = 0;
    while (true) {
      const mine = code4(channel + '|' + value + '|' + salt);
      const clash = values.some(v => v !== value && code4(channel + '|' + v + '|' + salt) === mine);
      if (!clash) return mine;
      salt++;
    }
  };
  S.decode = function (channel, token, values) {
    token = S.norm(token);
    for (const v of values) if (S.token(channel, v, values) === token) return v;
    return null;
  };

  /* ---------- Casts (Hearth -> phone). 6 data bits + 9-bit checksum bound to the word -> 3 symbols. ---------- */
  S.cast = function (word, bits) {
    let data = Array.isArray(bits) ? bits.reduce((a, b, i) => a | ((b ? 1 : 0) << i), 0) : (bits | 0);
    data &= 63;
    const check = fnv('cast|' + S.norm(word) + '|' + data + '|' + fnv(String(data * 7919 + word.length)) ) & 511;
    const v = data | (check << 6); // 15 bits
    return ALPHA[v & 31] + ALPHA[(v >> 5) & 31] + ALPHA[(v >> 10) & 31];
  };
  S.uncast = function (word, cast) {
    cast = S.norm(cast); if (cast.length !== 3) return null;
    const a = ALPHA.indexOf(cast[0]), b = ALPHA.indexOf(cast[1]), c = ALPHA.indexOf(cast[2]); if (a < 0 || b < 0 || c < 0) return null;
    const v = a | (b << 5) | (c << 10); const data = v & 63, check = (v >> 6) & 511;
    if ((fnv('cast|' + S.norm(word) + '|' + data + '|' + fnv(String(data * 7919 + word.length))) & 511) !== check) return null;
    return data;
  };
  S.bit = (data, i) => !!((data >> i) & 1);
  S.bits = (data, i, n) => (data >> i) & ((1 << n) - 1);
  S.pack = function (spec, state) {
    // spec: [{bit, n?, key}] ; state: object of flags (booleans or small ints)
    let d = 0;
    for (const f of spec) { const v = state[f.key]; const n = f.n || 1; const iv = typeof v === 'boolean' ? (v ? 1 : 0) : (v | 0); d |= (iv & ((1 << n) - 1)) << f.bit; }
    return d & 63;
  };
  S.unpack = function (spec, data) { const o = {}; for (const f of spec) { const n = f.n || 1; const v = (data >> f.bit) & ((1 << n) - 1); o[f.key] = n === 1 ? !!v : v; } return o; };

  window.VigilShared = S;
})();

</script>
<script>/* js/content/lore.js */
/* Lore tables shared by Hearth and Companion: roles, nicknames, Laws, chapters, cast specs, tokens. */
(function () {
  'use strict';
  const L = {};
  L.roles = [

  ];
  L.roleById = (id) => L.roles.find(r => r.id === id);
  L.nick = (i) => L.roles[i].nick;
  L.nicks = L.roles.map(r => r.nick);

  /* Attunement words per chapter and cast bit specs (see docs/DESIGN.md Appendix B). */
  L.chapters = [
    { id: 'ch0', n: 0, label: 'Prologue',  title: 'The Night the Hearth Guttered', word: 'KINDLE', cast: [] },
    { id: 'ch1', n: 1, label: 'Chapter I',   title: 'The Vigil',                 word: 'THORN',  cast: [] },

    { id: 'ch3', n: 3, label: 'Chapter III', title: 'The Whispering Gallery',    word: 'VEIL',   cast: [{ bit: 0, key: 'VOTE_LOST' }, { bit: 1, key: 'WREN_HURT' }, { bit: 2, key: 'VANE_ACCEPT' }] },
    { id: 'ch4', n: 4, label: 'Chapter IV',  title: 'The Oath',                  word: 'EMBER',  cast: [{ bit: 0, key: 'LETTER' }, { bit: 1, key: 'ORIEL' }, { bit: 2, key: 'SORREL' }, { bit: 3, key: 'VANE_ACCEPT' }, { bit: 4, key: 'SURRENDERED' }, { bit: 5, key: 'WREN_SCARED' }] },
    { id: 'ch5', n: 5, label: 'Chapter V',   title: 'The Long Stair',            word: 'ASH',    cast: [{ bit: 0, n: 2, key: 'OATH' }, { bit: 2, key: 'EMBER_LOST' }, { bit: 3, key: 'LAW0' }, { bit: 4, key: 'VANE_ACCEPT' }, { bit: 5, key: 'WREN_HURT' }] },
    { id: 'ch6', n: 6, label: 'Chapter VI',  title: 'The Bells of Thornhallow',  word: 'WELL',   cast: [{ bit: 0, n: 3, key: 'VOLUNTEER' }, { bit: 3, key: 'PRECRACKED' }] },
    { id: 'ch7', n: 7, label: 'Finale',      title: 'One Born of Four',          word: 'CROWN',  cast: [{ bit: 0, key: 'WALK_UNLOCKED' }, { bit: 1, key: 'VANE_ALLY' }, { bit: 2, n: 2, key: 'BELLS_CRACKED' }, { bit: 4, key: 'OATH_KNOT' }] },
    { id: 'ch8', n: 8, label: 'Epilogue',    title: 'What the Fire Left Behind', word: 'WREN',   cast: [{ bit: 0, n: 3, key: 'ENDING' }] },
  ];
  L.chapter = (id) => L.chapters.find(c => c.id === id);
  // OATH: 0 none, 1 KNOT, 2 EMBER. VOLUNTEER: 0 none, 1 reader, 2 listener, 3 seer, 4 binder. ENDING: 0 Fourfold, 1 Half, 2 Sealing, 3 Keeper, 4 Bargain.
  L.ENDINGS = ['fourfold', 'half', 'sealing', 'keeper', 'bargain'];

  /* Token channels: each is (channel id, values). Both sides use exactly these. */
  L.tokens = {
    whisper: { reader: ['TELL', 'DONTKNOW'], listener: ['LOUD', 'NO'], seer: ['TELL', 'NOTHING'], binder: ['YES', 'DONTKNOW'] },
    hold:    ['YES', 'NO'],
    finale:  ['WALK_ACCEPT', 'WALK_REFUSE', 'STAY_ACCEPT', 'STAY_REFUSE', 'ACCEPT', 'REFUSE', 'WALK', 'STAY'],
  };
  /* WHICH of each whisper pair is the true answer. This lived in ch3 (which writes TRUTHS) and,
     separately, in ch8 (whose `truths()` falls back to recomputing it when TRUTHS is unset -- a
     chapter-select jump, or a save from before ch3 wrote it). ch6 kept a third copy until the sweep
     deleted it. Three copies of one four-entry table, in three chapters that may not edit each other,
     and nothing compared them: docs/ADVERSARIAL.md 18's corollary. It belongs here, next to the pair
     it selects from, and tools/check-content.js asserts every value is one of that role's two tokens.
     Renaming or re-valuing any of these changes what the Epilogue counts. */
  L.whisperTruth = { reader: 'DONTKNOW', listener: 'NO', seer: 'TELL', binder: 'DONTKNOW' };
  L.channel = (beat, roleId) => 'hf:' + beat + ':' + roleId;
  /* Finale token value set depends only on cast flags (both sides compute it identically). Returns null when no token is needed. */
  L.finaleValues = (flags) => {
    const walk = !!flags.WALK_UNLOCKED, ally = !!flags.VANE_ALLY;
    if (walk && !ally) return ['WALK_ACCEPT', 'WALK_REFUSE', 'STAY_ACCEPT', 'STAY_REFUSE'];
    if (walk && ally) return ['WALK', 'STAY'];
    if (!walk && !ally) return ['ACCEPT', 'REFUSE'];
    return null;
  };

  /* The Book of Laws. era: 'F' Founders (Year 0) or 'O' Order (year given). learned: chapter id where it appears. */
  L.laws = [

    { n: 6,  era: 'O', year: 212, text: 'COLD is never written; where an inscription shows it, leave the slot empty.', learned: 'ch5' },
    { n: 12, era: 'F', year: 0,   text: 'An oath binds only if its lock is KNOT or EMBER.', learned: 'ch5' },
    { n: 8,  era: 'F', year: 0,   text: 'A Great Sigil names every glyph once.', learned: 'ch7' },
    { n: 7,  era: 'F', year: 0,   text: 'Idony\'s Law: a sigil sworn under KNOT begins at the sworn-to. Build the ring by the Laws, then turn it sunwise until the sworn-to\'s glyph sits at the first mark.', learned: 'ch7' },
  ];
  L.lawsUpTo = (chId) => { const n = L.chapter(chId).n; return L.laws.filter(l => L.chapter(l.learned).n <= n); };

  L.houseRule = 'Say what you see. Never show your phone.';
  L.prophecyOrder = 'When the Hearth goes cold, one born of four shall walk into the Cold, and it shall close behind them.';

  window.VigilLore = L;
})();

<script>/* js/content/ch1.js */
/* Chapter I — The Vigil (Binder drives, Listener is the Voice) */
(function () {
  'use strict';
  const L = window.VigilLore, Store = window.VigilStore, UI = window.VigilUI;
  const ART = window.VigilArt.ch1; // the nine Houses and their banners (js/art/scenes-ch1.js)

  if (document.head) document.head.appendChild(Object.assign(document.createElement('style'), { textContent: `
    body[data-chapter="ch1"] .seats-pz .pz-status { font-family: var(--serif); font-size: 16px; letter-spacing: 0; text-transform: none; line-height: 1.45; color: var(--ink); }
