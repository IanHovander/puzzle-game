<script>/* js/core/engine.js */
/* Scene runner for the Hearth (main screen). Data-driven: chapters -> scenes. */
(function () {
  'use strict';
  const UI = window.VigilUI, Store = window.VigilStore, Audio = window.VigilAudio, FX = window.VigilFX, Input = window.VigilInput;
  const Game = { chapters: [], scenes: {}, sceneChapter: {}, puzzles: {}, hooks: {} };
  let dom = {};
  let currentArt = null, currentScene = null, hintCtl = null, cancelToken = 0;

  /* ---------- Registration ---------- */
  Game.addChapter = function (ch) {
    Game.chapters.push(ch);
    for (const id in ch.scenes) { const s = ch.scenes[id]; s.id = id; Game.scenes[id] = s; Game.sceneChapter[id] = ch.id; }
  };
  Game.registerPuzzle = function (type, fn) { Game.puzzles[type] = fn; };
  Game.chapter = (id) => Game.chapters.find(c => c.id === id);
  Game.currentChapter = () => Game.chapter(Game.sceneChapter[currentScene && currentScene.id]);

  /* ---------- Boot ---------- */
  Game.mount = function (ids) {
    dom = {};
    for (const k in ids) dom[k] = document.getElementById(ids[k]);
    FX.mount(dom.fx);
    dom.hint.addEventListener('click', () => Game.showHint());
    const SOUND_ON = `<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5" stroke-linecap="round"/></g></svg>`, SOUND_OFF = `<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M15.5 9a4 4 0 010 6" stroke-linecap="round"/><path d="M18 6.5a7.5 7.5 0 010 11" stroke-linecap="round"/></g></svg>`;
    const muteLabel = () => { const m = Audio.isMuted(); dom.mute.innerHTML = (m ? SOUND_OFF : SOUND_ON) + '<span>' + (m ? 'Muted' : 'Sound') + '</span>'; dom.mute.title = m ? 'Sound is off' : 'Sound is on'; };
    dom.mute.addEventListener('click', () => { Audio.init(); Audio.toggleMute(); muteLabel(); });
    muteLabel();
    dom.menu.addEventListener('click', () => Game.showMenu());
    setInterval(() => { dom.timer.textContent = Store.elapsedText(); }, 500);
    document.addEventListener('keydown', (e) => { if (e.key === ' ' && !e.target.matches('input,textarea,button')) { UI.requestSkip(); } });
    dom.text.addEventListener('click', () => UI.requestSkip());
    document.addEventListener('pointerdown', () => Audio.init(), { once: true });
    document.addEventListener('keydown', () => Audio.init(), { once: true });
  };

  Game.begin = function (firstScene) {
    Store.startTimer();
    Game.go(firstScene);
  };
  Game.resume = function () {
    Store.startTimer();
    const s = Store.state.scene;
    if (s && Game.scenes[s]) Game.go(s); else Game.go(Game.chapters[0].start);
  };

  /* ---------- Presentation ---------- */
  function setArt(name, params) {
    const key = name + JSON.stringify(params || {});
    if (key === currentArt) return;
    currentArt = key;
    const Art = window.VigilArt;
    const html = Art && Art.render ? Art.render(name, params || {}) : '';
    const next = UI.el('div', { class: 'art-layer', html });
    dom.stage.appendChild(next);
    requestAnimationFrame(() => next.classList.add('in'));
    const olds = Array.from(dom.stage.querySelectorAll('.art-layer')).filter(x => x !== next);
    olds.forEach(o => { o.classList.add('out'); setTimeout(() => o.remove(), 1400); });
    if (Art && Art.animate) Art.animate(name, next, params || {});
  }
  function setChapterLabel(ch) {
    dom.chapter.textContent = ch ? (ch.label || ch.title) : '';
    document.body.dataset.chapter = ch ? ch.id : '';
  }
  Game.setArt = setArt;
  /* Persistent countdown shown in the top bar (the Finale's midnight). */
  Game.clock = (function () {
    let el = null, endAt = 0, iv = null, onZero = null, running = false;
    function ensure() { if (!el) { el = UI.el('span', { id: 'midnight', class: 'hidden' }); dom.timer.parentNode.insertBefore(el, dom.timer); } return el; }
    /* MIDNIGHT_LEFT is written straight into flags here and, until this pass, never saved: the only
       thing that ever put it on disk was Store.startTimer's fifteen-second heartbeat, so a reload
       could hand back up to fifteen seconds -- and, worse, hand back a penalty charged in between.
       ch7 prices its whole retry economy in this clock (js/content/ch7.js, sigilPrice), so a
       refundable clock is ADVERSARIAL 7 in the Finale. Every discrete event saves now, and the
       steady drain saves on a five-second grid, which bounds a reload's drift to five seconds of
       elapsed night and none of any charge. Store.save() is a single localStorage write. */
    let savedAt = 0;
    function render(force) { const left = Math.max(0, endAt - Date.now()); const s = Math.ceil(left / 1000); el.textContent = 'MIDNIGHT ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); el.classList.toggle('urgent', s <= 60); Store.state.flags.MIDNIGHT_LEFT = s; const zero = left <= 0 && running; if (zero) { running = false; clearInterval(iv); iv = null; } if (force || zero || Math.abs(s - savedAt) >= 5) { savedAt = s; Store.save(); } if (zero) { Audio.sfx('boom'); if (onZero) onZero(); } }
    return {
      start: (seconds, cb) => { ensure(); endAt = Date.now() + seconds * 1000; onZero = cb; running = true; el.classList.remove('hidden'); if (iv) clearInterval(iv); iv = setInterval(render, 250); render(true); },
      resume: (cb) => { const s = Store.state.flags.MIDNIGHT_LEFT; if (s > 0) Game.clock.start(s, cb); },
      penalty: (seconds) => { if (!running) return; endAt -= seconds * 1000; render(true); UI.toast('Midnight comes ' + seconds + ' seconds closer.', 2200, 'bad'); },
      bonus: (seconds) => { if (!running) return; endAt += seconds * 1000; render(true); },
      stop: () => { running = false; if (iv) clearInterval(iv); iv = null; if (el) el.classList.add('hidden'); Store.save(); },
      left: () => Math.max(0, Math.ceil((endAt - Date.now()) / 1000)),
      running: () => running,
    };
  })();
  Game.flame = function (level) { const f = document.querySelector('#flame .flame-bar > div'); if (f) f.style.width = Math.round(Math.max(0, Math.min(1, level)) * 100) + '%'; Store.set('FLAME', level); };

  /* ---------- Scene execution ---------- */
  Game.go = async function (id) {
    const scene = typeof id === 'function' ? Game.scenes[id(Store.state)] : Game.scenes[id];
    if (!scene) { console.error('No scene', id); return; }
    const myToken = ++cancelToken;
    if (hintCtl) { hintCtl = null; }
    Input.deactivate();
    currentScene = scene;
    const ch = Game.chapter(Game.sceneChapter[scene.id]);
    Store.visit(scene.id, ch.id);
    setChapterLabel(ch);
    if (scene.mood || ch.mood) Audio.mood(scene.mood || ch.mood);
    if (scene.fx !== undefined || ch.fx !== undefined) FX.set(scene.fx !== undefined ? scene.fx : ch.fx, scene.fxIntensity);
    setArt(scene.art || ch.art || 'blank', typeof scene.artParams === 'function' ? scene.artParams(Store.state) : scene.artParams);
    if (scene.flame != null || ch.flame != null) Game.flame(scene.flame != null ? scene.flame : ch.flame);
    if (scene.enter) { try { scene.enter(Store.state); } catch (e) { console.error(e); } }
    if (scene.sfx) Audio.sfx(scene.sfx);
    /* The bell is lit by the LADDER, not by the scene's type. It used to be lit for every
       type:'puzzle' scene, and six of them carry no hints array -- ch0_practice, ch0_carve
       (which light it twice in the Prologue, before the scene that teaches what it is),
       ch6_practice, ch6_round1, ch6_round3 (a reflex round gets a note and a practice pass
       instead of a ladder, STYLE R10.26) and ch7_binding. Game.showHint returns silently on
       all six, so the bell was a live control that did nothing. api.setHints is called from
       exactly one place (`if (scene.hints)` below) and un-hides the bell itself, so nothing
       that has a ladder loses it. */
    dom.hint.classList.toggle('hidden', !scene.hints);
    dom.hint.classList.remove('attention');

    UI.clear(dom.text); UI.clear(dom.actions); UI.clear(dom.widget);
    dom.widget.classList.toggle('hidden', scene.type !== 'puzzle' && scene.type !== 'custom' && scene.type !== 'reaction' && scene.type !== 'token');
    dom.text.classList.toggle('narrow', !!(scene.type === 'puzzle' || scene.type === 'custom' || scene.type === 'reaction'));

    const text = typeof scene.text === 'function' ? scene.text(Store.state) : (scene.text || []);
    if (scene.title) dom.text.appendChild(UI.el('h2', { class: 'scene-title', text: scene.title }));
    await UI.typewrite(dom.text, text, { speed: scene.speed });
    if (myToken !== cancelToken) return;

    const api = makeApi(scene, ch, myToken);
    switch (scene.type || 'story') {
      case 'story': return runStory(scene, api);
      case 'choice': return runChoice(scene, api);
      case 'puzzle': return runPuzzle(scene, api);
      case 'reaction': return runPuzzle(scene, api);
      case 'code': return runCode(scene, api, ch);
      case 'token': return runToken(scene, api);
      case 'flow': return runFlow(scene, api, ch);
      case 'custom': return runCustom(scene, api);
      case 'end': return runEnd(scene, api);
    }
  };

  function makeApi(scene, ch, token) {
    return {
      scene, chapter: ch, state: Store.state, store: Store, ui: UI, audio: Audio, fx: FX, input: Input,
      text: dom.text, actions: dom.actions, widget: dom.widget,
      alive: () => token === cancelToken,
      go: (id) => { if (token === cancelToken) Game.go(resolveNext(id, scene)); },
      button: (label, fn, cls) => { const b = UI.el('button', { class: 'btn ' + (cls || ''), text: label, onclick: () => { Audio.sfx('click'); fn(); } }); dom.actions.appendChild(b); return b; },
      note: (t) => Store.note(t),
      say: async (paragraphs) => { await UI.typewrite(dom.text, paragraphs, {}); },
      setHints: (ladder) => { hintCtl = { ladder, id: scene.id }; dom.hint.classList.remove('hidden'); },
      flashArt: (n, p) => setArt(n, p),
    };
  }
  function resolveNext(next, scene) {
    if (next == null) next = scene.next;
    if (typeof next === 'function') next = next(Store.state);
    return next;
  }

  function runStory(scene, api) {
    if (scene.auto) { setTimeout(() => api.go(scene.next), scene.auto); return; }
    api.button(scene.button || 'Continue', () => api.go(scene.next), 'primary');
  }

  async function runChoice(scene, api) {
    const opts = (typeof scene.options === 'function' ? scene.options(Store.state) : scene.options).filter(o => !o.if || o.if(Store.state));
    let ctl = null;
    const holder = UI.el('div', { class: 'choices' });
    if (scene.prompt) dom.actions.appendChild(UI.el('div', { class: 'prompt', html: UI.rich(scene.prompt) }));
    dom.actions.appendChild(holder);
    const pick = async (o, how) => {
      if (!api.alive()) return;
      if (ctl) ctl.cancel();
      Array.from(holder.children).forEach(b => b.disabled = true);
      // An option may ask the table for words of its own.
      if (o.ask) {
        const typed = await UI.ask(o.ask.prompt, o.ask.value || '', { plain: true, ok: o.ask.ok || 'That one', cancel: 'Back', maxlength: o.ask.maxlength || 28 });
        const v = (typed || '').trim();
        if (!v) { Array.from(holder.children).forEach(b => b.disabled = false); return; }
        Store.set(o.ask.set, v);
      }
      if (scene.choice) Store.choose(scene.choice, o.id);
      if (o.set) for (const k in o.set) Store.set(k, typeof o.set[k] === 'function' ? o.set[k](Store.state) : o.set[k]);
      if (o.note) Store.note(typeof o.note === 'function' ? o.note(Store.state) : o.note);
      if (o.sfx) Audio.sfx(o.sfx);
      Store.save();
      if (o.after) { UI.clear(holder); UI.typewrite(dom.text, typeof o.after === 'function' ? o.after(Store.state) : o.after).then(() => api.button('Continue', () => api.go(o.next), 'primary')); }
      else api.go(o.next);
    };
    opts.forEach((o, i) => {
      const b = UI.el('button', { class: 'btn choice' + (o.cls ? ' ' + o.cls : ''), html: `<span class="choice-num">${i + 1}</span><span>${UI.rich(typeof o.text === 'function' ? o.text(Store.state) : o.text)}</span>`, onclick: () => { Audio.sfx('click'); pick(o, 'click'); } });
      if (o.sub) b.appendChild(UI.el('span', { class: 'choice-sub', html: UI.rich(o.sub) }));
      holder.appendChild(b);
    });
    if (scene.timer) {
      const tw = UI.el('div', { class: 'timer-note', html: UI.rich(scene.timerText || '*Decide quickly.*') });
      dom.actions.insertBefore(tw, holder);
      ctl = UI.countdown(dom.actions, scene.timer);
      const r = await ctl.promise;
      if (r === 'timeout' && api.alive()) {
        Audio.sfx('fail');
        const to = scene.timeout || opts[opts.length - 1];
        const o = typeof to === 'string' ? opts.find(x => x.id === to) || { id: to, next: to } : to;
        if (scene.choice) Store.choose(scene.choice, o.id === undefined ? 'timeout' : o.id);
        Store.set(scene.choice + '_timedout', true);
        pick(Object.assign({}, o, { id: o.id }), 'timeout');
      }
    }
  }

  async function runPuzzle(scene, api) {
    const fn = Game.puzzles[scene.puzzle];
    if (!fn) { dom.widget.appendChild(UI.el('p', { text: 'Missing puzzle: ' + scene.puzzle })); api.button('Skip', () => api.go(scene.next)); return; }
    const cfg = typeof scene.config === 'function' ? scene.config(Store.state) : (scene.config || {});
    if (scene.hints) api.setHints(scene.hints);
    dom.widget.appendChild(UI.el('div', { class: 'widget-inner' }));
    const box = dom.widget.firstChild;
    const pid = scene.puzzleId || scene.id;
    if (Store.isSolved(pid) && !scene.replayable) {
      box.appendChild(UI.el('p', { class: 'para', text: 'This ward has already been opened.' }));
      api.button('Continue', () => api.go(scene.next), 'primary'); return;
    }
    let result;
    const parTimers = [];
    if (scene.par) { const mins = Array.isArray(scene.par) ? scene.par : [scene.par]; mins.forEach((m, i) => parTimers.push(setTimeout(() => { if (!api.alive()) return; dom.hint.classList.add('attention'); UI.toast(i === 0 ? 'The fire stirs. It has something to whisper, if you ask.' : 'The fire dims a little. Ask it.', 3200); Audio.sfx('chime'); }, m * 60000))); }
    try { result = await fn(box, cfg, api); } catch (e) { console.error(e); result = { error: e }; }
    parTimers.forEach(clearTimeout);
    if (!api.alive()) return;
    Store.markSolved(pid);
    if (scene.onSolve) scene.onSolve(Store.state, result);
    if (result && result.set) for (const k in result.set) Store.set(k, result.set[k]);
    Store.save();
    if (scene.solvedText) {
      if (scene.clearWidget) { UI.clear(dom.widget); dom.widget.classList.add('hidden'); dom.text.classList.remove('narrow'); }
      await UI.typewrite(dom.text, typeof scene.solvedText === 'function' ? scene.solvedText(Store.state, result) : scene.solvedText);
      if (!api.alive()) return;
    }
    const next = typeof scene.next === 'function' ? scene.next(Store.state, result) : scene.next;
    if (scene.autoNext) api.go(next); else api.button(scene.button || 'Continue', () => api.go(next), 'primary');
  }

  function runCode(scene, api, ch) {
    const code = scene.code || ch.code;
    let cast = null;
    if (scene.cast) cast = typeof scene.cast === 'function' ? scene.cast(Store.state) : scene.cast;
    else if (!scene.code && window.VigilLore && window.VigilLore.chapter(ch.id) && window.VigilLore.chapter(ch.id).cast.length) {
      const spec = window.VigilLore.chapter(ch.id).cast; cast = window.VigilShared.cast(code, window.VigilShared.pack(spec, Store.state.flags));
    }
    if (cast) Store.state.flags['CAST_' + code] = cast;
    const box = UI.el('div', { class: 'attune' }, [
      UI.el('div', { class: 'attune-label', text: scene.codeLabel || (cast ? 'Word of attunement, and the mark beside it — on every phone' : 'Word of attunement — enter it on every phone') }),
      UI.el('div', { class: 'attune-word', html: UI.esc(code) + (cast ? `<span class="attune-cast">·${UI.esc(cast)}</span>` : '') }),
      UI.el('div', { class: 'attune-sub', html: UI.rich(scene.codeSub || 'Type this word into every phone. Each of you gets a different page — read yours, and only yours. Say nothing until all four of you have looked up.') }),
    ]);
    if (scene.roles) box.appendChild(UI.el('div', { class: 'attune-roles', html: UI.rich(typeof scene.roles === 'function' ? scene.roles(Store.state) : scene.roles) }));
    dom.actions.appendChild(box);
    Audio.sfx('unlock');
    if (scene.sightSeconds) { const c = UI.countdown(box, scene.sightSeconds); c.promise.then(() => {}); }
    api.button(scene.button || 'All phones are ready', () => api.go(scene.next), 'primary');
  }

  /* Token entry: scene.slots = [{label, player}] ; scene.decode(token, slotIndex, state) => value|null ; scene.onTokens(values, state) */
  function runToken(scene, api) {
    const slots = typeof scene.slots === 'function' ? scene.slots(Store.state) : scene.slots;
    const box = UI.el('div', { class: 'token-entry' });
    const inputs = [];
    slots.forEach((s, i) => {
      const row = UI.el('div', { class: 'token-row' + (s.player != null ? ' p' + s.player : '') });
      row.appendChild(UI.el('label', { text: s.label }));
      const inp = UI.el('input', { class: 'field token', maxlength: s.length || 6, autocomplete: 'off', spellcheck: 'false', placeholder: '· · · ·' });
      inp.addEventListener('input', () => { inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); inp.classList.remove('wrong'); if (inp.value.length >= (s.length || 6) && inputs[i + 1]) inputs[i + 1].focus(); });
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
      row.appendChild(inp); box.appendChild(row); inputs.push(inp);
    });
    dom.widget.appendChild(box);
    if (scene.prompt) dom.actions.appendChild(UI.el('div', { class: 'prompt', html: UI.rich(scene.prompt) }));
    setTimeout(() => inputs[0] && inputs[0].focus(), 50);
    let tries = 0;
    const submit = () => {
      const values = []; let bad = false;
      inputs.forEach((inp, i) => {
        const v = scene.decode(inp.value.trim().toUpperCase(), i, Store.state);
        if (v == null) { bad = true; inp.classList.add('wrong'); } else values.push(v);
      });
      if (bad) { tries++; Audio.sfx('wrong'); UI.toast(scene.badText || 'One of the words is not attuned. Check the phones and try again.', 2400, 'bad'); if (tries >= 3 && scene.stuckText) setTimeout(() => UI.toast(scene.stuckText, Math.max(5000, scene.stuckText.split(' ').length * 320)), 2500); return; }
      Audio.sfx('success');
      Store.state.tokens[scene.id] = values; Store.save();
      if (scene.onTokens) scene.onTokens(values, Store.state);
      Store.save();
      UI.clear(dom.actions);
      const next = typeof scene.next === 'function' ? scene.next(Store.state, values) : scene.next;
      api.go(next);
    };
    api.button(scene.button || 'Speak the words', submit, 'primary');
  }

  function runFlow(scene, api, ch) {
    const flow = scene.flow || ch.flow;
    if (flow) {
      const done = new Set(Store.state.visited);
      // allow nodes to declare a predicate
      flow.nodes.forEach(n => { if (n.when && n.when(Store.state)) done.add(n.id); });
      const wrap = UI.el('div', { class: 'flow-panel' });
      wrap.appendChild(UI.el('h3', { class: 'flow-title', text: (scene.flowTitle || (ch.title + ' — the paths you walked')) }));
      const stats = typeof scene.stats === 'function' ? scene.stats(Store.state) : null;
      /* The panel goes in EMPTY first and is measured, then filled. UI.flowchart now lays the chart out
         in real pixels at the 17px type floor, so it has to be told how much room it has -- and the room
         only exists once .flow-panel is in the DOM, because that is what widens the column
         (css/theme.css, `#panel:has(.flow-panel)`). Measuring before appending would size every chart
         to the narrow two-column width and put the type back under the floor. */
      dom.actions.appendChild(wrap);
      /* the room the chart actually has: the panel's own box, less the title and the ledger under it */
      /* The room the chart actually has. Height comes from the panel's computed max-height (css/hearth.css
         caps .flow-panel at the viewport), not from clientHeight -- the panel is still empty at this
         point, so clientHeight is the title and nothing else, and a chart sized against that comes out
         half a screen too tall. */
      const cap = parseFloat(getComputedStyle(wrap).maxHeight);
      /* -22px: the panel is still empty when it is measured, so it has no vertical scrollbar yet, and
         most charts make it scroll. Sizing to the full width put every chart 16px off the side. */
      const avail = { w: Math.max(320, wrap.clientWidth - 22),
        h: Math.max(200, (isFinite(cap) ? cap : window.innerHeight - 220) - wrap.firstChild.offsetHeight - (stats ? 62 : 0) - 26) };
      wrap.appendChild(UI.flowchart(flow, done, { avail }));
      if (stats) wrap.appendChild(UI.el('div', { class: 'flow-stats', html: UI.rich(stats) }));
    }
    api.button(scene.button || 'Onward', () => api.go(scene.next), 'primary');
  }

  async function runCustom(scene, api) {
    const box = UI.el('div', { class: 'widget-inner' }); dom.widget.appendChild(box);
    let next;
    const started = (() => { try { return scene.run(box, api); } catch (e) { console.error(e); return null; } })();
    /* A custom scene need not build a widget -- ch7_cold puts one button in #actions and nothing else --
       and an empty #widget still draws its panel: a 644x26px bordered box above the button, on the beat
       where midnight goes out. Hide the panel while it is empty, and give the text back its full width;
       the observer puts it back the moment the scene draws something. */
    const fit = () => { const empty = !box.childNodes.length; dom.widget.classList.toggle('hidden', empty); dom.text.classList.toggle('narrow', !empty); };
    fit();
    const mo = typeof MutationObserver === 'function' ? new MutationObserver(fit) : null;
    if (mo) mo.observe(box, { childList: true });
    try { next = await started; } catch (e) { console.error(e); } finally { if (mo) mo.disconnect(); }
    if (!api.alive()) return;
    if (next === false) return; // scene handled navigation itself
    api.go(next || scene.next);
  }

  function runEnd(scene, api) {
    Store.pauseTimer();
    if (scene.render) scene.render(dom.actions, api);
    /* This erases the save -- the one Chapter select and 'see another ending in twenty minutes' both
       depend on -- and it sat unguarded next to two harmless buttons on the last screen of a two-hour
       game, at midnight, in front of a tired table. 'Abandon game' in the Menu has always confirmed;
       this is the same action and did not. */
    api.button(scene.button || 'Begin again', async () => {
      if (await UI.confirm('Erase this night and start over? The words, the choices and the ending all go.', { danger: true, ok: 'Erase it' })) { Store.reset(); location.reload(); }
    }, 'ghost');
  }

  /* ---------- Hints ---------- */
  Game.showHint = function () {
    const scene = currentScene; if (!scene) return;
    const ladder = (hintCtl && hintCtl.id === scene.id ? hintCtl.ladder : null) || scene.hints;
    if (!ladder) return;
    const id = scene.puzzleId || scene.id;
    const used = Store.state.hintsUsed[id] || 0;
    const wrap = UI.el('div', { class: 'hints' });
    const list = UI.el('div', { class: 'hint-list' });
    const render = () => {
      UI.clear(list);
      const n = Store.state.hintsUsed[id] || 0;
      ladder.forEach((h, i) => {
        const text = typeof h === 'function' ? h(Store.state) : h;
        if (i < n) list.appendChild(UI.el('div', { class: 'hint revealed' + (i === ladder.length - 1 ? ' solution' : ''), html: `<span class="hint-n">${i === ladder.length - 1 ? 'Answer' : 'Hint ' + (i + 1)}</span>${UI.rich(text)}` }));
        else if (i === n) list.appendChild(UI.el('button', { class: 'btn hint-btn' + (i === ladder.length - 1 ? ' danger' : ''), text: i === ladder.length - 1 ? 'Reveal the answer (last resort)' : 'Ask the Vigil for a hint (' + (i + 1) + ' of ' + (ladder.length - 1) + ')', onclick: () => { Store.state.hintsUsed[id] = i + 1; Store.inc('hintsTotal'); Store.save(); Audio.sfx('chime'); render(); } }));
      });
    };
    render();
    wrap.appendChild(UI.el('p', { class: 'small', text: 'Hints cost nothing but pride. The Vigil keeps count.' }));
    wrap.appendChild(list);
    UI.modal(wrap, { title: 'The Vigil whispers', closeText: 'Back to the ward' });
    void used;
  };

  /* ---------- Menu ---------- */
  Game.showMenu = function () {
    const box = UI.el('div', {});
    box.appendChild(UI.el('p', { html: `Elapsed: <strong>${Store.elapsedText()}</strong> · Hints used: <strong>${Store.get('hintsTotal', 0)}</strong>` }));
    const names = Store.state.names.map((n, i) => `<span class="pname p${i}">${UI.esc(n || 'Player ' + (i + 1))}</span> <span class="small">(${Input.keyLabel(i)})</span>`).join(' &nbsp; ');
    box.appendChild(UI.el('p', { html: names }));
    const row = UI.el('div', { class: 'row' });
    row.appendChild(UI.el('button', { class: 'btn small', text: 'Companion QR', onclick: () => { m.close(); Game.showQR(); } }));
    row.appendChild(UI.el('button', { class: 'btn small', text: 'Replay scene', onclick: () => { m.close(); Game.go(currentScene.id); } }));
    row.appendChild(UI.el('button', { class: 'btn small', text: 'Chapter select', onclick: () => { m.close(); Game.showChapterSelect(); } }));
    row.appendChild(UI.el('button', { class: 'btn small danger', text: 'Abandon game', onclick: async () => { if (await UI.confirm('Erase this playthrough and start over?', { danger: true, ok: 'Erase it' })) { Store.reset(); location.reload(); } } }));
    box.appendChild(row);
    const row2 = UI.el('div', { class: 'row' });
    row2.appendChild(UI.el('button', { class: 'btn small ghost', text: 'Copy save code', onclick: () => { const code = btoa(unescape(encodeURIComponent(JSON.stringify(Store.state)))); const ta = UI.el('textarea', { class: 'field plain', style: { height: '90px', fontSize: '12px', letterSpacing: '0', textTransform: 'none' } }); ta.value = code; box.appendChild(UI.el('p', { class: 'small', text: 'Paste this into another laptop\'s menu to continue there (elapsed time carries over).' })); box.appendChild(ta); ta.select(); try { navigator.clipboard.writeText(code); UI.toast('Save code copied.'); } catch (e) {} } }));
    row2.appendChild(UI.el('button', { class: 'btn small ghost', text: 'Paste save code', onclick: async () => { const v = await UI.ask('Paste the save code:', '', { plain: true, ok: 'Load', maxlength: 100000 }); if (!v) return; try { const st = JSON.parse(decodeURIComponent(escape(atob(v.trim())))); if (!st || st.version !== 1) throw new Error('bad'); Store.state = Object.assign(Store.state, st); Store.save(); location.reload(); } catch (e) { UI.notice('That code is not a save for this game.'); } } }));
    box.appendChild(row2);
    const row3 = UI.el('div', { class: 'row' });
    row3.appendChild(UI.el('button', { class: 'btn small ghost', text: 'Words of the night', onclick: () => { m.close(); Game.showWords(); } }));
    box.appendChild(row3);
    const m = UI.modal(box, { title: 'The Hearth' });
  };
  /* THE RECOVERY THIS GAME DOCUMENTS AND DID NOT HAVE. Every attunement writes its mark into the save
     (`Store.state.flags['CAST_' + code]`, a few lines up) and renders it exactly once, on the scene
     that produced it -- `node tools/flag-map.js` reported CAST_ as "set but never read". Seven of the
     nine chapters carry a mark (ch0 and ch1 have `cast: []`), and js/companion.js refuses a
     re-attunement without one: "This word has a mark beside it on the Hearth. Enter it too."
     So docs/HOST.md's instruction -- if a phone dies, open the Companion on another one, choose the
     same seat and type the current word again -- was FALSE for seven chapters, and it is the recovery
     path for the four likeliest disasters at a real table: a flat battery, a late arrival, a lost
     phone, and stopping for a week. The only working recovery was Chapter select, which overwrites
     the current scene and costs the table their place.
     The spoiler gate is the one showChapterSelect already ships, copied deliberately rather than
     invented: a chapter is named, and its word shown, once the table has been there. */
  Game.showWords = function () {
    const box = UI.el('div', { class: 'chapter-list' });
    Game.chapters.forEach(ch => {
      if (ch.hidden || !ch.code) return;
      const reached = Store.state.visited.includes(ch.start);
      const mark = Store.state.flags['CAST_' + ch.code];
      const label = reached
        ? `<strong>${UI.esc(ch.label || 'Chapter')}</strong> — ${UI.esc(ch.code)}${mark ? ' · <strong>' + UI.esc(mark) + '</strong>' : ''}`
        : `${UI.esc(ch.label || 'Chapter')} — · · ·`;
      box.appendChild(UI.el('p', { class: 'small' + (reached ? '' : ' dim'), html: label }));
    });
    box.appendChild(UI.el('p', { class: 'small', text: 'A word is shown once you have said it. To bring a phone back — a flat battery, a late arrival, a new phone — open the Companion on it, choose the same seat, and enter the word and the mark for the chapter you are in.' }));
    const m = UI.modal(box, { title: 'Words of the night' });
  };
  /* A chapter's TITLE is a spoiler until the table gets there: from the first scene of the Prologue this
     list used to name the Ember Vault, the Whispering Gallery, the Oath, the Long Stair, the Bells of
     Thornhallow, One Born of Four and What the Fire Left Behind -- seven things nobody had met, and two
     of them the ending. The list still shows every chapter, because it is the recovery tool and a host
     has to be able to jump; it shows the number and withholds the name, the way the Map of the Night
     already prints `· · ·` for a place the table has not walked into (js/core/map.js:31). */
  Game.showChapterSelect = function () {
    const box = UI.el('div', { class: 'chapter-list' });
    Game.chapters.forEach(ch => {
      if (ch.hidden) return;
      const reached = Store.state.visited.includes(ch.start);
      const name = reached ? (ch.label ? ch.label + ' — ' + ch.title : ch.title) : (ch.label || 'Chapter') + ' — · · ·';
      box.appendChild(UI.el('button', { class: 'btn small' + (reached ? '' : ' ghost'), text: name, onclick: () => { m.close(); Game.go(ch.start); } }));
    });
    box.appendChild(UI.el('p', { class: 'small', text: 'A chapter is named once you have been there. Jumping ahead skips story and may leave choices unset. Use to recover from a mistake.' }));
    const m = UI.modal(box, { title: 'Chapters' });
  };
  Game.showQR = function () {
    const url = Game.companionUrl();
    const box = UI.el('div', { class: 'qr-box' });
    if (url) {
      try { const q = qrcode(0, 'M'); q.addData(url); q.make(); box.appendChild(UI.el('div', { class: 'qr', html: q.createSvgTag({ cellSize: 6, margin: 2 }) })); } catch (e) {}
      box.appendChild(UI.el('p', { class: 'qr-url', text: url }));
      const row = UI.el('div', { class: 'row', style: { justifyContent: 'center' } });
      row.appendChild(UI.el('button', { class: 'btn small', text: 'Copy the link', onclick: (e) => {
        const done = () => { e.target.textContent = 'Copied'; setTimeout(() => { e.target.textContent = 'Copy the link'; }, 1600); };
        try { navigator.clipboard.writeText(url).then(done, () => {}); } catch (x) {}
      } }));
      box.appendChild(row);
      if (/claude\.ai/.test(url)) box.appendChild(UI.el('p', { class: 'fine', style: { marginTop: '10px' }, html: UI.rich('If a phone opens the Claude app instead of the page, that phone has the app installed and is grabbing the link. Copy the link above and paste it into the phone\'s browser, or open it once in the app and choose *Open in browser*.') }));
    } else {
      box.appendChild(UI.el('p', { html: 'This page was opened from a file, so phones cannot reach it. Host the folder (for example <code>python3 -m http.server 8080</code>) and open <code>http://YOUR-LAN-IP:8080/</code> on this screen and <code>.../companion.html</code> on phones. GitHub Pages also works.' }));
    }
    UI.modal(box, { title: 'Companion — open on each phone' });
  };
  Game.companionUrl = function () {
    if (window.COMPANION_URL) return window.COMPANION_URL;
    if (location.protocol === 'file:') return null;
    return new URL('companion.html', location.href).href;
  };

  window.Game = Game;
})();

</script>
<script>/* js/core/map.js */
/* The Map of the Night: a vellum chart, one panel per chapter, that turns over at the Long Stair.

   TWO DEFECTS FIXED IN THE INTEGRATE PASS, both invisible from inside any chapter.

   1. IT DREW EVERY CHAPTER'S PICTOGRAM FROM THE PROLOGUE. The label was gated -- an unreached panel
      printed '· · ·' -- but the icon was drawn regardless, at opacity 0.22, so a table opening the
      map in Chapter I was shown a bell, a spiral stair, a crossed circle and a rising sun: the
      bell-chamber, the Long Stair, the Cold and Dawn, seven things they had not met and two of them
      the shape of the ending. This is the same defect the Menu had (engine.js showChapterSelect
      printed all nine chapter titles) and it was fixed there in this sweep while the map, which is
      the OTHER thing that lists all nine, was not. An unreached panel is a sealed fold now: the card,
      a wax seal, and nothing else.

   2. THE TYPE WAS 10px AND 13px AGAINST A 17px FLOOR. Nine columns of place names in one 900-unit
      row, scaled into an 800px modal, put the labels at 13px and 'THE SHEET TURNS' at 10px at every
      viewport measured. It is the flowchart's disease and it has the flowchart's cure (js/core/ui.js,
      UI.flowchart): lay the chart out in REAL CSS PIXELS for the box it is going into, at a type
      size that is the floor rather than the remainder, instead of drawing it big and scaling it down.
      Nine columns in 800px is 89px a column and 'The bell-chamber' needs about 152px at 17px, so one
      row cannot be made to work by any choice of numbers -- the sheet is laid out in TWO rows, which
      is what it was always describing: five panels above the turn (the school, on the world's
      surface) and four below it (the under-marches). The turn is drawn between them.
      Measured after: every label 17px, the whole sheet 800x352 inside an 800px modal box, nothing
      clipped and nothing scaled. */
(function () {
  'use strict';
  const UI = window.VigilUI, Store = window.VigilStore;
  const PANELS = [
    { id: 'ch0', label: 'The dormitory', icon: '<rect x="-16" y="-6" width="32" height="14" rx="2"/><rect x="-16" y="-14" width="6" height="22" rx="1"/><circle cx="12" cy="-12" r="3"/>' },
    { id: 'ch1', label: 'The Great Hall', icon: '<path d="M-18,12 L-18,-6 L0,-16 L18,-6 L18,12 Z"/><path d="M-8,12 L-8,0 L8,0 L8,12"/>' },
    { id: 'ch2', label: 'The Vault', icon: '<path d="M-14,12 L-14,-4 A14,14 0 0 1 14,-4 L14,12"/><circle cx="0" cy="2" r="4"/>' },
    { id: 'ch3', label: 'The Gallery', icon: '<rect x="-16" y="-10" width="9" height="12"/><rect x="-4" y="-10" width="9" height="12"/><rect x="8" y="-10" width="9" height="12"/><path d="M-18,10 L18,10"/>' },
    { id: 'ch4', label: 'The study', icon: '<rect x="-16" y="-12" width="32" height="6"/><rect x="-16" y="-2" width="32" height="6"/><rect x="-16" y="8" width="32" height="6"/>' },
    { id: 'ch5', label: 'The Long Stair', icon: '<path d="M-16,12 L-16,6 L-8,6 L-8,0 L0,0 L0,-6 L8,-6 L8,-12 L16,-12"/>', turn: true },
    { id: 'ch6', label: 'The bell-chamber', icon: '<path d="M-10,6 L-10,0 Q-10,-12 0,-13 Q10,-12 10,0 L10,6 Z"/><circle cx="0" cy="10" r="2.5"/>' },
    { id: 'ch7', label: 'The Cold', icon: '<circle cx="0" cy="0" r="12"/><path d="M0,-12 L0,12 M-12,0 L12,0" opacity=".5"/>' },
    { id: 'ch8', label: 'Dawn', icon: '<path d="M-16,8 L16,8"/><path d="M-10,8 A10,10 0 0 1 10,8"/><path d="M0,-10 L0,-14 M-9,-6 L-12,-9 M9,-6 L12,-9"/>' },
  ];
  const TURN_AT = PANELS.findIndex(p => p.turn);          // the sheet turns over at the Long Stair
  const F = 17;                                            // the readability floor, in real screen pixels

  function reached(id) { const ch = window.Game && window.Game.chapter(id); if (!ch) return false; return Store.state.visited.some(v => window.Game.sceneChapter[v] === id); }

  /* Wrap to at most two lines at the given character width; returns the lines. */
  function wrap(text, chars) {
    const words = String(text).split(' '); const lines = []; let cur = '';
    for (const w of words) {
      if (!cur) { cur = w; continue; }
      if ((cur + ' ' + w).length <= chars) cur += ' ' + w; else { lines.push(cur); cur = w; }
    }
    if (cur) lines.push(cur);
    return lines.slice(0, 2);
  }

  /* availW: the real pixel width of the box the sheet is going into. */
  function render(availW) {
    const rows = [PANELS.slice(0, TURN_AT), PANELS.slice(TURN_AT)];
    const perRow = Math.max(rows[0].length, rows[1].length);
    const W = Math.max(520, Math.round(availW || 800));
    const cw = Math.floor((W - 24) / perRow);
    const chars = Math.max(8, Math.floor((cw - 10) / (F * 0.56)));
    const lines = Math.max(...PANELS.map(p => wrap(p.label, chars).length));
    const cardW = Math.min(cw - 14, 96), cardH = 92;
    const labelH = lines * Math.round(F * 1.2);
    const rowH = cardH + 18 + labelH + 22;
    const H = 54 + rowH * 2 + 26;
    const over = reached('ch5');

    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="night-map" style="--nm-font:${F}px">`;
    s += `<defs><linearGradient id="vellum" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${over ? '#1a1830' : '#3a2f22'}"/><stop offset="1" stop-color="${over ? '#0d0c1a' : '#241b14'}"/></linearGradient></defs>`;
    s += `<rect x="6" y="6" width="${W - 12}" height="${H - 12}" rx="8" fill="url(#vellum)" stroke="rgba(212,169,78,0.35)"/>`;
    s += `<text x="${W / 2}" y="34" text-anchor="middle" fill="rgba(212,169,78,0.85)" font-family="Cinzel,serif" font-size="${F}" letter-spacing="3">${over ? 'THE UNDER-MARCHES — the world is a lid' : 'THE MAP OF THE NIGHT — Thornhallow'}</text>`;

    let prev = null;
    rows.forEach((row, r) => {
      const yTop = 54 + r * rowH;
      const cy = yTop + cardH / 2;
      row.forEach((p, i) => {
        const x = 12 + i * cw + cw / 2, on = reached(p.id);
        if (prev && on) {
          /* the thread only ever runs left to right within a row; across the turn it drops down the
             left edge, because that is what turning the sheet over does */
          const d = prev.r === r
            ? `M${prev.x},${prev.y} C${prev.x + cw * 0.4},${prev.y + 30} ${x - cw * 0.4},${cy - 30} ${x},${cy}`
            : `M${prev.x},${prev.y} C${prev.x + 40},${prev.y + 40} ${x - 40},${cy - 40} ${x},${cy}`;
          s += `<path d="${d}" fill="none" stroke="var(--gold)" stroke-width="2" opacity=".9"/>`;
        }
        s += `<g transform="translate(${x},${cy})">`;
        s += `<rect x="${-cardW / 2}" y="${-cardH / 2}" width="${cardW}" height="${cardH}" rx="6" fill="rgba(0,0,0,0.25)" stroke="${on ? 'var(--gold)' : 'rgba(255,255,255,0.15)'}" stroke-dasharray="${on ? '0' : '4 3'}"/>`;
        /* An UNREACHED panel is a sealed fold. It draws no pictogram at all: the icon used to be
           drawn for every chapter from the Prologue onward, which handed the room the bell, the
           stair, the Cold and the dawn before it had met any of them. */
        if (on) s += `<g fill="none" stroke="#f2d27a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" transform="scale(1.15)">${p.icon}</g>`;
        else s += `<g opacity="0.5"><circle cx="0" cy="0" r="9" fill="none" stroke="#7a6a52" stroke-width="2"/><path d="M-5,0 L5,0" stroke="#7a6a52" stroke-width="2" stroke-linecap="round"/></g>`;
        s += `</g>`;
        const ls = on ? wrap(p.label, chars) : ['· · ·'];
        ls.forEach((ln, k) => {
          s += `<text x="${x}" y="${yTop + cardH + 18 + k * Math.round(F * 1.2)}" text-anchor="middle" fill="${on ? '#e9e2d2' : '#777'}" font-family="Cormorant Garamond,serif" font-size="${F}">${UI.esc(ln)}</text>`;
        });
        if (on) prev = { x, y: cy, r };
      });
    });
    if (reached(PANELS[TURN_AT].id)) {
      const y = 54 + rowH - 12;
      s += `<path d="M14,${y} L${W - 14},${y}" stroke="var(--sea)" stroke-width="1" stroke-dasharray="5 5" opacity=".7"/>`;
      s += `<text x="${W / 2}" y="${y - 6}" text-anchor="middle" fill="var(--sea)" font-family="Cinzel,serif" font-size="${F}" letter-spacing="2">THE SHEET TURNS</text>`;
    }
    s += `</svg>`;
    return s;
  }

  window.VigilMap = {
    render,
    show: () => {
      /* Measure, then draw: the sheet is laid out for the box it is actually going into, the way
         UI.flowchart is, rather than drawn at a fixed size and scaled down into a smear. */
      const box = UI.el('div', { class: 'map-box' });
      const m = UI.modal(box, { title: 'The Map of the Night', cls: 'wide' });
      box.innerHTML = render(Math.max(520, box.clientWidth || 800));
      return m;
    },
  };
})();

</script>
<script>/* js/art/art.js */
/* Procedural SVG scene art. Every scene is composed from primitives; deterministic via seeded RNG. */
(function () {
  'use strict';
  const Art = { scenes: {} };
  const W = 1600, H = 900;

  function rng(seed) { let s = seed >>> 0 || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

  /* ---------- primitives ---------- */
  const P = {};
  P.sky = (top, bottom, id) => `<defs><linearGradient id="${id || 'sky'}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bottom}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#${id || 'sky'})"/>`;
  P.stars = (n, seed, maxY) => { const r = rng(seed || 7); let s = '<g class="stars">'; for (let i = 0; i < n; i++) { const x = r() * W, y = r() * (maxY || H * 0.6), rad = 0.5 + r() * 1.6, o = 0.3 + r() * 0.7; s += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${rad.toFixed(1)}" fill="#e8ecff" opacity="${o.toFixed(2)}"><animate attributeName="opacity" values="${o.toFixed(2)};${(o * 0.3).toFixed(2)};${o.toFixed(2)}" dur="${(2 + r() * 5).toFixed(1)}s" repeatCount="indefinite"/></circle>`; } return s + '</g>'; };
  P.moon = (x, y, r, color) => `<defs><radialGradient id="moonglow"><stop offset="0" stop-color="${color || '#fff3d0'}" stop-opacity=".55"/><stop offset="1" stop-color="${color || '#fff3d0'}" stop-opacity="0"/></radialGradient></defs><circle cx="${x}" cy="${y}" r="${r * 4}" fill="url(#moonglow)"/><circle cx="${x}" cy="${y}" r="${r}" fill="${color || '#fff3d0'}"/><circle cx="${x + r * 0.35}" cy="${y - r * 0.2}" r="${r * 0.9}" fill="${color || '#fff3d0'}" opacity="0"/>`;
  P.mountains = (color, seed, base, amp, n) => { const r = rng(seed || 3); let d = `M0,${H} L0,${base}`; const step = W / (n || 10); for (let i = 0; i <= (n || 10); i++) { const x = i * step, y = base - r() * amp; d += ` L${(x - step * 0.5 + r() * step * 0.4).toFixed(0)},${y.toFixed(0)} L${x.toFixed(0)},${(base - r() * amp * 0.3).toFixed(0)}`; } d += ` L${W},${H} Z`; return `<path d="${d}" fill="${color}"/>`; };
  P.fog = (y, h, color, op) => `<defs><linearGradient id="fog${y}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity="0"/><stop offset=".5" stop-color="${color}" stop-opacity="${op || 0.5}"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><rect x="0" y="${y}" width="${W}" height="${h}" fill="url(#fog${y})"/>`;
  P.ground = (y, color) => `<rect x="0" y="${y}" width="${W}" height="${H - y}" fill="${color}"/>`;
  P.tower = (x, base, w, h, color, windows) => {
    let s = `<g class="tower">`;
    s += `<path d="M${x - w / 2},${base} L${x - w / 2 + w * 0.08},${base - h} L${x + w / 2 - w * 0.08},${base - h} L${x + w / 2},${base} Z" fill="${color}"/>`;
    // battlements
    const bw = w * 0.84, bx = x - bw / 2, ty = base - h; const teeth = 7;
    for (let i = 0; i < teeth; i++) if (i % 2 === 0) s += `<rect x="${(bx + i * bw / teeth).toFixed(0)}" y="${ty - w * 0.1}" width="${(bw / teeth).toFixed(0)}" height="${w * 0.1}" fill="${color}"/>`;
    // spire
    s += `<path d="M${x - bw * 0.35},${ty - w * 0.1} L${x},${ty - h * 0.45} L${x + bw * 0.35},${ty - w * 0.1} Z" fill="${color}"/>`;
    if (windows) for (let i = 0; i < windows; i++) { const wy = base - h * (0.2 + i * 0.7 / windows); s += `<path d="M${x - w * 0.05},${wy} a${w * 0.05},${w * 0.06} 0 0 1 ${w * 0.1},0 v${w * 0.12} h-${w * 0.1} Z" fill="#ffd27a" opacity=".85"><animate attributeName="opacity" values=".85;.6;.9;.7;.85" dur="${3 + i}s" repeatCount="indefinite"/></path>`; }
    return s + '</g>';
  };
  P.door = (x, y, w, h, frame, glow) => {
    let s = `<g class="door">`;
    if (glow) s += `<defs><radialGradient id="doorglow" cx=".5" cy=".5"><stop offset="0" stop-color="${glow}" stop-opacity=".9"/><stop offset="1" stop-color="${glow}" stop-opacity="0"/></radialGradient></defs><ellipse cx="${x}" cy="${y + h * 0.4}" rx="${w * 1.6}" ry="${h * 0.9}" fill="url(#doorglow)"><animate attributeName="opacity" values="1;.6;1" dur="4s" repeatCount="indefinite"/></ellipse>`;
    s += `<path d="M${x - w / 2 - 22},${y + h} L${x - w / 2 - 22},${y + w / 2} A${w / 2 + 22},${w / 2 + 22} 0 0 1 ${x + w / 2 + 22},${y + w / 2} L${x + w / 2 + 22},${y + h} Z" fill="${frame}"/>`;
    s += `<path d="M${x - w / 2},${y + h} L${x - w / 2},${y + w / 2} A${w / 2},${w / 2} 0 0 1 ${x + w / 2},${y + w / 2} L${x + w / 2},${y + h} Z" fill="${glow ? glow : '#0a0810'}" opacity="${glow ? 0.35 : 1}"/>`;
    s += `<line x1="${x}" y1="${y + w / 2 + 10}" x2="${x}" y2="${y + h}" stroke="${frame}" stroke-width="4"/>`;
    return s + '</g>';
  };
  P.pillars = (n, y, h, color, seed) => { let s = ''; for (let i = 0; i < n; i++) { const t = (i + 0.5) / n, x = t * W, sc = 0.7 + 0.6 * Math.abs(t - 0.5); s += `<rect x="${(x - 22 * sc).toFixed(0)}" y="${(y - h * sc).toFixed(0)}" width="${(44 * sc).toFixed(0)}" height="${(h * sc).toFixed(0)}" fill="${color}"/><rect x="${(x - 34 * sc).toFixed(0)}" y="${(y - h * sc - 18 * sc).toFixed(0)}" width="${(68 * sc).toFixed(0)}" height="${(18 * sc).toFixed(0)}" fill="${color}"/>`; } return s; };
  P.floorTiles = (y, color, line) => { let s = `<rect x="0" y="${y}" width="${W}" height="${H - y}" fill="${color}"/>`; for (let i = -6; i <= 6; i++) s += `<line x1="${W / 2 + i * 60}" y1="${y}" x2="${W / 2 + i * 260}" y2="${H}" stroke="${line}" stroke-width="1"/>`; for (let j = 0; j < 6; j++) { const yy = y + Math.pow(j / 5, 1.7) * (H - y); s += `<line x1="0" y1="${yy.toFixed(0)}" x2="${W}" y2="${yy.toFixed(0)}" stroke="${line}" stroke-width="1"/>`; } return s; };
  P.torch = (x, y, scale) => { const sc = scale || 1; return `<g transform="translate(${x},${y}) scale(${sc})"><rect x="-4" y="0" width="8" height="60" fill="#3b2a1a"/><ellipse cx="0" cy="-8" rx="10" ry="18" fill="#ff9a3c"><animate attributeName="ry" values="18;22;16;20;18" dur="0.7s" repeatCount="indefinite"/></ellipse><ellipse cx="0" cy="-10" rx="5" ry="10" fill="#fff0a0"/><circle cx="0" cy="-8" r="60" fill="#ff9a3c" opacity=".12"><animate attributeName="opacity" values=".12;.18;.1;.15;.12" dur="0.9s" repeatCount="indefinite"/></circle></g>`; };
  P.trees = (n, base, color, seed, minH, maxH) => { const r = rng(seed || 11); let s = ''; for (let i = 0; i < n; i++) { const x = r() * W, h = (minH || 120) + r() * ((maxH || 300) - (minH || 120)), w = h * 0.35; s += `<path d="M${x},${base - h} L${x + w / 2},${base - h * 0.55} L${x + w * 0.25},${base - h * 0.55} L${x + w * 0.7},${base - h * 0.2} L${x + w * 0.4},${base - h * 0.2} L${x + w},${base} L${x - w},${base} L${x - w * 0.4},${base - h * 0.2} L${x - w * 0.7},${base - h * 0.2} L${x - w * 0.25},${base - h * 0.55} L${x - w / 2},${base - h * 0.55} Z" fill="${color}"/>`; } return s; };
  P.circleRunes = (cx, cy, r, n, color, seed) => { const rr = rng(seed || 5); let s = `<g class="runes"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="2" opacity=".6"/><circle cx="${cx}" cy="${cy}" r="${r * 0.86}" fill="none" stroke="${color}" stroke-width="1" opacity=".4"/>`; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, x = cx + Math.cos(a) * r * 0.93, y = cy + Math.sin(a) * r * 0.93; s += `<g transform="translate(${x.toFixed(0)},${y.toFixed(0)}) rotate(${(a * 180 / Math.PI + 90).toFixed(0)})">${P.rune(Math.floor(rr() * 12), color, 14)}</g>`; } s += `<animateTransform attributeName="transform" type="rotate" from="0 ${cx} ${cy}" to="360 ${cx} ${cy}" dur="240s" repeatCount="indefinite"/></g>`; return s; };
  P.rune = (i, color, size) => { const s = size || 20; const shapes = ['M-1,-1 L0,1 L1,-1', 'M-1,0 L1,0 M0,-1 L0,1', 'M-1,-1 L1,1 M-1,1 L1,-1', 'M0,-1 L1,0 L0,1 L-1,0 Z', 'M-1,-1 L-1,1 L1,1', 'M-1,1 L0,-1 L1,1 M-.5,0 L.5,0', 'M0,-1 L0,1 M-1,-.3 L1,-.3', 'M-1,-1 L1,-1 L-1,1 L1,1', 'M0,-1 L0,1 M-1,0 L0,-1 L1,0', 'M-1,-1 L1,1 L-1,1', 'M-1,0 L1,0 M-.5,-1 L-.5,1 M.5,-1 L.5,1', 'M0,-1 A1,1 0 1 1 0,1 M0,-1 L0,1']; return `<path d="${shapes[i % shapes.length]}" transform="scale(${s / 2})" fill="none" stroke="${color}" stroke-width="${2.2 / (s / 20)}" stroke-linecap="round" stroke-linejoin="round"/>`; };
  P.figures = (list, base, color) => list.map(f => `<g transform="translate(${f.x},${base}) scale(${f.s || 1})"><ellipse cx="0" cy="-8" rx="16" ry="6" fill="#000" opacity=".3"/><path d="M-14,0 L-10,-70 L10,-70 L14,0 Z" fill="${f.color || color}"/><circle cx="0" cy="-82" r="12" fill="${f.color || color}"/></g>`).join('');
  P.vignetteRect = () => `<defs><radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient></defs><rect width="${W}" height="${H}" fill="url(#vig)"/>`;
  P.lightBeam = (x, y, w, h, color) => `<path d="M${x - 20},${y} L${x + 20},${y} L${x + w},${y + h} L${x - w},${y + h} Z" fill="${color}" opacity=".12"><animate attributeName="opacity" values=".12;.2;.12" dur="5s" repeatCount="indefinite"/></path>`;
  P.water = (y, color, seed) => { const r = rng(seed || 9); let s = `<rect x="0" y="${y}" width="${W}" height="${H - y}" fill="${color}"/>`; for (let i = 0; i < 24; i++) { const yy = y + r() * (H - y), x = r() * W, len = 60 + r() * 220; s += `<line x1="${x}" y1="${yy}" x2="${x + len}" y2="${yy}" stroke="#fff" stroke-width="1" opacity=".08"><animate attributeName="opacity" values=".08;.16;.08" dur="${(2 + r() * 3).toFixed(1)}s" repeatCount="indefinite"/></line>`; } return s; };
  P.wrap = (inner, cls) => `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" class="scene ${cls || ''}">${inner}${P.vignetteRect()}</svg>`;
  Art.P = P; Art.W = W; Art.H = H; Art.rng = rng;

  /* ---------- scene registry ---------- */
  Art.define = (name, fn) => { Art.scenes[name] = fn; };
  Art.render = function (name, params) {
    const fn = Art.scenes[name] || Art.scenes.blank;
    try { return fn(params || {}); } catch (e) { console.error('art', name, e); return Art.scenes.blank({}); }
  };
  Art.animate = function () {};

  Art.define('blank', () => P.wrap(P.sky('#15121d', '#0b0a10')));
  Art.define('title', () => P.wrap(
    P.sky('#070812', '#1b1430') + P.stars(220, 21) + P.moon(1330, 128, 40) +
    P.mountains('#0f0d1c', 4, 640, 260, 9) + P.mountains('#0a0913', 5, 720, 200, 12) +
    P.tower(800, 760, 150, 420, '#0d0b16', 5) + P.fog(600, 260, '#2a2140', 0.5) + P.ground(760, '#080711')
  ));

  window.VigilArt = Art;
})();

<script>/* js/art/scenes-ch0.js */
/* Art — Prologue */
(function () {
  'use strict';
  const A = window.VigilArt, P = A.P, W = A.W, H = A.H;

  // A great fire in a stone hall, the prophecy stone above it.
  function fire(x, base, scale, blue) {
    const sc = scale || 1; const c1 = blue ? '#4fb3bf' : '#ff9a3c', c2 = blue ? '#a8e6ee' : '#ffe08a';
    let s = `<g transform="translate(${x},${base}) scale(${sc})">`;
    s += `<ellipse cx="0" cy="0" rx="260" ry="40" fill="${c1}" opacity=".18"/>`;
    for (let i = 0; i < 7; i++) { const dx = (i - 3) * 38, h = 180 + (i % 2) * 60 - Math.abs(i - 3) * 30; s += `<path d="M${dx - 30},0 C${dx - 40},-${h * 0.4} ${dx - 10},-${h * 0.6} ${dx},-${h} C${dx + 10},-${h * 0.6} ${dx + 40},-${h * 0.4} ${dx + 30},0 Z" fill="${c1}" opacity=".85"><animate attributeName="d" values="M${dx - 30},0 C${dx - 40},-${h * 0.4} ${dx - 10},-${h * 0.6} ${dx},-${h} C${dx + 10},-${h * 0.6} ${dx + 40},-${h * 0.4} ${dx + 30},0 Z;M${dx - 30},0 C${dx - 46},-${h * 0.35} ${dx - 4},-${h * 0.7} ${dx + 8},-${h * 1.08} C${dx + 14},-${h * 0.6} ${dx + 36},-${h * 0.45} ${dx + 30},0 Z;M${dx - 30},0 C${dx - 40},-${h * 0.4} ${dx - 10},-${h * 0.6} ${dx},-${h} C${dx + 10},-${h * 0.6} ${dx + 40},-${h * 0.4} ${dx + 30},0 Z" dur="${(1.6 + i * 0.23).toFixed(2)}s" repeatCount="indefinite"/></path>`; }
    for (let i = 0; i < 5; i++) { const dx = (i - 2) * 40, h = 110 + (i % 2) * 40; s += `<path d="M${dx - 18},0 C${dx - 22},-${h * 0.4} ${dx - 6},-${h * 0.6} ${dx},-${h} C${dx + 6},-${h * 0.6} ${dx + 22},-${h * 0.4} ${dx + 18},0 Z" fill="${c2}" opacity=".9"><animate attributeName="opacity" values=".9;.6;.95;.7;.9" dur="${(0.9 + i * 0.17).toFixed(2)}s" repeatCount="indefinite"/></path>`; }
    s += `<circle cx="0" cy="-60" r="300" fill="${c1}" opacity=".12"><animate attributeName="opacity" values=".12;.18;.1;.15;.12" dur="1.3s" repeatCount="indefinite"/></circle>`;
    return s + '</g>';
  }
  A.fire = fire;

  A.define('ch0_hearthfire', () => P.wrap(
    P.sky('#0a0810', '#1a0f0a') +
    P.pillars(6, 760, 620, '#0d0a10') +
    `<rect x="560" y="330" width="480" height="430" fill="#120d12"/>` +
    `<path d="M560,330 A240,240 0 0 1 1040,330" fill="#120d12"/>` +
    `<rect x="600" y="200" width="400" height="110" rx="4" fill="#221a20" stroke="#3a2c2c" stroke-width="3"/>` +
    P.circleRunes(800, 255, 46, 10, 'rgba(212,169,78,0.35)', 3) +
    fire(800, 760, 1, false) +
    P.floorTiles(760, '#0b0910', 'rgba(255,255,255,0.04)') +
    P.fog(600, 300, '#2a1a12', 0.35)
  ));

  /* ---------- the sentence on the prophecy stone ----------
     This row used to be Chapter VI's stone, drawn out: G.shapeInner over
     ['Flame','Flame','Crown','Hook','Spike','Flame','Crown','Hook'] with
     [false,true,false,false,false,true,true,true] — element for element the STONE array at
     js/content/ch6.js, ninety minutes before Chapter VI burns four of those cuts off the board and
     sells the missing four shapes to the Reader and their four orientations to the Seer.
     Enumerated (scratchpad/ch012/stone-field.js, against the shipped STONE and BURNT):
         the row the art drew is identical to ch6's STONE ............ true
         cuts the fire takes ........................................ 1, 3, 5, 7
         assignments of shape and orientation to those four cuts .... 4,096
           knowing only the Reader's page (the four shapes) .......... 16
           knowing only the Seer's page (the four orientations) ...... 256
           knowing this picture ...................................... 1
     In ch6's own board terms (ch6.js records them): drop the Reader 192, drop the Seer 8 — both
     answered here, for free, by a photograph of the Prologue. The chapter's only currency is a bell
     cracked per misreading, so a field of 1 is a chapter that costs nothing.
     So the Hearth promises the sentence and does not print it, the way the lamp's collar does forty
     lines below: what four hundred years of smoke left, not what was cut. Nothing here is a glyph —
     no closed teardrop, no arrow over a bar, no hook, no crown — only grooves, chips and soot, seeded
     so the stone is the same stone every night. tools/scripts/ch0.json and ch1.json assert that no
     path from js/content/glyphs.js is drawn in this chapter's art (ch1 allows the one on the Chair's
     banner, which is heraldry). */
  function wornCuts(n, colour, gap, sc, seed) {
    const r = A.rng(seed || 1707);
    let out = '';
    for (let i = 0; i < n; i++) {
      const lean = (r() * 30 - 15).toFixed(1), h = (11 + r() * 7), bow = (r() * 9 - 4.5);
      let g = `<g transform="translate(${(i * gap).toFixed(0)},0) scale(${sc})">`;
      g += `<g transform="rotate(${lean})" fill="none" stroke="${colour}" stroke-linecap="round">`;
      // the groove, in two strokes that do not meet: the middle of it is gone
      g += `<path d="M${(-bow / 2).toFixed(1)},${(-h).toFixed(1)} q${bow.toFixed(1)},${(h * 0.45).toFixed(1)} ${(bow / 3).toFixed(1)},${(h * 0.62).toFixed(1)}" stroke-width="3.4" opacity="${(0.55 + r() * 0.3).toFixed(2)}"/>`;
      g += `<path d="M${(bow / 3).toFixed(1)},${(h * 0.82).toFixed(1)} l${(r() * 4 - 2).toFixed(1)},${(h * 0.5).toFixed(1)}" stroke-width="2.8" opacity="${(0.35 + r() * 0.3).toFixed(2)}"/>`;
      // a chip across it, and sometimes one that stops short
      g += `<path d="M${(-6 - r() * 4).toFixed(1)},${(r() * 8 - 4).toFixed(1)} l${(9 + r() * 5).toFixed(1)},${(r() * 6 - 3).toFixed(1)}" stroke-width="2.4" opacity="${(0.25 + r() * 0.3).toFixed(2)}"/>`;
      if (r() > 0.35) g += `<path d="M${(2 + r() * 3).toFixed(1)},${(-h * 0.6).toFixed(1)} l${(r() * 5 - 1).toFixed(1)},${(4 + r() * 4).toFixed(1)}" stroke-width="2" opacity=".3"/>`;
      g += '</g>';
      // soot: what the fire has been doing to the foot of it for four hundred years
      for (let k = 0; k < 3; k++) g += `<ellipse cx="${(r() * 24 - 12).toFixed(1)}" cy="${(r() * 28 - 9).toFixed(1)}" rx="${(4 + r() * 7).toFixed(1)}" ry="${(3 + r() * 5).toFixed(1)}" fill="#0d0a0c" opacity="${(0.1 + r() * 0.18).toFixed(2)}"/>`;
      out += g + '</g>';
    }
    return out;
  }
  A.wornCuts = wornCuts;

  A.define('ch0_stone', () => P.wrap(
    P.sky('#0a0810', '#1a0f0a') +
    `<rect x="380" y="120" width="840" height="300" rx="6" fill="#1d1619" stroke="#3a2c2c" stroke-width="4"/>` +
    `<g transform="translate(470,250)" opacity=".9">${wornCuts(8, '#7a6a5a', 94, 1.9)}</g>` +
    `<text x="800" y="380" text-anchor="middle" fill="rgba(233,226,210,0.45)" font-size="22" font-family="Cinzel,serif" letter-spacing="6">THE ORDER'S READING</text>` +
    fire(800, 900, 1.6, false) +
    `<rect x="0" y="520" width="${W}" height="${H - 520}" fill="url(#stonefog)"/><defs><linearGradient id="stonefog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a3c" stop-opacity="0"/><stop offset="1" stop-color="#ff9a3c" stop-opacity=".55"/></linearGradient></defs>`
  ));

  A.define('ch0_dorm', () => P.wrap(
    P.sky('#0b0a12', '#15121d') +
    // window with stars
    `<rect x="1180" y="120" width="260" height="360" rx="130" fill="#070812"/>` + `<g clip-path="inset(0)">${P.stars(60, 12, 480).replace(/<circle /g, '<circle transform="translate(1180,120) scale(0.16,0.4)" ')}</g>` +
    `<rect x="1180" y="120" width="260" height="360" rx="130" fill="none" stroke="#2a2438" stroke-width="10"/>` +
    // beds
    `${[0, 1, 2, 3].map(i => `<g transform="translate(${140 + i * 250},640)"><rect x="0" y="0" width="200" height="90" rx="8" fill="#1b1626"/><rect x="0" y="-40" width="26" height="130" rx="4" fill="#241d33"/><rect x="174" y="-40" width="26" height="130" rx="4" fill="#241d33"/><rect x="30" y="10" width="140" height="40" rx="6" fill="#2b2340"/></g>`).join('')}` +
    // sill lamp
    `<g transform="translate(1310,500)"><rect x="-60" y="0" width="120" height="14" fill="#2a2438"/><rect x="-14" y="-70" width="28" height="70" rx="4" fill="#3a2f1a"/><circle cx="0" cy="-90" r="24" fill="#5a4a2a" stroke="#8a7040" stroke-width="3"/><circle cx="0" cy="-90" r="10" fill="#ffd27a" opacity=".55"><animate attributeName="opacity" values=".55;.2;.6;.3;.55" dur="2.4s" repeatCount="indefinite"/></circle></g>` +
    P.floorTiles(740, '#0d0b14', 'rgba(255,255,255,0.03)') +
    P.fog(560, 260, '#241d33', 0.35)
  ));

  A.define('ch0_lamp', () => P.wrap(
    P.sky('#0b0a12', '#1a1520') +
    `<rect x="0" y="600" width="${W}" height="300" fill="#100d16"/>` +
    `<g transform="translate(800,520)">` +
    `<rect x="-200" y="80" width="400" height="30" fill="#2a2438"/>` +
    `<rect x="-40" y="-120" width="80" height="200" rx="8" fill="#4a3c22" stroke="#8a7040" stroke-width="3"/>` +
    `<circle cx="0" cy="-170" r="70" fill="#5a4a2a" stroke="#8a7040" stroke-width="5"/>` +
    `<circle cx="0" cy="-170" r="46" fill="none" stroke="#c9a85a" stroke-width="3" opacity=".8"/>` +
    `${[0, 1, 2, 3].map(i => { const a = (i / 4 * 360 - 90) * Math.PI / 180; return `<circle cx="${Math.cos(a) * 46}" cy="${-170 + Math.sin(a) * 46}" r="12" fill="#2a2010" stroke="#c9a85a" stroke-width="2"/>`; }).join('')}` +
    `<circle cx="0" cy="-170" r="14" fill="#ffd27a" opacity=".5"><animate attributeName="opacity" values=".5;.2;.55;.25;.5" dur="2s" repeatCount="indefinite"/></circle>` +
    // Two marks are cut here, but four hundred years have taken them: the Hearth shows the
    // wear, not the shapes. Only the Reader's page has them clean.
    `${[-60, 60].map((x, i) => `<g transform="translate(${x},-290)" opacity=".5">` +
      `<circle cx="0" cy="0" r="21" fill="none" stroke="#6a5a3c" stroke-width="2" stroke-dasharray="${i ? '5 7' : '8 6'}"/>` +
      `<path d="${i ? 'M-10 7 L-1 -8 M3 9 L8 -5 M-9 -6 L7 -2' : 'M-8 9 L6 -7 M-2 10 L-6 -8 M-10 0 L9 4'}" fill="none" stroke="#6a5a3c" stroke-width="3" stroke-linecap="round" opacity=".6"/>` +
      `</g>`).join('')}` +
    `</g>` +
    P.fog(600, 300, '#241d33', 0.3)
  ));
})();

<script>/* js/art/scenes-ch1.js */
/* Art — Chapter I: The Vigil (the Great Hall, the dais, the Envoy's entrance, the passage) */
(function () {
  'use strict';
  const A = window.VigilArt, P = A.P, W = A.W, H = A.H;

  /* The nine Houses of the Marches, sunwise from the Chair (seat 9). Shared with the Hearth chapter via A.ch1;
     the Companion carries its own copy of this table (js/content/companion/ch1.js) — keep the two identical. */
  const HOUSES = [
    { n: 1, house: 'Harrowden', color: '#3f7a4a', sym: 'chevron' },
    { n: 2, house: 'Ossery',    color: '#8c93a6', sym: 'crescent' },
    { n: 3, house: 'Dunmere',   color: '#4a5f8a', sym: 'tower' },
    { n: 4, house: 'Fellwood',  color: '#2f5a3a', sym: 'tree' },
    { n: 5, house: 'Goldmarch', color: '#b8892e', sym: 'sun' },
    { n: 6, house: 'Redmoor',   color: '#8a2f2f', sym: 'wave' },
    { n: 7, house: 'Sable',     color: '#5a3f8a', sym: 'stars' },
    { n: 8, house: 'Wyeburn',   color: '#8a6a3a', sym: 'key' },
    { n: 9, house: 'the Chair', color: '#2a2434', sym: 'crown' },
  ];
  const st = 'fill="none" stroke="#f4ecd8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"';
  function emblem(sym) {
    switch (sym) {
      case 'chevron': return `<path d="M9,27 L20,12 L31,27" ${st}/><path d="M13,31 L20,22 L27,31" ${st}/>`;
      case 'crescent': return `<path d="M25,9 A11,11 0 1 0 25,31 A8.5,8.5 0 1 1 25,9 Z" fill="#f4ecd8"/>`;
      case 'tower': return `<path d="M13,31 V14 H27 V31 Z M11,14 V9 H15 V14 M18,14 V9 H22 V14 M25,14 V9 H29 V14" ${st}/><path d="M18,31 V24 H22 V31" ${st}/>`;
      case 'tree': return `<path d="M20,7 L28,17 L24,17 L30,25 L25,25 L31,32 L9,32 L15,25 L10,25 L16,17 L12,17 Z" fill="#f4ecd8"/>`;
      case 'sun': return `<circle cx="20" cy="20" r="6" fill="#f4ecd8"/>${[0, 45, 90, 135, 180, 225, 270, 315].map(a => `<path d="M20,20 m${(Math.cos(a * Math.PI / 180) * 9).toFixed(1)},${(Math.sin(a * Math.PI / 180) * 9).toFixed(1)} l${(Math.cos(a * Math.PI / 180) * 5).toFixed(1)},${(Math.sin(a * Math.PI / 180) * 5).toFixed(1)}" ${st}/>`).join('')}`;
      case 'wave': return `<path d="M8,17 C12,12 16,12 20,17 C24,22 28,22 32,17" ${st}/><path d="M8,26 C12,21 16,21 20,26 C24,31 28,31 32,26" ${st}/>`;
      case 'stars': { const s = (x, y, r) => { let d = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; d += (i ? 'L' : 'M') + (x + Math.cos(a) * rr).toFixed(1) + ',' + (y + Math.sin(a) * rr).toFixed(1); } return `<path d="${d}Z" fill="#f4ecd8"/>`; }; return s(20, 12, 5) + s(12, 26, 5) + s(28, 26, 5); }
      case 'key': return `<circle cx="14" cy="16" r="5.5" ${st}/><path d="M18,20 L30,32 M26,28 L29,25 M23,25 L26,22" ${st}/>`;
      case 'crown': return `<g transform="translate(20,21) scale(0.9)" style="color:#f4ecd8">${window.VigilGlyphs.shapeInner('Crown', false)}</g>`;
    }
    return '';
  }
  /* Small banner (shield) for the seats widget and phone lists. */
  function banner(h, size) {
    return `<svg viewBox="0 0 40 40" width="${size || 26}" height="${size || 26}" style="display:block"><path d="M5,3 H35 V28 L20,38 L5,28 Z" fill="${h.color}" stroke="rgba(244,236,216,0.5)" stroke-width="1.5"/>${emblem(h.sym)}</svg>`;
  }
  /* Tall hanging banner for scenes. */
  function hanging(h, x, y, w, l, dim) {
    const op = dim ? 0.55 : 0.9;
    return `<g transform="translate(${x},${y})" opacity="${op}"><rect x="${-w / 2 - 8}" y="-6" width="${w + 16}" height="10" rx="3" fill="#3a2f28"/><path d="M${-w / 2},0 H${w / 2} V${l - w * 0.4} L0,${l} L${-w / 2},${l - w * 0.4} Z" fill="${h.color}"/><path d="M${-w / 2},0 H${w / 2} V${l - w * 0.4} L0,${l} L${-w / 2},${l - w * 0.4} Z" fill="url(#bannerShade)"/><g transform="translate(${-w * 0.35},${l * 0.28}) scale(${w * 0.7 / 40})">${emblem(h.sym)}</g></g>`;
  }
  const bannerDefs = `<defs><linearGradient id="bannerShade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient></defs>`;
  A.ch1 = { HOUSES, emblem, banner, hanging };

  /* Nine banners in perspective along both walls, the Chair's at the far end. */
  function bannerRow(dim) {
    let s = bannerDefs;
    // left wall: seats 1-4 nearest first; right wall: 8-5; the Chair's over the Hearth
    const left = [0, 1, 2, 3], right = [7, 6, 5, 4];
    left.forEach((k, i) => { const t = i / 3; s += hanging(HOUSES[k], 140 + t * 330, 90 + t * 60, 120 - t * 55, 300 - t * 150, dim); });
    right.forEach((k, i) => { const t = i / 3; s += hanging(HOUSES[k], 1460 - t * 330, 90 + t * 60, 120 - t * 55, 300 - t * 150, dim); });
    s += hanging(HOUSES[8], 800, 60, 70, 150, dim);
    return s;
  }
  function masters() {
    const list = [];
    for (let i = 0; i < 4; i++) { const t = i / 3; list.push({ x: 300 + t * 200, s: 0.9 - t * 0.35 }); list.push({ x: 1300 - t * 200, s: 0.9 - t * 0.35 }); }
    return P.figures(list.map(f => ({ x: f.x, s: f.s })), 700, '#0c0a12');
  }

  A.define('ch1_hall', () => P.wrap(
    P.sky('#07060c', '#1a120e') +
    `<rect x="0" y="0" width="${W}" height="560" fill="#0b0912"/>` +
    P.pillars(8, 720, 640, '#0a0810') +

    `<rect x="560" y="300" width="480" height="420" fill="#120d12"/><path d="M560,300 A240,240 0 0 1 1040,300" fill="#120d12"/>` +
    `<rect x="640" y="240" width="320" height="70" rx="4" fill="#211a20" stroke="#3a2c2c" stroke-width="3"/>` +
    // The same eight cuts as the Prologue's slab and drawn the same way — as wear. This lintel used to

    `<g transform="translate(670,275)" opacity=".55">${A.wornCuts(8, '#7a6a5a', 37, 0.8, 4409)}</g>` +

  A.define('ch1_dais', () => P.wrap(

    `<rect x="380" y="640" width="840" height="30" rx="4" fill="#1e1712"/><rect x="440" y="610" width="720" height="34" rx="4" fill="#251c15"/><rect x="500" y="580" width="600" height="34" rx="4" fill="#2c221a"/>` +
    // Marrow (tall, still) and Wren (small, on the mark)
    `<g transform="translate(700,580)"><ellipse cx="0" cy="-6" rx="24" ry="8" fill="#000" opacity=".35"/><path d="M-22,0 L-16,-150 L16,-150 L22,0 Z" fill="#0c0a12"/><circle cx="0" cy="-166" r="15" fill="#0c0a12"/><path d="M-16,-150 L-22,0" stroke="#3a2a22" stroke-width="1.5"/></g>` +
    `<g transform="translate(860,580)"><ellipse cx="0" cy="-4" rx="18" ry="6" fill="#000" opacity=".35"/><path d="M-12,0 L-9,-92 L9,-92 L12,0 Z" fill="#0c0a12"/><circle cx="0" cy="-104" r="12" fill="#0c0a12"/><path d="M9,-92 L12,0" stroke="#ff9a3c" stroke-width="1.5" opacity=".6"/></g>` +
    // a circle cut into the dais where the child stands
    `<ellipse cx="860" cy="596" rx="60" ry="10" fill="none" stroke="rgba(212,169,78,0.35)" stroke-width="2"/>` +
    P.floorTiles(720, '#0b0910', 'rgba(255,255,255,0.04)') +
    P.torch(300, 480, 1) + P.torch(1300, 480, 1) +
    P.fog(600, 300, '#2a1a12', 0.3)
  ));

  A.define('ch1_vane', () => P.wrap(
    P.sky('#07060c', '#100c12') +
    `<rect x="0" y="0" width="${W}" height="560" fill="#0b0912"/>` +
    P.pillars(6, 720, 640, '#0a0810') +
    bannerRow(true) +
    // the great doors, open; night and moonlight beyond
    `<path d="M600,720 L600,300 A200,200 0 0 1 1000,300 L1000,720 Z" fill="#dcd6c8" opacity=".12"/>` +
    `<path d="M610,720 L610,305 A190,190 0 0 1 990,305 L990,720 Z" fill="#0d1018"/>` +
    P.stars(40, 31, 420).replace('<g class="stars">', '<g class="stars" clip-path="inset(0 610px 0 610px)">') +
    P.lightBeam(800, 320, 700, 620, '#dcd6c8') +
    // door leaves swung inward
    `<path d="M600,300 L520,330 L520,760 L600,720 Z" fill="#241a12"/><path d="M1000,300 L1080,330 L1080,760 L1000,720 Z" fill="#241a12"/>` +
    // soldiers in rows, then the Envoy
    P.figures([{ x: 660, s: 0.7 }, { x: 720, s: 0.72 }, { x: 880, s: 0.72 }, { x: 940, s: 0.7 }, { x: 690, s: 0.8 }, { x: 910, s: 0.8 }], 700, '#0a0910') +
    `${[660, 720, 880, 940].map(x => `<line x1="${x + 14}" y1="700" x2="${x + 14}" y2="590" stroke="#3a3540" stroke-width="3"/>`).join('')}` +
    `<g transform="translate(800,730)"><ellipse cx="0" cy="-6" rx="26" ry="8" fill="#000" opacity=".4"/><path d="M-20,0 L-14,-140 L14,-140 L20,0 Z" fill="#2a2a30"/><circle cx="0" cy="-156" r="14" fill="#1a1a20"/><path d="M-20,0 L-28,-30 L-14,-140" fill="#2a2a30"/><path d="M14,-140 L28,-30 L20,0" fill="#2a2a30"/><rect x="-6" y="-100" width="12" height="40" rx="2" fill="#c9a85a" opacity=".8"/><circle cx="0" cy="-80" r="7" fill="#8a2f2f"/></g>` +
    P.floorTiles(720, '#0b0910', 'rgba(255,255,255,0.04)') +

  ));

  A.define('ch1_passage', () => P.wrap(
    P.sky('#06050a', '#120d10') +
    // a narrow vaulted passage
    `<path d="M300,900 L300,420 A500,500 0 0 1 1300,420 L1300,900 Z" fill="#100c12"/>` +
    `<path d="M480,900 L480,520 A320,320 0 0 1 1120,520 L1120,900 Z" fill="#0a0810"/>` +

    P.torch(700, 250, 1.4) +

    `<g transform="translate(980,480)"><ellipse cx="0" cy="-6" rx="30" ry="9" fill="#000" opacity=".4"/><path d="M-22,0 L-16,-160 L16,-160 L22,0 Z" fill="#26262c"/><circle cx="0" cy="-178" r="16" fill="#18181e"/><path d="M-16,-160 L-22,0" stroke="#ffb86a" stroke-width="2" opacity=".5"/><rect x="-6" y="-110" width="12" height="44" rx="2" fill="#c9a85a" opacity=".7"/></g>` +
