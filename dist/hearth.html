<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What the Fire Keeps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* Shared theme: The Fourth Vigil */
:root {
  --bg: #0b0a10;
  --bg2: #15121d;
  --panel: rgba(18, 15, 26, 0.82);
  --panel-solid: #16131f;
  --ink: #e9e2d2;
  --ink-dim: #a99f8c;
  --gold: #d4a94e;
  --gold-2: #f2d27a;
  --ember: #ff7a3d;
  --sea: #4fb3bf;
  --violet: #9b7bd8;
  --blood: #b23a3a;
  --moss: #7fae5e;
  --line: rgba(212, 169, 78, 0.35);
  --serif: 'Cormorant Garamond', 'Georgia', serif;
  --display: 'Cinzel', 'Trajan Pro', 'Georgia', serif;
  --hand: 'IM Fell English', 'Cormorant Garamond', serif;
  --shadow: 0 10px 40px rgba(0,0,0,0.55);
  --p1: #e0b04a; --p2: #4fb3bf; --p3: #d96b4a; --p4: #a482e6;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--serif); font-size: 20px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body.hearth { overflow: hidden; }
h1, h2, h3, .display { font-family: var(--display); font-weight: 600; letter-spacing: 0.06em; }
a { color: var(--gold); }
em { font-style: italic; color: var(--gold-2); }
strong { color: var(--gold-2); font-weight: 600; }
.small { font-size: 0.8em; color: var(--ink-dim); }
.rune { font-family: var(--display); letter-spacing: 0.18em; color: var(--sea); }
::selection { background: rgba(212,169,78,0.35); }

.btn {
  font-family: var(--display); font-size: 17px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink); background: linear-gradient(180deg, rgba(212,169,78,0.14), rgba(212,169,78,0.04));
  border: 1px solid var(--line); border-radius: 6px; padding: 12px 22px; cursor: pointer;
  transition: all .18s ease; position: relative; overflow: hidden;
}
.btn:hover, .btn:focus-visible { border-color: var(--gold); color: var(--gold-2); background: linear-gradient(180deg, rgba(212,169,78,0.28), rgba(212,169,78,0.08)); box-shadow: 0 0 22px rgba(212,169,78,0.18); outline: none; }
.btn:active { transform: translateY(1px); }
.btn.primary { border-color: var(--gold); color: #1a1408; background: linear-gradient(180deg, var(--gold-2), var(--gold)); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: rgba(255,255,255,0.15); }
.btn.danger { border-color: var(--blood); color: #f0b0b0; }
.btn.primary.danger { border-color: #d24b4b; color: #fff3ee; background: linear-gradient(180deg, #c04444, #8e2a2a); text-shadow: 0 1px 0 rgba(0,0,0,0.35); }
.btn.primary.danger:hover { color: #fff; background: linear-gradient(180deg, #c94a4a, #9a2f2f); box-shadow: 0 0 22px rgba(178,58,58,0.35); filter: none; }
.btn.primary.danger:focus-visible { color: #fff; background: linear-gradient(180deg, #c94a4a, #9a2f2f); box-shadow: 0 0 22px rgba(178,58,58,0.35); filter: none; }
.btn.audio-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
.btn.audio-btn .audio-icon { flex: 0 0 auto; }
.btn.audio-btn.playing { border-color: var(--sea); color: var(--sea); }
.btn.audio-btn.playing .audio-icon path { animation: eq 0.9s ease-in-out infinite; transform-origin: center; }
.btn.audio-btn.playing .audio-icon path:nth-child(2) { animation-delay: .15s; } .btn.audio-btn.playing .audio-icon path:nth-child(3) { animation-delay: .3s; }
.btn.audio-btn.playing .audio-icon path:nth-child(4) { animation-delay: .45s; } .btn.audio-btn.playing .audio-icon path:nth-child(5) { animation-delay: .6s; }
@keyframes eq { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.35); } }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.small { font-size: 13px; padding: 7px 12px; }
/* small bar buttons (both screens) and the utility class that hides a block */
.iconbtn { background: none; border: 1px solid transparent; color: var(--ink-dim); font-family: var(--display); font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; padding: 6px 10px; border-radius: 6px; transition: color .15s, border-color .15s; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; flex: 0 0 auto; line-height: 1; }
.iconbtn svg { flex: 0 0 auto; width: 15px; height: 15px; display: block; }
.iconbtn:hover { color: var(--gold-2); border-color: var(--line); }
.iconbtn.attention { color: var(--gold-2); animation: pulse 1.2s infinite; border-color: var(--line); }
.hidden { display: none !important; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }

input.field, textarea.field {
  font-family: var(--display); font-size: 22px; letter-spacing: 0.25em; text-transform: uppercase; text-align: center;
  color: var(--gold-2); background: rgba(0,0,0,0.35); border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; width: 100%;
  outline: none; transition: border-color .2s;
}
input.field:focus { border-color: var(--gold); box-shadow: 0 0 18px rgba(212,169,78,0.2); }
input.field.plain { letter-spacing: 0.04em; text-transform: none; font-family: var(--serif); font-size: 20px; }
input.field.wrong { border-color: var(--blood); animation: shake .4s; }

@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px);} to { opacity: 1; transform: none; } }
@keyframes pulse { 0%,100%{ opacity: .7 } 50% { opacity: 1 } }
@keyframes glow { 0%,100% { box-shadow: 0 0 8px rgba(212,169,78,0.2);} 50% { box-shadow: 0 0 28px rgba(212,169,78,0.55);} }
@keyframes spin { to { transform: rotate(360deg);} }
.shake { animation: shake .45s; }

/* toasts, modals */
.toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px); background: var(--panel-solid); border: 1px solid var(--line); color: var(--ink); padding: 12px 22px; border-radius: 8px; opacity: 0; transition: all .35s; z-index: 200; box-shadow: var(--shadow); font-size: 18px; max-width: 80vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.good { border-color: var(--moss); } .toast.bad { border-color: var(--blood); }
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .3s; z-index: 150; }
.modal-back.show { opacity: 1; }
.modal { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 10px; padding: 26px 30px; max-width: min(860px, 92vw); max-height: 88vh; overflow: auto; box-shadow: var(--shadow); transform: translateY(10px); transition: transform .3s; }
.modal-back.show .modal { transform: none; }
.modal-title { margin: 0 0 14px; color: var(--gold); font-size: 22px; }
.modal-close { margin-top: 18px; }
#fx-overlay { position: fixed; inset: 0; z-index: 300; opacity: 0; pointer-events: none; }

/* countdown */
.countdown { position: relative; height: 10px; background: rgba(255,255,255,0.08); border-radius: 5px; overflow: hidden; margin: 10px 0 4px; border: 1px solid rgba(255,255,255,0.08); }
.countdown-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--ember)); transition: width .1s linear; }
.countdown.urgent .countdown-fill { background: linear-gradient(90deg, var(--blood), var(--ember)); }
.countdown-num { position: absolute; right: 8px; top: -26px; font-family: var(--display); color: var(--gold-2); font-size: 16px; }
.countdown.urgent .countdown-num { color: #ff8b8b; animation: pulse .5s infinite; }

/* flowchart
   The chart is laid out by js/core/ui.js in real CSS pixels -- one viewBox unit is one pixel -- so it
   must never be scaled to fit. `max-width: 100%` used to do exactly that, and the scale factor was
   the label size: 1160-1730px of chart squeezed into a 786px panel wrote its labels at 5.7-11.3px in
   all nine chapters, under a 17px floor the game sets because it is read across a room. The chart now
   sizes itself to the panel and scrolls sideways in the rare case that it still cannot fit. */
.flowchart-wrap { overflow-x: auto; overflow-y: hidden; padding: 8px 0; scrollbar-width: thin; scrollbar-color: rgba(212,169,78,.45) transparent; }
.flowchart { color: var(--gold); max-width: none; height: auto; display: block; }
/* The end-of-chapter panel takes as much of the width as the scene text can spare. At the old
   380px/1fr split a nine-column chart had 786px, and no wrap of it clears the 17px floor without
   running off the bottom instead; 240px for the text buys the chart another 140px and the two flow
   scenes with the most columns stop overflowing at 1280x720. The text column is the smaller loss:
   a flow scene's own text is one or two short lines. This belongs beside the other #panel rules in
   css/hearth.css; it sits here with the rest of the flowchart because it exists only for the chart,
   and it carries `body` so it outranks the rule loaded after this file. */
body #panel:has(.flow-panel) { grid-template-columns: minmax(180px, 210px) 1fr; }
body #panel:has(.flow-panel) #text { font-size: 18px; }
/* A `1fr` grid track has an automatic minimum of its content's min-content width, and the chart no
   longer shrinks to fit -- so without this the whole #panel grew to 1405px at a 1280px viewport and
   the right-hand third of the flow panel was simply off the screen, unreachable, because nothing above
   it scrolls. The column keeps its size and the chart scrolls inside its own wrapper. */
body #panel:has(.flow-panel) #right { min-width: 0; }
body #panel:has(.flow-panel) .flow-panel { max-width: 100%; }
.fc-edge { fill: none; stroke: rgba(255,255,255,0.15); stroke-width: 1.5; color: rgba(255,255,255,0.2); }
.fc-edge.on { stroke: var(--gold); color: var(--gold); stroke-width: 2.2; filter: drop-shadow(0 0 4px rgba(212,169,78,0.6)); }
.fc-node rect, .fc-node path { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.18); stroke-width: 1.2; }
.fc-node.on rect, .fc-node.on path { fill: rgba(212,169,78,0.16); stroke: var(--gold); }
.fc-node.end.on rect { fill: rgba(159,123,216,0.25); stroke: var(--violet); }
/* --fc-font is set on the svg by UI.flowchart: it is the real pixel size the chart was laid out for,
   and the fallback is the floor, never below it. Choice diamonds used to be set two points smaller,
   which put them under the floor first; they are the same size as everything else now. */
.fc-node text { fill: rgba(233,226,210,0.72); font-family: var(--serif); font-size: var(--fc-font, 17px); }
.fc-node.on text { fill: var(--ink); }
.flowchart-wrap.zoomable { cursor: zoom-in; }
.flowchart-wrap.zoomable:hover .flowchart { filter: drop-shadow(0 0 14px rgba(212,169,78,0.25)); }
.flow-zoom-hint { font-family: var(--display); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); text-align: right; padding-top: 4px; }
.flowchart-wrap.big { overflow: auto; max-height: 78vh; max-width: none; cursor: default; }
/* The enlarged chart needs to be an enlargement. css/hearth.css caps a wide modal at 980px, which is
   narrower than the flow panel itself now that the panel takes the column -- so tapping to enlarge
   made the chart no bigger and the extra room bought nothing. A modal that holds a chart gets the
   screen. */
body .modal.wide:has(.flowchart-wrap.big) { max-width: min(1600px, 96vw); padding: 20px 22px; }
/* The Map of the Night is laid out in real pixels for the box it is going into (js/core/map.js), so
   the box must HAVE a width before it is measured: a modal is max-width, not width, and an empty one
   shrinks to its title. Nine place names at the 17px floor need about 1040px across five columns. */
body .modal.wide:has(.map-box) { max-width: min(1120px, 96vw); padding: 20px 22px; }
.map-box { width: min(1040px, calc(96vw - 60px)); overflow-x: auto; }
.map-box .night-map { display: block; max-width: none; }
.flow-panel { scrollbar-width: thin; scrollbar-color: rgba(212,169,78,.45) transparent; }

/* pads for 4-key input */
.pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px; }
.pad { font-family: var(--display); background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 12px 6px; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all .12s; user-select: none; touch-action: manipulation; }
.pad .pad-name { font-size: 13px; letter-spacing: 0.08em; opacity: .8; }
.pad .pad-key { font-size: 30px; font-weight: 700; }
.pad-0 { border-color: var(--p1); } .pad-1 { border-color: var(--p2); } .pad-2 { border-color: var(--p3); } .pad-3 { border-color: var(--p4); }
.pad-0 .pad-key { color: var(--p1); } .pad-1 .pad-key { color: var(--p2); } .pad-2 .pad-key { color: var(--p3); } .pad-3 .pad-key { color: var(--p4); }
.pad.hit, .pad.glow { background: rgba(255,255,255,0.18); transform: scale(1.04); }
.pad.armed { animation: glow 1s infinite; }
.pad.good { background: rgba(127,174,94,0.35); } .pad.bad { background: rgba(178,58,58,0.35); }

.spinner { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.15); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }

</style>

<style>
/* Hearth (main screen) layout */
#app { position: fixed; inset: 0; display: grid; grid-template-rows: 52px 1fr; overflow: hidden; }

/* stage / art */
#stage { position: absolute; inset: 0; z-index: 0; overflow: hidden; background: radial-gradient(1200px 700px at 50% 30%, #1a1626 0%, var(--bg) 70%); }
.art-layer { position: absolute; inset: 0; opacity: 0; transition: opacity 1.3s ease; }
.art-layer.in { opacity: 1; }
.art-layer.out { opacity: 0 !important; }
.art-layer svg { width: 100%; height: 100%; display: block; }
#fx { position: absolute; inset: 0; z-index: 1; pointer-events: none; width: 100%; height: 100%; }
#vignette { position: absolute; inset: 0; z-index: 2; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.65) 100%); }

/* top bar */
#bar { position: relative; z-index: 10; display: flex; align-items: center; gap: 16px; padding: 0 18px; background: linear-gradient(180deg, rgba(0,0,0,0.88), rgba(0,0,0,0.78)); font-family: var(--display); font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); }
#bar .brand { color: var(--gold); font-weight: 600; }
#bar .sep { opacity: 0.35; }
#bar .spacer { flex: 1 1 auto; min-width: 0; }
#bar { white-space: nowrap; overflow: hidden; }
#bar #chapter { overflow: hidden; text-overflow: ellipsis; }
#timer { font-variant-numeric: tabular-nums; color: var(--ink); }

/* main panel */
#panel { position: relative; z-index: 5; display: grid; grid-template-columns: minmax(340px, 560px) 1fr; gap: 20px; padding: 10px 28px 26px; height: 100%; min-height: 0; align-items: end; }
#text { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px 28px; max-height: calc(100vh - 96px); overflow-y: auto; backdrop-filter: blur(8px); box-shadow: var(--shadow); font-size: 21px; cursor: default; scrollbar-width: thin; scrollbar-color: rgba(212,169,78,.4) transparent; }
#text.narrow { font-size: 18px; max-height: 44vh; }
#text .para { margin: 0 0 14px; animation: fadeUp .4s ease both; }
/* When a long scene has been shrunk to fit the box, close the gaps to match. */
#text.tight { padding: 16px 22px; }
#text.tight .para { margin-bottom: 9px; }
#text.tight .scene-title { margin-bottom: 8px; font-size: 19px; }
#text.tight .speech.joined { padding-bottom: 8px; }
#text .tw-ghost { }
#text .para:last-child { margin-bottom: 0; }
#text .speech { padding-left: 14px; border-left: 2px solid var(--line); }
#text .speech.joined { margin-bottom: 0; padding-bottom: 12px; }
#text .speech.cont { margin-top: 0; }
#text .speech.cont .tw { display: block; }
#text .speaker { display: block; font-family: var(--display); font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); margin-bottom: 2px; }
#text .scene-title { margin: 0 0 12px; font-size: 22px; color: var(--gold); }
#text .whisper { color: var(--sea); font-style: italic; }
#text .omen { color: var(--violet); font-family: var(--hand); }
#text .letter { font-family: var(--hand); color: #d9cba8; background: rgba(255,240,200,0.05); padding: 10px 14px; border-radius: 4px; }
#text .center { text-align: center; }
#text .big { font-family: var(--display); font-size: 28px; text-align: center; color: var(--gold-2); letter-spacing: 0.1em; }

#right { display: flex; flex-direction: column; gap: 14px; min-height: 0; max-height: calc(100vh - 120px); justify-content: flex-end; }
#widget { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px; backdrop-filter: blur(8px); box-shadow: var(--shadow); overflow: auto; min-height: 0; flex: 1 1 auto; scrollbar-width: thin; }
#widget .widget-inner { min-height: 100%; }
#actions { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
#actions .prompt { font-size: 20px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 18px; backdrop-filter: blur(6px); }
#actions .btn.primary { align-self: flex-end; min-width: 200px; }
#actions > .btn:not(.choice) { align-self: flex-end; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.btn.choice { text-transform: none; font-family: var(--serif); font-size: 20px; letter-spacing: 0; text-align: left; display: flex; gap: 14px; align-items: baseline; padding: 12px 18px; background: var(--panel); backdrop-filter: blur(6px); flex-wrap: wrap; }
.btn.choice .choice-num { font-family: var(--display); color: var(--gold); font-size: 14px; min-width: 16px; }
.btn.choice .choice-sub { flex-basis: 100%; padding-left: 30px; font-size: 15px; color: var(--ink-dim); font-style: italic; }
.btn.choice.dark { border-color: rgba(178,58,58,0.5); }
.btn.choice.dark:hover { border-color: var(--blood); }
.btn.choice.bright { border-color: rgba(79,179,191,0.5); }
.timer-note { font-family: var(--display); font-size: 14px; letter-spacing: 0.12em; color: var(--ember); text-transform: uppercase; }

/* attunement code display */
.attune { background: var(--panel); border: 1px solid var(--gold); border-radius: 12px; padding: 22px 28px; text-align: center; backdrop-filter: blur(8px); box-shadow: 0 0 40px rgba(212,169,78,0.15); animation: fadeUp .5s ease both; }
.attune-label { font-family: var(--display); font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-dim); }
.attune-word { font-family: var(--display); font-size: 64px; letter-spacing: 0.35em; color: var(--gold-2); text-shadow: 0 0 30px rgba(242,210,122,0.5); margin: 8px 0 4px; padding-left: 0.35em; }
.attune-sub { color: var(--ink-dim); font-size: 17px; }

/* token entry */
.token-entry { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
.token-row { display: flex; flex-direction: column; gap: 6px; }
.token-row label { font-family: var(--display); font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); }
.token-row.p0 label { color: var(--p1);} .token-row.p1 label { color: var(--p2);} .token-row.p2 label { color: var(--p3);} .token-row.p3 label { color: var(--p4);}
.token-entry .field { font-size: 26px; }

/* hints */
.hints .hint { padding: 10px 14px; border-left: 2px solid var(--line); margin: 8px 0; font-size: 18px; animation: fadeUp .3s ease both; }
.hints .hint.solution { border-color: var(--blood); }
.hints .hint-n { display: block; font-family: var(--display); font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); }
.hint-btn { margin-top: 8px; }

/* flowchart panel */
.flow-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; backdrop-filter: blur(8px); max-height: calc(100vh - 220px); overflow: auto; }
#panel:has(.flow-panel) { grid-template-columns: minmax(280px, 380px) 1fr; }
.flow-title { margin: 0 0 6px; font-size: 16px; color: var(--gold); }
.flow-stats { font-size: 16px; color: var(--ink-dim); margin-top: 6px; }
.pname { font-family: var(--display); }
.pname.p0 { color: var(--p1);} .pname.p1 { color: var(--p2);} .pname.p2 { color: var(--p3);} .pname.p3 { color: var(--p4);}
.chapter-list { display: flex; flex-direction: column; gap: 8px; }
.qr-box { text-align: center; } .qr svg { width: 260px; height: 260px; background: #fff; padding: 8px; border-radius: 6px; }
.qr-url { font-family: monospace; font-size: 15px; word-break: break-all; color: var(--ink-dim); }
code { font-family: ui-monospace, monospace; font-size: 0.85em; color: var(--sea); }

/* title screen */
#title { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 18px; text-align: center; padding: 20px; overflow-y: auto; }
#title > * { flex-shrink: 0; }
#title h1 { font-size: clamp(42px, 7vw, 84px); margin: 0; color: var(--gold-2); text-shadow: 0 0 40px rgba(212,169,78,0.35), 0 4px 30px rgba(0,0,0,0.7); font-weight: 700; letter-spacing: 0.12em; animation: fadeUp 1.6s ease both; }
#title .tagline { font-family: var(--hand); font-style: italic; font-size: 24px; color: var(--ink-dim); margin: -6px 0 10px; animation: fadeUp 1.6s .4s ease both; }
#title .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px 30px; backdrop-filter: blur(8px); box-shadow: var(--shadow); max-width: 760px; width: 100%; animation: fadeUp 1s .7s ease both; }

   * @param typeNumber 1 to 40

  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxEcCount = Math.max(maxEcCount, ecCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {

        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

      for (var i = 0; i < rsBlocks.length; i += 1) {

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }

      return data;

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {

        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

          var buffer = qrBitBuffer();

            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

          for (var i = 0; i < rsBlocks.length; i++) {

      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';

      qrHtml += '</table>';

      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';

      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +

      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;

      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {

        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }

      return escaped;

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {

        '█ ': '▀',
        ' █': '▄',
        '  ': ' '

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];

        ascii += '\n';

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  qrcode.stringToBytesFuncs = {

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

      draw: (p, a) => { ctx.fillStyle = `rgba(160,150,150,${a * 0.6})`; circle(p.x, p.y, p.r); }, wobble: 30 },

      draw: (p, a) => { ctx.fillStyle = `rgba(240,245,255,${a * 0.85})`; circle(p.x, p.y, p.r); }, wobble: 24 },
    motes: { n: 60, spawn: (p) => { p.x = Math.random() * W; p.y = Math.random() * H; p.vx = (Math.random() - 0.5) * 10; p.vy = (Math.random() - 0.5) * 10; p.life = 6 + Math.random() * 8; p.r = 1.5 + Math.random() * 2.5; p.hue = 170 + Math.random() * 60; },

      draw: (p, a) => { ctx.fillStyle = `hsla(${p.hue},80%,75%,${a * 0.7})`; circle(p.x, p.y, p.r); }, wobble: 0 },
    rain: { n: 160, spawn: (p) => { p.x = Math.random() * (W + 200) - 100; p.y = -20; p.vx = -60; p.vy = 380 + Math.random() * 200; p.life = 3; p.r = 1; },

  FX.fadeIn = function (ms) { return new Promise(res => { const o = ov(); o.style.transition = `opacity ${ms || 700}ms ease-out`; o.style.opacity = '0'; setTimeout(() => { o.style.pointerEvents = 'none'; res(); }, ms || 700); }); };
  FX.shake = function (el, ms) { el = el || document.body; el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), ms || 500); };

  window.VigilFX = FX;
})();

<script>/* js/core/store.js */
/* Game state, save/resume, elapsed timer, flowchart log. */
(function () {
  'use strict';
  const KEY = 'hearthfall.save.v1';
  const Store = {};
  const listeners = [];

  function fresh() {
    return {
      version: 1,
      scene: null,            // current scene id
      chapter: null,          // current chapter id
      flags: {},              // arbitrary key -> value
      choices: {},            // choiceId -> optionId
      tokens: {},             // tokenSlot -> decoded value
      visited: [],            // scene ids in order (for flowchart)
      hintsUsed: {},          // puzzleId -> level reached
      solved: {},             // puzzleId -> true
      names: ['Reader', 'Listener', 'Seer', 'Binder'], // seat names, left to right
      keys: ['A', 'C', 'M', '/'],
      elapsedMs: 0,           // accumulated play time (excluding pauses)
      startedAt: null,        // wall-clock of first start
      lastTick: null,
      log: [],                // notable events for epilogue
    };
  }

  Store.state = fresh();

  Store.load = function () {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return false;
      const s = JSON.parse(raw);
      if (!s || s.version !== 1) return false;
      Store.state = Object.assign(fresh(), s);
      return true;
    } catch (e) { return false; }
  };
  Store.hasSave = function () { try { return !!localStorage.getItem(KEY); } catch (e) { return false; } };
  Store.save = function () {
    try { localStorage.setItem(KEY, JSON.stringify(Store.state)); } catch (e) {}
    listeners.forEach(f => { try { f(Store.state); } catch (e) {} });
  };
  Store.reset = function () { Store.state = fresh(); try { localStorage.removeItem(KEY); } catch (e) {} };
  Store.onChange = (f) => listeners.push(f);

  Store.set = function (k, v) { Store.state.flags[k] = v; Store.save(); };
  Store.get = function (k, d) { const v = Store.state.flags[k]; return v === undefined ? d : v; };
  Store.inc = function (k, by) { Store.state.flags[k] = (Store.state.flags[k] || 0) + (by == null ? 1 : by); Store.save(); return Store.state.flags[k]; };
  Store.choose = function (id, opt) { Store.state.choices[id] = opt; Store.save(); };
  Store.chose = function (id, opt) { return opt === undefined ? Store.state.choices[id] : Store.state.choices[id] === opt; };
  Store.markSolved = function (id) { Store.state.solved[id] = true; Store.save(); };
  Store.isSolved = (id) => !!Store.state.solved[id];
  Store.note = function (text) { Store.state.log.push(text); Store.save(); };
  Store.visit = function (sceneId, chapterId) {
    Store.state.scene = sceneId; if (chapterId) Store.state.chapter = chapterId;
    if (Store.state.visited[Store.state.visited.length - 1] !== sceneId) Store.state.visited.push(sceneId);
    Store.save();
  };

  /* ---------- Timer ---------- */
  let ticking = false, tickHandle = null;
  Store.startTimer = function () {
    if (!Store.state.startedAt) Store.state.startedAt = Date.now();
    Store.state.lastTick = Date.now(); ticking = true;
    if (!tickHandle) tickHandle = setInterval(() => {
      if (!ticking || document.hidden) { Store.state.lastTick = Date.now(); return; }
      /* Clamped to one tick. The document.hidden guard above catches a backgrounded tab, but a CLOSED
         LID does not set document.hidden -- the interval simply stops, and the first tick after wake
         added the whole suspension in one go. A table that stops at Chapter VI and comes back next
         Saturday without closing the tab was credited the entire week, and ch8 prints this number as
         the last thing the game says about the night. */
      const now = Date.now(); Store.state.elapsedMs += Math.min(now - Store.state.lastTick, 2000); Store.state.lastTick = now;
      if (Math.floor(Store.state.elapsedMs / 1000) % 15 === 0) Store.save();
    }, 1000);
  };
  Store.pauseTimer = function () { ticking = false; Store.save(); };
  Store.resumeTimer = function () { Store.state.lastTick = Date.now(); ticking = true; };
  Store.elapsed = function () { return Store.state.elapsedMs; };
  Store.elapsedText = function () {
    const s = Math.floor(Store.state.elapsedMs / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  };

  window.VigilStore = Store;
})();

</script>
<script>/* js/core/input.js */
/* Four-key shared-keyboard input + on-screen fallback pads for touch/mouse. */
(function () {
  'use strict';
  const Input = {};
  let keys = ['Z', 'V', 'M', '.'];
  let handler = null, padsEl = null, active = false;
  const down = [false, false, false, false];

  Input.setKeys = function (k) { keys = k.map(x => String(x).toUpperCase()); if (padsEl) renderPads(); };
  Input.keys = () => keys.slice();
  Input.keyLabel = (i) => keys[i] === ' ' ? 'SPACE' : keys[i];

  function onKey(e, isDown) {
    if (e.repeat) return;
    if (!isDown) { // always release, even when inactive, so keys never stick
      const k0 = e.key.length === 1 ? e.key.toUpperCase() : e.key; const i0 = keys.indexOf(k0); if (i0 >= 0) down[i0] = false; else down.fill(false);
      if (!active) return;
    }
    if (!active) return;
    if (e.target && e.target.matches && e.target.matches('input,textarea')) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.length === 1 ? e.key.toUpperCase() : e.key;
    let idx = keys.indexOf(k);
    if (idx < 0 && e.code) { const byCode = keys.map(x => x.length === 1 && /[A-Z]/.test(x) ? 'Key' + x : x === '.' ? 'Period' : x === ',' ? 'Comma' : x === '/' ? 'Slash' : x === ';' ? 'Semicolon' : x === ' ' ? 'Space' : /[0-9]/.test(x) ? 'Digit' + x : x); idx = byCode.indexOf(e.code); }
    if (idx < 0) return;
    e.preventDefault();
    if (isDown) { if (down[idx]) return; down[idx] = true; press(idx, 'key'); }
    else down[idx] = false;
  }
  function press(idx, source) { if (handler) handler(idx, source); }

  window.addEventListener('keydown', e => onKey(e, true));
  window.addEventListener('keyup', e => onKey(e, false));

  function renderPads() {
    if (!padsEl) return;
    padsEl.innerHTML = '';
    for (let i = 0; i < 4; i++) {
      const b = document.createElement('button');
      b.className = 'pad pad-' + i; b.type = 'button';
      b.innerHTML = `<span class="pad-name">${escapeHtml(window.VigilStore ? (window.VigilStore.state.names[i] || 'Player ' + (i + 1)) : 'Player ' + (i + 1))}</span><span class="pad-key">${Input.keyLabel(i)}</span>`;
      const fire = (ev) => { ev.preventDefault(); if (!active) return; b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 120); press(i, 'pad'); };
      b.addEventListener('pointerdown', fire);
      padsEl.appendChild(b);
    }
  }

  /* Activate a 4-key session. handler(idx, source) is called on each press. */
  Input.activate = function (container, fn) {
    handler = fn; active = true; down.fill(false);
    if (container) { padsEl = container; padsEl.classList.add('pads'); renderPads(); }
  };
  Input.deactivate = function () { active = false; handler = null; if (padsEl) { padsEl.innerHTML = ''; padsEl.classList.remove('pads'); padsEl = null; } };
  /* Which keys are held right now. A phase that begins while hands are already on the keys reads this
     instead of waiting for a fresh keydown that will never come. */
  Input.held = () => down.slice();
  Input.pulse = function (idx, cls) { if (!padsEl) return; const b = padsEl.children[idx]; if (!b) return; b.classList.add(cls || 'glow'); setTimeout(() => b.classList.remove(cls || 'glow'), 260); };
  Input.setPadState = function (idx, cls, on) { if (!padsEl) return; const b = padsEl.children[idx]; if (b) b.classList.toggle(cls, !!on); };

  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  window.VigilInput = Input;
})();

</script>
<script>/* js/core/ui.js */
/* DOM + presentation helpers: element builder, typewriter, countdown bar, flowchart SVG, toasts, modals. */
(function () {
  'use strict';
  const UI = {};

  UI.esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  UI.el = function (tag, attrs, children) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
      else if (k === 'style' && typeof attrs[k] === 'object') Object.assign(e.style, attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    if (children) (Array.isArray(children) ? children : [children]).forEach(c => { if (c == null) return; e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;

      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')

  let skipRequested = false;

     person is named once, and the rule down the left side carries the rest. */
  function buildPara(para, st) {
    const isObj = typeof para === 'object';
    const text = isObj ? para.text : para;
    const speaker = isObj ? para.speaker : null;
    const same = !!(speaker && speaker === st.speaker);
    const cls = 'para' + (isObj && para.cls ? ' ' + para.cls : '') + (speaker ? ' speech' : '') + (same ? ' cont' : '');
    const p = UI.el('p', { class: cls });
    if (same && st.el) st.el.classList.add('joined');
    if (speaker && !same) p.appendChild(UI.el('span', { class: 'speaker', text: speaker }));
    const span = UI.el('span', { class: 'tw' });

  UI.fitBox = function (container, ghost) {

    // above the floor is too long, and scan-fit reports it as an overflow so it gets cut instead.
    const floor = Math.max(17, Math.round(base * 0.8));

  UI.typewrite = async function (container, paragraphs, opts) {
    opts = opts || {};

    skipRequested = false;
    // Continuity survives across calls into the same box: a choice's reply keeps Wren's rule going.
    const prev = container.__tw;

      ? { speaker: prev.speaker, el: prev.el } : { speaker: null, el: null };

    // Size the box for the finished text before a single character of it appears.
    if (opts.fit !== false) {
      const gst = { speaker: st.speaker, el: null };

      for (const para of paragraphs) { const b = buildPara(para, gst); b.span.innerHTML = b.html; ghost.appendChild(b.p); }
      UI.fitBox(container, ghost);
    }

    for (const para of paragraphs) {
      const b = buildPara(para, st);

        if (part.startsWith('<')) { out += part; span.innerHTML = out; continue; }

          out += ch; i++;

          if (i % 2 === 0) { span.innerHTML = out; if (window.VigilAudio && i % 6 === 0) window.VigilAudio.sfx('type'); await UI.sleep(speed * (ch === '.' || ch === '—' ? 6 : ch === ',' ? 2.5 : 1)); }
        }
        if (skipRequested) break;

      container.scrollTop = container.scrollHeight;
    }
    skipRequested = false;
  };

  /* Countdown bar: returns {promise, cancel}. onTick(secondsLeft). */
  UI.countdown = function (container, seconds, onTick) {
    const wrap = UI.el('div', { class: 'countdown' }, [UI.el('div', { class: 'countdown-fill' }), UI.el('span', { class: 'countdown-num', text: seconds })]);
    container.appendChild(wrap);
    const fill = wrap.firstChild, num = wrap.lastChild;
    let done = false, resolve; const promise = new Promise(r => resolve = r);
    const start = performance.now();
    function step(t) {
      if (done) return;
      if (!wrap.isConnected) { done = true; resolve('cancel'); return; } // the box was cleared or the tab changed
      const left = Math.max(0, seconds - (t - start) / 1000);
      fill.style.width = (left / seconds * 100) + '%';
      const s = Math.ceil(left); if (num.textContent != s) { num.textContent = s; if (onTick) onTick(s); if (s <= 5 && window.VigilAudio) window.VigilAudio.sfx('tick'); }
      wrap.classList.toggle('urgent', left < seconds * 0.3);

    return { promise, cancel: () => { done = true; wrap.remove(); resolve('cancel'); }, el: wrap };
  };

  UI.toast = function (msg, ms, cls) {
    const t = UI.el('div', { class: 'toast ' + (cls || ''), html: UI.rich(msg) });
    document.body.appendChild(t);
    requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 500); }, ms || 2600);
  };

  UI.modal = function (contentEl, opts) {
    opts = opts || {};
    const back = UI.el('div', { class: 'modal-back' });
    const box = UI.el('div', { class: 'modal ' + (opts.cls || '') });
    if (opts.title) box.appendChild(UI.el('h3', { class: 'modal-title', text: opts.title }));
    box.appendChild(contentEl);
    let closeBtn = null;
    if (!opts.noClose) { closeBtn = UI.el('button', { class: 'btn ghost modal-close', text: opts.closeText || 'Close', onclick: () => close() }); box.appendChild(closeBtn); }
    back.appendChild(box); document.body.appendChild(back);

  /* In-page dialogs (never native prompt/confirm: sandboxed hosts block them). Test hook: window.__autoDialog = { prompt: 'X', confirm: true } */
  UI.ask = function (text, def, opts) {
    opts = opts || {};
    if (window.__autoDialog && window.__autoDialog.prompt !== undefined) return Promise.resolve(window.__autoDialog.prompt);
    return new Promise((resolve) => {
      const box = UI.el('div', { class: 'ask' });
      box.appendChild(UI.el('p', { html: UI.rich(text) }));
      const inp = UI.el('input', { class: 'field' + (opts.plain ? ' plain' : ''), value: def || '', maxlength: opts.maxlength || 40, autocomplete: 'off', spellcheck: 'false', placeholder: opts.placeholder || '' });
      box.appendChild(inp);
      const row = UI.el('div', { class: 'row' });

      const done = (v) => { m.close(); resolve(v); };
      row.appendChild(UI.el('button', { class: 'btn primary', text: opts.ok || 'Speak', onclick: () => done(inp.value) }));
      row.appendChild(UI.el('button', { class: 'btn ghost', text: opts.cancel || 'Never mind', onclick: () => done(null) }));
      box.appendChild(row);
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') done(inp.value); if (e.key === 'Escape') done(null); });
      m = UI.modal(box, { title: opts.title || '', noClose: true, cls: 'ask-modal' });

  };
  UI.confirm = function (text, opts) {
    opts = opts || {};
    if (window.__autoDialog && window.__autoDialog.confirm !== undefined) return Promise.resolve(!!window.__autoDialog.confirm);
    return new Promise((resolve) => {
      const box = UI.el('div', { class: 'ask' });
      box.appendChild(UI.el('p', { html: UI.rich(text) }));
      const row = UI.el('div', { class: 'row' });
      let m;
      row.appendChild(UI.el('button', { class: 'btn primary' + (opts.danger ? ' danger' : ''), text: opts.ok || 'Yes', onclick: () => { m.close(); resolve(true); } }));
      row.appendChild(UI.el('button', { class: 'btn ghost', text: opts.cancel || 'No', onclick: () => { m.close(); resolve(false); } }));
      box.appendChild(row);
      m = UI.modal(box, { title: opts.title || '', noClose: true, cls: 'ask-modal' });
    });
  };
  UI.notice = function (text, opts) { opts = opts || {}; if (window.__autoDialog) return Promise.resolve(); return new Promise((resolve) => { const box = UI.el('div', { class: 'ask' }); box.appendChild(UI.el('p', { html: UI.rich(text) })); let m; box.appendChild(UI.el('div', { class: 'row' }, [UI.el('button', { class: 'btn primary', text: opts.ok || 'All right', onclick: () => { m.close(); resolve(); } })])); m = UI.modal(box, { title: opts.title || '', noClose: true, cls: 'ask-modal' }); }); };

  /* Flowchart renderer.  spec = { nodes:[{id,label,col,row,kind}], edges:[[a,b]] } ; done = Set of visited node ids
     opts = { avail:{w,h}, fontPx, plain, zoomTitle, colWidth, rowHeight }

     THE TYPE FLOOR IS THE LAYOUT. This used to lay every chart out at a fixed 190px column and let
     `.flowchart { max-width: 100% }` scale the result into whatever panel it landed in. The scale is
     the label size: a 1730px chart in a 786px panel writes its 15px labels at 6.8px, and at 1152x648
     at 5.7px, against a floor of 17px -- so every chapter ended on a picture the room could not read,
     in all nine chapters, at every viewport measured. Scaling cannot be fixed by making the numbers
     bigger, because effective size is fontSize x panelWidth / (cols x colWidth): only the ratio of
     type to column matters, and the ratio was wrong.
     So the chart is now laid out in REAL CSS PIXELS -- one viewBox unit is one pixel and the SVG is
     never scaled down -- and the geometry is chosen to fit the panel it is actually going into, at a
     type size that is the floor rather than the remainder. The node box is sized from the label, the
     widest wrap that still fits wins, and a chart that cannot fit even at the tightest wrap scrolls
     sideways in a panel that says so, instead of shrinking into a smear.
     No chapter's flow data changes: nodes keep their col, row and label. */
  UI.flowchart = function (spec, doneSet, opts) {
    opts = opts || {};
    const F = opts.fontPx || 17;                       // the readability floor, in real screen pixels
    const cols = Math.max(...spec.nodes.map(n => n.col)) + 1, rows = Math.max(...spec.nodes.map(n => n.row)) + 1;
    const availW = (opts.avail && opts.avail.w) || 0, availH = (opts.avail && opts.avail.h) || 0;
    const gapX = Math.round(F * 0.85), gapY = Math.round(F * 0.8);   // the chart is tight on both axes; see the note above
    /* A choice node is drawn as a chamfered hexagon rather than a true diamond. A diamond is only full
       width across its middle, so its label had to be wrapped a third narrower than everything else,
       and at the wraps this chart now needs that cost a word: ch1's "The hour before the bell" came out
       as "The hour before the…". The hexagon reads as a decision just as clearly and gives the label
       nearly the whole box. */
    const charsFor = (n, chars) => n.kind === 'choice' ? Math.max(6, Math.round(chars * 0.9)) : chars;
    /* Widest wrap first: a long label in few long lines reads better than the same label in a stack of
       stubs, and only when that does not fit do we trade width for height. Height is weighted higher
       because the panel scrolls down past the Continue button, and sideways it does not. */
    let g = null;
    for (const chars of [22, 20, 18, 16, 15, 14, 13, 12, 11, 10, 9, 8]) {
      const cut = spec.nodes.filter(n => wrap(n.label, charsFor(n, chars)).cut).length;
      const lines = Math.max(...spec.nodes.map(n => wrap(n.label, charsFor(n, chars)).length));
      const nw = Math.round(chars * F * 0.56) + 10, nh = lines * Math.round(F * 1.15) + 12;
      const cw = Math.max(opts.colWidth || 0, nw + gapX), rh = Math.max(opts.rowHeight || 0, nh + gapY);
      const W = cols * cw + 20, H = rows * rh + 20;
      /* A label that had to be cut is worth a lot of overflow: the chart is words, and a word lost is a
         path the room cannot read at any size. */
      const over = (availW ? Math.max(0, W - availW) : 0) + (availH ? Math.max(0, H - availH) * 1.5 : 0) + cut * 400;
      if (!g || over < g.over) g = { chars, lines, nw, nh, cw, rh, W, H, over, cut };   // ties keep the widest wrap
      if (!over) break;
    }
    const { nw, nh, cw, rh, W, H } = g;
    const pos = {}; spec.nodes.forEach(n => { pos[n.id] = { x: 10 + n.col * cw + (cw - nw) / 2, y: 10 + n.row * rh + (rh - nh) / 2 }; });
    let s = `<svg class="flowchart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="--fc-font:${F}px">`;
    s += `<defs><marker id="fc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>`;
    for (const [a, b] of spec.edges) {
      const pa = pos[a], pb = pos[b]; if (!pa || !pb) continue;
      const on = doneSet.has(a) && doneSet.has(b);
      const x1 = pa.x + nw, y1 = pa.y + nh / 2, x2 = pb.x, y2 = pb.y + nh / 2, mx = (x1 + x2) / 2;
      s += `<path class="fc-edge ${on ? 'on' : ''}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" marker-end="url(#fc-arrow)"/>`;
    }
    for (const n of spec.nodes) {
      const p = pos[n.id]; const on = doneSet.has(n.id);
      const kind = n.kind || 'beat';
      s += `<g class="fc-node ${kind} ${on ? 'on' : 'off'}" transform="translate(${p.x},${p.y})">`;
      if (kind === 'choice') { const c = Math.round(nh * 0.34); s += `<path d="M${c},0 L${nw - c},0 L${nw},${nh / 2} L${nw - c},${nh} L${c},${nh} L0,${nh / 2} z"/>`; }
      else if (kind === 'end') s += `<rect width="${nw}" height="${nh}" rx="${nh / 2}"/>`;
      else s += `<rect width="${nw}" height="${nh}" rx="6"/>`;
      const label = on || !n.secret ? n.label : '? ? ?';
      s += `<title>${UI.esc(label)}</title>`;   // the full label, for a chart that had to shorten one
      /* One <text> per node with a <tspan> per line, not one <text> per line: a wrapped label then still
         reads as one continuous string to anything walking the document (the playthrough scripts assert
         on these labels), and it is one accessible run rather than three fragments. */
      const lines = wrap(label, charsFor(n, g.chars));
      const step = Math.round(F * 1.15), top = nh / 2 - (lines.length - 1) / 2 * step + Math.round(F * 0.35);
      s += `<text x="${nw / 2}" y="${top}" text-anchor="middle">`;
      /* the trailing space is collapsed away by SVG's default xml:space, so it costs nothing on screen
         and keeps the wrapped label one readable string to a document walker */
      lines.forEach((ln, i) => { s += `<tspan x="${nw / 2}"${i ? ` dy="${step}"` : ''}>${UI.esc(ln) + (i < lines.length - 1 ? ' ' : '')}</tspan>`; });
      s += `</text>`;
      s += `</g>`;
    }
    s += `</svg>`;
    const wrapEl = UI.el('div', { class: 'flowchart-wrap', html: s });
    wrapEl.dataset.fit = JSON.stringify({ W, H, chars: g.chars, lines: g.lines, cut: g.cut, font: F, availW, availH,
      cutLabels: spec.nodes.filter(n => wrap(n.label, charsFor(n, g.chars)).cut).map(n => n.label) });
    if (!opts.plain) {
      wrapEl.classList.add('zoomable');
      wrapEl.title = 'Tap to enlarge';
      /* The enlarged copy is LAID OUT AGAIN, not the same SVG shown bigger: the modal is wider than the
         panel, so it can afford a wider wrap and fewer lines. Reusing the panel's markup is what left
         the old zoom scrolling sideways by 812px -- the chart it enlarged had been built for a box it
         was no longer in. Measure the modal first, then draw into it. */
      wrapEl.addEventListener('click', () => {
        const big = UI.el('div', { class: 'flowchart-wrap big' });
        UI.modal(big, { title: opts.zoomTitle || 'The paths you walked', cls: 'wide', closeText: 'Close' });
        const inner = UI.flowchart(spec, doneSet, { plain: true, fontPx: F, avail: { w: Math.max(320, big.clientWidth - 4), h: Math.max(240, big.clientHeight - 8) } });
        big.appendChild(inner.firstChild);
      });
      wrapEl.appendChild(UI.el('div', { class: 'flow-zoom-hint', text: W > availW && availW ? 'Drag the chart sideways · tap to enlarge' : 'Tap the chart to enlarge' }));
    }
    return wrapEl;
  };
  /* Up to five lines -- one more than the old three, because a narrow wrap at a readable size needs the
     room and a tall node is cheaper than a lost word. A label that still will not fit keeps its first
     words and says so with an ellipsis rather than dropping them silently, and marks itself `cut` so
     the layout chooser can pay almost anything to avoid it. The whole label is in the node's <title>. */
  const WRAP_LINES = 5;
  function wrap(text, n) {
    const words = String(text).split(' '); const lines = []; let cur = '';
    for (const w of words) { if ((cur + ' ' + w).trim().length > n && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); }
    if (cur) lines.push(cur);
    if (lines.length <= WRAP_LINES) return lines;
    const out = lines.slice(0, WRAP_LINES); out[WRAP_LINES - 1] = out[WRAP_LINES - 1].slice(0, Math.max(1, n - 1)) + '…'; out.cut = true; return out;
  }

  /* Simple pluralize / list join */
  /* A button that plays something. onPlay() returns the phrase length in ms (or nothing); while it plays the button
     shows it is listening, so a phone with its sound off still shows that the press did something. The icon is an
     inline drawing rather than a ♪ character, which some phone fonts do not have. */
  UI.AUDIO_ICON = '<svg class="audio-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4"/><path d="M8 7v10"/><path d="M12 4v16"/><path d="M16 7v10"/><path d="M20 10v4"/></g></svg>';
  UI.audioButton = function (label, onPlay, opts) {
    opts = opts || {};
    const text = String(label || 'Cup your ear').replace(/^[♪♫🔊]\s*/u, '');
    const btn = UI.el('button', { class: 'btn audio-btn ' + (opts.cls || ''), type: 'button', 'aria-label': text });
    const setLabel = (t) => { btn.innerHTML = UI.AUDIO_ICON + '<span class="audio-label">' + UI.esc(t) + '</span>'; };
    setLabel(text);
    let timer = null;
    const reset = () => { if (timer) clearTimeout(timer); timer = null; btn.classList.remove('playing'); setLabel(text); };
    btn.addEventListener('click', () => {
      UI.stopAudio(); // one phrase at a time: silence whatever else is playing and reset its button and strip
      try { if (window.VigilAudio && window.VigilAudio.unlockMedia) window.VigilAudio.unlockMedia(); } catch (e) {}
      let ms = 0;
      try { const r = onPlay(); ms = typeof r === 'number' && isFinite(r) ? r : 1800; } catch (e) { console.error(e); ms = 0; }
      if (ms <= 0) { reset(); return; }
      btn.classList.add('playing'); setLabel(opts.playing || 'Listening…');
      playingButton = reset;
      timer = setTimeout(() => { reset(); if (playingButton === reset) playingButton = null; }, ms);
    });
    return btn;
  };
  /* Only one phrase plays at a time. UI.stopAudio() resets the playing button and lit strip and tells the audio
     helpers (which listen for 'vigil:stop') to drop their pending notes. */
  let playingButton = null, litStrip = null;
  UI.stopAudio = function () {
    if (playingButton) { const r = playingButton; playingButton = null; r(); }
    if (litStrip) { const t = litStrip; litStrip = null; t(); }
    try { document.dispatchEvent(new CustomEvent('vigil:stop')); } catch (e) {}
  };
  /* Light each .step of the arrow strip inside el as its note sounds (the audio helpers announce 'vigil:step'). */
  UI.lightStrip = function (el, ms) {
    if (!el) return;
    if (litStrip) { const t = litStrip; litStrip = null; t(); }
    const steps = () => Array.from(el.querySelectorAll('.arrow-strip .step'));
    steps().forEach(s => s.classList.remove('on', 'done'));
    const on = (ev) => { const d = ev.detail || {}; const list = steps(); list.forEach((s, i) => { if (i < d.step) { s.classList.remove('on'); s.classList.add('done'); } }); const s = list[d.step]; if (s) { s.classList.add('on'); setTimeout(() => { s.classList.remove('on'); s.classList.add('done'); }, 600); } };
    document.addEventListener('vigil:step', on);
    let timer = null;
    const teardown = () => { if (timer) clearTimeout(timer); timer = null; document.removeEventListener('vigil:step', on); steps().forEach(s => s.classList.remove('on', 'done')); };
    litStrip = teardown;
    timer = setTimeout(() => { teardown(); if (litStrip === teardown) litStrip = null; }, ms || 20000);
  };
  UI.list = (arr) => arr.length <= 1 ? (arr[0] || '') : arr.slice(0, -1).join(', ') + ' and ' + arr[arr.length - 1];

  window.VigilUI = UI;
})();
