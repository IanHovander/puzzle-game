          [`${G.shapeSvg('Flame', false, { size: 44, color: '#f2d27a' })} standing up`, '<b>ASH</b> \u2014 <em>fire; the Hearth; warmth</em>'],
        ] });
        P.sight.push({ t: 'fine', text: 'Turn either one over and it says its opposite: the crown standing up would read **CROWN**; the flame upside down would read **COLD**. Neither shape is turned that way tonight. The table above is what the lamp actually says.' });
        P.sight.push({ t: 'p', text: 'So the lamp has two words: **EMBER** and **ASH**. Say them both, out loud, now.' });
        P.sight.push({ t: 'p', text: 'The brass cannot tell you which of them comes first \u2014 a circle has no beginning. Somebody at this table can *hear* which one does.' });
        P.sight.push({ t: 'fine', text: 'Every shape and both of its words live in your **Book**, all night. There is nothing to write down.' });
        P.wren.push({ t: 'h', text: 'The name on the door' });
        P.wren.push({ t: 'p', text: 'Every fourth-year\u2019s name is chalked on the dormitory door. Wren\u2019s is there twice. Once in our letters. Once in letters you have never seen before \u2014 and the handwriting is the same. You decided, a year ago, that somebody was being funny. You have never asked who.' });
      }

      if (roleId === 'listener') {
        P.sight.push({ t: 'h', text: 'The lamp is humming' });
        P.sight.push({ t: 'p', text: 'It has been humming since before you were born, and nobody else in this room has ever heard it. Two notes. Over and over.' });
        P.sight.push({ t: 'audio', label: 'The lamp, two notes', strip: CA.strip([3]), play: (A) => CA.playSteps(A, [3]), text: 'The second note is **three steps above** the first. It climbs.' });
        P.sight.push({ t: 'html', html: ladder3() });
        P.sight.push({ t: 'p', text: '**Two notes. Two words.** That is everything this lamp has to say. There is no third word and no fourth.' });
        P.sight.push({ t: 'p', text: 'Words in the old tongue sit on a ladder, each on its own rung \u2014 your **Book** has the whole ladder. When the Reader says the two words, look up their rungs. One order climbs three; the other falls three. The lamp climbs.' });
        P.sight.push({ t: 'fine', text: 'You never hear a word\u2019s name. Every room is tuned differently, so a single note means nothing on its own \u2014 you only ever hear how far the tune steps. You will need the Reader.' });
        P.wren.push({ t: 'h', text: 'How quiet' });
        P.wren.push({ t: 'html', html: `<div class="heartbeats">${['Reader', 'Listener', 'Seer', 'Binder'].map(n => `<div class="hb"><span>${n}</span>${D.trace('normal')}</div>`).join('')}<div class="hb"><span>Wren</span>${D.trace('flat')}</div></div>` });
        P.wren.push({ t: 'p', text: 'You can hear a teacher\u2019s heart through a stone floor. You have never once heard Wren\u2019s. You decided years ago that the fault was yours, and you have never said it out loud to anyone.' });
      }

      if (roleId === 'seer') {
        P.sight.push({ t: 'h', text: 'Under the lamp\u2019s foot' });
        P.sight.push({ t: 'p', text: 'Four sockets are set around the foot, with four hundred years of polish on top of them. Under the polish there are **two** cuts, and both were made before the polish ever went on.' });
        P.sight.push({ t: 'p', text: 'A long, deliberate **scratch** under socket **3**, the one at the bottom. A small **notch** under socket **1**, at the top. The numbers are the ones the Hearth shows.' });
        P.sight.push({ t: 'svg', cls: 'underlayer', svg: underFoot });
        P.sight.push({ t: 'fine', text: 'Somebody meant both of those. Which one matters is not yours to know \u2014 that is the Binder\u2019s half of the job. Just say what is cut, and where.' });
        P.sight.push({ t: 'fine', text: 'Your Ring Page is in the **Book**.' });
        P.wren.push({ t: 'h', text: 'The shadow' });
        P.wren.push({ t: 'svg', cls: 'underlayer', svg: underDorm });
        P.wren.push({ t: 'p', text: 'Every shadow in this room falls away from the lamp. Wren\u2019s falls toward it. You decided months ago it was a trick of the light. You are looking straight at it now, in the light you just made. It is not the light. It never was.' });
      }

      if (roleId === 'binder') {
        P.sight.push({ t: 'h', text: 'How a sigil is written' });
        P.sight.push({ t: 'p', text: 'You are the only person at this table who was ever taught this, and it is four lines long.' });
        P.sight.push({ t: 'html', html: `<div class="laws"><div class="law founders"><div class="era">Law 1 \u00b7 Founders\u2019 \u00b7 Year 0</div><div class="txt">A sigil is read sunwise from the mark.</div></div></div>` });
        P.sight.push({ t: 'list', items: [
          'A ring carries **cuts**: a scratch, a notch, a chip in the glaze. You cannot see them. Somebody here can. **A sigil begins at the scratch \u2014 that is the mark. A notch is only a maker\u2019s signature: it says somebody made this, and nothing else.**',
          'The **first** word goes **in** the marked slot. Not after it, not before it. In it.',
          'Every word after that goes into the next slot **sunwise** \u2014 clockwise, the way the numbers count up.',
          'A sigil is its words and nothing else. **One slot per word. Any slot the words do not reach stays empty.** A spare shape is not decoration; it is a different sigil, and the brass can tell.',
        ] });
        P.sight.push({ t: 'html', html: lawRing() });
        P.sight.push({ t: 'fine', text: 'You do not know this lamp\u2019s words and you cannot see what is cut into it. Ask for both. That is what the other three are for.' });
        P.wren.push({ t: 'h', text: 'No thread' });
        P.wren.push({ t: 'html', html: '<ul class="blk-list">'
          + '<li>' + threadLine('whole') + ' <strong>Reader and Listener:</strong> an old red thread, well knotted.</li>'
          + '<li>' + threadLine('broken') + ' <strong>Seer and you:</strong> last week\u2019s practice thread still will not hold.</li>'
          + '<li>' + threadLine('none') + ' <strong>Wren:</strong> nothing. No thread at all, to anyone.</li>'
          + '</ul>' });
        P.wren.push({ t: 'p', text: 'You have seen unbound people. Wren is not unbound. There is nothing there at all. You decided it was a blind spot in your own gift. You have never told anyone your gift has a blind spot.' });
      }

      return P;
    },
  });
})();

</script>
<script>/* js/content/companion/ch1.js */
/* Companion — Chapter I: The Vigil (THORN, no cast).
   One fact each, and no page holds another's: the Reader has who is pledged, the Listener who is still
   talking, the Seer who cannot be moved by anybody, the Binder who is sworn to whom. */
(function () {
  'use strict';
  const G = window.VigilGlyphs, L = window.VigilLore, CA = window.CompanionAudio, D = window.CompanionDraw;
  const C = window.CompanionContent;

  /* The nine Houses, sunwise from the Chair — a copy of the table in js/art/scenes-ch1.js (the phone does not load the art).
     The phone uses it for banners only. No page lists all nine as people. */
  const HOUSES = [
    { n: 1, house: 'Harrowden', color: '#3f7a4a', sym: 'chevron' },
    { n: 2, house: 'Ossery',    color: '#8c93a6', sym: 'crescent' },
    { n: 3, house: 'Dunmere',   color: '#4a5f8a', sym: 'tower' },
    { n: 4, house: 'Fellwood',  color: '#2f5a3a', sym: 'tree' },
    { n: 5, house: 'Goldmarch', color: '#b8892e', sym: 'sun' },
    { n: 6, house: 'Redmoor',   color: '#8a2f2f', sym: 'wave' },
    { n: 7, house: 'Sable',     color: '#5a3f8a', sym: 'stars' },
    { n: 8, house: 'Wyeburn',   color: '#8a6a3a', sym: 'key' },
    { n: 9, house: 'the Chair', color: '#2a2434', sym: 'crown' },
  ];
  const st = 'fill="none" stroke="#f4ecd8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"';
  function emblem(sym) {
    switch (sym) {
      case 'chevron': return `<path d="M9,27 L20,12 L31,27" ${st}/><path d="M13,31 L20,22 L27,31" ${st}/>`;
      case 'crescent': return `<path d="M25,9 A11,11 0 1 0 25,31 A8.5,8.5 0 1 1 25,9 Z" fill="#f4ecd8"/>`;
      case 'tower': return `<path d="M13,31 V14 H27 V31 Z M11,14 V9 H15 V14 M18,14 V9 H22 V14 M25,14 V9 H29 V14" ${st}/><path d="M18,31 V24 H22 V31" ${st}/>`;
      case 'tree': return `<path d="M20,7 L28,17 L24,17 L30,25 L25,25 L31,32 L9,32 L15,25 L10,25 L16,17 L12,17 Z" fill="#f4ecd8"/>`;
      case 'sun': return `<circle cx="20" cy="20" r="6" fill="#f4ecd8"/>${[0, 45, 90, 135, 180, 225, 270, 315].map(a => `<path d="M20,20 m${(Math.cos(a * Math.PI / 180) * 9).toFixed(1)},${(Math.sin(a * Math.PI / 180) * 9).toFixed(1)} l${(Math.cos(a * Math.PI / 180) * 5).toFixed(1)},${(Math.sin(a * Math.PI / 180) * 5).toFixed(1)}" ${st}/>`).join('')}`;
      case 'wave': return `<path d="M8,17 C12,12 16,12 20,17 C24,22 28,22 32,17" ${st}/><path d="M8,26 C12,21 16,21 20,26 C24,31 28,31 32,26" ${st}/>`;
      case 'stars': { const s = (x, y, r) => { let d = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; d += (i ? 'L' : 'M') + (x + Math.cos(a) * rr).toFixed(1) + ',' + (y + Math.sin(a) * rr).toFixed(1); } return `<path d="${d}Z" fill="#f4ecd8"/>`; }; return s(20, 12, 5) + s(12, 26, 5) + s(28, 26, 5); }
      case 'key': return `<circle cx="14" cy="16" r="5.5" ${st}/><path d="M18,20 L30,32 M26,28 L29,25 M23,25 L26,22" ${st}/>`;
      case 'crown': return `<g transform="translate(20,21) scale(0.9)" style="color:#f4ecd8">${G.shapeInner('Crown', false)}</g>`;
    }
    return '';
  }
  const banner = (h, size) => `<svg viewBox="0 0 40 40" width="${size || 30}" height="${size || 30}" style="display:inline-block;vertical-align:middle"><path d="M5,3 H35 V28 L20,38 L5,28 Z" fill="${h.color}" stroke="rgba(244,236,216,0.5)" stroke-width="1.5"/>${emblem(h.sym)}</svg>`;
  const seatLabel = (n) => `${banner(HOUSES[n - 1], 22)} <b>Seat ${n}</b>`;

  /* Seat positions for the two pictures: a ring, the Chair (9) at the top, sunwise. */
  const ring = (cx, cy, r) => HOUSES.map((h, i) => { const a = ((i + 0.5) / 9 * 360 - 90 + 20) * Math.PI / 180; return { n: h.n, x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r }; });
  const F = 'font-family="Cinzel,serif"';

  /* ---------- Seer: three things under the Great Hall ---------- */
  const underHall = (() => {
    const seats = ring(180, 150, 82);
    let s = `<svg viewBox="0 0 360 300"><rect width="360" height="300" fill="#000"/>`;
    s += `<g stroke="#fff" fill="none" stroke-width="1.2"><rect x="10" y="10" width="340" height="280"/>`;
    s += `<path d="M150,10 L150,42 A30,30 0 0 0 210,42 L210,10"/>`;
    s += `<rect x="18" y="60" width="16" height="110" stroke-dasharray="3,3"/></g>`;
    s += `<text x="180" y="58" text-anchor="middle" fill="#fff" font-size="9" ${F}>the Hearth</text>`;
    s += `<text x="26" y="184" text-anchor="middle" fill="#a482e6" font-size="8" ${F}>the tapestry</text>`;
    s += `<text x="26" y="194" text-anchor="middle" fill="#a482e6" font-size="7" ${F}>older paint under it</text>`;
    seats.forEach(p => { s += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="12" fill="none" stroke="#fff" stroke-width="1.2"/><text x="${p.x.toFixed(1)}" y="${(p.y + 4).toFixed(1)}" text-anchor="middle" fill="#fff" font-size="11" ${F}>${p.n}</text>`; });
    [5, 8].forEach(n => { const p = seats[n - 1]; s += `<g transform="translate(${p.x.toFixed(1)},${(p.y + 19).toFixed(1)})"><circle r="4.5" fill="none" stroke="#a482e6" stroke-width="1.5"/></g>`; });
    const p5 = seats[4], p8 = seats[7], p6 = seats[5];
    s += `<text x="${(p5.x + 10).toFixed(1)}" y="${(p5.y + 34).toFixed(1)}" fill="#a482e6" font-size="8" ${F}>coin</text>`;
    s += `<text x="${(p8.x - 10).toFixed(1)}" y="${(p8.y + 34).toFixed(1)}" text-anchor="end" fill="#a482e6" font-size="8" ${F}>coin</text>`;
    s += `<g transform="translate(${(p6.x + 24).toFixed(1)},${(p6.y + 2).toFixed(1)})"><path d="M-4,10 L-3,-4 L3,-4 L4,10 Z M0,-4 m-3,0 a3,3 0 1 1 6,0" fill="#a482e6"/><path d="M6,-11 L6,10" stroke="#a482e6" stroke-width="1.2"/></g>`;
    s += `<text x="${(p6.x + 34).toFixed(1)}" y="${(p6.y + 6).toFixed(1)}" fill="#a482e6" font-size="8" ${F}>a soldier</text>`;
    s += `<text x="180" y="284" text-anchor="middle" fill="#fff" font-size="8" ${F} opacity=".7">the nine seats, from above</text>`;
    return s + '</svg>';
  })();

  /* ---------- Binder: the two sworn threads ---------- */
  const threadMap = (() => {
    const seats = ring(180, 150, 96);
    const P = (n) => seats[n - 1];
    let s = `<svg viewBox="0 0 360 300"><rect width="360" height="300" fill="#000"/>`;
    const draw = (a, b) => `<path d="M${a.x.toFixed(1)},${a.y.toFixed(1)} L${b.x.toFixed(1)},${b.y.toFixed(1)}" stroke="#d96b4a" stroke-width="2.5"/><circle cx="${((a.x + b.x) / 2).toFixed(1)}" cy="${((a.y + b.y) / 2).toFixed(1)}" r="3.5" fill="#d96b4a"/>`;
    s += draw(P(2), P(1)) + draw(P(4), P(6));
    seats.forEach(p => { s += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="13" fill="#000" stroke="#fff" stroke-width="1.2"/><text x="${p.x.toFixed(1)}" y="${(p.y + 4).toFixed(1)}" text-anchor="middle" fill="#fff" font-size="11" ${F}>${p.n}</text>`; });
    s += `<text x="180" y="284" text-anchor="middle" fill="#d96b4a" font-size="9" ${F}>red, knotted — sworn. Two threads in the whole hall.</text>`;
    return s + '</svg>';
  })();

  const murmur = (n, text, steps, base) => ({
    t: 'audio', label: `Seat ${n}`, strip: `<div class="fine">overheard: <em>"${text}"</em></div>`, button: '♪ Cup your ear',
    play: (A) => CA.playSteps(A, steps, base),
  });

  C.chapters.push({
    id: 'ch1',
    pages: (roleId, ctx) => {
      const P = { sight: [], wren: [], speak: [] };
      P.speak.push({ t: 'fine', text: 'Nothing to speak yet. The Hearth will tell you when.' });
      P.speak.push({ t: 'fine', text: '*' + L.houseRule + '*' });

      if (roleId === 'reader') {
        P.sight.push({ t: 'h', text: 'The roll, before the doors shut' });
        P.sight.push({ t: 'p', text: 'A House that already knows how it will vote files that in writing before the doors shut. You can read the roll from the back of the hall.' });
        P.sight.push({ t: 'p', text: 'Two Houses filed tonight.' });
        P.sight.push({ t: 'table', head: ['filed', 'and it says'], rows: [
          [seatLabel(9), '<b>KEEP</b> \u2014 the Chair\u2019s own hand.'],
          [seatLabel(3), '<b>KEEP</b> \u2014 two words: <em>with the Chair.</em>'],
        ] });
        P.sight.push({ t: 'p', text: 'The other seven filed nothing. Nothing filed means **SEND**, unless somebody asks them.' });
        P.sight.push({ t: 'p', text: '**So you begin with two.** Say the number out loud. You need five.' });
        P.sight.push({ t: 'fine', text: 'And Seat 3 is already yours. Whatever you hear about Seat 3 tonight, an ask spent there buys a vote you have.' });
        P.wren.push({ t: 'h', text: 'Under the paint' });
        P.wren.push({ t: 'p', text: 'The Envoy said it out loud: *under the paint.* You know every word in this hall. You have never thought of the tapestry as something with words underneath.' });
        P.wren.push({ t: 'p', text: 'And when the fire bowed, every Master watched the fire. You watched the Provost. She was watching Wren.' });
      }

      if (roleId === 'listener') {
        P.sight.push({ t: 'h', text: 'Four murmurs' });
        P.sight.push({ t: 'p', text: 'Four Masters are talking under their breath. Nobody else can hear them.' });
        P.sight.push(murmur(1, 'The child goes to the capital \u2014 unless somebody comes and asks me to my face.', [-1, 1, -2], 52));
        P.sight.push(murmur(3, 'Ask me where I stand. Go on. Ask me.', [2, -1], 50));
        P.sight.push(murmur(4, 'I vote as my cousin votes. I hear nobody else.', [1, 1, -3], 48));
        P.sight.push(murmur(7, 'Nobody has asked me anything. I have not decided anything.', [-2, 2, 1], 54));
        P.sight.push({ t: 'p', text: 'So **Seats 1, 3 and 7 are still open to being talked to.**' });
        P.sight.push({ t: 'p', text: 'And **Seat 4 has shut his ears.** He means it. An ask spent on him is spent.' });
        P.sight.push({ t: 'fine', text: 'He never says who his cousin is. Somebody here can see that.' });
        P.wren.push({ t: 'h', text: 'When the fire bowed' });
        P.wren.push({ t: 'html', html: `<div class="heartbeats">${[['The Provost', 'normal'], ['The Envoy <small>(fast)</small>', 'fast'], ['Wren <small>(nothing to catch)</small>', 'flat']].map(([n, k]) => `<div class="hb"><span>${n}</span>${D.trace(k)}</div>`).join('')}</div>` });
        P.wren.push({ t: 'p', text: 'Nine Masters, steady. The Envoy, fast. Wren: nothing to catch, as always.' });
        P.wren.push({ t: 'p', text: 'And the Provost\u2019s heart skipped twice \u2014 while she was looking at Wren, not the fire.' });
      }

      if (roleId === 'seer') {
        P.sight.push({ t: 'h', text: 'Three things under this hall' });
        P.sight.push({ t: 'p', text: 'Nobody else can see them, and nothing anybody says tonight will change them.' });
        P.sight.push({ t: 'list', items: [
          '**Seat 5** \u2014 a Crown-struck coin under the cushion.',
          '**Seat 8** \u2014 the same coin, in the sleeve.',
          '**Seat 6** \u2014 a soldier in the Envoy\u2019s grey behind the chair. Nobody gets near enough to speak.',
        ] });
        P.sight.push({ t: 'svg', cls: 'underlayer', svg: underHall });
        P.sight.push({ t: 'p', text: 'Bought, bought, out of reach. **An ask spent on 5, 6 or 8 is spent.** Say those three numbers out loud.' });
        P.wren.push({ t: 'h', text: 'The tapestry, and the shadow' });
        P.wren.push({ t: 'p', text: 'Under the tapestry there is older paint. You can see *that* there is a shape under it. Not what. The Envoy was looking at that wall when he said it.' });
        P.wren.push({ t: 'p', text: 'In the dormitory you blamed the lamp. There is no lamp here, and Wren\u2019s shadow still falls towards the fire.' });
      }

      if (roleId === 'binder') {
        P.sight.push({ t: 'h', text: 'Who is sworn to whom' });
        P.sight.push({ t: 'p', text: 'Two red threads in the whole hall. Nobody else in the nine is tied to anybody.' });
        P.sight.push({ t: 'svg', cls: 'underlayer', svg: threadMap });
        P.sight.push({ t: 'list', items: [
          '**Seat 2 is sworn to Seat 1.** Seat 2 votes as Seat 1 votes \u2014 unless somebody asks Seat 2 directly.',
          '**Seat 4 is sworn to Seat 6.** They are cousins.',
        ] });
        P.sight.push({ t: 'p', text: 'So **one ask can be worth two votes**: ask the Master at the top of a thread and the one below comes too.' });
        P.sight.push({ t: 'fine', text: 'You cannot see who is pledged, who will listen, or who has been paid. Ask.' });
        P.wren.push({ t: 'h', text: 'No thread found' });
        P.wren.push({ t: 'p', text: 'Wren, on the dais, in front of nine Houses: *no thread found.* Not to the Provost. Not to you. Not unbound \u2014 you know unbound. Something else.' });
        P.wren.push({ t: 'p', text: 'And when the fire bowed you thought you saw a thread from the Provost to Wren. Then the light came back, and you are not sure what colour it was.' });
      }

      return P;
    },
  });
})();

</script>
<script>/* js/content/companion/ch2.js */
/* Companion — Chapter II: The Ember Vault (KNOT · cast: VOTE_LOST).
   One fact each, and no page holds another's: the Reader has the word cut into each plinth, the Listener
   the order the door hums, the Seer which hole each plinth was cut to stand in, the Binder which of the
   two rules is the older. */
(function () {
  'use strict';
  const G = window.VigilGlyphs, L = window.VigilLore, CA = window.CompanionAudio, D = window.CompanionDraw;
  const C = window.CompanionContent;
  const V = '#a482e6', AMBER = '#f2d27a', SEA = '#4fb3bf', RED = '#d96b4a';
  const F = 'font-family="Cinzel,serif"';

  /* One source of truth for the phone: the carving on each plinth, and the hole it was cut to stand in.
     Numbered the way the Hearth numbers plinths and dials. Keep in step with js/content/ch2.js. */
  const PLINTHS = [
    { n: 1, shape: 'Spike', inv: false },   // THORN
    { n: 2, shape: 'Hook', inv: true },     // VEIL
    { n: 3, shape: 'Crown', inv: true },    // EMBER
    { n: 4, shape: 'Hook', inv: false },    // KNOT
  ];
  const CUTFOR = [3, 4, 2, 1];              // plinth 1..4 -> the hole under that dial
  const laws = (ns) => `<div class="laws">${L.laws.filter(l => ns.includes(l.n)).sort((a, b) => ns.indexOf(a.n) - ns.indexOf(b.n)).map(l => `<div class="law ${l.era === 'O' ? 'order' : 'founders'}"><div class="era">Law ${l.n} · ${l.era === 'F' ? "Founders' · Year 0" : "Order's · Year " + l.year}</div><div class="txt">${l.text}</div></div>`).join('')}</div>`;

  /* Under the antechamber: four plinths as they stand, and under the grey floor the four holes they were
     cut for, numbered the way the Hearth numbers the dials. One violet line each and nothing else — no
     arrow to a rule and no word about which floor the door obeys. The Seer reports holes, not rules. */
  const underFloor = (() => {
    const xs = [58, 148, 238, 328];
    let s = `<svg viewBox="0 0 386 252"><rect width="386" height="252" fill="#000"/>`;
    s += `<line x1="12" y1="126" x2="374" y2="126" stroke="#fff" stroke-width="1" opacity=".45"/>`;
    s += `<rect x="20" y="96" width="26" height="24" rx="3" fill="none" stroke="${V}" stroke-width="1.5" stroke-dasharray="3 2"/>`;
    s += `<text x="33" y="90" text-anchor="middle" fill="${V}" font-size="8" ${F}>a hollow</text>`;
    xs.forEach((x, i) => {
      s += `<path d="M${x - 8},118 L${x - 6},72 C${x - 6},62 ${x + 6},62 ${x + 6},72 L${x + 8},118 Z" fill="none" stroke="#fff" stroke-width="1.2"/>`;
      s += `<rect x="${x - 20}" y="118" width="40" height="8" fill="none" stroke="#fff" stroke-width="1.2"/>`;
      s += `<text x="${x}" y="58" text-anchor="middle" fill="#fff" font-size="12" ${F}>${i + 1}</text>`;
      s += `<rect x="${x - 22}" y="176" width="44" height="12" rx="2" fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="3 2" opacity=".7"/>`;
      s += `<circle cx="${x}" cy="212" r="14" fill="none" stroke="#fff" stroke-width="1.3"/><text x="${x}" y="216" text-anchor="middle" fill="#fff" font-size="11" ${F}>${i + 1}</text>`;
    });
    xs.forEach((x, i) => {
      const tx = xs[CUTFOR[i] - 1];
      s += `<path d="M${x},130 C${x},154 ${tx},150 ${tx},172" fill="none" stroke="${V}" stroke-width="2" opacity=".95"/>`;
      s += `<path d="M${tx - 4},165 L${tx},174 L${tx + 4},165" fill="none" stroke="${V}" stroke-width="2"/>`;
    });
    s += `<text x="193" y="242" text-anchor="middle" fill="${V}" font-size="9" ${F}>the hole each plinth was cut to stand in</text>`;
    return s + `</svg>`;
  })();

  /* The Listener's gap, drawn: four dials that carry no coordinate at all. A picture that could name a
     dial would be the Seer's, so this one names none. */
  const dialsUnheard = () => `<svg viewBox="0 0 236 86" style="width:200px;height:73px">
    ${[0, 1, 2, 3].map(i => `<circle cx="${30 + i * 59}" cy="32" r="19" fill="none" stroke="${SEA}" stroke-width="2"/>`).join('')}
    <text x="118" y="76" text-anchor="middle" fill="${SEA}" font-size="11" ${F}>you hear when, never which</text>
  </svg>`;

  /* The Binder's rule, drawn: the same plinth over two floors, one arrow straight down and one bending
     across. No numbers — which plinth and which dial is the Seer's to say. Only which band binds is his. */
  const twoBands = () => `<svg viewBox="0 0 252 172" style="width:222px;height:151px">
    <rect x="6" y="6" width="240" height="62" fill="none" stroke="rgba(255,255,255,.22)"/>
    <text x="16" y="20" fill="rgba(255,255,255,.45)" font-size="9" ${F}>YEAR 212</text>
    <rect x="70" y="26" width="26" height="11" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1.5"/>
    <path d="M83,39 L83,52" stroke="rgba(255,255,255,.5)" stroke-width="1.5"/><path d="M79,47 L83,54 L87,47" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1.5"/>
    <circle cx="83" cy="60" r="5" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1.5"/>
    <path d="M12,64 L240,12" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/>
    <rect x="6" y="80" width="240" height="62" fill="none" stroke="${RED}"/>
    <text x="16" y="94" fill="${RED}" font-size="9" ${F}>YEAR 0</text>
    <rect x="70" y="100" width="26" height="11" fill="none" stroke="${RED}" stroke-width="1.5"/>
    <path d="M83,113 C83,126 176,122 176,128" fill="none" stroke="${RED}" stroke-width="2"/><path d="M172,122 L177,131 L181,122" fill="none" stroke="${RED}" stroke-width="2"/>
    <circle cx="83" cy="134" r="5" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1.2" stroke-dasharray="2 2"/>
    <circle cx="178" cy="136" r="5" fill="none" stroke="${RED}" stroke-width="1.5"/>
    <text x="126" y="164" text-anchor="middle" fill="${RED}" font-size="10" ${F}>the older band is the one that binds</text>
  </svg>`;

  /* A thread, drawn two ways: whole, and absent. */
  const threadLine = (kind) => `<svg viewBox="0 0 90 16" style="width:74px;height:14px;vertical-align:middle">${
    kind === 'whole' ? `<path d="M4,8 C24,2 34,14 52,8 S74,4 86,8" fill="none" stroke="${RED}" stroke-width="2.5" stroke-linecap="round"/>`
      : '<path d="M6,2 L2,2 L2,14 L6,14 M84,2 L88,2 L88,14 L84,14" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>'
  }</svg>`;

  /* Under the stair: four shadows fall away from the cold light, and Wren's reaches for it. */
  const underStair = `<svg viewBox="0 0 360 224">
    <rect width="360" height="224" fill="#000"/>
    <g stroke="#fff" fill="none" stroke-width="1.2">
      <path d="M10,196 L120,196 L120,176 L150,176"/><path d="M210,176 L240,176 L240,156 L350,156"/>
      <path d="M150,176 L150,220 M210,176 L210,220" stroke-dasharray="3 3" opacity=".6"/>
      <rect x="268" y="108" width="26" height="30" rx="3"/>
      <path d="M281,116 C285,120 287,124 287,127 C287,131 284,134 281,134 C278,134 275,131 275,127 C275,124 277,120 281,116 Z" fill="${SEA}" stroke="none" opacity=".9"/>
    </g>
    <g fill="#fff" opacity=".9"><circle cx="40" cy="182" r="6"/><circle cx="70" cy="176" r="6"/><circle cx="100" cy="182" r="6"/><circle cx="130" cy="166" r="6"/></g>
    <g stroke="#fff" stroke-width="3" opacity=".55" stroke-linecap="round"><path d="M40,182 L14,196"/><path d="M70,176 L44,192"/><path d="M100,182 L76,196"/><path d="M130,166 L108,182"/></g>
    <circle cx="300" cy="146" r="6" fill="${V}"/>
    <path d="M300,146 L340,144" stroke="${V}" stroke-width="3" opacity=".9" stroke-linecap="round"/>
    <path d="M300,146 C295,136 285,130 281,124" stroke="${V}" stroke-width="1.2" fill="none" stroke-dasharray="2 2"/>
    <g fill="#fff" font-size="9" ${F}><text x="28" y="208">Reader</text><text x="60" y="162">Listener</text><text x="88" y="208">Seer</text><text x="118" y="154">Binder</text><text x="292" y="172" fill="${V}">Wren</text></g>
    <text x="180" y="220" text-anchor="middle" fill="#fff" font-size="9" ${F} opacity=".7">four shadows fall away. One reaches.</text>
  </svg>`;

  C.chapters.push({
    id: 'ch2',
    pages: (roleId, ctx) => {
      const P = { sight: [], wren: [], speak: [] };
      const lost = !!ctx.flags.VOTE_LOST;
      P.speak.push({ t: 'fine', text: 'Nothing to speak yet. The Hearth will tell you when.' });
      P.speak.push({ t: 'fine', text: '*' + L.houseRule + '*' });

      /* ================= READER — what is cut into each plinth ================= */
      if (roleId === 'reader') {
        P.sight.push({ t: 'h', text: 'What is cut into the plinths' });
        P.sight.push({ t: 'p', text: 'One shape to a plinth, numbered the way the Hearth numbers them. The Hearth shows them worn away. On your page they are clean.' });
        P.sight.push({ t: 'table', head: ['cut into the plinth', 'and it says'], rows: PLINTHS.map(p => [
          `<b>Plinth ${p.n}</b><br>${G.shapeSvg(p.shape, p.inv, { size: 34, color: AMBER })}`,
          `<b>${G.read(p.shape, p.inv)}</b>`,
        ]) });
        P.sight.push({ t: 'fine', text: 'Two of them carry the same shape, one of the two upside down. That is the whole of the difference.' });
        P.sight.push({ t: 'p', text: '**Four words: THORN, VEIL, EMBER, KNOT.** Say them out loud, with their numbers.' });
        P.sight.push({ t: 'fine', text: 'A word that is not one of these four is not a count. The door counts once.' });
        P.sight.push({ t: 'fine', text: 'And if a strip of three shapes turns up tonight, it reads two ways. From the left: *one went down alone and kept it.* From the other end: *four, as one, went through.*' });
        P.sight.push({ t: 'fine', text: 'Which dial each word belongs on is not on this page and never was. Ask.' });
        P.wren.push({ t: 'h', text: 'Four words, and one name' });
        P.wren.push({ t: 'p', text: lost
          ? 'Wren was under guard when you went down. You have read every name in this school tonight, and the one you cannot read is chalked on a dormitory door in letters nobody has taught you. You decided a year ago that somebody was being funny. You have never asked who.'
          : 'Four words cut in stone tonight, and you read them without thinking. Wren\'s name is chalked on the dormitory door in letters nobody has taught you, in handwriting you know. You decided a year ago that somebody was being funny. Four floors down, you have started to wonder who wrote it.' });
      }

      /* ================= LISTENER — the order the door hums ================= */
      if (roleId === 'listener') {
        P.sight.push({ t: 'h', text: 'The door hums' });
        P.sight.push({ t: 'p', text: 'Touch a dial and the door hums four notes under it. You are the only one who hears how far the tune steps.' });
        P.sight.push({ t: 'audio', label: 'The door — four notes', strip: CA.strip([1, 3, -2]), play: (A) => CA.playSteps(A, [1, 3, -2]),
          text: '**Up one, up three, down two.** Four words, three steps. Of every order four words could be turned in, only one climbs like that.' });
        P.sight.push({ t: 'html', html: dialsUnheard() });
        P.sight.push({ t: 'fine', text: 'An order guessed is a whole count spent, and the door counts once.' });
        P.sight.push({ t: 'fine', text: 'You never hear a word\'s name, and you never hear which dial moved. The words belong to the Reader. The dials belong to the Seer.' });
        P.wren.push({ t: 'h', text: 'The steps behind you' });
        P.wren.push({ t: 'html', html: `<div class="heartbeats">${['Reader', 'Listener', 'Seer', 'Binder'].map(n => `<div class="hb"><span>${n}</span>${D.trace('normal')}</div>`).join('')}<div class="hb"><span>the Ember</span>${D.trace('flat')}</div><div class="hb"><span>Wren</span>${D.trace('flat')}</div></div>` });
        P.wren.push({ t: 'p', text: 'The Ember is a stone in a box and you did not expect a heart. ' + (lost ? 'Wren is two floors up, under guard.' : 'Wren promised to stay put.') + ' Then footsteps on the stair behind you, light and quick and familiar, and no heart walking with them. You have heard those feet every day for a year. Until this stair it never occurred to you that you have only ever heard the feet.' });
      }

      /* ================= SEER — which hole each plinth was cut to stand in ================= */
      if (roleId === 'seer') {
        P.sight.push({ t: 'h', text: 'Under the antechamber' });
        P.sight.push({ t: 'p', text: 'This floor is newer than the room. Under it, four holes are still cut in the old stone, one at each dial.' });
        P.sight.push({ t: 'p', text: 'Each hole was cut to fit one plinth and no other. Not one plinth is standing in the hole cut for it.' });
        P.sight.push({ t: 'svg', cls: 'underlayer', svg: underFloor });
        P.sight.push({ t: 'p', text: '**Plinth 1 was cut for the hole at dial 3. Plinth 2 for dial 4. Plinth 3 for dial 2. Plinth 4 for dial 1.** Say all four out loud.' });
        P.sight.push({ t: 'fine', text: 'A word set on the wrong dial is the whole count wrong, and the door counts once.' });
        P.sight.push({ t: 'fine', text: 'Behind the first plinth, at knee height, a hollow the rebuilders missed. The stone strip in it begins at its right-hand end, where the mark is cut.' });
        P.sight.push({ t: 'fine', text: 'Whether the door goes by these holes, by the floor above them or by the drill you were taught is not yours to say. Somebody here keeps the rules.' });
        P.wren.push({ t: 'h', text: 'Reaching' });
        P.wren.push({ t: 'svg', cls: 'underlayer', svg: underStair });
        P.wren.push({ t: 'p', text: 'In the dormitory it leaned toward the lamp and you called it the lamp. Down here there is no lamp, only a cold stone in a box that gives no light a shadow should want. ' + (lost ? 'Wren is meant to be on the dais, under guard.' : 'Wren is meant to be with the Provost.') + ' You are going to watch that shadow reach anyway. You already knew you would.' });
      }

      /* ================= BINDER — which of the two rules is the older ================= */
      if (roleId === 'binder') {
        P.sight.push({ t: 'h', text: 'Three ways to count, and which one binds' });
        P.sight.push({ t: 'html', html: laws([13, 9, 3]) });
        P.sight.push({ t: 'p', text: 'Two of those say opposite things, and the third settles it. The newer one was written in 212 — the year this room was rebuilt and the statues were put back.' });
        P.sight.push({ t: 'p', text: 'The third way is the one you were all taught in class: one, two, three, four, in the order it hums. **That is a drill, not a Law**, and it is younger than both of these.' });
        P.sight.push({ t: 'html', html: twoBands() });
        P.sight.push({ t: 'p', text: '**The older Law binds.** A plinth faces the hole it was cut to stand in, not the dial it happens to stand over.' });
        P.sight.push({ t: 'fine', text: 'Go by the floor, or by the drill, and every word lands on the wrong dial. The door counts once.' });
        P.sight.push({ t: 'fine', text: 'You cannot read a shape, hear a note, or see under a floor. Ask for all three.' });
        P.wren.push({ t: 'h', text: 'The same nothing' });
        P.wren.push({ t: 'html', html: '<ul class="blk-list">'
          + '<li>' + threadLine('none') + ' <strong>The Ember:</strong> nothing. It is a stone, and stones are not bound.</li>'
          + '<li>' + threadLine('none') + ' <strong>Wren:</strong> the same nothing, for the fourteenth year running.</li>'
          + '<li>' + threadLine('whole') + ' <strong>The Provost and the four of you:</strong> a thin red thread, new tonight.</li>'
          + '</ul>' });
        P.wren.push({ t: 'p', text: 'The stone did not trouble you. ' + (lost ? 'Vane\'s gold still runs to Wren, and it no longer runs towards the dais.' : 'Vane\'s gold still runs to Wren, so he has not left the school.') + ' You have never asked yourself why the two nothings feel different — or whether they are.' });
      }

      return P;
    },
  });
})();

</script>
<script>/* js/content/companion/ch3.js */
/* Companion — Chapter III: The Whispering Gallery (VEIL · cast: VOTE_LOST, WREN_HURT, VANE_ACCEPT ·
   mini-words: LINEN opens Speak, WARD turns Sight over to the Tower door).
   In the corridors, one fact each and no page holds another's: the Reader has what is cut over each hidden
   door, the Listener has how far along its round each patrol is, the Seer has where the rooms and the rounds
   and the cuts are, the Binder has who is bought — the porter, and the four rooms his gold pays for, which
   are drawn on nobody's map — and which room nobody searches.
   At the Tower: the Reader has what the three shapes say, the Listener which of them sounds first, the Seer
   what is cut under the ring, the Binder where a sigil begins. */
(function () {
  'use strict';
  const G = window.VigilGlyphs, L = window.VigilLore, CA = window.CompanionAudio, D = window.CompanionDraw, UI = window.VigilUI;
  const C = window.CompanionContent;
  const F = 'font-family="Cinzel,serif"';

  /* ---------- the corridors, as data (mirrors the Hearth's published grid) ---------- */
  const CELLS = ['A1', 'A2', 'A3', 'A4', 'A5', 'B1', 'C1', 'B3', 'C2', 'C3', 'C4', 'D3', 'B5', 'C5', 'D5', 'E1', 'E2', 'E3', 'E4', 'E5'];
  const EDGES = [['A1', 'B1'], ['B1', 'C1'], ['A1', 'A2'], ['A2', 'A3'], ['A3', 'A4'], ['A4', 'A5'], ['A5', 'B5'], ['B5', 'C5'], ['C5', 'D5'], ['D5', 'E5'], ['E1', 'E2'], ['E2', 'E3'], ['E3', 'E4'], ['E4', 'E5'], ['C5', 'C4'], ['C4', 'C3'], ['C3', 'C2'], ['C3', 'D3'], ['D3', 'E3']];
  const DOORS = [['A3', 'B3'], ['B3', 'C3']];
  /* The Seer's half of the patrols: which room each numbered stop is. The Listener's half — which stop, beat
     by beat — is ROUND_A / ROUND_B below, and neither array says anything on its own. */
  const WALK_A = ['A3', 'A4', 'A5', 'B5', 'C5', 'C4', 'C3'];
  const WALK_B = ['E1', 'E2', 'E3', 'E4'];
  const ROUND_A = [3, 4, 5, 6, 7, 6, 5, 4, 3, 2, 1, 2];
  const ROUND_B = [4, 4, 4, 4, 4, 4, 3, 2, 1, 1, 2, 3];

  /* ---------- Listener: the two rounds, drawn ----------
     One beat axis, two lanes, stop numbers and nothing else — no room letters anywhere, because the Listener
     hears a count, never a place. The accent is the sentry's six-beat stand at its stop 4: that flat run is
     the whole insight, and the two tables it replaces buried it. Drawn as a loop so no beat reads as a start. */
  const rounds = () => {
    const x = (b) => 26 + (b - 1) * 25;
    const yA = (s) => 62 - (s - 1) * 6, yB = (s) => 128 - (s - 1) * 12;
    const line = (r, y, col, w) => `<polyline points="${r.map((s, i) => x(i + 1) + ',' + y(s)).join(' ')}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round"/>`;
    let s = `<svg viewBox="0 0 336 170" style="width:100%;max-width:330px;height:auto">`;
    s += `<text x="4" y="18" fill="#4fb3bf" font-size="9" ${F}>the lantern</text>`;
    s += line(ROUND_A, yA, 'rgba(79,179,191,.5)', 1.6);
    s += ROUND_A.map((st, i) => `<circle cx="${x(i + 1)}" cy="${yA(st)}" r="2.6" fill="rgba(79,179,191,.75)"/>`).join('');
    s += `<text x="4" y="84" fill="#4fb3bf" font-size="9" ${F}>the sentry</text>`;
    s += line(ROUND_B, yB, 'rgba(79,179,191,.45)', 1.6);
    // the accent: six beats without a step
    s += `<line x1="${x(1)}" y1="${yB(4)}" x2="${x(6)}" y2="${yB(4)}" stroke="#4fb3bf" stroke-width="4" stroke-linecap="round"/>`;
    s += `<text x="${x(3.5)}" y="${yB(4) - 7}" text-anchor="middle" fill="#4fb3bf" font-size="9" ${F}>six beats, not a step</text>`;
    s += ROUND_B.map((st, i) => `<circle cx="${x(i + 1)}" cy="${yB(st)}" r="2.6" fill="rgba(79,179,191,.75)"/>`).join('');
    s += `<g fill="rgba(255,255,255,.45)" font-size="7.5" ${F}>` + [1, 2, 3, 4, 5, 6, 7].map(st => `<text x="14" y="${yA(st) + 3}" text-anchor="middle">${st}</text>`).join('')
      + [1, 2, 3, 4].map(st => `<text x="14" y="${yB(st) + 3}" text-anchor="middle">${st}</text>`).join('') + `</g>`;
    s += `<g fill="rgba(255,255,255,.55)" font-size="8" ${F} text-anchor="middle">` + ROUND_A.map((_, i) => `<text x="${x(i + 1)}" y="146">${i + 1}</text>`).join('') + `</g>`;
    s += `<path d="M${x(12)},152 q-140,15 -276,0" fill="none" stroke="rgba(79,179,191,.6)" stroke-width="1.2"/><path d="M${x(1)},152 l8,4 l-1,-9 z" fill="rgba(79,179,191,.8)"/>`;
    s += `<text x="168" y="10" text-anchor="middle" fill="rgba(255,255,255,.6)" font-size="8" ${F}>twelve beats, then round again</text>`;
    return s + `</svg>`;
  };

  /* ---------- Seer: the under-layer of the corridors ----------
     Room ids, the two seams nobody else can find, and the numbered stops each round walks through — the stop
     numbers are the only coordinate this page shares with the Listener's, and they are what makes the two
     halves of a patrol into one fact. No timings anywhere.
     The porter is NOT drawn here. His lodge and the rooms it looks into used to be three dashed rays on this
     map, and every schedule the Binder's rule rules out already crossed one of them, which left the Binder
     holding nothing. The lodge is the Binder's page now, and this map says only where the walls are. */
  function underCorridors(hurt) {
    const S = 52, pad = 18, W = 5 * S + pad * 2, H = 5 * S + pad * 2 + 26;
    const col = (c) => c.charCodeAt(0) - 65, row = (c) => parseInt(c.slice(1), 10) - 1;
    const xy = (c) => ({ x: pad + col(c) * S, y: pad + row(c) * S });
    const open = new Set(); EDGES.forEach(([a, b]) => { open.add(a + '|' + b); open.add(b + '|' + a); });
    const door = new Set(); DOORS.forEach(([a, b]) => { door.add(a + '|' + b); door.add(b + '|' + a); });
    let s = `<svg viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="#000"/>`;
    s += `<defs><pattern id="ch3hatch" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0,6 L6,0" stroke="#fff" stroke-width=".5" opacity=".18"/></pattern></defs>`;
    for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
      const id = String.fromCharCode(65 + c) + (r + 1), p = { x: pad + c * S, y: pad + r * S };
      const isOpen = CELLS.includes(id);
      s += `<rect x="${p.x}" y="${p.y}" width="${S}" height="${S}" fill="${isOpen ? '#000' : 'url(#ch3hatch)'}" stroke="#fff" stroke-width="${isOpen ? 1.2 : 0.4}" opacity="${isOpen ? 1 : 0.7}"/>`;
      if (isOpen) s += `<text x="${p.x + 4}" y="${p.y + 10}" fill="#fff" font-size="8" ${F} opacity=".7">${id}</text>`;
    }
    for (const a of CELLS) for (const b of CELLS) {
      if (a >= b) continue; const dc = col(b) - col(a), dr = row(b) - row(a); if (Math.abs(dc) + Math.abs(dr) !== 1) continue;
      const A = xy(a), isOpen = open.has(a + '|' + b), isDoor = door.has(a + '|' + b);
      if (!isOpen && !isDoor) continue;
      if (dc) { const x = A.x + S; s += `<line x1="${x}" y1="${A.y + 7}" x2="${x}" y2="${A.y + S - 7}" stroke="${isDoor ? '#a482e6' : '#000'}" stroke-width="${isDoor ? 3 : 4}" ${isDoor ? 'stroke-dasharray="4 3"' : ''}/>`; }
      else { const y = A.y + S; s += `<line x1="${A.x + 7}" y1="${y}" x2="${A.x + S - 7}" y2="${y}" stroke="${isDoor ? '#a482e6' : '#000'}" stroke-width="${isDoor ? 3 : 4}" ${isDoor ? 'stroke-dasharray="4 3"' : ''}/>`; }
    }
    // the numbered stops of the two rounds
    const stops = (walk, label) => walk.map((c, i) => {
      const p = xy(c);
      return `<circle cx="${p.x + S - 12}" cy="${p.y + S - 12}" r="7.5" fill="#000" stroke="#fff" stroke-width="1"/><text x="${p.x + S - 12}" y="${p.y + S - 9}" text-anchor="middle" fill="#fff" font-size="8" ${F}>${i + 1}</text>`;
    }).join('') + (() => { const p = xy(walk[0]); return `<text x="${p.x + S / 2}" y="${p.y + 22}" text-anchor="middle" fill="#fff" font-size="7" ${F} opacity=".65">${label}</text>`; })();
    s += stops(WALK_A, 'lantern 1') + stops(WALK_B, 'sentry 1');
    // the laundry and the Tower door
    const b3 = xy('B3'); s += `<text x="${b3.x + S / 2}" y="${b3.y + S / 2 + 3}" text-anchor="middle" fill="#a482e6" font-size="9" ${F}>laundry</text>`;
    const g = xy('E5'); s += `<circle cx="${g.x + S / 2}" cy="${g.y + S / 2}" r="13" fill="none" stroke="#fff" stroke-dasharray="3 2"/><text x="${g.x + S / 2}" y="${g.y + 20}" text-anchor="middle" fill="#fff" font-size="7" ${F}>tower door</text>`;
    s += `<g ${F} font-size="7.5"><line x1="${pad}" y1="${H - 12}" x2="${pad + 18}" y2="${H - 12}" stroke="#a482e6" stroke-width="3" stroke-dasharray="4 3"/><text x="${pad + 22}" y="${H - 9}" fill="#a482e6">a seam, and a shape cut over it</text></g>`;
    if (hurt) s += `<text x="${W - pad}" y="${pad - 6}" text-anchor="end" fill="#fff" font-size="8" ${F} opacity=".8">Wren cannot run tonight</text>`;
    return s + `</svg>`;
  }

  /* ---------- Seer: the Gallery, shadows as they fall (Wren's falls toward the lamp) ---------- */
  const underGallery = `<svg viewBox="0 0 360 220">
    <rect width="360" height="220" fill="#000"/>
    <g stroke="#fff" fill="none" stroke-width="1.2">
      <rect x="10" y="10" width="340" height="200"/>
      ${[0, 1, 2, 3, 4].map(i => `<rect x="${24 + i * 58}" y="22" width="40" height="52"/><rect x="${24 + i * 58}" y="150" width="40" height="52"/>`).join('')}
      <circle cx="330" cy="110" r="10"/><path d="M330,100 L330,88 M324,92 L336,92"/>
      <text x="330" y="136" text-anchor="middle" fill="#fff" font-size="9" font-family="Cinzel,serif" stroke="none">the lamp</text>
    </g>
    <g fill="#fff" opacity=".9"><circle cx="90" cy="110" r="6"/><circle cx="130" cy="96" r="6"/><circle cx="150" cy="128" r="6"/><circle cx="190" cy="106" r="6"/><circle cx="250" cy="112" r="5"/></g>
    <g stroke="#fff" stroke-width="3" opacity=".55" stroke-linecap="round"><path d="M90,110 L52,110"/><path d="M130,96 L96,92"/><path d="M150,128 L116,132"/><path d="M190,106 L154,104"/></g>
    <g stroke="#a482e6" stroke-width="3" opacity=".9" stroke-linecap="round"><path d="M250,112 L300,112"/></g>
    <g fill="#fff" font-size="9" font-family="Cinzel,serif"><text x="78" y="128">Reader</text><text x="120" y="86">Listener</text><text x="140" y="146">Seer</text><text x="180" y="124">Binder</text><text x="238" y="130" fill="#a482e6">Wren</text></g>
    <text x="180" y="214" text-anchor="middle" fill="#fff" font-size="9" font-family="Cinzel,serif" opacity=".7">shadows, as they fall — the portraits have none</text>
  </svg>`;

  /* ---------- Seer: under the Tower door ----------
     Four slots, numbered as the Hearth numbers them, and TWO cuts. No arrow, no direction, no rule:
     the Seer reports cuts, not meanings. (ch0's underFoot, one notch harder.) */
  const underRing = `<svg viewBox="0 0 360 240">
    <rect width="360" height="240" fill="#000"/>
    <g transform="translate(180,118)">
      <circle r="66" fill="none" stroke="#fff" stroke-width="1.5"/>
      ${[0, 1, 2, 3].map(i => { const a = (i / 4 * 360 - 90) * Math.PI / 180, x = (Math.cos(a) * 66).toFixed(1), y = (Math.sin(a) * 66).toFixed(1), hot = i === 0;
        return `<circle cx="${x}" cy="${y}" r="16" fill="none" stroke="${hot ? '#a482e6' : '#fff'}" stroke-width="${hot ? 2.5 : 1.5}"/><text x="${x}" y="${(+y + 4).toFixed(1)}" text-anchor="middle" fill="${hot ? '#a482e6' : '#fff'}" font-size="12" font-family="Cinzel,serif">${i + 1}</text>`; }).join('')}
    </g>
    <g stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".85"><path d="M68,112 L58,106 L58,118"/></g>
    <text x="62" y="132" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="10" font-family="Cinzel,serif">a small notch</text>
    <g stroke="#a482e6" stroke-width="2.5" stroke-linecap="round"><path d="M152,30 L208,24"/><path d="M154,38 L204,33"/></g>
    <text x="180" y="16" text-anchor="middle" fill="#a482e6" font-size="10" font-family="Cinzel,serif">a scratch — long, deliberate</text>
    <text x="180" y="232" text-anchor="middle" fill="#fff" font-size="9" font-family="Cinzel,serif" opacity=".7">two cuts, under the soot</text>
  </svg>`;

  /* ---------- Reader: the arch, drawn as a band ----------
     A band has no first stone and no last, so the picture cannot imply an order — and the three shapes are
     set down in the reverse of the answer, so reading them round from the left fails. (ch0's collar.) */
  const archBand = () => `<svg viewBox="0 0 300 168" style="width:100%;max-width:280px">
    <circle cx="150" cy="84" r="60" fill="none" stroke="rgba(212,169,78,.3)" stroke-width="11"/>
    <g transform="translate(90,84) scale(1.1)" style="color:#f2d27a">${G.shapeInner('Hook', false)}</g>
    <g transform="translate(150,24) scale(1.1)" style="color:#f2d27a">${G.shapeInner('Spike', false)}</g>
    <g transform="translate(210,84) scale(1.1)" style="color:#f2d27a">${G.shapeInner('Flame', false)}</g>
    <text x="150" y="162" text-anchor="middle" fill="rgba(233,226,210,.55)" font-size="11" font-family="Cinzel,serif">the arch runs right over · no first, no last</text>
  </svg>`;

  /* ---------- Binder: a thread, drawn by what it is ----------
     red an oath, gold the Crown's coin, none no thread at all. No rooms and no numbers: the Binder holds
     whether, never where. */
  const thread = (kind) => `<svg viewBox="0 0 90 16" style="width:74px;height:14px;vertical-align:middle">${
    kind === 'oath' ? '<path d="M4,8 C24,2 34,14 52,8 S74,4 86,8" fill="none" stroke="#d96b4a" stroke-width="2.5" stroke-linecap="round"/><circle cx="45" cy="9" r="3.2" fill="#d96b4a"/>'
    : kind === 'coin' ? '<path d="M4,8 C24,3 60,13 78,8" fill="none" stroke="#c8a24a" stroke-width="2" stroke-dasharray="5 3" stroke-linecap="round"/><circle cx="83" cy="8" r="4" fill="#c8a24a"/>'
    : '<path d="M6,2 L2,2 L2,14 L6,14 M84,2 L88,2 L88,14 L84,14" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>'
  }</svg>`;

  const boots = (A) => { A.init(); if (A.isMuted()) A.setMuted(false); for (let i = 0; i < 7; i++) CA.later(() => A.sfx('step'), i * 250); for (let i = 0; i < 4; i++) CA.later(() => A.sfx('miss'), 2100 + i * 620); return 2100 + 4 * 620 + 400; };

  C.chapters.push({
    id: 'ch3',
    miniWords: { LINEN: 'speak', WARD: 'sight' },
    pages: (roleId, ctx) => {
      const P = { sight: [], wren: [], speak: [] };
      const f = ctx.flags || {}; const hurt = !!f.WREN_HURT, lost = !!f.VOTE_LOST, accepted = !!f.VANE_ACCEPT;
      const ward = ctx.mini('WARD');   // the Tower half of every Sight page, and only after the Hearth asks

      /* ================= READER ================= */
      if (roleId === 'reader') {
        if (!ward) {
          P.sight.push({ t: 'h', text: 'What is cut over the seams' });
          P.sight.push({ t: 'p', text: 'Two doors between here and the Tower are drawn on nothing. You cannot find them. You can read the one shape cut over each.' });
          P.sight.push({ t: 'table', head: ['cut over the seam', 'scratch at the left end', 'scratch at the right end'], rows: [
            [`${G.shapeSvg('Crown', false, { size: 38, color: '#f2d27a' })}<div class="fine">the west wall</div>`, '<b>CROWN</b>', '<b>EMBER</b>'],
            [`${G.shapeSvg('Spike', false, { size: 38, color: '#f2d27a' })}<div class="fine">the laundry’s back wall</div>`, '<b>THORN</b>', '<b>WELL</b>'],
          ] });
          P.sight.push({ t: 'p', text: '**One shape, two words, and only one of them opens a seam.** Say both, out loud, for each.' });
          P.sight.push({ t: 'fine', text: 'A word that is not the one costs Wren a turn — and a turn more for every guess that seam already remembers. The Hearth counts what is left.' });
          P.sight.push({ t: 'fine', text: 'Which end the scratch is on is not yours to see. Ask the Seer, seam by seam.' });
        } else {
          P.sight.push({ t: 'h', text: 'The arch over the Tower door' });
          P.sight.push({ t: 'p', text: 'Three shapes are cut into the arch, all of them standing up. The Hearth shows them worn away. On your page they are clean.' });
          P.sight.push({ t: 'html', html: archBand() });
          P.sight.push({ t: 'table', head: ['cut into the arch', 'it says'], rows: [
            [G.shapeSvg('Hook', false, { size: 40, color: '#f2d27a' }), '<b>KNOT</b>'],
            [G.shapeSvg('Spike', false, { size: 40, color: '#f2d27a' }), '<b>THORN</b>'],
            [G.shapeSvg('Flame', false, { size: 40, color: '#f2d27a' }), '<b>ASH</b>'],
          ] });
          P.sight.push({ t: 'fine', text: 'An arch has no first stone. This page cannot tell you which word comes first, and a wrong order wakes nothing. Somebody here can *hear* it.' });
        }
        P.wren.push({ t: 'h', text: 'The plaques' });
        P.wren.push({ t: 'p', text: 'Every portrait carries a brass plaque: a name, a House, a year. On the four oldest, the letters are the ones from the dormitory door.' });
        P.wren.push({ t: 'p', text: 'The second version of Wren’s name, chalked there in the same hand.' });
        P.wren.push({ t: 'fine', text: 'You decided a year ago that somebody was being funny. You still cannot read either of them.' });
      }

      /* ================= LISTENER ================= */
      if (roleId === 'listener') {
        if (!ward) {
          P.sight.push({ t: 'h', text: 'Two rounds in the dark' });
          P.sight.push({ t: 'p', text: 'Two patrols. Each walks a round of **twelve beats** and then walks the very same round again. One beat is one turn on the Hearth.' });
          P.sight.push({ t: 'audio', label: 'Boots, in the dark', strip: '<div class="fine">quick and soft, then slow and iron-shod</div>', play: boots,
            text: 'The lantern goes out along its corridor and comes back. The sentry stands a long while at one end, walks away, and comes back.' });
          P.sight.push({ t: 'html', html: rounds() });
          P.sight.push({ t: 'fine', text: '**Lose the count and Wren walks into somebody.** A sighting sends Wren back, and the count keeps running.' });
          P.sight.push({ t: 'fine', text: 'You hear how far along a round they are. Never which room that is. The Seer has the rooms.' });
        } else {
          P.sight.push({ t: 'h', text: 'The ward hums' });
          P.sight.push({ t: 'p', text: 'Three notes under the soot, over and over. Nobody else in this stairwell can hear them.' });
          P.sight.push({ t: 'audio', label: 'The threshold, humming', strip: CA.strip([1, 1]), play: (A) => CA.playSteps(A, [1, 1]),
            text: 'The second note is **one rung above** the first. The third is one rung above that.' });
          P.sight.push({ t: 'p', text: 'Three notes, three words. Look their rungs up on the Ladder in your **Book**. Only one order climbs one, then one.' });
          P.sight.push({ t: 'fine', text: 'You never hear a word’s name. The Reader has the words. Say the climb out loud, and let them put it in order.' });
        }
        P.wren.push({ t: 'h', text: 'How quiet' });
        P.wren.push({ t: 'html', html: `<div class="heartbeats">${[['The Provost', 'normal'], ['The captain', 'normal'], ['The porter', 'fast']].map(([n, k]) => `<div class="hb"><span>${n}</span>${D.trace(k)}</div>`).join('')}<div class="hb"><span>Wren</span>${D.trace('flat')}</div></div>` });
        P.wren.push({ t: 'p', text: hurt ? 'With the lamps out you will hear every heart in these corridors. The Provost’s. The porter’s. Every soldier’s. Not the one walking beside you in a sling.' : 'With the lamps out you will hear every heart in these corridors. The Provost’s. The porter’s. Every soldier’s. Not the one walking beside you.' });
        P.wren.push({ t: 'fine', text: 'You decided years ago that the fault was yours. You have never said it out loud to anyone.' });
      }

      /* ================= SEER ================= */
      if (roleId === 'seer') {
        if (!ward) {
          P.sight.push({ t: 'h', text: 'Under the corridors' });
          P.sight.push({ t: 'p', text: 'The Hearth draws rooms by letter and number. The Listener counts stops along a round. Only you have both.' });
          P.sight.push({ t: 'svg', cls: 'underlayer', svg: underCorridors(hurt) });
          P.sight.push({ t: 'p', text: '**The west seam is scratched at its left end. The laundry’s back seam is scratched at its right.**' });
          P.sight.push({ t: 'fine', text: 'Give the Reader the end before anybody speaks. A wrong word costs a turn, and more at a seam you have guessed at before.' });
          P.sight.push({ t: 'fine', text: 'What a shape says is not yours, and neither is what a cry costs. Say where things are, and stop.' });
        } else {
          P.sight.push({ t: 'h', text: 'Under the Tower door' });
          P.sight.push({ t: 'p', text: 'Four slots below the arch, black with soot. Two things are cut under them, and both were cut long before the soot.' });
          P.sight.push({ t: 'svg', cls: 'underlayer', svg: underRing });
          P.sight.push({ t: 'p', text: '**A small notch under slot 4. A long, deliberate scratch under slot 1.** The numbers are the ones the Hearth shows.' });
          P.sight.push({ t: 'fine', text: 'Which cut matters is not yours to know. That is the Binder’s half. Say what is cut, and where.' });
        }
        P.wren.push({ t: 'h', text: 'The shadow' });
        P.wren.push({ t: 'svg', cls: 'underlayer', svg: underGallery });
        P.wren.push({ t: 'p', text: 'Two hundred painted Masters and not one shadow between them, because paint has none. Five living people in that gallery, and five shadows. Four of them fall away from the lamp.' });
        P.wren.push({ t: 'fine', text: hurt ? 'Wren’s falls toward it, with one arm of it hanging wrong. It always has fallen that way. You have run out of lamps to blame.' : 'Wren’s falls toward it. It always has. You have run out of lamps to blame.' });
      }

      /* ================= BINDER ================= */
      if (roleId === 'binder') {
        if (!ward) {
          P.sight.push({ t: 'h', text: 'Who is bought down here' });
          P.sight.push({ t: 'p', text: accepted ? 'Three people are awake between the Gallery and the Tower. Two of them are paid. So, since the Hall, are you.' : 'Three people are awake between the Gallery and the Tower. Two of them are paid.' });
          P.sight.push({ t: 'html', html: '<ul class="blk-list">'
            + '<li>' + thread('oath') + ' <strong>Bess, in the laundry.</strong> Sworn to the Provost, thirty years. Nobody searches that room.</li>'
            + '<li>' + thread('coin') + ' <strong>The porter, in his lodge off the north corridor.</strong> New Crown gold, straight to the Envoy. He is paid to shout.</li>'
            + '<li>' + thread('coin') + ' <strong>Both patrols.</strong> The captain’s men, and nothing more than that.</li>'
            + '</ul>' });
          P.sight.push({ t: 'p', text: '**His gold buys four rooms: B5, C5, D5 and C4.** Wren in one of them and he shouts. The sentry leaves its round and stands at the foot of the Tower stair, that turn and three after it.' });
          P.sight.push({ t: 'fine', text: 'Say it before anybody moves. A room he has not bought is a room nobody is paid to watch.' });
          P.sight.push({ t: 'fine', text: 'You cannot see a seam, a shape, or a beat. Ask for all three.' });
        } else {
          P.sight.push({ t: 'h', text: 'Where a sigil begins' });
          P.sight.push({ t: 'p', text: 'You are the only one on this stair who was ever taught this, and tonight it is three lines.' });
          /* THE PROLOGUE SPENT THE OLD VERSION OF THIS PAGE. Until this pass these three lines were,
             word for word, the Binder's Chapter 0 page -- begin at the scratch, a notch is only a
             signature, run clockwise -- and the dormitory lamp is WORKED ON THE SHARED SCREEN with
             the Binder required to say the rule out loud to solve it. ADVERSARIAL 11: a fact is
             private only on its first use, and a rule the protocol asks a player to say aloud is
             public from that moment. Measured against the shipped wardCheck
             (scratchpad/prologue/binder.js): a Binder-less table applying what the lamp taught them
             faced a field of ONE and won it every time -- p = 1.000, where the chapter's own comment
             recorded four boards and p = 0.250. The seat was free.
             So the ward stops being a Founders' sigil. The accepted board does not move a single
             word -- ASH 4, THORN 1, KNOT 2, slot 3 empty, exactly as before, so every playthrough
             script and full-true.json still hold -- but the two cuts have swapped slots and the mark
             is the notch. A table that confidently applies the Prologue's rule now lays a full,
             lawful-looking, WRONG board, which is the same shape ch0's own lamp, ch4's oath and ch7's
             sigil all use: the guess a table makes without the missing seat has a cut under it. */
          P.sight.push({ t: 'list', items: [
            'The dormitory lamp was Founders\u2019 brass, and a Founders\u2019 sigil begins at the **scratch**. **This is not one.**',
            'A Vigil ward is cut by the keeper sworn to it, and on a Vigil ward the keeper\u2019s mark **binds**. It begins at the **notch**. The scratch is the older cut, and down here the older cut is only wear.',
            'The **first** word goes **in** the notched slot. Every word after it goes into the next slot clockwise, the way the numbers count up.',
            'When the count runs off the end it comes back to slot 1. **Any slot the words do not reach stays empty.**',
          ] });
          P.sight.push({ t: 'fine', text: 'A spare shape is not decoration. It is a different sign, and the iron can tell.' });
          P.sight.push({ t: 'fine', text: 'Say which cut binds **before** anybody places a word. The other three will start at the scratch, because that is what the lamp taught them, and they will be wrong.' });
          P.sight.push({ t: 'fine', text: 'You cannot see the cuts and you cannot read the shapes. Ask for both.' });
        }
        P.wren.push({ t: 'h', text: 'A thread you have not looked at' });
        P.wren.push({ t: 'p', text: 'Bess, the porter, the captain — you read every thread in that gallery at a glance.' });
        P.wren.push({ t: 'p', text: hurt ? 'There is one you have never let yourself follow: the one from the Provost to Wren. Tonight Wren took your arm with the good hand, and there was no thread in it. There was a hand.' : 'There is one you have never let yourself follow: the one from the Provost to Wren.' });
        P.wren.push({ t: 'fine', text: 'You know what colour a mother’s thread is. You decided long ago not to look.' });
      }

      /* ================= SPEAK (gated by LINEN) ================= */
      if (!ctx.mini('LINEN')) {
        P.speak.push({ t: 'fine', text: 'Nothing to speak yet. The Hearth will tell you when.' });
      } else {
        const Q = {
          reader: { prompt: hurt ? 'Wren, the arm re-strapped in a clean sheet, does not look at you while asking. *"The Reader. What does my name mean in the old tongue? Properly. Not the Provost\'s version."*' : 'Wren, over the kettle, so the others cannot hear. *"The Reader. What does my name mean in the old tongue? Properly. Not the Provost\'s version."*',
            opts: [['TELL', 'Tell Wren: **"A small brave bird."** ~~(a bluff — it is not in any alphabet you know)~~'], ['DONTKNOW', '**"I don\'t know yet."** ~~(the truth)~~']],
            after: { TELL: 'Wren grins, delighted, and says it twice under the breath. *A small brave bird.* You made that up. It sounded true, which is not the same thing.', DONTKNOW: 'Wren nods, not disappointed. *"Yet. Good. Tell me when."*' } },
          listener: { prompt: hurt ? 'Wren, on a tub with the bad arm held close, asks it to the arm rather than to you. *"The Listener. You hear everyone\'s heart. Can you hear mine?"*' : 'Wren, pretending to fold a sheet, so it looks like nothing. *"The Listener. You hear everyone\'s heart. Can you hear mine?"*',
            opts: [['LOUD', '**"Yes. Loud."** ~~(a lie)~~'], ['NO', '**"No."** ~~(the truth)~~']],
            after: { LOUD: 'Wren looks pleased, then looks at you a moment too long, then goes back to the sheet. You have never heard it. You said loud.', NO: 'Wren does not flinch. *"Right. Okay. Thank you for not — right."* The kettle covers whatever comes next.' } },
          seer: { prompt: hurt ? 'Wren, hurt and trying not to show it, asks without warning. *"The Seer. You look at me strangely. More, since the stair. What do you see?"*' : 'Wren, close, in the steam. *"The Seer. You look at me strangely sometimes. You\'re doing it now. What do you see?"*',
            opts: [['TELL', 'Tell Wren about **the shadow**: it falls toward the fire. Every fire. ~~(the truth)~~'], ['NOTHING', '**Say nothing.** Look at the wall.']],
            after: { TELL: 'Wren listens to the whole thing and does not laugh. *"Toward. Huh."* Then, later: *"That\'s very poetic, the Seer."* You did not mean it poetically.', NOTHING: 'You look at the wall. Wren looks at you looking at it, and lets you.' } },
          binder: { prompt: hurt ? 'Wren, white around the mouth, keeping the voice light. *"The Binder. Honestly. Am I really the one? Because the one should be able to get down a stair."*' : 'Wren, quietly, with a laundry basket between you as if it were a table. *"The Binder. Honestly. Do you think I\'m really the one?"*',
            opts: [['YES', '**"Yes."**'], ['DONTKNOW', '**"I don\'t know."** ~~(the truth)~~']],
            after: { YES: 'Wren nods like someone receiving an expected verdict. *"Right. Yes. Good to have it from a Binder."* You said yes because it was kind. You are not sure it was kind.', DONTKNOW: 'Wren is quiet a moment. *"Nobody\'s ever said that to me. Everyone always knows."* And then, almost too low to hear: *"Thanks."*' } },
        }[roleId];
        P.speak.push({ t: 'h', text: 'In the laundry, in a whisper' });
        P.speak.push({ t: 'fine', text: '*' + L.houseRule + '*' });
        P.speak.push({ t: 'choice', id: 'whisper', prompt: Q.prompt, options: Q.opts.map(([id, text]) => ({ id, text })), after: (optId) => Q.after[optId] });
        P.speak.push({ t: 'fine', text: 'Nobody at the table will know what you answered. Wren will.' });
      }
      return P;
    },
  });
})();

</script>
<script>/* js/content/companion/ch4.js */
/* Companion — Chapter IV: The Oath (EMBER · cast: LETTER, ORIEL, SORREL, VANE_ACCEPT, SURRENDERED, WREN_SCARED).
   One fact each, and no page holds another's: the Reader has the words on the spines and on the scroll,
   the Listener one step of each tune, the Seer where every cut is and what is under the paint,
   the Binder what a turned board does to a book, which kind of cut a sigil starts at, and what a lock costs. */
(function () {
  'use strict';
  const G = window.VigilGlyphs, L = window.VigilLore, CA = window.CompanionAudio, D = window.CompanionDraw;
  const C = window.CompanionContent;

  /* ---------- the older alphabet (24 letters; no Q, no X).
     KEEP BYTE-IDENTICAL with the copy in js/content/ch4.js — the Hearth draws the journal from that
     table and this primer is the only thing that decodes it. Edit one, edit both. ---------- */
  const OLD_RUNES = {
    A: 'M10,2 L10,26 M10,8 L18,14', B: 'M10,2 L10,26 M10,2 L18,10 L10,18', C: 'M16,4 L4,14 L16,24', D: 'M10,2 L10,26 M2,14 L18,14',
    E: 'M10,2 L10,26 M2,20 L10,14 L18,20', F: 'M10,2 L10,26 M10,6 L18,12 M10,14 L18,20', G: 'M6,2 L14,2 L14,26 L6,26', H: 'M6,2 L6,26 M14,2 L14,26 M6,10 L14,18',
    I: 'M10,2 L10,26', J: 'M10,2 L10,20 L4,26', K: 'M10,2 L10,26 M18,6 L10,14 L18,22', L: 'M10,2 L10,26 M10,26 L18,20',
    M: 'M4,2 L4,26 M16,2 L16,26 M4,2 L16,26', N: 'M4,2 L4,26 M16,2 L16,26 M4,26 L16,2', O: 'M10,4 L18,14 L10,24 L2,14 Z', P: 'M10,2 L10,26 M2,10 L10,2 L18,10',
    R: 'M10,2 L10,26 M2,20 L10,26 L18,20', S: 'M16,4 L6,10 L14,18 L4,24', T: 'M2,6 L18,6 M10,6 L10,26', U: 'M4,2 L10,26 L16,2',
    V: 'M4,4 L16,24 M16,4 L4,24', W: 'M2,4 L10,14 L18,4 M10,14 L10,26', Y: 'M10,2 L10,26 M2,20 L18,8', Z: 'M4,6 L16,6 M4,22 L16,22 M10,6 L10,22',
  };
  const OLD_ALPHA = 'ABCDEFGHIJKLMNOPRSTUVWYZ';
  const runeGlyph = (ch, size, color) => `<svg viewBox="0 0 20 30" width="${size || 40}" height="${(size || 40) * 1.5}" style="color:${color || '#e0b04a'};display:block;margin:0 auto"><path d="${OLD_RUNES[ch]}" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  function runeLine(text, opts) {
    opts = opts || {};
    const cell = 24, h = 34, gap = 12; let x = 8; let s = '';
    for (const ch of String(text).toUpperCase()) {
      if (ch === ' ') { x += gap; continue; }
      if (ch === '.') { s += `<circle cx="${x + 5}" cy="26" r="2" fill="currentColor"/>`; x += 12; continue; }
      const d = OLD_RUNES[ch];
      if (d) s += `<path d="${d}" transform="translate(${x},3)" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
      x += cell;
    }
    return `<svg viewBox="0 0 ${x + 8} ${h + 6}" style="height:${opts.height || 48}px;width:auto;max-width:100%;color:${opts.color || '#e0b04a'};display:block;margin:6px auto">${s}</svg>`;
  }

  /* The Reader's permanent pages: the primer from Chapter IV on, and Mere's sheet, translated, once
     the Reader has actually read it. Both live in the Book, not on the Sight page — a permanent
     reference is never re-printed. The ch4 flags are read off the ch4 unlock itself, so the Book
     keeps them once the table has moved on.
     The sheet waits for Chapter V. It used to appear the instant EMBER was typed, three scenes before
     the study is searched, and it says 'We were four' and 'came up grey' — the first field of the
     Seer's corner and the first field of the Binder's, in English, on the Reader's phone. The gate
     that belongs here is LETTER_READ (js/content/ch4.js sets it at the desk, and its own line
     promises the Book), but no Companion page can see a flag that is not cast, so the nearest honest
     gate is the next chapter's unlock: the study is over by then and the sheet costs the table
     nothing.
     THE ASK FOR 'ONE MORE CAST BIT ON ch4' CANNOT BE GRANTED, and it is written down here so that
     nobody spends an afternoon on it. Two independent reasons, both measured:
       1. A cast is issued at the CHAPTER CODE SCENE. ch4's is ch4_attune, and it runs before
          ch4_shelf and long before the desk — so at the moment the cast is computed LETTER_READ has
          not been written by anything and is false on every path. No ch4 cast bit could ever carry
          it. The flag it could carry is LETTER (the rubbing was taken, in ch2), which is bit 0, and
          which is what this page already reads.
       2. The format is six data bits, hard. js/content/shared.js packs `data &= 63` and
          `v = data | (check << 6)` into three base-32 symbols = 15 bits, so six data bits and nine
          of checksum. ch4 uses bits 0..5 and ch5 uses bits 0..5: both are FULL. A seventh bit is not
          merely unavailable, it is silently dropped — Shared.cast('EMBER', 64) round-trips to 0 with
          a valid checksum. tools/check-content.js now fails on any cast spec that reaches past bit 5,
          so that trap cannot be walked into.
     If this page must one day read LETTER_READ exactly, the bit belongs to ch5's cast, not ch4's,
     and something in ch5's six would have to give it up. */
  const mereText = '"We were four. I offered to go alone and was refused. One was never asked. We wrote the cold glyph with four hands, and came up grey. — Mere, who kept the fire, after."';
  C.bookExtras.push((roleId, ctx) => {
    if (roleId !== 'reader' || ctx.maxChapter < 4) return [];
    const u = (ctx.state && ctx.state.unlocked && ctx.state.unlocked.ch4) || {};
    const out = [
      { t: 'h', text: 'The primer (from the Provost\'s study)' },
      { t: 'p', text: 'Twenty-four letters, each with its modern letter written beside it in the Provost\'s hand. No **Q** and no **X**. A plain substitution: slow, and yours.' },
      { t: 'key', items: OLD_ALPHA.split('').map(ch => ({ svg: runeGlyph(ch, 34), label: ch })) },
    ];
    if (u.flags && u.flags.LETTER && ctx.maxChapter >= 5) {
      out.push({ t: 'h', text: 'Mere\'s sheet, from the niche below' });
      out.push({ t: 'letter', text: mereText });
    }
    return out;
  });

  /* ---------- the Reader's figure ----------
     The oath's three worn words, drawn as a ring so the page cannot imply an order, and set at odd
     angles with no mark and no numbers. Read round from the top they come out ASH, THORN, WELL —
     neither the answer nor its reverse, so reading the picture fails and the Listener is needed. */
  const oathRing = () => {
    const at = (deg, r) => [150 + Math.cos(deg * Math.PI / 180) * r, 84 + Math.sin(deg * Math.PI / 180) * r];
    const put = (name, deg) => { const [x, y] = at(deg, 58); return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) scale(1.05)" style="color:#f2d27a">${G.inner(name)}</g>`; };
    const [ex, ey] = at(265, 58);
    return `<svg viewBox="0 0 300 168" style="width:100%;max-width:300px;height:auto">
      <circle cx="150" cy="84" r="58" fill="none" stroke="rgba(212,169,78,.3)" stroke-width="10"/>
      ${put('ASH', -60)}${put('THORN', 55)}${put('WELL', 175)}
      <circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="17" fill="#0b0a10" stroke="rgba(212,169,78,.45)" stroke-dasharray="4 4"/>
      <text x="150" y="162" text-anchor="middle" fill="rgba(233,226,210,.55)" font-size="11" font-family="Cinzel,serif">three worn words and one empty place · no first, no last</text>
    </svg>`;
  };

  /* ---------- the Seer's figure ----------
     One plate, three things: the shelf board and where it is marked, the paint and what is under it,
     the scroll's ring and where it is cut. No arrow, no direction, no rule — the Seer reports cuts. */
  const underMarks = (() => {
    let s = `<svg viewBox="0 0 360 336"><rect width="360" height="336" fill="#000"/>`;
    // A — the shelf board, six blank spines, one mark
    s += `<rect x="14" y="22" width="300" height="46" fill="none" stroke="#fff" stroke-width="1.2"/>`;
    for (let i = 0; i < 6; i++) s += `<rect x="${24 + i * 48}" y="28" width="36" height="34" fill="none" stroke="#fff" stroke-width="1"/><text x="${42 + i * 48}" y="82" text-anchor="middle" fill="#fff" font-size="10" font-family="Cinzel,serif">${i + 1}</text>`;
    s += `<path d="M332,37 L320,45 L332,53 Z" fill="#a482e6"/>`;
    s += `<text x="180" y="16" text-anchor="middle" fill="#a482e6" font-size="10" font-family="Cinzel,serif">the board is marked at the right-hand end</text>`;
    // B — under the paint: four walking in, no child
    s += `<rect x="14" y="102" width="332" height="96" fill="none" stroke="#fff" stroke-width="1.2"/>`;
    s += `<g stroke="#fff" fill="none" stroke-width="1.4">${[0, 1, 2].map(i => `<path d="M${292 + i * 12},190 C${286 + i * 12},166 ${294 + i * 12},152 ${300 + i * 12},134 C${306 + i * 12},152 ${314 + i * 12},166 ${304 + i * 12},190"/>`).join('')}</g>`;
    /* Two figures do something the others do not: the fourth carries, the second reaches back the way
       they came. Both are the Seer's corner of the study, and they are on no other surface — the
       count is not, and never was: the Hearth said 'four, as one, went through' in Chapter II. */
    for (let i = 0; i < 4; i++) {
      const x = 62 + i * 44, back = i === 1;
      s += `<g transform="translate(${x},190)"><path d="M-7,0 L-5,-34 L5,-34 L7,0 Z" fill="#fff"/><circle cx="${back ? -2 : 0}" cy="-40" r="5" fill="#fff"/><path d="${back ? 'M-5,-30 L-16,-22' : 'M5,-30 L16,-22'}" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M-3,0 L-24,5 L4,0 Z" fill="#fff" opacity=".4"/>`
        + (i === 3 ? `<g transform="translate(24,-26) scale(0.62)" style="color:#a482e6">${G.shapeInner('Flame', true)}</g>` : '') + `</g>`;
    }
    s += `<text x="180" y="214" text-anchor="middle" fill="#a482e6" font-size="10" font-family="Cinzel,serif">four walk in, no child — the fourth carries, the second reaches back</text>`;
    // C — the scroll's ring, and the two cuts in it
    s += `<g transform="translate(110,278)" stroke="#fff" fill="none" stroke-width="1.4"><circle r="40"/>`;
    s += [0, 1, 2, 3].map(i => { const a = (i / 4 * 360 - 90) * Math.PI / 180, x = (Math.cos(a) * 40).toFixed(1), y = (Math.sin(a) * 40).toFixed(1); return `<circle cx="${x}" cy="${y}" r="11"/><text x="${x}" y="${(+y + 4).toFixed(1)}" text-anchor="middle" fill="#fff" font-size="10" font-family="Cinzel,serif" stroke="none">${i + 1}</text>`; }).join('');
    s += `</g>`;
    /* Two cuts, drawn the same white and lettered the same size: slot 2 (right of the ring) carries a
       long scratch, slot 4 (left of it) a small notch. Not ch3's pair, on purpose -- see ch4.js. Which kind of cut a sigil starts at is the
       Binder's Law, so neither cut takes the violet — an accent here would say which one matters, and
       that is the whole of the Binder's seat at this puzzle. Same shape as the Prologue's lamp foot. */
    s += `<path d="M174,258 L174,298" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`;
    s += `<path d="M46,274 L46,282" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`;
    s += `<text x="262" y="264" text-anchor="middle" fill="#fff" font-size="10" font-family="Cinzel,serif">beside slot 2 — a long scratch</text>`;
    s += `<text x="262" y="290" text-anchor="middle" fill="#fff" font-size="10" font-family="Cinzel,serif">beside slot 4 — a small notch</text>`;
    s += `<text x="180" y="330" text-anchor="middle" fill="#fff" opacity=".7" font-size="9" font-family="Cinzel,serif">three cuts in this room, and nothing else</text>`;
    return s + `</svg>`;
  })();

  // Seer, Wren tab: shadows in the study — the fire at the right; four away, the Provost's away, Wren's toward.
  const underShadows = `<svg viewBox="0 0 360 200">
    <rect width="360" height="200" fill="#000"/>
    <g stroke="#fff" fill="none" stroke-width="1.2"><rect x="10" y="10" width="340" height="180"/><rect x="20" y="120" width="90" height="16"/><rect x="120" y="24" width="120" height="60"/><path d="M300,140 L300,110 M292,116 L308,116"/></g>
    <g fill="#fff" opacity=".9"><circle cx="70" cy="90" r="6"/><circle cx="110" cy="150" r="6"/><circle cx="160" cy="120" r="6"/><circle cx="200" cy="160" r="6"/><circle cx="260" cy="90" r="6"/><circle cx="240" cy="150" r="6"/></g>
    <g stroke="#fff" stroke-width="3" opacity=".55" stroke-linecap="round"><path d="M70,90 L36,84"/><path d="M110,150 L76,152"/><path d="M160,120 L126,116"/><path d="M200,160 L166,164"/><path d="M260,90 L228,82"/></g>
    <g stroke="#a482e6" stroke-width="3" opacity=".9" stroke-linecap="round"><path d="M240,150 L278,146"/></g>
    <g fill="#fff" font-size="9" font-family="Cinzel,serif"><text x="60" y="108">Reader</text><text x="100" y="168">Listener</text><text x="150" y="138">Seer</text><text x="190" y="178">Binder</text><text x="248" y="80">the Provost</text><text x="230" y="168" fill="#a482e6">Wren</text><text x="300" y="158" text-anchor="middle">the fire</text></g>
    <text x="180" y="194" text-anchor="middle" fill="#fff" font-size="9" font-family="Cinzel,serif" opacity=".7">shadows, as they fall</text>
  </svg>`;

  /* ---------- the Binder's figure ----------
     What a board hung the other way up does, drawn: every tile turns over, and the place numbers do
     not. That last clause is the Binder's alone — the Reader's Book gives the turning and not the
     places — so it is the one thing the shelf cannot be solved without.
     Both rows are drawn the same white, and the one accent is on the place numbers, which are the
     thing that does not move. Painting the turned row in the Binder's colour said "this is tonight's
     board", which is the Seer's fact and not on this page. The rule has two arms and the drawing
     shows both. */
  const turnedBoard = () => {
    const row = (y, flipped, numColor) => {
      let s = '';
      for (let i = 0; i < 6; i++) {
        const x = 22 + i * 42;
        s += `<rect x="${x}" y="${y}" width="34" height="30" rx="3" fill="none" stroke="rgba(255,255,255,.35)"/>`;
        s += `<g transform="translate(${x + 17},${y + 15}) rotate(${flipped ? 180 : 0})"><path d="M-7,4 L0,-5 L7,4" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2" stroke-linecap="round"/></g>`;
        s += `<text x="${x + 17}" y="${y + 46}" text-anchor="middle" fill="${numColor}" font-size="11" font-family="Cinzel,serif">${i + 1}</text>`;
      }
      return s;
    };
    return `<svg viewBox="0 0 300 176" style="width:100%;max-width:300px;height:auto">
      ${row(14, false, '#d96b4a')}
