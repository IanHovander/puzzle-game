<script>/* js/content/companion/book.js */
/* Companion persistent pages (the BOOK tab) and shared phone audio helpers. */
(function () {
  'use strict';
  const G = window.VigilGlyphs, L = window.VigilLore, UI = window.VigilUI;
  window.CompanionContent = window.CompanionContent || { chapters: [], bookExtras: [] };
  const C = window.CompanionContent;
  C.bookExtras = C.bookExtras || [];

  /* ---------- audio helpers ---------- */
  const CA = {};
  /* A step is a number (up/down the ladder), 'rest' (a pause) or 'start' (the first note after an opening rest).
     Anything else — or a number that is not finite — is drawn as a start and played as nothing, never as NaN. */
  CA.stepKind = function (s) {
    if (s === 'rest') return { kind: 'rest' };
    const v = typeof s === 'number' ? s : (typeof s === 'string' && /^[-+]?\d+$/.test(s.trim()) ? parseInt(s, 10) : NaN);
    return Number.isFinite(v) ? { kind: 'step', v } : { kind: 'start' };
  };
  CA.stepLabel = (s) => { const k = CA.stepKind(s); return k.kind === 'rest' ? 'rest' : k.kind === 'start' ? 'begins' : (k.v > 0 ? '+' + k.v : String(k.v)); };
  CA.strip = function (steps) {
    return `<div class="arrow-strip">${steps.map(s => { const k = CA.stepKind(s); if (k.kind === 'rest') return '<span class="step rest"><b>—</b>rest</span>'; if (k.kind === 'start') return '<span class="step start"><b>◆</b>begins</span>'; return `<span class="step${k.v === 0 ? ' same' : ''}"><b>${k.v > 0 ? '▲' : k.v < 0 ? '▼' : '='}</b>${k.v > 0 ? 'up ' + k.v : k.v < 0 ? 'down ' + (-k.v) : 'same'}</span>`; }).join('')}</div>`;
  };
  /* Tell whichever strip is listening that step i (0-based, in the array the strip was drawn from) is sounding now. */
  CA.announce = function (i, extra) { try { document.dispatchEvent(new CustomEvent('vigil:step', { detail: Object.assign({ step: i }, extra || {}) })); } catch (e) {} };
  /* Every note the helpers schedule goes through CA.later, so a new press (UI.stopAudio → 'vigil:stop') can drop
     the rest of the phrase that was playing. Content that chains its own timeouts should use CA.later too. */
  let pending = [];
  CA.later = function (fn, ms) { const id = setTimeout(() => { pending = pending.filter(x => x !== id); fn(); }, ms); pending.push(id); return id; };
  CA.stop = function () { pending.forEach(clearTimeout); pending = []; };
  try { document.addEventListener('vigil:stop', CA.stop); } catch (e) {}
  /* Play a contour of steps relative to a starting pitch (room-tuned: absolute pitch varies per call).
     Returns the length of the phrase in ms. opts.offset shifts the announced step index (for a second voice). */
  CA.playSteps = function (Audio, steps, base, opts) {
    Audio.init(); if (Audio.isMuted()) Audio.setMuted(false);
    const off = (opts && opts.offset) || 0;
    let midi = base || (60 + Math.floor(Math.random() * 7));
    const ladder = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19, 21, 23];
    let idx = 4; // start mid-ladder
    const at = (k) => { const oct = Math.floor(k / 7), d = ((k % 7) + 7) % 7; return midi + oct * 12 + ladder[d]; };
    Audio.note(at(idx), 1.0, 0.18);
    let t = 650;
    steps.forEach((s, i) => {
      const k = CA.stepKind(s);
      if (k.kind === 'rest') { const tt = t; CA.later(() => CA.announce(off + i, { rest: true }), tt); t += 700; return; }
      if (k.kind === 'step') idx += k.v; // 'start' keeps the pitch and just sounds
      const m = at(idx), tt = t; CA.later(() => { Audio.note(m, 1.0, 0.18); CA.announce(off + i); }, tt); t += 650;
    });
    return t + 500;
  };
  /* Play glyphs by their own pitch (the Book's row-player); COLD is a silent beat. Returns the length in ms. */
  CA.playGlyphs = function (Audio, names) { Audio.init(); if (Audio.isMuted()) Audio.setMuted(false); let t = 0; names.forEach((n, i) => { const m = G.MIDI[n]; const tt = t; CA.later(() => { if (m) Audio.note(m, 1.0, 0.18); if (i > 0) CA.announce(i - 1, m ? {} : { rest: true }); }, tt); t += 650; }); return t + 500; };
  CA.heartbeat = function (Audio, bpm, beats) { Audio.init(); if (Audio.isMuted()) Audio.setMuted(false); if (!bpm) return 0; const iv = 60000 / bpm, n = beats || 8; for (let i = 0; i < n; i++) CA.later(() => Audio.sfx('heart'), i * iv); return n * iv + 300; };
  CA.pulses = function (Audio, n, gapMs) { Audio.init(); if (Audio.isMuted()) Audio.setMuted(false); n = n | 0; const gap = gapMs || 420; for (let i = 0; i < n; i++) CA.later(() => Audio.sfx('chime'), i * gap); return n * gap + 400; };
  window.CompanionAudio = CA;

  /* ---------- shared drawing helpers ---------- */
  const D = {};
  D.trace = (kind) => { // heartbeat trace svg
    if (kind === 'flat') return `<svg viewBox="0 0 120 22" class="trace"><path d="M0,11 L120,11" stroke="#4fb3bf" stroke-width="1.5" fill="none" opacity=".6"/></svg>`;
    const fast = kind === 'fast'; let d = 'M0,11 '; const n = fast ? 5 : 3; for (let i = 0; i < n; i++) { const x = 8 + i * (110 / n); d += `L${x},11 L${x + 4},3 L${x + 8},19 L${x + 12},11 `; } d += 'L120,11';
    return `<svg viewBox="0 0 120 22" class="trace"><path d="${d}" stroke="#4fb3bf" stroke-width="1.5" fill="none"/></svg>`;
  };
  D.glyphCard = (name, size) => `<div class="lx"><div>${G.svg(name, { size: size || 40, color: '#f2d27a' })}</div><div><b>${name}</b><span>${G.GLYPHS[name].gloss}</span></div></div>`;
  window.CompanionDraw = D;

  /* ---------- BOOK tab ---------- */
  C.book = function (roleId, ctx) {
    const blocks = [];
    const n = ctx.maxChapter;
    if (roleId === 'reader') {
      blocks.push({ t: 'h', text: 'The Lexicon — four shapes, read two ways' });
      blocks.push({ t: 'fine', text: 'Upright, a shape reads as the first word; **turned** (rotated), as the second. A carved line with its mark on the **left** is read upright, left to right. With the mark on the **right** it is *turned*: read right to left, and every glyph inverts.' });
      blocks.push({ t: 'html', html: `<div class="lexicon">${['ASH', 'THORN', 'KNOT', 'CROWN'].map(u => D.glyphCard(u) + D.glyphCard(G.PAIR[u])).join('')}</div>` });
      blocks.push({ t: 'fine', text: 'Shapes: **Flame** = ASH / COLD · **Spike** = THORN / WELL · **Hook** = KNOT / VEIL · **Crown** = CROWN / EMBER.' });
      blocks.push({ t: 'h', text: 'Glossary' });
      const gl = [['WREN', n >= 4 ? 'the Vigil roll spells it WRENN in the older alphabet: *the hollow of a bell; the space that rings*' : 'the child\'s name. Written on the dormitory door in the older alphabet, which you have not learned.']];
      if (n >= 2) gl.push(['THE FOUNDERS\' GLYPHS', 'Halvard — THORN · Idony — KNOT · Rook — VEIL · Mere — EMBER (from the plinths in the Vault)']);
      blocks.push({ t: 'list', items: gl.map(([k, v]) => `**${k}** — ${v}`) });
      blocks.push({ t: 'h', text: 'The Older Alphabet' });
      blocks.push(n >= 4 ? { t: 'p', text: 'Learned from the Provost\'s primer (Chapter IV). A simple substitution: each old letter is the modern letter shown beside it on the primer page.' } : { t: 'fine', text: '*Locked — "You have not learned it yet."*' });
    }
    if (roleId === 'listener') {
      blocks.push({ t: 'h', text: 'The Ladder' });
      blocks.push({ t: 'fine', text: 'The Founders\' Tongue is a ladder of seven steps and a rest. You never hear a glyph\'s *name* — every room is tuned differently — only how far the tune **steps** from one glyph to the next. COLD is the rest.' });
      blocks.push({ t: 'html', html: `<div class="lexicon">${G.LADDER.map((nm, i) => `<div class="lx"><div>${G.svg(nm, { size: 36, color: '#4fb3bf' })}</div><div><b>${nm}</b><span>step ${i}</span></div></div>`).join('')}<div class="lx"><div>${G.svg('COLD', { size: 36, color: '#4fb3bf' })}</div><div><b>COLD</b><span>a rest — no step</span></div></div></div>` });
      blocks.push({ t: 'fine', text: 'So THORN (1) to KNOT (2) is *up one*; KNOT (2) to VEIL (5) is *up three*; VEIL (5) to EMBER (3) is *down two*. A rest is a pause, not a new start: the step after it is counted from the last glyph that sounded.' });
      blocks.push({ t: 'h', text: 'Row-player' });
      blocks.push({ t: 'custom', render: (el, cx) => {
        el.appendChild(UI.el('p', { class: 'fine', text: 'Tap glyphs in an order to hear how that row would step. Compare it with the room\'s phrase by ear or by the arrows.' }));
        const row = []; const seqEl = UI.el('div', { class: 'seq-list' }); const grid = UI.el('div', { class: 'pick-grid' });
        const render = () => { UI.clear(seqEl); if (!row.length) seqEl.appendChild(UI.el('span', { class: 'seq-empty', text: 'No glyphs yet.' })); row.forEach(nm => seqEl.appendChild(UI.el('span', { class: 'seq-chip', text: nm }))); };
        G.ORDER.forEach(nm => grid.appendChild(UI.el('div', { class: 'pk', html: G.svg(nm, { size: 40, color: '#4fb3bf' }) + '<div>' + nm + '</div>', onclick: () => { row.push(nm); render(); } })));
        el.appendChild(grid); el.appendChild(seqEl);
        const strip = UI.el('div', { class: 'strip' });
        const showSteps = () => { if (row.length < 2) { strip.innerHTML = '<p class="fine">Tap at least two glyphs to see a step.</p>'; return; } strip.innerHTML = CA.strip(G.steps(row)) + '<p class="fine">' + UI.esc(G.stepsText(row)) + '.</p>'; };
        el.appendChild(UI.el('div', { class: 'row' }, [
          UI.audioButton('Play row', () => { showSteps(); if (!row.length) return 0; const len = CA.playGlyphs(window.VigilAudio, row); UI.lightStrip(strip, len); return len; }, { cls: 'small' }),
          UI.el('button', { class: 'btn small ghost', text: 'Show steps', onclick: showSteps }),
          UI.el('button', { class: 'btn small ghost', text: 'Clear', onclick: () => { row.length = 0; render(); strip.innerHTML = ''; } }),
        ]));
        el.appendChild(strip); render();
      } });
      blocks.push({ t: 'h', text: 'Heartbeats' });
      blocks.push({ t: 'fine', text: 'Every heart in a room, when you listen for it. The pages of each chapter list who is present.' });
    }
    if (roleId === 'seer') {
      blocks.push({ t: 'h', text: 'The Ring Page' });
      blocks.push({ t: 'fine', text: 'Every ring of slots has a **mark** — a scratch where the sigil begins. Slots are numbered **sunwise**, which is clockwise, from the top. An inscription\'s mark sits at one end: on the **left**, the line is upright; on the **right**, the line was carved *turned* — the Reader must read it right to left with every glyph inverted, and the Binder\'s Laws say where a turned line is placed.' });
      blocks.push({ t: 'svg', cls: 'underlayer', svg: `<svg viewBox="0 0 320 200"><circle cx="100" cy="100" r="70" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M100,22 a78,78 0 0 1 55,23" fill="none" stroke="#fff" stroke-width="2"/><path d="M155,45 l-9,-2 l3,9 z" fill="#fff"/><text x="100" y="18" text-anchor="middle" fill="#fff" font-size="11" font-family="Cinzel,serif">sunwise = clockwise</text>${[0, 1, 2, 3].map(i => { const a = (i / 4 * 360 - 90) * Math.PI / 180; return `<circle cx="${100 + Math.cos(a) * 70}" cy="${100 + Math.sin(a) * 70}" r="12" fill="none" stroke="#fff"/><text x="${100 + Math.cos(a) * 70}" y="${104 + Math.sin(a) * 70}" text-anchor="middle" fill="#fff" font-size="11">${i + 1}</text>`; }).join('')}<path d="M100,178 l-6,10 l12,0 z" fill="#a482e6"/><text x="100" y="196" text-anchor="middle" fill="#a482e6" font-size="10" font-family="Cinzel,serif">the mark</text><g transform="translate(200,60)"><rect x="0" y="0" width="110" height="34" rx="4" fill="none" stroke="#fff"/><path d="M-4,17 l-8,-6 l0,12 z" fill="#a482e6"/><text x="55" y="22" text-anchor="middle" fill="#fff" font-size="10" font-family="Cinzel,serif">mark left · upright</text></g><g transform="translate(200,120)"><rect x="0" y="0" width="110" height="34" rx="4" fill="none" stroke="#fff"/><path d="M114,17 l8,-6 l0,12 z" fill="#a482e6"/><text x="55" y="22" text-anchor="middle" fill="#fff" font-size="10" font-family="Cinzel,serif">mark right · turned</text></g></svg>` });
      blocks.push({ t: 'h', text: 'Shadows' });
      blocks.push({ t: 'fine', text: 'Under-Sight shows what is beneath a room: doors under plaster, sockets under rebuilt stone, and shadows as they truly fall. Look at every shadow. Say what you see.' });
    }
    if (roleId === 'binder') {
      blocks.push({ t: 'h', text: 'The Book of Laws' });
      blocks.push({ t: 'fine', text: 'Every Law is dated: **Founders\'** (Year 0) or **Order\'s** (Year 212 or 340). Law 3: where two Laws disagree, the older binds.' });
      const laws = L.lawsUpTo(L.chapters[Math.max(0, Math.min(8, n))].id);
      const struckRestored = !!(ctx.flags && ctx.flags.LAW0) || (ctx.state.unlocked && Object.values(ctx.state.unlocked).some(u => u.flags && u.flags.LAW0));
      const render = (list) => `<div class="laws">${list.map(l => `<div class="law ${l.era === 'O' ? 'order' : 'founders'}${l.struck && !struckRestored ? ' struck' : ''}"><div class="era">Law ${l.n} · ${l.era === 'F' ? 'Founders\' · Year 0' : 'Order\'s · Year ' + l.year}${l.struck ? (struckRestored ? ' · RESTORED' : ' · STRUCK') : ''}</div><div class="txt">${UI.esc(l.text)}</div>${l.struck ? `<div class="fine">${struckRestored ? 'Older than Law 6. The older binds.' : UI.esc(l.note)}</div>` : ''}</div>`).join('')}</div>`;
      blocks.push({ t: 'h', text: 'In the order learned' });
      blocks.push({ t: 'html', html: render(laws) });
      blocks.push({ t: 'h', text: 'By year' });
      blocks.push({ t: 'html', html: render(laws.slice().sort((a, b) => a.year - b.year || a.n - b.n)) });
      blocks.push({ t: 'h', text: 'Threads' });
      blocks.push({ t: 'fine', text: 'Grey — grief, or a goodbye already said. Gold — the Crown\'s coin or favour. Red — an oath. No thread — unbound; or, once, "not unbound: the knot itself."' });
    }
    (C.bookExtras || []).forEach(fn => { try { const b = fn(roleId, ctx); if (b && b.length) blocks.push(...b); } catch (e) { console.error(e); } });
    return blocks;
  };
})();

</script>
<script>/* js/content/companion/ch0.js */
/* Companion — Prologue (KINDLE) */
(function () {
  'use strict';
  const G = window.VigilGlyphs, L = window.VigilLore, CA = window.CompanionAudio, D = window.CompanionDraw;
  const C = window.CompanionContent;

  /* Two frames of the same carving: upright, then turned, with the mark moving. One picture for "read two ways". */
  const flipStrip = () => {
    const frame = (x, label, mark) => `<g transform="translate(${x},6)">
      <rect x="0" y="0" width="150" height="86" rx="8" fill="rgba(0,0,0,.3)" stroke="rgba(255,255,255,.15)"/>
      <g transform="translate(${mark === 'left' ? 46 : 40},44) scale(0.85)" style="color:#f2d27a">${G.shapeInner('Flame', false)}</g>
      <g transform="translate(${mark === 'left' ? 104 : 110},44) scale(0.85)" style="color:#f2d27a">${G.shapeInner('Crown', true)}</g>
      <circle cx="${mark === 'left' ? 16 : 134}" cy="44" r="6" fill="#a482e6"/>
      <path d="M${mark === 'left' ? '30,44 L22,40 L22,48' : '120,44 L128,40 L128,48'} Z" fill="#a482e6"/>
      <text x="75" y="80" text-anchor="middle" fill="#a482e6" font-size="10" font-family="Cinzel,serif">${label}</text>
    </g>`;
    return `<svg viewBox="0 0 320 100">${frame(4, 'mark left · upright', 'left')}${frame(166, 'mark right · turned', 'right')}</svg>`;
  };
  /* The Listener's interval, drawn: two rungs of the ladder and the climb between them. */
  const ladder3 = () => `<svg viewBox="0 0 200 96" style="width:170px;height:82px">
    ${[0, 1, 2, 3, 4].map(i => `<line x1="30" y1="${84 - i * 16}" x2="86" y2="${84 - i * 16}" stroke="rgba(255,255,255,.25)" stroke-width="2"/>`).join('')}
    <circle cx="58" cy="84" r="7" fill="#4fb3bf"/><circle cx="58" cy="36" r="7" fill="#4fb3bf"/>
    <path d="M110,84 L110,36" stroke="#4fb3bf" stroke-width="2"/><path d="M110,30 l-5,10 l10,0 Z" fill="#4fb3bf"/>
    <text x="132" y="46" fill="#4fb3bf" font-size="18" font-family="Cinzel,serif">+3</text>
    <text x="58" y="16" text-anchor="middle" fill="rgba(255,255,255,.55)" font-size="9" font-family="Cinzel,serif">second note</text>
  </svg>`;
  /* The Binder's Law, drawn: a ring, a scratch, and the count running clockwise from it. */
  const lawRing = () => `<svg viewBox="0 0 150 150" style="width:130px;height:130px">
    <circle cx="75" cy="75" r="46" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
    ${[0, 1, 2, 3].map(i => { const a = (i / 4 * 360 - 135) * Math.PI / 180, x = 75 + Math.cos(a) * 46, y = 75 + Math.sin(a) * 46;
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="11" fill="${i === 0 ? 'rgba(164,130,230,.25)' : 'none'}" stroke="${i === 0 ? '#a482e6' : 'rgba(255,255,255,.4)'}" stroke-width="1.5"/><text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="middle" fill="#fff" font-size="11" font-family="Cinzel,serif">${i + 1}</text>`; }).join('')}
    <path d="M96,18 a60,60 0 0 1 34,40" fill="none" stroke="#a482e6" stroke-width="2"/><path d="M130,58 l-8,-3 l1,9 Z" fill="#a482e6"/>
    <text x="40" y="24" text-anchor="middle" fill="#a482e6" font-size="9" font-family="Cinzel,serif">the mark</text>
    <text x="75" y="142" text-anchor="middle" fill="rgba(255,255,255,.6)" font-size="9" font-family="Cinzel,serif">sunwise = clockwise</text>
  </svg>`;
  /* A thread, drawn three ways: whole, broken, absent. */
  const threadLine = (kind) => `<svg viewBox="0 0 90 16" style="width:74px;height:14px;vertical-align:middle">${
    kind === 'whole' ? '<path d="M4,8 C24,2 34,14 52,8 S74,4 86,8" fill="none" stroke="#d96b4a" stroke-width="2.5" stroke-linecap="round"/>'
    : kind === 'broken' ? '<path d="M4,8 C16,3 24,12 36,9" fill="none" stroke="#d96b4a" stroke-width="2.5" stroke-linecap="round"/><path d="M56,9 C68,6 76,11 86,8" fill="none" stroke="#d96b4a" stroke-width="2.5" stroke-linecap="round"/>'
    : '<path d="M6,2 L2,2 L2,14 L6,14 M84,2 L88,2 L88,14 L84,14" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>'
  }</svg>`;

  const carving = (showMark) => G.inscription([{ shape: 'Flame', inv: false }, { shape: 'Crown', inv: true }], { showMark, mark: 'left', color: '#fff', markColor: '#a482e6' });

  // Seer under-layer of the dormitory: four shadows away from the lamp, Wren's toward it.
  const underDorm = `<svg viewBox="0 0 360 220">
    <rect width="360" height="220" fill="#000"/>
    <g stroke="#fff" fill="none" stroke-width="1.2">
      <rect x="10" y="10" width="340" height="200"/>
      <rect x="20" y="30" width="60" height="30"/><rect x="20" y="90" width="60" height="30"/><rect x="20" y="150" width="60" height="30"/><rect x="280" y="30" width="60" height="30"/>
      <circle cx="300" cy="150" r="14"/><path d="M300,136 L300,120 M292,124 L308,124"/>
      <text x="300" y="185" text-anchor="middle" fill="#fff" font-size="10" font-family="Cinzel,serif">the lamp</text>
    </g>
    <g fill="#fff" opacity=".9">
      <circle cx="120" cy="100" r="6"/><circle cx="160" cy="70" r="6"/><circle cx="170" cy="140" r="6"/><circle cx="210" cy="110" r="6"/><circle cx="240" cy="150" r="6"/>
    </g>
    <g stroke="#fff" stroke-width="3" opacity=".55" stroke-linecap="round">
      <path d="M120,100 L80,88"/><path d="M160,70 L124,52"/><path d="M170,140 L134,138"/><path d="M210,110 L178,96"/>
    </g>
    <g stroke="#a482e6" stroke-width="3" opacity=".9" stroke-linecap="round"><path d="M240,150 L276,150"/></g>
    <g fill="#fff" font-size="9" font-family="Cinzel,serif"><text x="112" y="118">Reader</text><text x="150" y="60">Listener</text><text x="158" y="158">Seer</text><text x="202" y="128">Binder</text><text x="230" y="168" fill="#a482e6">Wren</text></g>
    <text x="180" y="210" text-anchor="middle" fill="#fff" font-size="9" font-family="Cinzel,serif" opacity=".7">shadows, as they fall</text>
  </svg>`;

  const underLamp = `<svg viewBox="0 0 360 200">
    <rect width="360" height="200" fill="#000"/>
    <g transform="translate(0,10)">${carving(true).replace('<svg', '<svg x="60" y="0" width="240" height="70"')}</g>
    <g stroke="#fff" fill="none" stroke-width="1.5" transform="translate(180,140)">
      <circle r="42"/>
      ${[0, 1, 2, 3].map(i => { const a = (i / 4 * 360 - 90) * Math.PI / 180; return `<circle cx="${(Math.cos(a) * 42).toFixed(1)}" cy="${(Math.sin(a) * 42).toFixed(1)}" r="9"/><text x="${(Math.cos(a) * 60).toFixed(1)}" y="${(Math.sin(a) * 60 + 4).toFixed(1)}" text-anchor="middle" fill="#fff" font-size="10" font-family="Cinzel,serif" stroke="none">${i + 1}</text>`; }).join('')}
      <path d="M-6,52 L0,42 L6,52 Z" fill="#a482e6" stroke="none"/>
      <path d="M-14,-56 a58,58 0 0 1 28,0" stroke-width="1.5"/><path d="M14,-56 l-6,-4 l0,8 z" fill="#fff" stroke="none"/>
    </g>
    <text x="180" y="196" text-anchor="middle" fill="#a482e6" font-size="10" font-family="Cinzel,serif">the scratch — where the ring begins</text>
    <text x="180" y="95" text-anchor="middle" fill="#a482e6" font-size="10" font-family="Cinzel,serif">the carving's mark: on the left</text>
  </svg>`;

  C.chapters.push({
    id: 'ch0',
    pages: (roleId, ctx) => {
      const P = { sight: [], wren: [], speak: [] };
      P.speak.push({ t: 'fine', text: 'Nothing to speak yet. The Hearth will tell you when.' });
      if (roleId === 'reader') {
        P.sight.push({ t: 'h', text: 'The carving above the lamp' });
        P.sight.push({ t: 'p', text: 'Two shapes. Clean on your page, worn on the Hearth.' });
        P.sight.push({ t: 'html', html: carving(false) });
        P.sight.push({ t: 'p', text: 'A line reads one of two ways. The shapes will not tell you which.' });
        P.sight.push({ t: 'html', html: flipStrip() });
        P.sight.push({ t: 'table', head: ['If the line is…', 'it reads'], rows: [['upright (mark on the left)', `${G.svg('ASH', { size: 40, color: '#f2d27a' })} ASH, ${G.svg('EMBER', { size: 40, color: '#f2d27a' })} EMBER — <em>fire, keep</em>`], ['turned (mark on the right)', `${G.svg('CROWN', { size: 40, color: '#f2d27a' })} CROWN, ${G.svg('COLD', { size: 40, color: '#f2d27a' })} COLD — <em>one, cold</em>`]] });
        P.sight.push({ t: 'p', text: 'Read both rows aloud. Someone else knows which one is true.' });
        P.sight.push({ t: 'fine', text: 'The full lexicon is in your **Book**.' });
        P.wren.push({ t: 'h', text: 'The name on the door' });
        P.wren.push({ t: 'p', text: 'Every fourth-year\'s name is chalked on the dormitory door. Wren\'s is chalked twice. The second time in an older alphabet. You cannot read it. You have walked past it for a year.' });
      }
      if (roleId === 'listener') {
        P.sight.push({ t: 'h', text: 'The lamp\'s two notes' });
        P.sight.push({ t: 'html', html: ladder3() });
        P.sight.push({ t: 'audio', label: 'The lamp, two notes', strip: CA.strip([3]), play: (A) => CA.playSteps(A, [3]), text: 'The second note steps **up three** from the first. Of the Reader\'s two glyphs, only one order climbs three.' });
        P.sight.push({ t: 'fine', text: 'Your Ladder is in the **Book**.' });
        P.sight.push({ t: 'h', text: 'Heartbeats in the room' });
        P.sight.push({ t: 'html', html: `<div class="heartbeats">${['Reader', 'Listener', 'Seer', 'Binder'].map(n => `<div class="hb"><span>${n}</span>${D.trace('normal')}</div>`).join('')}<div class="hb"><span>Wren</span>${D.trace('flat')}</div></div>` });
        P.sight.push({ t: 'fine', text: 'Wren\'s is too quiet to catch. It always has been.' });
        P.wren.push({ t: 'h', text: 'How quiet' });
        P.wren.push({ t: 'p', text: 'You can hear the Provost\'s heart two floors down. You have never once heard Wren\'s. You decided the fault was yours. You have never said it aloud.' });
      }
      if (roleId === 'seer') {
        P.sight.push({ t: 'h', text: 'Under the lamp' });
        P.sight.push({ t: 'p', text: 'The mark is on the **left**. The line is upright. Nothing is turned.' });
        P.sight.push({ t: 'p', text: 'The ring begins at **slot 3**. Slots run sunwise — clockwise — from the top.' });
        P.sight.push({ t: 'svg', cls: 'underlayer', svg: underLamp });
        P.sight.push({ t: 'h', text: 'Under the dormitory' });
        P.sight.push({ t: 'svg', cls: 'underlayer', svg: underDorm });
        P.sight.push({ t: 'fine', text: 'Every shadow falls away from the lamp. Wren\'s falls toward it.' });
        P.sight.push({ t: 'fine', text: 'Your Ring Page is in the **Book**.' });
        P.wren.push({ t: 'h', text: 'The shadow' });
        P.wren.push({ t: 'p', text: 'You decided months ago it was a trick of the light. You are looking at it now. It is not the light. It never was.' });
      }
      if (roleId === 'binder') {
        P.sight.push({ t: 'h', text: 'Law 1' });
        P.sight.push({ t: 'html', html: `<div class="laws"><div class="law founders"><div class="era">Law 1 · Founders' · Year 0</div><div class="txt">A sigil is read sunwise from the mark.</div></div></div>` });
        P.sight.push({ t: 'html', html: lawRing() });
        P.sight.push({ t: 'p', text: 'Sunwise is clockwise. The mark is a scratch the Seer can see.' });
        P.sight.push({ t: 'p', text: 'First glyph on the mark. The rest follow it clockwise.' });
        P.sight.push({ t: 'h', text: 'Threads in the room' });
        P.sight.push({ t: 'html', html: '<ul class="blk-list">'
          + '<li>' + threadLine('whole') + ' <strong>Reader and Listener:</strong> an old red thread, well knotted.</li>'
          + '<li>' + threadLine('broken') + ' <strong>Seer and you:</strong> last week\'s practice thread would not hold.</li>'
          + '<li>' + threadLine('none') + ' <strong>Wren:</strong> no thread at all. Not unbound — you know unbound. Something else.</li>'
          + '</ul>' });
        P.sight.push({ t: 'fine', text: 'Your **Book** holds the Laws, including one struck through.' });
        P.wren.push({ t: 'h', text: 'The struck Law' });
        P.wren.push({ t: 'p', text: 'You have read the 212 page a dozen times. One Founders\' Law is struck through: *COLD is written by four hands.* Nobody has told you why a Law gets struck.' });
      }
      return P;
    },
  });
})();

</script>
<script>/* js/content/companion/ch1.js */
/* Companion — Chapter I: The Vigil (THORN, no cast) */
(function () {
  'use strict';
  const G = window.VigilGlyphs, L = window.VigilLore, CA = window.CompanionAudio, D = window.CompanionDraw;
  const C = window.CompanionContent;

  /* The nine Houses, sunwise from the Chair — a copy of the table in js/art/scenes-ch1.js (the phone does not load the art). */
  const HOUSES = [
    { n: 1, house: 'Harrowden', color: '#3f7a4a', sym: 'chevron', master: 'Sorrel', sight: 'Thread' },
    { n: 2, house: 'Ossery',    color: '#8c93a6', sym: 'crescent', master: 'Quill', sight: 'Glyph' },
    { n: 3, house: 'Dunmere',   color: '#4a5f8a', sym: 'tower', master: 'Brack', sight: 'Eye' },
    { n: 4, house: 'Fellwood',  color: '#2f5a3a', sym: 'tree', master: 'Hallan', sight: 'Ear' },
    { n: 5, house: 'Goldmarch', color: '#b8892e', sym: 'sun', master: 'Vey', sight: 'Glyph' },
    { n: 6, house: 'Redmoor',   color: '#8a2f2f', sym: 'wave', master: 'Orrin', sight: 'Thread' },
    { n: 7, house: 'Sable',     color: '#5a3f8a', sym: 'stars', master: 'Oriel', sight: 'Eye' },
    { n: 8, house: 'Wyeburn',   color: '#8a6a3a', sym: 'key', master: 'Tarn', sight: 'Ear' },
    { n: 9, house: 'the Chair', color: '#2a2434', sym: 'crown', master: 'Marrow', sight: 'the Provost' },
  ];
  const st = 'fill="none" stroke="#f4ecd8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"';
  function emblem(sym) {
    switch (sym) {
      case 'chevron': return `<path d="M9,27 L20,12 L31,27" ${st}/><path d="M13,31 L20,22 L27,31" ${st}/>`;
      case 'crescent': return `<path d="M25,9 A11,11 0 1 0 25,31 A8.5,8.5 0 1 1 25,9 Z" fill="#f4ecd8"/>`;
      case 'tower': return `<path d="M13,31 V14 H27 V31 Z M11,14 V9 H15 V14 M18,14 V9 H22 V14 M25,14 V9 H29 V14" ${st}/><path d="M18,31 V24 H22 V31" ${st}/>`;
      case 'tree': return `<path d="M20,7 L28,17 L24,17 L30,25 L25,25 L31,32 L9,32 L15,25 L10,25 L16,17 L12,17 Z" fill="#f4ecd8"/>`;
      case 'sun': return `<circle cx="20" cy="20" r="6" fill="#f4ecd8"/>${[0, 45, 90, 135, 180, 225, 270, 315].map(a => `<path d="M20,20 m${(Math.cos(a * Math.PI / 180) * 9).toFixed(1)},${(Math.sin(a * Math.PI / 180) * 9).toFixed(1)} l${(Math.cos(a * Math.PI / 180) * 5).toFixed(1)},${(Math.sin(a * Math.PI / 180) * 5).toFixed(1)}" ${st}/>`).join('')}`;
      case 'wave': return `<path d="M8,17 C12,12 16,12 20,17 C24,22 28,22 32,17" ${st}/><path d="M8,26 C12,21 16,21 20,26 C24,31 28,31 32,26" ${st}/>`;
      case 'stars': { const s = (x, y, r) => { let d = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; d += (i ? 'L' : 'M') + (x + Math.cos(a) * rr).toFixed(1) + ',' + (y + Math.sin(a) * rr).toFixed(1); } return `<path d="${d}Z" fill="#f4ecd8"/>`; }; return s(20, 12, 5) + s(12, 26, 5) + s(28, 26, 5); }
      case 'key': return `<circle cx="14" cy="16" r="5.5" ${st}/><path d="M18,20 L30,32 M26,28 L29,25 M23,25 L26,22" ${st}/>`;
      case 'crown': return `<g transform="translate(20,21) scale(0.9)" style="color:#f4ecd8">${G.shapeInner('Crown', false)}</g>`;
    }
    return '';
  }
  const banner = (h, size) => `<svg viewBox="0 0 40 40" width="${size || 30}" height="${size || 30}" style="display:inline-block;vertical-align:middle"><path d="M5,3 H35 V28 L20,38 L5,28 Z" fill="${h.color}" stroke="rgba(244,236,216,0.5)" stroke-width="1.5"/>${emblem(h.sym)}</svg>`;
  const seatLabel = (n) => { const h = HOUSES[n - 1]; return `${banner(h, 22)} <b>${n}</b> · ${h.house}`; };

  /* Seat positions for the under-layer and thread-map: a ring, the Chair (9) at the top, sunwise. */
  const ring = (cx, cy, r) => HOUSES.map((h, i) => { const a = ((i + 0.5) / 9 * 360 - 90 + 20) * Math.PI / 180; return { n: h.n, x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r }; });

  /* ---------- Seer: under-layer of the Great Hall ---------- */
  const underHall = (() => {
    const seats = ring(180, 170, 78);
    const F = 'font-family="Cinzel,serif"';
    let s = `<svg viewBox="0 0 360 330"><rect width="360" height="330" fill="#000"/>`;
    s += `<g stroke="#fff" fill="none" stroke-width="1.2"><rect x="10" y="10" width="340" height="310"/>`;
    // the Hearth at the top wall, the prophecy stone above it
    s += `<path d="M140,10 L140,50 A40,40 0 0 0 220,50 L220,10"/><rect x="150" y="14" width="60" height="12"/>`;
    s += `<path d="M165,50 C160,40 168,36 170,28 C176,36 182,40 176,50 Z M180,52 C174,38 186,30 190,22 C196,32 204,42 194,52 Z"/>`;
    // the dais, right; the tapestry on the left wall
    s += `<rect x="262" y="60" width="78" height="60" rx="3"/><ellipse cx="300" cy="90" rx="14" ry="4"/>`;
    s += `<rect x="18" y="56" width="18" height="120" stroke-dasharray="3,3"/>`;
    s += `</g>`;
    s += `<text x="180" y="66" text-anchor="middle" fill="#fff" font-size="9" ${F}>the Hearth</text>`;
    s += `<text x="301" y="132" text-anchor="middle" fill="#fff" font-size="9" ${F}>the dais</text>`;
    s += `<text x="27" y="190" text-anchor="middle" fill="#a482e6" font-size="8" ${F}>the tapestry</text><text x="27" y="200" text-anchor="middle" fill="#a482e6" font-size="7" ${F}>older paint beneath</text>`;
    // the nine seats
    seats.forEach(p => { s += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="11" fill="none" stroke="#fff" stroke-width="1.2"/><text x="${p.x.toFixed(1)}" y="${(p.y + 3.5).toFixed(1)}" text-anchor="middle" fill="#fff" font-size="10" ${F}>${p.n}</text>`; });
    s += `<text x="180" y="174" text-anchor="middle" fill="#fff" font-size="8" ${F} opacity=".7">the nine, sunwise from the Chair</text>`;
    // coin under 5 and 8
    [5, 8].forEach(n => { const p = seats[n - 1]; s += `<g transform="translate(${p.x.toFixed(1)},${(p.y + 17).toFixed(1)})"><circle r="4" fill="none" stroke="#a482e6" stroke-width="1.5"/><path d="M-7,-6 l3,3 M7,-6 l-3,3 M0,7 l0,3" stroke="#a482e6" stroke-width="1"/></g>`; });
    const p5 = seats[4], p8 = seats[7];
    s += `<text x="${(p5.x + 12).toFixed(1)}" y="${(p5.y + 30).toFixed(1)}" fill="#a482e6" font-size="8" ${F}>coin, Crown-struck</text>`;
    s += `<text x="${(p8.x - 12).toFixed(1)}" y="${(p8.y + 32).toFixed(1)}" text-anchor="end" fill="#a482e6" font-size="8" ${F}>coin, Crown-struck</text>`;
    // the guard behind 6
    const p6 = seats[5];
    s += `<g transform="translate(${(p6.x + 22).toFixed(1)},${(p6.y + 4).toFixed(1)})"><path d="M-4,10 L-3,-4 L3,-4 L4,10 Z M0,-4 m-3,0 a3,3 0 1 1 6,0" fill="#a482e6"/><path d="M6,-10 L6,10" stroke="#a482e6" stroke-width="1.2"/></g>`;
    s += `<text x="${(p6.x + 34).toFixed(1)}" y="${(p6.y + 8).toFixed(1)}" fill="#a482e6" font-size="8" ${F}>the Envoy's guard</text>`;
    // people: the four at the back, Wren on the dais; shadows away from the Hearth (down), Wren's toward it (up)
    const four = [[110, 285], [150, 292], [200, 292], [240, 285]];
    four.forEach(([x, y], i) => { s += `<circle cx="${x}" cy="${y}" r="5" fill="#fff"/><path d="M${x},${y} l${(x - 180) * 0.12},20" stroke="#fff" stroke-width="3" opacity=".55" stroke-linecap="round"/>`; });
    s += `<circle cx="300" cy="90" r="5" fill="#fff"/><path d="M300,90 L246,64" stroke="#a482e6" stroke-width="3" opacity=".9" stroke-linecap="round"/>`;
    s += `<g fill="#fff" font-size="8" ${F}><text x="94" y="279">Reader</text><text x="141" y="313">Listener</text><text x="192" y="313">Seer</text><text x="232" y="279">Binder</text><text x="306" y="84" fill="#a482e6">Wren</text></g>`;
    s += `<text x="180" y="326" text-anchor="middle" fill="#fff" font-size="8" ${F} opacity=".7">shadows, as they fall</text>`;
    return s + '</svg>';
  })();

  /* ---------- Binder: thread-map of the hall ---------- */
  const threadMap = (() => {
    const seats = ring(150, 150, 92);
    const P = (n) => seats[n - 1];
    const F = 'font-family="Cinzel,serif"';
    let s = `<svg viewBox="0 0 360 300"><rect width="360" height="300" fill="#000"/>`;
    seats.forEach(p => { s += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="12" fill="none" stroke="#fff" stroke-width="1.2"/><text x="${p.x.toFixed(1)}" y="${(p.y + 4).toFixed(1)}" text-anchor="middle" fill="#fff" font-size="10" ${F}>${p.n}</text>`; });
    // Quill (2) follows Sorrel (1): a thread with an arrow toward Sorrel
    const a = P(2), b = P(1);
    s += `<path d="M${a.x.toFixed(1)},${a.y.toFixed(1)} L${b.x.toFixed(1)},${b.y.toFixed(1)}" stroke="#d96b4a" stroke-width="2"/><circle cx="${((a.x + b.x) / 2).toFixed(1)}" cy="${((a.y + b.y) / 2).toFixed(1)}" r="3" fill="#d96b4a"/>`;
    // Orrin (6) opposite Brack (3): a taut thread with a cross at the middle
    const c = P(6), d = P(3); const mx = (c.x + d.x) / 2, my = (c.y + d.y) / 2;
    s += `<path d="M${c.x.toFixed(1)},${c.y.toFixed(1)} L${d.x.toFixed(1)},${d.y.toFixed(1)}" stroke="#d96b4a" stroke-width="2" stroke-dasharray="6,3"/><path d="M${(mx - 5).toFixed(1)},${(my - 5).toFixed(1)} l10,10 M${(mx + 5).toFixed(1)},${(my - 5).toFixed(1)} l-10,10" stroke="#fff" stroke-width="2"/>`;
    // Oriel (7): a loose end
    const e = P(7);
    s += `<path d="M${e.x.toFixed(1)},${e.y.toFixed(1)} c-6,14 -14,18 -10,32" stroke="#d96b4a" stroke-width="2" fill="none" stroke-dasharray="2,3"/>`;
    // Vane, right: gold thread off the page, red thread toward the dais
    s += `<circle cx="300" cy="150" r="12" fill="none" stroke="#fff" stroke-width="1.2"/><text x="300" y="154" text-anchor="middle" fill="#fff" font-size="8" ${F}>V</text>`;
    s += `<path d="M312,150 L356,150" stroke="#e0b04a" stroke-width="2.5"/><text x="334" y="142" text-anchor="middle" fill="#e0b04a" font-size="7" ${F}>to the capital</text>`;
    s += `<path d="M300,138 C300,100 300,80 300,60" stroke="#c0392b" stroke-width="2.5"/><rect x="262" y="20" width="76" height="40" rx="3" fill="none" stroke="#fff" stroke-dasharray="3,3"/><text x="300" y="44" text-anchor="middle" fill="#fff" font-size="8" ${F}>the dais</text>`;
    s += `<g font-size="8" ${F} fill="#d96b4a"><text x="16" y="270">red — an oath · gold — the Crown's coin or favour</text><text x="16" y="284" fill="#fff" opacity=".7">a dashed thread pulls against; a loose end waits to be tied</text></g>`;
    return s + '</svg>';
  })();

  /* ---------- Listener: heartbeats in the hall ---------- */
  const heartbeats = () => {
    const rows = [];
    HOUSES.forEach(h => rows.push([h.n === 9 ? 'The Provost (the Chair)' : `Seat ${h.n} · ${h.house}`, 'normal']));
    rows.push(['The Envoy, Lord Vane', 'fast']);
    rows.push(['Reader', 'normal'], ['Listener', 'normal'], ['Seer', 'normal'], ['Binder', 'normal']);
    rows.push(['Wren', 'flat']);
    return `<div class="heartbeats">${rows.map(([n, k]) => `<div class="hb"><span>${n}${k === 'fast' ? ' <small>(fast)</small>' : k === 'flat' ? ' <small>(too quiet to catch)</small>' : ''}</span>${D.trace(k)}</div>`).join('')}</div>`;
  };
  const murmur = (n, text, steps, base) => ({ t: 'audio', label: `Seat ${n} — ${HOUSES[n - 1].house}`, strip: `<div class="fine">overheard: <em>"${text}"</em></div>`, button: '♪ Cup your ear', play: (A) => CA.playSteps(A, steps, base), text: `Seat ${n} murmurs it to nobody; nobody hears it but you.` });

  C.chapters.push({
    id: 'ch1',
    pages: (roleId, ctx) => {
      const P = { sight: [], wren: [], speak: [] };
      P.speak.push({ t: 'fine', text: 'Nothing to speak yet. The Hearth will tell you when — and it will call all four of you at once.' });
      P.speak.push({ t: 'fine', text: '*' + L.houseRule + '*' });

      if (roleId === 'reader') {
        P.sight.push({ t: 'h', text: 'The nine seats, decoded' });
        P.sight.push({ t: 'p', text: 'The banners are cloth; the seat-plates beneath them are carved in the Vigil\'s script, and you can read them from the back of the hall. Sunwise from the Chair:' });
        P.sight.push({ t: 'table', head: ['Seat', 'Master', 'Sighting'], rows: HOUSES.map(h => [seatLabel(h.n), h.n === 9 ? `<b>Marrow</b> — the Chair; the Chair's mark: ${G.svg('CROWN', { size: 28, color: '#f2d27a' })} <b>CROWN</b>` : `<b>${h.master}</b>`, h.n === 9 ? 'KEEP; cannot be approached' : h.sight]) });
        P.sight.push({ t: 'fine', text: 'That is what the plates say. What each Master will *do* is not written on a plate.' });
        P.sight.push({ t: 'h', text: 'The word on the lintel' });
        P.sight.push({ t: 'p', text: `${G.svg('THORN', { size: 34, color: '#f2d27a' })} **THORN** — *a gate; to go through.* Cut over the Masters' door, which is, when you think about it, a gate.` });
        P.wren.push({ t: 'h', text: 'Under the paint' });
        P.wren.push({ t: 'p', text: 'The Envoy said it twice: *under the paint*. You know every word in this hall — the banners, the plates, the prophecy over the fire. You have never once looked at the tapestry as something with words under it.' });
        P.wren.push({ t: 'p', text: 'And when the Hearth flickered, every Master looked at the fire. You were watching the Provost. She looked at Wren. She looked at Wren the way you look at a line you have read a hundred times and only now suspect you have been reading wrong.' });
      }

      if (roleId === 'listener') {
        P.sight.push({ t: 'h', text: 'Murmurs, before the bell' });
        P.sight.push({ t: 'p', text: 'Three Masters are saying things under their breath. Nobody else in the hall can hear them. You can.' });
        P.sight.push(murmur(1, 'The boy goes to the capital unless someone asks me to my face.', [-1, 1, -2], 52));
        P.sight.push(murmur(3, 'I stand with the Provost.', [2, -1], 50));
        P.sight.push(murmur(4, 'I vote as Orrin votes, and I hear no one else.', [1, 1, -3], 48));
        P.sight.push({ t: 'fine', text: 'Seat 4 means it. You have tried; that Master hears nothing tonight but Seat 6.' });
        P.sight.push({ t: 'h', text: 'Heartbeats in the hall' });
        P.sight.push({ t: 'html', html: heartbeats() });
        P.sight.push({ t: 'audio', label: 'The Envoy', strip: '<div class="fine">fast — a man who walks as if the hall were his, with a heart that says otherwise</div>', play: (A) => CA.heartbeat(A, 118, 8), text: 'Nine Masters, steady. The Envoy, fast. Wren: a flat line, too quiet to catch. As always.' });
        P.wren.push({ t: 'h', text: 'When the fire bowed' });
        P.wren.push({ t: 'p', text: 'When the Hearth flickered, nine hearts jumped. The Provost\'s skipped — one beat, then two — and she was not looking at the fire. She was looking at Wren.' });
        P.wren.push({ t: 'p', text: 'Wren\'s did not skip. Wren\'s never does anything. You have decided, again, that this is a fault in your gift.' });
      }

      if (roleId === 'seer') {
        P.sight.push({ t: 'h', text: 'Under the Great Hall' });
        P.sight.push({ t: 'p', text: 'Coin under two seats — Crown-struck, the kind that buys a vote. A guard in the Envoy\'s grey standing where he can put himself between anyone and **Seat 6**. And on the left wall, the tapestry: there is older paint beneath it. You can see *that* there is a shape under it. Not what.' });
        P.sight.push({ t: 'svg', cls: 'underlayer', svg: underHall });
        P.sight.push({ t: 'list', items: ['**Seat 5** — Crown coin under the cushion.', '**Seat 8** — Crown coin, in the sleeve.', '**Seat 6** — the Envoy\'s guard stands behind the chair. Nobody reaches that Master tonight.'] });
        P.sight.push({ t: 'fine', text: 'The word over the Masters\' door is upright, mark on the left. Nothing to turn tonight.' });
        P.wren.push({ t: 'h', text: 'The shadows, again' });
        P.wren.push({ t: 'p', text: 'You have stopped calling it a trick of the lamp. In the Great Hall there is no lamp; there is the Hearth, and forty torches, and Wren\'s shadow falls toward the Hearth through all of them.' });
        P.wren.push({ t: 'p', text: '"Ask your Seer what is under the paint," the Envoy said. He was not looking at you when he said it. He was looking at the tapestry. He is Eye-Sighted; you would swear it. And he has *seen* what is under it.' });
      }

      if (roleId === 'binder') {
        P.sight.push({ t: 'h', text: 'Threads in the Convocation' });
        P.sight.push({ t: 'svg', cls: 'underlayer', svg: threadMap });
        P.sight.push({ t: 'list', items: [
          '**Seat 2 → Seat 1:** Quill follows Sorrel. Wherever Sorrel votes, Quill votes — unless someone asks Quill directly.',
          '**Seat 6 ⟷ Seat 3:** Orrin votes *opposite* Brack. Always has. A thread pulled against.',
          '**Seat 7:** Oriel. Undecided — a thread waiting to be tied.',
          '**Seat 9:** the Chair. No thread to anyone in the hall tonight. Not unbound; *held*.',
          '**The Envoy:** two threads pull him. **Gold**, off through the doors — the Crown. And **red** — an oath — toward the dais. You lose it in the crowd.',
        ] });
        P.sight.push({ t: 'h', text: 'The Laws that bear tonight' });
        P.sight.push({ t: 'html', html: `<div class="laws"><div class="law founders"><div class="era">Law 1 · Founders' · Year 0</div><div class="txt">A sigil is read sunwise from the mark.</div></div><div class="law founders struck"><div class="era">Law 0 · Founders' · Year 0 · STRUCK</div><div class="txt">COLD is written by four hands.</div><div class="fine">struck by the Convocation, 212. See Law 6.</div></div></div>` });
        P.sight.push({ t: 'p', text: 'The Convocation\'s rule card is not a Law; it is a custom, and customs are read *literally*. "Follows a thread unless approached." "Undecided votes SEND unless approached." The seats are sunwise from the Chair — Law 1 again, applied to chairs.' });
        P.sight.push({ t: 'fine', text: 'The whole Book is in your **Book** tab.' });
        P.wren.push({ t: 'h', text: 'No thread found' });
        P.wren.push({ t: 'p', text: 'Wren, on the dais, in front of nine Houses: *no thread found.* Not to the Provost who named the child. Not to you. Not unbound — you know unbound. The knot itself.' });
        P.wren.push({ t: 'p', text: 'When the fire flickered, the Provost\'s eyes went to Wren, and for one moment you thought you saw a thread there after all — and then the light came back, and it was gone, and you are not sure what colour it was.' });
      }
      return P;
    },
  });
})();

</script>
<script>/* js/content/companion/ch2.js */
/* Companion — Chapter II: The Ember Vault (KNOT · cast: VOTE_LOST) */
(function () {
  'use strict';
  const G = window.VigilGlyphs, L = window.VigilLore, CA = window.CompanionAudio, D = window.CompanionDraw;
  const C = window.CompanionContent;
  const V = '#a482e6', AMBER = '#f2d27a', SEA = '#4fb3bf';
  const F = 'font-family="Cinzel,serif"';

  const EPITAPHS = [
    { name: 'Mere', shape: 'Crown', mark: 'right' },
    { name: 'Halvard', shape: 'Spike', mark: 'left' },
    { name: 'Rook', shape: 'Hook', mark: 'right' },
    { name: 'Idony', shape: 'Hook', mark: 'left' },
  ];
  const STRIP = [{ shape: 'Spike', inv: true }, { shape: 'Crown', inv: true }, { shape: 'Hook', inv: true }];
  const gl = (n) => `${G.svg(n, { size: 30, color: AMBER })} ${n}`;
  const laws = (ns) => `<div class="laws">${L.laws.filter(l => ns.includes(l.n)).sort((a, b) => ns.indexOf(a.n) - ns.indexOf(b.n)).map(l => `<div class="law ${l.era === 'O' ? 'order' : 'founders'}"><div class="era">Law ${l.n} · ${l.era === 'F' ? "Founders' · Year 0" : "Order's · Year " + l.year}</div><div class="txt">${l.text}</div></div>`).join('')}</div>`;

  /* ---------- Seer: under the antechamber ---------- */
  const underAntechamber = (() => {
    const xs = [60, 160, 260, 360]; // Mere, Halvard, Rook, Idony as they stand; dials A B C D beneath the same x
    const names = ['Mere', 'Halvard', 'Rook', 'Idony'];
    const marks = ['right', 'left', 'right', 'left'];
    const sockets = ['Idony', 'Mere', 'Halvard', 'Rook']; // original occupant of the socket above each dial
    const faces = { 0: 1, 1: 2, 2: 3, 3: 0 }; // true sightlines: Mere->B, Halvard->C, Rook->D, Idony->A
    let s = `<svg viewBox="0 0 420 330"><rect width="420" height="330" fill="#000"/>`;
    s += `<text x="210" y="16" text-anchor="middle" fill="#fff" font-size="10" ${F} opacity=".8">UNDER THE ANTECHAMBER — as the statues stand, and as they stood</text>`;
    // wall + niche behind Mere
    s += `<line x1="10" y1="120" x2="410" y2="120" stroke="#fff" stroke-width="1" opacity=".5"/>`;
    s += `<rect x="18" y="92" width="34" height="26" rx="3" fill="none" stroke="${V}" stroke-width="1.5" stroke-dasharray="3 2"/><text x="35" y="88" text-anchor="middle" fill="${V}" font-size="8" ${F}>a niche</text>`;
    xs.forEach((x, i) => {
      const turned = marks[i] === 'right';
      // statue: hood + plinth
      s += `<path d="M${x - 9},112 L${x - 7},60 C${x - 7},48 ${x + 7},48 ${x + 7},60 L${x + 9},112 Z" fill="none" stroke="#fff" stroke-width="1.2"/>`;
      s += `<rect x="${x - 22}" y="112" width="44" height="14" fill="none" stroke="#fff" stroke-width="1.2"${turned ? ` transform="rotate(180 ${x} 119)" stroke-dasharray="4 2"` : ''}/>`;
      // epitaph with mark
      const mx = turned ? x + 18 : x - 18;
      s += `<path d="M${mx},116 L${mx + (turned ? -5 : 5)},119 L${mx},122 Z" fill="${V}"/>`;
      s += `<text x="${x}" y="44" text-anchor="middle" fill="#fff" font-size="10" ${F}>${names[i]}</text>`;
      if (turned) s += `<text x="${x}" y="138" text-anchor="middle" fill="${V}" font-size="9.5" ${F}>upside down · mark right</text>`;
      else s += `<text x="${x}" y="138" text-anchor="middle" fill="#fff" font-size="9.5" ${F} opacity=".7">mark left</text>`;
      // original socket under the floor
      s += `<rect x="${x - 26}" y="150" width="52" height="12" fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="3 2" opacity=".8"/>`;
      s += `<text x="${x}" y="175" text-anchor="middle" fill="#fff" font-size="9.5" ${F} opacity=".8">${sockets[i]}'s socket</text>`;
      // apparent sightline (faint, straight down) and true sightline (solid, to the original socket's dial)
      s += `<line x1="${x}" y1="128" x2="${x}" y2="250" stroke="#fff" stroke-width="1" stroke-dasharray="2 4" opacity=".25"/>`;
      const tx = xs[faces[i]];
      s += `<line x1="${x}" y1="128" x2="${tx}" y2="248" stroke="${V}" stroke-width="2" opacity=".95"/>`;
      s += `<path d="M${tx - 5},241 L${tx},250 L${tx + 5},241" fill="none" stroke="${V}" stroke-width="2"/>`;
      // dial
      s += `<circle cx="${x}" cy="270" r="17" fill="none" stroke="#fff" stroke-width="1.5"/><text x="${x}" y="274" text-anchor="middle" fill="#fff" font-size="12" ${F}>${'ABCD'[i]}</text>`;
    });
    s += `<text x="210" y="304" text-anchor="middle" fill="${V}" font-size="9" ${F}>violet: where each Founder truly faces — the socket their plinth was cut for</text>`;
    s += `<text x="210" y="318" text-anchor="middle" fill="#fff" font-size="9" ${F} opacity=".6">grey dashes: where the rebuilders left them looking</text>`;
    return s + `</svg>`;
  })();

  /* ---------- Seer: under the vault, and the gap ---------- */
  const underVault = `<svg viewBox="0 0 360 230">
    <rect width="360" height="230" fill="#000"/>
    <text x="180" y="16" text-anchor="middle" fill="#fff" font-size="10" ${F} opacity=".8">UNDER THE STAIR — the Ember, and whoever holds it</text>
    <g stroke="#fff" fill="none" stroke-width="1.2">
      <path d="M10,200 L120,200 L120,180 L150,180"/><path d="M210,180 L240,180 L240,160 L350,160"/>
      <path d="M150,180 L150,225 M210,180 L210,225" stroke-dasharray="3 3" opacity=".6"/>
      <rect x="268" y="112" width="26" height="30" rx="3"/>
      <path d="M281,120 C285,124 287,128 287,131 C287,135 284,138 281,138 C278,138 275,135 275,131 C275,128 277,124 281,120 Z" fill="${SEA}" stroke="none" opacity=".9"/>
    </g>
    <g fill="#fff" opacity=".9"><circle cx="40" cy="186" r="6"/><circle cx="70" cy="180" r="6"/><circle cx="100" cy="186" r="6"/><circle cx="130" cy="170" r="6"/></g>
    <g stroke="#fff" stroke-width="3" opacity=".55" stroke-linecap="round"><path d="M40,186 L14,200"/><path d="M70,180 L44,196"/><path d="M100,186 L76,200"/><path d="M130,170 L108,186"/></g>
    <circle cx="300" cy="150" r="6" fill="${V}"/>
    <path d="M300,150 L340,148" stroke="${V}" stroke-width="3" opacity=".9" stroke-linecap="round"/>
    <path d="M300,150 C295,140 285,134 281,128" stroke="${V}" stroke-width="1.2" fill="none" stroke-dasharray="2 2"/>
    <g fill="#fff" font-size="9" ${F}><text x="28" y="212">Reader</text><text x="60" y="166">Listener</text><text x="88" y="212">Seer</text><text x="118" y="158">Binder</text><text x="292" y="176" fill="${V}">Wren</text><text x="281" y="106" text-anchor="middle" fill="${SEA}">the Ember</text></g>
    <text x="180" y="222" text-anchor="middle" fill="#fff" font-size="9" ${F} opacity=".7">four shadows fall away from the cold light. One reaches for it.</text>
  </svg>`;

  C.chapters.push({
    id: 'ch2',
    pages: (roleId, ctx) => {
      const P = { sight: [], wren: [], speak: [] };
      const lost = !!ctx.flags.VOTE_LOST;
      P.speak.push({ t: 'fine', text: 'Nothing to speak yet. The Hearth will tell you when.' });

      /* ================= READER ================= */
      if (roleId === 'reader') {
        P.sight.push({ t: 'h', text: 'The four epitaphs' });
        P.sight.push({ t: 'p', text: 'One shape on each plinth, clean on your page where the Hearth shows them worn. Left to right as the statues stand: **Mere, Halvard, Rook, Idony.** A single carved glyph has only two readings — upright, or *turned* (inverted). Which of these plinths are turned is Under-Sight, not yours: **The Seer knows which plinths are upside down.**' });
        P.sight.push({ t: 'html', html: G.inscription(EPITAPHS.map(e => ({ shape: e.shape, inv: false, label: e.name.toUpperCase() })), { showMark: false, color: '#fff' }) });
        P.sight.push({ t: 'table', head: ['Statue', 'Shape', 'Upright reads', 'Turned reads'], rows: EPITAPHS.map(e => { const up = G.read(e.shape, false), tr = G.invert(up); return [`<b>${e.name}</b>`, `${G.shapeSvg(e.shape, false, { size: 34, color: '#fff' })} ${e.shape}`, `${gl(up)}<br><em>${G.GLYPHS[up].gloss}</em>`, `${gl(tr)}<br><em>${G.GLYPHS[tr].gloss}</em>`]; }) });
        P.sight.push({ t: 'fine', text: 'Read them all upright and you get CROWN, THORN, KNOT, KNOT — two Founders with the same glyph, which the Founders would not have done. Say both readings aloud; let the Seer say which is carved turned.' });
        P.sight.push({ t: 'divider' });
        P.sight.push({ t: 'h', text: 'The strip in the niche' });
        P.sight.push({ t: 'p', text: 'Somewhere in the antechamber, where the rebuilders did not look, there is a hollow with a stone strip of three shapes in it — if the table finds it. The Seer knows where; you know what it says. Left to right: a **Spike, inverted**; a **Crown, inverted**; a **Hook, inverted**. A line of three has a beginning; only the Seer can see which end it is.' });
        P.sight.push({ t: 'html', html: G.inscription(STRIP, { showMark: false, color: '#fff' }) });
        P.sight.push({ t: 'table', head: ['If the strip is…', 'it reads'], rows: [
          ['upright (mark on the left) — left to right, as carved', `${gl('WELL')}, ${gl('EMBER')}, ${gl('VEIL')}<br><em>went down · kept · alone</em> — the Order\'s version: <em>one went down alone and kept it.</em>`],
          ['turned (mark on the right) — right to left, every glyph inverted', `${gl('KNOT')}, ${gl('CROWN')}, ${gl('THORN')}<br><em>four · as one · went through.</em>`],
        ] });
        P.sight.push({ t: 'fine', text: 'Four what? Through what? The strip does not say. Neither does the sheet beside it.' });
        P.sight.push({ t: 'reveal', label: 'The sheet in the niche', blocks: [
          { t: 'p', text: 'Close writing in the **older alphabet** — the one on the dormitory door, the one you have not learned. If you take a rubbing on the Hearth, it sits here, in your sleeve, unread.' },
          { t: 'letter', text: 'ᛃᚲᛟᚦ ᚱᛜᚹ ᛇᛒᛚᚲᛁ ᚦᚨᛞᚷ ᛈᚾ ᛚᛟᚹᛏᚲ ᚠᛊᚱᛞᚹ ᛗᛁᛇᛏ ᚢᛜᚱ ᛞᛖᚷᚦᛏᚲ ᛈᚨᚹ ᚲᛁᛜᛚ ᚹᚦᛊᚨᛚᚢ ᛒᛖᚷ ᛊᛟᚱᛏᚲ ᛁᛚᚹᛞ ᚹᚨᚲᛜᛖ ᛚᚲ ᛃᚨᛗᚾ ᚦᛟᚱᛞᚹᛁ ᛉᛖᚹ … — ᛗᛖᚱᛖ' },
          { t: 'fine', text: 'You can make out one thing: it is signed — four letters set apart at the foot, the way a name is set. Whose, you cannot read. Not yet.' },
        ] });
        P.sight.push({ t: 'fine', text: 'The lexicon, with glosses, is in your **Book**.' });
        P.wren.push({ t: 'h', text: 'Four names' });
        P.wren.push({ t: 'p', text: lost ? 'Wren was on the dais under guard when you went down. Wren is not on the dais now; you would bet your lexicon on it. You have been reading names all night — nine Masters, four Founders — and the only name in this school you cannot read is on a child who is never where they were put.' : 'Four names on four plinths, in the Vigil\'s script, and you read them without thinking. Wren\'s name on the dormitory door is in the older alphabet — the same alphabet as the sheet in the niche. You have started to wonder who wrote the door.' });
      }

      /* ================= LISTENER ================= */
      if (roleId === 'listener') {
        P.sight.push({ t: 'h', text: "The Founders' phrase" });
        P.sight.push({ t: 'p', text: 'When the dials are touched the door hums the Founders\' phrase — four notes, tuned to this room, so the Hearth\'s speakers give away nothing but the **steps** between them. You hear those. Nobody else does.' });
        P.sight.push({ t: 'audio', label: 'The door\'s phrase — four notes', strip: CA.strip([1, 3, -2]), play: (A) => CA.playSteps(A, [1, 3, -2]), text: '**Up one, up three, down two.** Four glyphs, three steps. The Reader can name the four glyphs on the plinths; of every order they could be turned in, only one climbs like this. That order is the order the dials must be turned in — The Binder\'s Law says so.' });
        P.sight.push({ t: 'fine', text: 'Your **Ladder** is in the Book: ASH 0 · THORN 1 · KNOT 2 · EMBER 3 · WELL 4 · VEIL 5 · CROWN 6 · COLD is a rest. Use the **row-player** there: tap four glyphs in an order and it shows the steps; compare them with the arrows above until they match.' });
        P.sight.push({ t: 'p', text: 'One thing you *cannot* hear: which dial was turned. A dial touched on the Hearth sounds through the Hearth, and everyone at the table hears the same thing. Your gift is the order. The Seer\'s is the place.' });
        P.sight.push({ t: 'h', text: 'Heartbeats in the vault' });
        P.sight.push({ t: 'html', html: `<div class="heartbeats">${['Reader', 'Listener', 'Seer', 'Binder'].map(n => `<div class="hb"><span>${n}</span>${D.trace('normal')}</div>`).join('')}<div class="hb"><span>the Ember</span>${D.trace('flat')}</div><div class="hb"><span>Wren</span>${D.trace('flat')}</div></div>` });
        P.sight.push({ t: 'fine', text: 'The Ember: nothing. It is a stone in a box; you did not expect a heart. Wren: ' + (lost ? 'should be on the dais under guard, two floors up and out of any range you have. And yet there are footsteps on the stair behind you — light, quick, familiar — and no heart walking with them. Too quiet to catch.' : 'promised to stay put. And yet there are footsteps on the stair behind you — light, quick, familiar — and no heart walking with them. Too quiet to catch.') });
        P.wren.push({ t: 'h', text: 'The steps behind you' });
        P.wren.push({ t: 'p', text: 'You have heard those footsteps every day for a year. You could pick them out of a crowded Hall. It has never once occurred to you, until this stair, that you have only ever heard the feet.' });
      }

      /* ================= SEER ================= */
      if (roleId === 'seer') {
        P.sight.push({ t: 'h', text: 'Under the antechamber' });
        P.sight.push({ t: 'p', text: 'The floor is Order\'s stone laid over Founders\' stone, and under it the **original sockets** are still cut — four, one before each dial, each shaped for one plinth. The statues do not stand in them. When the vault was rebuilt in 212 the plinths were lifted, shuffled, and set down again in a row — and two of them, **Mere\'s and Rook\'s**, were set down **upside down**: their epitaphs\' marks are on the **right**.' });
        P.sight.push({ t: 'svg', cls: 'underlayer', svg: underAntechamber });
        P.sight.push({ t: 'list', items: [
          '**Where each Founder truly faces** (the socket their plinth was cut for): **Halvard → C · Idony → A · Rook → D · Mere → B.**',
          '**Turned plinths** (mark on the right — the Reader must invert the glyph): **Mere, Rook.** Halvard\'s and Idony\'s marks are on the left: upright.',
          '**A niche** behind Mere\'s plinth, knee height, where the rebuilders did not look. The Hearth will not point at it. You can.',
        ] });
        P.sight.push({ t: 'fine', text: 'The Reader reads the shapes; the Listener has the order; the Binder has the Law that says which of two disagreeing rules is the one that binds. Say what you see.' });
        P.sight.push({ t: 'h', text: 'The strip in the niche' });
        P.sight.push({ t: 'p', text: 'Three shapes on a stone strip. Its **mark is on the right**: the strip is turned — read right to left, every glyph inverted. The Reader has both readings; only you can say which is the one Mere cut.' });
        P.sight.push({ t: 'html', html: G.inscription(STRIP, { showMark: true, mark: 'right', color: '#fff', markColor: V }) });
        P.sight.push({ t: 'h', text: 'Under the stair' });
        P.sight.push({ t: 'svg', cls: 'underlayer', svg: underVault });
        P.sight.push({ t: 'fine', text: 'The Ember gives no heat, and still four shadows fall away from it. ' + (lost ? 'Wren is meant to be on the dais under guard. Wren has never once been where Wren was put; when Wren turns up, look at the shadow.' : 'Wren is meant to be with the Provost. Wren has never once been where Wren was put; when Wren turns up, look at the shadow.') });
        P.sight.push({ t: 'fine', text: 'Your Ring Page and the rule of marks are in the **Book**.' });
        P.wren.push({ t: 'h', text: 'Reaching' });
        P.wren.push({ t: 'p', text: 'In the dormitory it leaned toward the lamp and you called it the lamp. Down here there is no lamp — only a cold blue stone in a box that gives no light a shadow should want. You are going to watch it reach anyway. You already know it will.' });
      }

      /* ================= BINDER ================= */
      if (roleId === 'binder') {
        P.sight.push({ t: 'h', text: 'The Laws of the door' });
        P.sight.push({ t: 'html', html: laws([2, 9, 3]) });
        P.sight.push({ t: 'p', text: 'Law 9 was written in **212** — the year the vault was rebuilt and the statues re-set. It says a Founder faces *the dial before them*. Law 2, four hundred years older, says each Founder\'s glyph sits on the dial *they face* — and the Founders faced the sockets their plinths were cut for, which the Seer can see. The two Laws agree only if the statues never moved. They moved.' });
        P.sight.push({ t: 'p', text: '**Law 3: the older binds.** The sockets, not the rebuild. Then Law 2\'s second half: turn the dials **in the Hymn\'s order** — The Listener has the phrase — and know that the door *counts every turn*. A wrong turn is not undone by a right one after it; the door forgets the whole count and you begin again.' });
        P.sight.push({ t: 'fine', text: 'The 212 page of your Book now holds an Order\'s Law written that year beside a Founders\' Law struck through in the same hand. The vault was rebuilt in 212, and a road behind it was bricked up in 212. You have not been told what else happened in 212.' });
        P.sight.push({ t: 'h', text: 'Threads in the vault' });
        P.sight.push({ t: 'list', items: [
          '**Marrow → the four of you:** a thin red thread, new tonight. An errand is a small oath. It pulls downward as you go; she is holding her end.',
          lost ? '**Vane → Wren:** gold, and tight — the writ made real. Under the gold, still, the red one you saw in the Hall, older than the writ. **Vane\'s guard → Wren:** four gold threads to a dais that, if your Sight is right, is now empty.' : '**Vane → Wren:** gold, as in the Hall — and under the gold, still, the red one, older than the writ. He has not left the school.',
          '**Marrow → Wren:** the same thread as in the Hall. You are trying not to look at its colour. It is not red.',
          '**The Ember:** no thread. It is a stone; stones are not bound. You expected nothing and found nothing.',
          '**Wren:** *No thread found.* Not unbound; the knot itself. You expected something and found nothing, which is not the same.',
        ] });
        P.sight.push({ t: 'fine', text: 'The Book of Laws, in the order learned and by year, is in your **Book**.' });
        P.wren.push({ t: 'h', text: 'The same nothing' });
        P.wren.push({ t: 'p', text: 'You looked at the Ember and saw no thread, and it did not trouble you: it is a stone. You looked at Wren and saw the same nothing, and it troubled you for the fourteenth year running. You have not yet asked yourself why the two nothings feel different — or whether they are.' });
      }
      return P;
    },
  });
})();

<script>/* js/content/companion/ch3.js */
/* Companion — Chapter III: The Whispering Gallery (VEIL · cast: VOTE_LOST, WREN_HURT, VANE_ACCEPT · mini-word LINEN) */
(function () {
  'use strict';
  const G = window.VigilGlyphs, L = window.VigilLore, CA = window.CompanionAudio, D = window.CompanionDraw, UI = window.VigilUI;
  const C = window.CompanionContent;
  const F = 'Cinzel,serif';

  /* ---------- the corridors, as data (mirrors the Hearth's published grid) ---------- */
  const CELLS = ['A1', 'A2', 'A3', 'A4', 'A5', 'B1', 'C1', 'B3', 'C2', 'C3', 'C4', 'D3', 'B5', 'C5', 'D5', 'E1', 'E2', 'E3', 'E4', 'E5'];
  const EDGES = [['A1', 'B1'], ['B1', 'C1'], ['A1', 'A2'], ['A2', 'A3'], ['A3', 'A4'], ['A4', 'A5'], ['A5', 'B5'], ['B5', 'C5'], ['C5', 'D5'], ['D5', 'E5'], ['E1', 'E2'], ['E2', 'E3'], ['E3', 'E4'], ['E4', 'E5'], ['C5', 'C4'], ['C4', 'C3'], ['C3', 'C2'], ['C3', 'D3'], ['D3', 'E3']];
  const DOORS = [['A3', 'B3'], ['B3', 'C3']];
  const LANDMARK = { A5: ['west', 'stair-foot'], B5: ['boot-room'], C5: ['porter\'s', 'lodge'], C4: ['drying-rack'], C3: ['damp wall'], A4: ['west corr.', 'south'], A3: ['linen chute'], E4: ['tower', 'stair-foot'], E3: ['east cross'], E2: ['east', 'corridor'], E1: ['cook\'s door'], A1: ['Gallery'], B3: ['LAUNDRY'], E5: ['Tower door'], D1: ['cook', '(locked)'] };
  const LOOP_A = ['west stair-foot', 'boot-room', 'porter\'s lodge', 'drying-rack', 'damp wall', 'drying-rack', 'porter\'s lodge', 'boot-room', 'west stair-foot', 'west corridor south', 'linen chute', 'west corridor south'];
  const LOOP_B = ['tower stair-foot', 'tower stair-foot', 'tower stair-foot', 'tower stair-foot', 'tower stair-foot', 'tower stair-foot', 'east cross', 'east corridor', 'cook\'s door', 'cook\'s door', 'east corridor', 'east cross'];

  /* ---------- Seer: the under-layer of the corridors ---------- */
  function underCorridors(hurt) {
    const S = 60, pad = 24, W = 5 * S + pad * 2, H = 5 * S + pad * 2 + 26;
    const col = (c) => c.charCodeAt(0) - 65, row = (c) => parseInt(c.slice(1), 10) - 1;
    const xy = (c) => ({ x: pad + col(c) * S, y: pad + row(c) * S });
    const open = new Set(); EDGES.forEach(([a, b]) => { open.add(a + '|' + b); open.add(b + '|' + a); });
    const door = new Set(); DOORS.forEach(([a, b]) => { door.add(a + '|' + b); door.add(b + '|' + a); });
    let s = `<svg viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="#000"/>`;
    // wall cells: faint hatch
    s += `<defs><pattern id="ch3hatch" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0,6 L6,0" stroke="#fff" stroke-width=".5" opacity=".18"/></pattern></defs>`;
    for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
      const id = String.fromCharCode(65 + c) + (r + 1); const p = { x: pad + c * S, y: pad + r * S };
      const isOpen = CELLS.includes(id);
      s += `<rect x="${p.x}" y="${p.y}" width="${S}" height="${S}" fill="${isOpen ? '#000' : 'url(#ch3hatch)'}" stroke="#fff" stroke-width="${isOpen ? 1.2 : 0.4}" opacity="${isOpen ? 1 : 0.7}"/>`;
      if (isOpen || LANDMARK[id]) s += `<text x="${p.x + 4}" y="${p.y + 10}" fill="#fff" font-size="8" font-family="${F}" opacity=".7">${id}</text>`;
      const lm = LANDMARK[id];
      if (lm) lm.forEach((ln, i) => { s += `<text x="${p.x + S / 2}" y="${p.y + 30 + i * 10 - (lm.length - 1) * 5}" text-anchor="middle" fill="${id === 'B3' ? '#a482e6' : '#fff'}" font-size="${id === 'B3' ? 9 : 7.5}" font-family="${F}">${UI.esc(ln)}</text>`; });
    }
    // open passages: erase the shared border; doors: dashed violet
    for (const a of CELLS) for (const b of CELLS) {
      if (a >= b) continue; const dc = col(b) - col(a), dr = row(b) - row(a); if (Math.abs(dc) + Math.abs(dr) !== 1) continue;
      const A = xy(a); const isOpen = open.has(a + '|' + b), isDoor = door.has(a + '|' + b);
      if (!isOpen && !isDoor) continue;
      if (dc) { const x = A.x + S; s += `<line x1="${x}" y1="${A.y + 8}" x2="${x}" y2="${A.y + S - 8}" stroke="${isDoor ? '#a482e6' : '#000'}" stroke-width="${isDoor ? 3 : 4}" ${isDoor ? 'stroke-dasharray="4 3"' : ''}/>`; }
      else { const y = A.y + S; s += `<line x1="${A.x + 8}" y1="${y}" x2="${A.x + S - 8}" y2="${y}" stroke="${isDoor ? '#a482e6' : '#000'}" stroke-width="${isDoor ? 3 : 4}" ${isDoor ? 'stroke-dasharray="4 3"' : ''}/>`; }
    }
    // Hob's spyhole at the porter's lodge: an eye on B5, C4, D5
    const hob = xy('C5');
    s += `<circle cx="${hob.x + S / 2}" cy="${hob.y + S - 10}" r="4" fill="none" stroke="#a482e6" stroke-width="1.5"/><circle cx="${hob.x + S / 2}" cy="${hob.y + S - 10}" r="1.5" fill="#a482e6"/>`;
    [['B5', -1, 0], ['D5', 1, 0], ['C4', 0, -1]].forEach(([c, dx, dy]) => { const t = xy(c); s += `<line x1="${hob.x + S / 2}" y1="${hob.y + S - 10}" x2="${t.x + S / 2}" y2="${t.y + S / 2}" stroke="#a482e6" stroke-width="1" stroke-dasharray="2 3" opacity=".8"/>`; });
    // the Tower door
    const g = xy('E5'); s += `<circle cx="${g.x + S / 2}" cy="${g.y + S / 2}" r="14" fill="none" stroke="#fff" stroke-dasharray="3 2"/>`;
    // legend
    s += `<g font-family="${F}" font-size="8" fill="#fff"><line x1="${pad}" y1="${H - 12}" x2="${pad + 22}" y2="${H - 12}" stroke="#a482e6" stroke-width="3" stroke-dasharray="4 3"/><text x="${pad + 28}" y="${H - 9}" fill="#a482e6">hidden door · needs its word</text><circle cx="${pad + 172}" cy="${H - 12}" r="4" fill="none" stroke="#a482e6"/><text x="${pad + 180}" y="${H - 9}" fill="#a482e6">Hob's spyhole</text></g>`;
    if (hurt) s += `<text x="${W - pad}" y="${pad - 8}" text-anchor="end" fill="#fff" font-size="8" font-family="${F}" opacity=".8">Wren cannot run tonight</text>`;
    return s + `</svg>`;
  }

  /* ---------- Seer: the Gallery, shadows as they fall ---------- */
  const underGallery = `<svg viewBox="0 0 360 220">
    <rect width="360" height="220" fill="#000"/>
    <g stroke="#fff" fill="none" stroke-width="1.2">
      <rect x="10" y="10" width="340" height="200"/>
      ${[0, 1, 2, 3, 4].map(i => `<rect x="${24 + i * 58}" y="22" width="40" height="52"/><rect x="${24 + i * 58}" y="150" width="40" height="52"/>`).join('')}
      <circle cx="330" cy="110" r="10"/><path d="M330,100 L330,88 M324,92 L336,92"/>
      <text x="330" y="136" text-anchor="middle" fill="#fff" font-size="9" font-family="Cinzel,serif" stroke="none">the lamp</text>
    </g>
    <g fill="#fff" opacity=".9"><circle cx="90" cy="110" r="6"/><circle cx="130" cy="96" r="6"/><circle cx="150" cy="128" r="6"/><circle cx="190" cy="106" r="6"/><circle cx="250" cy="112" r="5"/></g>
    <g stroke="#fff" stroke-width="3" opacity=".55" stroke-linecap="round"><path d="M90,110 L52,110"/><path d="M130,96 L96,92"/><path d="M150,128 L116,132"/><path d="M190,106 L154,104"/></g>
    <g stroke="#a482e6" stroke-width="3" opacity=".9" stroke-linecap="round"><path d="M250,112 L300,112"/></g>
    <g fill="#fff" font-size="9" font-family="Cinzel,serif"><text x="78" y="128">Reader</text><text x="120" y="86">Listener</text><text x="140" y="146">Seer</text><text x="180" y="124">Binder</text><text x="238" y="130" fill="#a482e6">Wren</text></g>
    <text x="180" y="214" text-anchor="middle" fill="#fff" font-size="9" font-family="Cinzel,serif" opacity=".7">shadows, as they fall — the portraits have none</text>
  </svg>`;

  /* ---------- Seer: the Tower door's threshold ---------- */
  const towerCarving = (showMark) => G.inscription([{ shape: 'Flame', inv: false }, { shape: 'Spike', inv: false }], { showMark, mark: 'left', color: '#fff', markColor: '#a482e6' });
  const underTower = `<svg viewBox="0 0 360 210">
    <rect width="360" height="210" fill="#000"/>
    <g transform="translate(0,8)">${towerCarving(true).replace('<svg', '<svg x="90" y="0" width="180" height="60"')}</g>
    <text x="180" y="86" text-anchor="middle" fill="#a482e6" font-size="10" font-family="Cinzel,serif">the lintel's mark: on the left</text>
    <g stroke="#fff" fill="none" stroke-width="1.5" transform="translate(180,150)">
      <circle r="38"/>
      <circle cx="0" cy="-38" r="9"/><text x="0" y="-52" text-anchor="middle" fill="#fff" font-size="10" font-family="Cinzel,serif" stroke="none">1</text>
      <circle cx="0" cy="38" r="9"/><text x="0" y="60" text-anchor="middle" fill="#fff" font-size="10" font-family="Cinzel,serif" stroke="none">2</text>
      <path d="M24,-30 a38,38 0 0 1 14,30" stroke-width="1.5"/><path d="M38,0 l-5,-6 l-3,7 z" fill="#fff" stroke="none"/>
      <path d="M-14,-48 L-6,-38 L-14,-30 Z" fill="#a482e6" stroke="none"/>
    </g>
    <text x="70" y="150" text-anchor="end" fill="#a482e6" font-size="10" font-family="Cinzel,serif">the scratch — slot 1</text>
    <text x="180" y="204" text-anchor="middle" fill="#fff" font-size="9" font-family="Cinzel,serif" opacity=".7">two slots · sunwise = clockwise</text>
  </svg>`;

  /* ---------- Listener: the tally tool ---------- */
  function tallyTool(el) {
    let beat = 0, alarmUntil = -1;
    const big = UI.el('div', { class: 'big-digit', style: { fontFamily: 'Cinzel,serif', fontSize: '40px', textAlign: 'center', color: '#4fb3bf' } });
    const where = UI.el('div', { class: 'fine', style: { textAlign: 'center', minHeight: '3.2em' } });
    const at = (loop, b) => loop[((b - 1) % 12 + 12) % 12];
    const render = () => {
      big.textContent = beat === 0 ? '—' : 'beat ' + beat;
      if (beat === 0) { where.innerHTML = 'Before the first turn. Light steps at <b>west corridor south</b>; heavy boots at the <b>east cross</b>.'; return; }
      const b = alarmUntil >= beat ? 'tower stair-foot <em>(holding — the alarm)</em>' : at(LOOP_B, beat);
      where.innerHTML = `Light steps: <b>${at(LOOP_A, beat)}</b><br>Heavy boots: <b>${b}</b>` + (beat > 12 ? `<br><span class="fine">the loop has begun again (beat ${((beat - 1) % 12) + 1} of 12)</span>` : '');
    };
    el.appendChild(UI.el('p', { class: 'fine', text: 'Tap once for every turn the Hearth commits — a move or a wait. The rounds never change; only your count can slip.' }));
    el.appendChild(big); el.appendChild(where);
    el.appendChild(UI.el('div', { class: 'row', style: { display: 'flex', gap: '8px', flexWrap: 'wrap', justifyContent: 'center', marginTop: '8px' } }, [
      UI.el('button', { class: 'btn small', text: '▶ next beat', onclick: () => { beat++; render(); try { window.VigilAudio.sfx('tick'); } catch (e) {} } }),
      UI.el('button', { class: 'btn small ghost', text: '◀ one back', onclick: () => { beat = Math.max(0, beat - 1); render(); } }),
      UI.el('button', { class: 'btn small ghost', text: 'Hob cried out', onclick: () => { alarmUntil = beat + 3; render(); } }),
      UI.el('button', { class: 'btn small ghost', text: 'reset', onclick: () => { beat = 0; alarmUntil = -1; render(); } }),
    ]));
    render();
  }
  const loopTable = (loop) => ({ t: 'table', head: ['beat', 'you hear them at'], rows: loop.map((l, i) => [String(i + 1), l]) });

  const playSteps = (A, light) => { A.init(); if (A.isMuted()) A.setMuted(false); const n = light ? 8 : 5, gap = light ? 260 : 620; for (let i = 0; i < n; i++) CA.later(() => A.sfx(light ? 'step' : 'miss'), i * gap); return n * gap + 400; };
  const playPortraits = (A) => { A.init(); if (A.isMuted()) A.setMuted(false); [0, 1400, 2800].forEach((t, k) => CA.later(() => { A.sfx('whoosh'); [55, 52, 48, 43].forEach((m, i) => CA.later(() => A.note(m, 0.9, 0.06), 250 + i * 220)); }, t)); return 2800 + 250 + 4 * 220 + 900; };

  C.chapters.push({
    id: 'ch3',
    miniWords: { LINEN: 'speak' },
    pages: (roleId, ctx) => {
      const P = { sight: [], wren: [], speak: [] };
      const f = ctx.flags || {}; const hurt = !!f.WREN_HURT, lost = !!f.VOTE_LOST, accepted = !!f.VANE_ACCEPT;

      /* ================= READER ================= */
      if (roleId === 'reader') {
        P.sight.push({ t: 'h', text: 'Two lintels in the dark' });
        P.sight.push({ t: 'p', text: 'Somewhere between the Gallery and the Tower there are two doors the Hearth does not draw. You cannot see the doors. You can read what is carved over them — one shape each, clean on your page.' });
        P.sight.push({ t: 'p', text: '**The first lintel** — the west corridor, by the linen chute. A **Hook**.' });
        P.sight.push({ t: 'html', html: G.inscription([{ shape: 'Hook', inv: false }], { showMark: false }) });
        P.sight.push({ t: 'table', head: ['If the mark is…', 'the word is'], rows: [['on the left (upright)', `${G.svg('KNOT', { size: 30, color: '#f2d27a' })} KNOT — <em>bound; together</em>`], ['on the right (turned)', `${G.svg('VEIL', { size: 30, color: '#f2d27a' })} VEIL — <em>hidden; behind</em>`]] });
        P.sight.push({ t: 'p', text: '**The second lintel** — the Laundry\'s back door. A **Spike**.' });
