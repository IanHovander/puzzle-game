      <path d="M8,22 L18,29 L8,36 Z" fill="rgba(255,255,255,.7)"/>
      ${row(94, true, '#d96b4a')}
      <path d="M290,102 L280,109 L290,116 Z" fill="rgba(255,255,255,.7)"/>
      <text x="150" y="172" text-anchor="middle" fill="#d96b4a" font-size="11" font-family="Cinzel,serif">either way up, the numbers do not move</text>
    </svg>`;
  };

  /* A thread, drawn two ways: whole, and the empty bracket where one should be. The Binder's Wren tab
     is the one place in this chapter a thread is a picture rather than a colour. */
  const threadLine = (kind) => `<svg viewBox="0 0 90 16" style="width:74px;height:14px;vertical-align:middle">${
    kind === 'whole' ? '<path d="M4,8 C24,2 34,14 52,8 S74,4 86,8" fill="none" stroke="#d96b4a" stroke-width="2.5" stroke-linecap="round"/>'
      : '<path d="M6,2 L2,2 L2,14 L6,14 M84,2 L88,2 L88,14 L84,14" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>'
  }</svg>`;

  const SPINES = ['EMBER', 'WELL', 'ASH', 'KNOT', 'CROWN', 'VEIL'];  // as the stamps stand, place 1..6

  C.chapters.push({
    id: 'ch4',
    pages: (roleId, ctx) => {
      const f = ctx.flags || {};
      const P = { sight: [], wren: [], speak: [] };
      const scared = !!f.WREN_SCARED;
      P.speak.push({ t: 'fine', text: 'Nothing to speak this chapter. The Hearth will call you by name.' });
      P.speak.push({ t: 'fine', text: '*' + L.houseRule + '*' });

      /* ================= READER ================= */
      if (roleId === 'reader') {
        P.sight.push({ t: 'h', text: 'What is written in this room' });
        P.sight.push({ t: 'p', text: 'The primer she left open is in your **Book** now. Read the journal on the desk out loud, both lines.' });
        P.sight.push({ t: 'p', text: '**The third shelf.** Six books, each stamped with a shape. The Hearth shows them rubbed to nothing. Here they are clean:' });
        P.sight.push({ t: 'table', head: ['spine', 'it says'], rows: SPINES.map((w, i) => [`<b>${i + 1}</b>`, `<b>${w}</b>`]) });
        P.sight.push({ t: 'fine', text: 'That is what they say **as they stand.** Which end of the board is marked is not yours to see. Somebody here can.' });
        P.sight.push({ t: 'p', text: '**The oath scroll.** Three words are cut round the ring, worn nearly smooth. Clean, here:' });
        P.sight.push({ t: 'html', html: oathRing() });
        P.sight.push({ t: 'p', text: '**ASH, THORN, WELL** — *fire; a gate; down.* Nobody cut the fourth. The swearer chooses that one.' });
        P.sight.push({ t: 'fine', text: 'A ring has no first and no last. Somebody here can hear how the first two step.' });

        P.wren.push({ t: 'h', text: 'The name' });
        P.wren.push({ t: 'html', html: runeLine('WRENN', { height: 60 }) });
        P.wren.push({ t: 'p', text: 'On the Vigil roll the Provost wrote it herself, in the old letters. You ciphered it tonight with her own primer.' });
        P.wren.push({ t: 'p', text: 'Not a bird. *Wrenn* is the hollow of a bell — the space inside it that makes the sound.' });
        P.wren.push({ t: 'p', text: 'You decided, a year ago, that it was a spelling mistake. You have never asked her.' });
      }

      /* ================= LISTENER ================= */
      if (roleId === 'listener') {
        P.sight.push({ t: 'h', text: 'What you can hear' });
        P.sight.push({ t: 'audio', label: 'The bell on the mantel, struck', strip: CA.strip([-1, -2, 'rest', 2, 1, -3]),
          play: (A) => { CA.playSteps(A, [-1, -2], 58); CA.later(() => CA.announce(2, { rest: true }), 2000); CA.later(() => CA.playSteps(A, [2, 1, -3], 66, { offset: 3 }), 2400); return 2400 + 4 * 650 + 500; },
          text: 'A low voice, courteous and certain — **the Envoy:** *"The Crown will have the Cold open, one way or another."*\n\nThen hers — **the Provost:** *"Then the Crown will go through me. And through it."*' });
        P.sight.push({ t: 'fine', text: 'Say whose voice it was, and say her last two words. Nobody here will like them. Say them anyway.' });
        P.sight.push({ t: 'audio', label: 'The third shelf, humming', strip: CA.strip([2, 2, 1]), play: (A) => CA.playSteps(A, [2, 2, 1]),
          text: '**Up two, up two, up one.** Four books, three climbs, and only one order climbs like that.' });
        /* One step, not the contour. Two steps pin the three words on their own, and then the Reader's
           set is confirming what this page has already said. One step plus three known words is still
           exactly one order; one step without them is thirty-two boards. */
        P.sight.push({ t: 'audio', label: 'The scroll, when the ring is touched', strip: CA.strip([-1]) + '<div class="arrow-strip"><span class="step rest"><b>◆</b>then it dies away</span></div>', play: (A) => CA.playSteps(A, [-1]),
          text: '**Down one, and then the tune goes out of it.** Three words are cut there. The ring will only give you the step from the first to the second.' });
        P.sight.push({ t: 'fine', text: 'You never hear a word\'s name, only how far the tune steps. Three words, one step — the Reader has to tell you which three.' });

        P.wren.push({ t: 'h', text: 'What the bell would not keep' });
        P.wren.push({ t: 'html', html: `<div class="heartbeats">${['Reader', 'Listener', 'Seer', 'Binder'].map(n => `<div class="hb"><span>${n}</span>${D.trace('normal')}</div>`).join('')}<div class="hb"><span>the Provost</span>${D.trace(f.SURRENDERED ? 'fast' : 'normal')}</div><div class="hb"><span>Wren</span>${D.trace('flat')}</div></div>` });
        P.wren.push({ t: 'p', text: 'You struck it twice more while nobody was looking. It gave you the Provost, and the Envoy, and your own voice asking for the primer.' });
        P.wren.push({ t: 'p', text: 'It did not give you Wren. It keeps every voice in this room but one.' });
        P.wren.push({ t: 'p', text: 'You decided years ago that the fault was in your ear. You have never said so out loud.' });
      }

      /* ================= SEER ================= */
      if (roleId === 'seer') {
        P.sight.push({ t: 'h', text: 'Under three things in this study' });
        P.sight.push({ t: 'p', text: 'The shelf board, the tapestry, and the scroll on the desk. All three have something under them.' });
        P.sight.push({ t: 'svg', cls: 'underlayer', svg: underMarks });
        P.sight.push({ t: 'fine', text: 'Three cuts, and nothing else cut anywhere in the room. **The two in the scroll\'s ring are not the same kind.**' });
        P.sight.push({ t: 'p', text: 'The tapestry is painted, and painted over. Say which of them has something in his hand, and which of them reaches back.' });
        P.sight.push({ t: 'fine', text: 'What a cut obliges is not yours — one kind starts a sigil and one does not, and that is the Binder\'s. Say where they are, and stop.' });

        P.wren.push({ t: 'h', text: 'The shadow, again' });
        P.wren.push({ t: 'svg', cls: 'underlayer', svg: underShadows });
        P.wren.push({ t: 'p', text: 'Every shadow in this room falls away from the fire. Wren\'s still falls towards it.' });
        P.wren.push({ t: 'p', text: scared ? 'You blamed the lamp in the dormitory. There is no lamp here, and it still falls the wrong way.' : 'You blamed the lamp in the dormitory. There is no lamp here.' });
      }

      /* ================= BINDER ================= */
      if (roleId === 'binder') {
        P.sight.push({ t: 'h', text: 'Two rules, and two threads' });
        P.sight.push({ t: 'html', html: turnedBoard() });
        P.sight.push({ t: 'p', text: '**Whichever way up a board hangs, every book keeps its place.** Hung the other way up, it says the opposite word. Which way this one hangs is not yours to see.' });
        P.sight.push({ t: 'p', text: '**A sigil begins at the scratch, and runs the way a clock counts** — the same rule as the lamp.' });
        P.sight.push({ t: 'p', text: 'A notch is only a maker\'s mark. It says somebody made this, and nothing about where to start. What the three words leave over is where the lock goes.' });
        P.sight.push({ t: 'table', head: ['a lock', 'and what it costs'], rows: [
          ['<b>KNOT</b>', 'It cannot be untied. Not by you, not by her, not ever.'],
          ['<b>EMBER</b>', 'It can be reconsidered later, if there turns out to be a later.'],
        ] });
        P.sight.push({ t: 'p', text: 'Those two, and nothing else the wax takes. The one you swear to cannot tell the difference. You can.' });
        P.sight.push({ t: 'p', text: '**The Provost\'s thread to Wren is grey.** Hers to the four of you is red, and not tied yet.' });
        P.sight.push({ t: 'fine', text: 'You cannot read a word or find a cut. Ask for both.' });

        P.wren.push({ t: 'h', text: 'No thread found' });
        P.wren.push({ t: 'html', html: '<ul class="blk-list">'
          + '<li>' + threadLine('whole') + ' <strong>the four of you:</strong> one thread each, all night.</li>'
          + '<li>' + threadLine('none') + ' <strong>Wren:</strong> nothing going out, to anyone.</li></ul>' });
        P.wren.push({ t: 'p', text: 'A thread reaches her from the woman who named her. Nothing comes back — not to the Provost, not to you.' });
        P.wren.push({ t: 'p', text: scared ? 'You have looked every hour since the laundry, and twice since the stair. Still nothing.' : 'You have looked every hour since the laundry. There is still nothing to find.' });
        P.wren.push({ t: 'p', text: 'You decided years ago it was a blind spot in your own gift. You have never told anyone your gift has one.' });
      }
      return P;
    },
  });
})();

</script>
<script>/* js/content/companion/ch5.js */
/* Companion — Chapter V: The Long Stair (ASH). Four pages, one fact each, and no page holds another's:
   the Reader has what each shape says, both ways up; the Listener has the bell over each shape and how
   far it counts; the Seer has which end each carving is marked at and where the three cuts are; the
   Binder has which kind of cut a sigil begins at HERE (not the scratch the room was taught in the
   Prologue and Chapter IV -- these doors predate that Law), which way the count runs, and whether the
   word nobody writes is written or left out. */
(function () {
  'use strict';
  const G = window.VigilGlyphs, L = window.VigilLore, CA = window.CompanionAudio, D = window.CompanionDraw, UI = window.VigilUI;
  const C = window.CompanionContent;
  const VIOLET = '#a482e6', GOLD = '#f2d27a', SEA = '#4fb3bf', RED = '#d96b4a';
  const F = 'font-family="Cinzel,serif"';

  /* The two carvings, exactly as js/content/ch5.js holds them (W1.items / W2.items), and the bells
     above them (W1.counts / W2.counts). The Hearth derives the accepted board from these; this page
     only reports them. Marked ends and ring cuts are the Seer's and live on that page alone.
     THIS IS A COPY, and nothing in the engine compares the two: change W2.items or W2.counts on the
     Hearth without changing them here and the gate cannot be solved by four hands at all -- it fails
     as two frosts and a forced gate, which is a written branch, so every tool stays green.
     tools/scripts/ch5-gate-check.js compares the four lists across the two files, and also checks
     that W2.counts is a permutation of 1..5, which is what the cracked-bell line below promises.
     The ring cuts are copied on the Seer's page (gateMarks) and are compared by the same script. */
  const GATE1 = [{ shape: 'Crown', inv: true }, { shape: 'Hook', inv: true }, { shape: 'Spike', inv: false }];
  const GATE2 = [{ shape: 'Crown', inv: false }, { shape: 'Flame', inv: false }, { shape: 'Flame', inv: true }, { shape: 'Hook', inv: false }, { shape: 'Spike', inv: true }];
  const COUNTS1 = [3, 1, 5];
  const COUNTS2 = [2, 5, 1, 3, 4];
  const CRACKED = 1;                 // EMBER_LOST: the second bell of the silent gate

  /* ---------- Reader: both carvings, each shape with both of its words ----------
     Drawn as the stone stands, in the order it was cut, because the bells are keyed to that order.
     Nothing here says which reading is live and nothing here says where the ring begins: the page
     carries the lookup and the gap, and the gap is in the caption. */
  const readerLintels = () => {
    const rows = [
      { items: GATE1, name: 'the first gate', y: 62, cell: 78, s: 1.15 },
      { items: GATE2, name: 'the silent gate', y: 178, cell: 56, s: 0.85 },
    ];
    let s = '<svg viewBox="0 0 320 254" width="100%" style="max-width:320px;display:block;margin:0 auto">';
    rows.forEach(r => {
      const x0 = 160 - (r.items.length - 1) * r.cell / 2;
      s += `<text x="8" y="${r.y - 32}" fill="rgba(233,226,210,.55)" font-size="9" ${F}>${r.name}</text>`;
      r.items.forEach((it, i) => {
        const x = x0 + i * r.cell, up = G.read(it.shape, it.inv), other = G.invert(up);
        s += `<g transform="translate(${x},${r.y}) scale(${r.s})" style="color:${GOLD}">${G.shapeInner(it.shape, it.inv)}</g>`;
        s += `<text x="${x}" y="${r.y + 30}" text-anchor="middle" fill="${GOLD}" font-size="10" ${F}>${up}</text>`;
        s += `<text x="${x}" y="${r.y + 43}" text-anchor="middle" fill="rgba(242,210,122,.45)" font-size="9" ${F}>${other}</text>`;
      });
    });
    s += `<text x="160" y="248" text-anchor="middle" fill="rgba(233,226,210,.55)" font-size="9" ${F}>as it stands, above · the other way up, below</text>`;
    return s + '</svg>';
  };

  /* ---------- Listener: the bells, drawn as counts ----------
     A bell and its count in tally dots. No ring, no mark, no arrow: where the counting starts is the
     Seer's and which way it runs is the Binder's. */
  const tallyRow = (counts, cracked) => {
    const cell = 58, w = counts.length * cell + 20, h = 76;
    let s = `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;display:block;margin:0 auto">`;
    counts.forEach((n, i) => {
      const x = 10 + cell / 2 + i * cell, out = cracked === i, col = out ? 'rgba(79,179,191,.3)' : SEA;
      s += `<g transform="translate(${x},24)"><path d="M-13,6 L-13,0 Q-13,-15 0,-16 Q13,-15 13,0 L13,6 Z" fill="none" stroke="${col}" stroke-width="1.6"/><circle cy="10" r="2.5" fill="${col}"/></g>`;
      if (out) { s += `<path d="M${x - 5},10 l7,16" stroke="${RED}" stroke-width="1.4"/><text x="${x}" y="60" text-anchor="middle" fill="${RED}" font-size="12" ${F}>?</text>`; }
      else {
        for (let k = 0; k < n; k++) s += `<circle cx="${(x - (n - 1) * 4 + k * 8).toFixed(1)}" cy="46" r="2.6" fill="${SEA}"/>`;
        s += `<text x="${x}" y="68" text-anchor="middle" fill="${SEA}" font-size="11" ${F}>${n}</text>`;
      }
    });
    return s + '</svg>';
  };
  const playCounts = (A, counts, cracked) => {
    let t = 0;
    counts.forEach((n, i) => { if (cracked === i) { CA.later(() => A.sfx('miss'), t); t += 900; return; } CA.later(() => CA.pulses(A, n, 400), t); t += n * 400 + 900; });
    return t + 300;
  };

  /* ---------- Seer: the two rings, and what is cut into them ----------
     No arc-arrow, no legend, no carving read out: the Seer reports cuts and marked ends, not meanings. */
  function ringCuts(cx, cy, R, n, cuts) {
    let s = `<g stroke="#fff" fill="none" stroke-width="1.4"><circle cx="${cx}" cy="${cy}" r="${R}"/>`;
    for (let i = 0; i < n; i++) {
      const a = (i / n * 360 - 90) * Math.PI / 180, x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R;
      const cut = cuts[i + 1];
      s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="10" stroke="${cut ? VIOLET : '#fff'}" stroke-width="${cut ? 2.2 : 1.4}"/>`;
      s += `<text x="${(cx + Math.cos(a) * (R + 24)).toFixed(1)}" y="${(cy + Math.sin(a) * (R + 24) + 4).toFixed(1)}" text-anchor="middle" fill="${cut ? VIOLET : '#fff'}" font-size="10" ${F} stroke="none">${i + 1}</text>`;
      if (cut === 'scratch') s += `<path d="M${(x - 8).toFixed(1)},${(y + 1).toFixed(1)} l16,-4" stroke="${VIOLET}" stroke-width="2.4" stroke-linecap="round"/>`;
      if (cut === 'notch') s += `<path d="M${(x - 3).toFixed(1)},${(y + 3).toFixed(1)} l3,-5 l3,5" stroke="${VIOLET}" stroke-width="2" stroke-linecap="round"/>`;
      if (cut === 'chip') s += `<path d="M${(x - 4).toFixed(1)},${(y - 4).toFixed(1)} l5,2 l-1,5 l-4,-3 z" stroke="${VIOLET}" stroke-width="1.6" fill="none" stroke-linejoin="round"/>`;
    }
    return s + '</g>';
  }
  function markedStrip(cx, y, cells, end) {
    const w = cells * 18 + 26;
    let s = `<g stroke="#fff" fill="none" stroke-width="1.2"><rect x="${cx - w / 2}" y="${y}" width="${w}" height="26" rx="3"/></g>`;
    for (let i = 0; i < cells; i++) s += `<rect x="${cx - w / 2 + 13 + i * 18 - 6}" y="${y + 7}" width="12" height="12" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1"/>`;
    const mx = end === 'left' ? cx - w / 2 - 4 : cx + w / 2 + 4;
    s += `<path d="M${mx},${y + 6} l${end === 'left' ? -7 : 7},7 l${end === 'left' ? 7 : -7},7 z" fill="${VIOLET}"/>`;
    return s;
  }
  const gateMarks = `<svg viewBox="0 0 360 300"><rect width="360" height="300" fill="#000"/>
    <text x="95" y="26" text-anchor="middle" fill="#fff" font-size="10" ${F}>the first gate</text>
    <text x="265" y="26" text-anchor="middle" fill="#fff" font-size="10" ${F}>the silent gate</text>
    ${markedStrip(95, 40, 3, 'right')}
    ${markedStrip(265, 40, 5, 'left')}
    ${ringCuts(95, 165, 52, 5, { 3: 'scratch', 1: 'notch', 4: 'chip' })}
    ${ringCuts(265, 165, 52, 5, { 5: 'scratch', 2: 'notch', 3: 'chip' })}
    <text x="95" y="248" text-anchor="middle" fill="${VIOLET}" font-size="9" ${F}>scratch 3, notch 1, chip 4</text>
    <text x="265" y="248" text-anchor="middle" fill="${VIOLET}" font-size="9" ${F}>scratch 5, notch 2, chip 3</text>
    <text x="180" y="286" text-anchor="middle" fill="#fff" font-size="9" ${F} opacity=".7">where each ring is cut, and which end is marked</text>
  </svg>`;

  /* ---------- Binder: the two Laws, drawn ---------- */
  const lawClash = () => {
    const plate = (y, era, txt, struck) => `<rect x="6" y="${y}" width="288" height="34" rx="4" fill="none" stroke="${struck ? 'rgba(217,107,74,.4)' : RED}" stroke-width="1.4"/>`
      + `<text x="16" y="${y + 14}" fill="${struck ? 'rgba(217,107,74,.55)' : RED}" font-size="9" ${F}>${era}</text>`
      + `<text x="16" y="${y + 27}" fill="${struck ? 'rgba(233,226,210,.4)' : 'rgba(233,226,210,.85)'}" font-size="9" ${F}>${txt}</text>`
      + (struck ? `<path d="M10,${y + 17} L290,${y + 17}" stroke="${RED}" stroke-width="1.6"/>` : '');
    const ring = (cx, dir, label) => {
      let s = `<circle cx="${cx}" cy="150" r="30" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.2"/>`;
      s += `<circle cx="${cx}" cy="120" r="7" fill="rgba(217,107,74,.3)" stroke="${RED}" stroke-width="1.4"/>`;
      s += dir > 0
        ? `<path d="M${cx + 12},127 a30,30 0 0 1 14,26" fill="none" stroke="${RED}" stroke-width="2"/><path d="M${cx + 26},153 l-6,-5 l-2,8 z" fill="${RED}"/>`
        : `<path d="M${cx - 12},127 a30,30 0 0 0 -14,26" fill="none" stroke="${RED}" stroke-width="2"/><path d="M${cx - 26},153 l6,-5 l2,8 z" fill="${RED}"/>`;
      s += `<text x="${cx}" y="196" text-anchor="middle" fill="rgba(233,226,210,.75)" font-size="9" ${F}>${label}</text>`;

    return `<svg viewBox="0 0 300 214" width="100%" style="max-width:300px;display:block;margin:0 auto">`
      + plate(6, 'Year 0', 'carving marked at its right: the other way round', false)
      + plate(46, 'Year 212', 'every line runs the way the numbers count up', true)
      + ring(90, -1, 'carving marked at its right') + ring(215, 1, 'carving marked at its left')
      + `<text x="150" y="210" text-anchor="middle" fill="rgba(233,226,210,.55)" font-size="9" ${F}>where two Laws disagree, the older binds</text></svg>`;
  };
  const threadLine = (kind) => `<svg viewBox="0 0 90 16" style="width:70px;height:14px;vertical-align:middle">${
    kind === 'grey' ? '<path d="M4,8 C24,2 34,14 52,8 S74,4 86,8" fill="none" stroke="rgba(200,200,210,.7)" stroke-width="2.5" stroke-linecap="round"/>'
      : kind === 'red' ? '<path d="M4,8 C24,2 34,14 52,8 S74,4 86,8" fill="none" stroke="' + RED + '" stroke-width="2.5" stroke-linecap="round"/><circle cx="45" cy="9" r="3.5" fill="' + RED + '"/>'
        : kind === 'gold' ? '<path d="M4,8 C24,2 34,14 52,8 S74,4 86,8" fill="none" stroke="#d4a94e" stroke-width="2.5" stroke-linecap="round"/>'
          : '<path d="M6,2 L2,2 L2,14 L6,14 M84,2 L88,2 L88,14 L84,14" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>'
  }</svg>`;

  // The ledge over the cavern: a torch, four shadows away from it, Wren's toward it.
  const underLedge = `<svg viewBox="0 0 360 230">
    <rect width="360" height="230" fill="#000"/>
    <g stroke="#fff" fill="none" stroke-width="1.2">
      <path d="M10,150 L120,150 L140,170 L350,170"/><path d="M10,150 L10,220 M350,170 L350,220"/>
      ${[0, 1, 2, 3].map(i => `<path d="M${200 + i * 36},130 l0,-24 l6,-8 l6,8 l0,24 z"/>`).join('')}
      <text x="254" y="92" text-anchor="middle" fill="#fff" font-size="9" ${F}>four thrones</text>
      <path d="M30,120 L30,80 M22,84 L38,84"/><ellipse cx="30" cy="74" rx="6" ry="9"/>
      <text x="30" y="135" text-anchor="middle" fill="#fff" font-size="9" ${F}>torch</text>
      <path d="M0,200 C60,190 120,210 180,200 C240,190 300,210 360,200" stroke="rgba(255,255,255,.35)" stroke-dasharray="3 3"/>
      <text x="180" y="222" text-anchor="middle" fill="rgba(255,255,255,.6)" font-size="9" ${F}>the cold below throws no shadow you can see</text>
    </g>
    <g fill="#fff" opacity=".9"><circle cx="90" cy="120" r="6"/><circle cx="120" cy="105" r="6"/><circle cx="150" cy="125" r="6"/><circle cx="175" cy="108" r="6"/><circle cx="110" cy="140" r="6"/></g>
    <g stroke="#fff" stroke-width="3" opacity=".55" stroke-linecap="round"><path d="M90,120 L124,132"/><path d="M120,105 L154,113"/><path d="M150,125 L184,133"/><path d="M175,108 L208,114"/></g>
    <g stroke="${VIOLET}" stroke-width="3" opacity=".9" stroke-linecap="round"><path d="M110,140 L72,130"/></g>
    <g fill="#fff" font-size="9" ${F}><text x="82" y="112">Reader</text><text x="112" y="97">Listener</text><text x="142" y="118">Seer</text><text x="167" y="100">Binder</text><text x="100" y="158" fill="${VIOLET}">Wren</text></g>
    <text x="180" y="30" text-anchor="middle" fill="#fff" font-size="9" ${F} opacity=".7">shadows on the ledge, as they fall</text>

  /* Nine stones: three hollow (a dashed cavity), four cracked right through (the violet line), two
     neither. The two counts are the Seer's pair in the Founders' Count, and nothing is both, so one
     count cannot be got from the other. */
  const HOLLOW = [2, 5, 7], CRACK = [0, 3, 4, 8];
  const stonesSvg = `<svg viewBox="0 0 360 250">
    <rect width="360" height="250" fill="#000"/>
    ${[0, 1, 2, 3, 4, 5, 6, 7, 8].map(i => { const x = 60 + (i % 3) * 120, y = 50 + Math.floor(i / 3) * 75; const hollow = HOLLOW.indexOf(i) >= 0, crack = CRACK.indexOf(i) >= 0; const rx = 44 + (i % 2) * 6, ry = 26 + (i % 3) * 3;
      return `<g transform="translate(${x},${y})"><path d="M${-rx},0 C${-rx},-${ry} ${-rx * 0.4},-${ry + 6} 0,-${ry} C${rx * 0.5},-${ry + 4} ${rx},-${ry * 0.6} ${rx},0 C${rx},${ry} ${rx * 0.3},${ry + 4} 0,${ry} C${-rx * 0.6},${ry + 2} ${-rx},${ry * 0.5} ${-rx},0 Z" fill="none" stroke="#fff" stroke-width="1.4"/>${hollow ? `<path d="M${-rx * 0.55},2 C${-rx * 0.5},-${ry * 0.5} ${-rx * 0.1},-${ry * 0.6} ${rx * 0.2},-${ry * 0.35} C${rx * 0.55},-${ry * 0.1} ${rx * 0.5},${ry * 0.5} ${rx * 0.1},${ry * 0.55} C${-rx * 0.3},${ry * 0.6} ${-rx * 0.55},${ry * 0.3} ${-rx * 0.55},2 Z" fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="3 2" opacity=".8"/>` : crack ? `<path d="M${-rx * 0.75},${-ry * 0.35} l${rx * 0.35},${ry * 0.55} l${-rx * 0.12},${ry * 0.3} l${rx * 0.55},${ry * 0.2}" fill="none" stroke="${VIOLET}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : `${[0, 1, 2].map(k => `<path d="M${-rx * 0.6 + k * 12},${-ry * 0.5 + k * 8} l${rx * 0.9},${ry * 0.15}" stroke="#fff" stroke-width=".8" opacity=".35"/>`).join('')}`}<text y="${ry + 14}" text-anchor="middle" fill="#fff" font-size="9" ${F} opacity=".6">${i + 1}</text></g>`; }).join('')}
    <text x="180" y="244" text-anchor="middle" fill="${VIOLET}" font-size="10" ${F}>a cavity is dashed · a crack goes right through</text>

  /* ---------- Reader: nine worn glyphs, three read EMBER ---------- */
  const NINE = [['Crown', true], ['Crown', false], ['Flame', false], ['Crown', true], ['Hook', false], ['Spike', true], ['Crown', false], ['Flame', true], ['Crown', true]];
  const nineSvg = `<svg viewBox="0 0 330 260" width="100%" style="max-width:330px;display:block;margin:0 auto">
    <rect x="2" y="2" width="326" height="256" rx="6" fill="rgba(0,0,0,0.35)" stroke="rgba(212,169,78,0.25)"/>
    ${NINE.map(([sh, inv], i) => { const x = 55 + (i % 3) * 110, y = 48 + Math.floor(i / 3) * 84; return `<g transform="translate(${x},${y}) scale(1.3)" style="color:#e9e2d2" opacity="${0.55 + (i % 4) * 0.08}">${G.shapeInner(sh, inv)}</g><path d="M${x - 22 + (i * 7) % 15},${y - 16 + (i * 11) % 30} l${18 + (i * 5) % 20},${(i % 3) * 6 - 4}" stroke="rgba(11,10,16,0.9)" stroke-width="${2 + i % 3}"/><text x="${x}" y="${y + 36}" text-anchor="middle" font-size="9" fill="rgba(233,226,210,0.45)" ${F}>${i + 1}</text>`; }).join('')}
  </svg>`;

  /* ---------- Binder: five oaths, their locks named ---------- */
  /* Four bind (a lock of KNOT or EMBER), three were sworn before the Law changed in Year 212 — the
     Binder's pair. The two sets are not each other's opposite: the Keeper and the Chair bind and are
     late, the Veil is early and does not bind. */
  const OATHS = [
    { name: 'the Gate', line: ['THORN', 'ASH'], lock: 'KNOT', year: 0 },
    { name: 'the Keeper', line: ['WELL', 'EMBER'], lock: 'EMBER', year: 212 },
    { name: 'the Veil', line: ['ASH', 'THORN'], lock: 'VEIL', year: 0 },
    { name: 'the Well', line: ['WELL', 'ASH'], lock: 'KNOT', year: 0 },
    { name: 'the Chair', line: ['CROWN', 'THORN'], lock: 'EMBER', year: 212 },
  ];
  const gl = (n, c) => G.svg(n, { size: 26, color: c || GOLD });
  const oathsHtml = `<table class="blk-table"><tr><th>oath</th><th>line</th><th>lock</th><th>sworn</th></tr>${OATHS.map(o => `<tr><td>${o.name}</td><td>${o.line.map(n => gl(n, RED)).join(' ')}</td><td>${gl(o.lock, RED)} <b>${o.lock}</b></td><td>Year ${o.year}</td></tr>`).join('')}</table>`;

  /* ---------- the Founders' Count task ----------
     Mere's ward asks each seat twice, and the Hearth takes eight digits as one number, in seat order:
       Reader   3 2   of nine worn shapes, three read EMBER and two read CROWN
       Listener 5 7   the lower bell of the peal strikes 5 times, the higher 7
       Seer     3 4   of nine stones, three are hollow and four are cracked
       Binder   4 3   of five oaths, four bind and three were sworn before Year 212
     One digit a seat was the defect, not the digits. A table missing one phone had ten candidates
     for the missing digit against a ward that hears three answers, and with 3,5,3,4 the missing digit
     sat inside the span of the three still on the table for three seats out of four. Two digits a
     seat makes that 100 candidates against three answers, and the two counts on a page are counts of
     different things, so neither gives the other. The reasoning, the field sizes and the receipt are
     in js/content/ch5.js above PAIRS. */
  const MATERIAL = {
    reader: { q: 'Nine worn shapes on the newel, all standing as they were cut. **How many read EMBER? And how many read CROWN?**', html: nineSvg },
    listener: { q: 'A peal of two bells, one higher, one lower. **How many times does the *lower* bell strike? And the higher?** Play it as often as you need.', html: null },
    seer: { q: 'Nine stones in the under-layer of the landing. **How many are hollow? And how many are cracked right through?**', html: `<div class="blk-svg underlayer">${stonesSvg}</div>` },
    binder: { q: 'Five oaths carved on the newel. An oath binds only if its lock — the last glyph — is KNOT or EMBER. **How many bind? And how many were sworn before Year 212?**', html: oathsHtml },
  };
  const PEAL = 'HLHLHHLHLHHL'; // lower bell strikes 5 times, the higher 7
  function playPeal(Audio) { Audio.init(); if (Audio.isMuted()) Audio.setMuted(false); PEAL.split('').forEach((c, i) => CA.later(() => Audio.note(c === 'H' ? 79 : 64, 0.9, c === 'H' ? 0.14 : 0.2), i * 480)); return PEAL.length * 480 + 600; }

  function countTask(roleId) {
    return { t: 'task', id: 'count', title: 'The Founders\' Count — 45 seconds', replayable: true, run: (box, api) => {
      const key = 'ch5:count'; const raw = api.state.done[key];
      const prev = (raw == null || !/^\d\d$/.test(String(raw))) ? null : String(raw);
      let ctl = null;
      const mat = MATERIAL[roleId];
      const said = 'Say them aloud when the Hearth asks — in seat order, the Reader first. Never show the phone.';
      const idle = () => {
        UI.clear(box);
        if (prev != null) { box.appendChild(UI.el('div', { class: 'big-digit', text: prev[0] + ' ' + prev[1] })); box.appendChild(UI.el('p', { class: 'fine', text: 'Your two digits. ' + said })); }
        else box.appendChild(UI.el('p', { class: 'fine', text: 'The Hearth will count 3, 2, 1, START. On START, press Start. You have forty-five seconds to find two digits.' }));
        box.appendChild(UI.el('button', { class: 'btn primary big-btn', text: prev != null ? 'Count again' : 'Start', onclick: start }));
      };
      const start = () => {
        UI.stopAudio(); // Start is a press like any other: drop a peal still sounding from the last attempt
        if (ctl) { ctl.cancel(); ctl = null; }
        UI.clear(box); api.audio.init(); if (api.audio.unlockMedia) api.audio.unlockMedia();
        box.appendChild(UI.el('p', { html: UI.rich(mat.q) }));
        if (mat.html) box.appendChild(UI.el('div', { html: mat.html }));
        if (roleId === 'listener') { box.appendChild(UI.audioButton('Cup your ear — the peal', () => playPeal(api.audio))); const rv = UI.el('div', {}); box.appendChild(rv); rv.appendChild(UI.el('button', { class: 'btn small ghost', text: 'I cannot hear it — show the peal', onclick: () => { rv.innerHTML = `<div class="arrow-strip">${PEAL.split('').map(c => `<span class="step"><b>${c === 'H' ? '▲' : '▼'}</b>${c === 'H' ? 'high' : 'low'}</span>`).join('')}</div>`; } })); playPeal(api.audio); }
        const cd = UI.el('div', { class: 'cd', text: '45' }); box.appendChild(cd);
        ctl = UI.countdown(box, 45, (s) => { cd.textContent = s; });
        ctl.promise.then(() => { cd.textContent = 'TIME — pick your two digits'; });
        const cap = UI.el('p', { class: 'fine', text: 'Your first digit:' });
        box.appendChild(cap);
        const got = [];
        const grid = UI.el('div', { class: 'pick-grid', style: { gridTemplateColumns: 'repeat(5, 1fr)' } });
        for (let d = 0; d <= 9; d++) grid.appendChild(UI.el('div', { class: 'pk', text: String(d), onclick: () => {
          got.push(d); api.audio.sfx('seal');
          if (got.length < 2) { cap.textContent = 'First digit ' + d + '. Now your second:'; return; }
          ctl.cancel(); const pair = got.join(''); api.state.done[key] = pair; api.save(); render(pair);
        } }));
        box.appendChild(grid);
      };
      const render = (pair) => { UI.clear(box); box.appendChild(UI.el('div', { class: 'big-digit', text: pair[0] + ' ' + pair[1] })); box.appendChild(UI.el('p', { class: 'fine', text: 'Sealed. ' + said })); box.appendChild(UI.el('button', { class: 'btn small ghost', text: 'Count again', onclick: start })); };
      idle();
    } };
  }

  /* ---------- The Thread (after YES): a hold-button; fraying is counted on this phone only ---------- */
  const threadBlock = { t: 'custom', render: (el, ctx) => {
    // Appears once this phone has answered YES (the page is not re-rendered by the choice, so poll briefly).
    if (ctx.answer('ch5', 'hold') !== 'YES') { const iv = setInterval(() => { if (!el.isConnected) { clearInterval(iv); return; } if (ctx.answer('ch5', 'hold') === 'YES') { clearInterval(iv); threadBlock.render(el, ctx); } }, 500); return; }
    const key = 'ch5:thread'; const st = ctx.state.done[key] || { fray: 0, held: 0 }; ctx.state.done[key] = st;
    el.appendChild(UI.el('div', { class: 'blk-divider' }));
    el.appendChild(UI.el('h3', { text: 'The Thread' }));
    el.appendChild(UI.el('p', { html: UI.rich('If the Hearth named **you**: your Sight is spent, and this is your page. Keep a finger on the thread until the Hearth says it is tied off. If it named someone else, put this down.') }));
    const line = UI.el('div', { class: 'thread-line' }); line.style.opacity = '.35';
    const btn = UI.el('button', { class: 'btn thread-hold', text: 'HOLD THE THREAD' });
    const stat = UI.el('p', { class: 'fine', text: 'Not held.' });
    let holding = false, since = 0, everHeld = !!st.held;
    const down = (e) => { e.preventDefault(); if (holding) return; holding = true; since = Date.now(); everHeld = true; line.style.opacity = '1'; btn.textContent = 'HOLDING'; stat.textContent = 'Held. Do not let go.'; try { ctx.audio.init(); ctx.audio.sfx('seal'); } catch (x) {} };
    const up = () => { if (!holding) return; holding = false; st.held += Math.round((Date.now() - since) / 1000); st.fray += 1; ctx.save(); line.style.opacity = '.35'; btn.textContent = 'HOLD THE THREAD'; stat.textContent = 'The thread frays a little. Take it up again.'; try { ctx.audio.sfx('miss'); } catch (x) {} };
    btn.addEventListener('pointerdown', down); btn.addEventListener('pointerup', up); btn.addEventListener('pointerleave', up); btn.addEventListener('pointercancel', up);
    el.appendChild(line); el.appendChild(btn); el.appendChild(stat);
    el.appendChild(UI.el('p', { class: 'fine', text: 'The Hearth cannot see this page. Only you will know how well it was held.' }));
    void everHeld;
  } };

  /* ---------- pages ---------- */
  C.chapters.push({
    id: 'ch5',
    pages: (roleId, ctx) => {
      const P = { sight: [], wren: [], speak: [] };
      const f = ctx.flags || {}; const law0 = !!f.LAW0; const cracked = f.EMBER_LOST ? CRACKED : -1;

      /* ===== READER ===== */
      if (roleId === 'reader') {
        P.sight.push({ t: 'h', text: 'What is cut on Mere’s two gates' });
        P.sight.push({ t: 'p', text: 'The Hearth shows both carvings worn to nothing. On your page they are clean.' });
        P.sight.push({ t: 'p', text: '**A shape says one word standing as it was cut, and the opposite word the other way up.** A carving marked at its left-hand end says the words as they stand. Marked at its right, every shape says its other word.' });
        P.sight.push({ t: 'html', html: readerLintels() });
        P.sight.push({ t: 'fine', text: 'Your **Book** reads a right-marked line right to left. The words do not change when you do that.' });
        P.sight.push({ t: 'fine', text: 'A spare shape in the ring is not decoration. It is a different sigil, and the gate can tell.' });
        P.sight.push({ t: 'fine', text: 'Which end each carving is marked at is not on this page, and neither is where the words go. Say both words for every shape, in the order they are cut.' });
        P.wren.push({ t: 'h', text: 'On the ledge' });
        P.wren.push({ t: 'p', text: 'Wren stands beside you looking at the four thrones. "You went quiet in the study. You read something with my name in it." A pause. "You don’t have to say."' });
        P.wren.push({ t: 'p', text: f.WREN_HURT
          ? 'Wren has not mentioned the strapped arm since the Vault, and has laughed twice on the stair, both times wrongly.'
          : 'The Vigil roll in your Book still spells her name *Wrenn*, in the old letters. You decided, a year ago, that it was a spelling mistake. You have never asked her.' });
      }

      /* ===== LISTENER ===== */
      if (roleId === 'listener') {
        P.sight.push({ t: 'h', text: 'Eight bells, and what they count' });
        P.sight.push({ t: 'p', text: 'A bell hangs over every shape on both lintels. The Hearth cannot hear them. You can.' });
        P.sight.push({ t: 'p', text: '**A bell’s count says which slot its word takes.** Count round the ring from wherever a sigil begins, and that slot is one.' });
        P.sight.push({ t: 'audio', label: 'The first gate — three bells', strip: tallyRow(COUNTS1, -1), button: '♪ Cup your ear',
          play: (A) => playCounts(A, COUNTS1, -1), text: '**Three, one, five**, over the shapes in the order they are cut.' });
        P.sight.push({ t: 'audio', label: 'The silent gate — five bells', strip: tallyRow(COUNTS2, cracked), button: '♪ Cup your ear',
          play: (A) => playCounts(A, COUNTS2, cracked), text: cracked >= 0
            ? 'The second bell is **cracked** and gives nothing. The five counts are one each of 1 to 5. The missing one is whichever the other four do not say.'
            : '**Two, five, one, three, four**, over the shapes in the order they are cut.' });
        P.sight.push({ t: 'fine', text: 'A bell belongs to the shape it hangs over. It does not move when a carving is read backwards.' });
        P.sight.push({ t: 'fine', text: 'A count heard short puts every shape one place out, and the ring frosts.' });
        P.sight.push({ t: 'fine', text: 'You never hear a word, only how far. The words are the Reader’s, and where a sigil begins is the Binder’s.' });
        P.wren.push({ t: 'h', text: 'What the stair sounds like' });
        P.wren.push({ t: 'html', html: `<div class="heartbeats">${[['Provost Marrow', 'normal'], ['the soldiers, above', 'fast'], ['Wren', 'flat']].map(([n, k]) => `<div class="hb"><span>${n}</span>${D.trace(k)}</div>`).join('')}</div>` });
        P.wren.push({ t: 'p', text: 'Boots above, in step. Water below, moving slowly. And beside you, where Wren is standing, the thing you have called a fault in your gift for four years: nothing. Not quiet. *Nothing.*' });
        P.wren.push({ t: 'p', text: 'In the Gallery the portraits showed four going down the stair and four coming back. You have not stopped hearing it.' });
      }

      /* ===== SEER ===== */
      if (roleId === 'seer') {
        P.sight.push({ t: 'h', text: 'Under the two gates' });
        P.sight.push({ t: 'p', text: '**The first gate’s carving is marked at its right-hand end.** Its ring carries three cuts: a long scratch at **slot 3**, a notch at **slot 1**, a chip in the glaze at **slot 4**.' });
        P.sight.push({ t: 'p', text: '**The second gate’s carving is marked at its left-hand end.** Three cuts again: a scratch at **slot 5**, a notch at **slot 2**, a chip at **slot 3**.' });
        P.sight.push({ t: 'svg', cls: 'underlayer', svg: gateMarks });
        P.sight.push({ t: 'fine', text: 'Counted from anywhere else on the ring, the right words in the right order still fail.' });
        P.sight.push({ t: 'fine', text: 'Somebody meant those cuts. Which one a sigil begins at, and what a marked end obliges, are not yours. Say what is cut, and where.' });
        P.wren.push({ t: 'h', text: 'The shadow, again' });
        P.wren.push({ t: 'svg', cls: 'underlayer', svg: underLedge });
        P.wren.push({ t: 'p', text: 'One torch on the ledge. Four shadows falling away from it, the way shadows do, and Wren’s falling toward it. In the dormitory you blamed the lamp. There is no lamp here.' });
      }

      /* ===== BINDER ===== */
      if (roleId === 'binder') {
        P.sight.push({ t: 'h', text: 'Which cut, and which way round' });
        P.sight.push({ t: 'p', text: 'Above ground a sigil begins at a scratch. Everyone at this table has heard you say so twice tonight.' });
        P.sight.push({ t: 'p', text: '**These two doors are older than that Law, and they do not keep it.** On the first gate the sigil begins at the **chip**. On the second it begins at the **notch**. A scratch on a Founders’ door is only where the mason rested the tool.' });
        P.sight.push({ t: 'p', text: 'Two Laws disagree about which way a carving runs round the ring. The newer says every one runs the way the numbers count up. The older says a carving marked at its right-hand end runs the other way. **The older binds.**' });
        P.sight.push({ t: 'html', html: lawClash() });
        P.sight.push({ t: 'p', text: law0
          ? '**Where a carving shows COLD, the older Law writes it into its slot — and the older Law is back in your Book. Say so: the slot is not left empty.**'
          : '**Where a carving shows COLD, the newer Law leaves that slot empty. Say so: nothing goes in it.**' });
        P.sight.push({ t: 'fine', text: 'Two frosts and a gate stops answering, and the Provost must break it. Say your rule before the Warden closes the ring — and say it even when it sounds wrong.' });
        P.sight.push({ t: 'fine', text: 'Both Laws are dated in your **Book**. You cannot read a shape and you cannot find a cut. Ask for both.' });
        P.wren.push({ t: 'h', text: 'Still no thread' });
        P.wren.push({ t: 'list', items: [
          threadLine('grey') + ' <strong>Provost Marrow to Wren:</strong> grey, and it has not changed since the study.',
          threadLine((f.OATH | 0) === 0 ? 'none' : 'red') + ' <strong>The four of you to the Chair:</strong> ' + ((f.OATH | 0) === 0 ? 'nothing. You did not swear.' : 'red, and knotted.'),
          threadLine('gold') + ' <strong>The soldiers above:</strong> gold, every one of them, and none of it theirs.',
          threadLine('none') + ' <strong>Wren:</strong> nothing at all.',
        ] });
        P.wren.push({ t: 'p', text: 'Not unbound — you know unbound. You decided years ago it was a blind spot in your own gift. You have never told anyone your gift has one.' });
      }

      /* ===== SPEAK (all roles) ===== */
      P.speak.push({ t: 'fine', text: '*' + L.houseRule + '*' });
      P.speak.push(countTask(roleId));
      P.speak.push({ t: 'divider' });
      if (roleId === 'binder') P.speak.push({ t: 'reveal', label: 'If the table chooses to collapse the stair', blocks: [{ t: 'fine', text: 'The newer Law says never. The older says four hands. You are about to write it with one. Say so before the Warden writes it.' }] });
      P.speak.push({ t: 'choice', id: 'hold', prompt: '**One of you stays on the stair and holds the thread while the others go on.** That Sight is spent until the Provost ties it off. The first yes the Hearth reads, in seat order, stays. *Stay and hold?*', options: [{ id: 'YES', text: 'Yes — I stay and hold.' }, { id: 'NO', text: 'No — I go on.' }],
        after: (opt) => opt === 'YES' ? 'Type it into the Hearth when it asks. If the Hearth names you, come back to this page.' : 'Type it into the Hearth when it asks. Nobody will know what it said.' });
      P.speak.push(threadBlock);
      return P;
    },
  });
})();

</script>
<script>/* js/content/companion/ch6.js */
/* Companion — Chapter VI, the bell-chamber (WELL · cast: VOLUNTEER, PRECRACKED).
   The stone, one fact each and no page holding another's: the Reader has what the four burnt cuts were,
   the Seer which way each of them was struck, the Listener where the lap ends, the Binder the older Law
   and its three clauses. The bells live on Speak: the Listener has the count and calls every number, and
   the Reader, the Seer and the Binder each have six numbers that are bells of theirs and nobody else's.
   No bell in the dark pattern is shared, so no page can be covered by pooling the other two. */
(function () {
  'use strict';
  const G = window.VigilGlyphs, L = window.VigilLore, CA = window.CompanionAudio, D = window.CompanionDraw, UI = window.VigilUI;
  const C = window.CompanionContent;
  const F = 'font-family="Cinzel,serif"';
  const COL = { reader: '#f2d27a', listener: '#4fb3bf', seer: '#a482e6', binder: '#d96b4a' };

  /* ---------- the dark pattern ----------
     One token per beat, 1 to 32. A COPY of ROUND3 in js/content/ch6.js — the Hearth rings it, this page
     reads it. Keep the two identical. 'x' is the Cold, '.' a silent beat. */
  const ROUND3 = '. R S B . xRSB S R B . xRSB B R . S B xRSB R . S B xRSB . xRSB S R . B S xRSB . R';
  const BEATS = ROUND3.trim().split(/\s+/);
  /* EVERY sounding beat is numbered, 1 to 24 — bells and Cold alike — and the Listener calls all of
     them. Nothing on this page says which is which. Every bell belongs to exactly one lane, so a page
     is the only thing that can ring it: pressing on every call rings the Cold and fails, and so does
     pressing on every number somebody else claimed. (The enumeration is above ROUND3 in ch6.js.) */
  const SOUND = [];                                    // { n, beat, tok, cold }
  BEATS.forEach((t, i) => { if (t !== '.') SOUND.push({ n: SOUND.length + 1, beat: i + 1, tok: t, cold: t[0] === 'x' }); });
  const CALL = {};                                     // beat -> the number to call on it (one beat early)
  SOUND.forEach(b => { CALL[b.beat - 1] = b.n; });
  const LETTER = { reader: 'R', seer: 'S', binder: 'B' };
  const mine = (roleId) => SOUND.filter(b => !b.cold && b.tok.indexOf(LETTER[roleId]) >= 0).map(b => b.n);

  /* The Listener's score: thirty-two beats, and the number to say on each. Nobody else has it. */
  const callComb = () => {
    const cw = 42, rows = 4, per = 8;
    let s = `<svg viewBox="0 0 ${per * cw + 16} ${rows * 46 + 22}" style="width:100%">`;
    for (let i = 0; i < 32; i++) {
      const r = Math.floor(i / per), c = i % per, x = 8 + c * cw, y = 6 + r * 46, b = i + 1, n = CALL[b];
      s += `<rect x="${x}" y="${y}" width="${cw - 6}" height="36" rx="4" fill="${n ? 'rgba(79,179,191,.22)' : 'none'}" stroke="${n ? '#4fb3bf' : 'rgba(255,255,255,.18)'}" stroke-width="1.2"/>`;
      s += `<text x="${x + 3}" y="${y + 11}" fill="rgba(255,255,255,.45)" font-size="8" ${F}>${b}</text>`;
      if (n) s += `<text x="${x + (cw - 6) / 2}" y="${y + 29}" text-anchor="middle" fill="#4fb3bf" font-size="17" ${F}>${n}</text>`;
    }
    s += `<text x="${(per * cw) / 2}" y="${rows * 46 + 18}" text-anchor="middle" fill="rgba(255,255,255,.6)" font-size="9" ${F}>the beats, and the number to say on each</text>`;
    return s + '</svg>';
  };
  /* One player's bells, drawn: all twenty-four numbers, and the six that are yours. The other
     eighteen are somebody else's bell or the Cold, and this page never says which. */
  const myBells = (roleId) => {
    const ms = mine(roleId), col = COL[roleId], cw = 42, n = SOUND.length;
    let s = `<svg viewBox="0 0 ${8 * cw + 16} 154" style="width:100%">`;
    for (let i = 1; i <= n; i++) {
      const r = Math.floor((i - 1) / 8), c = (i - 1) % 8, x = 8 + c * cw, y = 6 + r * 46, on = ms.indexOf(i) >= 0;
      s += `<rect x="${x}" y="${y}" width="${cw - 6}" height="36" rx="4" fill="${on ? col : 'none'}" fill-opacity="${on ? .85 : 0}" stroke="${on ? col : 'rgba(255,255,255,.18)'}" stroke-width="1.2"/>`;
      s += `<text x="${x + (cw - 6) / 2}" y="${y + 25}" text-anchor="middle" fill="${on ? '#12101a' : 'rgba(255,255,255,.3)'}" font-size="16" ${F}>${i}</text>`;
    }
    s += `<text x="${(8 * cw) / 2}" y="150" text-anchor="middle" fill="rgba(255,255,255,.6)" font-size="9" ${F}>your bells, of the twenty-four numbers</text>`;
    return s + '</svg>';
  };

  /* ---------- the stone ----------
     Cuts 1, 3, 5 and 7 are the four the fire took, and cut numbers are the only coordinates on any
     page — the Hearth's board, the art and all four Sight pages use the same 1 to 8. */
  /* These three are pure functions of ch6.js's STONE and BURNT, computed with a pencil, because the
     Companion is a separate page and cannot see the Hearth's chapter file. Nothing in the app checks
     them against it, so `node tools/scripts/ch6-stone-check.js` does: it loads both files under a VM
     stub and asserts BURNT_CUTS === BURNT+1, BURN_SHAPES === the burnt cuts' shapes, BURN_UP ===
     their orientations, and that the Reader's and the Seer's sentences below say the same thing the
     arrays do. Change either file and run it. */
  const BURNT_CUTS = [1, 3, 5, 7];
  const BURN_SHAPES = ['Flame', 'Crown', 'Spike', 'Crown'];   // Reader: WHAT was cut
  const BURN_UP = [true, true, true, false];                  // Seer: which way the chisel went in

  /* The Reader's four burns, drawn on their side, so the page can say what was cut and cannot say which
     way up it stood — that half is the Seer's, and the geometry is what keeps it there. (ch0's collar.) */
  const burnCuts = () => `<svg viewBox="0 0 320 108" style="width:100%;max-width:320px">
    ${BURN_SHAPES.map((sh, i) => { const x = 40 + i * 80; return `<g><rect x="${x - 32}" y="10" width="64" height="64" rx="6" fill="rgba(0,0,0,.35)" stroke="rgba(242,210,122,.35)"/><g transform="translate(${x},42) rotate(90) scale(1.25)" style="color:#f2d27a">${G.SHAPES[sh]}</g><text x="${x}" y="90" text-anchor="middle" fill="rgba(242,210,122,.8)" font-size="11" ${F}>cut ${BURNT_CUTS[i]}</text></g>`; }).join('')}
    <text x="160" y="104" text-anchor="middle" fill="rgba(255,255,255,.55)" font-size="9" ${F}>laid on their side · what was cut, not which way up</text>
  </svg>`;

  /* The Listener's fact, drawn as a lap: eight notes round a ring, and the one it stops on is a
     silence. No cut number anywhere on it — WHICH cut that is comes from the other three pages, and
     this page may not know. The geometry is the separation. */
  const restFig = () => `<svg viewBox="0 0 300 132" style="width:100%;max-width:300px">
    <circle cx="150" cy="62" r="44" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1.5"/>
    ${[0,1,2,3,4,5,6].map(i => { const a = (-90 + (i + 1) * 45) * Math.PI / 180; return `<circle cx="${(150 + Math.cos(a) * 44).toFixed(1)}" cy="${(62 + Math.sin(a) * 44).toFixed(1)}" r="7" fill="#4fb3bf"/>`; }).join('')}
    <circle cx="150" cy="18" r="7" fill="none" stroke="#4fb3bf" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M120,104 A44,44 0 0 0 174,100" fill="none" stroke="#4fb3bf" stroke-width="1.4" opacity=".7"/>
    <text x="150" y="10" text-anchor="middle" fill="#4fb3bf" font-size="10" ${F}>silence</text>
    <text x="150" y="126" text-anchor="middle" fill="rgba(255,255,255,.6)" font-size="9" ${F}>one lap of eight, and it stops on the silence</text>
  </svg>`;

  /* Under the foot: eight recesses, four of them scorched, and which way each chisel went in.
     No shape and no rule — the Seer reports how a cut was struck, never what it says. */
  const underFoot6 = (() => {
    let s = `<svg viewBox="0 0 360 200"><rect width="360" height="200" fill="#000"/>`;
    s += `<text x="180" y="18" text-anchor="middle" fill="#fff" font-size="10" ${F} opacity=".8">the foot of the stone, from below · cuts 1 to 8</text>`;
    let burn = 0;
    for (let i = 0; i < 8; i++) {
      const x = 26 + i * 42, isBurn = i % 2 === 0;
      s += `<rect x="${x}" y="34" width="34" height="52" rx="3" fill="none" stroke="#fff" stroke-width="1.1" opacity="${isBurn ? .5 : .85}"/>`;
      s += `<text x="${x + 17}" y="100" text-anchor="middle" fill="${isBurn ? '#a482e6' : 'rgba(255,255,255,.45)'}" font-size="9" ${F}>${i + 1}</text>`;
      if (isBurn) {
        burn++;
        const up = BURN_UP[burn - 1];
        s += `<g stroke="#a482e6" stroke-width="2.4" fill="none" stroke-linecap="round" transform="translate(${x + 17},60)">`
          + (up ? `<path d="M-9,6 L0,-7 L9,6"/>` : `<path d="M-9,-6 L0,7 L9,-6"/>`) + `</g>`;
      }
    }
    s += `<g stroke="#fff" fill="none" stroke-width="1.4" transform="translate(180,140) scale(0.9)"><path d="M0,-16 C6,-8 10,-2 10,4 C10,11 5,15 0,15 C-5,15 -10,11 -10,4 C-10,-2 -6,-8 0,-16 Z" opacity=".7"/><path d="M-70,16 L70,16" opacity=".4"/></g>`;
    s += `<text x="180" y="190" text-anchor="middle" fill="#fff" font-size="9" ${F} opacity=".7">the fire, lower than it has ever been</text>`;
    return s + '</svg>';
  })();

  /* Two lines in one hand, two hundred years apart, and which way the arrow runs. */
  const olderBinds = () => `<svg viewBox="0 0 300 108" style="width:100%;max-width:300px">
    <text x="16" y="26" fill="rgba(255,255,255,.55)" font-size="10" ${F}>YEAR 0</text>
    <line x1="80" y1="22" x2="270" y2="22" stroke="#d96b4a" stroke-width="3"/>
    <text x="16" y="66" fill="rgba(255,255,255,.55)" font-size="10" ${F}>YEAR 212</text>
    <line x1="80" y1="62" x2="270" y2="62" stroke="#d96b4a" stroke-width="3" opacity=".55"/>
    <line x1="74" y1="62" x2="276" y2="62" stroke="#fff" stroke-width="1.4"/>
    <path d="M276,56 C292,48 292,32 278,24" fill="none" stroke="#d96b4a" stroke-width="2"/>
    <path d="M278,24 l9,3 l-3,-9 z" fill="#d96b4a"/>
    <text x="150" y="98" text-anchor="middle" fill="rgba(255,255,255,.6)" font-size="9" ${F}>same ink, same hand · the older one binds</text>
  </svg>`;

  /* Wren, under the chamber: five shadows away from the shaft, one toward it. The bells are unnamed. */
  const underChamber = `<svg viewBox="0 0 360 250">
    <rect width="360" height="250" fill="#000"/>
    <g stroke="#fff" fill="none" stroke-width="1.2">
      <rect x="10" y="10" width="340" height="230"/>
      <circle cx="180" cy="34" r="14"/><path d="M180,12 L180,4 M162,20 L156,14 M198,20 L204,14 M160,34 L152,34 M200,34 L208,34"/>
      <line x1="40" y1="78" x2="320" y2="78" stroke-width="2"/>
      ${[70, 143, 217, 290].map((x) => `<path d="M${x - 14},112 L${x - 14},92 Q${x - 14},80 ${x},80 Q${x + 14},80 ${x + 14},92 L${x + 14},112 Z"/><line x1="${x}" y1="78" x2="${x}" y2="80"/>`).join('')}
      <circle cx="180" cy="178" r="56" stroke-dasharray="4 3"/><circle cx="180" cy="178" r="8"/>
    </g>
    <g fill="#fff" opacity=".9"><circle cx="180" cy="160" r="5"/><circle cx="112" cy="196" r="6"/><circle cx="148" cy="212" r="6"/><circle cx="212" cy="212" r="6"/><circle cx="248" cy="196" r="6"/><circle cx="180" cy="215" r="6"/></g>
    <g stroke="#fff" stroke-width="3" opacity=".55" stroke-linecap="round"><path d="M112,196 L98,224"/><path d="M148,212 L140,238"/><path d="M212,212 L220,238"/><path d="M248,196 L262,224"/><path d="M180,160 L180,180" opacity=".6"/></g>
    <g stroke="#a482e6" stroke-width="3" opacity=".9" stroke-linecap="round"><path d="M180,215 L180,190"/></g>
    <g fill="#fff" font-size="8" ${F}><text x="180" y="58" text-anchor="middle">the Hearth — up the shaft</text><text x="180" y="245" text-anchor="middle" opacity=".7">shadows, as they fall</text><text x="190" y="228" fill="#a482e6">Wren</text></g>
  </svg>`;

  const threadLine = (kind) => `<svg viewBox="0 0 90 16" style="width:74px;height:14px;vertical-align:middle">${
    kind === 'whole' ? '<path d="M4,8 C24,2 34,14 52,8 S74,4 86,8" fill="none" stroke="#d96b4a" stroke-width="2.5" stroke-linecap="round"/>'
    : kind === 'grey' ? '<path d="M4,8 C24,2 34,14 52,8 S74,4 86,8" fill="none" stroke="rgba(200,200,210,.7)" stroke-width="2.5" stroke-linecap="round"/>'
    : '<path d="M6,2 L2,2 L2,14 L6,14 M84,2 L88,2 L88,14 L84,14" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>'
  }</svg>`;

  /* ---------- the volunteer's thread (Chapter V's spent Sight), on the Speak tab ---------- */
  const threadBlock = () => ({ t: 'custom', render: (el, cx) => {
    const st = cx.state; st.thread = st.thread || { letGo: 0, held: 0 }; cx.save();
    el.appendChild(UI.el('div', { class: 'blk-svg underlayer', html: `<svg viewBox="0 0 360 80"><rect width="360" height="80" fill="#000"/><path id="ch6-thread" d="M10,40 C80,30 120,50 180,40 S280,30 350,40" fill="none" stroke="#fff" stroke-width="2"/><g id="ch6-fray" stroke="#fff" stroke-width="1" opacity=".5"><path d="M150,40 l-8,-10"/><path d="M200,42 l6,-9"/><path d="M260,36 l-5,-9"/></g><text x="180" y="70" text-anchor="middle" fill="#fff" font-size="10" font-family="Cinzel,serif" id="ch6-thread-txt">the thread — fraying</text></svg>` }));
    const thread = el.querySelector('#ch6-thread'), fray = el.querySelector('#ch6-fray'), txt = el.querySelector('#ch6-thread-txt');
    let holding = false, t0 = 0;
    const btn = UI.el('button', { class: 'btn primary hold-btn', style: { width: '100%', marginTop: '8px' }, text: 'HOLD — keep a finger on it' });
    const down = (e) => { e.preventDefault(); if (holding) return; holding = true; t0 = Date.now(); thread.setAttribute('stroke-width', '3'); fray.style.opacity = '0'; txt.textContent = 'held'; btn.textContent = 'holding…'; };
    const up = () => { if (!holding) return; holding = false; st.thread.held += Date.now() - t0; st.thread.letGo += 1; cx.save(); thread.setAttribute('stroke-width', '2'); fray.style.opacity = '.5'; txt.textContent = 'the thread — fraying'; btn.textContent = 'HOLD — keep a finger on it'; };
    btn.addEventListener('pointerdown', down); btn.addEventListener('pointerup', up); btn.addEventListener('pointerleave', up); btn.addEventListener('pointercancel', up);
    el.appendChild(btn);
    el.appendChild(UI.el('p', { class: 'fine', text: 'Nothing on the Hearth shows whether you let go. This page remembers, and will tell you — only you — at the end.' }));
  } });

  const COST = 'Four readings, no more. A wrong one cracks a bell above you, and a cracked bell is one you do not have later.';

  C.chapters.push({
    id: 'ch6',
    pages: (roleId, ctx) => {
      const P = { sight: [], wren: [], speak: [] };
      const vol = ctx.flags.VOLUNTEER | 0; const volRole = vol >= 1 && vol <= 4 ? L.roles[vol - 1] : null; const isVol = !!(volRole && volRole.id === roleId);
      const laundry = ctx.answer('ch3', 'whisper');
      /* DELIBERATE, and it reads out of ANOTHER chapter's cast on purpose: LAW0 is declared in ch5's
         cast, bit 3 (js/content/lore.js:22), and ch6's own cast is [VOLUNTEER, PRECRACKED]
         (lore.js:23), so a ch6 code alone cannot carry it. Scanning every stored attunement is how
         this page learns whether Chapter V already put the struck Law back in the Book.
         It is a display state and nothing else: BOTH branches give the Binder the same instruction —
         down the count, every cut its other word, the cold word written in. law0 only decides whether
         the Founders' card reads RESTORED or STRUCK, 212. A table whose phone has no ch5 code sees
         STRUCK and reads the stone exactly the same way. */
      const law0 = !!(ctx.state.unlocked && Object.values(ctx.state.unlocked).some(u => u && u.flags && u.flags.LAW0));
      const neighbour = (l) => L.roles[[l - 1, l + 1, l - 2, l + 2].filter(x => x >= 0 && x < 4 && x !== l)[0]].nick;

      /* ---------- SPEAK: the bells ---------- */
      if (roleId === 'listener') {
        P.speak.push({ t: 'h', text: 'The dark pattern — you are the voice' });
        P.speak.push({ t: 'p', text: 'Your own bell goes quiet. The Hearth counts the beats to thirty-two. Say the number on each beat that has one, and nothing on the beats that do not.' });
        P.speak.push({ t: 'svg', svg: callComb() });
        P.speak.push({ t: 'fine', text: '**Say all twenty-four.** Which of them are bells is on three other pages, and not on yours.' });
        P.speak.push({ t: 'fine', text: 'The call comes one beat early on purpose: whoever owns that number rings on the beat after you say it.' });
      } else {
        P.speak.push({ t: 'h', text: 'Your bells' });
        P.speak.push({ t: 'p', text: 'In the dark the Listener calls every number, one beat early. Six of the twenty-four are yours: **' + mine(roleId).join(' · ') + '**. Ring on the beat after yours is called.' });
        P.speak.push({ t: 'svg', svg: myBells(roleId) });
        P.speak.push({ t: 'fine', text: 'A number that is not on your list is somebody else’s bell, or the Cold wearing a bell’s face. Keep your hand still for it — nobody else can ring yours, and you cannot ring theirs.' });
      }
      if (isVol) {
        P.speak.push({ t: 'divider' });
        P.speak.push({ t: 'p', text: 'Your Sight is still up the Stair, holding the way shut. Through the first pattern your bell is silent and **' + neighbour(vol - 1) + '** rings it. The Provost ties the thread off before the dark one.' });
        P.speak.push(threadBlock());
      }
      P.speak.push({ t: 'fine', text: '*' + L.houseRule + '*' });

      /* ---------- SIGHT: the stone ---------- */
      if (roleId === 'reader') {
        P.sight.push({ t: 'h', text: 'What the fire ate' });
        P.sight.push({ t: 'p', text: 'Four of the eight cuts are burned away — cuts 1, 3, 5 and 7. The Hearth shows those four as scorch. On your page they are clean.' });
        P.sight.push({ t: 'html', html: burnCuts() });
        P.sight.push({ t: 'p', text: '**Cut 1 a flame. Cut 3 a crown. Cut 5 a spike. Cut 7 a crown.** Say them by number.' });
        P.sight.push({ t: 'fine', text: COST });
        P.sight.push({ t: 'fine', text: 'Every shape has two words, one for each way up, and your **Book** has them — for these four and for the four the fire spared. Which way up these four stood is not on your page. Ask.' });
      }

      if (roleId === 'listener') {
        P.sight.push({ t: 'h', text: 'Where the lap ends' });
        P.sight.push({ t: 'p', text: 'The line runs all the way round the foot, so it has no first cut. When the fire drops, the shaft rings one lap of it. You cannot hear which words. You can hear where it stops.' });
        P.sight.push({ t: 'html', html: restFig() });
        /* Flat on purpose. The line's real steps would name two of the burnt words to anybody
           holding the Ladder in their Book, and this page may only say where the lap ends. */
        P.sight.push({ t: 'audio', label: 'The end of the lap', strip: CA.strip([0, 0, 'rest']), play: (A) => CA.playSteps(A, [0, 0, 'rest']), text: '**The lap ends on a silence.** The steps are flattened here. Listen for the gap, not the tune.' });
        P.sight.push({ t: 'fine', text: 'One of the eight words has no note at all, and your **Book** says which one. The lap stops there, so that cut is read last.' });
        P.sight.push({ t: 'fine', text: 'You never hear a word’s name, and you cannot see a cut. Ask.' });
      }

      if (roleId === 'seer') {
        P.sight.push({ t: 'h', text: 'Under the soot' });
        P.sight.push({ t: 'p', text: 'The fire has covered the foot of this stone since the night it was lit. Under the soot the four burnt cuts are still there, and you can see which way each chisel went in.' });
        P.sight.push({ t: 'svg', cls: 'underlayer', svg: underFoot6 });
        P.sight.push({ t: 'p', text: '**Cuts 1, 3 and 5 were struck point-up. Cut 7 points down.**' });
        P.sight.push({ t: 'fine', text: 'Get one of the four the wrong way up and the whole lap is wrong.' });
        P.sight.push({ t: 'fine', text: 'What a cut struck that way says is not yours to know. Say which way, and stop.' });
      }

      if (roleId === 'binder') {
        P.sight.push({ t: 'h', text: 'Two Laws, one hand' });
        P.sight.push({ t: 'html', html: olderBinds() });
        P.sight.push({ t: 'html', html: `<div class="laws">
          <div class="law founders${law0 ? '' : ' struck'}"><div class="era">Law 0 · Founders' · Year 0 · ${law0 ? 'RESTORED' : 'STRUCK, 212'}</div><div class="txt">Read a line as the cuts count down. Every cut says its other word. COLD is written by four hands.</div></div>
          <div class="law order"><div class="era">Law 6 · the Convocation's · Year 212</div><div class="txt">Begin at the mark and read as the cuts count up. A cut says the word it stands for. COLD is never written.</div></div>
        </div>` });
        P.sight.push({ t: 'p', text: 'A Law that is merely wrong is forgotten. A Law that is *inconvenient* is struck. **The older one binds, and all three of it.**' });
        P.sight.push({ t: 'fine', text: 'So: down the count, every cut its other word, and the cold word written in.' });
        P.sight.push({ t: 'fine', text: 'You cannot read a cut, see how it was struck, or hear where the lap ends. Ask.' });
      }

      /* ---------- WREN ---------- */
      if (roleId === 'reader') {
        P.wren.push({ t: 'h', text: 'The name on the roll' });
        P.wren.push({ t: 'p', text: laundry === 'TELL' ? 'In the laundry you said the name meant a small brave bird. It was kind, and it was a bluff.'
          : laundry === 'DONTKNOW' ? 'In the laundry you said you did not know yet. It was true then.'
          : 'Wren asked you in the laundry what the name meant, and you never answered.' });
        P.wren.push({ t: 'p', text: 'You have known since the study. The roll spells it in the older alphabet, and the older alphabet says the hollow of a bell — the part that rings.' });
        P.wren.push({ t: 'p', text: 'You told yourself it was a coincidence of spelling. Four bells hang over the lid tonight, and you keep looking at the dark inside them.' });
      }
      if (roleId === 'listener') {
        P.wren.push({ t: 'h', text: 'How quiet' });
        P.wren.push({ t: 'html', html: `<div class="heartbeats"><div class="hb"><span>Provost Marrow</span>${D.trace('fast')}</div>${['Reader', 'Listener', 'Seer', 'Binder'].map(n => `<div class="hb"><span>${n}</span>${D.trace('normal')}</div>`).join('')}<div class="hb"><span>Wren</span>${D.trace('flat')}</div></div>` });
        P.wren.push({ t: 'p', text: laundry === 'LOUD' ? 'In the laundry you said you could hear it, loud. You have worried at that ever since, the way you would worry a sore tooth.'
          : laundry === 'NO' ? 'In the laundry you said no. It was the only true thing anybody said to Wren that night.'
          : 'Wren asked you in the laundry and you never answered.' });
        P.wren.push({ t: 'p', text: 'Six chapters, every room, and never once anything to catch. You decided years ago that the fault was yours.' });
      }
      if (roleId === 'seer') {
        P.wren.push({ t: 'h', text: 'The shadow' });
        P.wren.push({ t: 'svg', cls: 'underlayer', svg: underChamber });
        P.wren.push({ t: 'p', text: laundry === 'TELL' ? 'In the laundry you told Wren about the shadow. Wren laughed and said you were being poetic.'
          : laundry === 'NOTHING' ? 'In the laundry you said nothing at all, and looked at the wall.'
          : 'Wren asked you in the laundry and you never answered.' });
        P.wren.push({ t: 'p', text: 'The fire is straight overhead tonight. Every shadow in the room runs away from it. One walks in.' });
      }
      if (roleId === 'binder') {
        P.wren.push({ t: 'h', text: 'No thread found' });
        P.wren.push({ t: 'html', html: '<ul class="blk-list">'
          + '<li>' + threadLine('grey') + ' <strong>the Provost to Wren:</strong> grey. A goodbye already said.</li>'
          + '<li>' + threadLine('whole') + ' <strong>the four of you:</strong> red, each to each, and holding.</li>'
          + '<li>' + threadLine('none') + ' <strong>Wren:</strong> nothing at all.</li>'
          + '</ul>' });
        P.wren.push({ t: 'p', text: laundry === 'YES' ? 'In the laundry you said yes, to the one person in this school with no thread on them.'
          : laundry === 'DONTKNOW' ? 'In the laundry you said you did not know, and Wren went quiet, and you have not forgiven yourself for the quiet.'
          : 'Wren asked you in the laundry and you never answered.' });
        P.wren.push({ t: 'p', text: 'Not unbound. You know unbound. There is nothing there at all, and you have never told anyone your gift has a blind spot.' });
      }

      return P;
    },
  });

  /* The Binder's Book keeps the year the Order paid nothing — opt-in, and only once Chapter VI is open. */
  C.bookExtras.push((roleId, ctx) => {
    if (roleId !== 'binder' || !ctx.unlocked('ch6')) return [];
    return [{ t: 'h', text: 'The bell-chamber' }, { t: 'reveal', label: 'Read when the Hearth says the Book has turned a page', blocks: [
      { t: 'omen', text: 'Four Masters, four Sightings. The Convocation would not pay it. They struck the Law and called it grammar.' },
      { t: 'fine', text: 'Two hundred and twelve years after the Founders the seal failed. Four hands meant four Masters giving up their Sight. The Convocation sent one Warden down instead.' },
    ] }];
  });
})();

</script>
<script>/* js/content/companion/ch7.js */
/* Companion — Finale (CROWN). One puzzle fact each, and no page holds another's:
   the Reader has what the two walls say, read from either end;
   the Listener has how the phrase opens — the second word is one rung above the first;
   the Seer has the two cuts in the rim of the floor, and which socket each is in;
   the Binder has the Laws: a sigil begins in the scratch and runs sunwise, and names every word once.
   Verified by enumeration over 128 rings — tools/scripts/ch7-sigil-check.js, run against the shipped
   check(): all four pages give exactly one ring; drop the Listener and four remain (two under the
   oath, which rotates the wall order away), drop the Seer and eight, drop the Binder and eight. Drop
   the Reader and no word can be named — the Hearth's palette is name-only and the walls are legible
   only here. Note that the shape-to-word lexicon is NOT private: book.js prints all eight shapes
   beside their names on the Listener's Book page, so the Reader's necessity rests on
   js/art/scenes-ch7.js drawing the wear on those walls and never the cut.
   The walls moved this pass: the first four words used to be Chapter II's vault-door answer in
   Chapter II's order, which is also the worked example on the Listener's permanent Book page. The
   same check script now compares both walls, both readings of each, and the phrase against every
   ordered sequence the game prints where more than one seat can read it. */
(function () {
  'use strict';
  const G = window.VigilGlyphs, L = window.VigilLore, CA = window.CompanionAudio, D = window.CompanionDraw, UI = window.VigilUI, Shared = window.VigilShared;
  const C = window.CompanionContent;
  const V = '#a482e6', GOLD = '#f2d27a', SEA = '#4fb3bf', RED = '#d96b4a';
  const F = 'font-family="Cinzel,serif"';

  /* a copy of the two walls in js/content/ch7.js — the phone does not load the chapter file.
     KEEP IN STEP WITH js/content/ch7.js:WEST/EAST/SCRATCH/NOTCH; tools/scripts/ch7-sigil-check.js
     compares the two files and fails if they drift. */
  const WEST = [{ shape: 'Hook', inv: false }, { shape: 'Crown', inv: true }, { shape: 'Spike', inv: false }, { shape: 'Spike', inv: true }];
  const EAST = [{ shape: 'Flame', inv: false }, { shape: 'Hook', inv: true }, { shape: 'Crown', inv: false }, { shape: 'Flame', inv: true }];
  const SCRATCH = 6, NOTCH = 1;
  const words = (items, end) => G.readLine(items, end === 'other' ? 'right' : 'left')
    .map(n => `<b>${n}</b>`).join('<br>');
  const law = (n, era, year, text, note) => `<div class="law ${era === 'O' ? 'order' : 'founders'}"><div class="era">Law ${n} · ${era === 'F' ? 'Founders’ · Year 0' : 'Order’s · Year ' + year}</div><div class="txt">${UI.esc(text)}</div>${note ? `<div class="fine">${note}</div>` : ''}</div>`;

  /* Reader: the two walls, each drawn once and read both ways. No mark, no arrow, no socket number —
     which end a wall begins at is the Seer's, and which wall speaks first is the Listener's. */
  const wallRow = (items) => G.inscription(items.map(it => Object.assign({}, it)), { showMark: false, color: GOLD });

  /* The Listener's interval, drawn: two rungs of the ladder and the smallest climb there is.
     The dormitory lamp opened on +3. This one opens on +1. */
  const climbOne = () => `<svg viewBox="0 0 200 100" style="width:180px;height:90px">
    ${[0, 1, 2, 3, 4].map(i => `<line x1="30" y1="${70 - i * 15}" x2="86" y2="${70 - i * 15}" stroke="rgba(255,255,255,.25)" stroke-width="2"/>`).join('')}
    <circle cx="58" cy="70" r="7" fill="${SEA}"/><circle cx="58" cy="55" r="7" fill="${SEA}"/>
    <path d="M110,70 L110,55" stroke="${SEA}" stroke-width="2"/><path d="M110,49 l-5,10 l10,0 Z" fill="${SEA}"/>
    <text x="128" y="66" fill="${SEA}" font-size="18" ${F}>+1</text>
    <text x="100" y="94" text-anchor="middle" fill="rgba(255,255,255,.6)" font-size="9" ${F}>the smallest climb there is</text>
  </svg>`;

  /* The Seer's floor: eight sockets, numbered as the Hearth numbers them, and TWO cuts.
     No arrow, no direction, no rule — the Seer reports cuts, not meanings. */
  const ringCuts = () => {
    const cx = 170, cy = 132, R = 76;
    const at = (n, d) => { const a = ((n - 1) / 8 * 360 - 90) * Math.PI / 180; return [cx + Math.cos(a) * (R + d), cy + Math.sin(a) * (R + d)]; };
    /* labels are placed by the mark's own bearing, so they stay inside the box wherever the cuts move */
    const lab = (n, d) => { const a = ((n - 1) / 8 * 360 - 90) * Math.PI / 180, c = Math.cos(a), v = Math.sin(a);
      return [(cx + c * (R + d)).toFixed(1), (cy + v * (R + d) + (Math.abs(v) > 0.9 ? (v > 0 ? 15 : -9) : 4)).toFixed(1),
        c > 0.35 ? 'start' : c < -0.35 ? 'end' : 'middle']; };
    let s = `<svg viewBox="0 0 360 260"><rect width="360" height="260" fill="#000"/>`;
    s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#fff" stroke-width="1.4"/>`;
    for (let i = 0; i < 8; i++) {
      const [x, y] = at(i + 1, 0); const hot = (i + 1) === SCRATCH;
      s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="15" fill="#000" stroke="${hot ? V : '#fff'}" stroke-width="${hot ? 2.5 : 1.4}"/>`;
      s += `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="middle" fill="${hot ? V : '#fff'}" font-size="12" ${F}>${i + 1}</text>`;
    }
    const [sx, sy] = at(SCRATCH, 26), [slx, sly, sla] = lab(SCRATCH, 34);
    s += `<g stroke="${V}" stroke-width="2.5" stroke-linecap="round"><path d="M${(sx - 17).toFixed(1)},${(sy + 3).toFixed(1)} L${(sx + 17).toFixed(1)},${(sy - 5).toFixed(1)}"/><path d="M${(sx - 13).toFixed(1)},${(sy + 10).toFixed(1)} L${(sx + 13).toFixed(1)},${(sy + 3).toFixed(1)}"/></g>`;
    s += `<text x="${slx}" y="${sly}" text-anchor="${sla}" fill="${V}" font-size="10" ${F}>a scratch</text>`;
    const [nx, ny] = at(NOTCH, 24), [nlx, nly, nla] = lab(NOTCH, 32);
    s += `<g stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".9"><path d="M${(nx - 7).toFixed(1)},${(ny + 7).toFixed(1)} L${nx.toFixed(1)},${(ny - 4).toFixed(1)} L${(nx + 7).toFixed(1)},${(ny + 7).toFixed(1)}"/></g>`;
    s += `<text x="${nlx}" y="${nly}" text-anchor="${nla}" fill="rgba(255,255,255,.85)" font-size="10" ${F}>a small notch</text>`;
    s += `<text x="180" y="252" text-anchor="middle" fill="#fff" font-size="9" ${F} opacity=".7">two cuts in the rim, under the polish</text></svg>`;
    return s;
  };

  /* The Binder's rule, drawn: which cut starts a sigil, and which way it runs from there.
     THE GEOMETRY ENFORCES THE SEPARATION. An earlier version drew eight sockets on the Hearth's own
     angular convention (i/8*360-90, socket 1 at the top, clockwise — js/puzzles/ring.js), and put the
     scratch and the notch radially outside two of them. Held next to the Hearth's numbered wheel it read
     off "the scratch is on this socket, the notch on that one", which is the Seer's whole page, and dropping
     the Seer went from eight candidate rings to one. So: NO sockets at all here, and the two cuts sit at
     angles no socket ever occupies (22.5 degrees off every one of eight, whatever the ring's rotation).
     Where the cuts are is the Seer's. This page says only that one of them starts a sigil, and which
     way the sigil then runs. The Prologue's lawRing does the same thing by rotating off the Hearth's
     convention (companion/ch0.js).
     THE ANGLE BETWEEN THE TWO MARKS, checked this pass and deliberately left alone. The marks sit 221
     degrees apart, which rounds to five sockets, and five sockets is also how far apart the cuts
     really are — so the obvious next move is to break that too. It cannot be broken and it does not
     need to be. It cannot: on an eight-fold ring, if BOTH marks are half-way between sockets (which
     is what keeps either from being read off as a socket number) then the angle between them is
     always a whole multiple of 45 degrees, so "no mark on a socket" and "no whole number of sockets
     between the marks" are mutually exclusive, and the first is the one worth having. It does not
     need to be: the separation relates the two cuts to each other and says nothing about where
     either one is, and the page that matters here — the Seer-less field, eight start sockets — is
     eight because nobody knows which socket the scratch is in. Knowing the two cuts are five apart
     leaves all eight. tools/scripts/ch7-companion.json asserts the invariant that IS load-bearing:
     every mark in this drawing is more than 15 degrees off every one of the eight socket bearings. */
  const placingRule = () => `<svg viewBox="0 0 170 160" style="width:150px;height:141px">
    <circle cx="85" cy="80" r="52" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="3"/>
    <g stroke="${RED}" stroke-width="2.5" stroke-linecap="round"><path d="M104,19 L120,11"/><path d="M107,25 L122,18"/></g>
    <text x="76" y="14" text-anchor="middle" fill="${RED}" font-size="9" ${F}>the scratch</text>
    <g stroke="rgba(255,255,255,.6)" stroke-width="2" stroke-linecap="round"><path d="M16,115 L22,103 L28,115"/></g>
    <text x="26" y="129" text-anchor="middle" fill="rgba(255,255,255,.6)" font-size="9" ${F}>a notch</text>
    <path d="M129,36 a62,62 0 0 1 0,88" fill="none" stroke="${RED}" stroke-width="2.5"/>
    <path d="M129,124 l-8,-5 l0,10 Z" fill="${RED}"/>
    <text x="144" y="82" text-anchor="middle" fill="${RED}" font-size="9" ${F}>clockwise</text>
    <text x="85" y="156" text-anchor="middle" fill="rgba(255,255,255,.6)" font-size="9" ${F}>the scratch starts it, then clockwise</text>
  </svg>`;

  /* Wren, under the chamber: four shadows away from the spark, and one toward it. No names but Wren's. */
  const underChamber = () => {
    let s = `<svg viewBox="0 0 360 210"><rect width="360" height="210" fill="#000"/>`;
    s += `<g stroke="#fff" fill="none" stroke-width="1.2"><rect x="10" y="10" width="340" height="190"/>`;
    s += `<ellipse cx="180" cy="128" rx="120" ry="50"/>`;
    for (let i = 0; i < 8; i++) { const a = (i / 8 * 360 - 90) * Math.PI / 180; s += `<circle cx="${(180 + Math.cos(a) * 120).toFixed(1)}" cy="${(128 + Math.sin(a) * 50).toFixed(1)}" r="6"/>`; }
    s += `<path d="M180,40 L180,18" stroke-dasharray="2 4"/></g>`;
    s += `<circle cx="180" cy="128" r="4" fill="#fff"/><circle cx="180" cy="128" r="9" fill="none" stroke="#fff" opacity=".5"/>`;
    const four = [[118, 182], [150, 190], [210, 190], [242, 182]];
    s += `<g fill="#fff">${four.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="5"/>`).join('')}<circle cx="180" cy="90" r="5" fill="${V}"/></g>`;
    s += `<g stroke="#fff" stroke-width="3" opacity=".55" stroke-linecap="round">${four.map(([x, y]) => { const dx = x - 180, dy = y - 128, n = Math.hypot(dx, dy); return `<path d="M${x},${y} L${(x + dx / n * 22).toFixed(1)},${(y + dy / n * 22).toFixed(1)}"/>`; }).join('')}</g>`;
    s += `<g stroke="${V}" stroke-width="3" opacity=".9" stroke-linecap="round"><path d="M180,90 L180,116"/></g>`;
    s += `<text x="180" y="80" text-anchor="middle" fill="${V}" font-size="9" ${F}>Wren</text>`;
    s += `<text x="180" y="206" text-anchor="middle" fill="#fff" font-size="9" ${F} opacity=".7">shadows, as they fall</text></svg>`;
    return s;
  };

  /* A thread, drawn three ways: whole, grey, absent. */
  const threadLine = (kind) => `<svg viewBox="0 0 90 16" style="width:74px;height:14px;vertical-align:middle">${
    kind === 'whole' ? `<path d="M4,8 C24,2 34,14 52,8 S74,4 86,8" fill="none" stroke="${RED}" stroke-width="2.5" stroke-linecap="round"/>`
    : kind === 'grey' ? '<path d="M4,8 C24,2 34,14 52,8 S74,4 86,8" fill="none" stroke="rgba(233,226,210,.45)" stroke-width="2.5" stroke-linecap="round"/>'
    : '<path d="M6,2 L2,2 L2,14 L6,14 M84,2 L88,2 L88,14 L84,14" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>'
  }</svg>`;
