<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* Shared theme: The Fourth Vigil */
:root {
  --bg: #0b0a10;
  --bg2: #15121d;
  --panel: rgba(18, 15, 26, 0.82);
  --panel-solid: #16131f;
  --ink: #e9e2d2;
  --ink-dim: #a99f8c;
  --gold: #d4a94e;
  --gold-2: #f2d27a;
  --ember: #ff7a3d;
  --sea: #4fb3bf;
  --violet: #9b7bd8;
  --blood: #b23a3a;
  --moss: #7fae5e;
  --line: rgba(212, 169, 78, 0.35);
  --serif: 'Cormorant Garamond', 'Georgia', serif;
  --display: 'Cinzel', 'Trajan Pro', 'Georgia', serif;
  --hand: 'IM Fell English', 'Cormorant Garamond', serif;
  --shadow: 0 10px 40px rgba(0,0,0,0.55);
  --p1: #e0b04a; --p2: #4fb3bf; --p3: #d96b4a; --p4: #a482e6;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--serif); font-size: 20px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body.hearth { overflow: hidden; }
h1, h2, h3, .display { font-family: var(--display); font-weight: 600; letter-spacing: 0.06em; }
a { color: var(--gold); }
em { font-style: italic; color: var(--gold-2); }
strong { color: var(--gold-2); font-weight: 600; }
.small { font-size: 0.8em; color: var(--ink-dim); }
.rune { font-family: var(--display); letter-spacing: 0.18em; color: var(--sea); }
::selection { background: rgba(212,169,78,0.35); }

.btn {
  font-family: var(--display); font-size: 17px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink); background: linear-gradient(180deg, rgba(212,169,78,0.14), rgba(212,169,78,0.04));
  border: 1px solid var(--line); border-radius: 6px; padding: 12px 22px; cursor: pointer;
  transition: all .18s ease; position: relative; overflow: hidden;
}
.btn:hover, .btn:focus-visible { border-color: var(--gold); color: var(--gold-2); background: linear-gradient(180deg, rgba(212,169,78,0.28), rgba(212,169,78,0.08)); box-shadow: 0 0 22px rgba(212,169,78,0.18); outline: none; }
.btn:active { transform: translateY(1px); }
.btn.primary { border-color: var(--gold); color: #1a1408; background: linear-gradient(180deg, var(--gold-2), var(--gold)); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: rgba(255,255,255,0.15); }
.btn.danger { border-color: var(--blood); color: #f0b0b0; }
.btn.primary.danger { border-color: #d24b4b; color: #fff3ee; background: linear-gradient(180deg, #c04444, #8e2a2a); text-shadow: 0 1px 0 rgba(0,0,0,0.35); }
.btn.primary.danger:hover { color: #fff; background: linear-gradient(180deg, #c94a4a, #9a2f2f); box-shadow: 0 0 22px rgba(178,58,58,0.35); filter: none; }
.btn.primary.danger:focus-visible { color: #fff; background: linear-gradient(180deg, #c94a4a, #9a2f2f); box-shadow: 0 0 22px rgba(178,58,58,0.35); filter: none; }
.btn.audio-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
.btn.audio-btn .audio-icon { flex: 0 0 auto; }
.btn.audio-btn.playing { border-color: var(--sea); color: var(--sea); }
.btn.audio-btn.playing .audio-icon path { animation: eq 0.9s ease-in-out infinite; transform-origin: center; }
.btn.audio-btn.playing .audio-icon path:nth-child(2) { animation-delay: .15s; } .btn.audio-btn.playing .audio-icon path:nth-child(3) { animation-delay: .3s; }
.btn.audio-btn.playing .audio-icon path:nth-child(4) { animation-delay: .45s; } .btn.audio-btn.playing .audio-icon path:nth-child(5) { animation-delay: .6s; }
@keyframes eq { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.35); } }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.small { font-size: 13px; padding: 7px 12px; }
/* small bar buttons (both screens) and the utility class that hides a block */
.iconbtn { background: none; border: 1px solid transparent; color: var(--ink-dim); font-family: var(--display); font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; padding: 6px 10px; border-radius: 6px; transition: color .15s, border-color .15s; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; flex: 0 0 auto; line-height: 1; }
.iconbtn svg { flex: 0 0 auto; width: 15px; height: 15px; display: block; }
.iconbtn:hover { color: var(--gold-2); border-color: var(--line); }
.iconbtn.attention { color: var(--gold-2); animation: pulse 1.2s infinite; border-color: var(--line); }
.hidden { display: none !important; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }

input.field, textarea.field {
  font-family: var(--display); font-size: 22px; letter-spacing: 0.25em; text-transform: uppercase; text-align: center;
  color: var(--gold-2); background: rgba(0,0,0,0.35); border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; width: 100%;
  outline: none; transition: border-color .2s;
}
input.field:focus { border-color: var(--gold); box-shadow: 0 0 18px rgba(212,169,78,0.2); }
input.field.plain { letter-spacing: 0.04em; text-transform: none; font-family: var(--serif); font-size: 20px; }
input.field.wrong { border-color: var(--blood); animation: shake .4s; }

@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px);} to { opacity: 1; transform: none; } }
@keyframes pulse { 0%,100%{ opacity: .7 } 50% { opacity: 1 } }
@keyframes glow { 0%,100% { box-shadow: 0 0 8px rgba(212,169,78,0.2);} 50% { box-shadow: 0 0 28px rgba(212,169,78,0.55);} }
@keyframes spin { to { transform: rotate(360deg);} }
.shake { animation: shake .45s; }

/* toasts, modals */
.toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px); background: var(--panel-solid); border: 1px solid var(--line); color: var(--ink); padding: 12px 22px; border-radius: 8px; opacity: 0; transition: all .35s; z-index: 200; box-shadow: var(--shadow); font-size: 18px; max-width: 80vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.good { border-color: var(--moss); } .toast.bad { border-color: var(--blood); }
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .3s; z-index: 150; }
.modal-back.show { opacity: 1; }
.modal { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 10px; padding: 26px 30px; max-width: min(860px, 92vw); max-height: 88vh; overflow: auto; box-shadow: var(--shadow); transform: translateY(10px); transition: transform .3s; }
.modal-back.show .modal { transform: none; }
.modal-title { margin: 0 0 14px; color: var(--gold); font-size: 22px; }
.modal-close { margin-top: 18px; }
#fx-overlay { position: fixed; inset: 0; z-index: 300; opacity: 0; pointer-events: none; }

/* countdown */
.countdown { position: relative; height: 10px; background: rgba(255,255,255,0.08); border-radius: 5px; overflow: hidden; margin: 10px 0 4px; border: 1px solid rgba(255,255,255,0.08); }
.countdown-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--ember)); transition: width .1s linear; }
.countdown.urgent .countdown-fill { background: linear-gradient(90deg, var(--blood), var(--ember)); }
.countdown-num { position: absolute; right: 8px; top: -26px; font-family: var(--display); color: var(--gold-2); font-size: 16px; }
.countdown.urgent .countdown-num { color: #ff8b8b; animation: pulse .5s infinite; }

/* flowchart
   The chart is laid out by js/core/ui.js in real CSS pixels -- one viewBox unit is one pixel -- so it
   must never be scaled to fit. `max-width: 100%` used to do exactly that, and the scale factor was
   the label size: 1160-1730px of chart squeezed into a 786px panel wrote its labels at 5.7-11.3px in
   all nine chapters, under a 17px floor the game sets because it is read across a room. The chart now
   sizes itself to the panel and scrolls sideways in the rare case that it still cannot fit. */
.flowchart-wrap { overflow-x: auto; overflow-y: hidden; padding: 8px 0; scrollbar-width: thin; scrollbar-color: rgba(212,169,78,.45) transparent; }
.flowchart { color: var(--gold); max-width: none; height: auto; display: block; }
/* The end-of-chapter panel takes as much of the width as the scene text can spare. At the old
   380px/1fr split a nine-column chart had 786px, and no wrap of it clears the 17px floor without
   running off the bottom instead; 240px for the text buys the chart another 140px and the two flow
   scenes with the most columns stop overflowing at 1280x720. The text column is the smaller loss:
   a flow scene's own text is one or two short lines. This belongs beside the other #panel rules in
   css/hearth.css; it sits here with the rest of the flowchart because it exists only for the chart,
   and it carries `body` so it outranks the rule loaded after this file. */
body #panel:has(.flow-panel) { grid-template-columns: minmax(180px, 210px) 1fr; }
body #panel:has(.flow-panel) #text { font-size: 18px; }
/* A `1fr` grid track has an automatic minimum of its content's min-content width, and the chart no
   longer shrinks to fit -- so without this the whole #panel grew to 1405px at a 1280px viewport and
   the right-hand third of the flow panel was simply off the screen, unreachable, because nothing above
   it scrolls. The column keeps its size and the chart scrolls inside its own wrapper. */
body #panel:has(.flow-panel) #right { min-width: 0; }
body #panel:has(.flow-panel) .flow-panel { max-width: 100%; }
.fc-edge { fill: none; stroke: rgba(255,255,255,0.15); stroke-width: 1.5; color: rgba(255,255,255,0.2); }
.fc-edge.on { stroke: var(--gold); color: var(--gold); stroke-width: 2.2; filter: drop-shadow(0 0 4px rgba(212,169,78,0.6)); }
.fc-node rect, .fc-node path { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.18); stroke-width: 1.2; }
.fc-node.on rect, .fc-node.on path { fill: rgba(212,169,78,0.16); stroke: var(--gold); }
.fc-node.end.on rect { fill: rgba(159,123,216,0.25); stroke: var(--violet); }
/* --fc-font is set on the svg by UI.flowchart: it is the real pixel size the chart was laid out for,
   and the fallback is the floor, never below it. Choice diamonds used to be set two points smaller,
   which put them under the floor first; they are the same size as everything else now. */
.fc-node text { fill: rgba(233,226,210,0.72); font-family: var(--serif); font-size: var(--fc-font, 17px); }
.fc-node.on text { fill: var(--ink); }
.flowchart-wrap.zoomable { cursor: zoom-in; }
.flowchart-wrap.zoomable:hover .flowchart { filter: drop-shadow(0 0 14px rgba(212,169,78,0.25)); }
.flow-zoom-hint { font-family: var(--display); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); text-align: right; padding-top: 4px; }
.flowchart-wrap.big { overflow: auto; max-height: 78vh; max-width: none; cursor: default; }
/* The enlarged chart needs to be an enlargement. css/hearth.css caps a wide modal at 980px, which is
   narrower than the flow panel itself now that the panel takes the column -- so tapping to enlarge
   made the chart no bigger and the extra room bought nothing. A modal that holds a chart gets the
   screen. */
body .modal.wide:has(.flowchart-wrap.big) { max-width: min(1600px, 96vw); padding: 20px 22px; }
/* The Map of the Night is laid out in real pixels for the box it is going into (js/core/map.js), so
   the box must HAVE a width before it is measured: a modal is max-width, not width, and an empty one
   shrinks to its title. Nine place names at the 17px floor need about 1040px across five columns. */
body .modal.wide:has(.map-box) { max-width: min(1120px, 96vw); padding: 20px 22px; }
.map-box { width: min(1040px, calc(96vw - 60px)); overflow-x: auto; }
.map-box .night-map { display: block; max-width: none; }
.flow-panel { scrollbar-width: thin; scrollbar-color: rgba(212,169,78,.45) transparent; }

/* pads for 4-key input */
.pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px; }
.pad { font-family: var(--display); background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 12px 6px; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all .12s; user-select: none; touch-action: manipulation; }
.pad .pad-name { font-size: 13px; letter-spacing: 0.08em; opacity: .8; }
.pad .pad-key { font-size: 30px; font-weight: 700; }
.pad-0 { border-color: var(--p1); } .pad-1 { border-color: var(--p2); } .pad-2 { border-color: var(--p3); } .pad-3 { border-color: var(--p4); }
.pad-0 .pad-key { color: var(--p1); } .pad-1 .pad-key { color: var(--p2); } .pad-2 .pad-key { color: var(--p3); } .pad-3 .pad-key { color: var(--p4); }
.pad.hit, .pad.glow { background: rgba(255,255,255,0.18); transform: scale(1.04); }
.pad.armed { animation: glow 1s infinite; }
.pad.good { background: rgba(127,174,94,0.35); } .pad.bad { background: rgba(178,58,58,0.35); }

.spinner { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.15); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }

</style>

<style>
/* Companion (phone) layout */
body.companion { overflow: auto; font-size: 18px; background: var(--bg); }
html.companion-page { overflow: auto; height: auto; }
html:has(body.companion) { overflow: auto; height: auto; }
#capp { position: relative; }
#capp { min-height: 100vh; display: flex; flex-direction: column; }
#chead .iconbtn { padding: 10px 12px; }
#chead { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: rgba(11,10,16,0.92); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); }
#chead .brand { font-family: var(--display); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); white-space: nowrap; }

#cmain { flex: 1; padding: 16px 16px 60px; max-width: 640px; margin: 0 auto; width: 100%; }
.cpanel { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px; margin-bottom: 14px; animation: fadeUp .35s ease both; }
.cpanel h2 { margin: 0 0 8px; font-size: 20px; color: var(--gold); }
.cpanel h3 { margin: 16px 0 6px; font-size: 16px; color: var(--gold-2); letter-spacing: 0.08em; }
.cpanel p { margin: 0 0 10px; }
.cpanel p:last-child { margin-bottom: 0; }
.cpanel .fine { font-size: 15px; color: var(--ink-dim); }
.role-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
.role-card { text-align: left; border: 2px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 14px 16px; background: rgba(255,255,255,0.03); color: var(--ink); cursor: pointer; font-family: var(--serif); font-size: 17px; }
.role-card .rname { font-family: var(--display); font-size: 18px; letter-spacing: 0.08em; display: block; margin-bottom: 4px; }
.role-card.p0 { border-color: var(--p1);} .role-card.p1 { border-color: var(--p2);} .role-card.p2 { border-color: var(--p3);} .role-card.p3 { border-color: var(--p4);}
.role-card.p0 .rname { color: var(--p1);} .role-card.p1 .rname { color: var(--p2);} .role-card.p2 .rname { color: var(--p3);} .role-card.p3 .rname { color: var(--p4);}
.role-card .rgift { font-size: 15px; color: var(--ink-dim); font-style: italic; }
.crole.p0 { color: var(--p1);} .crole.p1 { color: var(--p2);} .crole.p2 { color: var(--p3);} .crole.p3 { color: var(--p4);}
/* Who you are, at the top of the home page. */
.cpanel.who { border-left-width: 3px; }
.cpanel.who h2 { font-family: var(--display); letter-spacing: 0.1em; text-transform: uppercase; font-size: 17px; }
.cpanel.who.p0 { border-left-color: var(--p1);} .cpanel.who.p1 { border-left-color: var(--p2);} .cpanel.who.p2 { border-left-color: var(--p3);} .cpanel.who.p3 { border-left-color: var(--p4);}
.cpanel.who.p0 h2 { color: var(--p1);} .cpanel.who.p1 h2 { color: var(--p2);} .cpanel.who.p2 h2 { color: var(--p3);} .cpanel.who.p3 h2 { color: var(--p4);}
.cpanel.who .rule { margin-top: 8px; opacity: .75; }
.unlock { display: flex; gap: 8px; }
.unlock .field { min-width: 0; }
.unlock .btn { flex: 0 0 auto; }
.unlock .field { font-size: 22px; }
.chap-list { display: flex; flex-direction: column; gap: 8px; }
.chap-btn { text-align: left; display: flex; justify-content: space-between; align-items: center; text-transform: none; font-family: var(--serif); font-size: 18px; letter-spacing: 0; }
.chap-btn .lock { font-family: var(--display); font-size: 12px; letter-spacing: 0.1em; color: var(--ink-dim); }
.chap-btn.locked { color: var(--ink-dim); background: rgba(0,0,0,0.25); border-color: rgba(255,255,255,0.1); }
.chap-btn.locked .lock { color: var(--gold); }

/* content blocks */
.blk-svg { margin: 8px 0 12px; border-radius: 10px; overflow: hidden; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.08); }
.blk-svg svg { width: 100%; height: auto; display: block; }
.blk-table { width: 100%; border-collapse: collapse; margin: 8px 0 12px; font-size: 16px; }

.blk-table th { font-family: var(--display); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); background: rgba(212,169,78,0.06); }
.blk-table svg { width: 34px; height: 34px; vertical-align: middle; }
.blk-list { margin: 6px 0 12px; padding-left: 22px; }

.blk-glyphs .g { display: flex; flex-direction: column; align-items: center; gap: 4px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 8px 4px; font-size: 13px; text-align: center; }
.blk-glyphs .g svg { width: 48px; height: 48px; }
.blk-letter { font-family: var(--hand); background: rgba(255,240,200,0.06); border-left: 3px solid var(--gold); padding: 10px 14px; border-radius: 4px; color: #ddd0b0; font-size: 18px; margin: 8px 0 12px; }
.blk-whisper { color: var(--sea); font-style: italic; }

.blk-code .word { font-family: var(--display); font-size: 44px; letter-spacing: 0.3em; color: var(--gold-2); text-shadow: 0 0 20px rgba(242,210,122,0.4); padding-left: .3em; }
.blk-code.sea .word { color: var(--sea); }
.blk-reveal > .btn { width: 100%; }
.blk-reveal .inner { margin-top: 10px; }
.blk-secret { border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; margin: 8px 0 12px; }
.blk-secret .label { font-family: var(--display); font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; color: #e07a7a; margin-bottom: 6px; }
.blk-secret .hold { width: 100%; }
.blk-secret .content { display: none; margin-top: 8px; }
.blk-secret.open .content { display: block; }
.blk-choice { margin: 8px 0 12px; }
.blk-choice .opts { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.blk-choice .opt { text-align: left; text-transform: none; font-family: var(--serif); font-size: 17px; letter-spacing: 0; padding: 12px 14px; }
.blk-choice .opt.chosen { border-color: var(--gold); background: rgba(212,169,78,0.2); }
.blk-choice .opt:disabled { opacity: .5; }
.blk-choice .opt.chosen:disabled { opacity: 1; cursor: default; }
.blk-note textarea { width: 100%; min-height: 90px; font-family: var(--hand); font-size: 18px; color: var(--ink); background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 10px; resize: vertical; }
.blk-task { margin: 8px 0 12px; border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: rgba(0,0,0,0.25); }
.blk-task .task-title { font-family: var(--display); font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
.blk-divider { height: 1px; background: linear-gradient(90deg, transparent, var(--line), transparent); margin: 14px 0; }
.blk-key { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 6px; margin: 8px 0 12px; }
.blk-key .k { display: flex; flex-direction: column; align-items: center; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 6px 2px; font-size: 13px; }

<script>/* js/core/ui.js */
/* DOM + presentation helpers: element builder, typewriter, countdown bar, flowchart SVG, toasts, modals. */
(function () {
  'use strict';
  const UI = {};

  UI.esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  UI.el = function (tag, attrs, children) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
      else if (k === 'style' && typeof attrs[k] === 'object') Object.assign(e.style, attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    if (children) (Array.isArray(children) ? children : [children]).forEach(c => { if (c == null) return; e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  };
  UI.clear = (e) => { while (e.firstChild) e.removeChild(e.firstChild); return e; };
  UI.sleep = (ms) => new Promise(r => setTimeout(r, ms));

  /* Inline markup: *emphasis*, **strong**, [[glyph:name]] handled by caller, ~~small~~ */
  UI.rich = function (s) {
    return UI.esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/~~(.+?)~~/g, '<span class="small">$1</span>')
      .replace(/\{\{(.+?)\}\}/g, '<span class="rune">$1</span>')
      .replace(/\n/g, '<br>');
  };

  /* Typewriter: reveals paragraphs one after another; click/space to fast-forward. Returns promise. */
  let skipRequested = false;
  UI.requestSkip = () => { skipRequested = true; };
  /* Build one paragraph. `st` carries speaker continuity: a run of lines from the same
     person is named once, and the rule down the left side carries the rest. */
  function buildPara(para, st) {
    const isObj = typeof para === 'object';
    const text = isObj ? para.text : para;
    const speaker = isObj ? para.speaker : null;
    const same = !!(speaker && speaker === st.speaker);
    const cls = 'para' + (isObj && para.cls ? ' ' + para.cls : '') + (speaker ? ' speech' : '') + (same ? ' cont' : '');
    const p = UI.el('p', { class: cls });
    if (same && st.el) st.el.classList.add('joined');
    if (speaker && !same) p.appendChild(UI.el('span', { class: 'speaker', text: speaker }));
    const span = UI.el('span', { class: 'tw' });
    p.appendChild(span);
    st.speaker = speaker || null; st.el = p;
    return { p, span, html: UI.rich(text) };
  }

  /* Shrink a box's type until the finished text fits inside it, so nothing has to be
     scrolled to be read. `ghost` holds the text that is about to be typed. */
  UI.fitBox = function (container, ghost) {
    const cs = getComputedStyle(container);
    const maxH = parseFloat(cs.maxHeight);
    if (!isFinite(maxH) || maxH <= 0) return;
    container.style.fontSize = '';
    container.classList.remove('tight');
    const base = parseFloat(getComputedStyle(container).fontSize);
    if (!base) return;
    const chrome = parseFloat(cs.borderTopWidth || 0) + parseFloat(cs.borderBottomWidth || 0);
    const avail = maxH - chrome - 2;
    container.appendChild(ghost);
    let size = base;
    // The floor is a readability floor, not a fitting one. This is read aloud from a laptop or a TV
    // several feet away, so type below about 17px is not small, it is gone. A scene that will not fit
    // above the floor is too long, and scan-fit reports it as an overflow so it gets cut instead.
    const floor = Math.max(17, Math.round(base * 0.8));
    while (container.scrollHeight > avail && size > floor) {
      size -= 1;
      container.style.fontSize = size + 'px';
      container.classList.toggle('tight', size <= base * 0.88);
    }
    // What the box had to do to fit, for the layout check in tools/scan-fit.js.
    UI.lastFit = { base, size, over: Math.max(0, container.scrollHeight - avail) };
    ghost.remove();
  };

  UI.typewrite = async function (container, paragraphs, opts) {
    opts = opts || {};
    const speed = opts.speed || 9; // ms per char
    skipRequested = false;
    // Continuity survives across calls into the same box: a choice's reply keeps Wren's rule going.
    const prev = container.__tw;
    const st = (prev && prev.el && prev.el.parentNode === container)
      ? { speaker: prev.speaker, el: prev.el } : { speaker: null, el: null };

    // Size the box for the finished text before a single character of it appears.
    if (opts.fit !== false) {
      const gst = { speaker: st.speaker, el: null };
      const ghost = UI.el('div', { class: 'tw-ghost' });
      for (const para of paragraphs) { const b = buildPara(para, gst); b.span.innerHTML = b.html; ghost.appendChild(b.p); }
      UI.fitBox(container, ghost);
    }

    for (const para of paragraphs) {
      const b = buildPara(para, st);
      const p = b.p, span = b.span, html = b.html;
      container.appendChild(p);
      container.__tw = { speaker: st.speaker, el: st.el };
      // reveal by characters of the plain text while keeping markup: simple approach, progressively slice HTML at tag-safe points
      if (skipRequested || opts.instant) { span.innerHTML = html; continue; }
      let i = 0; const parts = html.split(/(<[^>]+>)/g); let out = '';
      for (const part of parts) {
        if (part.startsWith('<')) { out += part; span.innerHTML = out; continue; }
        for (const ch of part) {
          out += ch; i++;
          if (skipRequested) break;
          if (i % 2 === 0) { span.innerHTML = out; if (window.VigilAudio && i % 6 === 0) window.VigilAudio.sfx('type'); await UI.sleep(speed * (ch === '.' || ch === '—' ? 6 : ch === ',' ? 2.5 : 1)); }
        }
        if (skipRequested) break;
      }
      span.innerHTML = html;
      if (!skipRequested) await UI.sleep(opts.paraPause || 180);
      container.scrollTop = container.scrollHeight;
    }
    skipRequested = false;
  };

  /* Countdown bar: returns {promise, cancel}. onTick(secondsLeft). */
  UI.countdown = function (container, seconds, onTick) {
    const wrap = UI.el('div', { class: 'countdown' }, [UI.el('div', { class: 'countdown-fill' }), UI.el('span', { class: 'countdown-num', text: seconds })]);
    container.appendChild(wrap);
    const fill = wrap.firstChild, num = wrap.lastChild;
    let done = false, resolve; const promise = new Promise(r => resolve = r);
    const start = performance.now();
    function step(t) {
      if (done) return;
      if (!wrap.isConnected) { done = true; resolve('cancel'); return; } // the box was cleared or the tab changed
      const left = Math.max(0, seconds - (t - start) / 1000);
      fill.style.width = (left / seconds * 100) + '%';
      const s = Math.ceil(left); if (num.textContent != s) { num.textContent = s; if (onTick) onTick(s); if (s <= 5 && window.VigilAudio) window.VigilAudio.sfx('tick'); }
      wrap.classList.toggle('urgent', left < seconds * 0.3);
      if (left <= 0) { done = true; resolve('timeout'); return; }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
    return { promise, cancel: () => { done = true; wrap.remove(); resolve('cancel'); }, el: wrap };
  };

  UI.toast = function (msg, ms, cls) {
    const t = UI.el('div', { class: 'toast ' + (cls || ''), html: UI.rich(msg) });
    document.body.appendChild(t);
    requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 500); }, ms || 2600);
  };

  UI.modal = function (contentEl, opts) {
    opts = opts || {};
    const back = UI.el('div', { class: 'modal-back' });
    const box = UI.el('div', { class: 'modal ' + (opts.cls || '') });
    if (opts.title) box.appendChild(UI.el('h3', { class: 'modal-title', text: opts.title }));
    box.appendChild(contentEl);
    let closeBtn = null;
    if (!opts.noClose) { closeBtn = UI.el('button', { class: 'btn ghost modal-close', text: opts.closeText || 'Close', onclick: () => close() }); box.appendChild(closeBtn); }
    back.appendChild(box); document.body.appendChild(back);
    requestAnimationFrame(() => back.classList.add('show'));
    function close() { back.classList.remove('show'); setTimeout(() => back.remove(), 300); if (opts.onClose) opts.onClose(); }
    return { close, el: box };
  };

  /* In-page dialogs (never native prompt/confirm: sandboxed hosts block them). Test hook: window.__autoDialog = { prompt: 'X', confirm: true } */
  UI.ask = function (text, def, opts) {
    opts = opts || {};
    if (window.__autoDialog && window.__autoDialog.prompt !== undefined) return Promise.resolve(window.__autoDialog.prompt);
    return new Promise((resolve) => {
      const box = UI.el('div', { class: 'ask' });
      box.appendChild(UI.el('p', { html: UI.rich(text) }));
      const inp = UI.el('input', { class: 'field' + (opts.plain ? ' plain' : ''), value: def || '', maxlength: opts.maxlength || 40, autocomplete: 'off', spellcheck: 'false', placeholder: opts.placeholder || '' });
      box.appendChild(inp);
      const row = UI.el('div', { class: 'row' });
      let m;
      const done = (v) => { m.close(); resolve(v); };
      row.appendChild(UI.el('button', { class: 'btn primary', text: opts.ok || 'Speak', onclick: () => done(inp.value) }));
      row.appendChild(UI.el('button', { class: 'btn ghost', text: opts.cancel || 'Never mind', onclick: () => done(null) }));
      box.appendChild(row);
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') done(inp.value); if (e.key === 'Escape') done(null); });
      m = UI.modal(box, { title: opts.title || '', noClose: true, cls: 'ask-modal' });
      setTimeout(() => inp.focus(), 60);
    });
  };
  UI.confirm = function (text, opts) {
    opts = opts || {};
    if (window.__autoDialog && window.__autoDialog.confirm !== undefined) return Promise.resolve(!!window.__autoDialog.confirm);
    return new Promise((resolve) => {
      const box = UI.el('div', { class: 'ask' });
      box.appendChild(UI.el('p', { html: UI.rich(text) }));
      const row = UI.el('div', { class: 'row' });
      let m;
      row.appendChild(UI.el('button', { class: 'btn primary' + (opts.danger ? ' danger' : ''), text: opts.ok || 'Yes', onclick: () => { m.close(); resolve(true); } }));
      row.appendChild(UI.el('button', { class: 'btn ghost', text: opts.cancel || 'No', onclick: () => { m.close(); resolve(false); } }));
      box.appendChild(row);
      m = UI.modal(box, { title: opts.title || '', noClose: true, cls: 'ask-modal' });
    });
  };
  UI.notice = function (text, opts) { opts = opts || {}; if (window.__autoDialog) return Promise.resolve(); return new Promise((resolve) => { const box = UI.el('div', { class: 'ask' }); box.appendChild(UI.el('p', { html: UI.rich(text) })); let m; box.appendChild(UI.el('div', { class: 'row' }, [UI.el('button', { class: 'btn primary', text: opts.ok || 'All right', onclick: () => { m.close(); resolve(); } })])); m = UI.modal(box, { title: opts.title || '', noClose: true, cls: 'ask-modal' }); }); };

  /* Flowchart renderer.  spec = { nodes:[{id,label,col,row,kind}], edges:[[a,b]] } ; done = Set of visited node ids
     opts = { avail:{w,h}, fontPx, plain, zoomTitle, colWidth, rowHeight }

     THE TYPE FLOOR IS THE LAYOUT. This used to lay every chart out at a fixed 190px column and let
     `.flowchart { max-width: 100% }` scale the result into whatever panel it landed in. The scale is
     the label size: a 1730px chart in a 786px panel writes its 15px labels at 6.8px, and at 1152x648
     at 5.7px, against a floor of 17px -- so every chapter ended on a picture the room could not read,
     in all nine chapters, at every viewport measured. Scaling cannot be fixed by making the numbers
     bigger, because effective size is fontSize x panelWidth / (cols x colWidth): only the ratio of
     type to column matters, and the ratio was wrong.
     So the chart is now laid out in REAL CSS PIXELS -- one viewBox unit is one pixel and the SVG is
     never scaled down -- and the geometry is chosen to fit the panel it is actually going into, at a
     type size that is the floor rather than the remainder. The node box is sized from the label, the
     widest wrap that still fits wins, and a chart that cannot fit even at the tightest wrap scrolls
     sideways in a panel that says so, instead of shrinking into a smear.
     No chapter's flow data changes: nodes keep their col, row and label. */
  UI.flowchart = function (spec, doneSet, opts) {
    opts = opts || {};
    const F = opts.fontPx || 17;                       // the readability floor, in real screen pixels
    const cols = Math.max(...spec.nodes.map(n => n.col)) + 1, rows = Math.max(...spec.nodes.map(n => n.row)) + 1;
    const availW = (opts.avail && opts.avail.w) || 0, availH = (opts.avail && opts.avail.h) || 0;
    const gapX = Math.round(F * 0.85), gapY = Math.round(F * 0.8);   // the chart is tight on both axes; see the note above
    /* A choice node is drawn as a chamfered hexagon rather than a true diamond. A diamond is only full
       width across its middle, so its label had to be wrapped a third narrower than everything else,
       and at the wraps this chart now needs that cost a word: ch1's "The hour before the bell" came out
       as "The hour before the…". The hexagon reads as a decision just as clearly and gives the label
       nearly the whole box. */
    const charsFor = (n, chars) => n.kind === 'choice' ? Math.max(6, Math.round(chars * 0.9)) : chars;
    /* Widest wrap first: a long label in few long lines reads better than the same label in a stack of
       stubs, and only when that does not fit do we trade width for height. Height is weighted higher
       because the panel scrolls down past the Continue button, and sideways it does not. */
    let g = null;
    for (const chars of [22, 20, 18, 16, 15, 14, 13, 12, 11, 10, 9, 8]) {
      const cut = spec.nodes.filter(n => wrap(n.label, charsFor(n, chars)).cut).length;
      const lines = Math.max(...spec.nodes.map(n => wrap(n.label, charsFor(n, chars)).length));
      const nw = Math.round(chars * F * 0.56) + 10, nh = lines * Math.round(F * 1.15) + 12;
      const cw = Math.max(opts.colWidth || 0, nw + gapX), rh = Math.max(opts.rowHeight || 0, nh + gapY);
      const W = cols * cw + 20, H = rows * rh + 20;
      /* A label that had to be cut is worth a lot of overflow: the chart is words, and a word lost is a
         path the room cannot read at any size. */
      const over = (availW ? Math.max(0, W - availW) : 0) + (availH ? Math.max(0, H - availH) * 1.5 : 0) + cut * 400;
      if (!g || over < g.over) g = { chars, lines, nw, nh, cw, rh, W, H, over, cut };   // ties keep the widest wrap
      if (!over) break;
    }
    const { nw, nh, cw, rh, W, H } = g;
    const pos = {}; spec.nodes.forEach(n => { pos[n.id] = { x: 10 + n.col * cw + (cw - nw) / 2, y: 10 + n.row * rh + (rh - nh) / 2 }; });
    let s = `<svg class="flowchart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="--fc-font:${F}px">`;
    s += `<defs><marker id="fc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>`;
    for (const [a, b] of spec.edges) {
      const pa = pos[a], pb = pos[b]; if (!pa || !pb) continue;
      const on = doneSet.has(a) && doneSet.has(b);
      const x1 = pa.x + nw, y1 = pa.y + nh / 2, x2 = pb.x, y2 = pb.y + nh / 2, mx = (x1 + x2) / 2;
      s += `<path class="fc-edge ${on ? 'on' : ''}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" marker-end="url(#fc-arrow)"/>`;
    }
    for (const n of spec.nodes) {
      const p = pos[n.id]; const on = doneSet.has(n.id);
      const kind = n.kind || 'beat';
      s += `<g class="fc-node ${kind} ${on ? 'on' : 'off'}" transform="translate(${p.x},${p.y})">`;
      if (kind === 'choice') { const c = Math.round(nh * 0.34); s += `<path d="M${c},0 L${nw - c},0 L${nw},${nh / 2} L${nw - c},${nh} L${c},${nh} L0,${nh / 2} z"/>`; }
      else if (kind === 'end') s += `<rect width="${nw}" height="${nh}" rx="${nh / 2}"/>`;
      else s += `<rect width="${nw}" height="${nh}" rx="6"/>`;
      const label = on || !n.secret ? n.label : '? ? ?';
      s += `<title>${UI.esc(label)}</title>`;   // the full label, for a chart that had to shorten one
      /* One <text> per node with a <tspan> per line, not one <text> per line: a wrapped label then still
         reads as one continuous string to anything walking the document (the playthrough scripts assert
         on these labels), and it is one accessible run rather than three fragments. */
      const lines = wrap(label, charsFor(n, g.chars));
      const step = Math.round(F * 1.15), top = nh / 2 - (lines.length - 1) / 2 * step + Math.round(F * 0.35);
      s += `<text x="${nw / 2}" y="${top}" text-anchor="middle">`;
      /* the trailing space is collapsed away by SVG's default xml:space, so it costs nothing on screen
         and keeps the wrapped label one readable string to a document walker */
      lines.forEach((ln, i) => { s += `<tspan x="${nw / 2}"${i ? ` dy="${step}"` : ''}>${UI.esc(ln) + (i < lines.length - 1 ? ' ' : '')}</tspan>`; });
      s += `</text>`;
      s += `</g>`;
    }
    s += `</svg>`;
    const wrapEl = UI.el('div', { class: 'flowchart-wrap', html: s });

         panel, so it can afford a wider wrap and fewer lines. Reusing the panel's markup is what left
         the old zoom scrolling sideways by 812px -- the chart it enlarged had been built for a box it
         was no longer in. Measure the modal first, then draw into it. */
      wrapEl.addEventListener('click', () => {
        const big = UI.el('div', { class: 'flowchart-wrap big' });
        UI.modal(big, { title: opts.zoomTitle || 'The paths you walked', cls: 'wide', closeText: 'Close' });
        const inner = UI.flowchart(spec, doneSet, { plain: true, fontPx: F, avail: { w: Math.max(320, big.clientWidth - 4), h: Math.max(240, big.clientHeight - 8) } });

  UI.AUDIO_ICON = '<svg class="audio-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4"/><path d="M8 7v10"/><path d="M12 4v16"/><path d="M16 7v10"/><path d="M20 10v4"/></g></svg>';
  UI.audioButton = function (label, onPlay, opts) {
    opts = opts || {};
    const text = String(label || 'Cup your ear').replace(/^[♪♫🔊]\s*/u, '');
    const btn = UI.el('button', { class: 'btn audio-btn ' + (opts.cls || ''), type: 'button', 'aria-label': text });
    const setLabel = (t) => { btn.innerHTML = UI.AUDIO_ICON + '<span class="audio-label">' + UI.esc(t) + '</span>'; };
    setLabel(text);
    let timer = null;
    const reset = () => { if (timer) clearTimeout(timer); timer = null; btn.classList.remove('playing'); setLabel(text); };
    btn.addEventListener('click', () => {
      UI.stopAudio(); // one phrase at a time: silence whatever else is playing and reset its button and strip
      try { if (window.VigilAudio && window.VigilAudio.unlockMedia) window.VigilAudio.unlockMedia(); } catch (e) {}
      let ms = 0;
      try { const r = onPlay(); ms = typeof r === 'number' && isFinite(r) ? r : 1800; } catch (e) { console.error(e); ms = 0; }
      if (ms <= 0) { reset(); return; }
      btn.classList.add('playing'); setLabel(opts.playing || 'Listening…');
      playingButton = reset;
      timer = setTimeout(() => { reset(); if (playingButton === reset) playingButton = null; }, ms);
    });
    return btn;
  };
  /* Only one phrase plays at a time. UI.stopAudio() resets the playing button and lit strip and tells the audio
     helpers (which listen for 'vigil:stop') to drop their pending notes. */
  let playingButton = null, litStrip = null;
  UI.stopAudio = function () {
    if (playingButton) { const r = playingButton; playingButton = null; r(); }
    if (litStrip) { const t = litStrip; litStrip = null; t(); }
    try { document.dispatchEvent(new CustomEvent('vigil:stop')); } catch (e) {}
  };
  /* Light each .step of the arrow strip inside el as its note sounds (the audio helpers announce 'vigil:step'). */
  UI.lightStrip = function (el, ms) {
    if (!el) return;
    if (litStrip) { const t = litStrip; litStrip = null; t(); }
    const steps = () => Array.from(el.querySelectorAll('.arrow-strip .step'));
    steps().forEach(s => s.classList.remove('on', 'done'));
    const on = (ev) => { const d = ev.detail || {}; const list = steps(); list.forEach((s, i) => { if (i < d.step) { s.classList.remove('on'); s.classList.add('done'); } }); const s = list[d.step]; if (s) { s.classList.add('on'); setTimeout(() => { s.classList.remove('on'); s.classList.add('done'); }, 600); } };
    document.addEventListener('vigil:step', on);
    let timer = null;
    const teardown = () => { if (timer) clearTimeout(timer); timer = null; document.removeEventListener('vigil:step', on); steps().forEach(s => s.classList.remove('on', 'done')); };
    litStrip = teardown;
    timer = setTimeout(() => { teardown(); if (litStrip === teardown) litStrip = null; }, ms || 20000);
  };
  UI.list = (arr) => arr.length <= 1 ? (arr[0] || '') : arr.slice(0, -1).join(', ') + ' and ' + arr[arr.length - 1];

  window.VigilUI = UI;
})();

<script>/* js/core/audio.js */

(function () {

     gesture that starts audio also starts a looping, silent wav. Harmless anywhere it fails. */

    str(0, 'RIFF'); v.setUint32(4, 36 + n, true); str(8, 'WAVE'); str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); str(36, 'data'); v.setUint32(40, n, true);

    silence: null,
    hearth:   { root: 45, chord: [0, 7, 12, 16, 19], type: 'sine', bright: 900,  lfo: 0.06, sparkle: [0, 4, 7, 11, 14], sparkleRate: 5.5, gain: 0.16 },
    tower:    { root: 43, chord: [0, 7, 12, 14, 19], type: 'triangle', bright: 700, lfo: 0.05, sparkle: [0, 2, 7, 9, 14], sparkleRate: 6.5, gain: 0.15 },
    wonder:   { root: 48, chord: [0, 4, 7, 11, 14, 21], type: 'sine', bright: 1400, lfo: 0.09, sparkle: [0, 4, 7, 11, 16, 19], sparkleRate: 3.2, gain: 0.15 },
    dread:    { root: 38, chord: [0, 6, 12, 13], type: 'sawtooth', bright: 320, lfo: 0.035, sparkle: [0, 1, 6, 12], sparkleRate: 9, gain: 0.11 },
    tense:    { root: 41, chord: [0, 3, 7, 10, 14], type: 'triangle', bright: 800, lfo: 0.2, sparkle: [0, 3, 5, 10], sparkleRate: 2.4, gain: 0.14 },
    court:    { root: 45, chord: [0, 5, 7, 12, 16], type: 'triangle', bright: 1100, lfo: 0.07, sparkle: [0, 2, 5, 7, 9, 12], sparkleRate: 4.5, gain: 0.14 },
    sorrow:   { root: 43, chord: [0, 3, 7, 10, 15], type: 'sine', bright: 600, lfo: 0.04, sparkle: [0, 3, 7, 10, 12], sparkleRate: 7, gain: 0.14 },
    triumph:  { root: 48, chord: [0, 4, 7, 12, 16, 19], type: 'triangle', bright: 1800, lfo: 0.12, sparkle: [0, 4, 7, 12, 16, 19, 24], sparkleRate: 1.6, gain: 0.17 },
    void:     { root: 36, chord: [0, 12, 19, 24], type: 'sine', bright: 400, lfo: 0.02, sparkle: [0, 7, 12, 19], sparkleRate: 12, gain: 0.13 },

    if (!ctx) return; // will apply on init

    if (moodLayer) {
      const old = moodLayer; moodLayer = null;

    }

    if (!m) return;

    moodLayer.g.gain.setTargetAtTime(m.gain, now + 0.05, fadeSec / 3);

  };

      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = freq * h;
      const og = ctx.createGain(); og.gain.value = 1 / (i + 1) / 2;

    const f = ctx.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.value = filterFreq; f.Q.value = 0.8;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    const o = ctx.createOscillator(); o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);

    success: () => { [0, 4, 7, 12].forEach((iv, i) => setTimeout(() => bell(NOTE(72 + iv), 0.18, 2.2), i * 110)); },
    solved:  () => { [0, 7, 12, 16, 19, 24].forEach((iv, i) => setTimeout(() => bell(NOTE(64 + iv), 0.16, 3), i * 90)); noise(1.2, 0.2, 800, 'lowpass'); },
    fail:    () => { tone(220, 0.35, 0.2, 'triangle', 110); setTimeout(() => tone(160, 0.5, 0.18, 'triangle', 70), 120); },
    wrong:   () => { tone(180, 0.18, 0.15, 'square', 120); },
    chime:   () => { bell(NOTE(84), 0.16, 3); },
    boom:    () => { tone(60, 1.6, 0.6, 'sine', 28); noise(1.4, 0.5, 200, 'lowpass'); },
    whoosh:  () => { const n = noise(0.8, 0.3, 300, 'bandpass'); if (n) { n.f.frequency.exponentialRampToValueAtTime(3000, ctx.currentTime + 0.7); } },
    heart:   () => { tone(55, 0.14, 0.5, 'sine', 40); setTimeout(() => tone(52, 0.18, 0.4, 'sine', 35), 200); },
    key:     (i) => { bell(NOTE([60, 64, 67, 71][i % 4] + 12), 0.14, 0.9); },
    miss:    () => { noise(0.12, 0.3, 500, 'lowpass'); tone(90, 0.12, 0.25, 'square', 60); },
    alarm:   () => { tone(880, 0.12, 0.12, 'square'); setTimeout(() => tone(880, 0.12, 0.12, 'square'), 200); },
    reveal:  () => { [0, 3, 7, 10, 14, 19].forEach((iv, i) => setTimeout(() => bell(NOTE(55 + iv), 0.14, 4), i * 160)); },
    unlock:  () => { noise(0.25, 0.4, 900, 'bandpass'); setTimeout(() => { tone(600, 0.15, 0.1, 'square'); bell(NOTE(79), 0.1, 1.5); }, 180); },
    step:    () => { noise(0.08, 0.15, 250, 'lowpass'); },
    /* a shimmer, not a chord: random within a major pentatonic so it sparkles instead of clashing */
    magic:   () => { const sc = [0, 2, 4, 7, 9, 12, 14, 16]; for (let i = 0; i < 6; i++) setTimeout(() => bell(NOTE(76 + sc[Math.floor(Math.random() * sc.length)]), 0.06, 1.2), i * 70); },
    seal:    () => { tone(110, 2.5, 0.35, 'sine', 55); [0, 7, 12].forEach((iv, i) => setTimeout(() => bell(NOTE(52 + iv), 0.25, 5), i * 400)); },
  };
  Audio.sfx = function (name, arg) { if (!ctx || muted) return; const f = SFX[name]; if (f) try { f(arg); } catch (e) {} };
  Audio.note = function (midi, dur, vol) { if (!ctx || muted) return; bell(NOTE(midi), vol || 0.15, dur || 1.5); };
  Audio.moods = Object.keys(MOODS);

  window.VigilAudio = Audio;
})();

/* Shared between Hearth and Companion: opaque tokens, attunement casts, helpers. */
(function () {
  'use strict';
  const S = {};
  const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 32 symbols, no O/0/I/1

  function fnv(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h >>> 0;
  }
  function code4(str) {
    let h = fnv('vigil:' + str); let out = '';
    for (let i = 0; i < 4; i++) { out += ALPHA[h % 32]; h = Math.floor(h / 32); if (h < 32) h = fnv(str + i); }
    return out;
  }
  S.norm = (s) => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  S.fnv = fnv; S.ALPHA = ALPHA;

  /* ---------- Tokens (phone -> Hearth). Deterministic opaque 4-char code for (channel, value), unique within `values`. ---------- */
  S.token = function (channel, value, values) {
    let salt = 0;
    while (true) {
      const mine = code4(channel + '|' + value + '|' + salt);
      const clash = values.some(v => v !== value && code4(channel + '|' + v + '|' + salt) === mine);
      if (!clash) return mine;
      salt++;
    }
  };
  S.decode = function (channel, token, values) {
    token = S.norm(token);
    for (const v of values) if (S.token(channel, v, values) === token) return v;
    return null;
  };

  /* ---------- Casts (Hearth -> phone). 6 data bits + 9-bit checksum bound to the word -> 3 symbols. ---------- */
  S.cast = function (word, bits) {
    let data = Array.isArray(bits) ? bits.reduce((a, b, i) => a | ((b ? 1 : 0) << i), 0) : (bits | 0);
    data &= 63;
    const check = fnv('cast|' + S.norm(word) + '|' + data + '|' + fnv(String(data * 7919 + word.length)) ) & 511;
    const v = data | (check << 6); // 15 bits
    return ALPHA[v & 31] + ALPHA[(v >> 5) & 31] + ALPHA[(v >> 10) & 31];
  };
  S.uncast = function (word, cast) {
    cast = S.norm(cast); if (cast.length !== 3) return null;
    const a = ALPHA.indexOf(cast[0]), b = ALPHA.indexOf(cast[1]), c = ALPHA.indexOf(cast[2]); if (a < 0 || b < 0 || c < 0) return null;
    const v = a | (b << 5) | (c << 10); const data = v & 63, check = (v >> 6) & 511;
    if ((fnv('cast|' + S.norm(word) + '|' + data + '|' + fnv(String(data * 7919 + word.length))) & 511) !== check) return null;
    return data;
  };

  S.bits = (data, i, n) => (data >> i) & ((1 << n) - 1);
  S.pack = function (spec, state) {
    // spec: [{bit, n?, key}] ; state: object of flags (booleans or small ints)
    let d = 0;
    for (const f of spec) { const v = state[f.key]; const n = f.n || 1; const iv = typeof v === 'boolean' ? (v ? 1 : 0) : (v | 0); d |= (iv & ((1 << n) - 1)) << f.bit; }
    return d & 63;
  };
  S.unpack = function (spec, data) { const o = {}; for (const f of spec) { const n = f.n || 1; const v = (data >> f.bit) & ((1 << n) - 1); o[f.key] = n === 1 ? !!v : v; } return o; };

  window.VigilShared = S;
})();

</script>

<script>/* js/content/glyphs.js */
/* The Founders' Tongue: four shapes, each read two ways by orientation.
   Flame: ASH (upright) / COLD (inverted) · Spike: THORN / WELL · Hook: KNOT / VEIL · Crown: CROWN / EMBER.
   Shapes are drawn in a -20..20 box, deliberately asymmetric top-to-bottom so inversion (rotate 180°) is visible.
   Shared by Hearth and Companion. */
(function () {
  'use strict';
  const G = {};
  const st = 'fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"';
  const SHAPES = {
    Flame: `<path d="M0,-16 C6,-8 10,-2 10,4 C10,11 5,15 0,15 C-5,15 -10,11 -10,4 C-10,-2 -6,-8 0,-16 Z" ${st}/><path d="M0,15 L0,4" ${st}/>`,
    Spike: `<path d="M0,-16 L7,-4 L2,-4 L2,10 L-2,10 L-2,-4 L-7,-4 Z" ${st}/><path d="M-11,15 L11,15" ${st}/>`,
    Hook:  `<path d="M2,15 L2,-8 C2,-14 -5,-15 -8,-10" ${st}/><path d="M-5,15 L9,15" ${st}/>`,
    Crown: `<path d="M-13,12 L-13,-4 L-6,3 L0,-14 L6,3 L13,-4 L13,12 Z" ${st}/>`,
  };
  // glyph name -> {shape, inverted}
  const GLYPHS = {
    ASH:   { shape: 'Flame', inv: false, step: 0, gloss: 'fire; the Hearth; warmth' },
    COLD:  { shape: 'Flame', inv: true,  step: null, gloss: 'the cold; the wound; the space left when warmth goes; a hollow' },
    THORN: { shape: 'Spike', inv: false, step: 1, gloss: 'a gate; to go through' },
    WELL:  { shape: 'Spike', inv: true,  step: 4, gloss: 'down; a going-down; from' },
    KNOT:  { shape: 'Hook',  inv: false, step: 2, gloss: 'bound; together; four-as-one' },
    VEIL:  { shape: 'Hook',  inv: true,  step: 5, gloss: 'hidden; apart; behind' },
    CROWN: { shape: 'Crown', inv: false, step: 6, gloss: 'one; the first; the chosen; the Chair' },
    EMBER: { shape: 'Crown', inv: true,  step: 3, gloss: 'what remains; to keep; to close' },
  };
  const PAIR = { ASH: 'COLD', COLD: 'ASH', THORN: 'WELL', WELL: 'THORN', KNOT: 'VEIL', VEIL: 'KNOT', CROWN: 'EMBER', EMBER: 'CROWN' };
  const ORDER = ['ASH', 'THORN', 'KNOT', 'EMBER', 'WELL', 'VEIL', 'CROWN', 'COLD']; // ladder order (COLD = rest)
  const LADDER = ['ASH', 'THORN', 'KNOT', 'EMBER', 'WELL', 'VEIL', 'CROWN'];
  const MIDI = { ASH: 72, THORN: 74, KNOT: 76, EMBER: 77, WELL: 79, VEIL: 81, CROWN: 83, COLD: null };

  G.SHAPES = SHAPES; G.GLYPHS = GLYPHS; G.PAIR = PAIR; G.ORDER = ORDER; G.LADDER = LADDER; G.MIDI = MIDI;
  G.names = Object.keys(GLYPHS);
  G.invert = (name) => PAIR[name];
  G.shapeOf = (name) => GLYPHS[name].shape;
  /* Read a shape in a given orientation: upright gives the base glyph, inverted gives its pair. */
  G.read = (shape, inverted) => { for (const n in GLYPHS) if (GLYPHS[n].shape === shape && GLYPHS[n].inv === !!inverted) return n; return null; };

  /* Inner SVG fragment for a glyph name (already oriented). Use inside <svg viewBox="-20 -20 40 40">. */
  G.inner = function (name, opts) {
    opts = opts || {};
    const g = GLYPHS[name]; if (!g) return `<text y="6" text-anchor="middle" font-size="12" fill="currentColor">${name}</text>`;
    const rot = (g.inv ? 180 : 0) + (opts.rot || 0);
    return `<g transform="rotate(${rot})">${SHAPES[g.shape]}</g>`;
  };
  /* Inner SVG for a raw shape drawn as carved (physically): upright or physically inverted. */
  G.shapeInner = function (shape, physInverted, opts) { return `<g transform="rotate(${physInverted ? 180 : 0})">${SHAPES[shape]}</g>`; };

  /* Standalone <svg> for a glyph. */
  G.svg = function (name, opts) {
    opts = opts || {};
    const size = opts.size || 40, color = opts.color || 'currentColor';
    return `<svg viewBox="-20 -20 40 40" width="${size}" height="${size}" style="color:${color};display:inline-block;vertical-align:middle;overflow:visible" class="fg-glyph">${G.inner(name, opts)}${opts.worn ? '<rect x="-20" y="-20" width="40" height="40" fill="rgba(11,10,16,0.45)"/>' : ''}</svg>`;
  };
  G.shapeSvg = function (shape, physInverted, opts) {
    opts = opts || {};
    const size = opts.size || 40, color = opts.color || 'currentColor';
    return `<svg viewBox="-20 -20 40 40" width="${size}" height="${size}" style="color:${color};display:inline-block;vertical-align:middle;overflow:visible" class="fg-glyph">${G.shapeInner(shape, physInverted)}</svg>`;
  };

  /* An inscription: a row of carved shapes. Each item {shape, inv:boolean(physically inverted), worn?, hidden?}.
     mark: 'left' | 'right' | null (drawn only if showMark). Returns <svg>. */
  G.inscription = function (items, opts) {
    opts = opts || {};
    const cell = 56, h = 72, w = items.length * cell + 40;
    let s = `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;display:block;margin:0 auto" class="inscription-svg">`;
    s += `<rect x="2" y="2" width="${w - 4}" height="${h - 4}" rx="6" fill="rgba(0,0,0,0.35)" stroke="rgba(212,169,78,0.25)"/>`;
    items.forEach((it, i) => {
      const x = 20 + i * cell + cell / 2, y = h / 2;
      if (it.hidden) { s += `<rect x="${x - 22}" y="${y - 22}" width="44" height="44" fill="#3a3540" rx="3"/><text x="${x}" y="${y + 5}" text-anchor="middle" font-size="10" fill="#8a8090" font-family="Cinzel,serif">SHIELD</text>`; return; }
      s += `<g transform="translate(${x},${y}) scale(1.1)" style="color:${it.color || (opts.color || '#e9e2d2')}" opacity="${it.worn ? 0.5 : 1}">${G.shapeInner(it.shape, it.inv)}</g>`;
      if (it.label) s += `<text x="${x}" y="${h - 6}" text-anchor="middle" font-size="9" fill="rgba(233,226,210,0.5)" font-family="Cinzel,serif">${it.label}</text>`;
    });
    if (opts.showMark && opts.mark) { const mx = opts.mark === 'left' ? 10 : w - 10; s += `<path d="M${mx},${h / 2 - 8} L${mx + (opts.mark === 'left' ? 6 : -6)},${h / 2} L${mx},${h / 2 + 8} Z" fill="${opts.markColor || '#9b7bd8'}"/>`; }
    return s + `</svg>`;
  };

  /* Reading helpers (deterministic): naive reads each shape as physically shown; turned reads right-to-left and inverts every reading. */
  G.readNaive = (items) => items.map(it => G.read(it.shape, it.inv));
  G.readTurned = (items) => items.slice().reverse().map(it => G.invert(G.read(it.shape, it.inv)));
  G.readLine = (items, mark) => mark === 'right' ? G.readTurned(items) : G.readNaive(items);

  /* Steps between consecutive glyphs on the ladder. Returns an array with one entry per glyph after the first:
     a number (the step from the last glyph that sounded), 'rest' (this glyph is COLD, a pause), or 'start'
     (this glyph sounds first — only when the row opens with a rest). A rest is a pause, not a reset: the glyph
     after it is measured from the last one that sounded. */
  G.steps = function (names) {
    const out = []; let last = null;
    for (let i = 0; i < names.length; i++) {
      const g = GLYPHS[names[i]]; const s = g ? g.step : null;
      if (i === 0) { if (s != null) last = s; continue; }
      if (s == null) out.push('rest');
      else if (last == null) { out.push('start'); last = s; }
      else { out.push(s - last); last = s; }
    }
    return out;
  };
  G.stepsText = (names) => G.steps(names).map(s => s === 'rest' ? 'then a rest' : s === 'start' ? 'then it begins' : s === 0 ? 'the same' : (s > 0 ? 'up ' + s : 'down ' + (-s))).join(', ');
  /* Which orderings of a set match a contour? (used to verify uniqueness) */
  G.orderingsMatching = function (set, contour) {
    const res = []; const perm = (arr, m) => { if (!arr.length) { if (JSON.stringify(G.steps(m)) === JSON.stringify(contour)) res.push(m.slice()); return; } arr.forEach((x, i) => perm(arr.slice(0, i).concat(arr.slice(i + 1)), m.concat([x]))); };
    perm(set, []);
    const seen = new Set(); return res.filter(m => { const k = m.join(','); if (seen.has(k)) return false; seen.add(k); return true; });
  };

  window.VigilGlyphs = G;
})();

</script>

<script>/* js/content/companion/book.js */
/* Companion persistent pages (the BOOK tab) and shared phone audio helpers. */
(function () {
  'use strict';
  const G = window.VigilGlyphs, L = window.VigilLore, UI = window.VigilUI;
  window.CompanionContent = window.CompanionContent || { chapters: [], bookExtras: [] };
  const C = window.CompanionContent;
  C.bookExtras = C.bookExtras || [];

  /* ---------- audio helpers ---------- */
  const CA = {};
  /* A step is a number (up/down the ladder), 'rest' (a pause) or 'start' (the first note after an opening rest).
     Anything else — or a number that is not finite — is drawn as a start and played as nothing, never as NaN. */
  CA.stepKind = function (s) {
    if (s === 'rest') return { kind: 'rest' };
    const v = typeof s === 'number' ? s : (typeof s === 'string' && /^[-+]?\d+$/.test(s.trim()) ? parseInt(s, 10) : NaN);
    return Number.isFinite(v) ? { kind: 'step', v } : { kind: 'start' };
  };
  CA.stepLabel = (s) => { const k = CA.stepKind(s); return k.kind === 'rest' ? 'rest' : k.kind === 'start' ? 'begins' : (k.v > 0 ? '+' + k.v : String(k.v)); };
  CA.strip = function (steps) {
    return `<div class="arrow-strip">${steps.map(s => { const k = CA.stepKind(s); if (k.kind === 'rest') return '<span class="step rest"><b>—</b>rest</span>'; if (k.kind === 'start') return '<span class="step start"><b>◆</b>begins</span>'; return `<span class="step${k.v === 0 ? ' same' : ''}"><b>${k.v > 0 ? '▲' : k.v < 0 ? '▼' : '='}</b>${k.v > 0 ? 'up ' + k.v : k.v < 0 ? 'down ' + (-k.v) : 'same'}</span>`; }).join('')}</div>`;
  };
  /* Tell whichever strip is listening that step i (0-based, in the array the strip was drawn from) is sounding now. */
  CA.announce = function (i, extra) { try { document.dispatchEvent(new CustomEvent('vigil:step', { detail: Object.assign({ step: i }, extra || {}) })); } catch (e) {} };
  /* Every note the helpers schedule goes through CA.later, so a new press (UI.stopAudio → 'vigil:stop') can drop
     the rest of the phrase that was playing. Content that chains its own timeouts should use CA.later too. */
  let pending = [];
  CA.later = function (fn, ms) { const id = setTimeout(() => { pending = pending.filter(x => x !== id); fn(); }, ms); pending.push(id); return id; };
  CA.stop = function () { pending.forEach(clearTimeout); pending = []; };
  try { document.addEventListener('vigil:stop', CA.stop); } catch (e) {}
  /* Play a contour of steps relative to a starting pitch (room-tuned: absolute pitch varies per call).
     Returns the length of the phrase in ms. opts.offset shifts the announced step index (for a second voice). */
  CA.playSteps = function (Audio, steps, base, opts) {
    Audio.init(); if (Audio.isMuted()) Audio.setMuted(false);
    const off = (opts && opts.offset) || 0;
    let midi = base || (60 + Math.floor(Math.random() * 7));
    const ladder = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19, 21, 23];
    let idx = 4; // start mid-ladder
    const at = (k) => { const oct = Math.floor(k / 7), d = ((k % 7) + 7) % 7; return midi + oct * 12 + ladder[d]; };
    Audio.note(at(idx), 1.0, 0.18);
    let t = 650;
    steps.forEach((s, i) => {
      const k = CA.stepKind(s);
      if (k.kind === 'rest') { const tt = t; CA.later(() => CA.announce(off + i, { rest: true }), tt); t += 700; return; }
      if (k.kind === 'step') idx += k.v; // 'start' keeps the pitch and just sounds
      const m = at(idx), tt = t; CA.later(() => { Audio.note(m, 1.0, 0.18); CA.announce(off + i); }, tt); t += 650;
    });
    return t + 500;
  };
  /* Play glyphs by their own pitch (the Book's row-player); COLD is a silent beat. Returns the length in ms. */
  CA.playGlyphs = function (Audio, names) { Audio.init(); if (Audio.isMuted()) Audio.setMuted(false); let t = 0; names.forEach((n, i) => { const m = G.MIDI[n]; const tt = t; CA.later(() => { if (m) Audio.note(m, 1.0, 0.18); if (i > 0) CA.announce(i - 1, m ? {} : { rest: true }); }, tt); t += 650; }); return t + 500; };
  CA.heartbeat = function (Audio, bpm, beats) { Audio.init(); if (Audio.isMuted()) Audio.setMuted(false); if (!bpm) return 0; const iv = 60000 / bpm, n = beats || 8; for (let i = 0; i < n; i++) CA.later(() => Audio.sfx('heart'), i * iv); return n * iv + 300; };
  CA.pulses = function (Audio, n, gapMs) { Audio.init(); if (Audio.isMuted()) Audio.setMuted(false); n = n | 0; const gap = gapMs || 420; for (let i = 0; i < n; i++) CA.later(() => Audio.sfx('chime'), i * gap); return n * gap + 400; };
  window.CompanionAudio = CA;

  /* ---------- shared drawing helpers ---------- */
  const D = {};
  D.trace = (kind) => { // heartbeat trace svg
    if (kind === 'flat') return `<svg viewBox="0 0 120 22" class="trace"><path d="M0,11 L120,11" stroke="#4fb3bf" stroke-width="1.5" fill="none" opacity=".6"/></svg>`;
    const fast = kind === 'fast'; let d = 'M0,11 '; const n = fast ? 5 : 3; for (let i = 0; i < n; i++) { const x = 8 + i * (110 / n); d += `L${x},11 L${x + 4},3 L${x + 8},19 L${x + 12},11 `; } d += 'L120,11';
    return `<svg viewBox="0 0 120 22" class="trace"><path d="${d}" stroke="#4fb3bf" stroke-width="1.5" fill="none"/></svg>`;
  };
  D.glyphCard = (name, size) => `<div class="lx"><div>${G.svg(name, { size: size || 40, color: '#f2d27a' })}</div><div><b>${name}</b><span>${G.GLYPHS[name].gloss}</span></div></div>`;
  window.CompanionDraw = D;

  /* ---------- BOOK tab ---------- */
  C.book = function (roleId, ctx) {
    const blocks = [];
    const n = ctx.maxChapter;
    if (roleId === 'reader') {
      blocks.push({ t: 'h', text: 'The Lexicon — four shapes, read two ways' });
      blocks.push({ t: 'fine', text: 'Upright, a shape reads as the first word; **turned** (rotated), as the second. A carved line with its mark on the **left** is read upright, left to right. With the mark on the **right** it is *turned*: read right to left, and every glyph inverts.' });
      blocks.push({ t: 'html', html: `<div class="lexicon">${['ASH', 'THORN', 'KNOT', 'CROWN'].map(u => D.glyphCard(u) + D.glyphCard(G.PAIR[u])).join('')}</div>` });
      blocks.push({ t: 'fine', text: 'Shapes: **Flame** = ASH / COLD · **Spike** = THORN / WELL · **Hook** = KNOT / VEIL · **Crown** = CROWN / EMBER.' });
      blocks.push({ t: 'h', text: 'Glossary' });
      const gl = [['WREN', n >= 4 ? 'the Vigil roll spells it WRENN in the older alphabet: *the hollow of a bell; the space that rings*' : 'the child\'s name. Written on the dormitory door in the older alphabet, which you have not learned.']];
      // Plinth order, not the order the vault door wants, and not before the door is behind them:
      // this entry used to name the door's own answer sequence from the scene before the puzzle.
      /* The plinth order, hand-copied out of Chapter II. It moved: ch2's CUTFOR was [2,3,4,1], which
         is the floor turned one sunwise -- the single idiom a Seer-less table reaches for, and the
         shipped answer was that guess, so a recorded 1-in-23 was really 1-in-3. CUTFOR is [3,4,2,1]
         now and WORDS moved with it (js/content/ch2.js:88), so this line was the Reader's permanent
         Book contradicting the Reader's own Chapter II page from Chapter III onward. It is gated
         n >= 3, so it was never visible during ch2 itself, which is why nothing caught it. */
      if (n >= 3) gl.push(['THE FOUNDERS\' GLYPHS', 'plinth 1 \u2014 THORN \u00b7 plinth 2 \u2014 VEIL \u00b7 plinth 3 \u2014 EMBER \u00b7 plinth 4 \u2014 KNOT (from the vault door)']);
      blocks.push({ t: 'list', items: gl.map(([k, v]) => `**${k}** — ${v}`) });
      blocks.push({ t: 'h', text: 'The Older Alphabet' });
      blocks.push(n >= 4 ? { t: 'p', text: 'Learned from the Provost\'s primer (Chapter IV). A simple substitution: each old letter is the modern letter shown beside it on the primer page.' } : { t: 'fine', text: '*Locked — "You have not learned it yet."*' });
    }
    if (roleId === 'listener') {
      blocks.push({ t: 'h', text: 'The Ladder' });
      blocks.push({ t: 'fine', text: 'The Founders\' Tongue is a ladder of seven steps and a rest. You never hear a glyph\'s *name* — every room is tuned differently — only how far the tune **steps** from one glyph to the next. COLD is the rest.' });
      blocks.push({ t: 'html', html: `<div class="lexicon">${G.LADDER.map((nm, i) => `<div class="lx"><div>${G.svg(nm, { size: 36, color: '#4fb3bf' })}</div><div><b>${nm}</b><span>step ${i}</span></div></div>`).join('')}<div class="lx"><div>${G.svg('COLD', { size: 36, color: '#4fb3bf' })}</div><div><b>COLD</b><span>a rest — no step</span></div></div></div>` });
      blocks.push({ t: 'fine', text: 'So THORN (1) to KNOT (2) is *up one*; KNOT (2) to VEIL (5) is *up three*; VEIL (5) to EMBER (3) is *down two*. A rest is a pause, not a new start: the step after it is counted from the last glyph that sounded.' });
      blocks.push({ t: 'h', text: 'Row-player' });
      blocks.push({ t: 'custom', render: (el, cx) => {
        el.appendChild(UI.el('p', { class: 'fine', text: 'Tap glyphs in an order to hear how that row would step. Compare it with the room\'s phrase by ear or by the arrows.' }));
        const row = []; const seqEl = UI.el('div', { class: 'seq-list' }); const grid = UI.el('div', { class: 'pick-grid' });
        const render = () => { UI.clear(seqEl); if (!row.length) seqEl.appendChild(UI.el('span', { class: 'seq-empty', text: 'No glyphs yet.' })); row.forEach(nm => seqEl.appendChild(UI.el('span', { class: 'seq-chip', text: nm }))); };
        G.ORDER.forEach(nm => grid.appendChild(UI.el('div', { class: 'pk', html: G.svg(nm, { size: 40, color: '#4fb3bf' }) + '<div>' + nm + '</div>', onclick: () => { row.push(nm); render(); } })));
        el.appendChild(grid); el.appendChild(seqEl);
        const strip = UI.el('div', { class: 'strip' });
        const showSteps = () => { if (row.length < 2) { strip.innerHTML = '<p class="fine">Tap at least two glyphs to see a step.</p>'; return; } strip.innerHTML = CA.strip(G.steps(row)) + '<p class="fine">' + UI.esc(G.stepsText(row)) + '.</p>'; };
        el.appendChild(UI.el('div', { class: 'row' }, [
          UI.audioButton('Play row', () => { showSteps(); if (!row.length) return 0; const len = CA.playGlyphs(window.VigilAudio, row); UI.lightStrip(strip, len); return len; }, { cls: 'small' }),
          UI.el('button', { class: 'btn small ghost', text: 'Show steps', onclick: showSteps }),
          UI.el('button', { class: 'btn small ghost', text: 'Clear', onclick: () => { row.length = 0; render(); strip.innerHTML = ''; } }),
        ]));
        el.appendChild(strip); render();
      } });
      blocks.push({ t: 'h', text: 'Heartbeats' });
      blocks.push({ t: 'fine', text: 'Every heart in a room, when you listen for it. The pages of each chapter list who is present.' });
    }
    if (roleId === 'seer') {
      blocks.push({ t: 'h', text: 'The Ring Page' });
      blocks.push({ t: 'fine', text: 'Every ring carries cuts somewhere — a scratch, a notch, a chip in the glaze. Finding them is yours. What each one obliges is Law, and the Laws are the Binder\'s. Slots are numbered from the top, the way a clock counts. An inscription\'s mark sits at one end: on the **left**, the line is upright; on the **right**, the line was carved *turned* — the Reader must read it right to left with every glyph inverted, and the Binder\'s Laws say where a turned line is placed.' });
      blocks.push({ t: 'svg', cls: 'underlayer', svg: `<svg viewBox="0 0 320 200"><circle cx="100" cy="100" r="70" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M100,22 a78,78 0 0 1 55,23" fill="none" stroke="#fff" stroke-width="2"/><path d="M155,45 l-9,-2 l3,9 z" fill="#fff"/><text x="100" y="18" text-anchor="middle" fill="#fff" font-size="11" font-family="Cinzel,serif">sunwise = clockwise</text>${[0, 1, 2, 3].map(i => { const a = (i / 4 * 360 - 90) * Math.PI / 180; return `<circle cx="${100 + Math.cos(a) * 70}" cy="${100 + Math.sin(a) * 70}" r="12" fill="none" stroke="#fff"/><text x="${100 + Math.cos(a) * 70}" y="${104 + Math.sin(a) * 70}" text-anchor="middle" fill="#fff" font-size="11">${i + 1}</text>`; }).join('')}<path d="M182,100 l10,-6 l0,12 z" fill="#a482e6"/><text x="196" y="126" text-anchor="middle" fill="#a482e6" font-size="9" font-family="Cinzel,serif">a mark — on some other ring</text><g transform="translate(200,60)"><rect x="0" y="0" width="110" height="34" rx="4" fill="none" stroke="#fff"/><path d="M-4,17 l-8,-6 l0,12 z" fill="#a482e6"/><text x="55" y="22" text-anchor="middle" fill="#fff" font-size="10" font-family="Cinzel,serif">mark left · upright</text></g><g transform="translate(200,120)"><rect x="0" y="0" width="110" height="34" rx="4" fill="none" stroke="#fff"/><path d="M114,17 l8,-6 l0,12 z" fill="#a482e6"/><text x="55" y="22" text-anchor="middle" fill="#fff" font-size="10" font-family="Cinzel,serif">mark right · turned</text></g></svg>` });
      blocks.push({ t: 'h', text: 'Shadows' });
      blocks.push({ t: 'fine', text: 'Under-Sight shows what is beneath a room: doors under plaster, sockets under rebuilt stone, and shadows as they truly fall. Look at every shadow. Say what you see.' });
    }
    if (roleId === 'binder') {
      blocks.push({ t: 'h', text: 'The Book of Laws' });
      blocks.push({ t: 'fine', text: 'Every Law is dated: **Founders\'** (Year 0) or **Order\'s** (Year 212 or 340). Law 3: where two Laws disagree, the older binds.' });
      const laws = L.lawsUpTo(L.chapters[Math.max(0, Math.min(8, n))].id);
      const struckRestored = !!(ctx.flags && ctx.flags.LAW0) || (ctx.state.unlocked && Object.values(ctx.state.unlocked).some(u => u.flags && u.flags.LAW0));
      const render = (list) => `<div class="laws">${list.map(l => `<div class="law ${l.era === 'O' ? 'order' : 'founders'}${l.struck && !struckRestored ? ' struck' : ''}"><div class="era">Law ${l.n} · ${l.era === 'F' ? 'Founders\' · Year 0' : 'Order\'s · Year ' + l.year}${l.struck ? (struckRestored ? ' · RESTORED' : ' · STRUCK') : ''}</div><div class="txt">${UI.esc(l.text)}</div>${l.struck ? `<div class="fine">${struckRestored ? 'Older than Law 6. The older binds.' : UI.esc(l.note)}</div>` : ''}</div>`).join('')}</div>`;
      blocks.push({ t: 'h', text: 'In the order learned' });
      blocks.push({ t: 'html', html: render(laws) });
      blocks.push({ t: 'h', text: 'By year' });
      blocks.push({ t: 'html', html: render(laws.slice().sort((a, b) => a.year - b.year || a.n - b.n)) });
      blocks.push({ t: 'h', text: 'Threads' });
      blocks.push({ t: 'fine', text: 'Grey — grief, or a goodbye already said. Gold — the Crown\'s coin or favour. Red — an oath. No thread — unbound; or, once, "not unbound: the knot itself."' });
    }
    (C.bookExtras || []).forEach(fn => { try { const b = fn(roleId, ctx); if (b && b.length) blocks.push(...b); } catch (e) { console.error(e); } });
    return blocks;
  };
})();

</script>
<script>/* js/content/companion/ch0.js */
/* Companion — Prologue (KINDLE). Four pages, one puzzle fact each: the Reader has the words,
   the Listener the order, the Seer the cuts, the Binder the rule. No page holds another's answer. */
(function () {
  'use strict';
  const G = window.VigilGlyphs, L = window.VigilLore, CA = window.CompanionAudio, D = window.CompanionDraw;
  const C = window.CompanionContent;

  /* The lamp's collar, drawn as a ring so the page cannot imply an order.
     Crown sits left, Flame right — the reverse of the answer, so reading left to right fails. */
  const collar = () => `<svg viewBox="0 0 300 176">
    <circle cx="150" cy="88" r="62" fill="none" stroke="rgba(212,169,78,.35)" stroke-width="11"/>
    <g transform="translate(88,88) scale(1.15)" style="color:#f2d27a">${G.shapeInner('Crown', true)}</g>
    <g transform="translate(212,88) scale(1.15)" style="color:#f2d27a">${G.shapeInner('Flame', false)}</g>
    <text x="150" y="170" text-anchor="middle" fill="rgba(233,226,210,.55)" font-size="11" font-family="Cinzel,serif">the band runs all the way round \u00b7 no first, no last</text>
  </svg>`;

  /* The Listener's interval, drawn: two rungs of the ladder and the climb between them. */
  const ladder3 = () => `<svg viewBox="0 0 200 96" style="width:170px;height:82px">
    ${[0, 1, 2, 3, 4].map(i => `<line x1="30" y1="${84 - i * 16}" x2="86" y2="${84 - i * 16}" stroke="rgba(255,255,255,.25)" stroke-width="2"/>`).join('')}
    <circle cx="58" cy="84" r="7" fill="#4fb3bf"/><circle cx="58" cy="36" r="7" fill="#4fb3bf"/>
    <path d="M110,84 L110,36" stroke="#4fb3bf" stroke-width="2"/><path d="M110,30 l-5,10 l10,0 Z" fill="#4fb3bf"/>
    <text x="132" y="46" fill="#4fb3bf" font-size="18" font-family="Cinzel,serif">+3</text>
    <text x="58" y="16" text-anchor="middle" fill="rgba(255,255,255,.55)" font-size="9" font-family="Cinzel,serif">second note</text>
  </svg>`;

  /* The Binder's rule, drawn: a ring, a mark, and the count running clockwise from it. */
  const lawRing = () => `<svg viewBox="0 0 150 150" style="width:130px;height:130px">
    <circle cx="75" cy="75" r="46" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
    ${[0, 1, 2, 3].map(i => { const a = (i / 4 * 360 - 135) * Math.PI / 180, x = 75 + Math.cos(a) * 46, y = 75 + Math.sin(a) * 46;
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="11" fill="${i === 0 ? 'rgba(164,130,230,.25)' : 'none'}" stroke="${i === 0 ? '#a482e6' : 'rgba(255,255,255,.4)'}" stroke-width="1.5"/><text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="middle" fill="#fff" font-size="11" font-family="Cinzel,serif">${i + 1}</text>`; }).join('')}
    <path d="M96,18 a60,60 0 0 1 34,40" fill="none" stroke="#a482e6" stroke-width="2"/><path d="M130,58 l-8,-3 l1,9 Z" fill="#a482e6"/>
    <text x="40" y="24" text-anchor="middle" fill="#a482e6" font-size="9" font-family="Cinzel,serif">the mark</text>
    <text x="75" y="142" text-anchor="middle" fill="rgba(255,255,255,.6)" font-size="9" font-family="Cinzel,serif">first word in it, then clockwise</text>
  </svg>`;

  /* A thread, drawn three ways: whole, broken, absent. */
  const threadLine = (kind) => `<svg viewBox="0 0 90 16" style="width:74px;height:14px;vertical-align:middle">${
    kind === 'whole' ? '<path d="M4,8 C24,2 34,14 52,8 S74,4 86,8" fill="none" stroke="#d96b4a" stroke-width="2.5" stroke-linecap="round"/>'
    : kind === 'broken' ? '<path d="M4,8 C16,3 24,12 36,9" fill="none" stroke="#d96b4a" stroke-width="2.5" stroke-linecap="round"/><path d="M56,9 C68,6 76,11 86,8" fill="none" stroke="#d96b4a" stroke-width="2.5" stroke-linecap="round"/>'
    : '<path d="M6,2 L2,2 L2,14 L6,14 M84,2 L88,2 L88,14 L84,14" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>'
  }</svg>`;

  // Seer under-layer of the dormitory: four shadows away from the lamp, Wren's toward it.
  const underDorm = `<svg viewBox="0 0 360 220">
    <rect width="360" height="220" fill="#000"/>
    <g stroke="#fff" fill="none" stroke-width="1.2">
      <rect x="10" y="10" width="340" height="200"/>
      <rect x="20" y="30" width="60" height="30"/><rect x="20" y="90" width="60" height="30"/><rect x="20" y="150" width="60" height="30"/><rect x="280" y="30" width="60" height="30"/>
      <circle cx="300" cy="150" r="14"/><path d="M300,136 L300,120 M292,124 L308,124"/>
      <text x="300" y="185" text-anchor="middle" fill="#fff" font-size="10" font-family="Cinzel,serif">the lamp</text>
    </g>
    <g fill="#fff" opacity=".9">
      <circle cx="120" cy="100" r="6"/><circle cx="160" cy="70" r="6"/><circle cx="170" cy="140" r="6"/><circle cx="210" cy="110" r="6"/><circle cx="240" cy="150" r="6"/>
    </g>
    <g stroke="#fff" stroke-width="3" opacity=".55" stroke-linecap="round">
      <path d="M120,100 L80,88"/><path d="M160,70 L124,52"/><path d="M170,140 L134,138"/><path d="M210,110 L178,96"/>
    </g>
    <g stroke="#a482e6" stroke-width="3" opacity=".9" stroke-linecap="round"><path d="M240,150 L276,150"/></g>
    <g fill="#fff" font-size="9" font-family="Cinzel,serif"><text x="112" y="118">Reader</text><text x="150" y="60">Listener</text><text x="158" y="158">Seer</text><text x="202" y="128">Binder</text><text x="230" y="168" fill="#a482e6">Wren</text></g>
    <text x="180" y="210" text-anchor="middle" fill="#fff" font-size="9" font-family="Cinzel,serif" opacity=".7">shadows, as they fall</text>
  </svg>`;

  /* Under the lamp's foot: four sockets, numbered as the Hearth numbers them, and TWO cuts.
     No carving, no arrow, no rule — the Seer reports cuts, not meanings. */
  const underFoot = `<svg viewBox="0 0 360 240">
    <rect width="360" height="240" fill="#000"/>
    <g transform="translate(180,120)">
      <circle r="68" fill="none" stroke="#fff" stroke-width="1.5"/>
      ${[0, 1, 2, 3].map(i => { const a = (i / 4 * 360 - 90) * Math.PI / 180, x = (Math.cos(a) * 68).toFixed(1), y = (Math.sin(a) * 68).toFixed(1), hot = i === 2;
        return `<circle cx="${x}" cy="${y}" r="16" fill="none" stroke="${hot ? '#a482e6' : '#fff'}" stroke-width="${hot ? 2.5 : 1.5}"/><text x="${x}" y="${(+y + 4).toFixed(1)}" text-anchor="middle" fill="${hot ? '#a482e6' : '#fff'}" font-size="12" font-family="Cinzel,serif">${i + 1}</text>`; }).join('')}
    </g>
    <g stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".85"><path d="M174,34 L180,24 L186,34"/></g>
    <text x="180" y="16" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="10" font-family="Cinzel,serif">a small notch</text>
    <g stroke="#a482e6" stroke-width="2.5" stroke-linecap="round"><path d="M166,214 L196,206"/><path d="M170,221 L191,215"/></g>
    <text x="180" y="236" text-anchor="middle" fill="#a482e6" font-size="10" font-family="Cinzel,serif">a scratch \u2014 long, deliberate</text>
  </svg>`;

  C.chapters.push({
    id: 'ch0',
    pages: (roleId, ctx) => {
      const P = { sight: [], wren: [], speak: [] };
      P.speak.push({ t: 'fine', text: 'Nothing to speak yet. The Hearth will tell you when.' });

      if (roleId === 'reader') {
        P.sight.push({ t: 'h', text: 'The lamp\u2019s collar' });
        P.sight.push({ t: 'p', text: 'Two shapes are cut into the brass band around the lamp\u2019s collar. The Hearth shows them worn to nothing. On your page they are clean.' });
        P.sight.push({ t: 'html', html: collar() });
        P.sight.push({ t: 'p', text: 'The band is a circle. It has no left end and no right end, so nothing about it says which shape was cut first.' });
        P.sight.push({ t: 'p', text: 'You can still read them, and that is your whole gift. The rule is simple: **a shape standing up says one word; the same shape upside down says the opposite word.**' });
        P.sight.push({ t: 'table', head: ['cut into the band', 'it says'], rows: [
          [`${G.shapeSvg('Crown', true, { size: 44, color: '#f2d27a' })} upside down`, '<b>EMBER</b> \u2014 <em>what remains; to keep; to close</em>'],
