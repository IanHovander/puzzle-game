  /* SPEAK: the finale token. Two questions when four values exist; one otherwise. */
  const finaleBlock = (ctx) => {
    const values = L.finaleValues(ctx.flags);
    if (!values) return { t: 'fine', text: 'Nothing to speak. The Envoy has stood down and no Walk was read from the stone. The fire will not ask.' };
    const channel = L.channel('finale', ctx.roleId);
    const WALKQ = 'When the ring closes, do you walk into the fire, or stay?';
    const VANEQ = 'The Envoy\'s word, to you alone: *bring the boy to my door and you live a Master.*';
    if (values.length === 2 && values[0] === 'WALK') return { t: 'choice', id: 'finale', prompt: WALKQ, options: [{ id: 'WALK', text: 'WALK' }, { id: 'STAY', text: 'STAY' }], after: 'Sealed. Nobody at the table knows which. Say the word to the Hearth when it asks, never the answer.' };
    if (values.length === 2) return { t: 'choice', id: 'finale', prompt: VANEQ, options: [{ id: 'ACCEPT', text: 'ACCEPT' }, { id: 'REFUSE', text: 'REFUSE' }], after: 'Sealed. Whatever you chose, the Hearth will say it aloud only if it binds you.' };
    return { t: 'custom', render: (el, cx) => {
      const key = 'ch7:finale';
      const draw = () => {
        UI.clear(el);
        const stored = cx.state.answers[key];
        const parts = typeof stored === 'string' ? stored.split('_') : [];
        const chosen = parts.length === 2 && ['WALK', 'STAY'].includes(parts[0]) && ['ACCEPT', 'REFUSE'].includes(parts[1]) ? stored : null;
        const w = UI.el('div', { class: 'blk-choice' });
        if (chosen) {
          const [walk, barg] = chosen.split('_');
          w.appendChild(UI.el('p', { html: UI.rich(WALKQ) }));
          w.appendChild(UI.el('div', { class: 'opts' }, [UI.el('button', { class: 'btn opt chosen', text: walk, disabled: 'true' })]));
          w.appendChild(UI.el('p', { html: UI.rich(VANEQ) }));
          w.appendChild(UI.el('div', { class: 'opts' }, [UI.el('button', { class: 'btn opt chosen', text: barg, disabled: 'true' })]));
          w.appendChild(UI.el('div', { class: 'blk-code sea' }, [UI.el('div', { class: 'label', text: 'Your sealed word — type it into the Hearth when it asks' }), UI.el('div', { class: 'word', text: Shared.token(channel, chosen, values) })]));
          w.appendChild(UI.el('p', { class: 'fine', text: 'One word answers both. Nobody at the table knows either half.' }));
          el.appendChild(w); return;
        }
        let walk = null, barg = null;
        const mk = (prompt, ids, set) => { w.appendChild(UI.el('p', { html: UI.rich(prompt) })); const o = UI.el('div', { class: 'opts' }); ids.forEach(id => o.appendChild(UI.el('button', { class: 'btn opt', text: id, onclick: () => { set(id); Array.from(o.children).forEach(b => b.classList.toggle('chosen', b.textContent === id)); seal.disabled = !(walk && barg); cx.audio.sfx('click'); } }))); w.appendChild(o); };
        mk(WALKQ, ['WALK', 'STAY'], (id) => { walk = id; });
        mk(VANEQ, ['ACCEPT', 'REFUSE'], (id) => { barg = id; });
        const seal = UI.el('button', { class: 'btn primary big-btn', text: 'Seal both', disabled: 'true', onclick: async () => { if (!walk || !barg) return; if (!(await UI.confirm('Seal these answers? They cannot be unsaid.', { ok: 'Seal them', cancel: 'Not yet' }))) return; cx.state.answers[key] = walk + '_' + barg; cx.save(); cx.audio.sfx('seal'); draw(); } });
        w.appendChild(seal);
        w.appendChild(UI.el('p', { class: 'fine', text: 'Two questions, one sealed word. Choose both, then seal.' }));
        el.appendChild(w);
      };
      draw();
    } };
  };

  C.chapters.push({
    id: 'ch7',
    pages: (roleId, ctx) => {
      const P = { sight: [], wren: [], speak: [] };
      const f = ctx.flags || {};
      const ally = !!f.VANE_ALLY, knot = !!f.OATH_KNOT, walkOn = !!f.WALK_UNLOCKED;

      /* ---------- SPEAK ---------- */
      P.speak.push({ t: 'h', text: 'The last sealed word' });
      P.speak.push({ t: 'fine', text: '*' + L.houseRule + '*' });
      if (!ally) P.speak.push({ t: 'letter', text: `"${ctx.name ? ctx.name + '. ' : ''}To you alone, and I will not say it twice. Bring the boy to my door before the fire is out and you live a Master. The others need never know who opened the door."` });
      P.speak.push(finaleBlock(ctx));
      if (walkOn) P.speak.push({ t: 'fine', text: {
        reader: 'If you walk, you will not read tomorrow. Not the door, not the lexicon, not whatever Wren leaves you.',
        listener: 'If you walk, the house goes quiet. You have never heard a quiet house.',
        seer: 'If you walk, every shadow will fall the ordinary way, and only you will remember that once they did not.',
        binder: 'If you walk, you will never see another thread. You will have to ask people what they feel.',
      }[roleId] });
      if (ally) P.speak.push({ t: 'fine', text: 'The Envoy has stood down. There is no bargain on this page, only the fire.' });

      /* ---------- SIGHT ---------- */
      if (roleId === 'reader') {
        P.sight.push({ t: 'h', text: 'The two walls' });
        P.sight.push({ t: 'p', text: 'What the fire shows worn, you see cut. Four words on each wall, and together they make one phrase of eight.' });
        P.sight.push({ t: 'table', head: ['cut into the wall', 'from one end', 'from the other'], rows: [
          [wallRow(WEST) + '<div class="fine">one wall</div>', words(WEST, 'one'), words(WEST, 'other')],
          [wallRow(EAST) + '<div class="fine">the other</div>', words(EAST, 'one'), words(EAST, 'other')],
        ] });
        P.sight.push({ t: 'fine', text: 'a wall has two ends and no beginning' });
        P.sight.push({ t: 'p', text: '**Each wall says one of those two things, and never both.** Read all four rows out loud.' });
        P.sight.push({ t: 'p', text: 'Read a wall from the wrong end and every word in it turns into its opposite.' });
        if (knot) P.sight.push({ t: 'fine', text: 'The seal at the foot of the Chair’s scroll is one word: **CROWN**.' });
        P.sight.push({ t: 'fine', text: 'Nothing on the stone says which wall speaks first, or where the phrase begins. Ask. Your lexicon is in the **Book**.' });
      }

      if (roleId === 'listener') {
        P.sight.push({ t: 'h', text: 'How it opens' });
        P.sight.push({ t: 'p', text: 'Every room tonight sang a piece of the Hymn. You have still never heard the whole of it. You have heard how it starts.' });
        P.sight.push({ t: 'audio', label: 'The first two notes', strip: CA.strip([1]), play: (A) => CA.playSteps(A, [1]), text: '**The second note is one rung above the first.** The smallest climb there is.' });
        P.sight.push({ t: 'html', html: climbOne() });
        P.sight.push({ t: 'p', text: 'So **the phrase opens by climbing one rung**. Almost nothing these walls can say opens like that — say it out loud before anybody places a word.' });
        P.sight.push({ t: 'p', text: 'Pick the wrong pair of readings and the ring is a different one. It will not sing.' });
        P.sight.push({ t: 'fine', text: 'You never hear a word’s name. Every room is tuned differently, so you only ever hear how far the tune steps. You will need the Reader.' });
      }

      if (roleId === 'seer') {
        P.sight.push({ t: 'h', text: 'Two cuts in the floor' });
        P.sight.push({ t: 'p', text: 'Under four hundred years of polish, the rim of the floor is cut in two places, by two different hands.' });
        P.sight.push({ t: 'svg', cls: 'underlayer', svg: ringCuts() });
        P.sight.push({ t: 'p', text: `A long, deliberate **scratch** at socket **${SCRATCH}**. A small **notch** at socket **${NOTCH}**. Those are the numbers the Hearth shows.` });
        P.sight.push({ t: 'p', text: 'Begin in the wrong socket and every word after it lands wrong too.' });
        P.sight.push({ t: 'fine', text: 'Which of them matters is not yours to know — that is the Binder’s half of the job. Say what is cut, and where.' });
      }

      if (roleId === 'binder') {
        P.sight.push({ t: 'h', text: 'The Law on the rim' });
        P.sight.push({ t: 'html', html: placingRule() });
        P.sight.push({ t: 'html', html: `<div class="laws">${[
          law(1, 'F', 0, 'A sigil is read sunwise from the mark.', 'Sunwise is clockwise, the way the numbers count up. The mark is the <strong>scratch</strong>. A notch is only a signature.'),
          law(8, 'F', 0, 'A Great Sigil names every glyph once.', 'Eight sockets, eight words, no word twice.'),
        ].concat(knot ? [law(7, 'F', 0, 'A sigil sworn under KNOT begins at the sworn-to.', '<strong>You swore under KNOT, to the Chair.</strong> Build the ring, then turn it whole until the Chair’s word stands where the phrase began. Ask the Reader which word.')] : []).join('')}</div>` });
        P.sight.push({ t: 'p', text: 'From the Order: where the phrase shows the cold word, that socket stays empty.' });
        P.sight.push({ t: 'p', text: '**Eight words, and no word twice.** Say that first.' });
        P.sight.push({ t: 'fine', text: 'You have no words and no numbers. Ask for both.' });
      }

      /* ---------- WREN: one anomaly, four ways, one last time ---------- */
      if (roleId === 'reader') {
        P.wren.push({ t: 'h', text: 'The word in the socket' });
        P.wren.push({ t: 'p', text: 'There is a word cut into the floor of the empty socket, in letters four hundred years older than ours. It is Wren’s name. You decided, in the study, that you had misread it. You have never misread anything in your life.' });
      }
      if (roleId === 'listener') {
        P.wren.push({ t: 'h', text: 'Eight hearts' });
        P.wren.push({ t: 'html', html: `<div class="heartbeats">${[['Reader', 'fast'], ['Listener', 'fast'], ['Seer', 'fast'], ['Binder', 'fast']].map(([n, k]) => `<div class="hb"><span>${n}</span>${D.trace(k)}</div>`).join('')}<div class="hb"><span>Wren</span>${D.trace('flat')}</div></div>` });
        P.wren.push({ t: 'p', text: 'Nine people in this chamber, and eight hearts. You stopped calling it a fault of yours somewhere around the laundry. You have still never said aloud which one is missing.' });
      }
      if (roleId === 'seer') {
        P.wren.push({ t: 'h', text: 'The shadow, still' });
        P.wren.push({ t: 'svg', cls: 'underlayer', svg: underChamber() });
        P.wren.push({ t: 'p', text: 'Every shadow in the chamber falls away from the spark. Wren’s falls toward it. You told yourself for months that it was the light. There is barely any light left to blame.' });
      }
      if (roleId === 'binder') {
        P.wren.push({ t: 'h', text: 'No thread, tonight of all nights' });
        P.wren.push({ t: 'html', html: '<ul class="blk-list">'
          + '<li>' + threadLine('whole') + ' <strong>The four of you:</strong> red, knotted, to each other.</li>'
          + '<li>' + threadLine('grey') + ' <strong>The Provost, to Wren:</strong> grey since before you were born.</li>'
          + '<li>' + threadLine('none') + ' <strong>Wren, to anyone:</strong> nothing at all.</li>'
          + '</ul>' });
        P.wren.push({ t: 'p', text: 'You decided years ago that your gift had a blind spot. It does not.' });
      }

      return P;
    },
  });
})();

</script>
<script>/* js/content/companion/ch8.js */
/* Companion — Epilogue (WREN·cast). Four parallel private goodbyes, not four complementary facts:
   the Reader gets three shapes to keep and not read, the Listener the heartbeat that was never there,
   the Seer the shadow drawn the right way at last, the Binder the thread with something on the far
   end of it. There is nothing to solve, so R11.11's union-sufficiency test does not apply and a
   missing phone costs that player their letter and blocks nothing.
   Branches: ENDING (the cast), the phone's own ch7 finale token, and the player's first name. The
   phone is NEVER asked a question about the night -- the ch8 cast is three bits of ENDING and
   lore.js is frozen, so where the phone cannot know, the page says something true either way.
   DELIBERATE, DO NOT 'FIX': the E=0 Seer under-layer draws FIVE shadows falling away from the fire,
   Wren's included, against docs/CONVENTIONS.md §4. That inversion is the payoff of the Seer's
   running anomaly from ch0 to ch7, and the caption says so. */
(function () {
  'use strict';
  const G = window.VigilGlyphs, L = window.VigilLore, CA = window.CompanionAudio, D = window.CompanionDraw, UI = window.VigilUI;
  const C = window.CompanionContent;

  /* ---------- chapter-local styling (the warm-white page, the dark page) ---------- */
  if (document.head) document.head.appendChild(Object.assign(document.createElement('style'), { textContent: `
    body.companion.ch8-white { background: #f6efe2 !important; color: #2a2420; transition: background 1.2s ease; }
    body.companion.ch8-white #chead { background: rgba(246,239,226,0.94); border-bottom-color: rgba(42,36,32,0.15); }
    body.companion.ch8-white #chead .brand, body.companion.ch8-white .crole { color: #7a6a4a !important; }
    body.companion.ch8-white .cpanel { background: #fbf6ec; border-color: rgba(42,36,32,0.12); color: #2a2420; }
    body.companion.ch8-white .cpanel h2, body.companion.ch8-white .cpanel h3 { color: #7a6a4a; }
    body.companion.ch8-white .cpanel .fine, body.companion.ch8-white .end-mark { color: #8a7c66; }
    body.companion.ch8-white .ctab { color: #8a7c66; border-color: rgba(42,36,32,0.15); background: rgba(0,0,0,0.02); }
    body.companion.ch8-white .ctab.on { color: #5a4a2a; border-color: #b8a070; background: rgba(184,160,112,0.15); }
    body.companion.ch8-white .btn { color: #5a4a2a; border-color: rgba(90,74,42,0.4); background: rgba(255,255,255,0.5); }
    body.companion.ch8-white .tag { color: #7a6a4a; border-color: rgba(122,106,74,0.4); }
    body.companion.ch8-white .iconbtn { color: #5a4a2a; }
    body.companion.ch8-white .iconbtn:hover { color: #3a2e1a; border-color: rgba(90,74,42,0.4); }
    body.companion.ch8-white .cpanel .fine, body.companion.ch8-white .end-mark { color: #6b5d48; }
    body.companion.ch8-white .end-mark { opacity: 1; }
    body.companion.ch8-white .ctab { color: #6b5d48; }
    body.companion.ch8-white .laws .law .era, body.companion.ch8-white em, body.companion.ch8-white strong { color: #7a6a4a; }
    body.companion.ch8-white .back-row .btn { color: #7a6a4a; }
    body.companion.ch8-dark { background: #000 !important; }
    body.companion.ch8-dark .cpanel { background: #000; border-color: rgba(255,255,255,0.06); }
    body.companion.ch8-dark #chead { background: #000; border-bottom-color: rgba(255,255,255,0.06); }
    .ch8-goodbye { animation: fadeUp 1.2s ease both; }
    .ch8-goodbye .ch8-name { font-family: var(--display); font-size: 30px; letter-spacing: .12em; color: var(--gold-2); margin: 6px 0 10px; }
    .ch8-goodbye .ch8-line { font-family: var(--hand); font-size: 21px; line-height: 1.5; color: var(--ink); margin: 0 0 10px; }
    .ch8-goodbye .ch8-sign { font-family: var(--hand); font-style: italic; color: var(--ink-dim); text-align: right; margin-top: 8px; }
    .ch8-glyphrow { display: flex; gap: 10px; justify-content: center; padding: 14px 6px; background: rgba(0,0,0,0.35); border: 1px solid rgba(224,176,74,0.35); border-radius: 10px; margin: 10px 0; }
    .ch8-glyphrow svg { width: 56px; height: 56px; }
    .ch8-burn { position: fixed; inset: 0; background: #000; z-index: 50; display: flex; align-items: center; justify-content: center; text-align: center; padding: 30px; opacity: 0; transition: opacity 1.6s ease; pointer-events: none; }
    .ch8-burn.on { opacity: 1; pointer-events: all; }
    .ch8-burn .ch8-spent { font-family: var(--display); font-size: 22px; letter-spacing: .18em; color: #e9e2d2; line-height: 1.7; animation: fadeUp 2s 1.2s ease both; }
    .ch8-white-page { text-align: center; padding: 30px 10px 10px; }
    .ch8-white-page .ch8-wp-name { font-family: var(--display); font-size: 26px; letter-spacing: .14em; color: #5a4a2a; margin-bottom: 8px; }
    .ch8-white-page p { color: #4a4036; font-size: 19px; }
    .ch8-white-page .ch8-again { margin-top: 26px; }
    .ch8-trace svg { width: 100%; height: 64px; display: block; }
    .ch8-trace .ch8-beat { stroke-dasharray: 600; stroke-dashoffset: 600; animation: ch8beat 3.2s ease-out forwards; }
    @keyframes ch8beat { to { stroke-dashoffset: 0; } }
    .ch8-thread { margin: 10px 0; background: rgba(0,0,0,0.35); border: 1px solid rgba(217,107,74,0.35); border-radius: 10px; padding: 8px; }
    .ch8-thread svg { width: 100%; height: auto; display: block; }
    .ch8-thread .ch8-th { stroke-dasharray: 700; stroke-dashoffset: 700; animation: ch8thread 3.5s .8s ease-out forwards; }
    @keyframes ch8thread { to { stroke-dashoffset: 0; } }
    .ch8-seal-crown { text-align: center; padding: 18px 0 6px; }
    .ch8-seal-crown svg { width: 150px; height: 150px; }
    .ch8-seal-crown .ch8-decree { font-family: var(--display); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin-top: 8px; line-height: 1.9; }
    .ch8-darkline { font-family: var(--hand); font-size: 22px; color: var(--ink); text-align: center; padding: 28px 8px; animation: fadeUp 1.5s ease both; }
    .ch8-fade { transition: opacity 5s ease 9s; }
    .ch8-fade.gone { opacity: 0.08; }
    body.companion.ch8-dark .btn { color: #e9e2d2; border-color: rgba(233,226,210,0.35); background: rgba(255,255,255,0.04); }
    .ch8-readagain { margin-top: 22px; }
  ` }));

  /* keep a body class only while a given element is on the page */
  function bodyClassWhile(el, cls) {
    document.body.classList.add(cls);
    const main = document.getElementById('cmain');
    if (!main || !window.MutationObserver) return;
    const mo = new MutationObserver(() => { if (!el.isConnected) { document.body.classList.remove(cls); mo.disconnect(); } });
    mo.observe(main, { childList: true, subtree: true });
  }
  const esc = UI.esc;
  const firstName = (ctx) => (ctx.name && ctx.name.trim()) || ctx.role.nick;
  const walkedHere = (ctx) => { const a = ctx.answer('ch7', 'finale'); if (typeof a === 'string') return a.indexOf('WALK') === 0; return null; };

  /* ---------- the four goodbyes, by real first name ---------- */
  const GOODBYE = {
    reader: (ctx) => {
      const name = firstName(ctx);
      return `<div class="ch8-goodbye"><div class="ch8-name">${esc(name)}</div>` +
        `<p class="ch8-line">You read everything and eat nothing. Read this one. It's the last thing in the old tongue you'll ever read, so I made it short.</p>` +
        `<div class="ch8-glyphrow">${['KNOT', 'ASH', 'EMBER'].map(n => G.svg(n, { size: 56, color: '#f2d27a' })).join('')}</div>` +
        `<p class="ch8-line">Tomorrow it'll be three shapes on a page. Keep it anyway. You'll know what it said, even when you can't read it. That's the whole point of you, ${esc(name)}.</p>` +
        `<div class="ch8-sign">— W.</div></div>`;
    },
    listener: (ctx) => {
      const name = firstName(ctx);
      return `<div class="ch8-goodbye"><div class="ch8-name">${esc(name)}</div>` +
        `<p class="ch8-line">You hear a spider change its mind. You never once heard this. It wasn't a fault in you. There wasn't one to hear.</p>` +
        `<div class="ch8-trace"><svg viewBox="0 0 360 64"><path d="M0,32 L360,32" stroke="#4fb3bf" stroke-width="1" opacity=".35" fill="none"/><path class="ch8-beat" d="M0,32 L60,32 L70,32 L78,12 L88,52 L96,32 L170,32 L178,10 L188,54 L196,32 L270,32 L278,12 L288,52 L296,32 L360,32" stroke="#4fb3bf" stroke-width="2.2" fill="none" stroke-linejoin="round"/></svg></div>` +
        `<p class="ch8-line">There. That one's mine. Listen once, ${esc(name)}. Then look up — you won't need to hear it again, and you won't be able to.</p>` +
        `<div class="ch8-sign">— W.</div></div>`;
    },
    seer: (ctx) => {
      const name = firstName(ctx);
      const fig = (x, y, lab, shadowTo, col) => `<circle cx="${x}" cy="${y}" r="6" fill="#fff"/><path d="M${x},${y} L${shadowTo[0]},${shadowTo[1]}" stroke="${col || '#fff'}" stroke-width="3" opacity=".6" stroke-linecap="round"/><text x="${x}" y="${y + 18}" text-anchor="middle" fill="${col || '#fff'}" font-size="9" font-family="Cinzel,serif">${esc(lab)}</text>`;
      const under = `<svg viewBox="0 0 360 250"><rect width="360" height="250" fill="#000"/>` +
        `<g stroke="#fff" fill="none" stroke-width="1.2"><rect x="10" y="10" width="340" height="200"/><path d="M150,150 L150,110 A30,30 0 0 1 210,110 L210,150 Z"/></g>` +
        `<g stroke="#fff" fill="none" stroke-width="1.5"><path d="M180,146 C168,132 172,120 180,110 C188,120 192,132 180,146 Z"/><path d="M180,146 L180,128"/></g>` +
        `<text x="180" y="168" text-anchor="middle" fill="#fff" font-size="9" font-family="Cinzel,serif" opacity=".7">the Hearth, which is only a fire</text>` +
        fig(70, 70, 'Reader', [38, 44]) + fig(70, 170, 'Listener', [38, 196]) + fig(290, 70, 'Seer', [322, 44]) + fig(290, 170, 'Binder', [322, 196]) +
        fig(180, 44, 'Wren', [180, 14], '#a482e6') +
        `<text x="180" y="236" text-anchor="middle" fill="#a482e6" font-size="9" font-family="Cinzel,serif">all five shadows fall away from the fire. At last.</text></svg>`;
      return `<div class="ch8-goodbye"><div class="ch8-name">${esc(name)}</div>` +
        `<p class="ch8-line">You look at walls like they owe you money. Look at this one. I drew it. It's not very good.</p>` +
        `<div class="blk-svg underlayer">${under}</div>` +
        `<p class="ch8-line">You were the only one who saw it and didn't tell me, and then you did. Thank you for both, ${esc(name)}.</p>` +
        `<div class="ch8-sign">— W.</div></div>`;
    },
    binder: (ctx) => {
      const name = firstName(ctx);
      /* The name is boxed by textLength rather than positioned by name.length, and both ends of
         the thread are fixed: a name of any length is squeezed into 20..140 and can never reach the
         thread's start at x=158. The old x = min(150, 44 + name.length * 13) clamped at eight
         characters and then ran the name straight through the knot. */
      const nameW = Math.max(24, Math.min(120, name.length * 12));
      const thread = `<svg viewBox="0 0 360 120"><text x="20" y="66" fill="#e9e2d2" font-size="20" font-family="Cinzel,serif" textLength="${nameW}" lengthAdjust="spacingAndGlyphs">${esc(name)}</text><text x="340" y="66" text-anchor="end" fill="#a482e6" font-size="20" font-family="Cinzel,serif">Wren</text>` +
        `<path class="ch8-th" d="M158,60 C 200,20 220,100 268,60" stroke="#d96b4a" stroke-width="3" fill="none" stroke-linecap="round"/>` +
        `<circle cx="158" cy="60" r="3" fill="#d96b4a"/><circle cx="268" cy="60" r="3" fill="#d96b4a"/></svg>`;
      return `<div class="ch8-goodbye"><div class="ch8-name">${esc(name)}</div>` +
        `<p class="ch8-line">You tie everyone to everyone and call it kindness. You looked for mine all night. It wasn't that there wasn't one. It's that there wasn't a <em>me</em> on the other end to tie it to. There is now.</p>` +
        `<div class="ch8-thread">${thread}</div>` +
        `<p class="ch8-line">Red. Not grey. Look at it once, ${esc(name)}, because in a minute you won't be able to, and I want it seen.</p>` +
        `<div class="ch8-sign">— W.</div></div>`;
    },
  };

  /* the goodbye -> "Your Sighting is spent. Look up." -> a warm-white page */
  function goodbyeBlock(roleId) {
    return { t: 'custom', render: (el, ctx) => {
      const key = 'ch8:spent';
      const showWhite = () => {
        UI.clear(el);
        const w = UI.el('div', { class: 'ch8-white-page' });
        w.appendChild(UI.el('div', { class: 'ch8-wp-name', text: firstName(ctx) }));
        w.appendChild(UI.el('p', { text: 'There is nothing left on this page.' }));
        w.appendChild(UI.el('p', { text: 'Look at the people at the table.' }));
        w.appendChild(UI.el('button', { class: 'btn small ghost ch8-again', text: 'Read the goodbye again', onclick: () => { ctx.state.done[key] = false; ctx.save(); document.body.classList.remove('ch8-white'); showGoodbye(); } }));
        el.appendChild(w);
        bodyClassWhile(w, 'ch8-white');
      };
      const burn = () => {
        const b = UI.el('div', { class: 'ch8-burn' }, [UI.el('div', { class: 'ch8-spent', html: 'Your Sighting is spent.<br>Look up.' })]);
        document.body.appendChild(b);
        requestAnimationFrame(() => b.classList.add('on'));
        ctx.state.done[key] = true; ctx.save();
        setTimeout(() => { showWhite(); b.classList.remove('on'); setTimeout(() => b.remove(), 1700); }, 4200);
      };
      const showGoodbye = () => {
        UI.clear(el);
        const g = UI.el('div', { html: GOODBYE[roleId](ctx) });
        el.appendChild(g);
        if (roleId === 'listener') { const btn = UI.audioButton('Cup your ear — once', () => CA.heartbeat(ctx.audio, 64, 8)); g.appendChild(btn); }
        const look = UI.el('button', { class: 'btn primary big-btn', text: 'Look up', style: { marginTop: '14px' }, onclick: burn });
        el.appendChild(look);
        el.appendChild(UI.el('p', { class: 'fine', text: 'The page burns when you look up. Or in a little while, whether you do or not.' }));
        const t = setTimeout(() => { if (el.isConnected && !ctx.state.done[key]) burn(); }, 45000 + ctx.role.idx * 5000);
        const mo = window.MutationObserver ? new MutationObserver(() => { if (!el.isConnected) { clearTimeout(t); mo.disconnect(); } }) : null;
        if (mo) mo.observe(document.getElementById('cmain'), { childList: true, subtree: true });
      };
      if (ctx.state.done[key]) showWhite(); else showGoodbye();
    } };
  }

  /* A page that goes dark after its line is read. The four SEALING_LINEs are 27-31 words, which is
     ten seconds of reading, and the fade used to begin at 5.5s and finish at 10.5s with no way back
     -- a slow reader lost Wren's last words to them and had to switch tabs to get them again. The
     fade now begins at 10.5s, and the button is there for as long as the page is. */
  function darkBlock(html) {
    return { t: 'custom', render: (el) => {
      const w = UI.el('div', { class: 'ch8-fade', html });
      el.appendChild(w);
      bodyClassWhile(w, 'ch8-dark');
      const dim = () => setTimeout(() => { if (w.isConnected) w.classList.add('gone'); }, 1500);
      el.appendChild(UI.el('button', { class: 'btn small ghost ch8-readagain', text: 'Read it again', onclick: () => {
        w.style.transition = 'none'; w.classList.remove('gone'); void w.offsetWidth; w.style.transition = ''; dim();
      } }));
      dim();
    } };
  }

  const SEALING_LINE = {
    reader: 'The Reader. Eat something. And read the name on the door tomorrow — you\'ll be able to. That was always going to be the price of learning it.',
    listener: 'The Listener. It was never a fault in you. Nothing was there. You listened anyway. That\'s the whole of what you are.',
    seer: 'The Seer. You were right about the wall, and the floor, and me. Stop looking at things like they owe you money. Some of them are paid up.',
    binder: 'The Binder. Tie the others to each other. Tight. Then go and be tied to someone yourself, for once. I\'m not there to watch, so it\'s safe.',
  };
  const oathSworn = (ctx) => { try { const u = ctx.state.unlocked && ctx.state.unlocked.ch5; if (!u || !u.flags || u.flags.OATH == null) return null; return +u.flags.OATH > 0; } catch (e) { return null; } };
  const KEEPER_LINE = {
    reader: 'Read him the name properly, one day. I never once heard it said right, and I am the one who chose it.',
    listener: 'You will not hear it. You never will. Do not let that stop you listening — I did, and it cost fourteen years.',
    seer: 'You saw. I should have asked you sooner. I should have asked anyone. Ask, when you are me.',
    binder: 'The oath you swore tonight was to a Chair. Swear the next one to a person. Wren will need at least one of you to have done that.',
  };
  const STAY_LINE = {
    reader: 'The wall still reads. You will teach the next Reader what the shapes say, and never tell them which of the shapes you cannot look at.',
    listener: 'Every heart in the room, still. All but one, still. You will listen for it every day and it will never be there, and it will not be a fault.',
    seer: 'Every shadow in the room, still. Four fall away from the fire. One falls toward it. It always will.',
    binder: 'Every thread in the room, still. Between you and the ones who walked: red, and thin, and held.',
  };

  const crownSeal = () => `<div class="ch8-seal-crown"><svg viewBox="-60 -60 120 120"><circle r="56" fill="#1a1410" stroke="#d4a94e" stroke-width="3"/><circle r="48" fill="none" stroke="#d4a94e" stroke-width="1" opacity=".6"/><g transform="scale(1.9)" style="color:#f2d27a">${G.inner('CROWN')}</g><path id="ch8arc" d="M-44,0 A44,44 0 0 1 44,0" fill="none"/><text font-size="8" fill="#d4a94e" font-family="Cinzel,serif" letter-spacing="2"><textPath href="#ch8arc" startOffset="50%" text-anchor="middle">BY ORDER OF THE CROWN</textPath></text></svg>` +
    `<div class="ch8-decree">Sighting registered.<br>Report to the Envoy at dawn.<br>The Cold is open for business.</div></div>`;

  C.chapters.push({
    id: 'ch8',
    pages: (roleId, ctx) => {
      const P = { sight: [], wren: [], speak: [] };
      const E = +(ctx.flags.ENDING || 0);
      const name = firstName(ctx);
      const walked = walkedHere(ctx);
      P.speak.push({ t: 'fine', text: 'Nothing to speak. The night has been spoken.' });
      /* The one who held the stair: what the thread recorded, shown to that player alone. It is held
         back and appended at the foot of whatever Wren page the ending built, as a `fine` line, so
         that page keeps exactly one {t:'h'} (R11.5) instead of growing a second section. */
      let stairFine = null;
      try {
        const u6 = ctx.state.unlocked && ctx.state.unlocked.ch6; const vol = u6 && u6.flags ? +u6.flags.VOLUNTEER : 0;
        const seat = ['reader', 'listener', 'seer', 'binder'].indexOf(roleId) + 1;
        if (vol && vol === seat) {
          const th = ctx.state.thread || { letGo: 0 }; const n = th.letGo | 0;
          stairFine = n === 0 ? 'You held the stair, and you never let go. Nobody will ever know that but you.'
            : `You held the stair. You let go ${n === 1 ? 'once' : n === 2 ? 'twice' : n + ' times'}. The thread frayed and held anyway. Nobody knew. Nobody needs to.`;
        }
      } catch (e) {}

      if (E === 0) {
        /* THE FOURFOLD WALK: every phone gets the goodbye */
        P.sight.push({ t: 'h', text: 'A letter, in Wren\'s hand' });
        P.sight.push(goodbyeBlock(roleId));
        P.wren.push({ t: 'h', text: 'What you keep' });
        P.wren.push({ t: 'p', text: { reader: 'Three shapes on a page, in a drawer. You will argue every winter about what the ring looked like, and lose, and not mind.', listener: 'A house that is too quiet, you will say, and mean the opposite. A pulse in a throat you can see and cannot hear and do not need to.', seer: 'A floor that is a floor. A wall that is a wall. Four friends whose shadows you will never check again, and one visitor who comes through doors sideways.', binder: 'Nothing between any of you but air, and it holds. It has never not held.' }[roleId] });
        P.wren.push({ t: 'fine', text: `You would do it again, ${name}. You will say so every winter, at the point in the evening when it becomes true.` });
      } else if (E === 1) {
        /* THE HALF-WALK. The phone knows its own finale token and nothing else: the ch8 cast is three
           bits of ENDING and lore.js is frozen, so a phone that took the Envoy's word cannot be told
           whether that word was kept in the room. It used to ASK -- a two-button quiz about the
           player's own bookkeeping, in jargon, on the last screen of the game, which is precisely the
           procedural meta-question R5.4 says to retire. It does not ask any more.
           Instead the letter goes to every phone whose token said WALK, and one extra sentence
           covers the case where a kept key stayed dark. The Hearth has already named the walkers and
           the stayers out loud, two scenes back, in front of everybody -- that is where a player
           finds out, and it costs nobody Wren's goodbye. */
        const tok = ctx.answer('ch7', 'finale');
        const acceptedTok = typeof tok === 'string' && /_ACCEPT$/.test(tok);
        if (walked === true) {
          P.sight.push({ t: 'h', text: 'A letter, in Wren\'s hand' });
          P.sight.push(goodbyeBlock(roleId));
          if (acceptedTok) P.sight.push({ t: 'fine', text: 'You took the Envoy\'s word tonight. If your key stayed dark at the fire, keep the letter anyway. It was written to you, not to your key.' });
          P.wren.push({ t: 'h', text: 'Walker' });
          P.wren.push({ t: 'p', text: 'You went in. You came out grey-eyed and free, and the ones who stayed are Masters now of a school that knows what it is built on. Wren lives. No pulse. Wren does not mind.' });
        } else {
          P.sight.push({ t: 'h', text: 'On the stones' });
          P.sight.push({ t: 'p', text: '**You kept your Sight. You watched them go.**' });
          P.sight.push({ t: 'p', text: STAY_LINE[roleId] });
          if (walked === null) P.sight.push({ t: 'fine', text: 'This phone holds no word from the fire. If you walked, the goodbye was on the phone that spoke for you.' });
          P.wren.push({ t: 'h', text: 'Master' });
          P.wren.push({ t: 'p', text: `Master ${name} of Thornhallow. The fire is yours for life, and so is the wall, and so is the knowing. Wren visits, and laughs, and has no pulse, and you are the only kind of person who will ever notice.` });
        }
      } else if (E === 2) {
        /* THE SEALING: Wren's last line to this player by name, then dark */
        P.sight.push({ t: 'h', text: 'The last thing Wren said to you' });
        P.sight.push(darkBlock(`<div class="ch8-darkline">${esc(SEALING_LINE[roleId])}<br><br><span style="opacity:.6">— W.</span></div>`));
        /* This page used to be the single word 'Dark.', which reads as a broken phone rather than as
           an ending. One heading, one paragraph, inside the 40-75 word budget (R11.3). */
        P.wren.push({ t: 'h', text: 'What you keep' });
        P.wren.push({ t: 'p', text: {
          reader: 'A name over the Hearth that nobody in the room could spell. You could. You did not offer, and you will not, and every winter you will read it anyway and say nothing about it to anybody.',
          listener: 'A heartbeat you never heard, in a throat you knew by sight. You will listen for it in every room you stand in for the rest of your life. It was never there. You listened anyway.',
          seer: 'A shadow that fell the wrong way for years, and then one morning fell no way at all. You were right about the wall, and the floor, and the shadow. Being right is not the same as being glad.',
          binder: 'A thread you looked for all night and never found. There was nothing on the other end of it to tie to. There is now, and it is tied to a fire, and it holds.',
        }[roleId] });
      } else if (E === 3) {
        /* THE KEEPER'S WALK: Marrow's one line to each */
        P.sight.push({ t: 'h', text: 'Provost Marrow, before she goes' });
        const keeperLine = roleId === 'binder' && oathSworn(ctx) === false ? 'You would not swear to a Chair tonight. Good. Swear, one day, to a person. Wren will need at least one of you to have done that.' : KEEPER_LINE[roleId];
    P.sight.push({ t: 'letter', text: `${name} —\n\n${keeperLine}\n\n— I. M.` });
        P.sight.push({ t: 'fine', text: 'She wrote it on the stair, on the back of the writ, and did not wait to see it read.' });
        P.wren.push({ t: 'h', text: 'The Provost' });
        P.wren.push({ t: 'p', text: 'Years later, Provost Wren keeps a fire that flickers. Every winter it dips. Every winter it comes back. The fourth-years are told it is nothing.' });
        P.wren.push({ t: 'p', text: { reader: 'The Provost has you read the name on the door aloud once a year, properly, and never says why.', listener: 'The Provost asks you, once a year, whether you can hear it yet. You say no. The Provost says good.', seer: 'The Provost asks you, once a year, which way the shadow falls. You say toward. The Provost says good.', binder: 'The Provost asks you, once a year, whether there is a thread. You say no. The Provost says: not unbound. The knot itself. And laughs.' }[roleId] });
      } else {
        /* THE ENVOY'S BARGAIN: a Crown seal */
        P.sight.push({ t: 'h', text: 'Your posting' });
        P.sight.push({ t: 'html', html: crownSeal() });
        P.sight.push({ t: 'fine', text: `Master ${name}. Sighting: ${ctx.role.gift}. Assigned: the Cold-works, at the school. There is no page after this one.` });
        /* Wren said nothing to anybody on this ending. The page holds what this gift saw instead --
           still one heading and one paragraph, still inside 40-75 words. */
        P.wren.push({ t: 'h', text: 'The last thing you saw' });
        P.wren.push({ t: 'p', text: {
          reader: 'Wren looked at the writing above the Hearth on the way out, and then at the floor. You are the only one in that hall who could have told the room what it said. Nobody asked you.',
          listener: 'Wren said nothing at all, to any of you. What you heard instead was the cage, and the boots, and four hundred years of fire going on exactly as before.',
          seer: 'Four soldiers, and a cage, and Wren\'s shadow falling towards the fire the whole way out of the hall. It always did. It still does. Nobody but you will ever know that.',
          binder: 'Every thread in that hall went gold on the way out. Crown gold, all of it, including yours. Wren\'s went nowhere at all, because there was nobody left to tie it to.',
        }[roleId] });
      }
      if (stairFine) P.wren.push({ t: 'fine', text: stairFine });

      /* the Binder restates the Law the night was about */
      if (roleId === 'binder') {
        /* No {t:'h'} here: the Law card names itself in its own era line, and a second heading is
           what pushed the Binder's Sight page to two (R11.5 -- one heading per tab). */
        P.sight.push({ t: 'divider' });
        P.sight.push({ t: 'html', html: `<div class="laws"><div class="law founders${E === 4 ? ' struck' : ''}"><div class="era">Law 0 · Founders' · Year 0${E === 4 ? ' · STRUCK, AGAIN' : E === 0 ? ' · WRITTEN' : ' · RESTORED'}</div><div class="txt">COLD is written by four hands.</div><div class="fine">${E === 0 ? 'Tonight it was.' : E === 1 ? 'Tonight it nearly was.' : E === 4 ? 'The Crown struck it. The Crown does not need Laws.' : 'It was not, tonight. It is still the Law.'}</div></div></div>` });
        P.sight.push({ t: 'fine', text: 'Law 3: where two Laws disagree, the older binds. There is no older Law than this one.' });
      }
      return P;
    },
  });
})();

</script>
<script>/* js/companion.js */
/* Companion (phone) app: role + first name, attunement word + cast, four tabs (SIGHT / WREN / SPEAK / BOOK),
   private choices -> tokens, timed mini-tasks. Content comes from window.CompanionContent (see docs/CONVENTIONS.md). */
(function () {
  'use strict';
  const UI = window.VigilUI, Shared = window.VigilShared, Audio = window.VigilAudio, Lore = window.VigilLore;
  const C = window.CompanionContent;
  document.body.classList.add('companion'); document.body.classList.remove('hearth');
  document.documentElement.classList.add('companion-page'); // the scroll rules for browsers without :has()
  const KEY = 'vigil.companion.v2';
  const fresh = () => ({ role: null, name: '', unlocked: {}, mini: {}, answers: {}, notes: {}, done: {}, tab: 'sight', current: null });
  let st = fresh();
  try { const raw = localStorage.getItem(KEY); if (raw) st = Object.assign(fresh(), JSON.parse(raw)); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
  const main = document.getElementById('cmain'), roleEl = document.getElementById('crole');
  document.addEventListener('pointerdown', () => { try { Audio.init(); } catch (e) {} }, { once: true });
  document.getElementById('cmenu').addEventListener('click', menu);

  /* Answers, task results and notes belong to the player in the seat, not to the phone: changing seat parks the
     current seat's private state under st.seats and restores the new seat's (chapter unlocks stay: the Hearth's
     words are the same for everyone). Otherwise a second player on this phone would see, and be unable to change,
     the first one's sealed answers. */
  function switchRole(id) {
    if (st.role === id) return;
    st.seats = st.seats || {};
    if (st.role) st.seats[st.role] = { answers: st.answers, done: st.done, notes: st.notes };
    const s = (id && st.seats[id]) || {};
    st.answers = s.answers || {}; st.done = s.done || {}; st.notes = s.notes || {};
    st.role = id;
  }
  const qs = new URLSearchParams(location.search);
  if (qs.get('role') && Lore.roleById(qs.get('role'))) { switchRole(qs.get('role')); save(); }

  const role = () => Lore.roleById(st.role);
  function setHeader() { const r = role(); roleEl.textContent = r ? r.nick : ''; roleEl.className = 'crole' + (r ? ' p' + r.idx : ''); }
  const chapterOrder = () => Lore.chapters.map(c => c.id);
  const maxUnlockedN = () => Math.max(-1, ...Object.keys(st.unlocked).map(id => Lore.chapter(id).n));

  /* ctx handed to content functions */
  function ctx(chId) {
    const u = st.unlocked[chId] || {};
    return { role: role(), roleId: st.role, name: st.name, flags: u.flags || {}, cast: u.cast || null, state: st, save,
      unlocked: (id) => !!st.unlocked[id], mini: (w) => !!st.mini[chId + ':' + Shared.norm(w)], maxChapter: maxUnlockedN(),
      answer: (chapterId, choiceId) => st.answers[chapterId + ':' + choiceId], ui: UI, audio: Audio, shared: Shared, glyphs: window.VigilGlyphs, lore: Lore };
  }

  /* ---------- Screens ---------- */
  function showRoles() {
    setHeader(); UI.clear(main);
    const p = UI.el('div', { class: 'cpanel' });
    p.appendChild(UI.el('h2', { text: 'Choose your Sighting' }));
    p.appendChild(UI.el('p', { class: 'fine', html: UI.rich(C.roleIntro || 'Sit left to right: Reader, Listener, Seer, Binder. Pick the seat you are in. What appears here is for your eyes — share it by talking.') }));
    const grid = UI.el('div', { class: 'role-grid' });
    Lore.roles.forEach((r, i) => {
      grid.appendChild(UI.el('button', { class: 'role-card p' + i, onclick: () => { switchRole(r.id); save(); Audio.sfx('chime'); showName(); } }, [
        UI.el('span', { class: 'rname', text: r.name }), UI.el('span', { class: 'rgift', text: r.gift + ' · ' + r.what }),
      ]));
    });
    p.appendChild(grid); main.appendChild(p);
  }

  function showName() {
    setHeader(); UI.clear(main);
    const r = role();
    const p = UI.el('div', { class: 'cpanel' });
    p.appendChild(UI.el('h2', { text: r.nick }));
    p.appendChild(UI.el('p', { html: UI.rich(r.blurb) }));
    p.appendChild(UI.el('p', { class: 'fine', text: 'Your first name, for the Companion alone. The Hearth will never ask for it. It is used once, at the end.' }));
    const inp = UI.el('input', { class: 'field plain', placeholder: 'first name', maxlength: 16, value: st.name || '', autocomplete: 'given-name' });
    p.appendChild(inp);
    p.appendChild(UI.el('div', { class: 'row' }, [UI.el('button', { class: 'btn primary', text: 'Keep it', onclick: () => { st.name = inp.value.trim(); save(); showHome(); } })]));
    main.appendChild(p);
  }

  function showHome() {
    setHeader(); UI.clear(main);
    const r = role();
    // Who you are, first thing on the page: the rest of the night hangs off it.
    const who = UI.el('div', { class: 'cpanel who p' + r.idx });
    who.appendChild(UI.el('h2', { text: r.nick }));
    who.appendChild(UI.el('p', { class: 'fine', html: UI.rich(r.blurb) }));
    who.appendChild(UI.el('p', { class: 'fine rule', html: '<em>' + UI.esc(Lore.houseRule) + '</em>' }));
    main.appendChild(who);

    const u = UI.el('div', { class: 'cpanel' });
    u.appendChild(UI.el('h2', { text: 'Word of attunement' }));
    u.appendChild(UI.el('p', { class: 'fine', text: 'When the Hearth shows a word, enter it here. If a mark stands beside the word, enter the mark too.' }));
    const row = UI.el('div', { class: 'unlock' });
    const inp = UI.el('input', { class: 'field', placeholder: 'WORD', maxlength: 12, autocomplete: 'off', autocapitalize: 'characters' });
    const mark = UI.el('input', { class: 'field mark', placeholder: 'MARK', maxlength: 3, autocomplete: 'off', autocapitalize: 'characters' });
    const go = () => {
      const w = Shared.norm(inp.value), m = Shared.norm(mark.value);
      // mini-words
      for (const ch of C.chapters) { const mw = ch.miniWords || {}; for (const k in mw) if (Shared.norm(k) === w) { if (!st.unlocked[ch.id]) { fail('That word is for a page you have not turned yet.'); return; } st.mini[ch.id + ':' + Shared.norm(k)] = true; save(); Audio.sfx('unlock'); st.tab = mw[k] || 'speak'; showChapter(ch.id); return; } }
      const lc = Lore.chapters.find(c => Shared.norm(c.word) === w);
      if (!lc) { fail('The fire does not know that word.'); return; }
      let flags = {}, castStr = null;
      if (lc.cast.length) {
        if (!m) { fail('This word has a mark beside it on the Hearth. Enter it too.'); return; }
        const data = Shared.uncast(lc.word, m);
        if (data == null) { fail('The mark is not right. Look again at the Hearth.'); return; }
        flags = Shared.unpack(lc.cast, data); castStr = m;
      }
      const prev = st.unlocked[lc.id];
      if (prev && (prev.cast || null) !== (castStr || null)) {
        // The same page turned again with a different mark: the Hearth's night has changed (a retry), so this
        // chapter's sealed answers and finished tasks are stale — the option sets and tokens may differ now.
        // Seats parked on this phone are cleared as well; they never turn the page themselves.
        const wipe = (o) => o && Object.keys(o).forEach(k => { if (k.startsWith(lc.id + ':')) delete o[k]; });
        [st.answers, st.done].forEach(wipe);
        Object.values(st.seats || {}).forEach(s => { wipe(s.answers); wipe(s.done); });
        UI.toast('A new mark: this page\'s answers begin again.', 2600);
      }
      st.unlocked[lc.id] = { cast: castStr, flags }; st.current = lc.id; st.tab = 'sight'; save(); Audio.sfx('unlock'); showChapter(lc.id);
    };
    const fail = (msg) => { inp.classList.add('wrong'); setTimeout(() => inp.classList.remove('wrong'), 500); Audio.sfx('wrong'); UI.toast(msg, 2600, 'bad'); };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { if (inp.value && !mark.value) mark.focus(); else go(); } });
    mark.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    row.appendChild(inp); row.appendChild(mark); row.appendChild(UI.el('button', { class: 'btn', text: 'Turn', onclick: go }));
    u.appendChild(row); main.appendChild(u);

    const l = UI.el('div', { class: 'cpanel' });
    l.appendChild(UI.el('h2', { text: 'Your pages' }));
    const list = UI.el('div', { class: 'chap-list' });
    Lore.chapters.forEach(lc => {
      const open = !!st.unlocked[lc.id];
      const b = UI.el('button', { class: 'btn chap-btn' + (open ? '' : ' locked'), onclick: () => { if (open) showChapter(lc.id); else { inp.focus(); UI.toast('Enter the word the Hearth shows.'); } } });
      b.appendChild(UI.el('span', { text: open ? `${lc.label} — ${lc.title}` : lc.label }));
      b.appendChild(UI.el('span', { class: 'lock', text: open ? 'open' : 'sealed' }));
      list.appendChild(b);
    });
    l.appendChild(list); main.appendChild(l);
  }

  const TABS = [['sight', 'Sight'], ['wren', 'Wren'], ['speak', 'Speak'], ['book', 'Book']];
  function showChapter(id, tab) {
    setHeader(); UI.clear(main); window.scrollTo(0, 0);
    const lc = Lore.chapter(id); const ch = C.chapters.find(c => c.id === id); const r = role();
    if (tab) st.tab = tab; st.current = id; save();
    const back = UI.el('div', { class: 'back-row' }, [UI.el('button', { class: 'btn small ghost', text: '‹ Pages', onclick: showHome }), UI.el('span', { class: 'tag', text: lc.label })]);
    main.appendChild(back);
    const tabs = UI.el('div', { class: 'ctabs' });
    TABS.forEach(([k, label]) => tabs.appendChild(UI.el('button', { class: 'ctab' + (st.tab === k ? ' on' : ''), text: label, onclick: () => { st.tab = k; save(); showChapter(id); } })));
    main.appendChild(tabs);
    const p = UI.el('div', { class: 'cpanel' });
    p.appendChild(UI.el('h2', { text: lc.title }));
    const cx = ctx(id);
    let blocks = [];
    try {
      if (st.tab === 'book') blocks = (C.book ? C.book(st.role, cx) : []);
      else if (ch) { const pages = typeof ch.pages === 'function' ? ch.pages(st.role, cx) : ch.pages; blocks = (pages && pages[st.tab]) || []; }
      if (typeof blocks === 'function') blocks = blocks(cx);
    } catch (e) { console.error(e); blocks = [{ t: 'p', text: 'This page is smudged. Reload the Companion.' }]; }
    if (!blocks.length) blocks = [{ t: 'fine', text: st.tab === 'speak' ? 'Nothing to speak yet. The Hearth will tell you when.' : st.tab === 'wren' ? 'Nothing here yet.' : 'Nothing here.' }];
    renderBlocks(blocks, p, ch || { id }, cx);
    if (st.tab === 'sight') p.appendChild(UI.el('p', { class: 'fine end-mark', text: '— end of your Sight for this chapter —' }));
    main.appendChild(p);
  }

  /* ---------- Blocks ---------- */
  function renderBlocks(blocks, into, ch, cx) {
    for (const b0 of blocks) {
      const b = typeof b0 === 'function' ? b0(cx) : b0;
      if (!b) continue;
      if (b.if && !b.if(cx)) continue;
      const t = b.t || 'p';
      switch (t) {
        case 'h': into.appendChild(UI.el('h3', { text: b.text })); break;
        case 'p': into.appendChild(UI.el('p', { html: UI.rich(b.text) })); break;
        case 'fine': into.appendChild(UI.el('p', { class: 'fine', html: UI.rich(b.text) })); break;
        case 'letter': into.appendChild(UI.el('div', { class: 'blk-letter', html: UI.rich(b.text) })); break;
        case 'whisper': into.appendChild(UI.el('p', { class: 'blk-whisper', html: UI.rich(b.text) })); break;
        case 'omen': into.appendChild(UI.el('p', { class: 'blk-omen', html: UI.rich(b.text) })); break;
        case 'html': into.appendChild(UI.el('div', { html: b.html })); break;
        case 'svg': into.appendChild(UI.el('div', { class: 'blk-svg' + (b.cls ? ' ' + b.cls : ''), html: typeof b.svg === 'function' ? b.svg(cx) : b.svg })); break;
        case 'table': {
          const tb = UI.el('table', { class: 'blk-table' });
          if (b.head) tb.appendChild(UI.el('tr', {}, b.head.map(h => UI.el('th', { html: h }))));
          b.rows.forEach(row => tb.appendChild(UI.el('tr', {}, row.map(c => UI.el('td', { html: typeof c === 'string' && !c.startsWith('<') ? UI.rich(c) : c })))));
          into.appendChild(tb); break;
        }
        case 'list': into.appendChild(UI.el('ul', { class: 'blk-list' }, b.items.map(i => UI.el('li', { html: UI.rich(i) })))); break;
        case 'glyphs': into.appendChild(UI.el('div', { class: 'blk-glyphs' }, b.items.map(g => UI.el('div', { class: 'g' }, [UI.el('div', { html: g.svg }), UI.el('span', { html: UI.rich(g.label || '') })])))); break;
        case 'key': into.appendChild(UI.el('div', { class: 'blk-key' }, b.items.map(g => UI.el('div', { class: 'k' }, [UI.el('div', { html: g.svg }), UI.el('b', { text: g.label })])))); break;
        case 'code': into.appendChild(UI.el('div', { class: 'blk-code ' + (b.cls || '') }, [UI.el('div', { class: 'label', text: b.label || 'Token' }), UI.el('div', { class: 'word', text: typeof b.text === 'function' ? b.text(cx) : b.text })])); break;
        case 'divider': into.appendChild(UI.el('div', { class: 'blk-divider' })); break;
        case 'audio': {
          // b.play(audioApi) starts sound; b.strip = html for the arrow/waveform strip
          const w = UI.el('div', { class: 'blk-audio' });
          if (b.label) w.appendChild(UI.el('div', { class: 'label', text: b.label }));
          if (b.strip) w.appendChild(UI.el('div', { class: 'strip', html: typeof b.strip === 'function' ? b.strip(cx) : b.strip }));
          const btn = UI.audioButton(b.button || 'Cup your ear', () => {
            Audio.init(); if (Audio.isMuted()) Audio.setMuted(false);
            const ms = b.play(Audio, cx);
            const len = typeof ms === 'number' && isFinite(ms) ? ms : 2200;
            UI.lightStrip(w.querySelector('.strip'), len);
            return len;
          });
          w.appendChild(btn);
          if (b.text) w.appendChild(UI.el('p', { class: 'fine', html: UI.rich(b.text) }));
          w.appendChild(UI.el('p', { class: 'fine nohear', text: 'No sound? Set the phone to ring, not silent, turn the volume up, and press again. Everything you would hear is also written on this page.' }));
          into.appendChild(w); break;
        }
        case 'reveal': {
          const w = UI.el('div', { class: 'blk-reveal' });
          const inner = UI.el('div', { class: 'inner hidden' });
          const btn = UI.el('button', { class: 'btn', text: b.label || 'Reveal', onclick: () => { btn.remove(); inner.classList.remove('hidden'); Audio.sfx('chime'); } });
          w.appendChild(btn); renderBlocks(b.blocks, inner, ch, cx); w.appendChild(inner); into.appendChild(w); break;
        }
        case 'secret': {
          const w = UI.el('div', { class: 'blk-secret' });
          w.appendChild(UI.el('div', { class: 'label', text: b.label || 'For your eyes only — hold to read' }));
          const content = UI.el('div', { class: 'content' }); renderBlocks(b.blocks, content, ch, cx);
          const hb = UI.el('button', { class: 'btn hold-btn', text: 'Hold to read' });
          const open = () => w.classList.add('open'); const close = () => w.classList.remove('open');
          hb.addEventListener('pointerdown', e => { e.preventDefault(); open(); }); hb.addEventListener('pointerup', close); hb.addEventListener('pointerleave', close); hb.addEventListener('pointercancel', close);
          w.appendChild(hb); w.appendChild(content); into.appendChild(w); break;
        }
        case 'choice': {
          // Private choice -> opaque token. channel must match the Hearth's decode channel.
          const w = UI.el('div', { class: 'blk-choice' });
          if (b.prompt) w.appendChild(UI.el('p', { html: UI.rich(b.prompt) }));
          const opts = UI.el('div', { class: 'opts' });
          const key = ch.id + ':' + b.id;
          const values = b.options.map(o => o.id);
          // A stored answer that is not one of this page's options is stale (another seat's, or an older mark's): unanswered.
          let chosen = values.includes(st.answers[key]) ? st.answers[key] : undefined;
          if (chosen === undefined && st.answers[key] !== undefined) { delete st.answers[key]; save(); } // a stale answer is no answer, to content too
          const channel = b.channel || Lore.channel(b.id, st.role);
          const showToken = (optId) => {
            const tok = Shared.token(channel, optId, values);
            w.appendChild(UI.el('div', { class: 'blk-code sea' }, [UI.el('div', { class: 'label', text: b.tokenLabel || 'Your sealed word — type it into the Hearth when it asks' }), UI.el('div', { class: 'word', text: tok })]));
            const after = b.after ? (typeof b.after === 'function' ? b.after(optId, cx) : b.after) : '';
            if (after) w.appendChild(UI.el('p', { class: 'fine after', html: UI.rich(after) }));
          };
          b.options.forEach(o => {
            const btn = UI.el('button', { class: 'btn opt' + (chosen === o.id ? ' chosen' : ''), html: UI.rich(o.text), onclick: async () => {
              if (chosen !== undefined && !b.changeable) return;
              if (!b.changeable && !(await UI.confirm('Seal this answer? It cannot be unsaid.', { ok: 'Seal it', cancel: 'Not yet' }))) return;
              chosen = o.id; st.answers[key] = o.id; save(); Audio.sfx('seal');
              Array.from(opts.children).forEach(x => { x.classList.toggle('chosen', x === btn); x.disabled = !b.changeable; });
              w.querySelectorAll('.blk-code, .fine.after').forEach(x => x.remove()); showToken(o.id);
            } });
            if (chosen !== undefined && !b.changeable) btn.disabled = true;
            opts.appendChild(btn);
          });
          w.appendChild(opts); if (chosen !== undefined) showToken(chosen); into.appendChild(w); break;
        }
        case 'task': {
          const w = UI.el('div', { class: 'blk-task' });
          if (b.title) w.appendChild(UI.el('div', { class: 'task-title', text: b.title }));
          const key = ch.id + ':' + b.id;
          const box = UI.el('div', {}); w.appendChild(box);
          const api = Object.assign({}, cx, { box, done: (result) => { st.done[key] = result; save(); UI.clear(box); if (b.onDone) renderBlocks(b.onDone(result, cx), box, ch, cx); }, result: () => st.done[key] });
          if (st.done[key] !== undefined && !b.replayable) { if (b.onDone) renderBlocks(b.onDone(st.done[key], cx), box, ch, cx); }
          else { try { b.run(box, api); } catch (e) { console.error(e); box.textContent = 'This page is smudged. Reload.'; } }
          into.appendChild(w); break;
        }
        case 'note': {
          const w = UI.el('div', { class: 'blk-note' });
          const key = ch.id + ':' + (b.id || 'note');
          const ta = UI.el('textarea', { placeholder: b.placeholder || 'Scribble here…' }); ta.value = st.notes[key] || '';
          ta.addEventListener('input', () => { st.notes[key] = ta.value; save(); });
          w.appendChild(ta); into.appendChild(w); break;
        }
        case 'custom': { const w = UI.el('div', {}); try { b.render(w, cx); } catch (e) { console.error(e); } into.appendChild(w); break; }
        default: into.appendChild(UI.el('p', { html: UI.rich(b.text || '') }));
      }
    }
  }

  function menu() {
    const box = UI.el('div', {});
    box.appendChild(UI.el('p', { html: `You are <strong>${role() ? role().nick : 'unassigned'}</strong>${st.name ? ' (' + UI.esc(st.name) + ')' : ''}.` }));
    const row = UI.el('div', { class: 'row' });
    row.appendChild(UI.el('button', { class: 'btn small', text: 'Change seat / name', onclick: () => { m.close(); showRoles(); } }));
    row.appendChild(UI.el('button', { class: 'btn small', text: Audio.isMuted() ? 'Unmute' : 'Mute', onclick: () => { Audio.init(); Audio.toggleMute(); m.close(); } }));
    row.appendChild(UI.el('button', { class: 'btn small danger', text: 'Forget everything', onclick: async () => { if (await UI.confirm('Erase this phone\'s pages and choices?', { danger: true, ok: 'Erase' })) { st = fresh(); save(); m.close(); showRoles(); } } }));
    box.appendChild(row);
    const m = UI.modal(box, { title: 'Companion' });
  }

  if (st.role && role()) { if (st.current && st.unlocked[st.current]) showChapter(st.current); else showHome(); } else showRoles();
  window.Companion = { showChapter, showHome, state: () => st, ctx };
})();

</script>
</body>
</html>
