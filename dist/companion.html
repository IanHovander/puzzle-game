        P.sight.push({ t: 'table', head: ['If the mark is…', 'the word is'], rows: [['on the left (upright)', `${G.svg('THORN', { size: 30, color: '#f2d27a' })} THORN — <em>a gate; to go through</em>`], ['on the right (turned)', `${G.svg('WELL', { size: 30, color: '#f2d27a' })} WELL — <em>down; from</em>`]] });
        P.sight.push({ t: 'fine', text: 'A lone glyph with its mark on the right simply inverts; there is nothing to read backwards. **The Seer knows which end the mark is on.** Speak the wrong word and the wall stays a wall — nothing worse.' });
        P.sight.push({ t: 'divider' });
        P.sight.push({ t: 'h', text: 'Over the Tower door' });
        P.sight.push({ t: 'p', text: 'Two shapes, deep-cut, a Founder\'s hand: a **Flame**, then a **Spike**. A threshold, not a lock.' });
        P.sight.push({ t: 'html', html: towerCarving(false).replace(/#fff/g, '#e9e2d2') });
        P.sight.push({ t: 'table', head: ['If the line is…', 'it reads'], rows: [['upright (mark left)', `${G.svg('ASH', { size: 30, color: '#f2d27a' })} ASH, ${G.svg('THORN', { size: 30, color: '#f2d27a' })} THORN — <em>fire, go through</em>`], ['turned (mark right)', `${G.svg('WELL', { size: 30, color: '#f2d27a' })} WELL, ${G.svg('COLD', { size: 30, color: '#f2d27a' })} COLD — <em>down, cold</em>`]] });
        P.sight.push({ t: 'fine', text: 'You will only need this if the night comes to fighting.' });
        P.wren.push({ t: 'h', text: 'The plaques' });
        P.wren.push({ t: 'p', text: 'Every portrait in the Gallery has a brass plaque in the Vigil\'s script: a name, a House, a year. The four oldest frames — the ones nearest the lamp, the ones that mutter loudest — have plaques in the **older alphabet**. The same alphabet as the name on the dormitory door.' });
        P.wren.push({ t: 'p', text: lost ? 'Wren, brought back from the dais by the Provost\'s own hand, stood under those four frames and did not look up at them. Wren always looks up at them.' : 'Wren stood under those four frames tonight and did not look up at them. Wren always looks up at them.' });
        P.wren.push({ t: 'fine', text: 'You still cannot read them. You are beginning to mind.' });
      }

      /* ================= LISTENER ================= */
      if (roleId === 'listener') {
        P.sight.push({ t: 'h', text: 'Two patrols, by landmark' });
        P.sight.push({ t: 'p', text: 'The lamps are out, and the Hearth draws no guards. You hear them. Two rounds, each **twelve beats** long, each repeating exactly; one beat is one turn on the Hearth. You hear *where* they are by what their boots pass — not by room letters. The Seer knows where the landmarks are.' });
        P.sight.push({ t: 'audio', label: 'Light steps — Patrol A', strip: `<div class="fine">quick, soft, a lantern swinging; ${LOOP_A.length} beats then round again</div>`, play: (A) => playSteps(A, true), text: 'On the beat before the first turn they are at **west corridor south**.' });
        P.sight.push(loopTable(LOOP_A));
        P.sight.push({ t: 'audio', label: 'Heavy boots — Patrol B', strip: `<div class="fine">slow, iron-shod, two of them; they stand a long time at the tower stair-foot</div>`, play: (A) => playSteps(A, false), text: 'On the beat before the first turn they are at the **east cross**.' });
        P.sight.push(loopTable(LOOP_B));
        P.sight.push({ t: 'fine', text: 'If Hob the porter cries out, the heavy boots leave their round and **hold the tower stair-foot for three beats**, then pick the round up where the count says it should be.' });
        P.sight.push({ t: 'h', text: 'The tally' });
        P.sight.push({ t: 'custom', render: (el) => tallyTool(el) });
        P.sight.push({ t: 'divider' });
        P.sight.push({ t: 'h', text: 'The portraits' });
        P.sight.push({ t: 'audio', label: 'Two hundred years of Masters, muttering', strip: `<div class="fine">…four went down… four went down… four went down…</div>`, play: playPortraits, text: 'They all say the same thing, over and over, in different voices. Nobody else can make out the words. **"…four went down…"** You have not decided what it means and you are not going to decide tonight.' });
        P.sight.push({ t: 'h', text: 'Heartbeats in the Gallery' });
        P.sight.push({ t: 'html', html: `<div class="heartbeats">${[['The Provost', 'normal'], ['Bess, in the Laundry', 'normal'], ['Hob, at the lodge', 'fast'], ['Vane\'s captain', 'normal'], ['Reader', 'normal'], ['Seer', 'normal'], ['Binder', 'normal']].map(([n, k]) => `<div class="hb"><span>${n}</span>${D.trace(k)}</div>`).join('')}<div class="hb"><span>Wren</span>${D.trace('flat')}</div></div>` });
        P.sight.push({ t: 'fine', text: 'Hob\'s is quick and greedy. The Provost\'s is slower than it was in the Hall. Wren: too quiet to catch. Still.' });
        P.wren.push({ t: 'h', text: 'What the frames say' });
        P.wren.push({ t: 'whisper', text: '…four went down… four went down… four went down…' });
        P.wren.push({ t: 'p', text: hurt ? 'Wren, one arm strapped up in a sling of the Binder\'s cloak, walked past the frames whispering *shut up, shut up, shut up* at them, cheerfully, the way you would at a dog. They did not.' : 'Wren walked past the frames tonight whispering *shut up, shut up, shut up* at them, cheerfully, the way you would at a dog. They did not.' });
        P.wren.push({ t: 'p', text: 'In the dark, with the lamps out, you will be able to hear every heart in these corridors. Every guard\'s. Bess\'s. Hob\'s. Not the one walking next to you.' });
      }

      /* ================= SEER ================= */
      if (roleId === 'seer') {
        P.sight.push({ t: 'h', text: 'Under the corridors' });
        P.sight.push({ t: 'p', text: 'The Hearth draws rooms by letter and number. The Listener hears the patrols by **landmark**. Only you can put the two together. Beneath the plaster: two hidden doors the Hearth does not draw, and a spyhole.' });
        P.sight.push({ t: 'svg', cls: 'underlayer', svg: underCorridors(hurt) });
        P.sight.push({ t: 'list', items: [
          '**The Laundry (B3)** has two hidden doors: one from the west corridor by the **linen chute (A3)**, one out through its back wall to the **damp wall (C3)**. Neither is drawn on the Hearth; each needs its word spoken.',
          '**The west door\'s lintel** (A3→B3): its mark is on the **right**. **The Laundry\'s back door** (B3→C3): its mark is on the **left**. The Reader reads the shapes.',
          '**Hob\'s spyhole** in the porter\'s lodge (C5) looks into the boot-room (B5), the drying-rack corridor (C4) and the corridor past the lodge (D5). Step into any of those and Hob sees.',
          'Sight passes only along open passages. A hidden door blocks it; so does a wall.',
        ] });
        P.sight.push({ t: 'h', text: 'Landmarks by room' });
        P.sight.push({ t: 'table', head: ['The Listener hears…', 'which is'], rows: [['west stair-foot', 'A5'], ['boot-room', 'B5'], ['porter\'s lodge', 'C5'], ['drying-rack', 'C4'], ['damp wall — the Laundry\'s back', 'C3'], ['west corridor south', 'A4'], ['linen chute', 'A3'], ['tower stair-foot', 'E4'], ['east cross', 'E3'], ['east corridor', 'E2'], ['cook\'s door', 'E1 (the door itself is D1, locked)']] });

      if (roleId === 'binder') {

          '**Bess, in the Laundry.** A **red** thread, old and thick, to the Provost — an oath, thirty years kept. The Laundry is Bess\'s and nobody else\'s; it has *never* been searched, by soldiers or Masters or anyone. Wren could sit on a tub in there until morning and be safe. The Seer can find its doors.',

        ] });

            opts: [['TELL', 'Tell Wren: **"A small brave bird."** ~~(a bluff — it is not in any alphabet you know)~~'], ['DONTKNOW', '**"I don\'t know yet."** ~~(the truth)~~']],
            after: { TELL: 'Wren grins, delighted, and says it twice under the breath. *A small brave bird.* You made that up. It sounded true, which is not the same thing.', DONTKNOW: 'Wren nods, not disappointed. *"Yet. Good. Tell me when."* You will, you think. You are not sure when.' } },
          listener: { prompt: hurt ? 'Wren, sitting on a tub with the bad arm held close, asks it to the arm rather than to you. *"The Listener. You say you hear everyone\'s heart. Can you hear mine?"*' : 'Wren, pretending to fold a sheet, so it looks like nothing. *"The Listener. You say you hear everyone\'s heart. Can you hear mine?"*',
            opts: [['LOUD', '**"Yes. Loud."** ~~(a lie)~~'], ['NO', '**"No."** ~~(the truth)~~']],

          seer: { prompt: hurt ? 'Wren, hurt and trying not to show it, asks without warning. *"The Seer. You look at me strangely sometimes. More, since the stair. What do you see?"*' : 'Wren, close, in the steam. *"The Seer. You look at me strangely sometimes. You\'re doing it now. What do you see?"*',
            opts: [['TELL', 'Tell Wren about **the shadow**: it falls toward the fire. Every fire. ~~(the truth)~~'], ['NOTHING', '**Say nothing.** Look at the wall.']],
            after: { TELL: 'Wren listens to the whole thing and does not laugh. *"Toward. Huh."* Then, after a while: *"That\'s very poetic, the Seer."* You did not mean it poetically.', NOTHING: 'You look at the wall. Wren looks at you looking at it, and lets you.' } },

            opts: [['YES', '**"Yes."**'], ['DONTKNOW', '**"I don\'t know."** ~~(the truth)~~']],
            after: { YES: 'Wren nods like someone receiving a verdict they expected. *"Right. Yes. Good to have it from a Binder."* You said yes because it was kind. You are not sure it was kind.', DONTKNOW: 'Wren is quiet for a moment. *"Nobody\'s ever said that to me. Everyone always knows."* And then, almost too low to hear: *"Thanks."*' } },
        }[roleId];
        P.speak.push({ t: 'h', text: 'In the Laundry, in a whisper' });
        P.speak.push({ t: 'fine', text: L.houseRule + ' Choose alone. Your phone will give you one sealed word; the Hearth will ask for it after the Tower, from all four of you at once.' });
        P.speak.push({ t: 'choice', id: 'whisper', prompt: Q.prompt, options: Q.opts.map(([id, text]) => ({ id, text })), after: (optId) => Q.after[optId] });
        P.speak.push({ t: 'fine', text: 'Nobody at the table will know what you answered. Wren will.' });
      }
      return P;
    },
  });
})();

        P.sight.push({ t: 'p', text: '**The Oath scroll.** Three glyphs and a lock, clean on your page where the Hearth shows them worn:' });
        P.sight.push({ t: 'html', html: oathInscription('#f2d27a') });
        P.sight.push({ t: 'p', text: `${G.svg('THORN', { size: 30, color: '#f2d27a' })} THORN, ${G.svg('ASH', { size: 30, color: '#f2d27a' })} ASH, ${G.svg('WELL', { size: 30, color: '#f2d27a' })} WELL — *a gate; fire; down* — and a lock, which is not written because the swearer writes it. Where the ring begins is the Seer\'s; the order is the Listener\'s; what may lock an oath is the Binder\'s.` });

        P.wren.push({ t: 'h', text: 'The name' });
        P.wren.push({ t: 'p', text: 'You ciphered it yourself, in the Provost\'s study, with her primer. **WRENN.** Not a bird. The hollow of a bell — the space inside it that makes the sound.' });
        const a = ctx.answer('ch3', 'whisper');
        P.wren.push({ t: 'p', text: a === 'TELL' ? 'In the laundry you told Wren it meant *a small brave bird*. It was kind. It is not in any alphabet.' : a === 'DONTKNOW' ? 'In the laundry you said you did not know yet. You know now.' : 'Whatever you said in the laundry, you know now.' });
        P.wren.push({ t: 'p', text: scared ? 'Wren has not asked you again tonight. Wren has not asked anyone anything since the fourth bell.' : 'It is a good name for a bell. You do not yet know why it makes you want to sit down.' });
        P.speak.push({ t: 'fine', text: 'Nothing to speak this chapter. When the Hearth calls **The Reader**, the keyboard is yours: the journal on the desk, and the first glyph of the oath.' });
      }

      /* ================= LISTENER ================= */
      if (roleId === 'listener') {
        P.sight.push({ t: 'h', text: 'The memory-bell (page 1 of 4)' });
        P.sight.push({ t: 'p', text: 'On the mantel, older than the mantel. Struck, it says back the last thing said near it — to an Ear. The Hearth hears a hum. Cup yours.' });
        P.sight.push({ t: 'audio', label: 'The bell remembers: two voices', strip: CA.strip([-1, -2, 'rest', 2, 1, -3]), play: (A) => { CA.playSteps(A, [-1, -2], 58); CA.later(() => CA.announce(2, { rest: true }), 2000); CA.later(() => CA.playSteps(A, [2, 1, -3], 66, { offset: 3 }), 2400); return 2400 + 4 * 650 + 500; },
          text: 'A low voice, courteous and certain — **the Envoy, Vane:** *"The Crown will have the Cold open, Ilsabet, one way or another."*\n\nThen a voice you know from two floors down — **the Provost:** *"Then the Crown will go through me. And through it."*' });
        P.sight.push({ t: 'fine', text: 'Voices, not glyphs: two people speaking, low then high. There is nothing here for the row-player.' });
        P.sight.push({ t: 'fine', text: 'Say it word for word. Then say whose. *Through it.* Nobody at the table will like that sentence; say it anyway.' });
        P.sight.push({ t: 'h', text: 'The Founders\' phrase, again (page 2 of 4)' });
        P.sight.push({ t: 'audio', label: 'The Hymn\'s opening, as the Founders left it', strip: CA.strip([1, 3, -2]), play: (A) => CA.playSteps(A, [1, 3, -2]), text: '**Up one, up three, down two.** Over the four glyphs the Founders left on their plinths there is only one order that climbs like this. Your row-player is in the Book if you want to test it.' });
        P.sight.push({ t: 'p', text: 'The shelf itself plays nothing. Eight books; what you have is the phrase, and the Reader has the four.' });
        P.sight.push({ t: 'h', text: 'The Oath\'s phrase (page 3 of 4)' });
        P.sight.push({ t: 'audio', label: 'The scroll, when the ring is touched', strip: CA.strip([-1, 4]) + '<div class="arrow-strip"><span class="step rest"><b>◆</b>then the lock</span></div>', play: (A) => CA.playSteps(A, [-1, 4]), text: '**Down one, up four — then the lock.** The lock is not a note; it is a glyph someone chooses. Three notes, three of the Reader\'s glyphs; the order is yours, from wherever the Seer says the ring begins.' });
        P.sight.push({ t: 'h', text: 'Heartbeats in the study (page 4 of 4)' });
        P.sight.push({ t: 'html', html: `<div class="heartbeats">${['Reader', 'Listener', 'Seer', 'Binder'].map(n => `<div class="hb"><span>${n}</span>${D.trace('normal')}</div>`).join('')}<div class="hb"><span>the Provost</span>${D.trace(f.SURRENDERED ? 'fast' : 'normal')}</div><div class="hb"><span>Wren</span>${D.trace('flat')}</div></div>` });
        P.sight.push({ t: 'fine', text: f.SURRENDERED ? 'The Provost\'s: fast, and staying fast, even after the door closed. Wren\'s: too quiet to catch. Still.' : 'The Provost\'s: slow. Slower than a heart should be on a night like this — the slowness of a thing decided. Wren\'s: too quiet to catch. Still.' });

        P.wren.push({ t: 'h', text: 'What the bell would not keep' });
        P.wren.push({ t: 'p', text: scared ? 'You struck the bell twice more while nobody was looking. It gave you the Provost again, and the Envoy again, and your own voice asking the Seer for the primer. Wren has not spoken since the fourth bell — but you remember the laundry, and the bell there, and you have started to wonder whether any bell has ever kept Wren\'s voice.' : 'You struck the bell twice more while nobody was looking. It gave you the Provost again, and the Envoy again, and — from a minute ago — your own voice asking the Seer for the primer. It did not give you Wren\'s joke about the lamp. It keeps every voice in the room but one.' });
        P.speak.push({ t: 'fine', text: 'Nothing to speak this chapter. When the Hearth calls **The Listener**, the keyboard is yours: the bell on the mantel, and the second glyph of the oath.' });
      }

      /* ================= SEER ================= */
      if (roleId === 'seer') {
        P.sight.push({ t: 'h', text: 'Under the shelf (page 1 of 4)' });
        P.sight.push({ t: 'p', text: 'The third shelf was re-hung upside down — the whole board, all eight books, in one go. One turned line: the **mark is on the right**.' });
        P.sight.push({ t: 'svg', cls: 'underlayer', svg: underShelf });
        P.sight.push({ t: 'fine', text: 'A turned line: Reader reads it right to left with every glyph inverted, and the Binder\'s Book has the Law that says so. Every book keeps its *place* on the shelf — the book you pull is the book in that position, whatever it now reads.' });
        P.sight.push({ t: 'h', text: 'Under the paint (page 2 of 4)' });
        P.sight.push({ t: 'p', text: 'The tapestry. Under the Order\'s picture — the hall, the fire, the one small figure — this:' });
        P.sight.push({ t: 'svg', cls: 'underlayer', svg: underTapestry });
        P.sight.push({ t: 'fine', text: 'Four. No child. The fourth hand holds a **flame turned over**. The Hearth can scrape it, and the table should; you already know what they will find.' });
        P.sight.push({ t: 'h', text: 'The Oath ring (page 3 of 4)' });
        P.sight.push({ t: 'p', text: 'The scroll\'s ring has its mark at **slot 4**. Sunwise from there: 4, then 1, then 2, then 3. The last placed is the lock.' });
        P.sight.push({ t: 'svg', cls: 'underlayer', svg: underRing });
        P.sight.push({ t: 'h', text: 'Shadows in the study (page 4 of 4)' });
        P.sight.push({ t: 'svg', cls: 'underlayer', svg: underStudy });
        P.sight.push({ t: 'fine', text: 'The Provost\'s falls away from her own fire, like yours. One does not.' });

        P.wren.push({ t: 'h', text: 'The boy who scraped the paint' });
        P.wren.push({ t: 'p', text: 'Twenty-two years ago a Warden with your Sight scraped this same paint, in the Hall, saw four, and was sent away for it. He is the Envoy now. You have been told all night not to trust him. You have his eyes.' });
        P.wren.push({ t: 'p', text: scared ? 'Wren has not looked at the tapestry once. Wren has not looked at anything since the fourth bell.' : 'Wren keeps glancing at the tapestry and then at you, as if you might have moved it.' });
        P.speak.push({ t: 'fine', text: 'Nothing to speak this chapter. When the Hearth calls **The Seer**, the keyboard is yours: the tapestry, and the third glyph of the oath. You are also the Voice: read the Hearth aloud.' });
      }

      /* ================= BINDER ================= */
      if (roleId === 'binder') {
        P.sight.push({ t: 'h', text: 'Laws for the study (page 1 of 3)' });
        P.sight.push({ t: 'html', html: lawHtml([law(10), law(4), law(3)]) });
        P.sight.push({ t: 'p', text: '**Law 10, for the shelf.** If the Seer says the line is turned: reverse it and invert every glyph — but every glyph *keeps its place*. Pull the book by where it stands, not by what it says.' });
        P.sight.push({ t: 'p', text: '**Law 4, for the oath.** The last glyph is the lock, and only two glyphs can be one. **KNOT** cannot be unbound. **EMBER** can be remembered and reconsidered. *The one you swear to cannot tell the difference.* This one is yours to argue, and the table should hear you argue it.' });
        P.sight.push({ t: 'h', text: 'Threads in the study (page 2 of 3)' });
        P.sight.push({ t: 'list', items: [
          '**The Provost → Wren:** *grey.* Not thin, not fraying — grey all through. The colour of someone who has already said goodbye.',
          '**The Provost → the four of you:** red, unfinished — an oath lying on the desk waiting to be tied.' + (f.SURRENDERED ? ' There is a knot in it that was not there this morning.' : ''),
          '**The Provost → the Convocation:** gold, thin, pulled very tight.',
          '**The bell on the mantel:** it holds a thread\'s worth of the Envoy. Gold, and under the gold, red. He is pulled two ways.',
          '**Wren:** *No thread found.* Not unbound; the knot itself.',
        ] });
        if (f.ORIEL) {
          P.sight.push({ t: 'h', text: 'Under the cushion — Oriel\'s note (page 3 of 3)' });
          P.sight.push({ t: 'letter', text: '"I scraped the paint myself, as a girl, in the Hall, with a bread-knife, and put it back before Matins. Four. Vane saw it too, twenty years after me; that is why he was sent away and I was not — I never said. You asked me to tell you what you find below. Here is what I found first. — Oriel."' });
          P.sight.push({ t: 'p', text: 'Law 0 was struck in 212 for being wrong. A Law struck for being wrong is un-struck by being right. The Seer\'s tapestry, the Reader\'s rubbing, or this note — any one of them restores it. From the next chapter your Book will show it **restored**.' });
        } else if (marrowLetter) {
          P.sight.push({ t: 'h', text: 'Under the cushion — an unsent letter (page 3 of 3)' });
          P.sight.push({ t: 'letter', text: '"To the Convocation. I have chaired you for nineteen years and lied to you for fourteen — not in what I said; in what I did not. There is another way. I have never said the other way aloud, because saying it costs four of us what sending one costs none of us. I will send this when I am braver. — I. Marrow."' });
          P.sight.push({ t: 'fine', text: 'Never sent. You are the first to read it. Read it to them.' });
        } else {
          P.sight.push({ t: 'h', text: 'Under the cushion (page 3 of 3)' });
          P.sight.push({ t: 'fine', text: 'Nothing but the shape of her. Whatever the Provost writes and does not send, she does not keep it in her chair tonight.' });
        }

        P.wren.push({ t: 'h', text: 'The lock' });
        P.wren.push({ t: 'p', text: 'You will tie this oath. Tie it under **KNOT** and it cannot be untied — not by you, not by the Provost, not by whatever happens at midnight. Tie it under **EMBER** and it can be reconsidered later, if there turns out to be a later.' });
        P.wren.push({ t: 'p', text: 'The one you swear to cannot tell the difference. Neither can Wren. You can.' });
        P.wren.push({ t: 'p', text: scared ? 'Wren has not looked at you since the fourth bell. You have looked for a thread anyway. There is still nothing to find.' : 'Wren asked you in the laundry whether you thought Wren was really the one. You have looked for a thread every hour since. There is still nothing to find.' });
        P.speak.push({ t: 'fine', text: 'Nothing to speak this chapter. When the Hearth calls **The Binder**, the keyboard is yours: the Provost\'s chair, and the lock of the oath.' });
      }
      return P;
    },
  });
})();

</script>
<script>/* js/content/companion/ch5.js */
/* Companion — Chapter V: The Long Stair (ASH · cast: OATH, EMBER_LOST, LAW0, VANE_ACCEPT, WREN_HURT) */
(function () {
  'use strict';
  const G = window.VigilGlyphs, L = window.VigilLore, CA = window.CompanionAudio, D = window.CompanionDraw, UI = window.VigilUI;
  const C = window.CompanionContent;
  const VIOLET = '#a482e6', GOLD = '#f2d27a', SEA = '#4fb3bf', RED = '#d96b4a';
  const F = 'font-family="Cinzel,serif"';

  const GATE1 = [{ shape: 'Crown', inv: false }, { shape: 'Hook', inv: false }, { shape: 'Spike', inv: false }];
  const GATE2 = [{ shape: 'Crown', inv: false }, { shape: 'Flame', inv: false }, { shape: 'Flame', inv: true }, { shape: 'Hook', inv: false }, { shape: 'Spike', inv: true }];
  const DOOR = [{ shape: 'Flame', inv: false }, { shape: 'Spike', inv: false }, { shape: 'Spike', inv: true }];
  const insc = (items, mark) => G.inscription(items, { showMark: !!mark, mark: mark || null, color: '#fff', markColor: VIOLET });
  const gl = (n, c) => G.svg(n, { size: 30, color: c || GOLD });
  const pg = (i, n) => ({ t: 'fine', text: `~~page ${i} of ${n}~~` });

  /* ---------- Seer under-layers ---------- */
  function ringUnder(n, markSlot, caption) {
    const cx = 120, cy = 100, R = 62;
    let s = `<g stroke="#fff" fill="none" stroke-width="1.5" transform="translate(${cx},${cy})"><circle r="${R}"/>`;
    for (let i = 0; i < n; i++) { const a = (i / n * 360 - 90) * Math.PI / 180; s += `<circle cx="${(Math.cos(a) * R).toFixed(1)}" cy="${(Math.sin(a) * R).toFixed(1)}" r="11"/><text x="${(Math.cos(a) * (R + 22)).toFixed(1)}" y="${(Math.sin(a) * (R + 22) + 4).toFixed(1)}" text-anchor="middle" fill="#fff" font-size="11" ${F} stroke="none">${i + 1}</text>`; }
    const am = ((markSlot - 1) / n * 360 - 90) * Math.PI / 180;
    s += `<path d="M${(Math.cos(am) * (R - 20)).toFixed(1)},${(Math.sin(am) * (R - 20)).toFixed(1)} l-6,-6 l12,0 z" fill="${VIOLET}" stroke="none" transform="rotate(${((markSlot - 1) / n * 360).toFixed(0)} ${(Math.cos(am) * (R - 20)).toFixed(1)} ${(Math.sin(am) * (R - 20)).toFixed(1)})"/>`;
    s += `<path d="M-16,-${R + 18} a${R + 18},${R + 18} 0 0 1 32,0" stroke-width="1.5"/><path d="M16,-${R + 18} l-7,-4 l0,8 z" fill="#fff" stroke="none"/></g>`;
    s += `<text x="${cx}" y="192" text-anchor="middle" fill="${VIOLET}" font-size="10" ${F}>${caption}</text>`;
    return s;
  }
  // An inscription drawn as a plain group (a nested <svg> would be resized by the page's CSS).
  const inscG = (items, mark, x, y) => {
    const cell = 40, w = items.length * cell + 28, h = 52;
    let s = `<g transform="translate(${x - w / 2},${y})"><rect x="0" y="0" width="${w}" height="${h}" rx="5" fill="none" stroke="#fff" stroke-opacity=".35"/>`;
    items.forEach((it, i) => { s += `<g transform="translate(${14 + i * cell + cell / 2},${h / 2}) scale(0.9)" style="color:#fff">${G.shapeInner(it.shape, it.inv)}</g>`; });
    const mx = mark === 'left' ? 7 : w - 7; s += `<path d="M${mx},${h / 2 - 7} L${mx + (mark === 'left' ? 6 : -6)},${h / 2} L${mx},${h / 2 + 7} Z" fill="${VIOLET}"/>`;
    return s + `</g>`;
  };
  const underGate = (items, mark, n, markSlot, title, cap) => `<svg viewBox="0 0 360 300"><rect width="360" height="300" fill="#000"/>
    <text x="180" y="16" text-anchor="middle" fill="#fff" font-size="11" ${F}>${title}</text>
    ${inscG(items, mark, 180, 28)}
    <text x="180" y="98" text-anchor="middle" fill="${VIOLET}" font-size="10" ${F}>the carving's mark: on the ${mark.toUpperCase()}${mark === 'right' ? ' — turned' : ' — upright'}</text>
    <g transform="translate(60,100)">${ringUnder(n, markSlot, cap)}</g>
    <text x="310" y="196" text-anchor="middle" fill="#fff" font-size="9" ${F} opacity=".7">sunwise =</text><text x="310" y="208" text-anchor="middle" fill="#fff" font-size="9" ${F} opacity=".7">clockwise</text>
  </svg>`;
  const underGate1 = underGate(GATE1, 'right', 5, 1, 'THE TURNED GATE — under the stone', 'the scratch — slot 1');
  const underGate2 = underGate(GATE2, 'left', 5, 3, 'THE SILENT GATE — under the stone', 'the scratch — slot 3');
  const underDoor = underGate(DOOR, 'left', 4, 2, 'MERE\'S DOOR — under the wall', 'the scratch — slot 2');

  // The ledge over the Under-Marches: a torch, four shadows away from it, Wren's toward it.
  const underLedge = `<svg viewBox="0 0 360 230">
    <rect width="360" height="230" fill="#000"/>
    <g stroke="#fff" fill="none" stroke-width="1.2">
      <path d="M10,150 L120,150 L140,170 L350,170"/><path d="M10,150 L10,220 M350,170 L350,220"/>
      ${[0, 1, 2, 3].map(i => `<path d="M${200 + i * 36},130 l0,-24 l6,-8 l6,8 l0,24 z"/>`).join('')}
      <text x="254" y="92" text-anchor="middle" fill="#fff" font-size="9" ${F}>four thrones</text>
      <path d="M30,120 L30,80 M22,84 L38,84"/><ellipse cx="30" cy="74" rx="6" ry="9"/>
      <text x="30" y="135" text-anchor="middle" fill="#fff" font-size="9" ${F}>torch</text>
      <path d="M0,200 C60,190 120,210 180,200 C240,190 300,210 360,200" stroke="${SEA}" stroke-dasharray="3 3"/>
      <text x="180" y="222" text-anchor="middle" fill="${SEA}" font-size="9" ${F}>the Cold, below — it throws no shadow that you can see</text>
    </g>
    <g fill="#fff" opacity=".9"><circle cx="90" cy="120" r="6"/><circle cx="120" cy="105" r="6"/><circle cx="150" cy="125" r="6"/><circle cx="175" cy="108" r="6"/><circle cx="110" cy="140" r="6"/></g>
    <g stroke="#fff" stroke-width="3" opacity=".55" stroke-linecap="round"><path d="M90,120 L124,132"/><path d="M120,105 L154,113"/><path d="M150,125 L184,133"/><path d="M175,108 L208,114"/></g>
    <g stroke="${VIOLET}" stroke-width="3" opacity=".9" stroke-linecap="round"><path d="M110,140 L72,130"/></g>
    <g fill="#fff" font-size="9" ${F}><text x="82" y="112">Reader</text><text x="112" y="97">Listener</text><text x="142" y="118">Seer</text><text x="167" y="100">Binder</text><text x="100" y="158" fill="${VIOLET}">Wren</text></g>
    <text x="180" y="30" text-anchor="middle" fill="#fff" font-size="9" ${F} opacity=".7">shadows on the ledge, as they fall</text>
  </svg>`;

  // Nine stones, two hollow.
  const stonesSvg = `<svg viewBox="0 0 360 250">
    <rect width="360" height="250" fill="#000"/>
    ${[0, 1, 2, 3, 4, 5, 6, 7, 8].map(i => { const x = 60 + (i % 3) * 120, y = 50 + Math.floor(i / 3) * 75; const hollow = i === 2 || i === 7; const rx = 44 + (i % 2) * 6, ry = 26 + (i % 3) * 3;
      return `<g transform="translate(${x},${y})"><path d="M${-rx},0 C${-rx},-${ry} ${-rx * 0.4},-${ry + 6} 0,-${ry} C${rx * 0.5},-${ry + 4} ${rx},-${ry * 0.6} ${rx},0 C${rx},${ry} ${rx * 0.3},${ry + 4} 0,${ry} C${-rx * 0.6},${ry + 2} ${-rx},${ry * 0.5} ${-rx},0 Z" fill="none" stroke="#fff" stroke-width="1.4"/>${hollow ? `<path d="M${-rx * 0.55},2 C${-rx * 0.5},-${ry * 0.5} ${-rx * 0.1},-${ry * 0.6} ${rx * 0.2},-${ry * 0.35} C${rx * 0.55},-${ry * 0.1} ${rx * 0.5},${ry * 0.5} ${rx * 0.1},${ry * 0.55} C${-rx * 0.3},${ry * 0.6} ${-rx * 0.55},${ry * 0.3} ${-rx * 0.55},2 Z" fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="3 2" opacity=".8"/>` : `${[0, 1, 2].map(k => `<path d="M${-rx * 0.6 + k * 12},${-ry * 0.5 + k * 8} l${rx * 0.9},${ry * 0.15}" stroke="#fff" stroke-width=".8" opacity=".35"/>`).join('')}`}<text y="${ry + 14}" text-anchor="middle" fill="#fff" font-size="9" ${F} opacity=".6">${i + 1}</text></g>`; }).join('')}
    <text x="180" y="244" text-anchor="middle" fill="${VIOLET}" font-size="10" ${F}>solid stone hatches; a hollow shows its cavity</text>
  </svg>`;

  /* ---------- Reader: nine worn glyphs, three read EMBER ---------- */
  const NINE = [['Crown', true], ['Crown', false], ['Flame', false], ['Crown', true], ['Hook', false], ['Spike', true], ['Crown', false], ['Flame', true], ['Crown', true]];
  const nineSvg = `<svg viewBox="0 0 330 260" width="100%" style="max-width:330px;display:block;margin:0 auto">
    <rect x="2" y="2" width="326" height="256" rx="6" fill="rgba(0,0,0,0.35)" stroke="rgba(212,169,78,0.25)"/>
    ${NINE.map(([sh, inv], i) => { const x = 55 + (i % 3) * 110, y = 48 + Math.floor(i / 3) * 84; return `<g transform="translate(${x},${y}) scale(1.3)" style="color:#e9e2d2" opacity="${0.55 + (i % 4) * 0.08}">${G.shapeInner(sh, inv)}</g><path d="M${x - 22 + (i * 7) % 15},${y - 16 + (i * 11) % 30} l${18 + (i * 5) % 20},${(i % 3) * 6 - 4}" stroke="rgba(11,10,16,0.9)" stroke-width="${2 + i % 3}"/><text x="${x}" y="${y + 36}" text-anchor="middle" font-size="9" fill="rgba(233,226,210,0.45)" ${F}>${i + 1}</text>`; }).join('')}
  </svg>`;

  /* ---------- Binder: Laws and oaths ---------- */
  const lawHtml = (list) => `<div class="laws">${list.map(l => `<div class="law ${l.era === 'O' ? 'order' : 'founders'}${l.struck ? ' struck' : ''}${l.restored ? ' restored' : ''}"><div class="era">Law ${l.n} · ${l.era === 'F' ? 'Founders\' · Year 0' : 'Order\'s · Year ' + l.year}${l.restored ? ' · RESTORED' : l.struck ? ' · STRUCK' : ''}</div><div class="txt">${l.text}</div>${l.note ? `<div class="fine">${l.note}</div>` : ''}</div>`).join('')}</div>`;
  const law = (n) => L.laws.find(l => l.n === n);
  const OATHS = [
    { name: 'Oath of the Gate', line: ['THORN', 'ASH'], lock: 'KNOT' },
    { name: 'Oath of the Keeper', line: ['WELL', 'EMBER'], lock: 'EMBER' },
    { name: 'Oath of the Veil', line: ['ASH', 'THORN'], lock: 'VEIL' },
    { name: 'Oath of the Well', line: ['WELL', 'ASH'], lock: 'KNOT' },
    { name: 'Oath of the Chair', line: ['CROWN', 'THORN'], lock: 'EMBER' },
  ];
  const oathsHtml = `<table class="blk-table"><tr><th>oath</th><th>line</th><th>lock (last glyph)</th></tr>${OATHS.map(o => `<tr><td>${o.name}</td><td>${o.line.map(n => gl(n, RED)).join(' ')}</td><td>${gl(o.lock, RED)}</td></tr>`).join('')}</table><p class="fine">Locks are shown as carved, unnamed. The Hook upright is ${gl('KNOT', RED)} KNOT; turned, ${gl('VEIL', RED)} VEIL. The Crown upright is ${gl('CROWN', RED)} CROWN; turned, ${gl('EMBER', RED)} EMBER.</p>`;

  /* ---------- the Founders' Count task ---------- */
  const MATERIAL = {
    reader: { q: 'Nine glyphs on the newel, worn. The line is upright — read each as it stands. **How many read EMBER?**', html: nineSvg },
    listener: { q: 'A peal of two bells, one higher, one lower. **How many times does the LOWER bell strike?** Cup your ear; play it as often as you need.', html: null },
    seer: { q: 'Nine stones in the under-layer of the landing. **How many are hollow?**', html: `<div class="blk-svg underlayer">${stonesSvg}</div>` },
    binder: { q: 'Five oaths carved on the newel. Law 12 (Founders\'): *an oath binds only if its lock is KNOT or EMBER.* The lock is the last glyph. **How many bind?**', html: oathsHtml },
  };
  const PEAL = 'HLHLHHLHLHHL'; // lower bell strikes 5 times, the higher 7
  function playPeal(Audio) { Audio.init(); if (Audio.isMuted()) Audio.setMuted(false); PEAL.split('').forEach((c, i) => CA.later(() => Audio.note(c === 'H' ? 79 : 64, 0.9, c === 'H' ? 0.14 : 0.2), i * 480)); return PEAL.length * 480 + 600; }

  function countTask(roleId) {
    return { t: 'task', id: 'count', title: 'The Founders\' Count — 45 seconds', replayable: true, run: (box, api) => {
      const key = 'ch5:count'; const prev = api.state.done[key];
      let ctl = null;
      const mat = MATERIAL[roleId];
      const idle = () => {
        UI.clear(box);
        if (prev != null) { box.appendChild(UI.el('div', { class: 'big-digit', text: String(prev) })); box.appendChild(UI.el('p', { class: 'fine', text: 'Your digit. Say it aloud when the Hearth asks — in seat order, the Reader first. Never show the phone.' })); }
        else box.appendChild(UI.el('p', { class: 'fine', text: 'The Hearth will count 3, 2, 1, START. On START, press Start. You have forty-five seconds to find one digit.' }));
        box.appendChild(UI.el('button', { class: 'btn primary big-btn', text: prev != null ? 'Count again' : 'Start', onclick: start }));
      };
      const start = () => {
        UI.stopAudio(); // Start is a press like any other: drop a peal still sounding from the last attempt
        if (ctl) { ctl.cancel(); ctl = null; }
        UI.clear(box); api.audio.init(); if (api.audio.unlockMedia) api.audio.unlockMedia();
        box.appendChild(UI.el('p', { html: UI.rich(mat.q) }));
        if (mat.html) box.appendChild(UI.el('div', { html: mat.html }));
        if (roleId === 'listener') { box.appendChild(UI.audioButton('Cup your ear — the peal', () => playPeal(api.audio))); const rv = UI.el('div', {}); box.appendChild(rv); rv.appendChild(UI.el('button', { class: 'btn small ghost', text: 'I cannot hear it — show the peal', onclick: () => { rv.innerHTML = `<div class="arrow-strip">${PEAL.split('').map(c => `<span class="step"><b>${c === 'H' ? '▲' : '▼'}</b>${c === 'H' ? 'high' : 'low'}</span>`).join('')}</div>`; } })); playPeal(api.audio); }
        const cd = UI.el('div', { class: 'cd', text: '45' }); box.appendChild(cd);
        ctl = UI.countdown(box, 45, (s) => { cd.textContent = s; });
        ctl.promise.then(() => { cd.textContent = 'TIME — pick your digit'; });
        box.appendChild(UI.el('p', { class: 'fine', text: 'Your digit:' }));
        const grid = UI.el('div', { class: 'pick-grid', style: { gridTemplateColumns: 'repeat(5, 1fr)' } });
        for (let d = 0; d <= 9; d++) grid.appendChild(UI.el('div', { class: 'pk', text: String(d), onclick: () => { ctl.cancel(); api.state.done[key] = d; api.save(); api.audio.sfx('seal'); render(d); } }));
        box.appendChild(grid);
      };
      const render = (d) => { UI.clear(box); box.appendChild(UI.el('div', { class: 'big-digit', text: String(d) })); box.appendChild(UI.el('p', { class: 'fine', text: 'Sealed. Say it aloud when the Hearth asks — in seat order, the Reader first. Never show the phone.' })); box.appendChild(UI.el('button', { class: 'btn small ghost', text: 'Count again', onclick: start })); };
      idle();
    } };
  }

  /* ---------- The Thread (after YES): a hold-button; fraying is counted on this phone only ---------- */
  const threadBlock = { t: 'custom', render: (el, ctx) => {
    // Appears once this phone has answered YES (the page is not re-rendered by the choice, so poll briefly).
    if (ctx.answer('ch5', 'hold') !== 'YES') { const iv = setInterval(() => { if (!el.isConnected) { clearInterval(iv); return; } if (ctx.answer('ch5', 'hold') === 'YES') { clearInterval(iv); threadBlock.render(el, ctx); } }, 500); return; }
    const key = 'ch5:thread'; const st = ctx.state.done[key] || { fray: 0, held: 0 }; ctx.state.done[key] = st;
    el.appendChild(UI.el('div', { class: 'blk-divider' }));
    el.appendChild(UI.el('h3', { text: 'The Thread' }));
    el.appendChild(UI.el('p', { html: UI.rich('If the Hearth named **you**: your Sight is spent for now, and this is your page. Keep a finger on the thread until the Hearth says it is tied off — through the first two rounds of the Bells. If it named someone else, you may put this down; nothing is counted.') }));
    const line = UI.el('div', { class: 'thread-line' }); line.style.opacity = '.35';
    const btn = UI.el('button', { class: 'btn thread-hold', text: 'HOLD THE THREAD' });
    const stat = UI.el('p', { class: 'fine', text: 'Not held.' });
    let holding = false, since = 0, everHeld = !!st.held;
    const down = (e) => { e.preventDefault(); if (holding) return; holding = true; since = Date.now(); everHeld = true; line.style.opacity = '1'; btn.textContent = 'HOLDING'; stat.textContent = 'Held. Do not let go.'; try { ctx.audio.init(); ctx.audio.sfx('seal'); } catch (x) {} };
    const up = () => { if (!holding) return; holding = false; st.held += Math.round((Date.now() - since) / 1000); st.fray += 1; ctx.save(); line.style.opacity = '.35'; btn.textContent = 'HOLD THE THREAD'; stat.textContent = 'The thread frays a little. Take it up again.'; try { ctx.audio.sfx('miss'); } catch (x) {} };
    btn.addEventListener('pointerdown', down); btn.addEventListener('pointerup', up); btn.addEventListener('pointerleave', up); btn.addEventListener('pointercancel', up);
    el.appendChild(line); el.appendChild(btn); el.appendChild(stat);
    el.appendChild(UI.el('p', { class: 'fine', text: 'The Hearth cannot see this page. Only you will ever know how well it was held.' }));
    void everHeld;
  } };

  /* ---------- pages ---------- */
  C.chapters.push({
    id: 'ch5',
    pages: (roleId, ctx) => {
      const P = { sight: [], wren: [], speak: [] };
      const f = ctx.flags || {}; const refused = (f.OATH | 0) === 0; const law0 = !!f.LAW0;
      const npages = refused ? 4 : 3;

      /* ===== READER ===== */
      if (roleId === 'reader') {
        let p = 1;
        if (refused) {
          P.sight.push(pg(p++, npages), { t: 'h', text: 'Mere\'s door — three shapes' });
          P.sight.push({ t: 'p', text: 'Over a ring of four slots, if the Hearth shows a door: a **Flame**, a **Spike**, a **Spike inverted**. Which way the line is read is the Seer\'s to say.' });
          P.sight.push({ t: 'html', html: insc(DOOR) });
          P.sight.push({ t: 'table', head: ['If the line is…', 'it reads'], rows: [['upright (mark left)', `${gl('ASH')} ASH · ${gl('THORN')} THORN · ${gl('WELL')} WELL — <em>fire · a gate · down</em>`], ['turned (mark right)', `${gl('THORN')} THORN · ${gl('WELL')} WELL · ${gl('COLD')} COLD — <em>a gate · down · cold</em>`]] });
        }
        P.sight.push(pg(p++, npages), { t: 'h', text: 'The Turned Gate — three shapes' });
        P.sight.push({ t: 'p', text: 'Clean on your page where the Hearth shows them worn: a **Crown**, a **Hook**, a **Spike**, all standing upright, left to right.' });
        P.sight.push({ t: 'html', html: insc(GATE1) });
        P.sight.push({ t: 'table', head: ['If the line is…', 'it reads'], rows: [['upright (mark left), left to right', `${gl('CROWN')} CROWN · ${gl('KNOT')} KNOT · ${gl('THORN')} THORN — <em>one · bound · a gate</em>`], ['turned (mark right), right to left, every glyph inverted', `${gl('WELL')} WELL · ${gl('VEIL')} VEIL · ${gl('EMBER')} EMBER — <em>down · hidden · kept</em>`]] });
        P.sight.push({ t: 'fine', text: 'A glyph never changes its place on the stone — only its reading. Which end the mark is on is Under-Sight, not yours. Where a turned line is *placed* on a ring is the Binder\'s Law.' });
        P.sight.push(pg(p++, npages), { t: 'h', text: 'The Silent Gate — five shapes' });
        P.sight.push({ t: 'p', text: 'Five shapes as they physically stand, left to right: a **Crown**, a **Flame**, a **Flame inverted**, a **Hook**, a **Spike inverted**.' });
        P.sight.push({ t: 'html', html: insc(GATE2) });
        P.sight.push({ t: 'table', head: ['If the line is…', 'it reads'], rows: [['upright (mark left)', `${gl('CROWN')} CROWN · ${gl('ASH')} ASH · ${gl('COLD')} COLD · ${gl('KNOT')} KNOT · ${gl('WELL')} WELL — <em>one · fire · cold · bound · down</em>`], ['turned (mark right)', `${gl('THORN')} THORN · ${gl('VEIL')} VEIL · ${gl('ASH')} ASH · ${gl('COLD')} COLD · ${gl('EMBER')} EMBER — <em>a gate · hidden · fire · cold · kept</em>`]] });
        P.sight.push({ t: 'fine', text: 'Either way, one of the five is **COLD** — the glyph the Order says is never written. The Book of Laws is the Binder\'s; the bells\' counts are the Listener\'s; the mark is the Seer\'s.' });
        P.sight.push(pg(p++, npages), { t: 'h', text: 'The Founders\' Count' });
        P.sight.push({ t: 'p', text: 'The third gate asks you for a **digit**: nine worn glyphs, and a question. It is on your **SPEAK** page. Do not start it until the Hearth says START.' });
        P.wren.push({ t: 'h', text: 'On the ledge' });
        P.wren.push({ t: 'p', text: 'Wren stands beside you looking at the four thrones, and says without turning: "You went quiet in the study, the Reader. You read something with my name in it." A pause. "You don\'t have to say. I just — I wanted you to know I noticed you being kind."' });
        if (f.WREN_HURT) P.wren.push({ t: 'p', text: 'Wren\'s strapped arm is between you. Wren has not mentioned it since the Vault, and has laughed twice on the stair, both times at the wrong moment.' });
        P.wren.push({ t: 'fine', text: 'The glossary in your Book still says what it said in the study. You have not told anyone. You are not sure what there is to tell.' });
      }

      /* ===== LISTENER ===== */
      if (roleId === 'listener') {
        let p = 1;
        if (refused) {
          P.sight.push(pg(p++, npages), { t: 'h', text: 'Mere\'s door — the phrase' });
          P.sight.push({ t: 'audio', label: 'The door, three notes', strip: CA.strip([1, 3]), play: (A) => CA.playSteps(A, [1, 3]), text: 'Up one, then up three. Of the glyphs the Reader reads, only one order climbs that way.' });
        }
        P.sight.push(pg(p++, npages), { t: 'h', text: 'The Turned Gate — the phrase' });
        P.sight.push({ t: 'audio', label: 'The gate, three notes', strip: CA.strip([1, -2]), play: (A) => CA.playSteps(A, [1, -2]), text: '**Up one, then down two.** Your Ladder is in the **Book**.' });
        P.sight.push({ t: 'p', text: 'Say this before anyone touches the ring: if the Reader reads the carving *upright* — CROWN, KNOT, THORN — those three fit this phrase in **no order at all**. CROWN is step 6, KNOT step 2, THORN step 1; nothing there goes up one and down two. Only the *turned* reading fits, and it fits exactly one way.' });
        P.sight.push(pg(p++, npages), { t: 'h', text: 'The Silent Gate — five muted bells' });
        P.sight.push({ t: 'p', text: 'One bell hangs above each of the five shapes, first to fifth, left to right. The Hearth cannot hear them. You can: each bell taps a **count**. A bell\'s count is its glyph\'s slot, counted **sunwise from the mark** — and the mark is the Seer\'s.' });
        const counts = [2, 5, 1, 3, 4];
        P.sight.push({ t: 'custom', render: (el, cx) => {
          const wrap = UI.el('div', { class: 'blk-audio' });
          counts.forEach((n, i) => {
            const cracked = f.EMBER_LOST && n === 5;
            const row = UI.el('div', { class: 'row', style: { alignItems: 'center', gap: '10px', margin: '6px 0' } });
            row.appendChild(UI.audioButton(`Bell ${i + 1}${cracked ? ' — cracked' : ''}`, () => { cx.audio.init(); if (cx.audio.isMuted()) cx.audio.setMuted(false); if (cracked) { cx.audio.sfx('miss'); return 700; } return CA.pulses(cx.audio, n, 440); }, { cls: 'small' + (cracked ? ' ghost' : '') }));
            row.appendChild(UI.el('span', { class: 'fine', text: cracked ? 'over the second shape. It does not sound.' : `over the ${['first', 'second', 'third', 'fourth', 'fifth'][i]} shape` }));
            wrap.appendChild(row);
          });
          wrap.appendChild(UI.el('p', { class: 'fine nohear', text: 'No sound? Set the phone to ring, not silent, turn the volume up, and press again. The counts are also written under "If your ear fails", below.' }));
          el.appendChild(wrap);
        } });
        if (f.EMBER_LOST) P.sight.push({ t: 'p', text: 'The second bell is **cracked** — a hairline from the night the Ember left the school — and gives nothing. But the five counts are one each of **1 to 5**, so the missing count is whichever the other four do not say.' });
        P.sight.push({ t: 'reveal', label: 'If your ear fails — the counts, written', blocks: [{ t: 'table', head: ['bell', 'taps'], rows: counts.map((n, i) => [`${i + 1} (${['first', 'second', 'third', 'fourth', 'fifth'][i]} shape)`, f.EMBER_LOST && n === 5 ? 'cracked — silent. The one count the others leave out.' : String(n)]) }] });
        P.sight.push(pg(p++, npages), { t: 'h', text: 'The Founders\' Count' });
        P.sight.push({ t: 'p', text: 'The third gate asks you for a **digit**: a peal of two bells, and a question. It is on your **SPEAK** page. Do not start it until the Hearth says START.' });
        P.sight.push({ t: 'h', text: 'Heartbeats on the stair' });
        P.sight.push({ t: 'html', html: `<div class="heartbeats">${['Reader', 'Listener', 'Seer', 'Binder'].map(n => `<div class="hb"><span>${n}</span>${D.trace('normal')}</div>`).join('')}<div class="hb"><span>Provost Marrow</span>${D.trace('normal')}</div><div class="hb"><span>the soldiers, above</span>${D.trace('fast')}</div><div class="hb"><span>Wren</span>${D.trace('flat')}</div></div>` });
        P.sight.push({ t: 'fine', text: 'Marrow\'s is the slowest you have ever heard it — the beat of someone who has decided. Wren: too quiet to catch. The stair is quiet enough now that you would hear it, if there were anything to hear.' });
        P.wren.push({ t: 'h', text: 'What the stair sounds like' });
        P.wren.push({ t: 'p', text: 'Boots above, in step, twelve pairs. Water below, moving very slowly. Marrow, once, drawing a breath as if to say something to Wren, and not saying it. And beside you on the ledge, where Wren is standing, the thing you have been calling a fault in your gift for four years: nothing. Not quiet. *Nothing.*' });
        if (f.WREN_HURT) P.wren.push({ t: 'p', text: 'Wren\'s strapped arm knocks the wall on a turn of the stair. You hear the breath Wren does not let out.' });
        P.wren.push({ t: 'fine', text: 'The portraits in the Gallery said *four went down*. You have not stopped hearing it.' });
      }

      /* ===== SEER ===== */
      if (roleId === 'seer') {
        let p = 1;
        if (refused) {
          P.sight.push(pg(p++, npages), { t: 'h', text: 'Under Mere\'s door' });
          P.sight.push({ t: 'p', text: 'The carving\'s **mark is on the left**: upright, read left to right. The ring\'s scratch is at **slot 2** of four.' });
          P.sight.push({ t: 'svg', cls: 'underlayer', svg: underDoor });
        }
        P.sight.push(pg(p++, npages), { t: 'h', text: 'Under the Turned Gate' });
        P.sight.push({ t: 'p', text: 'The carving\'s **mark is on the RIGHT**. It was cut for those coming *up* the stair: the line is **turned** — The Reader reads it right to left with every glyph inverted. The ring\'s scratch is at **slot 1** of five.' });
        P.sight.push({ t: 'svg', cls: 'underlayer', svg: underGate1 });
        P.sight.push({ t: 'fine', text: 'Where a *turned* line is placed around a ring — sunwise or the other way — is not yours to see. The Binder has two Laws about it. Ask.' });
        P.sight.push(pg(p++, npages), { t: 'h', text: 'Under the Silent Gate' });
        P.sight.push({ t: 'p', text: 'The carving\'s **mark is on the LEFT**: upright, left to right. The ring\'s scratch is at **slot 3** of five — the sigil begins there, in the middle of the ring, and goes sunwise.' });
        P.sight.push({ t: 'svg', cls: 'underlayer', svg: underGate2 });
        P.sight.push(pg(p++, npages), { t: 'h', text: 'The Founders\' Count' });
        P.sight.push({ t: 'p', text: 'The third gate asks you for a **digit**: nine stones in the under-layer, and a question. It is on your **SPEAK** page. Do not start it until the Hearth says START.' });
        P.sight.push({ t: 'h', text: 'Under the ledge' });
        P.sight.push({ t: 'svg', cls: 'underlayer', svg: underLedge });
        P.sight.push({ t: 'fine', text: 'Four thrones, facing the same way — toward the Founders\' road, down. Under the water, the First Hall\'s floor has a door in it. Nothing on this page is a puzzle. Say what you see anyway.' });
        P.wren.push({ t: 'h', text: 'The shadow, again' });
        P.wren.push({ t: 'p', text: 'One torch on the ledge. Four shadows falling away from it, the way shadows do. Wren\'s falling toward it — and, when Marrow moves the lantern, toward *that* instead, as if Wren\'s shadow simply went to whatever was warmest. You have looked at this every chapter of the night. You have stopped calling it the lamp.' });
        if (f.WREN_HURT) P.wren.push({ t: 'p', text: 'Under the strapping on Wren\'s arm, in the under-layer, there is nothing wrong. Nothing to see at all. You are not sure what that means, and you are not going to say it on a stair.' });
      }

      /* ===== BINDER ===== */
      if (roleId === 'binder') {
        let p = 1;
        if (refused) {
          P.sight.push(pg(p++, npages), { t: 'h', text: 'Mere\'s door — one Law' });
          P.sight.push({ t: 'html', html: lawHtml([law(1)]) });
          P.sight.push({ t: 'p', text: 'Sunwise from the mark, three glyphs. The Seer has the mark; the Reader the words; the Listener the order. Nothing here disagrees with anything.' });
        }
        P.sight.push(pg(p++, npages), { t: 'h', text: 'The Turned Gate — two Laws that disagree' });
        P.sight.push({ t: 'html', html: lawHtml([law(5), law(11), law(3)]) });
        P.sight.push({ t: 'p', text: 'Read them by year. Law 11 is the Order\'s, written in 212: *every* inscription sunwise. Law 5 is the Founders\': a **turned** inscription is placed **widdershins** — anticlockwise — from its mark. Law 3 says which wins. This is the first time tonight two Laws have truly disagreed. It will not be the last.' });
        P.sight.push({ t: 'fine', text: 'So: if the Seer says the carving is turned, place its first glyph *on* the mark and the rest going the other way round the ring. If the Seer says upright, sunwise as ever.' });
        P.sight.push(pg(p++, npages), { t: 'h', text: 'The Silent Gate — the glyph that is never written' });
        P.sight.push({ t: 'html', html: lawHtml([law(6)]) });
        P.sight.push({ t: 'p', text: 'Order\'s, 212 — the same year as Law 11, the same year the Vault was rebuilt, the same year Law 0 was struck. Where the carving shows COLD, the Order leaves that slot **empty**.' });
        if (law0) {
          P.sight.push({ t: 'html', html: lawHtml([Object.assign({}, law(0), { struck: false, restored: true, note: 'Restored, by what you found in the study.' })]) });
          P.sight.push({ t: 'p', text: '**Law 0 is older than Law 6. The older binds: COLD is *written* — by four hands.** The gate will take the empty slot the way it has taken it from the Order for four hundred years. It will also take COLD, if all four keys close it. Either way is a true reading. One of them is older.' });
        } else {
          P.sight.push({ t: 'fine', text: 'On the 212 page of your Book, a Founders\' Law about COLD stands struck through in the same hand. It is struck. Struck Laws do not bind. You have read it a dozen times anyway.' });
        }
        P.sight.push(pg(p++, npages), { t: 'h', text: 'The Founders\' Count — Law 12' });
        P.sight.push({ t: 'html', html: lawHtml([law(12)]) });
        P.sight.push({ t: 'p', text: 'The third gate asks you for a **digit**: five oaths, and this Law. It is on your **SPEAK** page. Do not start it until the Hearth says START.' });
        P.sight.push({ t: 'h', text: 'Threads on the stair' });
        const threads = [
          '**Marrow — Wren:** grey. The colour of someone who has already said goodbye. It has not changed since the study.',
          (f.OATH | 0) === 1 ? '**The four of you — the Chair:** red, and tight. KNOT. It cannot be unbound; she holds the other end and does not know it.' : (f.OATH | 0) === 2 ? '**The four of you — the Chair:** red, with a slip in it that you tied yourself. EMBER. She cannot tell the difference. You can.' : '**The four of you — the Chair:** no thread. You did not swear. She did not look at you on the stair.',
          '**The soldiers, above — the capital:** gold, every one of them, and none of it theirs.',
          f.VANE_ACCEPT ? '**The four of you — the Envoy:** gold, thin, going up the stair into the dark. His word, accepted. It has not been paid for yet.' : '**The Envoy (somewhere above):** two threads, red and gold, pulling opposite ways. You have never seen a man wear both.',
          '**Wren:** *No thread found.* Not unbound. The knot itself.',
        ];
        P.sight.push({ t: 'list', items: threads });
        P.wren.push({ t: 'h', text: 'The 212 page' });
        P.wren.push({ t: 'p', text: 'Three Order\'s Laws in one year: a Founder faces the dial before them; every inscription sunwise; COLD is never written. And one Founders\' Law struck through in the same ink. You are standing on a stair that was warded by a Founder against exactly those three Laws, and every gate on it opens for the older reading.' });
        P.wren.push({ t: 'p', text: 'You have not said this aloud. You are going to need to.' });
      }

      /* ===== SPEAK (all roles) ===== */
      P.speak.push({ t: 'h', text: 'The Founders\' Count' });
      P.speak.push({ t: 'fine', text: 'A job, not a secret: forty-five seconds and one digit. Wait for the Hearth\'s START.' });
      P.speak.push(countTask(roleId));
      P.speak.push({ t: 'divider' });
      P.speak.push({ t: 'h', text: 'The stair' });
      P.speak.push({ t: 'fine', text: 'Only when the Hearth asks. *Say what you see. Never show your phone.*' });
      if (roleId === 'binder') P.speak.push({ t: 'reveal', label: 'If the table chooses to collapse the stair', blocks: [{ t: 'omen', text: 'Law 6 says never. The struck Law says four hands. You are about to write it with one.' }, { t: 'fine', text: 'Say it aloud before the Warden writes it. It will not stop anyone. It should be said.' }] });
      P.speak.push({ t: 'choice', id: 'hold', prompt: '**A held thread needs a living anchor.** Someone stays on the stair and holds it while the others go on; their Sight pays for it through the first two rounds of the bells. The first YES the Hearth receives, in seat order, is the one who stays. *Stay and hold?*', options: [{ id: 'YES', text: 'YES — I stay and hold the stair.' }, { id: 'NO', text: 'NO — I go on.' }],
        after: (opt) => opt === 'YES' ? 'Type it into the Hearth when it asks. If the Hearth names you, come back to this page: your thread is below.' : 'Type it into the Hearth when it asks. Nobody will know what it said.' });
      P.speak.push(threadBlock);
      return P;
    },
  });
})();

</script>
<script>/* js/content/companion/ch6.js */
/* Companion — Chapter VI, The Bells of Thornhallow (WELL · cast: VOLUNTEER, PRECRACKED) */
(function () {
  'use strict';
  const G = window.VigilGlyphs, L = window.VigilLore, CA = window.CompanionAudio, D = window.CompanionDraw, UI = window.VigilUI;
  const C = window.CompanionContent;
  const F = 'font-family="Cinzel,serif"';

  /* ---------- the stone ---------- */
  const STONE = [{ shape: 'Flame', inv: false }, { shape: 'Flame', inv: true }, { shape: 'Crown', inv: false }, { shape: 'Hook', inv: false }, { shape: 'Spike', inv: false }, { shape: 'Flame', inv: true }, { shape: 'Crown', inv: true }, { shape: 'Hook', inv: true }];
  const NAIVE = G.readNaive(STONE), TURNED = G.readTurned(STONE);
  const ORDER_GLOSS = ['fire', 'cold', 'one', 'of-four', 'goes-through', 'the Cold', 'closes', 'behind'];
  const FOUNDERS_GLOSS = ['four-as-one', 'as one', 'fire', 'go down', 'behind', 'kept', 'the fire', 'a hollow'];
  const HYMN = [4, -6, 4, 1, -2, -3, 'rest'];
  const gl = (n) => G.svg(n, { size: 28, color: '#f2d27a' });

  /* ---------- the Bells ---------- */
  const LANE = { B: 0, H: 1, O: 2, K: 3 };
  const SCRIPTS = {
    1: 'B H O K B O H K · O B K H K O B H · H K B O O H K B',
    2: 'B H (OK) B (KH) O (BH) K (OKB) H O (BK) H (OH) B (KHO) K O (BH) (BK) H (OB) K (ALL)',

  };
  const parse = (str) => str.trim().split(/\s+/).filter(t => t && t !== '·').map(tok => tok === '(ALL)' ? { all: true, lanes: [0, 1, 2, 3] } : tok[0] === '(' ? { lanes: tok.slice(1, -1).split('').map(c => LANE[c]).sort() } : { lanes: [LANE[tok]] });
  const CALL = ['READER', 'LISTENER', 'SEER', 'BINDER'];
  const call = (e) => e.all ? 'ALL' : e.lanes.map(l => CALL[l]).join(' + ');
  const round3Rows = () => parse(SCRIPTS[3]).map((e, i) => [String(i + 1), String(2 * i + 1), `<b>${call(e)}</b>`]);
  const wordsOf = (n) => parse(SCRIPTS[n]).map(call).join(' · ');
  const round3Block = () => ({ t: 'table', head: ['bell', 'on beat', 'call'], rows: round3Rows() });

  /* ---------- Seer under-layers ---------- */
  const underChamber = `<svg viewBox="0 0 360 250">
    <rect width="360" height="250" fill="#000"/>
    <g stroke="#fff" fill="none" stroke-width="1.2">
      <rect x="10" y="10" width="340" height="230"/>

      ${[[70, 'Halvard'], [143, 'Idony'], [217, 'Rook'], [290, 'Mere']].map(([x, n]) => `<path d="M${x - 14},112 L${x - 14},92 Q${x - 14},80 ${x},80 Q${x + 14},80 ${x + 14},92 L${x + 14},112 Z"/><line x1="${x}" y1="78" x2="${x}" y2="80"/><text x="${x}" y="126" text-anchor="middle" fill="#fff" font-size="8" ${F}>${n}</text>`).join('')}

  </svg>`;
  const stoneCarving = (mark) => G.inscription(STONE, { showMark: !!mark, mark: 'right', color: '#fff', markColor: '#a482e6' });
  const stoneInner = stoneCarving(true).replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '');
  const underStone = `<svg viewBox="0 0 360 230">
    <rect width="360" height="230" fill="#000"/>

    <g stroke="#fff" fill="none" stroke-width="1.5" transform="translate(180,190) scale(0.9)"><path d="M0,-16 C6,-8 10,-2 10,4 C10,11 5,15 0,15 C-5,15 -10,11 -10,4 C-10,-2 -6,-8 0,-16 Z" opacity=".8"/><path d="M-60,16 L60,16" opacity=".5"/></g>
    <text x="180" y="222" text-anchor="middle" fill="#fff" font-size="9" ${F} opacity=".7">the fire — lower than it has ever been; the foot is bare</text>
  </svg>`;

  /* ---------- The Thread (the Chapter V volunteer's spent Sight, rounds 1–2) ---------- */
  const threadBlock = (ctx) => ({ t: 'custom', render: (el, cx) => {
    const st = cx.state; st.thread = st.thread || { letGo: 0, held: 0 }; cx.save();
    el.appendChild(UI.el('div', { class: 'blk-svg underlayer', html: `<svg viewBox="0 0 360 80"><rect width="360" height="80" fill="#000"/><path id="ch6-thread" d="M10,40 C80,30 120,50 180,40 S280,30 350,40" fill="none" stroke="#fff" stroke-width="2"/><g id="ch6-fray" stroke="#fff" stroke-width="1" opacity=".5"><path d="M150,40 l-8,-10"/><path d="M200,42 l6,-9"/><path d="M260,36 l-5,-9"/></g><text x="180" y="70" text-anchor="middle" fill="#fff" font-size="10" font-family="Cinzel,serif" id="ch6-thread-txt">the thread — fraying</text></svg>` }));
    const thread = el.querySelector('#ch6-thread'), fray = el.querySelector('#ch6-fray'), txt = el.querySelector('#ch6-thread-txt');
    let holding = false, t0 = 0;

    const up = () => { if (!holding) return; holding = false; st.thread.held += Date.now() - t0; st.thread.letGo += 1; cx.save(); thread.setAttribute('stroke-width', '2'); fray.style.opacity = '.5'; txt.textContent = 'the thread — fraying'; btn.textContent = 'HOLD — keep a finger on it'; };

  C.chapters.push({
    id: 'ch6',
    pages: (roleId, ctx) => {
      const P = { sight: [], wren: [], speak: [] };
      const vol = ctx.flags.VOLUNTEER | 0; const volRole = vol >= 1 && vol <= 4 ? L.roles[vol - 1] : null; const isVol = !!(volRole && volRole.id === roleId);
      const precracked = !!ctx.flags.PRECRACKED;

        ] });

        else P.wren.push({ t: 'p', text: 'Wren asked you in the laundry what the name meant, and you never sealed an answer. Wren will ask again, out loud, and this time you know: *the hollow of a bell; the space that rings*.' });

      /* ================= LISTENER ================= */

        ] });
        if (volRole) S.push({ t: 'fine', text: `${volRole.nick}'s bell is silent in rounds one and two (the thread on the Stair). ${laneOwner(neighbour(vol - 1))} takes both keys; ${volRole.nick}'s bells fall into ${laneOwner(neighbour(vol - 1))}'s lane. The thread is tied off before round three.` });
        if (precracked) S.push({ t: 'fine', text: 'One bell is already cracked from the fall of the stair. You can hear it: Halvard\'s bell hums a quarter-tone flat. It still counts as rung when it is rung.' });
        S.push({ t: 'audio', label: 'Feel the tempo — 70, then 76, then 60', strip: '<div class="arrow-strip"><span class="step"><b>♥</b>70</span><span class="step"><b>♥</b>76</span><span class="step"><b>♥</b>60</span></div>', play: (A) => { CA.announce(0); CA.heartbeat(A, 70, 6); CA.later(() => { CA.announce(1); CA.heartbeat(A, 76, 6); }, 5600); CA.later(() => { CA.announce(2); CA.heartbeat(A, 60, 6); }, 10600); return 10600 + 6 * 1000 + 300; }, text: 'Six beats at each. Every second beat is a bell.' });
        S.push({ t: 'h', text: 'Round three — the script. You call it.' });
        S.push({ t: 'p', text: 'Bell *n* falls on beat *2n − 1*. Call each bell **two bells ahead** — four beats, four seconds — in one word: **READER**, **SEER**, **BINDER**, or **ALL** (Reader, Seer and Binder together). Before the count reaches 1, call the first two. Then, when the count says 1, call bell 3; when it says 3, call bell 4; and so on. Keep your voice on the beat and your eyes on this list.' });
        S.push(round3Block());

        S.push({ t: 'reveal', label: 'Rounds one and two, written out', blocks: [
          { t: 'p', text: '**Round one (70):** ' + wordsOf(1) },

        ] });
        S.push({ t: 'h', text: 'The stone\'s hymn' });
        S.push({ t: 'p', text: 'When the fire drops and the stone is read, the shaft rings with it. Eight glyphs, seven steps — and **one rest, at the very end**.' });
        S.push({ t: 'audio', label: 'The stone\'s hymn', strip: CA.strip(HYMN), play: (A) => CA.playSteps(A, HYMN), text: '**Up four, down six, up four, up one, down two, down three — then the rest.** COLD is the rest, and it comes last.' });
        S.push({ t: 'p', text: 'The Order\'s reading — ASH, COLD, CROWN, KNOT, THORN, COLD, EMBER, VEIL — has COLD **twice**, second and sixth: two rests *in the middle* of the tune, and none at the end. It cannot be this hymn. Only one ordering of the eight glyphs steps like this; test it on the row-player in your Book.' });
        S.push({ t: 'h', text: 'Heartbeats in the bell-chamber' });
        S.push({ t: 'html', html: `<div class="heartbeats"><div class="hb"><span>Provost Marrow</span>${D.trace('fast')}</div>${['Reader', 'Listener', 'Seer', 'Binder'].map(n => `<div class="hb"><span>${n}</span>${D.trace('normal')}</div>`).join('')}<div class="hb"><span>Wren</span>${D.trace('flat')}</div></div>` });
        S.push({ t: 'fine', text: 'The Provost\'s, fast as a bird\'s. Wren\'s: too quiet to catch. Six chapters. It has never once been anything else.' });
        P.wren.push({ t: 'h', text: 'Can you hear my heart?' });
        if (laundry === 'LOUD') P.wren.push({ t: 'p', text: 'In the laundry you said *yes, loud*. You have listened for it every room since, the way you would worry a sore tooth. There is nothing there. Wren is going to ask you again, out loud, in front of the others, and you will have to decide whether the kind answer is still the kind answer.' });
        else if (laundry === 'NO') P.wren.push({ t: 'p', text: 'In the laundry you said *no*. It was the only true thing anyone in that room said to Wren that night, and you have wondered ever since whether it was cruel. Wren is going to ask you again, out loud.' });
        else P.wren.push({ t: 'p', text: 'Wren asked you in the laundry and you never sealed an answer. Wren is going to ask you again, out loud, and the flat line on your page will still be flat.' });
        P.wren.push({ t: 'whisper', text: 'In the third round your bell is the voice. Wren will be standing beside you, close enough to hear — the one heart you cannot.' });
        P.speak.push({ t: 'h', text: 'Your voice — round three' });
        P.speak.push({ t: 'p', text: 'Two bells ahead. One word. **READER · SEER · BINDER · ALL.**' });
        P.speak.push(round3Block());
      }

      /* ================= SEER ================= */
      if (roleId === 'seer') {
        S.push({ t: 'h', text: 'The Bells' });
        S.push({ t: 'p', text: 'Your lane is the third. In the third round the lights go out; the Listener calls **SEER** for you. Press on the beat, not on the word.' });
        S.push({ t: 'h', text: 'Under the bell-chamber' });
        S.push({ t: 'p', text: 'The fire is straight up the shaft, far above. Every shadow in the room falls *down and away* from it — the Provost\'s, all four of yours. One falls up, toward the shaft. You have drawn this five times tonight. It is not the lamp. It was never the lamp.' });
        S.push({ t: 'svg', cls: 'underlayer', svg: underChamber });
        S.push({ t: 'h', text: 'The foot of the stone' });
        S.push({ t: 'p', text: 'When the fire drops, the Hearth will say: *the Seer — the foot of the stone.* This is what is there. The **mark is on the RIGHT**: the prophecy was carved **turned**, and the Order has read it upright for four hundred years because the flame covered its foot from the night it was lit.' });
        S.push({ t: 'svg', cls: 'underlayer', svg: underStone });
        S.push({ t: 'p', text: 'Say it plainly: *read right to left, every glyph inverted.* the Reader has both readings ready. On the strip, slot 1 is the first glyph read — the shape at the **right-hand** end, inverted — and the eighth is the shape at the left-hand end, inverted.' });
        S.push({ t: 'fine', text: 'No mark on any ring this chapter. The strip is a line; it runs 1 to 8 left to right.' });
        P.wren.push({ t: 'h', text: 'What do you see when you look at me?' });
        if (laundry === 'TELL') P.wren.push({ t: 'p', text: 'In the laundry you told Wren about the shadow. Wren laughed and said you were being poetic. You were not being poetic. Wren is going to ask you again, out loud, and this time there is a fire straight overhead and everyone can look down.' });
        else if (laundry === 'NOTHING') P.wren.push({ t: 'p', text: 'In the laundry you said nothing, and looked at the wall. You have been looking at walls for fourteen years. Wren is going to ask you again, out loud, with a fire straight overhead.' });
        else P.wren.push({ t: 'p', text: 'Wren asked you in the laundry and you never sealed an answer. Wren is going to ask again, out loud, with a fire straight overhead and everyone able to look down.' });
        P.wren.push({ t: 'whisper', text: 'You have wanted to see the foot of that stone since you were eleven. Tonight the fire is low enough. Be careful what you wish for; then wish for it anyway.' });
      }

      /* ================= BINDER ================= */
      if (roleId === 'binder') {
        S.push({ t: 'h', text: 'The Bells' });
        S.push({ t: 'p', text: 'Your lane is the fourth, on the right. In the third round the lights go out; the Listener calls **BINDER** for you. Press on the beat, not on the word.' });
        S.push({ t: 'h', text: 'The 212 page' });
        S.push({ t: 'p', text: 'One page of the Book, one year, one hand. Read it as a page, not as four Laws.' });
        S.push({ t: 'html', html: `<div class="laws">
          <div class="law founders${law0 ? '' : ' struck'}"><div class="era">Law 0 · Founders' · Year 0 · ${law0 ? 'RESTORED' : 'STRUCK, 212'}</div><div class="txt">COLD is written by four hands.</div><div class="fine">${law0 ? 'Older than Law 6. The older binds.' : 'struck by the Convocation, 212. See Law 6.'}</div></div>
          <div class="law order"><div class="era">Law 6 · Order's · Year 212</div><div class="txt">COLD is never written; where an inscription shows it, leave the slot empty.</div></div>
          <div class="law order"><div class="era">Law 9 · Order's · Year 212</div><div class="txt">A Founder faces the dial before them.</div></div>
          <div class="law order"><div class="era">Law 11 · Order's · Year 212</div><div class="txt">Every inscription is placed sunwise from the mark.</div></div>
        </div>` });
        S.push({ t: 'p', text: 'The same year the Vault was rebuilt and the statues re-set. The same year a Founders\' Law was **struck** and an Order\'s Law **written** to say the opposite — in the same ink, the same hand. A Law that is merely wrong is forgotten. A Law that is *inconvenient* is struck.' });
        S.push({ t: 'h', text: 'The Laws that read a stone' });
        S.push({ t: 'html', html: `<div class="laws"><div class="law founders"><div class="era">Law 10 · Founders' · Year 0</div><div class="txt">A turned line reverses and inverts; a lone turned glyph only inverts; every glyph keeps its place on the stone.</div></div><div class="law founders"><div class="era">Law 3 · Founders' · Year 0</div><div class="txt">Where two Laws disagree, the older binds.</div></div></div>` });
        S.push({ t: 'p', text: 'So: if the Seer calls the stone **turned**, the whole line reverses and every glyph inverts — and where the line shows COLD, Law 6 says leave the slot empty, but Law 0 is older than Law 6. The stone shows the shape. Place it.' });
        S.push({ t: 'h', text: 'Threads in the bell-chamber' });
        S.push({ t: 'list', items: [
          '**Marrow — Wren:** grey. The colour of someone who has already said goodbye. It has been grey since the study; tonight it is the only thread she has left.',
          '**Marrow — the lid:** red. An oath, older than any of you. She swore it to the fire, kneeling, fourteen years ago.',
          '**The four of you:** red, each to each, tied tonight and holding. Whatever the Stair cost, it did not cost this.',
          '**Wren:** *No thread found.* Not unbound. The knot itself.',
        ] });
        S.push({ t: 'h', text: 'The thread on the Stair' });
        if (volRole) S.push({ t: 'p', text: `**${volRole.nick}**'s thread runs up the Stair from the iron ring, taut, anchored in ${volRole.nick}'s own Sight. A held thread needs a living anchor; a **tied-off** thread needs none. The Provost will tie it off to the ring before the third round — one turn of the wrist — and ${volRole.nick}'s Sight comes home. Until then ${volRole.nick}'s bell is silent and ${laneOwner(neighbour(vol - 1))} rings both.` });
        else S.push({ t: 'p', text: 'No thread was left on the Stair. Nothing to tie off; nobody\'s bell is silent tonight but the one the Founders silenced themselves, in the third round.' });
        S.push({ t: 'reveal', label: 'After the stone is read — when the Hearth says your Book has turned a page', blocks: [
          { t: 'omen', text: 'Four Masters, four Sightings. The Convocation would not pay it. They struck the Law and called it grammar.' },
          { t: 'fine', text: 'Law 0 is restored in your Book. It is older than Law 6. The older binds — and the Fourfold Walk is open.' },
        ] });
        P.wren.push({ t: 'h', text: 'Do you think I\'m really the one?' });
        if (laundry === 'YES') P.wren.push({ t: 'p', text: 'In the laundry you said *yes*. You see every thread in the school and you said yes to the one person who has none. Wren is going to ask you again, out loud — not whether Wren is the one. Whether Wren has a thread. Show it, if you can.' });
        else if (laundry === 'DONTKNOW') P.wren.push({ t: 'p', text: 'In the laundry you said *I don\'t know*. It was true, and Wren went quiet, and you have not forgiven yourself for the quiet. Wren is going to ask you again, out loud — a different question, with the same answer.' });
        else P.wren.push({ t: 'p', text: 'Wren asked you in the laundry and you never sealed an answer. Wren is going to ask again, out loud — not whether Wren is the one. Whether Wren has a thread.' });
        P.wren.push({ t: 'whisper', text: 'Struck, 212. Written, 212. You saw it on the Stair before anyone said it. Tonight someone will say it.' });
      }

      if (isVol) { P.sight.push({ t: 'reveal', label: 'The thread is tied off — open your Sight', blocks: rest }); }
      return P;
    },
  });

  /* The Binder's Book gains the chamber's line once Chapter VI is open (behind a reveal, so it is read when the Hearth says so). */
  C.bookExtras.push((roleId, ctx) => {
    if (roleId !== 'binder' || !ctx.unlocked('ch6')) return [];

  });
})();

<script>/* js/content/companion/ch7.js */
/* Companion — Finale (CROWN) */
(function () {
  'use strict';
  const G = window.VigilGlyphs, L = window.VigilLore, CA = window.CompanionAudio, D = window.CompanionDraw, UI = window.VigilUI, Shared = window.VigilShared;
  const C = window.CompanionContent;
  const V = '#a482e6';

  const WEST = [{ shape: 'Spike', inv: false }, { shape: 'Hook', inv: false }, { shape: 'Hook', inv: true }, { shape: 'Crown', inv: true }];
  const EAST = [{ shape: 'Flame', inv: false }, { shape: 'Crown', inv: true }, { shape: 'Spike', inv: false }, { shape: 'Flame', inv: true }];
  const wall = (items, mark, showMark, hiddenIdx) => G.inscription(items.map((it, i) => i === hiddenIdx ? Object.assign({ hidden: true }, it) : it), { showMark, mark, color: '#fff', markColor: V });
  /* Which walls carry a soldier's shield. The Hearth decides from SOLDIERS / Sorrel refused / Oriel honoured / VANE_ALLY; the phone
     derives the same from the casts it has turned (WELL: VOLUNTEER, PRECRACKED; EMBER: SORREL, ORIEL; KNOT/VEIL: VOTE_LOST). Unknown casts: no shields drawn. */
  const shields = (ctx) => {
    const f = ctx.flags || {}; if (f.VANE_ALLY) return { west: -1, east: -1 };
