  };
  const OLD_ALPHA = 'ABCDEFGHIJKLMNOPRSTUVWYZ';
  /* Render a line of text in the older alphabet. Letters not in the alphabet (Q, X) are drawn as a blank. */
  function runeLine(text, opts) {
    opts = opts || {};
    const cell = 24, h = 34, gap = 12; let x = 8; let s = '';
    for (const ch of String(text).toUpperCase()) {
      if (ch === ' ') { x += gap; continue; }
      if (ch === '.') { s += `<circle cx="${x + 5}" cy="26" r="2" fill="currentColor"/>`; x += 12; continue; }
      const d = OLD_RUNES[ch];
      if (d) s += `<path d="${d}" transform="translate(${x},3)" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
      x += cell;
    }
    const w = x + 8;
    return `<svg viewBox="0 0 ${w} ${h + 6}" class="rune-line" style="height:${opts.height || 44}px;width:auto;max-width:100%;color:${opts.color || 'currentColor'}">${s}</svg>`;
  }
  const runeBlock = (lines, opts) => `<div class="ch4-runes">${lines.map(l => `<div style="text-align:center;margin:4px 0">${runeLine(l, opts)}</div>`).join('')}</div>`;

  /* ---------- helpers ---------- */
  const wren = (normal, scared) => (F().WREN_SCARED ? scared : normal);
  const secretsFound = (f) => ['JOURNAL', 'MEMORY', 'TAPESTRY', 'GREY'].filter(k => f[k]).length;
  const hasMarrowLetter = (f) => !f.ORIEL && !f.SORREL && !f.VANE_ACCEPT;
  const computeLaw0 = () => { const f = F(); Store.set('LAW0', !!(f.LETTER_READ || f.TAPESTRY || f.ORIEL)); };

  /* The study, as a clickable room (four corners, four Sightings). */
  function roomSvg(f) {
    const hot = (id, x, y, w, h, label, who, color, found) => `<g class="ch4-hot${found ? ' found' : ''}" data-id="${id}"><rect class="hs" x="${x}" y="${y}" width="${w}" height="${h}" rx="8"/><text x="${x + 10}" y="${y + h - 22}" fill="${found ? '#8fbf8f' : '#e9e2d2'}">${label}${found ? ' ✓' : ''}</text><text class="who" x="${x + 10}" y="${y + h - 8}" fill="${color}">${who}</text></g>`;
    let s = `<svg viewBox="0 0 900 400">`;

    // wall line and floor
    s += `<path d="M0,300 L900,300" stroke="rgba(255,255,255,0.08)"/>`;
    // desk (left)
    s += `<rect x="60" y="240" width="220" height="14" rx="3" fill="#3a2a1c"/><rect x="72" y="254" width="14" height="60" fill="#2a1e14"/><rect x="254" y="254" width="14" height="60" fill="#2a1e14"/>`;
    s += `<path d="M120,238 L168,232 L172,238 L176,232 L224,238 Z" fill="#d9cba8"/><rect x="200" y="226" width="60" height="10" rx="2" fill="#3a2a30"/>`;
    s += `<circle cx="172" cy="236" r="60" fill="#ffd27a" opacity=".08"/>`;
    // tapestry (centre)

    s += `<rect x="340" y="40" width="260" height="180" fill="none" stroke="#5a4020" stroke-width="4"/>`;
    // mantel and the bell (right, top)

    s += `<g transform="translate(820,148)"><path d="M-12,0 L-12,-8 Q-12,-26 0,-28 Q12,-26 12,-8 L12,0 Z" fill="#8a7040"/><circle cx="0" cy="3" r="3" fill="#c9a85a"/></g>`;
    // chair (right, bottom)
    s += `<g transform="translate(790,330)"><rect x="-44" y="-96" width="88" height="96" rx="12" fill="#1c1418"/><rect x="-54" y="-60" width="16" height="60" rx="6" fill="#241a1e"/><rect x="38" y="-60" width="16" height="60" rx="6" fill="#241a1e"/><rect x="-36" y="-34" width="72" height="34" rx="6" fill="#2a1e24"/></g>`;
    // hotspots
    s += hot('desk', 40, 190, 260, 150, 'the desk', 'Bookmoth', '#e0b04a', f.JOURNAL);

    s += hot('bell', 650, 90, 230, 80, 'the bell on the mantel', 'Hush', '#4fb3bf', f.MEMORY);
    s += hot('chair', 680, 220, 200, 130, 'the Provost\'s chair', 'Knot', '#d96b4a', f.GREY);
    return s + `</svg>`;
  }

  /* A three-way question inside a discovery panel. Resolves when the right option is picked; wrong picks only say so. */
  function ask(into, prompt, options, correctId, wrongText) {
    return new Promise((resolve) => {

        if (o.id === correctId) { Audio.sfx('success'); Array.from(opts.children).forEach(b => b.disabled = true); st.className = 'pz-status good'; st.textContent = 'Found.'; setTimeout(resolve, 500); return; }
        tries++; Audio.sfx('wrong'); st.className = 'pz-status bad'; st.textContent = wrongText; if (tries >= 2) document.getElementById('hint').classList.add('attention');
      } })));
      wrap.appendChild(opts); wrap.appendChild(st); into.appendChild(wrap);
      try { wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) { /* headless */ }
    });
  }
  const para = (into, paragraphs) => paragraphs.forEach(p => { const isObj = typeof p === 'object'; const el = UI.el('p', { class: 'para' + (isObj && p.cls ? ' ' + p.cls : '') + (isObj && p.speaker ? ' speech' : '') }); if (isObj && p.speaker) el.appendChild(UI.el('span', { class: 'speaker', text: p.speaker })); el.appendChild(UI.el('span', { html: UI.rich(isObj ? p.text : p) })); into.appendChild(el); });

  /* The tapestry scrape: an overpaint layer masked away by dragging (or by the Scrape button). Resolves when the paint has given. */
  function scrape(into) {
    return new Promise((resolve) => {
      const Art = window.VigilArt.ch4;
      const box = UI.el('div', { class: 'ch4-scrape' });
      const id = 'ch4m' + Date.now();
      box.innerHTML = `<svg viewBox="0 0 600 300"><defs><mask id="${id}"><rect width="600" height="300" fill="#fff"/><g class="holes"></g></mask></defs>${Art.foundersWalking(0, 0, 600, 300, { caption: false })}<g class="over" mask="url(#${id})">${Art.orderPaint(0, 0, 600, 300)}</g></svg>`;
      into.appendChild(box);
      const row = UI.el('div', { class: 'pz-row' });
      const st = UI.el('div', { class: 'pz-status', text: 'Drag across the cloth to scrape, or press Scrape.' });
      const btn = UI.el('button', { class: 'btn', text: 'Scrape' });
      row.appendChild(btn); into.appendChild(row); into.appendChild(st);
      const svg = box.querySelector('svg'), holes = box.querySelector('.holes'), over = box.querySelector('.over');
      let n = 0, done = false, presses = 0, drawing = false;
      const hole = (x, y, r) => { holes.insertAdjacentHTML('beforeend', `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${r || 26}" fill="#000"/>`); n++; check(); };
      const finish = () => { if (done) return; done = true; over.style.opacity = '0'; Audio.sfx('reveal'); st.className = 'pz-status good'; st.textContent = 'The paint gives.'; btn.disabled = true; setTimeout(resolve, 1500); };
      const check = () => { if (n >= 60) finish(); else if (n > 0) st.textContent = n < 25 ? 'Something under it. Keep scraping.' : 'Figures. More than one. Keep going.'; };
      const pt = (e) => { const r = svg.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 600, (e.clientY - r.top) / r.height * 300]; };
      svg.addEventListener('pointerdown', (e) => { drawing = true; const [x, y] = pt(e); hole(x, y); Audio.sfx('tick'); });
      svg.addEventListener('pointermove', (e) => { if (!drawing || done) return; const [x, y] = pt(e); hole(x, y); });
      const stop = () => { drawing = false; };
      svg.addEventListener('pointerup', stop); svg.addEventListener('pointerleave', stop); svg.addEventListener('pointercancel', stop);
      btn.addEventListener('click', () => { if (done) return; presses++; Audio.sfx('tick'); const y = 40 + ((presses - 1) % 4) * 70; for (let x = 20; x < 600; x += 40) hole(x + (presses % 2) * 20, y + Math.sin(x / 50) * 12, 34); if (presses >= 4) finish(); });
    });
  }

    },
    scenes: {
      /* ---------- the study ---------- */
      ch4_start: {
        art: 'ch4_study', mood: 'court', fx: 'dust', sfx: 'open',
        title: 'The Provost\'s study',
        text: (s) => {
          const f = s.flags, out = [];
          if (f.SURRENDERED) {
            out.push('The Provost\'s study, at the top of the Bell Tower\'s third turning. Marrow is already there. So is Wren — got back from the Envoy\'s captain by means nobody asks about — and the Provost\'s knuckles are white on the edge of the desk.');
            out.push({ speaker: 'Marrow', text: 'You gave the child to a man with a writ. I have spent fourteen years — no. Not now. Sit down.' });
            out.push('Nobody sits.');
          } else {
            out.push('The Provost\'s study, at the top of the Bell Tower\'s third turning: four walls of books, a fire, a tapestry the width of the wall, and a desk with a primer lying open on it, as if someone had been interrupted.');
            if (f.DOOR === 'FIGHT') out.push('Behind you the ward on the Tower door is still smoking. Marrow looks at it, and at the four of you, and does not ask.');
            else if (f.DOOR === 'BLUFF') out.push({ speaker: 'Marrow', text: 'The Envoy\'s captain will not be fooled twice. Good, then, that you only needed once.' });
            else if (f.DOOR === 'WORD') out.push({ speaker: 'Marrow', text: 'On Vane\'s word.' }, 'She lets the sentence sit in the room a while.', { speaker: 'Marrow', text: 'We will speak of that.' });

          if (yes.length) { Store.set('VOLUNTEER', yes[0] + 1); Store.set('STAIR', 'HOLD'); Store.set('SOLDIERS', false); Store.set('HOLD_NOBODY', false); Store.note(nick(yes[0]) + ' held the stair.' + (yes.length > 1 ? ' (' + yes.length + ' said yes.)' : '')); }
          else { Store.set('VOLUNTEER', 0); Store.set('STAIR', 'RUN'); Store.set('SOLDIERS', true); Store.set('HOLD_NOBODY', true); Store.note('Nobody would hold the stair. You ran.'); }
        },
        next: (s) => F(s).VOLUNTEER > 0 ? 'ch5_hold_named' : 'ch5_hold_none',
      },
      ch5_hold_named: {
        art: 'ch5_stair', mood: 'sorrow', fx: 'motes', sfx: 'seal',
        text: (s) => {
          const v = nick((F(s).VOLUNTEER || 1) - 1); const n = F(s).HOLD_YES || 1;
          const t = ['Received. Received. Received. Received.', 'The Hearth reads four words and says one name.', { text: `${v.toUpperCase()} WAS FASTER.`, cls: 'big' }];
          if (n > 1) t.push(`${n === 4 ? 'All four' : n === 3 ? 'Three' : 'Two'} of you said yes. ${v} said it first. Nobody will ever know who the others were, unless they say.`);
          else t.push(`One yes. It is not the kind of thing anyone has to say twice.`);
          t.push(`${v} sits down on the stair, back to the wall, and takes hold of something nobody else can see. ${v}'s page goes dark. What is on it now is a thread, and a job.`);
          t.push({ speaker: 'Marrow', text: 'I will tie it off before the third round of the bells. You have my word; it is worth what it is worth. Do not let go before that.' });
          t.push({ speaker: 'Wren', text: `${v}. Don't let go. I'll be — I'll be really annoyed.` });
          t.push(`Wren says it lightly. Wren stays a moment longer at ${v}'s side than the boots above allow, and then comes.`);
          return t;
        },
        next: 'ch5_endcard', button: 'The Founders\' road',
      },
      ch5_hold_none: {
        art: 'ch5_soldiers', mood: 'tense', fx: 'ash',
        text: [
          'Received. Received. Received. Received.',
          'The Hearth reads four words and says no name.',
          'Nobody stays. It is not cowardice; it is four people who each thought someone else would. Marrow does not say anything, which is worse.',
          'Then it is the third thing.',
        ],
        next: 'ch5_run', button: 'Run',
      },
      /* ---------- RUN ---------- */
      ch5_run: {
        art: 'ch5_marches', mood: 'tense', fx: 'ash', sfx: 'whoosh',
        enter: (s) => { if (F(s).STAIR !== 'RUN') { Store.set('STAIR', 'RUN'); Store.set('VOLUNTEER', 0); Store.note('You ran. The soldiers followed.'); } Store.set('SOLDIERS', true); },
        text: [
          'You run. The Founders\' road is wider than the stair and older, and it does not care who uses it.',
          'Behind you: boots, torches, a captain\'s voice. They follow. They will be in the bell-chamber when you are, or a little after, with shields.',
          { speaker: 'Wren', text: 'For the record, I said we should collapse it.' },
          'Nobody remembers Wren saying that.',
        ],
        next: 'ch5_endcard', button: 'The bell-chamber',
      },
      /* ---------- end card ---------- */
      ch5_endcard: {
        art: 'ch5_marches', mood: 'dread', fx: 'motes', flame: 0.25, sfx: 'chime',
        text: [
          { text: 'NEXT: THE BELLS.', cls: 'big' },
          { text: 'Hands on your keys.', cls: 'big' },
          { text: 'Nothing else tonight is faster than this.', cls: 'center' },
          { text: 'Four lanes, four keys, a strike line. The Hearth will show the shape of it and run one practice round before anything counts. If your hands are slow, say so: there is a slow-bells choice on the ready screen.', cls: 'small' },
        ],
        next: 'ch5_flow', button: 'The paths you walked',
      },
      ch5_flow: {
        type: 'flow', art: 'ch5_marches', mood: 'dread', fx: 'motes',
        text: ['The Founders\' road goes down. The bell-chamber is at the end of it, and the Hearth is a spark far above.'],
        flowTitle: 'Chapter V — the paths you walked',
        stats: (s) => {
          const st = F(s).STAIR; const v = F(s).VOLUNTEER;
          const stair = st === 'COLLAPSE' ? 'You collapsed the stair; **one bell cracked** before the Bells begin.' : st === 'HOLD' ? `**${nick(v - 1)}** holds the stair with a thread.` : 'You ran; **the soldiers follow**.';
          return stair + (F(s).GATE2_COLD ? ' You wrote COLD with four hands at the Silent Gate.' : '') + ` Hints so far: ${F(s).hintsTotal || 0}.`;
        },
        next: 'ch6_start', button: 'The Bells',
      },
    },
  });
})();

<script>/* js/content/ch6.js */
/* Chapter VI — The Bells of Thornhallow */
(function () {
  'use strict';
  const G = window.VigilGlyphs, L = window.VigilLore, UI = window.VigilUI, Store = window.VigilStore, Audio = window.VigilAudio;
  const nick = L.nick;
  const glyphPalette = () => G.names.map(n => ({ id: n, svg: G.inner(n), label: n }));

  /* ---------- chapter-local CSS ---------- */
  try { (document.head || document.body).appendChild(Object.assign(document.createElement('style'), { textContent: `
    #widget.ch6-bells .react-score { visibility: hidden; }
    #widget.ch6-bells .beat-counter { display: none; }
    #widget.ch6-dark .orb-chain { display: none; }
    #widget.ch6-dark .lanes { margin-top: 72px; }
    #widget.ch6-dark .ch6-beat { top: -2px; font-size: 64px; }
    .ch6-beat { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); font-family: var(--display); font-size: 54px; color: var(--gold-2); text-shadow: 0 0 24px rgba(0,0,0,.9); z-index: 4; pointer-events: none; transition: transform .1s; line-height: 1; }
    .ch6-beat.small { font-size: 30px; top: 12px; color: rgba(242,210,122,0.75); }
    .ch6-beat.tick { transform: translateX(-50%) scale(1.15); }
    .ch6-ready { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; }
    .ch6-ready .ch6-rounds { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .ch6-ready .ch6-round { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: rgba(0,0,0,0.25); }
    .ch6-ready .ch6-round b { display: block; font-family: var(--display); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
    .ch6-ready .ch6-round span { font-size: 15px; color: var(--ink-dim); }
    .ch6-ready .ch6-lanes { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .ch6-ready .ch6-lane { text-align: center; border-radius: 8px; padding: 8px 4px; border: 2px solid rgba(255,255,255,0.12); font-family: var(--display); font-size: 13px; letter-spacing: .08em; }
    .ch6-ready .ch6-lane.silent { opacity: .45; border-style: dashed; }
    .ch6-ready .ch6-lane .k { display: block; font-size: 26px; font-weight: 700; margin-top: 2px; }
    .ch6-ready .ch6-lane.p0 { border-color: var(--p1); } .ch6-ready .ch6-lane.p1 { border-color: var(--p2); } .ch6-ready .ch6-lane.p2 { border-color: var(--p3); } .ch6-ready .ch6-lane.p3 { border-color: var(--p4); }
    .ch6-ready .ch6-slow { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: rgba(79,179,191,0.05); }
    .ch6-ready .ch6-slow.on { border-color: var(--sea); background: rgba(79,179,191,0.14); }
    .ch6-ready .ch6-slow .btn { border-color: rgba(79,179,191,0.5); }
    .ch6-reading { border-left: 3px solid var(--gold); padding: 10px 16px; margin: 6px 0 10px; background: rgba(212,169,78,0.06); border-radius: 4px; }
    .ch6-reading .g { display: inline-flex; flex-direction: column; align-items: center; margin: 0 6px 6px 0; font-family: var(--display); font-size: 12px; letter-spacing: .08em; color: var(--gold-2); }
    .ch6-reading .g svg { width: 38px; height: 38px; }
    .ch6-reading .g i { font-style: normal; color: var(--ink-dim); font-family: var(--serif); font-size: 13px; letter-spacing: 0; }
  ` })); } catch (e) {}

  /* ---------- the Bells: scripts (design §6) ---------- */
  const LEAD = 2500;                                   // ms before beat 1
  const LANE = { B: 0, H: 1, O: 2, K: 3 };
  const ROUNDS = {
    1: { bpm: 70, title: 'ROUND ONE — SINGLES', script: 'B H O K B O H K · O B K H K O B H · H K B O O H K B' },
    2: { bpm: 76, title: 'ROUND TWO — CHORDS', script: 'B H (OK) B (KH) O (BH) K (OKB) H O (BK) H (OH) B (KHO) K O (BH) (BK) H (OB) K (ALL)' },
    3: { bpm: 60, title: 'ROUND THREE — THE DARK ROUND', script: 'O K B O (ALL) B K O (OK) B K (ALL) O B K (BK) O B (ALL) K O (OB) K (ALL)' },
  };
  const PRACTICE = { bpm: 70, script: 'B H O K (BH) (OK) (ALL) (ALL)' };
  function parseScript(str) {
    return str.trim().split(/\s+/).filter(t => t && t !== '·').map(tok => {
      if (tok === '(ALL)') return { lanes: [0, 1, 2, 3], kind: 'all' };
      if (tok[0] === '(') { const ls = tok.slice(1, -1).split('').map(c => LANE[c]).sort(); return { lanes: ls, kind: ls.length === 4 ? 'all' : 'brace' }; }
      return { lanes: [LANE[tok]], kind: 'single' };
    });
  }
  /* event n (1-based) falls on beat 2n-1: t = LEAD + beatMs*(2n-1) */
  function roundEvents(script, bpm) { const beatMs = 60000 / bpm; return parseScript(script).map((e, i) => Object.assign({ t: Math.round(LEAD + beatMs * (2 * i + 1)) }, e)); }
  const callWord = (e) => e.kind === 'all' ? 'ALL' : e.lanes.map(l => ['BOOK', 'HUSH', 'OWL', 'KNOT'][l]).join('+');
  const scriptWords = (script) => parseScript(script).map(callWord).join(' · ');

  const volunteerLane = (s) => { const v = s.flags.VOLUNTEER | 0; return v >= 1 && v <= 4 ? v - 1 : null; };
  const neighbourOf = (l, dead) => [l - 1, l + 1, l - 2, l + 2].filter(x => x >= 0 && x < 4 && !dead.includes(x))[0];
  const tempo = (s, bpm) => bpm * (s.flags.SLOW_BELLS ? 0.8 : 1);
  const win = (s, ms) => Math.round(ms * (s.flags.SLOW_BELLS ? 1.5 : 1));
  const crackedNow = (s) => Math.max(s.flags.BELLS_CRACKED | 0, s.flags.PRECRACKED ? 1 : 0);

  /* Our own beat overlay, anchored to the widget's GO (so a lead-in works and the count reads 1..48 on the beat). */
  function beatOverlay(opts) {
    setTimeout(() => {
      const react = document.querySelector('#widget .react'); if (!react) return;
      const big = react.querySelector('.react-big'); if (!big) return; const wrap = big.parentNode;
      const el = UI.el('div', { class: 'ch6-beat' + (opts.numbers ? '' : ' small'), text: '·' }); wrap.appendChild(el);
      let t0 = null, last = 0;
      const obs = new MutationObserver(() => { if (t0 == null && /GO|PRACTICE/.test(big.textContent)) { t0 = performance.now(); tick(); } });
      obs.observe(big, { childList: true, characterData: true, subtree: true });
      function tick() {
        if (!document.body.contains(el)) { obs.disconnect(); return; }
        requestAnimationFrame(tick);
        const now = performance.now() - t0; const b = Math.floor((now - opts.lead) / opts.beatMs);
        if (b < 1) { el.textContent = '·'; return; }
        if (b > opts.total) { el.textContent = ''; return; }
        if (b !== last) { last = b; el.textContent = opts.numbers ? String(b) : (b % 2 ? '●' : '○'); el.classList.add('tick'); setTimeout(() => el.classList.remove('tick'), 120); Audio.sfx(b % 2 ? 'tick' : 'step'); }
      }
    }, 60);
  }
  const widgetClass = (cls, on) => { const w = document.getElementById('widget'); if (w) w.classList.toggle(cls, !!on); };

  function bellCfg(s, n) {
    const R = ROUNDS[n]; const bpm = tempo(s, R.bpm); const beatMs = 60000 / bpm;
    const dead = n === 3 ? [1] : (volunteerLane(s) != null ? [volunteerLane(s)] : []);
    beatOverlay({ lead: LEAD, beatMs, total: 48, numbers: n === 3 });
    return {
      title: R.title + (s.flags.SLOW_BELLS ? ' · SLOW' : ''), laneNames: L.nicks.map((k, i) => n === 3 && i === 1 ? 'Voice' : k),
      events: roundEvents(R.script, bpm), fallMs: 1800, windowMs: win(s, 350), braceWindowMs: win(s, 300),
      target: 0.7, noFail: true, damage: 0.03, deadLanes: dead, dark: n === 3, bpm: n === 3 ? bpm : undefined, pulse: false,
    };
  }
  function roundSolve(n) {
    return (s, r) => {
      Store.set('BELLS_R' + n + '_HITS', r.hits); Store.set('BELLS_R' + n + '_TOTAL', r.total); Store.set('BELLS_R' + n + '_PASS', !!r.passed);
      if (!r.passed) { Store.set('BELLS_CRACKED', Math.min(3, crackedNow(s) + 1)); Store.set('BELLS_R' + n + '_CRACK', true); Store.note(`Round ${n} of the Bells fell short (${r.hits} of ${r.total}); a bell cracked.`); }
      else Store.note(`Round ${n} of the Bells held (${r.hits} of ${r.total}).`);
    };
  }
  function roundText(n, holdLines) {
    return (s, r) => {
      const pct = Math.round(r.ratio * 100);
      const out = [{ text: `${r.hits} of ${r.total} bells struck clean — ${pct} of every hundred.`, cls: 'big' }];
      if (r.passed) out.push(...holdLines);
      else {
        const c = s.flags.BELLS_CRACKED | 0;
        out.push('Not enough. The Cold pushes up through the pattern where the pattern was thin, and one of the four bells answers it with a flat, wrong note that goes on too long.');
        out.push({ text: c >= 3 ? 'Three bells cracked. There is no fourth to crack; the lid holds on the pattern alone.' : `A bell is cracked. ${c} of four.`, cls: 'whisper' });
        out.push('Marrow does not look up from the lid. "Again. The next one. You do not stop for a cracked bell; you ring the three that are left."');
      }
      return out;
    };
  }
  const roundHints = (n) => [
    'Watch the line, not the light: press as the light *crosses* it. Count aloud together — one-and-two-and — every second beat is a bell.',
    'The slow bells are on the ready screen — windows half again as wide, the tempo eased. Nothing is lost but a note on the chart. Missed bells never end the night; a missed round cracks one bell.',
    (s) => `The script is fixed and the same every time. Round ${n}, in order: ${scriptWords(ROUNDS[n].script)}.`,
  ];

  /* ---------- the Second Asking ---------- */
  const W = (s, role) => s.flags['WHISPER_' + role];
  const REPLY = {
    listener: { LOUD: 'You said loud. In the laundry. I let you.', NO: 'You said no. You were the only one who didn\'t flinch.' },
    seer: { TELL: 'You told me in the laundry. I thought you were being poetic.', NOTHING: 'You looked at the wall. You\'re looking at it now.' },
    reader: { TELL: '\'A small brave bird.\' Bookmoth. It isn\'t even in your alphabet.', DONTKNOW: 'You said you didn\'t know yet. Do you now?' },
    binder: { YES: 'You said yes. You see every thread in this room. Show me mine.', DONTKNOW: 'That was the kindest thing anyone said to me tonight.' },
  };
  const FALLBACK = { listener: 'You never answered me in the laundry, Hush. You\'re answering now.', seer: 'You never answered me in the laundry, Owl. You\'re answering now.', reader: 'You never answered me in the laundry, Bookmoth. You\'re answering now.', binder: 'You never answered me in the laundry, Knot. You\'re answering now.' };
  const TRUTH = { listener: 'NO', seer: 'TELL', reader: 'DONTKNOW', binder: 'DONTKNOW' };
  const wrenReply = (s, role) => { const v = W(s, role); return (REPLY[role][v]) || FALLBACK[role]; };
  const asked = (role, right, lead, wrongLead) => (s) => [
    (right ? lead : wrongLead) ? { text: right ? lead : wrongLead, cls: right ? undefined : 'whisper' } : null,
    { speaker: 'Wren, to ' + L.roleById(role).nick, text: wrenReply(s, role) },
  ].filter(Boolean);
  const askOpt = (id, text, role, right, next, lead, wrongLead) => ({ id, text, next, set: Object.assign({ ['ASK_' + role]: id }, right ? { CLUES: (s) => (s.flags.CLUES | 0) + 1 } : {}), after: asked(role, right, lead, wrongLead) });

  /* ---------- the Stone ---------- */
  const STONE = [{ shape: 'Flame', inv: false }, { shape: 'Flame', inv: true }, { shape: 'Crown', inv: false }, { shape: 'Hook', inv: false }, { shape: 'Spike', inv: false }, { shape: 'Flame', inv: true }, { shape: 'Crown', inv: true }, { shape: 'Hook', inv: true }];
  const NAIVE = G.readNaive(STONE);   // ASH COLD CROWN KNOT THORN COLD EMBER VEIL
  const TURNED = G.readTurned(STONE); // KNOT CROWN ASH WELL VEIL EMBER ASH COLD
  const STONE_ANSWER = {}; TURNED.forEach((g, i) => { STONE_ANSWER[i + 1] = g; });
  const readingHtml = (names, glosses) => `<div class="ch6-reading">${names.map((n, i) => `<span class="g">${G.svg(n, { size: 38, color: '#f2d27a' })}${n}<i>${glosses[i]}</i></span>`).join('')}</div>`;
  const FOUNDERS_GLOSS = ['four-as-one', 'as one', 'fire', 'go down', 'behind', 'kept', 'the fire', 'a hollow'];

  /* ---------- flowchart, built at the end from what happened ---------- */
  function buildFlow(s) {
    const f = s.flags;
    const reply = (role) => { const v = W(s, role); const n = L.roleById(role).nick; if (!v) return n + ': no answer'; const short = { listener: { LOUD: '"I let you."', NO: '"You didn\'t flinch."' }, seer: { TELL: '"Poetic, I thought."', NOTHING: '"Still at the wall."' }, reader: { TELL: '"A brave bird."', DONTKNOW: '"Do you know now?"' }, binder: { YES: '"Show me mine."', DONTKNOW: '"The kindest thing."' } }; return n + ': ' + (short[role][v] || ''); };
    const c = f.BELLS_CRACKED | 0; const rounds = [1, 2, 3].filter(n => f['BELLS_R' + n + '_CRACK']);
    const crackLabel = rounds.length ? 'a bell cracked: round ' + rounds.join(', ') : (c ? 'a bell was cracked already' : 'a bell cracked');
    const nodes = [
      { id: 'ch6_start', label: 'The bell-chamber', col: 0, row: 1 },
      { id: 'ch6_ready', label: 'Hands on the keys', col: 1, row: 1 },
      { id: 'ch6_round1', label: 'The Bells — three rounds', col: 2, row: 1 },
      { id: 'ch6_crack', label: crackLabel, col: 2, row: 2, kind: 'end', secret: true, when: (st) => rounds.length > 0 || (st.flags.BELLS_CRACKED | 0) > 0 },
      { id: 'ch6_slow', label: 'You rang slowly', col: 2, row: 3, kind: 'choice', secret: true, when: (st) => !!st.flags.SLOW_BELLS },
      { id: 'ch6_ask_owl', label: reply('seer'), col: 3, row: 0, kind: 'choice' },
      { id: 'ch6_ask_hush', label: reply('listener'), col: 3, row: 1, kind: 'choice' },
      { id: 'ch6_ask_bookmoth', label: reply('reader'), col: 3, row: 2, kind: 'choice' },
      { id: 'ch6_ask_knot', label: reply('binder'), col: 3, row: 3, kind: 'choice' },
      { id: 'ch6_strip', label: '"I know, Mum." — the Stone', col: 4, row: 1 },
      { id: 'ch6_walk', label: 'The Fourfold Walk', col: 5, row: 0, kind: 'end', secret: true, when: (st) => !!st.flags.WALK_UNLOCKED },
      { id: 'ch7_start', label: 'One Born of Four', col: 5, row: 2, secret: true },
    ];
    const edges = [['ch6_start', 'ch6_ready'], ['ch6_ready', 'ch6_round1'], ['ch6_ready', 'ch6_crack'], ['ch6_ready', 'ch6_slow'],
      ['ch6_round1', 'ch6_ask_owl'], ['ch6_round1', 'ch6_ask_hush'], ['ch6_round1', 'ch6_ask_bookmoth'], ['ch6_round1', 'ch6_ask_knot'],
      ['ch6_ask_owl', 'ch6_strip'], ['ch6_ask_hush', 'ch6_strip'], ['ch6_ask_bookmoth', 'ch6_strip'], ['ch6_ask_knot', 'ch6_strip'],
      ['ch6_strip', 'ch6_walk'], ['ch6_strip', 'ch7_start']];
    void f;
    return { nodes, edges };
  }

  Game.addChapter({
    id: 'ch6', label: 'Chapter VI', title: 'The Bells of Thornhallow', start: 'ch6_start', code: 'WELL',
    mood: 'tense', fx: 'ash', art: 'ch6_chamber', flame: 0.22,
    flow: buildFlow(Store.state),
    scenes: {
      /* ---------- the bell-chamber ---------- */
      ch6_start: {
        art: 'ch6_chamber', mood: 'tense', fx: 'ash', sfx: 'step', flame: 0.22,
        title: 'The bell-chamber',
        enter: (s) => { Store.set('BELLS_CRACKED', crackedNow(s)); if (s.flags.PRECRACKED == null && s.flags.STAIR === 'COLLAPSE') Store.set('PRECRACKED', true); widgetClass('ch6-bells', false); widgetClass('ch6-dark', false); },
        text: (s) => {
          const out = [
            'The Long Stair ends in a room that is mostly floor.',
            'Four bells hang from a beam of black iron, each the height of a person, each cast by a Founder and named for one. Beneath them the floor is a single round plate, riveted, faintly warm. You are standing on a lid.',
            'Under it, the Cold. You can feel it through your boots the way you feel a held breath.',
          ];
          if (s.flags.STAIR === 'COLLAPSE') out.push({ text: 'One bell is wrong already. When the stair came down, the shock ran along the beam and something inside Halvard\'s bell went *tang* instead of *tong*. It has a crack you could lose a fingernail in.', cls: 'whisper' });
          else if (s.flags.STAIR === 'RUN') out.push({ text: 'Somewhere above, boots on the Stair. They will be a while. The Stair is long, and they do not know what waits at the bottom.', cls: 'whisper' });
          else if (volunteerLane(s) != null) out.push({ text: `${nick(volunteerLane(s))}'s thread still runs up the Stair behind you, taut as wire, holding the way shut. ${nick(volunteerLane(s))} looks tired in a way that has nothing to do with the hour.`, cls: 'whisper' });
          return out;
        },
        next: 'ch6_shaft', button: 'Look up',
      },
      ch6_shaft: {
        art: 'ch6_shaft', mood: 'tense', fx: 'ash', flame: 0.2,
        text: [
          'Above the bells, a shaft goes straight up through the roots of the school, through the Vault and the Hall and four hundred years of masonry, to a coin of orange light very far away.',
          'The Hearth. You are looking at it from underneath, for the first time. The fire is lower than anyone alive has seen it — a blue tongue in an orange bed — and above it, dim and huge, the underside of the prophecy stone.',
          { text: 'Wren, beside you, looks up at it the way you might look up at your own house from the bottom of a well.', cls: 'whisper' },
          { speaker: 'Wren', text: 'Huh. It\'s smaller from down here. Everything is. Don\'t tell it I said that.' },
        ],
        next: 'ch6_marrow', button: 'The Provost',
      },
      ch6_marrow: {
        art: 'ch6_lid', mood: 'dread', fx: 'ash', flame: 0.2,
        text: [

            out.push('The flame takes her. The seal holds — thin, a skin of ice on a well — and the Cold stops pushing, for now.');

        text: [
          'White. Not the white of snow — the white of a forge, of a thing too hot to have a colour. The Hearth of Thornhallow roars, and for the first time in four hundred years it is not holding anything shut. It is simply a fire.',
          'You come out of it the way the Founders came out: grey-eyed and ordinary. Bookmoth looks at the stone and sees shapes. Hush hears a room. Owl sees a floor. Knot sees four friends and nothing between them but air.',

          'The Cold closes — not the way the Founders closed it, and not the way the Order would have. Narrower. Enough.',
          `**${listOr(walkers(s), 'The walkers')}** come out of the fire grey-eyed and free, and stand blinking at a room they cannot see under any more.`,
          `**${listOr(stayers(s), 'The rest')}** keep their Sightings, and the fire, for life. There is a school above you that knows now what it is built on, and it will need Masters who can read the wall. Those are the Masters.`,
          'Wren lives. Wren stands on the stones and laughs and hugs everyone, walkers and stayers alike, and holds on slightly too long.',
          'There is no pulse in Wren\'s throat. It is the one visible difference, and only Hush would ever have known.',
          { speaker: 'Wren', text: 'Half of you can\'t see me properly any more. Good. I looked *terrible*.' },
        ],
        next: 'ch8_night', button: 'The whole night',
      },
      ch8_e2: {
        art: 'ch8_stones', artParams: { noWren: true }, mood: 'sorrow', fx: 'embers', flame: 1, speed: 22,
        text: [
          { speaker: 'Wren', text: 'It\'s alright. I knew. I\'ve known since the laundry.' },
          'Wren walks into the Hearth the way Wren walks through doors. It closes behind. Four hundred years of fire, again, from a spark.',
          'In the morning a mason carves a fifth name over the Hearth, beneath the four Founders. He has to ask how to spell it. Nobody in the room can tell him, in the older alphabet, and Bookmoth does not offer.',
          'The Provost stands at the fire with a thread nobody can see but Knot. It is grey. It has been grey for fourteen years.',
          'On the chart of the night, one step from where you stood, there is a box you did not open.',
        ],
        next: 'ch8_night', button: 'The whole night',
      },
      ch8_e3: {
        art: 'ch8_flicker', mood: 'sorrow', fx: 'ash', flame: 0.3, speed: 20,
        text: [
          'She does not say goodbye to Wren. She has been saying it for fourteen years; Knot has seen the colour of it. She puts her hand on the fire as if it were a door, and it is.',
          'The seal holds. Thin — the kind of hold that needs watching — but it holds.',
          'Wren lives. No pulse. Wren does not seem to mind, and stands a long time where the Provost stood, and then makes a joke about it that nobody laughs at, and then one that everybody does.',
          { text: 'Years later.', cls: 'big' },
          'Provost Wren of Thornhallow keeps a fire that flickers. Every winter it dips, and every winter it comes back. The fourth-years are told it is nothing.',
          'The Provost, who once called someone Mum by accident, looks at the fire when it flickers. Not at them.',
        ],
        next: 'ch8_night', button: 'The whole night',
      },
      ch8_e4: {
        art: 'ch8_cage', mood: 'dread', fx: 'ash', flame: 0.15, speed: 20,
        text: (s) => [
          'The Envoy is courteous about it. He has always been courteous.',
          'Wren goes into the cage without being pushed, and does not say anything to any of you, which is the worst thing Wren has ever done.',
          'By spring the Cold feeds the Crown\'s engines. What leaks from under Thornhallow is harnessed, as promised. The school is a garrison. The Hearth is a furnace with a schedule.',
          'You are Masters, as promised. Masters of ash.',
          broken(s).length ? { text: `On the chart of the night, beside ${UI.list(broken(s))}, it says: *one of you almost did.*`, cls: 'whisper' } : { text: 'On the chart of the night, beside your four names, it says nothing at all.', cls: 'whisper' },
        ],
        next: 'ch8_night', button: 'The whole night',
      },

      /* ---------- the whole night ---------- */
      ch8_night: {
        type: 'custom', art: 'ch8_dawn', mood: 'hearth', fx: 'dust',
        text: ['The whole night, unfolded down the Hearth. Lit: what you did. Grey: what you did not. Sealed: what each of you chose alone.'],
        run: (box, api) => new Promise((resolve) => {
          const wrap = UI.el('div', { class: 'ch8-night' });
          const done = litSet(api.state);
          Game.chapters.forEach(ch => {
            if (!ch.flow || !ch.flow.nodes || !ch.flow.nodes.length) return;
            const sec = UI.el('div', { class: 'ch8-chapter' });
            sec.appendChild(UI.el('h4', { text: (ch.label ? ch.label + ' — ' : '') + ch.title }));
            const reached = api.state.visited.some(v => Game.sceneChapter[v] === ch.id);
            if (!reached) sec.appendChild(UI.el('p', { class: 'ch8-sub', text: 'The fire has no record of this hour.' }));
            try { sec.appendChild(UI.flowchart(ch.flow, done)); } catch (e) { console.error(e); }
            wrap.appendChild(sec);
          });
          const sealsSec = UI.el('div', { class: 'ch8-chapter' });
          sealsSec.appendChild(UI.el('h4', { text: 'Sealed — chosen in the dark' }));
          const seals = UI.el('div', { class: 'ch8-seals' });
          R.forEach((r, i) => seals.appendChild(UI.el('div', { class: 'ch8-seal p' + i, html: `<span class="ch8-who">only ${UI.esc(r.nick)} knows</span><span class="ch8-wax"></span><span class="ch8-line">the laundry, the stair, the fire.</span>` })));
          sealsSec.appendChild(seals);
          wrap.appendChild(sealsSec);
          box.appendChild(wrap);
          api.button('Onward', () => resolve('ch8_unseal'), 'primary');
        }),
      },
      ch8_unseal: {
        type: 'choice', art: 'ch8_dawn', mood: 'hearth', fx: 'dust', choice: 'UNSEAL',
        text: ['Four boxes. Each of you chose something in the laundry, something on the stair, something at the fire, and told nobody. The fire kept them.'],
        prompt: 'Unseal what each of you chose in the dark?',
        options: [
          { id: 'yes', text: 'Unseal them. All four, one at a time.', next: 'ch8_unsealed', after: ['The wax cracks.'] },
          { id: 'no', text: 'Leave them sealed.', sub: 'Some things a night keeps.', next: 'ch8_map', after: ['The fire keeps them. It is good at that.'] },
        ],
      },
      ch8_unsealed: {
        type: 'custom', art: 'ch8_dawn', mood: 'hearth', fx: 'dust',
        text: ['One at a time. By nickname. Nobody has to say anything about it.'],
        run: (box, api) => new Promise((resolve) => {
          const s = api.state;
          const wrap = UI.el('div', { class: 'ch8-night' });
          const seals = UI.el('div', { class: 'ch8-seals' });
          const cards = R.map((r, i) => { const c = UI.el('div', { class: 'ch8-seal p' + i, html: `<span class="ch8-who">only ${UI.esc(r.nick)} knows</span><span class="ch8-wax"></span><span class="ch8-line">sealed</span>` }); seals.appendChild(c); return c; });
          wrap.appendChild(seals); box.appendChild(wrap);
          let n = 0; let btn;
          const open = () => {
            const r = R[n], c = cards[n];
            Audio.sfx('reveal');
            const v = +(s.flags.VOLUNTEER || 0);
            const stair = v === n + 1 ? 'said yes to the stair, and was fastest' : (v > 0 || s.flags.STAIR === 'HOLD') ? 'the fire does not say which' : '';
            c.classList.add('open');
            c.innerHTML = `<span class="ch8-who">${UI.esc(r.nick)}</span>` +
              `<span class="ch8-line"><em>In the laundry:</em> ${UI.rich(whisperLine(s, r))}</span>` +
              (stair ? `<span class="ch8-line"><em>On the stair:</em> ${UI.esc(stair)}</span>` : '') +
              `<span class="ch8-line"><em>At the fire:</em> ${UI.esc(finaleLine(s, r))}</span>`;
            n++;
            if (n >= 4) { btn.remove(); Store.note('You unsealed the four boxes.'); api.button('Onward', () => resolve('ch8_map'), 'primary'); }
            else btn.textContent = `Unseal ${R[n].nick}`;
          };
          btn = api.button(`Unseal ${R[0].nick}`, open, 'primary');
        }),
      },

      /* ---------- the map ---------- */
      ch8_map: {
        type: 'custom', art: 'ch8_dawn', mood: 'wonder', fx: 'dust',
        text: ['The Map of the Night, and the gold line of the route you walked: dormitory, hall, vault, gallery, study, stair, chamber, the Cold, dawn.', { text: 'Seen whole —', cls: 'whisper' }],
        run: (box, api) => new Promise((resolve) => {
          const wrap = UI.el('div', { class: 'ch8-map' });
          try { wrap.appendChild(UI.el('div', { html: window.VigilMap.render() })); } catch (e) { console.error(e); }
          const knot = UI.el('div', { class: 'ch8-knot' });
          const glyph = G.inner('KNOT').replace(/<path /g, '<path class="trace" ').replace('class="trace" d="M-5,15', 'class="trace second" d="M-5,15');
          knot.appendChild(UI.el('div', { class: 'ch8-route', html: `<svg viewBox="-26 -22 52 44"><g style="color:var(--gold-2)">${glyph}</g><g class="ch8-pts"></g></svg>` }));
          knot.appendChild(UI.el('div', { class: 'ch8-caption', text: '— it is the glyph KNOT. Bound; together; four-as-one.' }));
          wrap.appendChild(knot); box.appendChild(wrap);
          // waypoints along the route, placed by path length
          try {
            const svg = knot.querySelector('svg'); const paths = Array.from(svg.querySelectorAll('path.trace')); const pts = svg.querySelector('.ch8-pts');
            // seven hours up the hook (the sheet turns over at the curl), two along the closing stroke
            const hook = paths[0], base = paths[1];
            // [label, path, fraction, label dx, label dy, anchor]
            const spots = [['dormitory', hook, 0, 0, 4.2, 'middle'], ['Great Hall', hook, 1 / 6, -2.4, 0.9, 'end'], ['Vault', hook, 2 / 6, 2.4, 0.9, 'start'], ['Gallery', hook, 3 / 6, -2.4, 0.9, 'end'], ['study', hook, 4 / 6, 2.4, 0.9, 'start'], ['Long Stair', hook, 5 / 6, 0.6, -2.6, 'middle'], ['bell-chamber', hook, 1, -2.2, 0.9, 'end'], ['the Cold', base, 0.1, -2.4, 0.9, 'end'], ['dawn', base, 0.9, 2.4, 0.9, 'start']];
            spots.forEach(([lab, p, f, dx, dy, anchor], i) => {
              const pt = p.getPointAtLength(p.getTotalLength() * f);
              const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); g.setAttribute('class', 'ch8-waypoint'); g.style.animationDelay = (0.3 + i * 0.42) + 's';
              g.innerHTML = `<circle cx="${pt.x.toFixed(2)}" cy="${pt.y.toFixed(2)}" r="1.1" fill="#f2d27a" stroke="#0b0a10" stroke-width=".4"/><text x="${(pt.x + dx).toFixed(2)}" y="${(pt.y + dy).toFixed(2)}" font-size="2.4" fill="#e9e2d2" font-family="Cormorant Garamond,serif" text-anchor="${anchor}">${UI.esc(lab)}</text>`;
              pts.appendChild(g);
            });
          } catch (e) { console.error(e); }
          Audio.sfx('reveal');
          api.button('The numbers', () => resolve('ch8_stats'), 'primary');
        }),
      },

      /* ---------- stats ---------- */
      ch8_stats: {
        type: 'custom', art: 'ch8_dawn', mood: 'hearth', fx: 'dust',
        text: (s) => ['The fire keeps count. It always has.', { text: `Wren called you **${s.flags.GROUP_NAME || 'the Four'}**. Wren was right.`, cls: 'small' }],
        run: (box, api) => new Promise((resolve) => {
          const s = api.state;
          const rows = [
            ['Clues caught, in the bell-chamber', `<b>${clues(s)}</b> of 4${s.flags.CLUES_HELP ? ' <span class="small">(with help)</span>' : ''}`],
            ['Truths told to Wren, in the laundry', `<b>${truths(s)}</b> of 4`],
            ['Hints asked of the fire', `<b>${s.flags.hintsTotal || 0}</b>`],
            ['Bells cracked', `<b>${s.flags.BELLS_CRACKED || 0}</b> of 3`],
            ['Minutes to midnight', `<b>${UI.esc(midnightText(s))}</b>`],
            ['Who held the stair', UI.rich(stairText(s))],
            ['Who almost took the Envoy\'s word', broken(s).length ? `<b>${UI.esc(UI.list(broken(s)))}</b> — and then did not` : (kept(s).length ? `<b>${UI.esc(UI.list(kept(s)))}</b> — and did` : 'nobody')],
            ['The ending', `<b>${UI.esc(ENDING_NAMES[ending(s)])}</b>`],
            ['The night, in hours', `<b>${UI.esc(Store.elapsedText())}</b>`],
          ];
          const tb = UI.el('table', { class: 'ch8-stats' });
          rows.forEach(([k, v]) => tb.appendChild(UI.el('tr', {}, [UI.el('td', { text: k }), UI.el('td', { html: v })])));
          box.appendChild(tb);
          const log = (s.log || []).slice(-16);
          if (log.length) { box.appendChild(UI.el('p', { class: 'small', style: { marginTop: '12px' }, text: 'The fire also remembers:' })); box.appendChild(UI.el('ul', { class: 'ch8-log' }, log.map(t => UI.el('li', { text: t })))); }
          api.button('One more thing', () => resolve('ch8_words'), 'primary');
        }),
      },

      /* ---------- the words ---------- */
      ch8_words: {
        type: 'custom', art: 'ch8_dawn', mood: 'wonder', fx: 'motes', speed: 22,
        text: [
          { text: 'The words that woke your phones tonight — THORN, KNOT, VEIL, EMBER, ASH, WELL, CROWN — were the Great Sigil in wall order. The eighth glyph is never written. You wrote it twice: once in the dormitory, when it was a dare, and once just now.', cls: 'omen' },
        ],
        run: (box, api) => new Promise((resolve) => {
          const words = ['THORN', 'KNOT', 'VEIL', 'EMBER', 'ASH', 'WELL', 'CROWN'];
          const row = UI.el('div', { class: 'ch8-words' });
          words.forEach((w, i) => { const c = UI.el('div', { class: 'ch8-w', html: `${G.svg(w, { size: 44, color: '#f2d27a' })}<span>${w}</span><small>${UI.esc(L.chapters[i + 1].label)}</small>` }); c.style.animationDelay = (0.4 + i * 0.35) + 's'; row.appendChild(c); });
          const cold = UI.el('div', { class: 'ch8-w cold', html: `${G.svg('COLD', { size: 44, color: '#4fb3bf' })}<span>WREN</span><small>never written</small>` }); cold.style.animationDelay = '3.4s'; row.appendChild(cold);
          box.appendChild(UI.el('div', { class: 'pz-title', text: 'THE GREAT SIGIL, IN WALL ORDER' }));
          box.appendChild(row);
          box.appendChild(UI.el('p', { class: 'small', text: 'KINDLE, in the dormitory, was only a lamp. Everything after it was the wall.' }));
          words.forEach((w, i) => setTimeout(() => { if (api.alive()) Audio.note(G.MIDI[w], 1.2, 0.14); }, 400 + i * 350));
          api.button('The last word', () => resolve(ending(api.state) === 0 && api.state.flags.WREN_SHOWN ? 'ch8_flow' : 'ch8_code'), 'primary');
        }),
      },
      ch8_code: {
        type: 'code', art: 'ch8_dawn', mood: 'wonder', fx: 'motes',
        text: (s) => [
          ending(s) === 0 ? 'The last word. In the dormitory it was a dare. Write it.' : 'The last word, for the phones. In the dormitory it was a dare; the fire never got to see it written properly. Write it now, and look at your own page — nobody else\'s.',
        ],
        roles: 'Warden of the Hearth (keyboard): **whoever is nearest**. Voice: **all four of you** — a paragraph each, sunwise from Bookmoth.', sightSeconds: 90,
        codeSub: 'Each phone shows its last page. Read yours. Say nothing.',
        enter: () => { Store.set('WREN_SHOWN', true); },
        next: 'ch8_flow', button: 'Every phone has gone dark',
      },
      ch8_flow: {
        type: 'flow', art: 'ch8_dawn', mood: 'hearth', fx: 'embers',
        text: ['The last chart. Small, because the night was long and this is the end of it.'],
        flowTitle: 'Epilogue — the paths you walked',
        stats: (s) => `Ending: **${ENDING_NAMES[ending(s)]}**. Clues ${clues(s)}/4 · truths ${truths(s)}/4 · hints ${s.flags.hintsTotal || 0} · bells cracked ${s.flags.BELLS_CRACKED || 0}.${ending(s) === 2 ? ' One step from where you stood: *They went in together.*' : ''}`,
        next: 'ch8_end', button: 'Sit with it',
      },
      ch8_end: {
        type: 'end', art: 'ch8_stones', mood: 'silence', fx: 'embers', speed: 30,
        enter: (s) => dress(s, ['ch8_years', 'ch8_stones', 'ch8_stones', 'ch8_flicker', 'ch8_cage'], ['silence', 'silence', 'silence', 'silence', 'void'], ['snow', 'embers', 'embers', 'ash', 'ash']),
        text: (s) => [
          { text: 'Sit with it.', cls: 'big' },
          ending(s) === 0 ? { text: 'Four friends, a small house, a fire that is only a fire.', cls: 'center' } : ending(s) === 2 ? { text: 'They went in together. One step away. The fire will show you the way back to CROWN, if you want it.', cls: 'center' } : { text: 'The fire will show you the way back to any hour of the night, if you want it.', cls: 'center' },
          { text: 'Thank you for playing Hearthfall.', cls: 'small center' },
        ],
        button: 'Begin again',
        render: (actions, api) => {
          actions.appendChild(UI.el('div', { class: 'ch8-sit', text: 'S I T   W I T H   I T .' }));
          const row = UI.el('div', { class: 'ch8-endrow' });
          row.appendChild(UI.el('button', { class: 'btn', text: 'Replay from any hour', onclick: () => { Audio.sfx('click'); Game.showChapterSelect(); } }));
          row.appendChild(UI.el('button', { class: 'btn ghost', text: 'The whole night again', onclick: () => { Audio.sfx('click'); Game.go('ch8_night'); } }));
          actions.appendChild(row);
        },
      },
    },
  });
})();

</script>
<script>/* js/main.js */
/* Hearth bootstrap: title screen, seats & keys, new/resume. */
(function () {
  'use strict';
  const UI = window.VigilUI, Store = window.VigilStore, Audio = window.VigilAudio, FX = window.VigilFX, Input = window.VigilInput, Lore = window.VigilLore;

  Game.mount({ stage: 'stage', fx: 'fx', text: 'text', actions: 'actions', widget: 'widget', chapter: 'chapter', timer: 'timer', hint: 'hint', mute: 'mute', menu: 'menu' });
  document.getElementById('qr').addEventListener('click', () => Game.showQR());
  document.getElementById('mapbtn').addEventListener('click', () => window.VigilMap.show());
  FX.set('embers', 0.6);
  Game.setArt('title');
  Audio.mood('hearth');

  const body = document.getElementById('title-body');
  const hasSave = Store.hasSave();
  if (hasSave) Store.load();
  Store.state.names = Lore.roles.map(r => r.nick);

  function render() {
    UI.clear(body);
    body.appendChild(UI.el('p', { class: 'fine', html: 'A cooperative story for four, in one sitting of about two hours. One screen is the <strong>Hearth</strong>. Each of you keeps a phone as your <strong>Companion</strong> — it shows what only you can see. Talk. Nothing tonight can be solved alone.' }));
    body.appendChild(UI.el('p', { class: 'warn', text: 'Fair warning: at one clearly announced moment, the bells of Thornhallow will ring and all four of you will need quick hands on this keyboard. You will be told before it happens.' }));

    const seats = UI.el('div', { class: 'names' });
    Lore.roles.forEach((r, i) => {
      const lab = UI.el('label', { class: 'p' + i });
      lab.appendChild(UI.el('span', { text: r.name }));
      lab.appendChild(UI.el('span', { class: 'seat-nick', text: '"' + r.nick + '"' }));
      lab.appendChild(UI.el('span', { class: 'seat-gift', text: r.gift }));
      lab.appendChild(UI.el('span', { class: 'seat-key', html: `key <b>${UI.esc(Store.state.keys[i] === ' ' ? 'SPACE' : Store.state.keys[i])}</b>` }));
      seats.appendChild(lab);
    });
    body.appendChild(seats);
    body.appendChild(UI.el('p', { class: 'keys', html: `Sit in this order, left to right, facing the screen. <button class="btn small ghost" id="chg-keys">change keys</button>` }));
    body.querySelector('#chg-keys').addEventListener('click', async () => {
      const v = await UI.ask('Four keys, left to right, separated by spaces (letters, digits, or . , / ;). Spread them across the keyboard.', Store.state.keys.join(' '), { plain: true, ok: 'Set keys' });
      if (!v) return; const ks = v.trim().split(/\s+/).map(x => x.toUpperCase()).filter(x => x.length === 1 && /[A-Z0-9.,\/;]/.test(x));
      if (ks.length !== 4 || new Set(ks).size !== 4) { await UI.notice('Need four different single keys.'); return; }
      Store.state.keys = ks; Store.save(); Input.setKeys(ks); render();
    });

    const buttons = UI.el('div', { class: 'buttons' });
    if (hasSave && Store.state.scene) {
      buttons.appendChild(UI.el('button', { class: 'btn primary', text: 'Resume — ' + Store.elapsedText(), onclick: () => { Audio.init(); start(true); } }));
      buttons.appendChild(UI.el('button', { class: 'btn', text: 'New game', onclick: async () => { if (await UI.confirm('Erase the saved night and begin anew?', { danger: true, ok: 'Erase it' })) { const k = Store.state.keys; Store.reset(); Store.state.keys = k; Store.state.names = Lore.roles.map(r => r.nick); Store.save(); Audio.init(); start(false); } } }));
    } else {
      buttons.appendChild(UI.el('button', { class: 'btn primary', text: 'Light the Hearth', onclick: () => { Audio.init(); Store.save(); start(false); } }));
    }
    buttons.appendChild(UI.el('button', { class: 'btn ghost', text: 'Phones: how to join', onclick: () => Game.showQR() }));
    body.appendChild(buttons);
    body.appendChild(UI.el('p', { class: 'fine', html: 'Sound on. Sit where everyone can see this screen and reach the keyboard; a wireless keyboard on the table is ideal. <span class="small">Press space or click the text to hurry the narration.</span>' }));
  }
  render();

  async function start(resume) {
    Input.setKeys(Store.state.keys);
    await FX.fadeOut(900);
    document.getElementById('title').classList.add('hidden');
    document.getElementById('bar').classList.remove('hidden');
    document.getElementById('panel').classList.remove('hidden');
    await FX.fadeIn(900);
    if (resume) Game.resume(); else Game.begin(Game.chapters[0].start);
  }

  // Debug: ?scene=id jumps straight in; ?flags=A,B,C sets flags true; ?set=KEY=val
  const qs = new URLSearchParams(location.search);
  if (qs.get('scene')) {
    if (qs.get('flags')) qs.get('flags').split(',').filter(Boolean).forEach(f => { Store.state.flags[f] = true; });
    if (qs.get('set')) qs.get('set').split(',').forEach(kv => { const [k, v] = kv.split('='); Store.state.flags[k] = isNaN(+v) ? (v === 'true' ? true : v === 'false' ? false : v) : +v; });
    Input.setKeys(Store.state.keys); document.getElementById('title').classList.add('hidden'); document.getElementById('bar').classList.remove('hidden'); document.getElementById('panel').classList.remove('hidden'); Store.startTimer(); Game.go(qs.get('scene'));
  }
})();

</script>
