<script>/* js/art/scenes-ch1.js */
/* Art — Chapter I: The Vigil (the Great Hall, the dais, the Envoy's entrance, the passage) */
(function () {
  'use strict';
  const A = window.VigilArt, P = A.P, W = A.W, H = A.H;

  /* The nine Houses of the Marches, sunwise from the Chair (seat 9). Shared with the Hearth chapter via A.ch1;
     the Companion carries its own copy of this table (js/content/companion/ch1.js) — keep the two identical. */
  const HOUSES = [
    { n: 1, house: 'Harrowden', color: '#3f7a4a', sym: 'chevron' },
    { n: 2, house: 'Ossery',    color: '#8c93a6', sym: 'crescent' },
    { n: 3, house: 'Dunmere',   color: '#4a5f8a', sym: 'tower' },
    { n: 4, house: 'Fellwood',  color: '#2f5a3a', sym: 'tree' },
    { n: 5, house: 'Goldmarch', color: '#b8892e', sym: 'sun' },
    { n: 6, house: 'Redmoor',   color: '#8a2f2f', sym: 'wave' },
    { n: 7, house: 'Sable',     color: '#5a3f8a', sym: 'stars' },
    { n: 8, house: 'Wyeburn',   color: '#8a6a3a', sym: 'key' },
    { n: 9, house: 'the Chair', color: '#2a2434', sym: 'crown' },
  ];
  const st = 'fill="none" stroke="#f4ecd8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"';
  function emblem(sym) {
    switch (sym) {
      case 'chevron': return `<path d="M9,27 L20,12 L31,27" ${st}/><path d="M13,31 L20,22 L27,31" ${st}/>`;
      case 'crescent': return `<path d="M25,9 A11,11 0 1 0 25,31 A8.5,8.5 0 1 1 25,9 Z" fill="#f4ecd8"/>`;
      case 'tower': return `<path d="M13,31 V14 H27 V31 Z M11,14 V9 H15 V14 M18,14 V9 H22 V14 M25,14 V9 H29 V14" ${st}/><path d="M18,31 V24 H22 V31" ${st}/>`;
      case 'tree': return `<path d="M20,7 L28,17 L24,17 L30,25 L25,25 L31,32 L9,32 L15,25 L10,25 L16,17 L12,17 Z" fill="#f4ecd8"/>`;
      case 'sun': return `<circle cx="20" cy="20" r="6" fill="#f4ecd8"/>${[0, 45, 90, 135, 180, 225, 270, 315].map(a => `<path d="M20,20 m${(Math.cos(a * Math.PI / 180) * 9).toFixed(1)},${(Math.sin(a * Math.PI / 180) * 9).toFixed(1)} l${(Math.cos(a * Math.PI / 180) * 5).toFixed(1)},${(Math.sin(a * Math.PI / 180) * 5).toFixed(1)}" ${st}/>`).join('')}`;
      case 'wave': return `<path d="M8,17 C12,12 16,12 20,17 C24,22 28,22 32,17" ${st}/><path d="M8,26 C12,21 16,21 20,26 C24,31 28,31 32,26" ${st}/>`;
      case 'stars': { const s = (x, y, r) => { let d = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; d += (i ? 'L' : 'M') + (x + Math.cos(a) * rr).toFixed(1) + ',' + (y + Math.sin(a) * rr).toFixed(1); } return `<path d="${d}Z" fill="#f4ecd8"/>`; }; return s(20, 12, 5) + s(12, 26, 5) + s(28, 26, 5); }
      case 'key': return `<circle cx="14" cy="16" r="5.5" ${st}/><path d="M18,20 L30,32 M26,28 L29,25 M23,25 L26,22" ${st}/>`;
      case 'crown': return `<g transform="translate(20,21) scale(0.9)" style="color:#f4ecd8">${window.VigilGlyphs.shapeInner('Crown', false)}</g>`;
    }
    return '';
  }
  /* Small banner (shield) for the seats widget and phone lists. */
  function banner(h, size) {
    return `<svg viewBox="0 0 40 40" width="${size || 26}" height="${size || 26}" style="display:block"><path d="M5,3 H35 V28 L20,38 L5,28 Z" fill="${h.color}" stroke="rgba(244,236,216,0.5)" stroke-width="1.5"/>${emblem(h.sym)}</svg>`;
  }
  /* Tall hanging banner for scenes. */
  function hanging(h, x, y, w, l, dim) {
    const op = dim ? 0.55 : 0.9;
    return `<g transform="translate(${x},${y})" opacity="${op}"><rect x="${-w / 2 - 8}" y="-6" width="${w + 16}" height="10" rx="3" fill="#3a2f28"/><path d="M${-w / 2},0 H${w / 2} V${l - w * 0.4} L0,${l} L${-w / 2},${l - w * 0.4} Z" fill="${h.color}"/><path d="M${-w / 2},0 H${w / 2} V${l - w * 0.4} L0,${l} L${-w / 2},${l - w * 0.4} Z" fill="url(#bannerShade)"/><g transform="translate(${-w * 0.35},${l * 0.28}) scale(${w * 0.7 / 40})">${emblem(h.sym)}</g></g>`;
  }
  const bannerDefs = `<defs><linearGradient id="bannerShade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient></defs>`;
  A.ch1 = { HOUSES, emblem, banner, hanging };

  /* Nine banners in perspective along both walls, the Chair's at the far end. */
  function bannerRow(dim) {
    let s = bannerDefs;
    // left wall: seats 1-4 nearest first; right wall: 8-5; the Chair's over the Hearth
    const left = [0, 1, 2, 3], right = [7, 6, 5, 4];
    left.forEach((k, i) => { const t = i / 3; s += hanging(HOUSES[k], 140 + t * 330, 90 + t * 60, 120 - t * 55, 300 - t * 150, dim); });
    right.forEach((k, i) => { const t = i / 3; s += hanging(HOUSES[k], 1460 - t * 330, 90 + t * 60, 120 - t * 55, 300 - t * 150, dim); });
    s += hanging(HOUSES[8], 800, 60, 70, 150, dim);
    return s;
  }
  function masters() {
    const list = [];
    for (let i = 0; i < 4; i++) { const t = i / 3; list.push({ x: 300 + t * 200, s: 0.9 - t * 0.35 }); list.push({ x: 1300 - t * 200, s: 0.9 - t * 0.35 }); }
    return P.figures(list.map(f => ({ x: f.x, s: f.s })), 700, '#0c0a12');
  }

  A.define('ch1_hall', () => P.wrap(
    P.sky('#07060c', '#1a120e') +
    `<rect x="0" y="0" width="${W}" height="560" fill="#0b0912"/>` +
    P.pillars(8, 720, 640, '#0a0810') +
    // far wall and the Hearth's arch
    `<rect x="560" y="300" width="480" height="420" fill="#120d12"/><path d="M560,300 A240,240 0 0 1 1040,300" fill="#120d12"/>` +
    `<rect x="640" y="240" width="320" height="70" rx="4" fill="#211a20" stroke="#3a2c2c" stroke-width="3"/>` +
    `<g opacity=".55">${[0, 1, 2, 3, 4, 5, 6, 7].map(i => `<g transform="translate(${670 + i * 37},275) scale(0.8)" style="color:#7a6a5a">${window.VigilGlyphs.shapeInner(['Flame', 'Flame', 'Crown', 'Hook', 'Spike', 'Flame', 'Crown', 'Hook'][i], [false, true, false, false, false, true, true, true][i])}</g>`).join('')}</g>` +
    A.fire(800, 700, 0.62, false) +
    bannerRow(false) +
    P.floorTiles(720, '#0b0910', 'rgba(255,255,255,0.04)') +
    // long tables
    `<rect x="120" y="740" width="520" height="14" fill="#1c1510"/><rect x="960" y="740" width="520" height="14" fill="#1c1510"/>` +
    masters() +
    P.torch(90, 420, 1.1) + P.torch(1510, 420, 1.1) +
    P.fog(560, 340, '#2a1a12', 0.35)
  ));

  A.define('ch1_dais', () => P.wrap(
    P.sky('#07060c', '#17100d') +
    `<rect x="0" y="0" width="${W}" height="560" fill="#0b0912"/>` +
    P.pillars(6, 720, 640, '#0a0810') +
    bannerRow(true) +
    // the glow of the Hearth from behind the dais
    `<circle cx="800" cy="560" r="420" fill="#ff9a3c" opacity=".08"><animate attributeName="opacity" values=".08;.12;.07;.1;.08" dur="2.6s" repeatCount="indefinite"/></circle>` +
    // dais: three steps
    `<rect x="380" y="640" width="840" height="30" rx="4" fill="#1e1712"/><rect x="440" y="610" width="720" height="34" rx="4" fill="#251c15"/><rect x="500" y="580" width="600" height="34" rx="4" fill="#2c221a"/>` +
    // Marrow (tall, still) and Wren (small, on the mark)
    `<g transform="translate(700,580)"><ellipse cx="0" cy="-6" rx="24" ry="8" fill="#000" opacity=".35"/><path d="M-22,0 L-16,-150 L16,-150 L22,0 Z" fill="#0c0a12"/><circle cx="0" cy="-166" r="15" fill="#0c0a12"/><path d="M-16,-150 L-22,0" stroke="#3a2a22" stroke-width="1.5"/></g>` +
    `<g transform="translate(860,580)"><ellipse cx="0" cy="-4" rx="18" ry="6" fill="#000" opacity=".35"/><path d="M-12,0 L-9,-92 L9,-92 L12,0 Z" fill="#0c0a12"/><circle cx="0" cy="-104" r="12" fill="#0c0a12"/><path d="M9,-92 L12,0" stroke="#ff9a3c" stroke-width="1.5" opacity=".6"/></g>` +
    // a circle cut into the dais where the child stands
    `<ellipse cx="860" cy="596" rx="60" ry="10" fill="none" stroke="rgba(212,169,78,0.35)" stroke-width="2"/>` +
    P.floorTiles(720, '#0b0910', 'rgba(255,255,255,0.04)') +
    P.torch(300, 480, 1) + P.torch(1300, 480, 1) +
    P.fog(600, 300, '#2a1a12', 0.3)
  ));

  A.define('ch1_vane', () => P.wrap(
    P.sky('#07060c', '#100c12') +
    `<rect x="0" y="0" width="${W}" height="560" fill="#0b0912"/>` +
    P.pillars(6, 720, 640, '#0a0810') +
    bannerRow(true) +
    // the great doors, open; night and moonlight beyond
    `<path d="M600,720 L600,300 A200,200 0 0 1 1000,300 L1000,720 Z" fill="#dcd6c8" opacity=".12"/>` +
    `<path d="M610,720 L610,305 A190,190 0 0 1 990,305 L990,720 Z" fill="#0d1018"/>` +
    P.stars(40, 31, 420).replace('<g class="stars">', '<g class="stars" clip-path="inset(0 610px 0 610px)">') +
    P.lightBeam(800, 320, 700, 620, '#dcd6c8') +
    // door leaves swung inward
    `<path d="M600,300 L520,330 L520,760 L600,720 Z" fill="#241a12"/><path d="M1000,300 L1080,330 L1080,760 L1000,720 Z" fill="#241a12"/>` +
    // soldiers in rows, then the Envoy
    P.figures([{ x: 660, s: 0.7 }, { x: 720, s: 0.72 }, { x: 880, s: 0.72 }, { x: 940, s: 0.7 }, { x: 690, s: 0.8 }, { x: 910, s: 0.8 }], 700, '#0a0910') +
    `${[660, 720, 880, 940].map(x => `<line x1="${x + 14}" y1="700" x2="${x + 14}" y2="590" stroke="#3a3540" stroke-width="3"/>`).join('')}` +
    `<g transform="translate(800,730)"><ellipse cx="0" cy="-6" rx="26" ry="8" fill="#000" opacity=".4"/><path d="M-20,0 L-14,-140 L14,-140 L20,0 Z" fill="#2a2a30"/><circle cx="0" cy="-156" r="14" fill="#1a1a20"/><path d="M-20,0 L-28,-30 L-14,-140" fill="#2a2a30"/><path d="M14,-140 L28,-30 L20,0" fill="#2a2a30"/><rect x="-6" y="-100" width="12" height="40" rx="2" fill="#c9a85a" opacity=".8"/><circle cx="0" cy="-80" r="7" fill="#8a2f2f"/></g>` +
    P.floorTiles(720, '#0b0910', 'rgba(255,255,255,0.04)') +
    P.fog(560, 340, '#1a1a24', 0.35)
  ));

  A.define('ch1_passage', () => P.wrap(
    P.sky('#06050a', '#120d10') +
    // a narrow vaulted passage
    `<path d="M300,900 L300,420 A500,500 0 0 1 1300,420 L1300,900 Z" fill="#100c12"/>` +
    `<path d="M480,900 L480,520 A320,320 0 0 1 1120,520 L1120,900 Z" fill="#0a0810"/>` +
    `<path d="M620,900 L620,600 A180,180 0 0 1 980,600 L980,900 Z" fill="#06050a"/>` +
    P.torch(700, 250, 1.4) +
    // soldiers' shadows down the passage, and the Envoy in the light
    P.figures([{ x: 1180, s: 0.6, color: '#08070c' }, { x: 1300, s: 0.6, color: '#08070c' }], 470, '#08070c') +
    `<g transform="translate(980,480)"><ellipse cx="0" cy="-6" rx="30" ry="9" fill="#000" opacity=".4"/><path d="M-22,0 L-16,-160 L16,-160 L22,0 Z" fill="#26262c"/><circle cx="0" cy="-178" r="16" fill="#18181e"/><path d="M-16,-160 L-22,0" stroke="#ffb86a" stroke-width="2" opacity=".5"/><rect x="-6" y="-110" width="12" height="44" rx="2" fill="#c9a85a" opacity=".7"/></g>` +
    P.floorTiles(800, '#0a0810', 'rgba(255,255,255,0.03)') +
    P.fog(500, 400, '#1a1410', 0.4)
  ));
})();

</script>
<script>/* js/art/scenes-ch2.js */
/* Art — Chapter II: The Ember Vault */
(function () {
  'use strict';
  const A = window.VigilArt, P = A.P, W = A.W, H = A.H;
  const COLD = '#4fb3bf', COLD2 = '#a8e6ee';

  /* A hooded silhouette on a plinth, lit edge toward `lit` (-1 left, 1 right). */
  function statue(x, base, scale, lit, name) {
    const sc = scale || 1;
    return `<g transform="translate(${x},${base}) scale(${sc})">` +
      `<rect x="-70" y="0" width="140" height="70" fill="#17131c" stroke="#2a2330" stroke-width="3"/>` +
      `<rect x="-58" y="12" width="116" height="46" rx="3" fill="#100d14"/>` +
      `<ellipse cx="0" cy="-110" rx="80" ry="150" fill="#2a2234" opacity=".35"/>` +
      `<path d="M-38,0 L-30,-150 C-30,-190 -14,-215 0,-222 C14,-215 30,-190 30,-150 L38,0 Z" fill="#06050a"/>` +
      `<path d="M${lit * 30},-150 C${lit * 30},-190 ${lit * 14},-215 0,-222 L0,-214 C${lit * 11},-208 ${lit * 24},-186 ${lit * 24},-150 L${lit * 32},0 L${lit * 38},0 Z" fill="#5a4c66" opacity=".85"/>` +
      `<path d="M-14,-226 C-14,-238 14,-238 14,-226 L10,-206 L-10,-206 Z" fill="#06050a"/>` +
      (name ? `<text y="46" text-anchor="middle" fill="rgba(212,169,78,0.55)" font-size="17" font-family="Cinzel,serif" letter-spacing="4">${name}</text>` : '') +
      `</g>`;
  }
  /* A bronze dial set in the floor. */
  function dial(x, y, label) {
    return `<g transform="translate(${x},${y})">` +
      `<ellipse cx="0" cy="0" rx="62" ry="24" fill="#2a2010" stroke="#8a7040" stroke-width="3"/>` +
      `<ellipse cx="0" cy="-4" rx="46" ry="17" fill="#3a2c14" stroke="#c9a85a" stroke-width="2" opacity=".9"/>` +
      `<ellipse cx="0" cy="-5" rx="12" ry="5" fill="#1a1408" stroke="#c9a85a" stroke-width="1.5"/>` +
      `<line x1="0" y1="-20" x2="0" y2="-12" stroke="#f2d27a" stroke-width="3" stroke-linecap="round"/>` +
      `<text y="52" text-anchor="middle" fill="rgba(233,226,210,0.6)" font-size="22" font-family="Cinzel,serif" letter-spacing="3">${label}</text>` +
      `</g>`;
  }
  /* The Ember: a cold blue stone in a glass case. */
  function ember(x, y, scale) {
    const sc = scale || 1;
    return `<g transform="translate(${x},${y}) scale(${sc})">` +
      `<circle cx="0" cy="-30" r="180" fill="${COLD}" opacity=".10"><animate attributeName="opacity" values=".10;.16;.09;.14;.10" dur="3.2s" repeatCount="indefinite"/></circle>` +
      `<rect x="-40" y="-70" width="80" height="80" rx="6" fill="rgba(168,230,238,0.08)" stroke="${COLD2}" stroke-width="2" opacity=".8"/>` +
      `<path d="M0,-58 C12,-48 18,-38 18,-28 C18,-16 10,-8 0,-8 C-10,-8 -18,-16 -18,-28 C-18,-38 -12,-48 0,-58 Z" fill="${COLD}" opacity=".9"><animate attributeName="opacity" values=".9;.6;.95;.7;.9" dur="2.1s" repeatCount="indefinite"/></path>` +
      `<path d="M0,-46 C6,-40 9,-34 9,-28 C9,-21 5,-17 0,-17 C-5,-17 -9,-21 -9,-28 C-9,-34 -6,-40 0,-46 Z" fill="${COLD2}" opacity=".95"/>` +
      `</g>`;
  }
  A.ch2 = { statue, dial, ember };

  /* ---------- the stair down ---------- */
  A.define('ch2_stair', (p) => {
    let steps = '';
    for (let i = 0; i < 14; i++) {
      const t = i / 13, y = 300 + Math.pow(t, 1.35) * 560, w = 220 + t * 1500, x = 800 - w / 2;
      const gap = p && p.broken && i >= 7 && i <= 8;
      if (gap) { steps += `<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="${(w * 0.28).toFixed(0)}" height="${(26 + t * 40).toFixed(0)}" fill="#14111a"/><rect x="${(x + w * 0.72).toFixed(0)}" y="${y.toFixed(0)}" width="${(w * 0.28).toFixed(0)}" height="${(26 + t * 40).toFixed(0)}" fill="#14111a"/>`; continue; }
      steps += `<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="${w.toFixed(0)}" height="${(26 + t * 40).toFixed(0)}" fill="${i % 2 ? '#14111a' : '#181420'}"/><line x1="${x.toFixed(0)}" y1="${y.toFixed(0)}" x2="${(x + w).toFixed(0)}" y2="${y.toFixed(0)}" stroke="rgba(255,255,255,0.06)"/>`;
    }
    return P.wrap(
      P.sky('#050409', '#0d0a12') +
      `<path d="M520,0 L1080,0 L1600,900 L0,900 Z" fill="#0b0910"/>` +
      `<path d="M640,0 L960,0 L800,300 Z" fill="#2a1a12" opacity=".35"/>` +
      steps +
      (p && p.broken ? `<path d="M690,700 L910,700 L980,900 L620,900 Z" fill="#050409"/><path d="M700,690 l30,-20 l20,30 l-40,10 Z" fill="#1a151f"/><path d="M880,700 l40,-14 l10,24 l-40,6 Z" fill="#1a151f"/>` : '') +
      `<g transform="translate(800,300)"><path d="M-120,0 L120,0 L60,-160 L-60,-160 Z" fill="#0a0810" opacity=".9"/></g>` +
      P.torch(430, 330, 1.2) + P.torch(1170, 330, 1.2) +
      `<ellipse cx="800" cy="900" rx="500" ry="140" fill="${COLD}" opacity=".16"><animate attributeName="opacity" values=".16;.22;.14;.2;.16" dur="4s" repeatCount="indefinite"/></ellipse>` +
      P.fog(560, 340, '#0f2a30', 0.5)
    );
  });

  /* ---------- the Founders' Antechamber: four statues, four dials ---------- */
  A.define('ch2_antechamber', (p) => {
    const names = ['MERE', 'HALVARD', 'ROOK', 'IDONY'];
    const xs = [320, 640, 960, 1280];
    return P.wrap(
      P.sky('#07060b', '#120e16') +
      `<rect x="0" y="0" width="${W}" height="520" fill="#0d0a12"/>` +
      `<path d="M0,520 A800,420 0 0 1 1600,520" fill="#100c15"/>` +
      P.pillars(5, 560, 520, '#0a0810') +
      P.floorTiles(560, '#0e0b13', 'rgba(255,255,255,0.045)') +
      xs.map((x, i) => statue(x, 490, 0.95, i < 2 ? 1 : -1, names[i])).join('') +
      `<rect x="120" y="556" width="1360" height="6" fill="#221a20"/>` +
      xs.map((x, i) => dial(x, 690, 'ABCD'[i])).join('') +
      `<g transform="translate(800,300)"><rect x="-260" y="-90" width="520" height="180" rx="8" fill="#15101a" stroke="#2c2330" stroke-width="4"/>` +
      `<path d="M-260,-90 A260,260 0 0 1 260,-90" fill="#15101a" stroke="#2c2330" stroke-width="4"/>` +
      `<line x1="0" y1="-300" x2="0" y2="90" stroke="#2c2330" stroke-width="5"/>` +
      `<circle cx="0" cy="-30" r="64" fill="none" stroke="rgba(212,169,78,0.35)" stroke-width="3"/><circle cx="0" cy="-30" r="50" fill="none" stroke="rgba(212,169,78,0.2)" stroke-width="1.5"/>` +
      `${[0, 1, 2, 3, 4, 5, 6, 7].map(i => { const a = i / 8 * Math.PI * 2 - Math.PI / 2; return `<line x1="${(Math.cos(a) * 50).toFixed(1)}" y1="${(-30 + Math.sin(a) * 50).toFixed(1)}" x2="${(Math.cos(a) * 64).toFixed(1)}" y2="${(-30 + Math.sin(a) * 64).toFixed(1)}" stroke="rgba(212,169,78,0.4)" stroke-width="3" stroke-linecap="round"/>`; }).join('')}</g>` +
      P.torch(150, 400, 1.1) + P.torch(1450, 400, 1.1) +
      P.fog(480, 260, '#1a1420', 0.4)
    );
  });

  /* ---------- the Vault: the Ember on its plinth, the road bricked beyond ---------- */
  A.define('ch2_vault', (p) => {
    let bricks = '';
    for (let r = 0; r < 9; r++) for (let c = 0; c < 6; c++) { const x = 690 + c * 38 + (r % 2 ? 19 : 0), y = 250 + r * 26; bricks += `<rect x="${x}" y="${y}" width="36" height="24" fill="#1a1418" stroke="#0a0810" stroke-width="2"/>`; }
    return P.wrap(
      P.sky('#05060c', '#0b0d16') +
      `<path d="M0,900 L0,420 A800,520 0 0 1 1600,420 L1600,900 Z" fill="#0c0b14"/>` +
      `<path d="M120,900 L120,520 A680,420 0 0 1 1480,520 L1480,900 Z" fill="#0f0e18"/>` +
      // the bricked archway at the back
      `<path d="M660,480 L660,300 A140,140 0 0 1 940,300 L940,480 Z" fill="#241c22" stroke="#2c2330" stroke-width="6"/>` +

<script>/* js/art/scenes-ch3.js */
/* Art — Chapter III: The Whispering Gallery (the Gallery of portraits, the dark corridors, the Laundry, the Tower door). */
(function () {
  'use strict';
  const A = window.VigilArt, P = A.P, W = A.W, H = A.H;

  /* A row of portrait frames receding along one wall. side: -1 left wall, +1 right wall. */
  function frames(side, n, seed) {
    const r = A.rng(seed || 3);
    let s = '';
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);                       // 0 near, 1 far
      const x = side < 0 ? 40 + t * 640 : W - 40 - t * 640;
      const sc = 1 - t * 0.72;
      const fw = 150 * sc, fh = 210 * sc, y = 250 - t * 60;
      const skew = side < 0 ? -12 * (1 - t) : 12 * (1 - t);
      const lit = 0.35 + r() * 0.3;
      s += `<g transform="translate(${x.toFixed(0)},${y.toFixed(0)}) skewY(${skew.toFixed(1)})">`;
      s += `<rect x="${(-fw / 2).toFixed(0)}" y="0" width="${fw.toFixed(0)}" height="${fh.toFixed(0)}" fill="#0f0c14" stroke="#4a3a22" stroke-width="${(5 * sc).toFixed(1)}"/>`;
      s += `<rect x="${(-fw / 2 + 12 * sc).toFixed(0)}" y="${(12 * sc).toFixed(0)}" width="${(fw - 24 * sc).toFixed(0)}" height="${(fh - 24 * sc).toFixed(0)}" fill="#171220"/>`;
      // a dim figure in the frame: shoulders and a head, no face
      s += `<path d="M${(-fw * 0.3).toFixed(0)},${fh.toFixed(0)} C${(-fw * 0.3).toFixed(0)},${(fh * 0.55).toFixed(0)} ${(fw * 0.3).toFixed(0)},${(fh * 0.55).toFixed(0)} ${(fw * 0.3).toFixed(0)},${fh.toFixed(0)} Z" fill="#221a2c"/>`;
      s += `<circle cx="0" cy="${(fh * 0.4).toFixed(0)}" r="${(fw * 0.16).toFixed(0)}" fill="#261d31"/>`;
      // a lit edge that breathes — the portraits mutter
      s += `<rect x="${(-fw / 2).toFixed(0)}" y="0" width="${fw.toFixed(0)}" height="${fh.toFixed(0)}" fill="none" stroke="#d4a94e" stroke-width="${(1.5 * sc).toFixed(1)}" opacity="${lit.toFixed(2)}"><animate attributeName="opacity" values="${lit.toFixed(2)};${(lit * 0.4).toFixed(2)};${lit.toFixed(2)}" dur="${(2.5 + r() * 4).toFixed(1)}s" repeatCount="indefinite"/></rect>`;
      s += `</g>`;
    }
    return s;
  }

  /* The Gallery: a long hall of muttering portraits, a single lamp far off, five small figures. */
  A.define('ch3_gallery', () => P.wrap(
    P.sky('#0a0810', '#15101a') +
    // far wall with a lamp
    `<rect x="700" y="230" width="200" height="330" fill="#100c15"/>` +
    `<circle cx="800" cy="330" r="150" fill="#ff9a3c" opacity=".08"><animate attributeName="opacity" values=".08;.13;.07;.1;.08" dur="3s" repeatCount="indefinite"/></circle>` +
    `<g transform="translate(800,330)"><rect x="-8" y="0" width="16" height="70" fill="#2a2010"/><ellipse cx="0" cy="-6" rx="9" ry="16" fill="#ffb060"><animate attributeName="ry" values="16;20;14;18;16" dur="0.8s" repeatCount="indefinite"/></ellipse></g>` +
    // ceiling ribs
    `${[0, 1, 2, 3, 4, 5].map(i => { const t = i / 6; const y = 60 + t * 100; const x1 = 80 + t * 560, x2 = W - 80 - t * 560; return `<path d="M${x1},${y + 80} Q800,${y - 40} ${x2},${y + 80}" fill="none" stroke="#1b1522" stroke-width="${(14 - i * 2)}"/>`; }).join('')}` +
    frames(-1, 7, 31) + frames(1, 7, 47) +
    P.floorTiles(560, '#0d0a12', 'rgba(212,169,78,0.06)') +
    `<path d="M600,560 L1000,560 L1400,${H} L200,${H} Z" fill="#a03a10" opacity=".08"/>` +
    P.figures([{ x: 640, s: 1.0 }, { x: 720, s: 1.05 }, { x: 900, s: 1.05 }, { x: 980, s: 1.0 }], 760, '#0a0810') +
    P.figures([{ x: 810, s: 0.8 }], 745, '#120d16') +
    `<ellipse cx="810" cy="748" rx="14" ry="5" fill="#000" opacity=".4"/>` +
    P.fog(420, 380, '#1a1220', 0.35)
  ));

  /* The corridors: dark stone, a turning, a patrol's lantern-light sliding along the far wall. */
  A.define('ch3_corridors', (p) => P.wrap(
    P.sky('#07060b', '#100d15') +
    `<rect x="0" y="0" width="${W}" height="${H}" fill="#08070c"/>` +
    // right wall in perspective
    `<path d="M${W},0 L1100,180 L1100,620 L${W},${H} Z" fill="#12101a"/>` +
    `<path d="M0,0 L500,180 L500,620 L0,${H} Z" fill="#100e17"/>` +
    // far wall with a doorway
    `<rect x="500" y="180" width="600" height="440" fill="#0c0a11"/>` +
    `<path d="M760,620 L760,330 A40,40 0 0 1 840,330 L840,620 Z" fill="#050409"/>` +
    // stone courses
    `${[0, 1, 2, 3, 4, 5, 6].map(i => `<line x1="500" y1="${200 + i * 60}" x2="1100" y2="${200 + i * 60}" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>`).join('')}` +
    `${[0, 1, 2, 3, 4].map(i => `<line x1="${0}" y1="${i * 225}" x2="500" y2="${180 + i * 110}" stroke="rgba(255,255,255,0.03)"/>`).join('')}` +
    // the sliding lantern light of a patrol, far off
    `<g><ellipse cx="640" cy="420" rx="120" ry="160" fill="${p && p.cold ? '#4fb3bf' : '#ffb060'}" opacity=".10"><animate attributeName="cx" values="560;1040;560" dur="14s" repeatCount="indefinite"/><animate attributeName="opacity" values=".10;.16;.06;.14;.10" dur="3.1s" repeatCount="indefinite"/></ellipse></g>` +
    // a niche lamp near the viewer, mostly out
    P.torch(120, 300, 0.9).replace(/opacity="\.12"/, 'opacity=".06"') +
    P.floorTiles(620, '#09080d', 'rgba(255,255,255,0.03)') +
    `<path d="M700,620 L900,620 L1300,${H} L300,${H} Z" fill="#ffb060" opacity=".035"/>` +
    P.fog(500, 300, '#151020', 0.4)
  ));

  /* The Laundry: drying racks, hanging sheets, a stove's glow, Bess's silhouette. */
  A.define('ch3_laundry', () => P.wrap(
    P.sky('#0d0a10', '#1c1410') +
    // rafters and racks
    `${[0, 1, 2, 3].map(i => `<rect x="120" y="${110 + i * 40}" width="1360" height="10" fill="#1d1712"/>`).join('')}` +
    // hanging sheets
    `${[0, 1, 2, 3, 4, 5, 6].map(i => { const x = 180 + i * 200, h = 300 + (i % 3) * 60; return `<path d="M${x},120 L${x + 140},120 L${x + 150},${120 + h} Q${x + 70},${140 + h} ${x - 10},${120 + h} Z" fill="#2a2430" opacity=".9"><animateTransform attributeName="transform" type="skewX" values="0;1.5;0;-1.2;0" dur="${(6 + i).toFixed(0)}s" repeatCount="indefinite"/></path>`; }).join('')}` +
    // the stove
    `<rect x="1180" y="480" width="220" height="260" rx="8" fill="#1a1410"/>` +
    `<rect x="1230" y="560" width="120" height="90" rx="4" fill="#ff8a3c" opacity=".55"><animate attributeName="opacity" values=".55;.35;.6;.4;.55" dur="1.7s" repeatCount="indefinite"/></rect>` +
    `<circle cx="1290" cy="600" r="260" fill="#ff9a3c" opacity=".09"><animate attributeName="opacity" values=".09;.13;.08;.11;.09" dur="2.3s" repeatCount="indefinite"/></circle>` +
    // copper and tubs
    `<ellipse cx="420" cy="700" rx="110" ry="30" fill="#221a14"/><rect x="310" y="620" width="220" height="80" fill="#2a2018"/>` +
    P.floorTiles(720, '#100c10', 'rgba(255,200,150,0.04)') +
    // Bess, broad, at the stove; four; Wren small on a tub
    P.figures([{ x: 1120, s: 1.15, color: '#0e0b0e' }], 770, '#0e0b0e') +
    P.figures([{ x: 560, s: 1.0 }, { x: 640, s: 1.0 }, { x: 760, s: 1.0 }, { x: 840, s: 1.0 }], 790, '#0b0910') +
    P.figures([{ x: 420, s: 0.75, color: '#150f14' }], 700, '#150f14') +
    P.fog(380, 400, '#2a1e18', 0.35)
  ));

  /* The Tower door: a great iron-bound door with two shapes carved over it; soldiers' silhouettes; the ward's glow (p.ward: 'ash' | 'cold' | none). */
  A.define('ch3_towerdoor', (p) => {
    const glow = p && p.ward === 'cold' ? '#4fb3bf' : (p && p.ward ? '#ff9a3c' : null);
    return P.wrap(
      P.sky('#07060b', '#120e16') +
      `<rect x="0" y="0" width="${W}" height="${H}" fill="#0a080e"/>` +
      // tower wall
      `<rect x="480" y="0" width="640" height="${H}" fill="#14101a"/>` +
      `${[0, 1, 2, 3, 4, 5, 6, 7, 8].map(i => `<line x1="480" y1="${i * 100 + 40}" x2="1120" y2="${i * 100 + 40}" stroke="rgba(255,255,255,0.035)"/>`).join('')}` +
      // the door
      P.door(800, 300, 240, 460, '#2a2030', glow) +
      `${[0, 1, 2, 3].map(i => `<rect x="700" y="${400 + i * 80}" width="200" height="10" fill="#3a3040"/>`).join('')}` +
      // the two carved shapes above the door, worn on the Hearth
      `<g transform="translate(740,240) scale(1.7)" style="color:#6a5a4a" opacity=".75">${window.VigilGlyphs.shapeInner('Flame', false)}</g>` +
      `<g transform="translate(860,240) scale(1.7)" style="color:#6a5a4a" opacity=".75">${window.VigilGlyphs.shapeInner('Spike', false)}</g>` +
      // torches either side
      P.torch(560, 380, 1.1) + P.torch(1040, 380, 1.1) +
      P.floorTiles(760, '#0b090f', 'rgba(255,255,255,0.03)') +
      // soldiers: a line of silhouettes with spears, and a captain forward
      `${[0, 1, 2, 3, 4].map(i => `<g transform="translate(${1180 + i * 80},${820 - i * 10})"><line x1="22" y1="-150" x2="22" y2="0" stroke="#0e0b12" stroke-width="5"/></g>`).join('')}` +
      P.figures([{ x: 1180, s: 1.05, color: '#0e0b12' }, { x: 1260, s: 1.0, color: '#0e0b12' }, { x: 1340, s: 0.95, color: '#0e0b12' }, { x: 1420, s: 0.9, color: '#0e0b12' }], 820, '#0e0b12') +
      P.figures([{ x: 1040, s: 1.15, color: '#0c0a10' }], 830, '#0c0a10') +
      // the four and Wren on the near side
      P.figures([{ x: 300, s: 1.0 }, { x: 380, s: 1.0 }, { x: 460, s: 1.0 }, { x: 540, s: 1.0 }], 840, '#0a0810') +
      P.figures([{ x: 640, s: 0.8, color: '#130f16' }], 830, '#130f16') +
      P.fog(520, 380, '#1a1420', 0.4)
    );
  });
})();

<script>/* js/art/scenes-ch4.js */
/* Art — Chapter IV: The Oath (the Provost's study, the false shelf, the tapestry, the oath scroll) */
(function () {
  'use strict';
  const A = window.VigilArt, P = A.P, W = A.W, H = A.H;
  const G = () => window.VigilGlyphs;

  /* ---------- shared pieces ---------- */
  // A bookcase: x,y,w,h with n shelves of little books. seed for colours.
  function bookcase(x, y, w, h, shelves, seed, opts) {
    opts = opts || {};
    const r = A.rng(seed || 17);
    const cols = ['#3a2a22', '#2e2a3a', '#4a2f22', '#2a3a30', '#3d2e2e', '#33302a', '#4a3a24', '#2b2b3b'];
    let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#120e0c"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="#2c211a" stroke-width="10"/>`;
    const sh = h / shelves;
    for (let i = 0; i < shelves; i++) {
      const sy = y + (i + 1) * sh;
      s += `<rect x="${x}" y="${sy - 8}" width="${w}" height="8" fill="#2c211a"/>`;
      if (opts.skip === i) continue;
      let bx = x + 10;
      while (bx < x + w - 24) {
        const bw = 14 + Math.floor(r() * 22), bh = sh * (0.55 + r() * 0.35);
        s += `<rect x="${bx.toFixed(0)}" y="${(sy - 8 - bh).toFixed(0)}" width="${bw}" height="${bh.toFixed(0)}" fill="${cols[Math.floor(r() * cols.length)]}" opacity=".9"/>`;
        if (r() > 0.6) s += `<rect x="${(bx + 3).toFixed(0)}" y="${(sy - 8 - bh + 10).toFixed(0)}" width="${bw - 6}" height="3" fill="rgba(212,169,78,0.35)"/>`;
        bx += bw + 2 + Math.floor(r() * 4);
      }
    }
    return s;
  }

  // Small hearth fire in a grate (uses A.fire from ch0 if present).
  function grateFire(x, base, sc, blue) {
    if (A.fire) return A.fire(x, base, sc, blue);
    return `<ellipse cx="${x}" cy="${base - 30 * sc}" rx="${60 * sc}" ry="${70 * sc}" fill="#ff9a3c" opacity=".8"/>`;
  }

  // Four figures walking into a flame; the fourth hand holds an inverted flame (the Founders, as the tapestry truly shows them).
  function foundersWalking(x, y, w, h, opts) {
    opts = opts || {};
    const ink = opts.ink || '#0d0a0a', warm = opts.warm || '#c9863a', cold = opts.cold || '#4fb3bf';
    let s = `<g transform="translate(${x},${y})">`;
    s += `<rect width="${w}" height="${h}" fill="${opts.bg || '#6a4a2c'}"/>`;
    // the flame at the right
    const fx = w * 0.82, fb = h * 0.86;
    for (let i = 0; i < 5; i++) { const dx = (i - 2) * w * 0.035, fh = h * (0.45 + (i % 2) * 0.18 - Math.abs(i - 2) * 0.08); s += `<path d="M${fx + dx - w * 0.04},${fb} C${fx + dx - w * 0.05},${fb - fh * 0.4} ${fx + dx - w * 0.015},${fb - fh * 0.6} ${fx + dx},${fb - fh} C${fx + dx + w * 0.015},${fb - fh * 0.6} ${fx + dx + w * 0.05},${fb - fh * 0.4} ${fx + dx + w * 0.04},${fb} Z" fill="${warm}" opacity=".85"/>`; }
    s += `<circle cx="${fx}" cy="${fb - h * 0.3}" r="${w * 0.2}" fill="${warm}" opacity=".15"/>`;
    // four figures, walking right
    for (let i = 0; i < 4; i++) {
      const px = w * (0.14 + i * 0.16), pb = fb, sc = h / 300;
      s += `<g transform="translate(${px},${pb}) scale(${sc})">`;
      s += `<path d="M-16,0 L-11,-80 L11,-80 L16,0 Z" fill="${ink}"/><circle cx="0" cy="-94" r="13" fill="${ink}"/>`;
      s += `<path d="M10,-72 L34,-52" stroke="${ink}" stroke-width="8" stroke-linecap="round"/>`; // reaching arm
      if (i === 3) s += `<g transform="translate(46,-56) scale(1.4)" style="color:${cold}">${G().shapeInner('Flame', true)}</g>`;
      s += `</g>`;
    }
    // shadows away from the fire
    for (let i = 0; i < 4; i++) { const px = w * (0.14 + i * 0.16); s += `<path d="M${px - 6},${fb} L${px - w * 0.11},${fb + h * 0.06} L${px + 8},${fb} Z" fill="${ink}" opacity=".35"/>`; }
    if (opts.caption !== false) s += `<text x="${w / 2}" y="${h - 8}" text-anchor="middle" fill="rgba(255,240,200,0.5)" font-size="${h * 0.06}" font-family="Cinzel,serif" letter-spacing="4">FOUR</text>`;
    return s + '</g>';
  }
  // The Order's overpaint: a great hall, a fire, one small figure walking in alone.
  function orderPaint(x, y, w, h) {
    let s = `<g transform="translate(${x},${y})"><rect width="${w}" height="${h}" fill="#2a1c14"/>`;
    s += `<path d="M${w * 0.1},${h} L${w * 0.1},${h * 0.35} A${w * 0.4},${h * 0.35} 0 0 1 ${w * 0.9},${h * 0.35} L${w * 0.9},${h} Z" fill="#1c130e"/>`;
    for (let i = 0; i < 6; i++) s += `<rect x="${w * (0.14 + i * 0.13)}" y="${h * 0.3}" width="${w * 0.02}" height="${h * 0.6}" fill="#0f0a08"/>`;
    const fx = w * 0.7, fb = h * 0.86;
    for (let i = 0; i < 3; i++) { const dx = (i - 1) * w * 0.03, fh = h * (0.28 + (i % 2) * 0.1); s += `<path d="M${fx + dx - w * 0.03},${fb} C${fx + dx - w * 0.04},${fb - fh * 0.4} ${fx + dx - w * 0.01},${fb - fh * 0.6} ${fx + dx},${fb - fh} C${fx + dx + w * 0.01},${fb - fh * 0.6} ${fx + dx + w * 0.04},${fb - fh * 0.4} ${fx + dx + w * 0.03},${fb} Z" fill="#b8702e" opacity=".85"/>`; }
    const sc = h / 380;
    s += `<g transform="translate(${w * 0.42},${fb}) scale(${sc})"><path d="M-10,0 L-7,-52 L7,-52 L10,0 Z" fill="#0d0a0a"/><circle cx="0" cy="-62" r="9" fill="#0d0a0a"/></g>`;
    s += `<text x="${w / 2}" y="${h - 8}" text-anchor="middle" fill="rgba(255,240,200,0.35)" font-size="${h * 0.06}" font-family="Cinzel,serif" letter-spacing="4">ONE BORN OF FOUR</text>`;
    return s + '</g>';
  }
  A.ch4 = { foundersWalking, orderPaint, bookcase };

  /* ---------- the Provost's study ---------- */
  A.define('ch4_study', (p) => {
    p = p || {};
    let s = P.sky('#0c0a10', '#1b1410');

    // Marrow's chair

  /* ---------- the false shelf (close-up of the bookcase; shelf 3 holds eight great books) ---------- */
  A.define('ch4_shelf', (p) => {

    // shelves 1,2,4 with small books; shelf 3 is the false one
    const r = A.rng(23); const cols = ['#3a2a22', '#2e2a3a', '#4a2f22', '#2a3a30', '#3d2e2e', '#33302a'];
    [1, 2, 4].forEach(i => { const sy = 60 + i * 180; s += `<rect x="120" y="${sy - 10}" width="1360" height="10" fill="#2c211a"/>`; let bx = 140; while (bx < 1450) { const bw = 16 + Math.floor(r() * 26), bh = 90 + r() * 60; s += `<rect x="${bx}" y="${(sy - 10 - bh).toFixed(0)}" width="${bw}" height="${bh.toFixed(0)}" fill="${cols[Math.floor(r() * cols.length)]}"/>`; bx += bw + 2 + Math.floor(r() * 5); } });
    const sy = 60 + 3 * 180; s += `<rect x="120" y="${sy - 10}" width="1360" height="10" fill="#2c211a"/>`;
    if (p.open) s += `<rect x="150" y="${sy - 170}" width="1300" height="160" fill="#06050a"/><rect x="150" y="${sy - 170}" width="1300" height="160" fill="url(#ch4cab)"/><defs><radialGradient id="ch4cab" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#ffd27a" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient></defs>`;
    const shapes = [['Spike', true], ['Flame', false], ['Hook', true], ['Crown', false], ['Spike', false], ['Hook', false], ['Flame', true], ['Crown', true]];
    const bcol = ['#4a2f22', '#2e2a3a', '#3a3222', '#2a3a30', '#3d2e2e', '#33302a', '#2a2438', '#4a3a24'];
    shapes.forEach(([sh, inv], i) => {

    });

    s += P.fog(560, 340, '#1a120c', 0.35);

  /* ---------- the tapestry, close ---------- */
  A.define('ch4_tapestry', (p) => {
    p = p || {};
    let s = P.sky('#0c0a10', '#1a1410');
    s += `<rect x="0" y="100" width="${W}" height="620" fill="#1a1410"/>`;
    s += `<rect x="160" y="90" width="1280" height="640" fill="#3a2a1a"/>`;

    s += `<rect x="130" y="70" width="1340" height="18" rx="8" fill="#4a3620"/>`;

    s += P.fog(560, 300, '#1a120c', 0.3);

  });

  /* ---------- the oath scroll on the desk ---------- */
  A.define('ch4_scroll', (p) => {
    p = p || {};
    let s = P.sky('#0c0a10', '#1b1410');
    s += `<rect x="0" y="0" width="${W}" height="${H}" fill="#1a1410"/>`;
    s += `<rect x="0" y="380" width="${W}" height="520" fill="#2c1e14"/>`;
    s += `<rect x="0" y="380" width="${W}" height="520" fill="url(#ch4desk)"/><defs><radialGradient id="ch4desk" cx=".5" cy=".3" r=".7"><stop offset="0" stop-color="#ffd27a" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient></defs>`;

    s += `<text x="0" y="-130" text-anchor="middle" fill="#3a2a1a" font-size="34" font-family="Cinzel,serif" letter-spacing="8">THE WARDEN'S OATH</text>`;
    s += `<text x="0" y="-80" text-anchor="middle" fill="#5a4a3a" font-size="22" font-family="Georgia,serif" font-style="italic">sworn to the Chair</text>`;
    // four faint slots in a ring, the inscription above
    s += `<circle cx="0" cy="50" r="90" fill="none" stroke="#8a7a5a" stroke-width="2" opacity=".7"/>`;
    for (let i = 0; i < 4; i++) { const a = (i / 4 * 360 - 90) * Math.PI / 180; s += `<circle cx="${(Math.cos(a) * 90).toFixed(1)}" cy="${(50 + Math.sin(a) * 90).toFixed(1)}" r="20" fill="none" stroke="#8a7a5a" stroke-width="2" opacity=".7"/>`; }
    s += `<g transform="translate(-300,40)" style="color:#5a4a3a" opacity=".8">${[['Spike', false], ['Flame', false], ['Spike', true]].map(([sh, inv], i) => `<g transform="translate(${i * 60},0) scale(1.4)">${G().shapeInner(sh, inv)}</g>`).join('')}<rect x="150" y="-26" width="52" height="52" rx="6" fill="none" stroke="#8a7a5a" stroke-dasharray="6 5"/></g>`;

    s += `<circle cx="800" cy="560" r="420" fill="#ffd27a" opacity=".05"><animate attributeName="opacity" values=".05;.08;.04;.07;.05" dur="2.6s" repeatCount="indefinite"/></circle>`;
    return P.wrap(s);
  });
})();

<script>/* js/art/scenes-ch5.js */
/* Art — Chapter V: The Long Stair, the foundations, the Under-Marches */
(function () {
  'use strict';
  const A = window.VigilArt, P = A.P, W = A.W, H = A.H;
  const COLD = '#4fb3bf', COLD2 = '#a8e6ee';

  /* A cold glow rising from below: the Cold, like an inverted sky. */
  function coldGlow(y, strength, id) {
    const s = strength == null ? 0.5 : strength; const gid = id || 'coldglow';
    return `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${COLD}" stop-opacity="0"/><stop offset="1" stop-color="${COLD}" stop-opacity="${s}"/></linearGradient></defs><rect x="0" y="${y}" width="${W}" height="${H - y}" fill="url(#${gid})"><animate attributeName="opacity" values="1;.8;1;.9;1" dur="5s" repeatCount="indefinite"/></rect>`;
  }
  /* A flight of steps descending from (x,y) to the right/left. */
  function flight(x, y, n, dir, w, h, color) {
    let s = `<g>`;
    for (let i = 0; i < n; i++) { const sx = x + dir * i * w, sy = y + i * h; s += `<rect x="${dir > 0 ? sx : sx - w}" y="${sy}" width="${w}" height="${h + 6}" fill="${color}"/><line x1="${dir > 0 ? sx : sx - w}" y1="${sy}" x2="${dir > 0 ? sx + w : sx}" y2="${sy}" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>`; }
    return s + `</g>`;
  }
  /* A zigzag stair down a shaft: alternating flights with landings. */
  function longStair(x0, y0, flights, color) {
    let s = ''; let x = x0, y = y0, dir = 1;
    for (let f = 0; f < flights; f++) {
      const n = 9, w = 44, h = 22;
      s += flight(x, y, n, dir, w, h, color);
      x += dir * n * w; y += n * h; s += `<rect x="${dir > 0 ? x : x - 120}" y="${y}" width="120" height="30" fill="${color}"/>`; dir = -dir; y += 10;
    }
    return s;
  }
  function torchRow(list, sc) { return list.map(([x, y]) => P.torch(x, y, sc || 0.8)).join(''); }
  function figuresOnStair(base, color) {
    return P.figures([{ x: 640, s: 0.62 }, { x: 700, s: 0.6 }, { x: 760, s: 0.62 }, { x: 820, s: 0.6 }, { x: 900, s: 0.5, color: '#2a2438' }], base, color);
  }

  /* 1. The Long Stair — a shaft of steps going down into blue dark. */
  A.define('ch5_stair', (p) => P.wrap(
    P.sky('#07070d', '#0b1018') +
    `<rect x="300" y="0" width="1000" height="${H}" fill="#0c0b12"/>` +
    `<rect x="300" y="0" width="30" height="${H}" fill="#151320"/><rect x="1270" y="0" width="30" height="${H}" fill="#151320"/>` +
    longStair(340, 120, 3, '#181622') +
    (p && p.broken ? `<rect x="560" y="500" width="480" height="420" fill="#07070d"/><path d="M560,500 L620,540 L600,600 L680,640 L640,720 L720,760 L700,900 L560,900 Z" fill="#0c0b12"/><path d="M1040,500 L980,560 L1010,620 L940,680 L980,740 L920,800 L940,900 L1040,900 Z" fill="#0c0b12"/>${[0, 1, 2, 3, 4, 5].map(i => `<rect x="${620 + i * 60}" y="${700 + (i % 3) * 40}" width="${30 + (i % 2) * 20}" height="18" fill="#1d1a28" transform="rotate(${(i * 23) % 40 - 20} ${640 + i * 60} ${710})"/>`).join('')}` : '') +
    torchRow([[420, 250], [1180, 470], [420, 700]], 0.85) +
    figuresOnStair(560, '#0a0910') +
    coldGlow(560, p && p.broken ? 0.25 : 0.42) +
    P.fog(200, 400, '#1a1a2a', 0.35)
  ));

  /* 2. The foundations — the stair passes the roots of the school: huge blocks and pillar-roots. */
  A.define('ch5_foundations', () => P.wrap(
    P.sky('#06060b', '#0a0f16') +
    `${[0, 1, 2, 3, 4, 5].map(i => { const x = 90 + i * 280, w = 150 + (i % 2) * 60; return `<path d="M${x},0 L${x + w},0 L${x + w + 40},${H} L${x - 40},${H} Z" fill="${i % 2 ? '#100e17' : '#13111c'}"/>${[1, 2, 3, 4, 5, 6].map(j => `<line x1="${x - 40 * (j / 6)}" y1="${j * 150}" x2="${x + w + 40 * (j / 6)}" y2="${j * 150}" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>`).join('')}`; }).join('')}` +
    `<path d="M0,${H} L0,760 C200,700 300,780 500,720 C700,660 900,760 1100,700 C1300,640 1450,740 ${W},700 L${W},${H} Z" fill="#0b0a11"/>` +
    flight(560, 520, 12, 1, 40, 18, '#191724') +
    torchRow([[520, 500], [1080, 720]], 0.8) +
    P.figures([{ x: 700, s: 0.55 }, { x: 760, s: 0.55 }, { x: 820, s: 0.55 }, { x: 880, s: 0.55 }, { x: 960, s: 0.45, color: '#2a2438' }], 700, '#0a0910') +
    `<text x="800" y="120" text-anchor="middle" fill="rgba(233,226,210,0.18)" font-size="26" font-family="Cinzel,serif" letter-spacing="10">THE FOUNDATIONS</text>` +
    coldGlow(640, 0.35, 'coldglow2') + P.fog(300, 400, '#141426', 0.3)
  ));

  /* 3. The Under-Marches — the drowned First Hall, four thrones, the Cold glowing below like an inverted sky. */
  A.define('ch5_marches', () => P.wrap(
    P.sky('#050509', '#081018') +
    // cavern roof
    `<path d="M0,0 L${W},0 L${W},160 C1400,220 1300,120 1100,200 C900,280 700,160 500,220 C300,280 150,180 0,240 Z" fill="#0c0b12"/>` +
    `${[0, 1, 2, 3, 4, 5, 6].map(i => `<path d="M${120 + i * 230},${170 + (i % 3) * 30} l-14,90 l28,0 Z" fill="#0c0b12"/>`).join('')}` +
    // the drowned First Hall: submerged arches on the far shore
    `<g opacity=".9">${[0, 1, 2, 3, 4].map(i => { const x = 420 + i * 190; return `<path d="M${x - 60},640 L${x - 60},480 A60,60 0 0 1 ${x + 60},480 L${x + 60},640 Z" fill="#101322" stroke="${COLD}" stroke-opacity=".25" stroke-width="2"/>`; }).join('')}<rect x="340" y="420" width="920" height="30" fill="#101322"/></g>` +
    // four thrones on a ledge
    `<g>${[0, 1, 2, 3].map(i => { const x = 560 + i * 160; return `<rect x="${x - 34}" y="560" width="68" height="90" rx="4" fill="#0a0a12" stroke="${COLD}" stroke-opacity=".35" stroke-width="2"/><path d="M${x - 34},560 L${x - 34},520 L${x - 10},540 L${x},500 L${x + 10},540 L${x + 34},520 L${x + 34},560 Z" fill="#0a0a12" stroke="${COLD}" stroke-opacity=".35" stroke-width="2"/>`; }).join('')}<rect x="480" y="650" width="640" height="18" fill="#0d0d16"/></g>` +
    P.water(668, '#0a1a24', 31) +
    `<g opacity=".55">${[0, 1, 2, 3, 4].map(i => { const x = 420 + i * 190; return `<path d="M${x - 60},700 L${x - 60},800 A60,60 0 0 0 ${x + 60},800 L${x + 60},700 Z" fill="#0f1a26"/>`; }).join('')}</g>` +
    `<defs><radialGradient id="coldsun" cx=".5" cy="1" r=".7"><stop offset="0" stop-color="${COLD2}" stop-opacity=".9"/><stop offset=".4" stop-color="${COLD}" stop-opacity=".45"/><stop offset="1" stop-color="${COLD}" stop-opacity="0"/></radialGradient></defs><rect x="0" y="600" width="${W}" height="300" fill="url(#coldsun)"><animate attributeName="opacity" values="1;.75;1;.85;1" dur="6s" repeatCount="indefinite"/></rect>` +
    P.stars(40, 17, 160).replace(/#e8ecff/g, COLD2) +
    P.figures([{ x: 180, s: 0.7 }, { x: 240, s: 0.7 }, { x: 300, s: 0.7 }, { x: 360, s: 0.7 }, { x: 440, s: 0.6, color: '#2a2438' }], 760, '#07070c') +
    `<text x="800" y="110" text-anchor="middle" fill="rgba(168,230,238,0.35)" font-size="24" font-family="Cinzel,serif" letter-spacing="10">THE UNDER-MARCHES</text>` +
    P.fog(360, 300, '#0e1a28', 0.35)
  ));

  /* 4. A gate on the stair. params: { n: 1|2|3, cold: 0..1 } */
  A.define('ch5_gate', (p) => {
    const n = (p && p.n) || 1; const cold = p && p.cold != null ? p.cold : 0.4;
    const shapes = n === 1 ? [['Crown', false], ['Hook', false], ['Spike', false]] : n === 2 ? [['Crown', false], ['Flame', false], ['Flame', true], ['Hook', false], ['Spike', true]] : [['Flame', false], ['Spike', false], ['Spike', true]];
    const G = window.VigilGlyphs; const cell = 110; const x0 = 800 - (shapes.length - 1) * cell / 2;
    return P.wrap(
      P.sky('#07070d', '#0a1016') +
      `<rect x="200" y="0" width="1200" height="${H}" fill="#0d0c13"/>` +
      P.door(800, 300, 300, 520, '#1c1926', n === 2 ? null : COLD) +
      `<rect x="470" y="200" width="660" height="110" rx="6" fill="#171420" stroke="#2c2738" stroke-width="4"/>` +
      `<g opacity=".8">${shapes.map(([sh, inv], i) => `<g transform="translate(${x0 + i * cell},255) scale(1.8)" style="color:#7a6a5a">${G.shapeInner(sh, inv)}</g>`).join('')}</g>` +
      (n === 2 ? `<g>${[0, 1, 2, 3, 4].map(i => `<g transform="translate(${470 + 66 + i * 132},130)"><path d="M-22,10 L-22,0 Q-22,-26 0,-28 Q22,-26 22,0 L22,10 Z" fill="#241f2e" stroke="#3a3346" stroke-width="2"/><circle cy="16" r="4" fill="#3a3346"/></g>`).join('')}</g>` : '') +
      `<circle cx="800" cy="720" r="120" fill="${COLD}" opacity=".08"><animate attributeName="opacity" values=".08;.16;.08" dur="1.1s" repeatCount="indefinite"/></circle>` +
      torchRow([[360, 420], [1240, 420]], 0.9) +
      P.floorTiles(760, '#0b0a11', 'rgba(255,255,255,0.04)') +
      coldGlow(700, cold, 'coldglow3') + P.fog(560, 300, '#141426', 0.35)
    );
  });

  /* 5. Soldiers on the stair above — torches coming down. */
  A.define('ch5_soldiers', () => P.wrap(
    P.sky('#07070d', '#0b1018') +
    `<rect x="300" y="0" width="1000" height="${H}" fill="#0c0b12"/>` +
    longStair(340, -80, 3, '#181622') +
    `<g>${[[420, 40], [600, 80], [760, 130], [900, 170], [1060, 220], [1180, 260], [1000, 330], [820, 380], [660, 430]].map(([x, y], i) => `<g transform="translate(${x},${y})"><path d="M-10,0 L-8,-44 L8,-44 L10,0 Z" fill="#050508"/><circle cy="-52" r="8" fill="#050508"/><ellipse cx="14" cy="-70" rx="7" ry="12" fill="#ff9a3c" opacity=".9"><animate attributeName="ry" values="12;15;11;13;12" dur="${(0.6 + i * 0.07).toFixed(2)}s" repeatCount="indefinite"/></ellipse><circle cx="14" cy="-70" r="46" fill="#ff9a3c" opacity=".1"/></g>`).join('')}</g>` +
    figuresOnStair(700, '#0a0910') +
    coldGlow(600, 0.3, 'coldglow4') + P.fog(300, 400, '#1a1a2a', 0.3) +
    `<rect x="0" y="0" width="${W}" height="${H}" fill="#ff9a3c" opacity=".05"><animate attributeName="opacity" values=".05;.1;.04;.08;.05" dur="1.4s" repeatCount="indefinite"/></rect>`
  ));
})();

</script>
<script>/* js/art/scenes-ch6.js */
/* Art — Chapter VI, the bell-chamber */
(function () {
  'use strict';
  const A = window.VigilArt, P = A.P, W = A.W, H = A.H;
  const Gl = () => window.VigilGlyphs;
  const STONE = [['Flame', false], ['Flame', true], ['Crown', false], ['Hook', false], ['Spike', false], ['Flame', true], ['Crown', true], ['Hook', true]];
  const COLD = '#4fb3bf';

  /* a Founders' bell hanging from a beam */
  function bell(x, top, h, color, rim, cracked) {
    const w = h * 0.78;
    let s = `<g transform="translate(${x},${top})">`;
    s += `<rect x="-6" y="-40" width="12" height="40" fill="#1a1416"/>`;
    s += `<path d="M${-w * 0.42},${h} L${-w * 0.42},${h * 0.35} C${-w * 0.42},${h * 0.05} ${-w * 0.2},0 0,0 C${w * 0.2},0 ${w * 0.42},${h * 0.05} ${w * 0.42},${h * 0.35} L${w * 0.42},${h} Z" fill="${color}"/>`;
    s += `<path d="M${-w * 0.5},${h} L${w * 0.5},${h} L${w * 0.44},${h + 16} L${-w * 0.44},${h + 16} Z" fill="${rim}"/>`;
    s += `<path d="M${-w * 0.36},${h * 0.32} C${-w * 0.36},${h * 0.12} ${-w * 0.16},${h * 0.06} ${-w * 0.08},${h * 0.06}" fill="none" stroke="rgba(255,200,120,0.25)" stroke-width="3"/>`;
    s += `<circle cx="0" cy="${h + 26}" r="9" fill="${rim}"/>`;
    if (cracked) s += `<path d="M${w * 0.1},${h} L${w * 0.16},${h * 0.7} L${w * 0.08},${h * 0.55} L${w * 0.18},${h * 0.4}" fill="none" stroke="#06050a" stroke-width="4" stroke-linecap="round"/>`;
    return s + '</g>';
  }
  /* the iron lid on the chamber floor, seen in perspective */
  function lid(cx, cy, rx, ry, glow) {
    let s = `<g>`;
    s += `<ellipse cx="${cx}" cy="${cy}" rx="${rx + 26}" ry="${ry + 12}" fill="#0a090d"/>`;
    s += `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#1a1719" stroke="#2b262c" stroke-width="6"/>`;
    s += `<ellipse cx="${cx}" cy="${cy}" rx="${rx * 0.72}" ry="${ry * 0.72}" fill="none" stroke="#2b262c" stroke-width="3"/>`;
    for (let i = 0; i < 28; i++) { const a = i / 28 * Math.PI * 2; s += `<circle cx="${(cx + Math.cos(a) * rx * 0.9).toFixed(0)}" cy="${(cy + Math.sin(a) * ry * 0.9).toFixed(0)}" r="5" fill="#332c33"/>`; }
    s += `<line x1="${cx - rx * 0.72}" y1="${cy}" x2="${cx + rx * 0.72}" y2="${cy}" stroke="#2b262c" stroke-width="3"/><line x1="${cx}" y1="${cy - ry * 0.72}" x2="${cx}" y2="${cy + ry * 0.72}" stroke="#2b262c" stroke-width="3"/>`;
    s += `<circle cx="${cx}" cy="${cy}" r="18" fill="#0b0a0e" stroke="#4a3f48" stroke-width="4"/>`;
    if (glow) {
      s += `<ellipse cx="${cx}" cy="${cy}" rx="${rx * 0.72}" ry="${ry * 0.72}" fill="none" stroke="${COLD}" stroke-width="2" opacity=".45"><animate attributeName="opacity" values=".45;.15;.5;.2;.45" dur="3.2s" repeatCount="indefinite"/></ellipse>`;
      s += `<line x1="${cx - rx * 0.72}" y1="${cy}" x2="${cx + rx * 0.72}" y2="${cy}" stroke="${COLD}" stroke-width="1.5" opacity=".5"><animate attributeName="opacity" values=".5;.1;.55;.2;.5" dur="2.6s" repeatCount="indefinite"/></line>`;
      s += `<line x1="${cx}" y1="${cy - ry * 0.72}" x2="${cx}" y2="${cy + ry * 0.72}" stroke="${COLD}" stroke-width="1.5" opacity=".5"><animate attributeName="opacity" values=".2;.5;.15;.55;.2" dur="2.9s" repeatCount="indefinite"/></line>`;
      s += `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${COLD}" opacity=".06"><animate attributeName="opacity" values=".06;.12;.05;.1;.06" dur="2.2s" repeatCount="indefinite"/></ellipse>`;
    }
    return s + '</g>';
  }
  /* the shaft mouth in the ceiling with the far coin of the Hearth */
  function shaftMouth(cx, cy, r) {
    let s = `<g>`;
    s += `<circle cx="${cx}" cy="${cy}" r="${r + 22}" fill="#070609"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="#0b0810"/>`;
    for (let i = 4; i >= 1; i--) s += `<circle cx="${cx}" cy="${cy}" r="${(r * i / 5).toFixed(0)}" fill="none" stroke="rgba(255,154,60,${(0.05 + (5 - i) * 0.05).toFixed(2)})" stroke-width="2"/>`;
    s += `<circle cx="${cx}" cy="${cy}" r="${r * 0.16}" fill="#ff9a3c" opacity=".85"><animate attributeName="opacity" values=".85;.5;.9;.6;.85" dur="2.1s" repeatCount="indefinite"/></circle>`;
    s += `<circle cx="${cx}" cy="${cy}" r="${r * 0.09}" fill="#a8e6ee" opacity=".8"><animate attributeName="r" values="${r * 0.09};${r * 0.12};${r * 0.08};${r * 0.11};${r * 0.09}" dur="1.7s" repeatCount="indefinite"/></circle>`;
    s += `<circle cx="${cx}" cy="${cy}" r="${r * 0.6}" fill="#ff9a3c" opacity=".08"><animate attributeName="opacity" values=".08;.14;.07;.12;.08" dur="2.4s" repeatCount="indefinite"/></circle>`;
    return s + '</g>';
  }
  const cracked = (i) => { try { return i < (window.VigilStore.state.flags.BELLS_CRACKED | 0); } catch (e) { return false; } };

  /* 1. the bell-chamber: four bells on a beam over the lid; the shaft above */
  A.define('ch6_chamber', () => P.wrap(
    P.sky('#06050a', '#14101a') +
    `<rect x="0" y="0" width="${W}" height="${H}" fill="#0c0a12"/>` +
    P.pillars(4, 700, 560, '#0a0810') +
    P.lightBeam(800, 150, 200, 560, '#7a4a22') +
    shaftMouth(800, 120, 110) +
    `<rect x="240" y="250" width="1120" height="34" fill="#1a1416"/><rect x="240" y="284" width="1120" height="8" fill="#0d0a0e"/>` +
    [380, 660, 940, 1220].map((x, i) => bell(x, 292, 210, ['#2d2320', '#2a2426', '#2b2522', '#2c2325'][i], '#3a2f26', cracked(i))).join('') +
    P.floorTiles(690, '#0b0910', 'rgba(255,255,255,0.03)') +
    lid(800, 780, 470, 95, true) +
    P.figures([{ x: 560, s: 0.9 }, { x: 640, s: 0.95 }, { x: 960, s: 0.95 }, { x: 1040, s: 0.9 }, { x: 800, s: 0.8, color: '#1e1626' }], 720, '#141018') +
    P.fog(560, 340, '#1b1626', 0.4)
  ));

  /* 2. up the shaft: the Hearth as a far coin, the underside of the stone above it */
  A.define('ch6_shaft', () => {
    const cx = 800, cy = 420;
    let s = P.sky('#040308', '#0b0912');
    for (let i = 9; i >= 1; i--) { const r = 90 + i * 78; s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,${(0.025 + (9 - i) * 0.008).toFixed(3)})" stroke-width="${10 + i}"/>`; }
    for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2; s += `<line x1="${(cx + Math.cos(a) * 160).toFixed(0)}" y1="${(cy + Math.sin(a) * 160).toFixed(0)}" x2="${(cx + Math.cos(a) * 900).toFixed(0)}" y2="${(cy + Math.sin(a) * 900).toFixed(0)}" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>`; }
    s += `<circle cx="${cx}" cy="${cy}" r="150" fill="#100c14"/>`;
    s += `<circle cx="${cx}" cy="${cy}" r="150" fill="#ff9a3c" opacity=".12"><animate attributeName="opacity" values=".12;.2;.1;.17;.12" dur="2.3s" repeatCount="indefinite"/></circle>`;
    // the stone's underside, foreshortened, above the coin
    s += `<rect x="${cx - 190}" y="${cy - 118}" width="380" height="64" rx="4" fill="#1c1619" stroke="#2f2528" stroke-width="3"/>`;
    s += STONE.map(([sh, inv], i) => `<g transform="translate(${cx - 164 + i * 47},${cy - 86}) scale(0.85)" style="color:#5a4d4a" opacity=".85">${Gl().shapeInner(sh, inv)}</g>`).join('');
    // the fire: a low orange bed with a blue tongue
    s += `<ellipse cx="${cx}" cy="${cy + 40}" rx="120" ry="26" fill="#3a1c0c"/>`;
    s += A.fire ? A.fire(cx, cy + 44, 0.42, false) : '';
    s += A.fire ? A.fire(cx, cy + 44, 0.28, true) : '';
    s += `<circle cx="${cx}" cy="${cy}" r="150" fill="none" stroke="#1c1619" stroke-width="14"/>`;
    s += P.fog(0, 900, '#05040a', 0.35);
    return P.wrap(s);
  });

  /* 3. the lid, close: Marrow kneeling in a ring of chalk, the seal, frost at the rivets, bell-rims above */
  A.define('ch6_lid', () => {
    const cx = 800, cy = 620;
    let s = P.sky('#07060b', '#100d16');
    s += `<rect x="0" y="0" width="${W}" height="${H}" fill="#0b0911"/>`;
    s += P.lightBeam(800, -40, 180, 640, '#7a4a22');
    s += [420, 690, 910, 1180].map((x, i) => `<g transform="translate(${x},-60)">${bell(0, 0, 250, ['#2d2320', '#2a2426', '#2b2522', '#2c2325'][i], '#3a2f26', cracked(i))}</g>`).join('');
    s += P.floorTiles(560, '#0b0910', 'rgba(255,255,255,0.03)');
    s += lid(cx, cy, 620, 150, true);
    // chalk ring and salt
    s += `<ellipse cx="${cx}" cy="${cy}" rx="300" ry="72" fill="none" stroke="rgba(233,226,210,0.5)" stroke-width="3" stroke-dasharray="14 9"/>`;
    s += `<ellipse cx="${cx}" cy="${cy}" rx="240" ry="58" fill="none" stroke="rgba(233,226,210,0.25)" stroke-width="2"/>`;
    // the seal: CROWN
    s += `<g transform="translate(${cx},${cy - 4}) scale(2.2)" style="color:#d4a94e" opacity=".9">${Gl().shapeInner('Crown', false)}</g>`;
    s += `<ellipse cx="${cx}" cy="${cy}" rx="46" ry="14" fill="none" stroke="#d4a94e" stroke-width="2" opacity=".6"/>`;
    // Marrow kneeling (a low silhouette) and Wren standing at the rim
    s += `<g transform="translate(${cx + 110},${cy + 10})"><ellipse cx="0" cy="0" rx="40" ry="10" fill="#000" opacity=".35"/><path d="M-34,0 L-30,-40 L-12,-62 L12,-62 L26,-40 L34,0 Z" fill="#17121a"/><circle cx="0" cy="-74" r="12" fill="#17121a"/></g>`;
    s += P.figures([{ x: cx - 560, s: 0.9 }, { x: cx - 470, s: 0.95 }, { x: cx + 470, s: 0.95 }, { x: cx + 560, s: 0.9 }, { x: cx - 300, s: 0.8, color: '#1e1626' }], cy + 120, '#141018');
    // rope-ring above centre
    s += `<line x1="${cx}" y1="0" x2="${cx}" y2="${cy - 60}" stroke="#1a1416" stroke-width="5"/>`;
    s += P.fog(420, 300, '#1b1626', 0.35);
    return P.wrap(s);
  });

  /* 4. the stone seen from below: the slab, the eight shapes, the fire lower than ever and the foot bare */
  A.define('ch6_stonefoot', () => {
    let s = P.sky('#05040a', '#12101a');
    s += `<rect x="0" y="0" width="${W}" height="${H}" fill="#0a0912"/>`;
    for (let i = 6; i >= 1; i--) s += `<rect x="${200 - i * 30}" y="${40 - i * 6}" width="${1200 + i * 60}" height="${520 + i * 12}" rx="10" fill="none" stroke="rgba(255,255,255,${(0.02 + (6 - i) * 0.008).toFixed(3)})" stroke-width="6"/>`;
    // the slab, foreshortened from below (wider at the bottom)
    s += `<path d="M300,120 L1300,120 L1380,540 L220,540 Z" fill="#1c1619" stroke="#33282b" stroke-width="5"/>`;
    s += `<path d="M330,150 L1270,150 L1335,515 L265,515 Z" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>`;
    s += STONE.map(([sh, inv], i) => `<g transform="translate(${400 + i * 114},330) scale(2.6)" style="color:#8a7a70" opacity=".92">${Gl().shapeInner(sh, inv)}</g>`).join('');
    // the foot: bare, lit from below in cold light
    s += `<rect x="220" y="540" width="1160" height="26" fill="#23191c"/>`;
    s += `<rect x="220" y="540" width="1160" height="26" fill="${COLD}" opacity=".18"><animate attributeName="opacity" values=".18;.3;.14;.26;.18" dur="2.4s" repeatCount="indefinite"/></rect>`;
    // the fire: an orange bed, very low, and a blue tongue; white flare
    s += `<ellipse cx="800" cy="820" rx="380" ry="46" fill="#2a160c"/>`;
    s += A.fire ? A.fire(800, 830, 0.55, false) : '';
    s += A.fire ? A.fire(800, 830, 0.38, true) : '';
    s += `<ellipse cx="800" cy="700" rx="700" ry="200" fill="${COLD}" opacity=".06"><animate attributeName="opacity" values=".06;.11;.05;.09;.06" dur="3s" repeatCount="indefinite"/></ellipse>`;
    s += P.fog(560, 260, '#0d0b14', 0.45);
    return P.wrap(s);
  });
})();

</script>
<script>/* js/art/scenes-ch7.js */
/* Art — Finale: the bell-chamber's edge, the floor-ring, the cold hearth, the walk, the white. */
(function () {
  'use strict';
  const A = window.VigilArt, P = A.P, W = A.W, H = A.H;
  const G = () => window.VigilGlyphs;

  /* the Cold under the lid: a cold-blue glow rising through the seams of the floor */
  function coldFloor(y, strength) {
    const s = strength == null ? 0.35 : strength;
    let out = `<defs><linearGradient id="ch7cold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fb3bf" stop-opacity="0"/><stop offset="1" stop-color="#4fb3bf" stop-opacity="${s}"/></linearGradient></defs>`;
    out += `<rect x="0" y="${y}" width="${W}" height="${H - y}" fill="url(#ch7cold)"/>`;
    for (let i = -5; i <= 5; i++) out += `<line x1="${W / 2 + i * 90}" y1="${y}" x2="${W / 2 + i * 300}" y2="${H}" stroke="#4fb3bf" stroke-width="2" opacity="${(s * 0.5).toFixed(2)}"><animate attributeName="opacity" values="${(s * 0.3).toFixed(2)};${(s * 0.7).toFixed(2)};${(s * 0.3).toFixed(2)}" dur="${(3 + Math.abs(i) * 0.4).toFixed(1)}s" repeatCount="indefinite"/></line>`;
    return out;
  }
  /* the four Founders' bells hanging above */
  function bells(y) {
    return [0, 1, 2, 3].map(i => { const x = 560 + i * 160; return `<g transform="translate(${x},${y})"><line x1="0" y1="-160" x2="0" y2="-70" stroke="#1b1720" stroke-width="6"/><path d="M-46,0 L-46,-40 Q-46,-74 0,-76 Q46,-74 46,-40 L46,0 Z" fill="#1b1720" stroke="#3a3040" stroke-width="2"/><circle cx="0" cy="8" r="7" fill="#2a2430"/></g>`; }).join('');
  }
  /* a spark of fire in a stone basin */
  function spark(x, y, scale, blue) {
    const sc = scale || 1; const c = blue ? '#4fb3bf' : '#ff9a3c';
    return `<g transform="translate(${x},${y}) scale(${sc})"><ellipse cx="0" cy="8" rx="70" ry="14" fill="#15111a"/><circle cx="0" cy="-6" r="140" fill="${c}" opacity=".10"><animate attributeName="opacity" values=".10;.16;.08;.13;.10" dur="1.7s" repeatCount="indefinite"/></circle><path d="M-8,0 C-10,-10 -4,-14 0,-26 C4,-14 10,-10 8,0 Z" fill="${c}" opacity=".95"><animate attributeName="d" values="M-8,0 C-10,-10 -4,-14 0,-26 C4,-14 10,-10 8,0 Z;M-7,0 C-11,-8 -2,-16 2,-30 C5,-13 11,-9 7,0 Z;M-8,0 C-10,-10 -4,-14 0,-26 C4,-14 10,-10 8,0 Z" dur="1.1s" repeatCount="indefinite"/></path><path d="M-4,0 C-5,-6 -2,-9 0,-15 C2,-9 5,-6 4,0 Z" fill="#fff0a0" opacity=".9"/></g>`;
  }
  /* the floor-ring: an ellipse of eight sockets seen from the chamber's edge */
  function floorRing(cx, cy, rx, ry, lit) {
    let s = `<ellipse cx="${cx}" cy="${cy}" rx="${rx + 34}" ry="${ry + 16}" fill="none" stroke="rgba(212,169,78,${lit ? 0.5 : 0.25})" stroke-width="3"/>`;
    s += `<ellipse cx="${cx}" cy="${cy}" rx="${rx - 34}" ry="${ry - 16}" fill="none" stroke="rgba(212,169,78,${lit ? 0.35 : 0.18})" stroke-width="2"/>`;
    for (let i = 0; i < 8; i++) { const a = (i / 8 * 360 - 90) * Math.PI / 180; const x = cx + Math.cos(a) * rx, y = cy + Math.sin(a) * ry; s += `<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="26" ry="12" fill="#0b0910" stroke="rgba(212,169,78,${lit ? 0.7 : 0.4})" stroke-width="2"/>`; if (lit && i !== 4) s += `<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="12" ry="5" fill="#ffd27a" opacity=".6"><animate attributeName="opacity" values=".6;.3;.65;.4;.6" dur="${(1.4 + i * 0.2).toFixed(1)}s" repeatCount="indefinite"/></ellipse>`; }
    return s;
  }
  /* a wall inscription, carved, faint */
  /* hiddenIdx: a soldier's shield stands against that carving (the Hearth never shows what is behind it) */
  function wallCarving(x, y, shapes, scale, color, hiddenIdx) {
    const shield = `<path d="M-16,-22 L16,-22 L16,6 Q16,20 0,26 Q-16,20 -16,6 Z" fill="#2a2632" stroke="#4a4454" stroke-width="2"/><path d="M0,-18 L0,20" stroke="#4a4454" stroke-width="1.5"/>`;
    return `<g transform="translate(${x},${y}) scale(${scale || 1.4})" style="color:${color || '#5a4e5a'}" opacity=".8">${shapes.map((sh, i) => `<g transform="translate(${i * 54},0)">${i === hiddenIdx ? shield : G().shapeInner(sh[0], sh[1])}</g>`).join('')}</g>`;
  }
  const hid = (p, side) => (p && p.shields && p.shields[side]) ? 1 : -1;
  const WEST = [['Spike', false], ['Hook', false], ['Hook', true], ['Crown', true]];
  const EAST = [['Flame', false], ['Crown', true], ['Spike', false], ['Flame', true]];
  /* the four carved figures walking into a flame */
  function carvedFigures(x, y, color) {
    let s = `<g transform="translate(${x},${y})" opacity=".55">`;
    for (let i = 0; i < 4; i++) s += `<g transform="translate(${i * 40},0)"><path d="M-9,0 L-6,-46 L6,-46 L9,0 Z" fill="${color}"/><circle cx="0" cy="-54" r="8" fill="${color}"/></g>`;
    s += `<path d="M170,0 C160,-30 175,-50 180,-80 C185,-50 200,-30 190,0 Z" fill="${color}"/></g>`;
    return s;
  }
  /* guards with spears */
  function guards(x0, base, n, color, dir) {
    let s = '';
    for (let i = 0; i < n; i++) { const x = x0 + i * 62 * (dir || 1); s += `<g transform="translate(${x},${base})"><path d="M-14,0 L-10,-72 L10,-72 L14,0 Z" fill="${color}"/><circle cx="0" cy="-84" r="12" fill="${color}"/><line x1="18" y1="0" x2="22" y2="-150" stroke="${color}" stroke-width="4"/><path d="M19,-150 L26,-172 L30,-148 Z" fill="${color}"/><path d="M-26,-40 a18,26 0 0 1 0,52 Z" fill="#23202a" stroke="${color}" stroke-width="2"/></g>`; }
    return s;
  }

  A.define('ch7_edge', (p) => P.wrap(
    P.sky('#06050b', '#0f0c16') +
    // the shaft above with the far spark of the Hearth
    P.lightBeam(800, 0, 120, 560, '#ff9a3c') +
    `<circle cx="800" cy="26" r="6" fill="#ffd27a"><animate attributeName="opacity" values="1;.4;1;.6;1" dur="1.6s" repeatCount="indefinite"/></circle>` +
    bells(330) +
    // chamber walls with the two inscriptions and the carved figures
    `<rect x="0" y="380" width="260" height="380" fill="#0d0b12"/><rect x="1340" y="380" width="260" height="380" fill="#0d0b12"/>` +
    wallCarving(60, 470, WEST, 1.5, undefined, hid(p, 'west')) + wallCarving(1380, 470, EAST, 1.5, undefined, hid(p, 'east')) +
    carvedFigures(1340, 560, '#8a6a3a') +
    P.floorTiles(720, '#0a0810', 'rgba(255,255,255,0.035)') +
    coldFloor(720, 0.32) +
    floorRing(800, 800, 300, 60, false) +
    spark(800, 780, 1.3, false) +
    // Vane at the right edge, Tarn's guards behind him; Marrow and Wren at the fire; the four between
    `<g transform="translate(1180,790)"><path d="M-18,0 L-12,-116 L12,-116 L18,0 Z" fill="#141018"/><circle cx="0" cy="-130" r="14" fill="#141018"/><path d="M-12,-116 L-14,-40" stroke="#b23a3a" stroke-width="2" opacity=".8"/><path d="M12,-116 L14,-40" stroke="#d4a94e" stroke-width="2" opacity=".6"/></g>` +
    guards(1280, 800, 4, '#101018', 1) +
    (p && p.ally ? '' : `<g transform="translate(1250,730)"><path d="M-14,0 L-10,-80 L10,-80 L14,0 Z" fill="#141018"/><circle cx="0" cy="-92" r="12" fill="#141018"/></g>`) +
    `<g transform="translate(900,800)"><path d="M-16,0 L-12,-104 L12,-104 L16,0 Z" fill="#171320"/><circle cx="0" cy="-118" r="13" fill="#171320"/><path d="M-12,-104 L-10,-30" stroke="#ff9a3c" stroke-width="1.5" opacity=".5"/></g>` +
    `<g transform="translate(850,812)"><path d="M-10,0 L-8,-64 L8,-64 L10,0 Z" fill="#171320"/><circle cx="0" cy="-74" r="10" fill="#171320"/><path d="M8,-64 L10,-30" stroke="#4fb3bf" stroke-width="1.5" opacity=".6"/></g>` +
    P.figures([{ x: 640, s: 0.9 }, { x: 700, s: 0.95 }, { x: 990, s: 0.95 }, { x: 1050, s: 0.9 }], 840, '#12101a') +
    P.fog(600, 300, '#1b1626', 0.35)
  ));

  A.define('ch7_ring', (p) => P.wrap(
    P.sky('#06050b', '#0e0b14') +
    P.lightBeam(800, 0, 80, 480, '#ff9a3c') +
    bells(300) +
    `<rect x="0" y="360" width="300" height="400" fill="#0d0b12"/><rect x="1300" y="360" width="300" height="400" fill="#0d0b12"/>` +
    wallCarving(60, 440, WEST, 1.7, '#6a5c6a', hid(p, 'west')) + wallCarving(1340, 440, EAST, 1.7, '#6a5c6a', hid(p, 'east')) +
    P.floorTiles(700, '#0a0810', 'rgba(255,255,255,0.035)') +
    coldFloor(700, 0.4) +
    floorRing(800, 790, 420, 96, !!(p && p.lit)) +
    spark(800, 770, 1.1, false) +
    `<g transform="translate(800,762)" opacity=".9"><path d="M-9,0 L-7,-60 L7,-60 L9,0 Z" fill="#171320"/><circle cx="0" cy="-70" r="9" fill="#171320"/><path d="M0,-2 L0,-8" stroke="#4fb3bf" stroke-width="2"/></g>` +
    P.fog(560, 300, '#1b1626', 0.3)
