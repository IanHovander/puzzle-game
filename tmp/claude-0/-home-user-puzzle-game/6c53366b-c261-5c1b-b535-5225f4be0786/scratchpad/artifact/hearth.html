<title>Hearthfall</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* Shared theme: The Fourth Vigil */
:root {
  --bg: #0b0a10;
  --bg2: #15121d;
  --panel: rgba(18, 15, 26, 0.82);
  --panel-solid: #16131f;
  --ink: #e9e2d2;
  --ink-dim: #a99f8c;
  --gold: #d4a94e;
  --gold-2: #f2d27a;
  --ember: #ff7a3d;
  --sea: #4fb3bf;
  --violet: #9b7bd8;
  --blood: #b23a3a;
  --moss: #7fae5e;
  --line: rgba(212, 169, 78, 0.35);
  --serif: 'Cormorant Garamond', 'Georgia', serif;
  --display: 'Cinzel', 'Trajan Pro', 'Georgia', serif;
  --hand: 'IM Fell English', 'Cormorant Garamond', serif;
  --shadow: 0 10px 40px rgba(0,0,0,0.55);
  --p1: #e0b04a; --p2: #4fb3bf; --p3: #d96b4a; --p4: #a482e6;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--serif); font-size: 20px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
h1, h2, h3, .display { font-family: var(--display); font-weight: 600; letter-spacing: 0.06em; }
a { color: var(--gold); }
em { font-style: italic; color: var(--gold-2); }
strong { color: var(--gold-2); font-weight: 600; }
.small { font-size: 0.8em; color: var(--ink-dim); }
.rune { font-family: var(--display); letter-spacing: 0.18em; color: var(--sea); }
::selection { background: rgba(212,169,78,0.35); }

.btn {
  font-family: var(--display); font-size: 17px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink); background: linear-gradient(180deg, rgba(212,169,78,0.14), rgba(212,169,78,0.04));
  border: 1px solid var(--line); border-radius: 6px; padding: 12px 22px; cursor: pointer;
  transition: all .18s ease; position: relative; overflow: hidden;
}
.btn:hover, .btn:focus-visible { border-color: var(--gold); color: var(--gold-2); background: linear-gradient(180deg, rgba(212,169,78,0.28), rgba(212,169,78,0.08)); box-shadow: 0 0 22px rgba(212,169,78,0.18); outline: none; }
.btn:active { transform: translateY(1px); }
.btn.primary { border-color: var(--gold); color: #1a1408; background: linear-gradient(180deg, var(--gold-2), var(--gold)); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: rgba(255,255,255,0.15); }
.btn.danger { border-color: var(--blood); color: #f0b0b0; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.small { font-size: 13px; padding: 7px 12px; }

input.field, textarea.field {
  font-family: var(--display); font-size: 22px; letter-spacing: 0.25em; text-transform: uppercase; text-align: center;
  color: var(--gold-2); background: rgba(0,0,0,0.35); border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; width: 100%;
  outline: none; transition: border-color .2s;
}
input.field:focus { border-color: var(--gold); box-shadow: 0 0 18px rgba(212,169,78,0.2); }
input.field.plain { letter-spacing: 0.04em; text-transform: none; font-family: var(--serif); font-size: 20px; }
input.field.wrong { border-color: var(--blood); animation: shake .4s; }

@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px);} to { opacity: 1; transform: none; } }
@keyframes pulse { 0%,100%{ opacity: .7 } 50% { opacity: 1 } }
@keyframes glow { 0%,100% { box-shadow: 0 0 8px rgba(212,169,78,0.2);} 50% { box-shadow: 0 0 28px rgba(212,169,78,0.55);} }
@keyframes spin { to { transform: rotate(360deg);} }
.shake { animation: shake .45s; }

/* toasts, modals */
.toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px); background: var(--panel-solid); border: 1px solid var(--line); color: var(--ink); padding: 12px 22px; border-radius: 8px; opacity: 0; transition: all .35s; z-index: 200; box-shadow: var(--shadow); font-size: 18px; max-width: 80vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.good { border-color: var(--moss); } .toast.bad { border-color: var(--blood); }
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .3s; z-index: 150; }
.modal-back.show { opacity: 1; }
.modal { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 10px; padding: 26px 30px; max-width: min(860px, 92vw); max-height: 88vh; overflow: auto; box-shadow: var(--shadow); transform: translateY(10px); transition: transform .3s; }
.modal-back.show .modal { transform: none; }
.modal-title { margin: 0 0 14px; color: var(--gold); font-size: 22px; }
.modal-close { margin-top: 18px; }
#fx-overlay { position: fixed; inset: 0; z-index: 300; opacity: 0; pointer-events: none; }

/* countdown */
.countdown { position: relative; height: 10px; background: rgba(255,255,255,0.08); border-radius: 5px; overflow: hidden; margin: 10px 0 4px; border: 1px solid rgba(255,255,255,0.08); }
.countdown-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--ember)); transition: width .1s linear; }
.countdown.urgent .countdown-fill { background: linear-gradient(90deg, var(--blood), var(--ember)); }
.countdown-num { position: absolute; right: 8px; top: -26px; font-family: var(--display); color: var(--gold-2); font-size: 16px; }
.countdown.urgent .countdown-num { color: #ff8b8b; animation: pulse .5s infinite; }

/* flowchart */
.flowchart-wrap { overflow-x: auto; padding: 8px 0; }
.flowchart { color: var(--gold); max-width: 100%; height: auto; }
.fc-edge { fill: none; stroke: rgba(255,255,255,0.15); stroke-width: 1.5; color: rgba(255,255,255,0.2); }
.fc-edge.on { stroke: var(--gold); color: var(--gold); stroke-width: 2.2; filter: drop-shadow(0 0 4px rgba(212,169,78,0.6)); }
.fc-node rect, .fc-node path { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.18); stroke-width: 1.2; }
.fc-node.on rect, .fc-node.on path { fill: rgba(212,169,78,0.16); stroke: var(--gold); }
.fc-node.end.on rect { fill: rgba(159,123,216,0.25); stroke: var(--violet); }
.fc-node text { fill: rgba(233,226,210,0.45); font-family: var(--serif); font-size: 12.5px; }
.fc-node.on text { fill: var(--ink); }
.fc-node.choice text { font-size: 11.5px; }

/* pads for 4-key input */
.pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px; }
.pad { font-family: var(--display); background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 12px 6px; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all .12s; user-select: none; touch-action: manipulation; }
.pad .pad-name { font-size: 13px; letter-spacing: 0.08em; opacity: .8; }
.pad .pad-key { font-size: 30px; font-weight: 700; }
.pad-0 { border-color: var(--p1); } .pad-1 { border-color: var(--p2); } .pad-2 { border-color: var(--p3); } .pad-3 { border-color: var(--p4); }
.pad-0 .pad-key { color: var(--p1); } .pad-1 .pad-key { color: var(--p2); } .pad-2 .pad-key { color: var(--p3); } .pad-3 .pad-key { color: var(--p4); }
.pad.hit, .pad.glow { background: rgba(255,255,255,0.18); transform: scale(1.04); }
.pad.armed { animation: glow 1s infinite; }
.pad.good { background: rgba(127,174,94,0.35); } .pad.bad { background: rgba(178,58,58,0.35); }

.spinner { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.15); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }

</style>

<style>
/* Hearth (main screen) layout */
#app { position: relative; height: 100vh; width: 100vw; display: grid; grid-template-rows: 52px 1fr; overflow: hidden; }

/* stage / art */
#stage { position: absolute; inset: 0; z-index: 0; overflow: hidden; background: radial-gradient(1200px 700px at 50% 30%, #1a1626 0%, var(--bg) 70%); }
.art-layer { position: absolute; inset: 0; opacity: 0; transition: opacity 1.3s ease; }
.art-layer.in { opacity: 1; }
.art-layer.out { opacity: 0 !important; }

#fx { position: absolute; inset: 0; z-index: 1; pointer-events: none; width: 100%; height: 100%; }
#vignette { position: absolute; inset: 0; z-index: 2; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.65) 100%); }

/* top bar */
#bar { position: relative; z-index: 10; display: flex; align-items: center; gap: 16px; padding: 0 18px; background: linear-gradient(180deg, rgba(0,0,0,0.75), rgba(0,0,0,0)); font-family: var(--display); font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); }
#bar .brand { color: var(--gold); font-weight: 600; }

#bar .spacer { flex: 1; }
#timer { font-variant-numeric: tabular-nums; color: var(--ink); }
.iconbtn { background: none; border: 1px solid transparent; color: var(--ink-dim); font-family: var(--display); font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; padding: 6px 10px; border-radius: 6px; transition: all .15s; }
.iconbtn:hover { color: var(--gold-2); border-color: var(--line); }
.iconbtn.attention { color: var(--gold-2); animation: pulse 1.2s infinite; border-color: var(--line); }
.hidden { display: none !important; }

/* main panel */
#panel { position: relative; z-index: 5; display: grid; grid-template-columns: minmax(340px, 560px) 1fr; gap: 20px; padding: 10px 28px 26px; height: 100%; min-height: 0; align-items: end; }
#text { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px 28px; max-height: calc(100vh - 120px); overflow-y: auto; backdrop-filter: blur(8px); box-shadow: var(--shadow); font-size: 21px; cursor: default; scrollbar-width: thin; scrollbar-color: rgba(212,169,78,.4) transparent; }
#text.narrow { font-size: 18px; max-height: 44vh; }
#text .para { margin: 0 0 14px; animation: fadeUp .4s ease both; }
#text .para:last-child { margin-bottom: 0; }
#text .speech { padding-left: 14px; border-left: 2px solid var(--line); }
#text .speaker { display: block; font-family: var(--display); font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); margin-bottom: 2px; }
#text .scene-title { margin: 0 0 12px; font-size: 22px; color: var(--gold); }
#text .whisper { color: var(--sea); font-style: italic; }
#text .omen { color: var(--violet); font-family: var(--hand); }
#text .letter { font-family: var(--hand); color: #d9cba8; background: rgba(255,240,200,0.05); padding: 10px 14px; border-radius: 4px; }
#text .center { text-align: center; }
#text .big { font-family: var(--display); font-size: 28px; text-align: center; color: var(--gold-2); letter-spacing: 0.1em; }

#right { display: flex; flex-direction: column; gap: 14px; min-height: 0; max-height: calc(100vh - 120px); justify-content: flex-end; }
#widget { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px; backdrop-filter: blur(8px); box-shadow: var(--shadow); overflow: auto; min-height: 0; flex: 1 1 auto; scrollbar-width: thin; }
#widget .widget-inner { min-height: 100%; }
#actions { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
#actions .prompt { font-size: 20px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 18px; backdrop-filter: blur(6px); }
#actions .btn.primary { align-self: flex-end; min-width: 200px; }
#actions > .btn:not(.choice) { align-self: flex-end; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.btn.choice { text-transform: none; font-family: var(--serif); font-size: 20px; letter-spacing: 0; text-align: left; display: flex; gap: 14px; align-items: baseline; padding: 12px 18px; background: var(--panel); backdrop-filter: blur(6px); flex-wrap: wrap; }
.btn.choice .choice-num { font-family: var(--display); color: var(--gold); font-size: 14px; min-width: 16px; }
.btn.choice .choice-sub { flex-basis: 100%; padding-left: 30px; font-size: 15px; color: var(--ink-dim); font-style: italic; }
.btn.choice.dark { border-color: rgba(178,58,58,0.5); }
.btn.choice.dark:hover { border-color: var(--blood); }
.btn.choice.bright { border-color: rgba(79,179,191,0.5); }
.timer-note { font-family: var(--display); font-size: 14px; letter-spacing: 0.12em; color: var(--ember); text-transform: uppercase; }

/* attunement code display */
.attune { background: var(--panel); border: 1px solid var(--gold); border-radius: 12px; padding: 22px 28px; text-align: center; backdrop-filter: blur(8px); box-shadow: 0 0 40px rgba(212,169,78,0.15); animation: fadeUp .5s ease both; }
.attune-label { font-family: var(--display); font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-dim); }
.attune-word { font-family: var(--display); font-size: 64px; letter-spacing: 0.35em; color: var(--gold-2); text-shadow: 0 0 30px rgba(242,210,122,0.5); margin: 8px 0 4px; padding-left: 0.35em; }
.attune-sub { color: var(--ink-dim); font-size: 17px; }

/* token entry */
.token-entry { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
.token-row { display: flex; flex-direction: column; gap: 6px; }
.token-row label { font-family: var(--display); font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); }
.token-row.p0 label { color: var(--p1);} .token-row.p1 label { color: var(--p2);} .token-row.p2 label { color: var(--p3);} .token-row.p3 label { color: var(--p4);}
.token-entry .field { font-size: 26px; }

/* hints */
.hints .hint { padding: 10px 14px; border-left: 2px solid var(--line); margin: 8px 0; font-size: 18px; animation: fadeUp .3s ease both; }
.hints .hint.solution { border-color: var(--blood); }
.hints .hint-n { display: block; font-family: var(--display); font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); }
.hint-btn { margin-top: 8px; }

/* flowchart panel */
.flow-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; backdrop-filter: blur(8px); max-height: calc(100vh - 220px); overflow: auto; }
.flow-title { margin: 0 0 6px; font-size: 16px; color: var(--gold); }
.flow-stats { font-size: 16px; color: var(--ink-dim); margin-top: 6px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.pname { font-family: var(--display); }
.pname.p0 { color: var(--p1);} .pname.p1 { color: var(--p2);} .pname.p2 { color: var(--p3);} .pname.p3 { color: var(--p4);}
.chapter-list { display: flex; flex-direction: column; gap: 8px; }
.qr-box { text-align: center; } .qr svg { width: 260px; height: 260px; background: #fff; padding: 8px; border-radius: 6px; }
.qr-url { font-family: monospace; font-size: 15px; word-break: break-all; color: var(--ink-dim); }
code { font-family: ui-monospace, monospace; font-size: 0.85em; color: var(--sea); }

/* title screen */
#title { position: relative; z-index: 20; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 20px; }
#title h1 { font-size: clamp(42px, 7vw, 84px); margin: 0; color: var(--gold-2); text-shadow: 0 0 40px rgba(212,169,78,0.35), 0 4px 30px rgba(0,0,0,0.7); font-weight: 700; letter-spacing: 0.12em; animation: fadeUp 1.6s ease both; }
#title .tagline { font-family: var(--hand); font-style: italic; font-size: 24px; color: var(--ink-dim); margin: -6px 0 10px; animation: fadeUp 1.6s .4s ease both; }
#title .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px 30px; backdrop-filter: blur(8px); box-shadow: var(--shadow); max-width: 760px; width: 100%; animation: fadeUp 1s .7s ease both; }
#title .names { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 10px 0 14px; }
#title .names label { display: flex; flex-direction: column; gap: 6px; font-family: var(--display); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
#title .names label.p0 { color: var(--p1);} #title .names label.p1 { color: var(--p2);} #title .names label.p2 { color: var(--p3);} #title .names label.p3 { color: var(--p4);}
#title .names input { font-size: 18px; }
#title .keys { font-size: 15px; color: var(--ink-dim); }

@media (max-width: 900px) {

  #panel { grid-template-columns: 1fr; align-items: stretch; overflow: auto; }
  #text { max-height: 40vh; font-size: 18px; }
  #title .names { grid-template-columns: 1fr 1fr; }
  .attune-word { font-size: 42px; }
}

.attune-cast { color: var(--sea); letter-spacing: 0.2em; margin-left: 0.15em; }
.attune-roles { margin-top: 10px; font-size: 17px; color: var(--ink); }
#flame { display: inline-flex; align-items: center; gap: 8px; }
#flame .flame-bar { width: 90px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
#flame .flame-bar > div { height: 100%; background: linear-gradient(90deg, #4fb3bf, var(--ember), #ffd27a); transition: width 1s; }
#title .names label { gap: 3px; }
#title .names .seat-nick { font-family: var(--hand); font-style: italic; text-transform: none; letter-spacing: 0; font-size: 17px; color: var(--ink); }

#midnight { font-family: var(--display); color: var(--ember); letter-spacing: .12em; font-variant-numeric: tabular-nums; margin-right: 10px; }
#midnight.urgent { color: #ff8b8b; animation: pulse .6s infinite; }

.map-box { min-width: min(900px, 88vw); }
.night-map { width: 100%; height: auto; display: block; }
.modal.wide { max-width: min(980px, 94vw); }

</style>

<style>

.pz-title { font-family: var(--display); font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
.pz-note { font-size: 16px; color: var(--ink-dim); }

.pz-row.right { justify-content: flex-end; }
.pz-status { font-family: var(--display); font-size: 14px; letter-spacing: 0.1em; color: var(--ink-dim); min-height: 20px; }
.pz-status.bad { color: #ff8b8b; } .pz-status.good { color: var(--moss); }

.wheel .slot text.lbl { fill: var(--ink-dim); font-family: var(--display); font-size: 11px; letter-spacing: .08em; }
.wheel .slot.dim { opacity: .35; }
.wheel .hub { fill: rgba(0,0,0,0.5); stroke: var(--line); }
.wheel .hub-text { fill: var(--gold); font-family: var(--display); font-size: 14px; letter-spacing: .12em; }
.wheel .ring { fill: none; stroke: rgba(212,169,78,0.35); stroke-width: 1; }
.wheel .mark { fill: var(--ember); }
.seq-list { display: flex; gap: 8px; flex-wrap: wrap; min-height: 44px; align-items: center; padding: 8px 12px; background: rgba(0,0,0,0.3); border: 1px dashed rgba(255,255,255,0.15); border-radius: 8px; }
.seq-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; font-family: var(--display); font-size: 13px; letter-spacing: .06em; color: var(--gold-2); background: rgba(212,169,78,0.08); }
.seq-chip svg { width: 22px; height: 22px; }

<script>/* js/core/audio.js */
/* Procedural audio: ambient moods + synthesized SFX. No audio files. */
(function () {
  'use strict';
  const Audio = {};

  let moodLayer = null, moodName = null, sparkleTimer = null;
  let muted = false;

  const NOTE = (n) => 440 * Math.pow(2, (n - 69) / 12); // midi -> hz

  function makeImpulse(seconds, decay) {
    const rate = ctx.sampleRate, len = Math.floor(rate * seconds);
    const buf = ctx.createBuffer(2, len, rate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);

    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return true; }

    master = ctx.createGain(); master.gain.value = muted ? 0 : 0.8;
    dry = ctx.createGain(); dry.gain.value = 0.7;
    wet = ctx.createGain(); wet.gain.value = 0.45;
    convolver = ctx.createConvolver(); convolver.buffer = makeImpulse(3.2, 2.6);

  /* ---------- Moods ---------- */
  // Each mood: root midi note, chord intervals, brightness, movement, sparkle scale

    silence: null,
    hearth:   { root: 45, chord: [0, 7, 12, 16, 19], type: 'sine', bright: 900,  lfo: 0.06, sparkle: [0, 4, 7, 11, 14], sparkleRate: 5.5, gain: 0.16 },
    tower:    { root: 43, chord: [0, 7, 12, 14, 19], type: 'triangle', bright: 700, lfo: 0.05, sparkle: [0, 2, 7, 9, 14], sparkleRate: 6.5, gain: 0.15 },
    wonder:   { root: 48, chord: [0, 4, 7, 11, 14, 21], type: 'sine', bright: 1400, lfo: 0.09, sparkle: [0, 4, 7, 11, 16, 19], sparkleRate: 3.2, gain: 0.15 },
    dread:    { root: 38, chord: [0, 6, 12, 13], type: 'sawtooth', bright: 320, lfo: 0.035, sparkle: [0, 1, 6, 12], sparkleRate: 9, gain: 0.11 },
    tense:    { root: 41, chord: [0, 3, 7, 10, 14], type: 'triangle', bright: 800, lfo: 0.2, sparkle: [0, 3, 5, 10], sparkleRate: 2.4, gain: 0.14 },
    court:    { root: 45, chord: [0, 5, 7, 12, 16], type: 'triangle', bright: 1100, lfo: 0.07, sparkle: [0, 2, 5, 7, 9, 12], sparkleRate: 4.5, gain: 0.14 },
    sorrow:   { root: 43, chord: [0, 3, 7, 10, 15], type: 'sine', bright: 600, lfo: 0.04, sparkle: [0, 3, 7, 10, 12], sparkleRate: 7, gain: 0.14 },
    triumph:  { root: 48, chord: [0, 4, 7, 12, 16, 19], type: 'triangle', bright: 1800, lfo: 0.12, sparkle: [0, 4, 7, 12, 16, 19, 24], sparkleRate: 1.6, gain: 0.17 },
    void:     { root: 36, chord: [0, 12, 19, 24], type: 'sine', bright: 400, lfo: 0.02, sparkle: [0, 7, 12, 19], sparkleRate: 12, gain: 0.13 },

    const n = m.root + 24 + scale[Math.floor(Math.random() * scale.length)] + (Math.random() < 0.3 ? 12 : 0);

  }

    if (!ctx) return;

    const o = ctx.createOscillator(); o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); out(g, 1); o.start(t); o.stop(t + dur + 0.05);
  }

  const SFX = {
    click:   () => { noise(0.05, 0.25, 2500, 'highpass'); tone(1200, 0.06, 0.08, 'sine', 700); },
    tick:    () => { noise(0.03, 0.18, 4000, 'highpass'); },
    hover:   () => { tone(900, 0.04, 0.03, 'sine'); },
    type:    () => { noise(0.02, 0.06, 5000, 'highpass'); },
    open:    () => { noise(0.6, 0.35, 400, 'lowpass'); tone(80, 0.6, 0.35, 'sine', 40); },
    success: () => { [0, 4, 7, 12].forEach((iv, i) => setTimeout(() => bell(NOTE(72 + iv), 0.18, 2.2), i * 110)); },
    solved:  () => { [0, 7, 12, 16, 19, 24].forEach((iv, i) => setTimeout(() => bell(NOTE(64 + iv), 0.16, 3), i * 90)); noise(1.2, 0.2, 800, 'lowpass'); },
    fail:    () => { tone(220, 0.35, 0.2, 'triangle', 110); setTimeout(() => tone(160, 0.5, 0.18, 'triangle', 70), 120); },
    wrong:   () => { tone(180, 0.18, 0.15, 'square', 120); },
    chime:   () => { bell(NOTE(84), 0.16, 3); },
    boom:    () => { tone(60, 1.6, 0.6, 'sine', 28); noise(1.4, 0.5, 200, 'lowpass'); },
    whoosh:  () => { const n = noise(0.8, 0.3, 300, 'bandpass'); if (n) { n.f.frequency.exponentialRampToValueAtTime(3000, ctx.currentTime + 0.7); } },
    heart:   () => { tone(55, 0.14, 0.5, 'sine', 40); setTimeout(() => tone(52, 0.18, 0.4, 'sine', 35), 200); },
    key:     (i) => { bell(NOTE([60, 64, 67, 71][i % 4] + 12), 0.14, 0.9); },
    miss:    () => { noise(0.12, 0.3, 500, 'lowpass'); tone(90, 0.12, 0.25, 'square', 60); },
    alarm:   () => { tone(880, 0.12, 0.12, 'square'); setTimeout(() => tone(880, 0.12, 0.12, 'square'), 200); },
    reveal:  () => { [0, 3, 7, 10, 14, 19].forEach((iv, i) => setTimeout(() => bell(NOTE(55 + iv), 0.14, 4), i * 160)); },
    unlock:  () => { noise(0.25, 0.4, 900, 'bandpass'); setTimeout(() => { tone(600, 0.15, 0.1, 'square'); bell(NOTE(79), 0.1, 1.5); }, 180); },
    step:    () => { noise(0.08, 0.15, 250, 'lowpass'); },
    magic:   () => { for (let i = 0; i < 6; i++) setTimeout(() => bell(NOTE(76 + Math.floor(Math.random() * 12)), 0.06, 1.2), i * 70); },
    seal:    () => { tone(110, 2.5, 0.35, 'sine', 55); [0, 7, 12].forEach((iv, i) => setTimeout(() => bell(NOTE(52 + iv), 0.25, 5), i * 400)); },
  };

  Audio.note = function (midi, dur, vol) { if (!ctx || muted) return; bell(NOTE(midi), vol || 0.15, dur || 1.5); };
  Audio.moods = Object.keys(MOODS);

  window.VigilAudio = Audio;
})();

(function () {
  'use strict';

  const PRESETS = {
    none: null,
    embers: { n: 70, spawn: (p) => { p.x = Math.random() * W; p.y = H + 10; p.vx = (Math.random() - 0.5) * 12; p.vy = -18 - Math.random() * 30; p.life = 6 + Math.random() * 6; p.r = 1 + Math.random() * 2.2; p.hue = 20 + Math.random() * 25; },

    dust: { n: 90, spawn: (p) => { p.x = Math.random() * W; p.y = Math.random() * H; p.vx = (Math.random() - 0.5) * 6; p.vy = -2 - Math.random() * 6; p.life = 10 + Math.random() * 10; p.r = 0.8 + Math.random() * 1.6; },
      draw: (p, a) => { ctx.fillStyle = `rgba(255,236,200,${a * 0.5})`; circle(p.x, p.y, p.r); }, wobble: 10 },
    stars: { n: 140, spawn: (p) => { p.x = Math.random() * W; p.y = Math.random() * H * 0.8; p.vx = 0; p.vy = 0; p.life = 4 + Math.random() * 8; p.r = 0.6 + Math.random() * 1.4; p.tw = Math.random() * 6.28; },

    ash: { n: 110, spawn: (p) => { p.x = Math.random() * W; p.y = -10; p.vx = (Math.random() - 0.5) * 20; p.vy = 12 + Math.random() * 25; p.life = 8 + Math.random() * 8; p.r = 1 + Math.random() * 2.5; },
      draw: (p, a) => { ctx.fillStyle = `rgba(160,150,150,${a * 0.6})`; circle(p.x, p.y, p.r); }, wobble: 30 },
    snow: { n: 120, spawn: (p) => { p.x = Math.random() * W; p.y = -10; p.vx = (Math.random() - 0.5) * 14; p.vy = 18 + Math.random() * 22; p.life = 10 + Math.random() * 8; p.r = 1 + Math.random() * 2.2; },
      draw: (p, a) => { ctx.fillStyle = `rgba(240,245,255,${a * 0.85})`; circle(p.x, p.y, p.r); }, wobble: 24 },
    motes: { n: 60, spawn: (p) => { p.x = Math.random() * W; p.y = Math.random() * H; p.vx = (Math.random() - 0.5) * 10; p.vy = (Math.random() - 0.5) * 10; p.life = 6 + Math.random() * 8; p.r = 1.5 + Math.random() * 2.5; p.hue = 170 + Math.random() * 60; },
      draw: (p, a) => { ctx.fillStyle = `hsla(${p.hue},90%,70%,${a * 0.7})`; circle(p.x, p.y, p.r); ctx.fillStyle = `hsla(${p.hue},90%,80%,${a * 0.15})`; circle(p.x, p.y, p.r * 3.5); }, wobble: 20 },
    void: { n: 80, spawn: (p) => { const ang = Math.random() * 6.28, d = 60 + Math.random() * Math.max(W, H) * 0.6; p.x = W / 2 + Math.cos(ang) * d; p.y = H / 2 + Math.sin(ang) * d; p.vx = -(p.x - W / 2) * 0.05; p.vy = -(p.y - H / 2) * 0.05; p.life = 10 + Math.random() * 6; p.r = 1 + Math.random() * 2; p.hue = 250 + Math.random() * 60; },
      draw: (p, a) => { ctx.fillStyle = `hsla(${p.hue},80%,75%,${a * 0.7})`; circle(p.x, p.y, p.r); }, wobble: 0 },
    rain: { n: 160, spawn: (p) => { p.x = Math.random() * (W + 200) - 100; p.y = -20; p.vx = -60; p.vy = 380 + Math.random() * 200; p.life = 3; p.r = 1; },

/* Game state, save/resume, elapsed timer, flowchart log. */
(function () {
  'use strict';
  const KEY = 'hearthfall.save.v1';
  const Store = {};
  const listeners = [];

  function fresh() {
    return {
      version: 1,
      scene: null,            // current scene id
      chapter: null,          // current chapter id
      flags: {},              // arbitrary key -> value
      choices: {},            // choiceId -> optionId
      tokens: {},             // tokenSlot -> decoded value
      visited: [],            // scene ids in order (for flowchart)
      hintsUsed: {},          // puzzleId -> level reached
      solved: {},             // puzzleId -> true
      names: ['Bookmoth', 'Hush', 'Owl', 'Knot'], // nicknames by seat (Reader, Listener, Seer, Binder)
      keys: ['A', 'C', 'M', '/'],
      elapsedMs: 0,           // accumulated play time (excluding pauses)
      startedAt: null,        // wall-clock of first start
      lastTick: null,
      log: [],                // notable events for epilogue
    };
  }

  Store.state = fresh();

  Store.load = function () {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return false;
      const s = JSON.parse(raw);
      if (!s || s.version !== 1) return false;
      Store.state = Object.assign(fresh(), s);
      return true;
    } catch (e) { return false; }
  };
  Store.hasSave = function () { try { return !!localStorage.getItem(KEY); } catch (e) { return false; } };
  Store.save = function () {
    try { localStorage.setItem(KEY, JSON.stringify(Store.state)); } catch (e) {}
    listeners.forEach(f => { try { f(Store.state); } catch (e) {} });
  };
  Store.reset = function () { Store.state = fresh(); try { localStorage.removeItem(KEY); } catch (e) {} };
  Store.onChange = (f) => listeners.push(f);

  Store.set = function (k, v) { Store.state.flags[k] = v; Store.save(); };
  Store.get = function (k, d) { const v = Store.state.flags[k]; return v === undefined ? d : v; };
  Store.inc = function (k, by) { Store.state.flags[k] = (Store.state.flags[k] || 0) + (by == null ? 1 : by); Store.save(); return Store.state.flags[k]; };
  Store.choose = function (id, opt) { Store.state.choices[id] = opt; Store.save(); };
  Store.chose = function (id, opt) { return opt === undefined ? Store.state.choices[id] : Store.state.choices[id] === opt; };
  Store.markSolved = function (id) { Store.state.solved[id] = true; Store.save(); };
  Store.isSolved = (id) => !!Store.state.solved[id];
  Store.note = function (text) { Store.state.log.push(text); Store.save(); };
  Store.visit = function (sceneId, chapterId) {

  };

  Store.resumeTimer = function () { Store.state.lastTick = Date.now(); ticking = true; };
  Store.elapsed = function () { return Store.state.elapsedMs; };
  Store.elapsedText = function () {
    const s = Math.floor(Store.state.elapsedMs / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  };

  window.VigilStore = Store;
})();

    let el = null, endAt = 0, iv = null, onZero = null, running = false;
    function ensure() { if (!el) { el = UI.el('span', { id: 'midnight', class: 'hidden' }); dom.timer.parentNode.insertBefore(el, dom.timer); } return el; }
    function render() { const left = Math.max(0, endAt - Date.now()); const s = Math.ceil(left / 1000); el.textContent = 'MIDNIGHT ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); el.classList.toggle('urgent', s <= 60); Store.state.flags.MIDNIGHT_LEFT = s; if (left <= 0 && running) { running = false; clearInterval(iv); iv = null; Audio.sfx('boom'); if (onZero) onZero(); } }
    return {
      start: (seconds, cb) => { ensure(); endAt = Date.now() + seconds * 1000; onZero = cb; running = true; el.classList.remove('hidden'); if (iv) clearInterval(iv); iv = setInterval(render, 250); render(); },
      resume: (cb) => { const s = Store.state.flags.MIDNIGHT_LEFT; if (s > 0) Game.clock.start(s, cb); },
      penalty: (seconds) => { if (!running) return; endAt -= seconds * 1000; render(); UI.toast('Midnight comes ' + seconds + ' seconds closer.', 2200, 'bad'); },
      bonus: (seconds) => { if (!running) return; endAt += seconds * 1000; render(); },
      stop: () => { running = false; if (iv) clearInterval(iv); iv = null; if (el) el.classList.add('hidden'); },
      left: () => Math.max(0, Math.ceil((endAt - Date.now()) / 1000)),
      running: () => running,
    };
  })();
  Game.flame = function (level) { const f = document.querySelector('#flame .flame-bar > div'); if (f) f.style.width = Math.round(Math.max(0, Math.min(1, level)) * 100) + '%'; Store.set('FLAME', level); };

  /* ---------- Scene execution ---------- */
  Game.go = async function (id) {
    const scene = typeof id === 'function' ? Game.scenes[id(Store.state)] : Game.scenes[id];
    if (!scene) { console.error('No scene', id); return; }
    const myToken = ++cancelToken;
    if (hintCtl) { hintCtl = null; }
    Input.deactivate();
    currentScene = scene;
    const ch = Game.chapter(Game.sceneChapter[scene.id]);
    Store.visit(scene.id, ch.id);
    setChapterLabel(ch);
    if (scene.mood || ch.mood) Audio.mood(scene.mood || ch.mood);
    if (scene.fx !== undefined || ch.fx !== undefined) FX.set(scene.fx !== undefined ? scene.fx : ch.fx, scene.fxIntensity);
    setArt(scene.art || ch.art || 'blank', typeof scene.artParams === 'function' ? scene.artParams(Store.state) : scene.artParams);
    if (scene.flame != null || ch.flame != null) Game.flame(scene.flame != null ? scene.flame : ch.flame);
    if (scene.enter) { try { scene.enter(Store.state); } catch (e) { console.error(e); } }
    if (scene.sfx) Audio.sfx(scene.sfx);
    dom.hint.classList.toggle('hidden', !(scene.type === 'puzzle' || scene.hints));
    dom.hint.classList.remove('attention');

    UI.clear(dom.text); UI.clear(dom.actions); UI.clear(dom.widget);
    dom.widget.classList.toggle('hidden', scene.type !== 'puzzle' && scene.type !== 'custom' && scene.type !== 'reaction' && scene.type !== 'token');
    dom.text.classList.toggle('narrow', !!(scene.type === 'puzzle' || scene.type === 'custom' || scene.type === 'reaction'));

    const text = typeof scene.text === 'function' ? scene.text(Store.state) : (scene.text || []);
    if (scene.title) dom.text.appendChild(UI.el('h2', { class: 'scene-title', text: scene.title }));
    await UI.typewrite(dom.text, text, { speed: scene.speed });
    if (myToken !== cancelToken) return;

    const api = makeApi(scene, ch, myToken);
    switch (scene.type || 'story') {
      case 'story': return runStory(scene, api);
      case 'choice': return runChoice(scene, api);
      case 'puzzle': return runPuzzle(scene, api);
      case 'reaction': return runPuzzle(scene, api);
      case 'code': return runCode(scene, api, ch);
      case 'token': return runToken(scene, api);
      case 'flow': return runFlow(scene, api, ch);
      case 'custom': return runCustom(scene, api);
      case 'end': return runEnd(scene, api);
    }
  };

  function makeApi(scene, ch, token) {
    return {
      scene, chapter: ch, state: Store.state, store: Store, ui: UI, audio: Audio, fx: FX, input: Input,
      text: dom.text, actions: dom.actions, widget: dom.widget,
      alive: () => token === cancelToken,
      go: (id) => { if (token === cancelToken) Game.go(resolveNext(id, scene)); },
      button: (label, fn, cls) => { const b = UI.el('button', { class: 'btn ' + (cls || ''), text: label, onclick: () => { Audio.sfx('click'); fn(); } }); dom.actions.appendChild(b); return b; },
      note: (t) => Store.note(t),
      say: async (paragraphs) => { await UI.typewrite(dom.text, paragraphs, {}); },
      setHints: (ladder) => { hintCtl = { ladder, id: scene.id }; dom.hint.classList.remove('hidden'); },
      flashArt: (n, p) => setArt(n, p),
    };
  }
  function resolveNext(next, scene) {
    if (next == null) next = scene.next;
    if (typeof next === 'function') next = next(Store.state);
    return next;
  }

  function runStory(scene, api) {
    if (scene.auto) { setTimeout(() => api.go(scene.next), scene.auto); return; }
    api.button(scene.button || 'Continue', () => api.go(scene.next), 'primary');
  }

  async function runChoice(scene, api) {
    const opts = (typeof scene.options === 'function' ? scene.options(Store.state) : scene.options).filter(o => !o.if || o.if(Store.state));
    let ctl = null;
    const holder = UI.el('div', { class: 'choices' });
    if (scene.prompt) dom.actions.appendChild(UI.el('div', { class: 'prompt', html: UI.rich(scene.prompt) }));
    dom.actions.appendChild(holder);
    const pick = (o, how) => {
      if (!api.alive()) return;
      if (ctl) ctl.cancel();
      Array.from(holder.children).forEach(b => b.disabled = true);
      if (scene.choice) Store.choose(scene.choice, o.id);
      if (o.set) for (const k in o.set) Store.set(k, typeof o.set[k] === 'function' ? o.set[k](Store.state) : o.set[k]);
      if (o.note) Store.note(typeof o.note === 'function' ? o.note(Store.state) : o.note);
      if (o.sfx) Audio.sfx(o.sfx);
      Store.save();
      if (o.after) { UI.clear(holder); UI.typewrite(dom.text, typeof o.after === 'function' ? o.after(Store.state) : o.after).then(() => api.button('Continue', () => api.go(o.next), 'primary')); }
      else api.go(o.next);
    };
    opts.forEach((o, i) => {
      const b = UI.el('button', { class: 'btn choice' + (o.cls ? ' ' + o.cls : ''), html: `<span class="choice-num">${i + 1}</span><span>${UI.rich(typeof o.text === 'function' ? o.text(Store.state) : o.text)}</span>`, onclick: () => { Audio.sfx('click'); pick(o, 'click'); } });
      if (o.sub) b.appendChild(UI.el('span', { class: 'choice-sub', html: UI.rich(o.sub) }));
      holder.appendChild(b);
    });
    if (scene.timer) {
      const tw = UI.el('div', { class: 'timer-note', html: UI.rich(scene.timerText || '*Decide quickly.*') });
      dom.actions.insertBefore(tw, holder);
      ctl = UI.countdown(dom.actions, scene.timer);
      const r = await ctl.promise;
      if (r === 'timeout' && api.alive()) {
        Audio.sfx('fail');
        const to = scene.timeout || opts[opts.length - 1];
        const o = typeof to === 'string' ? opts.find(x => x.id === to) || { id: to, next: to } : to;
        if (scene.choice) Store.choose(scene.choice, o.id === undefined ? 'timeout' : o.id);
        Store.set(scene.choice + '_timedout', true);
        pick(Object.assign({}, o, { id: o.id }), 'timeout');
      }
    }
  }

  async function runPuzzle(scene, api) {
    const fn = Game.puzzles[scene.puzzle];
    if (!fn) { dom.widget.appendChild(UI.el('p', { text: 'Missing puzzle: ' + scene.puzzle })); api.button('Skip', () => api.go(scene.next)); return; }
    const cfg = typeof scene.config === 'function' ? scene.config(Store.state) : (scene.config || {});
    if (scene.hints) api.setHints(scene.hints);
    dom.widget.appendChild(UI.el('div', { class: 'widget-inner' }));
    const box = dom.widget.firstChild;
    const pid = scene.puzzleId || scene.id;
    if (Store.isSolved(pid) && !scene.replayable) {
      box.appendChild(UI.el('p', { class: 'para', text: 'This ward has already been opened.' }));
      api.button('Continue', () => api.go(scene.next), 'primary'); return;
    }
    let result;
    const parTimers = [];
    if (scene.par) { const mins = Array.isArray(scene.par) ? scene.par : [scene.par]; mins.forEach((m, i) => parTimers.push(setTimeout(() => { if (!api.alive()) return; dom.hint.classList.add('attention'); UI.toast(i === 0 ? 'The fire stirs. It has something to whisper, if you ask.' : 'The fire dims a little. Ask it.', 3200); Audio.sfx('chime'); }, m * 60000))); }
    try { result = await fn(box, cfg, api); } catch (e) { console.error(e); result = { error: e }; }
    parTimers.forEach(clearTimeout);
    if (!api.alive()) return;
    Store.markSolved(pid);
    if (scene.onSolve) scene.onSolve(Store.state, result);
    if (result && result.set) for (const k in result.set) Store.set(k, result.set[k]);
    Store.save();
    if (scene.solvedText) {
      if (scene.clearWidget) { UI.clear(dom.widget); dom.widget.classList.add('hidden'); dom.text.classList.remove('narrow'); }
      await UI.typewrite(dom.text, typeof scene.solvedText === 'function' ? scene.solvedText(Store.state, result) : scene.solvedText);
      if (!api.alive()) return;
    }
    const next = typeof scene.next === 'function' ? scene.next(Store.state, result) : scene.next;
    if (scene.autoNext) api.go(next); else api.button(scene.button || 'Continue', () => api.go(next), 'primary');
  }

  function runCode(scene, api, ch) {
    const code = scene.code || ch.code;
    let cast = null;
    if (scene.cast) cast = typeof scene.cast === 'function' ? scene.cast(Store.state) : scene.cast;
    else if (!scene.code && window.VigilLore && window.VigilLore.chapter(ch.id) && window.VigilLore.chapter(ch.id).cast.length) {
      const spec = window.VigilLore.chapter(ch.id).cast; cast = window.VigilShared.cast(code, window.VigilShared.pack(spec, Store.state.flags));
    }
    if (cast) Store.state.flags['CAST_' + code] = cast;
    const box = UI.el('div', { class: 'attune' }, [
      UI.el('div', { class: 'attune-label', text: scene.codeLabel || (cast ? 'Word of attunement, and the mark beside it — on every phone' : 'Word of attunement — enter it on every phone') }),
      UI.el('div', { class: 'attune-word', html: UI.esc(code) + (cast ? `<span class="attune-cast">·${UI.esc(cast)}</span>` : '') }),
      UI.el('div', { class: 'attune-sub', html: UI.rich(scene.codeSub || 'Read your Sight. Say nothing. When all four phones have turned the page, continue.') }),
    ]);
    if (scene.roles) box.appendChild(UI.el('div', { class: 'attune-roles', html: UI.rich(typeof scene.roles === 'function' ? scene.roles(Store.state) : scene.roles) }));
    dom.actions.appendChild(box);
    Audio.sfx('unlock');
    if (scene.sightSeconds) { const c = UI.countdown(box, scene.sightSeconds); c.promise.then(() => {}); }
    api.button(scene.button || 'All phones are ready', () => api.go(scene.next), 'primary');
  }

  /* Token entry: scene.slots = [{label, player}] ; scene.decode(token, slotIndex, state) => value|null ; scene.onTokens(values, state) */
  function runToken(scene, api) {
    const slots = typeof scene.slots === 'function' ? scene.slots(Store.state) : scene.slots;
    const box = UI.el('div', { class: 'token-entry' });
    const inputs = [];
    slots.forEach((s, i) => {
      const row = UI.el('div', { class: 'token-row' + (s.player != null ? ' p' + s.player : '') });
      row.appendChild(UI.el('label', { text: s.label }));
      const inp = UI.el('input', { class: 'field token', maxlength: s.length || 6, autocomplete: 'off', spellcheck: 'false', placeholder: '· · · ·' });
      inp.addEventListener('input', () => { inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); inp.classList.remove('wrong'); if (inp.value.length >= (s.length || 6) && inputs[i + 1]) inputs[i + 1].focus(); });
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
      row.appendChild(inp); box.appendChild(row); inputs.push(inp);
    });
    dom.widget.appendChild(box);
    if (scene.prompt) dom.actions.appendChild(UI.el('div', { class: 'prompt', html: UI.rich(scene.prompt) }));
    setTimeout(() => inputs[0] && inputs[0].focus(), 50);
    let tries = 0;
    const submit = () => {
      const values = []; let bad = false;
      inputs.forEach((inp, i) => {
        const v = scene.decode(inp.value.trim().toUpperCase(), i, Store.state);
        if (v == null) { bad = true; inp.classList.add('wrong'); } else values.push(v);
      });
      if (bad) { tries++; Audio.sfx('wrong'); UI.toast(scene.badText || 'One of the words is not attuned. Check the phones and try again.', 2400, 'bad'); if (tries >= 3 && scene.stuckText) UI.toast(scene.stuckText, 5000); return; }
      Audio.sfx('success');
      Store.state.tokens[scene.id] = values; Store.save();
      if (scene.onTokens) scene.onTokens(values, Store.state);
      Store.save();
      UI.clear(dom.actions);
      const next = typeof scene.next === 'function' ? scene.next(Store.state, values) : scene.next;
      api.go(next);
    };
    api.button(scene.button || 'Speak the words', submit, 'primary');
  }

  function runFlow(scene, api, ch) {
    const flow = scene.flow || ch.flow;
    if (flow) {
      const done = new Set(Store.state.visited);
      // allow nodes to declare a predicate
      flow.nodes.forEach(n => { if (n.when && n.when(Store.state)) done.add(n.id); });
      const wrap = UI.el('div', { class: 'flow-panel' });
      wrap.appendChild(UI.el('h3', { class: 'flow-title', text: (scene.flowTitle || (ch.title + ' — the paths you walked')) }));
      wrap.appendChild(UI.flowchart(flow, done));
      const stats = typeof scene.stats === 'function' ? scene.stats(Store.state) : null;
      if (stats) wrap.appendChild(UI.el('div', { class: 'flow-stats', html: UI.rich(stats) }));
      dom.actions.appendChild(wrap);
    }
    api.button(scene.button || 'Onward', () => api.go(scene.next), 'primary');
  }

  async function runCustom(scene, api) {
    const box = UI.el('div', { class: 'widget-inner' }); dom.widget.appendChild(box);
    let next;
    try { next = await scene.run(box, api); } catch (e) { console.error(e); }
    if (!api.alive()) return;
    if (next === false) return; // scene handled navigation itself
    api.go(next || scene.next);
  }

  function runEnd(scene, api) {
    Store.pauseTimer();
    if (scene.render) scene.render(dom.actions, api);
    api.button(scene.button || 'Begin again', () => { Store.reset(); location.reload(); }, 'ghost');
  }

  /* ---------- Hints ---------- */
  Game.showHint = function () {
    const scene = currentScene; if (!scene) return;
    const ladder = (hintCtl && hintCtl.id === scene.id ? hintCtl.ladder : null) || scene.hints;
    if (!ladder) return;
    const id = scene.puzzleId || scene.id;
    const used = Store.state.hintsUsed[id] || 0;
    const wrap = UI.el('div', { class: 'hints' });
    const list = UI.el('div', { class: 'hint-list' });
    const render = () => {
      UI.clear(list);
      const n = Store.state.hintsUsed[id] || 0;
      ladder.forEach((h, i) => {
        const text = typeof h === 'function' ? h(Store.state) : h;
        if (i < n) list.appendChild(UI.el('div', { class: 'hint revealed' + (i === ladder.length - 1 ? ' solution' : ''), html: `<span class="hint-n">${i === ladder.length - 1 ? 'Answer' : 'Hint ' + (i + 1)}</span>${UI.rich(text)}` }));
        else if (i === n) list.appendChild(UI.el('button', { class: 'btn hint-btn' + (i === ladder.length - 1 ? ' danger' : ''), text: i === ladder.length - 1 ? 'Reveal the answer (last resort)' : 'Ask the Vigil for a hint (' + (i + 1) + ' of ' + (ladder.length - 1) + ')', onclick: () => { Store.state.hintsUsed[id] = i + 1; Store.inc('hintsTotal'); Store.save(); Audio.sfx('chime'); render(); } }));
      });
    };
    render();
    wrap.appendChild(UI.el('p', { class: 'small', text: 'Hints cost nothing but pride. The Vigil keeps count.' }));
    wrap.appendChild(list);
    UI.modal(wrap, { title: 'The Vigil whispers', closeText: 'Back to the ward' });
    void used;
  };

  /* ---------- Menu ---------- */
  Game.showMenu = function () {
    const box = UI.el('div', {});
    box.appendChild(UI.el('p', { html: `Elapsed: <strong>${Store.elapsedText()}</strong> · Hints used: <strong>${Store.get('hintsTotal', 0)}</strong>` }));
    const names = Store.state.names.map((n, i) => `<span class="pname p${i}">${UI.esc(n || 'Player ' + (i + 1))}</span> <span class="small">(${Input.keyLabel(i)})</span>`).join(' &nbsp; ');
    box.appendChild(UI.el('p', { html: names }));
    const row = UI.el('div', { class: 'row' });
    row.appendChild(UI.el('button', { class: 'btn small', text: 'Companion QR', onclick: () => { m.close(); Game.showQR(); } }));
    row.appendChild(UI.el('button', { class: 'btn small', text: 'Replay scene', onclick: () => { m.close(); Game.go(currentScene.id); } }));
    row.appendChild(UI.el('button', { class: 'btn small', text: 'Chapter select', onclick: () => { m.close(); Game.showChapterSelect(); } }));
    row.appendChild(UI.el('button', { class: 'btn small danger', text: 'Abandon game', onclick: async () => { if (await UI.confirm('Erase this playthrough and start over?', { danger: true, ok: 'Erase it' })) { Store.reset(); location.reload(); } } }));
    box.appendChild(row);
    const row2 = UI.el('div', { class: 'row' });
    row2.appendChild(UI.el('button', { class: 'btn small ghost', text: 'Copy save code', onclick: () => { const code = btoa(unescape(encodeURIComponent(JSON.stringify(Store.state)))); const ta = UI.el('textarea', { class: 'field plain', style: { height: '90px', fontSize: '12px', letterSpacing: '0', textTransform: 'none' } }); ta.value = code; box.appendChild(UI.el('p', { class: 'small', text: 'Paste this into another laptop\'s menu to continue there (elapsed time carries over).' })); box.appendChild(ta); ta.select(); try { navigator.clipboard.writeText(code); UI.toast('Save code copied.'); } catch (e) {} } }));
    row2.appendChild(UI.el('button', { class: 'btn small ghost', text: 'Paste save code', onclick: async () => { const v = await UI.ask('Paste the save code:', '', { plain: true, ok: 'Load', maxlength: 100000 }); if (!v) return; try { const st = JSON.parse(decodeURIComponent(escape(atob(v.trim())))); if (!st || st.version !== 1) throw new Error('bad'); Store.state = Object.assign(Store.state, st); Store.save(); location.reload(); } catch (e) { UI.notice('That code is not a Hearthfall save.'); } } }));
    box.appendChild(row2);
    const m = UI.modal(box, { title: 'The Hearth' });
  };
  Game.showChapterSelect = function () {
    const box = UI.el('div', { class: 'chapter-list' });
    Game.chapters.forEach(ch => {
      if (ch.hidden) return;
      const reached = Store.state.visited.includes(ch.start);
      box.appendChild(UI.el('button', { class: 'btn small' + (reached ? '' : ' ghost'), text: ch.label ? ch.label + ' — ' + ch.title : ch.title, onclick: () => { m.close(); Game.go(ch.start); } }));
    });
    box.appendChild(UI.el('p', { class: 'small', text: 'Jumping ahead skips story and may leave choices unset. Use to recover from a mistake.' }));
    const m = UI.modal(box, { title: 'Chapters' });
  };
  Game.showQR = function () {
    const url = Game.companionUrl();
    const box = UI.el('div', { class: 'qr-box' });
    if (url) {
      try { const q = qrcode(0, 'M'); q.addData(url); q.make(); box.appendChild(UI.el('div', { class: 'qr', html: q.createSvgTag({ cellSize: 6, margin: 2 }) })); } catch (e) {}
      box.appendChild(UI.el('p', { class: 'qr-url', text: url }));
    } else {
      box.appendChild(UI.el('p', { html: 'This page was opened from a file, so phones cannot reach it. Host the folder (for example <code>python3 -m http.server 8080</code>) and open <code>http://YOUR-LAN-IP:8080/</code> on this screen and <code>.../companion.html</code> on phones. GitHub Pages also works.' }));
    }
    UI.modal(box, { title: 'Companion — open on each phone' });
  };
  Game.companionUrl = function () {
    if (window.COMPANION_URL) return window.COMPANION_URL;
    if (location.protocol === 'file:') return null;
    return new URL('companion.html', location.href).href;
  };

  window.Game = Game;
})();

</script>
<script>/* js/core/map.js */
/* The Map of the Night: a vellum chart that unfolds a panel per chapter; the sheet turns over at the Long Stair. */
(function () {
  'use strict';
  const UI = window.VigilUI, Store = window.VigilStore;
  const PANELS = [
    { id: 'ch0', label: 'The dormitory', icon: '<rect x="-16" y="-6" width="32" height="14" rx="2"/><rect x="-16" y="-14" width="6" height="22" rx="1"/><circle cx="12" cy="-12" r="3"/>' },
    { id: 'ch1', label: 'The Great Hall', icon: '<path d="M-18,12 L-18,-6 L0,-16 L18,-6 L18,12 Z"/><path d="M-8,12 L-8,0 L8,0 L8,12"/>' },
    { id: 'ch2', label: 'The Vault', icon: '<path d="M-14,12 L-14,-4 A14,14 0 0 1 14,-4 L14,12"/><circle cx="0" cy="2" r="4"/>' },
    { id: 'ch3', label: 'The Gallery', icon: '<rect x="-16" y="-10" width="9" height="12"/><rect x="-4" y="-10" width="9" height="12"/><rect x="8" y="-10" width="9" height="12"/><path d="M-18,10 L18,10"/>' },
    { id: 'ch4', label: 'The study', icon: '<rect x="-16" y="-12" width="32" height="6"/><rect x="-16" y="-2" width="32" height="6"/><rect x="-16" y="8" width="32" height="6"/>' },
    { id: 'ch5', label: 'The Long Stair', icon: '<path d="M-16,12 L-16,6 L-8,6 L-8,0 L0,0 L0,-6 L8,-6 L8,-12 L16,-12"/>', turn: true },
    { id: 'ch6', label: 'The bell-chamber', icon: '<path d="M-10,6 L-10,0 Q-10,-12 0,-13 Q10,-12 10,0 L10,6 Z"/><circle cx="0" cy="10" r="2.5"/>' },
    { id: 'ch7', label: 'The Cold', icon: '<circle cx="0" cy="0" r="12"/><path d="M0,-12 L0,12 M-12,0 L12,0" opacity=".5"/>' },
    { id: 'ch8', label: 'Dawn', icon: '<path d="M-16,8 L16,8"/><path d="M-10,8 A10,10 0 0 1 10,8"/><path d="M0,-10 L0,-14 M-9,-6 L-12,-9 M9,-6 L12,-9"/>' },
  ];
  function reached(id) { const ch = window.Game && window.Game.chapter(id); if (!ch) return false; return Store.state.visited.some(v => window.Game.sceneChapter[v] === id); }
  function render() {
    const W = 900, H = 320;
    const over = reached('ch5');
    let s = `<svg viewBox="0 0 ${W} ${H}" class="night-map">`;
    s += `<defs><linearGradient id="vellum" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${over ? '#1a1830' : '#3a2f22'}"/><stop offset="1" stop-color="${over ? '#0d0c1a' : '#241b14'}"/></linearGradient></defs>`;
    s += `<rect x="10" y="20" width="${W - 20}" height="${H - 40}" rx="8" fill="url(#vellum)" stroke="rgba(212,169,78,0.35)"/>`;
    s += `<text x="${W / 2}" y="50" text-anchor="middle" fill="rgba(212,169,78,0.8)" font-family="Cinzel,serif" font-size="16" letter-spacing="4">${over ? 'THE UNDER-MARCHES — the world is a lid' : 'THE MAP OF THE NIGHT — Thornhallow'}</text>`;
    const cols = PANELS.length, pw = (W - 60) / cols; let prev = null;
    PANELS.forEach((p, i) => {
      const x = 30 + i * pw + pw / 2, y = 170; const on = reached(p.id);
      if (prev && on) s += `<path d="M${prev.x},${prev.y} C${prev.x + pw * 0.4},${prev.y + 40} ${x - pw * 0.4},${y - 40} ${x},${y}" fill="none" stroke="var(--gold)" stroke-width="2" opacity=".9"/>`;
      s += `<g transform="translate(${x},${y})" opacity="${on ? 1 : 0.22}">`;
      s += `<rect x="-38" y="-48" width="76" height="96" rx="6" fill="rgba(0,0,0,0.25)" stroke="${on ? 'var(--gold)' : 'rgba(255,255,255,0.15)'}" stroke-dasharray="${on ? '0' : '4 3'}"/>`;
      s += `<g fill="none" stroke="${on ? '#f2d27a' : '#888'}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" transform="scale(1.3)">${p.icon}</g>`;
      s += `<text y="64" text-anchor="middle" fill="${on ? '#e9e2d2' : '#777'}" font-family="Cormorant Garamond,serif" font-size="13">${on ? p.label : '· · ·'}</text>`;

      s += `</g>`;
      if (on) prev = { x, y };
    });
    s += `</svg>`;
    return s;
  }
  window.VigilMap = { render, show: () => { const box = UI.el('div', { class: 'map-box', html: render() }); UI.modal(box, { title: 'The Map of the Night', cls: 'wide' }); } };
})();

<script>/* js/art/art.js */
/* Procedural SVG scene art. Every scene is composed from primitives; deterministic via seeded RNG. */
(function () {
  'use strict';
  const Art = { scenes: {} };
  const W = 1600, H = 900;

  function rng(seed) { let s = seed >>> 0 || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

  /* ---------- primitives ---------- */
  const P = {};
  P.sky = (top, bottom, id) => `<defs><linearGradient id="${id || 'sky'}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bottom}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#${id || 'sky'})"/>`;
  P.stars = (n, seed, maxY) => { const r = rng(seed || 7); let s = '<g class="stars">'; for (let i = 0; i < n; i++) { const x = r() * W, y = r() * (maxY || H * 0.6), rad = 0.5 + r() * 1.6, o = 0.3 + r() * 0.7; s += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${rad.toFixed(1)}" fill="#e8ecff" opacity="${o.toFixed(2)}"><animate attributeName="opacity" values="${o.toFixed(2)};${(o * 0.3).toFixed(2)};${o.toFixed(2)}" dur="${(2 + r() * 5).toFixed(1)}s" repeatCount="indefinite"/></circle>`; } return s + '</g>'; };
  P.moon = (x, y, r, color) => `<defs><radialGradient id="moonglow"><stop offset="0" stop-color="${color || '#fff3d0'}" stop-opacity=".55"/><stop offset="1" stop-color="${color || '#fff3d0'}" stop-opacity="0"/></radialGradient></defs><circle cx="${x}" cy="${y}" r="${r * 4}" fill="url(#moonglow)"/><circle cx="${x}" cy="${y}" r="${r}" fill="${color || '#fff3d0'}"/><circle cx="${x + r * 0.35}" cy="${y - r * 0.2}" r="${r * 0.9}" fill="${color || '#fff3d0'}" opacity="0"/>`;
  P.mountains = (color, seed, base, amp, n) => { const r = rng(seed || 3); let d = `M0,${H} L0,${base}`; const step = W / (n || 10); for (let i = 0; i <= (n || 10); i++) { const x = i * step, y = base - r() * amp; d += ` L${(x - step * 0.5 + r() * step * 0.4).toFixed(0)},${y.toFixed(0)} L${x.toFixed(0)},${(base - r() * amp * 0.3).toFixed(0)}`; } d += ` L${W},${H} Z`; return `<path d="${d}" fill="${color}"/>`; };
  P.fog = (y, h, color, op) => `<defs><linearGradient id="fog${y}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity="0"/><stop offset=".5" stop-color="${color}" stop-opacity="${op || 0.5}"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><rect x="0" y="${y}" width="${W}" height="${h}" fill="url(#fog${y})"/>`;
  P.ground = (y, color) => `<rect x="0" y="${y}" width="${W}" height="${H - y}" fill="${color}"/>`;
  P.tower = (x, base, w, h, color, windows) => {
    let s = `<g class="tower">`;
    s += `<path d="M${x - w / 2},${base} L${x - w / 2 + w * 0.08},${base - h} L${x + w / 2 - w * 0.08},${base - h} L${x + w / 2},${base} Z" fill="${color}"/>`;
    // battlements
    const bw = w * 0.84, bx = x - bw / 2, ty = base - h; const teeth = 7;
    for (let i = 0; i < teeth; i++) if (i % 2 === 0) s += `<rect x="${(bx + i * bw / teeth).toFixed(0)}" y="${ty - w * 0.1}" width="${(bw / teeth).toFixed(0)}" height="${w * 0.1}" fill="${color}"/>`;
    // spire
    s += `<path d="M${x - bw * 0.35},${ty - w * 0.1} L${x},${ty - h * 0.45} L${x + bw * 0.35},${ty - w * 0.1} Z" fill="${color}"/>`;
    if (windows) for (let i = 0; i < windows; i++) { const wy = base - h * (0.2 + i * 0.7 / windows); s += `<path d="M${x - w * 0.05},${wy} a${w * 0.05},${w * 0.06} 0 0 1 ${w * 0.1},0 v${w * 0.12} h-${w * 0.1} Z" fill="#ffd27a" opacity=".85"><animate attributeName="opacity" values=".85;.6;.9;.7;.85" dur="${3 + i}s" repeatCount="indefinite"/></path>`; }
    return s + '</g>';
  };
  P.door = (x, y, w, h, frame, glow) => {
    let s = `<g class="door">`;
    if (glow) s += `<defs><radialGradient id="doorglow" cx=".5" cy=".5"><stop offset="0" stop-color="${glow}" stop-opacity=".9"/><stop offset="1" stop-color="${glow}" stop-opacity="0"/></radialGradient></defs><ellipse cx="${x}" cy="${y + h * 0.4}" rx="${w * 1.6}" ry="${h * 0.9}" fill="url(#doorglow)"><animate attributeName="opacity" values="1;.6;1" dur="4s" repeatCount="indefinite"/></ellipse>`;
    s += `<path d="M${x - w / 2 - 22},${y + h} L${x - w / 2 - 22},${y + w / 2} A${w / 2 + 22},${w / 2 + 22} 0 0 1 ${x + w / 2 + 22},${y + w / 2} L${x + w / 2 + 22},${y + h} Z" fill="${frame}"/>`;
    s += `<path d="M${x - w / 2},${y + h} L${x - w / 2},${y + w / 2} A${w / 2},${w / 2} 0 0 1 ${x + w / 2},${y + w / 2} L${x + w / 2},${y + h} Z" fill="${glow ? glow : '#0a0810'}" opacity="${glow ? 0.35 : 1}"/>`;
    s += `<line x1="${x}" y1="${y + w / 2 + 10}" x2="${x}" y2="${y + h}" stroke="${frame}" stroke-width="4"/>`;
    return s + '</g>';
  };
  P.pillars = (n, y, h, color, seed) => { let s = ''; for (let i = 0; i < n; i++) { const t = (i + 0.5) / n, x = t * W, sc = 0.7 + 0.6 * Math.abs(t - 0.5); s += `<rect x="${(x - 22 * sc).toFixed(0)}" y="${(y - h * sc).toFixed(0)}" width="${(44 * sc).toFixed(0)}" height="${(h * sc).toFixed(0)}" fill="${color}"/><rect x="${(x - 34 * sc).toFixed(0)}" y="${(y - h * sc - 18 * sc).toFixed(0)}" width="${(68 * sc).toFixed(0)}" height="${(18 * sc).toFixed(0)}" fill="${color}"/>`; } return s; };
  P.floorTiles = (y, color, line) => { let s = `<rect x="0" y="${y}" width="${W}" height="${H - y}" fill="${color}"/>`; for (let i = -6; i <= 6; i++) s += `<line x1="${W / 2 + i * 60}" y1="${y}" x2="${W / 2 + i * 260}" y2="${H}" stroke="${line}" stroke-width="1"/>`; for (let j = 0; j < 6; j++) { const yy = y + Math.pow(j / 5, 1.7) * (H - y); s += `<line x1="0" y1="${yy.toFixed(0)}" x2="${W}" y2="${yy.toFixed(0)}" stroke="${line}" stroke-width="1"/>`; } return s; };
  P.torch = (x, y, scale) => { const sc = scale || 1; return `<g transform="translate(${x},${y}) scale(${sc})"><rect x="-4" y="0" width="8" height="60" fill="#3b2a1a"/><ellipse cx="0" cy="-8" rx="10" ry="18" fill="#ff9a3c"><animate attributeName="ry" values="18;22;16;20;18" dur="0.7s" repeatCount="indefinite"/></ellipse><ellipse cx="0" cy="-10" rx="5" ry="10" fill="#fff0a0"/><circle cx="0" cy="-8" r="60" fill="#ff9a3c" opacity=".12"><animate attributeName="opacity" values=".12;.18;.1;.15;.12" dur="0.9s" repeatCount="indefinite"/></circle></g>`; };
  P.trees = (n, base, color, seed, minH, maxH) => { const r = rng(seed || 11); let s = ''; for (let i = 0; i < n; i++) { const x = r() * W, h = (minH || 120) + r() * ((maxH || 300) - (minH || 120)), w = h * 0.35; s += `<path d="M${x},${base - h} L${x + w / 2},${base - h * 0.55} L${x + w * 0.25},${base - h * 0.55} L${x + w * 0.7},${base - h * 0.2} L${x + w * 0.4},${base - h * 0.2} L${x + w},${base} L${x - w},${base} L${x - w * 0.4},${base - h * 0.2} L${x - w * 0.7},${base - h * 0.2} L${x - w * 0.25},${base - h * 0.55} L${x - w / 2},${base - h * 0.55} Z" fill="${color}"/>`; } return s; };
  P.circleRunes = (cx, cy, r, n, color, seed) => { const rr = rng(seed || 5); let s = `<g class="runes"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="2" opacity=".6"/><circle cx="${cx}" cy="${cy}" r="${r * 0.86}" fill="none" stroke="${color}" stroke-width="1" opacity=".4"/>`; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, x = cx + Math.cos(a) * r * 0.93, y = cy + Math.sin(a) * r * 0.93; s += `<g transform="translate(${x.toFixed(0)},${y.toFixed(0)}) rotate(${(a * 180 / Math.PI + 90).toFixed(0)})">${P.rune(Math.floor(rr() * 12), color, 14)}</g>`; } s += `<animateTransform attributeName="transform" type="rotate" from="0 ${cx} ${cy}" to="360 ${cx} ${cy}" dur="240s" repeatCount="indefinite"/></g>`; return s; };
  P.rune = (i, color, size) => { const s = size || 20; const shapes = ['M-1,-1 L0,1 L1,-1', 'M-1,0 L1,0 M0,-1 L0,1', 'M-1,-1 L1,1 M-1,1 L1,-1', 'M0,-1 L1,0 L0,1 L-1,0 Z', 'M-1,-1 L-1,1 L1,1', 'M-1,1 L0,-1 L1,1 M-.5,0 L.5,0', 'M0,-1 L0,1 M-1,-.3 L1,-.3', 'M-1,-1 L1,-1 L-1,1 L1,1', 'M0,-1 L0,1 M-1,0 L0,-1 L1,0', 'M-1,-1 L1,1 L-1,1', 'M-1,0 L1,0 M-.5,-1 L-.5,1 M.5,-1 L.5,1', 'M0,-1 A1,1 0 1 1 0,1 M0,-1 L0,1']; return `<path d="${shapes[i % shapes.length]}" transform="scale(${s / 2})" fill="none" stroke="${color}" stroke-width="${2.2 / (s / 20)}" stroke-linecap="round" stroke-linejoin="round"/>`; };
  P.figures = (list, base, color) => list.map(f => `<g transform="translate(${f.x},${base}) scale(${f.s || 1})"><ellipse cx="0" cy="-8" rx="16" ry="6" fill="#000" opacity=".3"/><path d="M-14,0 L-10,-70 L10,-70 L14,0 Z" fill="${f.color || color}"/><circle cx="0" cy="-82" r="12" fill="${f.color || color}"/></g>`).join('');
  P.vignetteRect = () => `<defs><radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient></defs><rect width="${W}" height="${H}" fill="url(#vig)"/>`;
  P.lightBeam = (x, y, w, h, color) => `<path d="M${x - 20},${y} L${x + 20},${y} L${x + w},${y + h} L${x - w},${y + h} Z" fill="${color}" opacity=".12"><animate attributeName="opacity" values=".12;.2;.12" dur="5s" repeatCount="indefinite"/></path>`;
  P.water = (y, color, seed) => { const r = rng(seed || 9); let s = `<rect x="0" y="${y}" width="${W}" height="${H - y}" fill="${color}"/>`; for (let i = 0; i < 24; i++) { const yy = y + r() * (H - y), x = r() * W, len = 60 + r() * 220; s += `<line x1="${x}" y1="${yy}" x2="${x + len}" y2="${yy}" stroke="#fff" stroke-width="1" opacity=".08"><animate attributeName="opacity" values=".08;.16;.08" dur="${(2 + r() * 3).toFixed(1)}s" repeatCount="indefinite"/></line>`; } return s; };
  P.wrap = (inner, cls) => `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" class="scene ${cls || ''}">${inner}${P.vignetteRect()}</svg>`;
  Art.P = P; Art.W = W; Art.H = H; Art.rng = rng;

  /* ---------- scene registry ---------- */
  Art.define = (name, fn) => { Art.scenes[name] = fn; };
  Art.render = function (name, params) {
    const fn = Art.scenes[name] || Art.scenes.blank;
    try { return fn(params || {}); } catch (e) { console.error('art', name, e); return Art.scenes.blank({}); }
  };
  Art.animate = function () {};

  Art.define('blank', () => P.wrap(P.sky('#15121d', '#0b0a10')));
  Art.define('title', () => P.wrap(
    P.sky('#070812', '#1b1430') + P.stars(220, 21) + P.moon(1330, 128, 40) +
    P.mountains('#0f0d1c', 4, 640, 260, 9) + P.mountains('#0a0913', 5, 720, 200, 12) +
    P.tower(800, 760, 150, 420, '#0d0b16', 5) + P.fog(600, 260, '#2a2140', 0.5) + P.ground(760, '#080711')
  ));

  window.VigilArt = Art;
})();

    `<g transform="translate(60,-290) scale(1.6)" style="color:#7a6a4a" opacity=".7">${window.VigilGlyphs.shapeInner('Crown', true)}</g>` +
    `</g>` +
    P.fog(600, 300, '#241d33', 0.3)
  ));
})();
