<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearthfall</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/hearth.css">
<link rel="stylesheet" href="css/puzzles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%230b0a10' stroke='%23d4a94e' stroke-width='6'/><path d='M50 18 L58 42 L82 42 L62 56 L70 80 L50 66 L30 80 L38 56 L18 42 L42 42 Z' fill='%23d4a94e'/></svg>">
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <canvas id="fx"></canvas>
  <div id="vignette"></div>

  <div id="title">
    <h1>Hearthfall</h1>
    <div class="tagline">One born of four shall walk into the Cold.</div>
    <div class="card">
      <div id="title-body"></div>
    </div>
  </div>

  <div id="bar" class="hidden">
    <span class="brand">Hearthfall</span>
    <span class="sep">·</span>
    <span id="chapter"></span>
    <span class="spacer"></span>
    <span id="flame" title="The Hearth's light"><span class="flame-bar"><div style="width:100%"></div></span></span>
    <span id="timer">00:00</span>
    <button id="hint" class="iconbtn hidden" title="Ask for a hint"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 3l1.8 4.9L18.7 9l-4.9 1.8L12 15.7l-1.8-4.9L5.3 9l4.9-1.1z" fill="currentColor"/></svg><span>Hint</span></button>
    <button id="mapbtn" class="iconbtn" title="The Map of the Night"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 6.5l6-2.5 6 2.5 6-2.5v13L15 19.5 9 17 3 19.5z"/><path d="M9 4v13M15 6.5v13"/></g></svg><span>Map</span></button>
    <button id="qr" class="iconbtn" title="Companion QR code"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="7" height="7"/><rect x="13.5" y="3.5" width="7" height="7"/><rect x="3.5" y="13.5" width="7" height="7"/><rect x="13.5" y="13.5" width="7" height="7"/></g></svg><span>Phones</span></button>
    <button id="mute" class="iconbtn" title="Sound is on"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M15.5 9a4 4 0 010 6" stroke-linecap="round"/><path d="M18 6.5a7.5 7.5 0 010 11" stroke-linecap="round"/></g></svg><span>Sound</span></button>
    <button id="menu" class="iconbtn" title="Menu"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></g></svg><span>Menu</span></button>
  </div>

  <div id="panel" class="hidden">
    <div id="text"></div>
    <div id="right">
      <div id="widget" class="hidden"></div>
      <div id="actions"></div>
    </div>
  </div>
</div>

<script src="vendor/qrcode.js"></script>
<script src="js/core/audio.js"></script>
